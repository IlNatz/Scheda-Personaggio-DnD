6 danni da fuoco ed effettua un tiro salvezza su Costituzione. In caso di fallimento, l\u0027incantesimo permane. In caso di successo, l\u0027incantesimo termina.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** Tutti i danni aumentano di 1d6 per ogni slot di livello superiore al 1º."},{"n":"Punizione splendente","lv":2,"sc":"Trasmutazione di 2º livello (Paladino)","cl":"Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus che l\u0027incantatore effettua subito dopo aver colpito una creatura con un\u0027arma da mischia o con un colpo senz\u0027armi\n**Gittata:** incantatore\n**Componente:** V\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027attacco infligge 2d6 danni radiosi extra al bersaglio. Fino al termine dell\u0027incantesimo, il bersaglio proietta luce intensa in un raggio di 1,5 metri, non può beneficiare della condizione di invisibilità e i tiri per colpire contro di esso dispongono di vantaggio.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d6 per ogni slot di livello superiore al 2º."},{"n":"Purificare cibo e bevande","lv":1,"sc":"Trasmutazione di 1º livello (Chierico, Druido, Paladino)","cl":"Chierico, Druido, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** 3 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore rimuove veleno e marciume da cibi e bevande non magici situati in una sfera del raggio di 1,5 metri centrata su un punto entro gittata."},{"n":"Raggio di affaticamento","lv":2,"sc":"Necromanzia di 2º livello (Mago, Warlock)","cl":"Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nUn raggio di energia logorante scaturisce dall\u0027incantatore verso una creatura entro gittata. Il bersaglio deve effettuare un tiro salvezza su Costituzione. In caso di successo, fino all\u0027inizio del turno successivo dell\u0027incantatore, il bersaglio subisce svantaggio al suo tiro per colpire successivo.\n\nIn caso di fallimento, il bersaglio subisce svantaggio alle prove con d20 basate sulla Forza per la durata dell\u0027incantesimo. Durante questo periodo, sottrae anche 1d8 da tutti i suoi tiri per i danni. Alla fine di ogni suo turno, il bersaglio ripete il tiro salvezza e, se lo supera, termina l\u0027incantesimo."},{"n":"Raggio di gelo","lv":0,"sc":"Trucchetto di Invocazione (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** Istantanea\n\nUn raggio gelido di luce bianco-azzurra sfreccia verso una creatura entro gittata, contro cui l\u0027incantatore effettua un attacco a distanza con incantesimo. Se il colpo va a segno, il bersaglio subisce 1d8 danni da freddo e la sua velocità è ridotta di 3 metri fino all\u0027inizio del turno successivo dell\u0027incantatore.\n\n**Trucchetto potenziato.** I danni aumentano di 1d8 quando l\u0027incantatore raggiunge il 5º livello (2d8), l\u002711º livello (3d8) e il 17º livello (4d8)."},{"n":"Raggio di infermità","lv":1,"sc":"Necromanzia di 1º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore proietta un raggio di energia verdastra verso una creatura entro gittata, effettuando un attacco a distanza con incantesimo contro il bersaglio. Se il colpo va a segno, il bersaglio subisce 2d8 danni da veleno ed è avvelenato fino al termine del turno successivo dell\u0027incantatore.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 1º."},{"n":"Raggio rovente","lv":2,"sc":"Invocazione di 2º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore lancia tre raggi di fuoco contro uno o più bersagli entro gittata. Con questo incantesimo, l\u0027incantatore effettua un attacco a distanza per ogni raggio. Se il colpo va a segno, il bersaglio subisce 2d6 danni da fuoco.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore crea un raggio aggiuntivo per ogni slot di livello superiore al 2º."},{"n":"Ragnatela","lv":2,"sc":"Evocazione di 2º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (un frammento di ragnatela comune)\n**Durata:** concentrazione, fino a 1 ora\n\nL\u0027incantatore evoca un ammasso di ragnatele appiccicose in un punto entro gittata, che riempiono un cubo con spigolo di 6 metri per la durata dell\u0027incantesimo. Le ragnatele contano come terreno difficile e l\u0027area al loro interno e leggermente oscurata. Se le ragnatele non sono ancorate tra due masse solide (per esempio pareti o alberi) o stese su un pavimento, un muro o un soffitto, collassano su se stesse e l\u0027incantesimo termina all\u0027inizio del turno successivo dell\u0027incantatore. Le ragnatele stese su una superficie piatta hanno una profondità di 1,5 metri.\n\nLa prima volta che una creatura vi entra in un turno o inizia lì il suo turno, deve superare un tiro salvezza su Destrezza, altrimenti sarà trattenuta finché sarà al loro interno o non si libera. Una creatura trattenuta dalle ragnatele può usare la un\u0027azione per effettuare una prova di Forza (Atletica) contro la CD del tiro salvezza sull\u0027incantesimo. Se supera la prova, non è più trattenuta.\n\nLe ragnatele sono infiammabili. Un cubo di ragnatele con spigolo di 1,5 metri brucia in 1 round, infliggendo 2d4 danni da fuoco a ogni creatura che inizi il suo turno tra le fiamme."},{"n":"Randello incantato","lv":0,"sc":"Trucchetto di Trasmutazione (Druido)","cl":"Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** incantatore\n**Componenti:** V, S, M (vischio)\n**Durata:** 1 minuto\n\nUn randello o un bastone ferrato impugnato dall\u0027incantatore è pervaso dal potere della natura. Per la durata dell\u0027incantesimo, l\u0027incantatore usa la propria caratteristica da incantatore anziché la Forza per i tiri per i danni e i tiri per colpire effettuati negli attacchi in mischia usando quell\u0027arma: inoltre, i danni dell\u0027arma sono calcolati con un d8. Se l\u0027attacco infligge danni, possono essere danni da forza o danni normali inflitti dall\u0027arma (a scelta dell\u0027incantatore).\n\nL\u0027incantesimo termina se l\u0027incantatore lo lancia di nuovo o se lascia andare l\u0027arma.\n\n**Trucchetto potenziato.** I danni sono calcolati con un dado diverso quando l\u0027incantatore raggiunge il 5º livello (d10), l\u002711º livello (d12) e il 17º livello (2d6)."},{"n":"Reggia meravigliosa","lv":7,"sc":"Evocazione di 7º livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** 90 metri\n**Componenti:** V, S, M (una miniatura di una porta del valore di 15 mo o più)\n**Durata:** 24 ore\n\nL\u0027incantatore evoca una porta scintillante entro gittata che permane per la durata dell\u0027incantesimo. La porta, larga 1,5 metri e alta 3 metri, conduce a una dimora extradimensionale. L\u0027incantatore e una qualsiasi creatura da lui scelta al momento del lancio possono entrare nella dimora extradimensionale fintantoché la porta rimane aperta. L\u0027incantatore può aprire o chiudere la porta (nessuna azione richiesta) se si trova entro 9 metri da essa; quando è chiusa, la porta è impercettibile.\n\nOltre la porta si trova un atrio sfarzoso su cui si aprono numerose stanze. L\u0027atmosfera della dimora è pulita, fresca e accogliente.\n\nL\u0027incantatore può definire la planimetria della dimora come preferisce, ma le sue dimensioni non devono superare quelle di 50 cubi contigui con spigolo di 3 metri. Inoltre, la dimora è ammobiliata e decorata come l\u0027incantatore preferisce e contiene cibo a sufficienza per servire un banchetto di nove portate per un massimo di 100 persone. Arredi e altri oggetti creati da questo incantesimo si dissolvono in fumo quando vengono rimossi dalla dimora.\n\nA provvedere a ogni bisogno degli ospiti è presente una schiera di 100 servitori semitrasparenti. L\u0027incantatore decide l\u0027aspetto e la tenuta di questi servitori, che sono invulnerabili e obbediscono ai suoi ordini. Ogni servitore può eseguire qualsiasi compito che un umano sarebbe in grado di eseguire, ma non può attaccare o effettuare azioni che ferirebbero in modo diretto un\u0027altra creatura. I servitori possono perciò trasportare oggetti, pulire, riparare, piegare abiti, accendere fuochi, servire cibo, versare vino e così via. Tuttavia, non possono lasciare la dimora.\n\nAl termine dell\u0027incantesimo, tutte le creature e gli oggetti rimasti all\u0027interno dello spazio extradimensionale vengono espulsi negli spazi liberi più vicini all\u0027entrata."},{"n":"Reincarnazione","lv":5,"sc":"Necromanzia di 5º livello (Druido)","cl":"Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 ora\n**Gittata:** contatto\n**Componenti:** V, S, M (oli rari del valore di 1.000 mo o più, che l\u0027incantesimo consuma)\n**Durata:** istantanea\n\nL\u0027incantatore tocca un umanoide defunto o una parte di umanoide defunto. Se la creatura non è morta da più di 10 giorni, l\u0027incantesimo le forma un nuovo corpo e richiama la sua anima all\u0027interno di quel corpo. Si tira 1d10 e si consulta la tabella di seguito per determinare la specie del nuovo corpo, oppure il GM sceglie un\u0027altra specie giocabile.\n\n1d10 Specie 1d10 Specie\n1 Il personaggio 6 Halfling\ntira di nuovo\n2 Dragonide 7 Nano\n3 Elfo 8 Orchesco\n4 Gnomo 9 Tiefling\n5 Goliath 10 Umano\n\nLa creatura reincarnata compie le scelte indicate nella descrizione della specie scelta e ricorda la sua vita precedente. Conserva le capacità che possedeva nella sua forma originale, ad eccezione del fatto che i tratti della sua specie originaria vengono sostituiti dai tratti della nuova specie."},{"n":"Resistenza","lv":0,"sc":"Trucchetto di Abiurazione (Chierico, Druido)","cl":"Chierico, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componente:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore tocca una creatura consenziente e sceglie un tipo di danno: acido, contundente, freddo, fulmine, fuoco, necrotico, perforante, radioso, tagliente, tuono, veleno. Quando una creatura subisce danni del tipo scelto prima del termine dell\u0027incantesimo, riduce il totale dei danni subiti di 1d4. Una creatura può beneficiare di questo incantesimo solo una volta per turno."},{"n":"Respirare sott\u0027acqua","lv":3,"sc":"Trasmutazione di 3º livello (Druido, Mago, Ranger, Stregone)","cl":"Druido, Mago, Ranger, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** 9 metri\n**Componenti:** V, S, M (un piccolo giunco)\n**Durata:** 24 ore\n\nQuesto incantesimo concede a un massimo di dieci creature consenzienti entro gittata (a scelta dell\u0027incantatore) la capacità di respirare sott\u0027acqua per tutta la sua durata. Le creature influenzate conservano inoltre la loro normale modalità di respirazione."},{"n":"Resurrezione","lv":7,"sc":"Necromanzia di 7º livello (Bardo, Chierico)","cl":"Bardo, Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 ora\n**Gittata:** contatto\n**Componenti:** V, S, M (un diamante del valore di 1.000 mo o più, che l\u0027incantesimo consuma)\n**Durata:** istantanea\n\nL\u0027incantatore tocca e resuscita una creatura morta da non più di un secolo, che non sia morta di vecchiaia e che non fosse un non morto al momento della morte.\n\nLa creatura torna in vita con tutti i suoi punti ferita. Inoltre, questo incantesimo neutralizza qualsiasi veleno che influenzava la creatura al momento della morte, richiude tutte le ferite mortali e ripristina le eventuali parti del corpo mancanti. Il ritorno dalla morte è un vero e proprio travaglio. Il bersaglio subisce una penalità di −4 alle prove con d20. Ogni volta che completa un riposo lungo, questa penalità viene ridotta di 1 finché non arriva a 0.\n\nLanciare questo incantesimo per riportare in vita una creatura morta da 365 giorni o più risulta logorante per l\u0027incantatore. Finché non completa un riposo lungo, non può lanciare di nuovo incantesimi e subisce svantaggio alle prove con d20."},{"n":"Resurrezione pura","lv":9,"sc":"Necromanzia di 9º livello (Chierico, Druido)","cl":"Chierico, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 ora\n**Gittata:** contatto\n**Componenti:** V, S, M (diamanti del valore di 25.000 mo o più, che vengono consumati dall\u0027incantesimo)\n**Durata:** istantanea\n\nL\u0027incantatore tocca una creatura morta da non più di 200 anni a causa di un qualsiasi motivo fuorché la vecchiaia. Il bersaglio viene rianimato con tutti i propri punti ferita.\n\nQuesto incantesimo chiude tutte le ferite, neutralizza ogni veleno, cura tutti i contagi magici e annulla ogni maledizione che affiggeva la creatura al momento della morte. Inoltre, ripristina gli eventuali organi e arti danneggiati o mancanti. Se la creatura era un non morto, viene riportata alla forma originaria che aveva in vita.\n\nL\u0027incantesimo può fornire al bersaglio un nuovo corpo se l\u0027originale non esiste più, nel qual caso l\u0027incantatore deve pronunciare il nome della creatura, che appare in uno spazio libero a scelta dell\u0027incantatore entro 3 metri da lui."},{"n":"Rianimare morti","lv":5,"sc":"Necromanzia di 5º livello (Bardo, Chierico, Paladino)","cl":"Bardo, Chierico, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 ora\n**Gittata:** contatto\n**Componenti:** V, S, M (un diamante del valore di 500 mo o più, che l\u0027incantesimo consuma)\n**Durata:** istantanea\n\nCon un tocco, l\u0027incantatore riporta in vita una creatura morta, purché non sia deceduta da più di 10 giorni e non fosse un non morto al momento della morte.\n\nLa creatura torna in vita con 1 punto ferita. Inoltre, questo incantesimo neutralizza qualsiasi veleno che influenzava la creatura al momento della morte. L\u0027incantesimo richiude tutte le ferite mortali, ma non ripristina le parti del corpo mancanti. Se una creatura è priva di organi o parti del corpo essenziali per la sua sopravvivenza, come per esempio la testa, l\u0027incantesimo fallisce automaticamente. Il ritorno dalla morte è un vero e proprio travaglio. Il bersaglio subisce una penalità di −4 alle prove con d20. Ogni volta che completa un riposo lungo, questa penalità viene ridotta di 1 finché non arriva a 0."},{"n":"Richiama drago","lv":5,"sc":"Evocazione di 5º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (un oggetto su cui è incisa l\u0027immagine di un drago, del valore di 500 mo o più)\n**Durata:** concentrazione, fino a 1 ora\n\nL\u0027incantatore invoca uno spirito di drago, che si manifesta in uno spazio libero entro gittata che egli sia in grado di vedere e utilizza la scheda delle statistiche dello spirito draconico. La creatura scompare quando scende a 0 punti ferita o quando l\u0027incantesimo termina ed è un alleato per il personaggio e i suoi alleati. In combattimento, la creatura ha lo stesso punteggio di iniziativa dell\u0027incantatore, ma inizia il turno immediatamente dopo il suo, obbedendo ai suoi comandi verbali (nessuna azione richiesta da parte dell\u0027incantatore). Se l\u0027incantatore non pronuncia comandi verbali, la creatura compie l\u0027azione di Schivata e usa il suo movimento per sottrarsi al pericolo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** Usa il livello dello slot incantesimo relativo al livello dell\u0027incantesimo nella scheda delle statistiche.\n\n#### Spirito draconico\n\nDrago Grande, neutrale\nCA 14 + il livello dell\u0027incantesimo\nPF 50 + 10 per ogni livello di incantesimo sopra il 5º\nVelocità 9 m, volo 18 m, nuoto 9 m\nMOD SALV MOD SALV MOD SALV\nFor 19 +4 +4 Des 14 +2 +2 Cos 17 +3 +3\nInt 10 +0 +0 Sag 14 +2 +2 Car 14 +2 +2\nResistenze acido, freddo, fulmine, fuoco, veleno\nImmunità affascinato, avvelenato, spaventato\nSensi Percezione passiva 30; scurovisione 18 m, vista\ncieca 3 m\nLingue Draconico, comprende le lingue parlate dal\npersonaggio\nGS nessuno (PE 0; BC pari al bonus di competenza del\npersonaggio)\n\n#### Tratti\n\nResistenze condivise. Quando il personaggio evoca\nlo spirito, sceglie una delle sue resistenze. Così facendo,\nottiene resistenza al tipo di danno scelto fino al termine\ndell\u0027incantesimo.\n\n#### Azioni\n\nMultiattacco. Lo spirito effettua un numero di attacchi\nSquarcio pari alla metà del livello dell\u0027incantesimo\n(arrotondando per difetto) e usa Soffio.\nSquarcio. Tiro per colpire in mischia: il bonus equivale\nal modificatore di attacco dell\u0027incantesimo del personaggio, portata di 3 metri. Colpito: 1d6 + 4 + il livello\ndell\u0027incantesimo danni perforanti.\nSoffio. Tiro salvezza su Destrezza: la CD è pari alla\nCD del tiro salvezza sull\u0027incantesimo, ogni creatura\nin un cono di 9 m. Fallimento: 2d6 danni di un tipo\na cui lo spirito è resistente (a scelta dell\u0027incantatore\nal momento del lancio dell\u0027incantesimo). Successo:\ndanni dimezzati."},{"n":"Rigenerazione","lv":7,"sc":"Trasmutazione di 7º livello (Bardo, Chierico, Druido)","cl":"Bardo, Chierico, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** contatto\n**Componenti:** V, S, M (un ruota della preghiera)\n**Durata:** 1 ora\n\nUna creatura toccata dall\u0027incantatore recupera 4d8 + 15 punti ferita. Per la durata dell\u0027incantesimo, il bersaglio recupera 1 punto ferita all\u0027inizio di ogni suo turno e qualsiasi parte del corpo sia stata recisa, ricresce dopo 2 minuti."},{"n":"Rimuovi maledizione","lv":3,"sc":"Abiurazione di 3º livello (Chierico, Mago, Paladino, Warlock)","cl":"Chierico, Mago, Paladino, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S\n**Durata:** Istantanea\n\nAl tocco dell\u0027incantatore, tutte le maledizioni che affliggono una creatura o un oggetto terminano. Nel caso di un oggetto magico maledetto, la sua maledizione permane, ma l\u0027incantesimo spezza la sintonia del suo proprietario, consentendogli di rimuoverlo o di liberarsene."},{"n":"Rinascita","lv":3,"sc":"Necromanzia di 3º livello (Chierico, Druido, Paladino, Ranger)","cl":"Chierico, Druido, Paladino, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (un diamante del valore di 300 mo o più, che l\u0027incantesimo consuma)\n**Durata:** istantanea\n\nL\u0027incantatore tocca una creatura morta nell\u0027ultimo minuto, la quale ritorna in vita con 1 punto ferita. Questo incantesimo non può riportare in vita una creatura morta di vecchiaia e non ripristina le eventuali parti del corpo mancanti."},{"n":"Riparare","lv":0,"sc":"Trucchetto di Trasmutazione (Bardo, Chierico, Druido, Mago, Stregone)","cl":"Bardo, Chierico, Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** contatto\n**Componenti:** V, S, M (due calamite)\n**Durata:** Istantanea\n\nQuesto incantesimo ripara una singola crepa o uno squarcio in un oggetto toccato dall\u0027incantatore, come l\u0027anello spezzato di una catena, due metà di una chiave spezzata, un mantello strappato o un otre forato. Se le dimensioni della crepa o dello squarcio non superano i 30 centimetri, l\u0027incantatore ripara l\u0027oggetto senza lasciare traccia del danno precedente.\n\nQuesto incantesimo può riparare un oggetto magico solo fisicamente, senza ripristinare la magia in esso contenuta."},{"n":"Riposo inviolato","lv":2,"sc":"Necromanzia di 2º livello (Chierico, Mago, Paladino)","cl":"Chierico, Mago, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** contatto\n**Componenti:** V, S, M (2 monete di rame, che l\u0027incantesimo consuma)\n**Durata:** 10 giorni\n\nL\u0027incantatore tocca un cadavere o altri resti. Per la durata dell\u0027incantesimo, il bersaglio è protetto dalla decomposizione e non può diventare un non morto. Inoltre, l\u0027incantesimo estende il limite di tempo entro cui rianimare il bersaglio dalla morte, in quanto i giorni trascorsi sotto l\u0027influenza di questo incantesimo non contano al fine di determinare il limite di tempo di incantesimi come rianimare morti."},{"n":"Risata incontenibile","lv":1,"sc":"Ammaliamento di 1º livello (Bardo, Mago, Warlock)","cl":"Bardo, Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S, M (una crostata e una piuma)\n**Durata:** concentrazione, fino a 1 minuto\n\nUna creatura a scelta entro gittata che l\u0027incantatore è in grado di vedere effettua un tiro salvezza su Saggezza. Se lo fallisce, cade a terra prona ed è incapacitata per la durata dell\u0027incantesimo. Durante quel periodo di tempo, ride incontrollabilmente (se è in grado di ridere) e non può porre fine alla condizione prono.\n\nIl bersaglio effettua un altro tiro salvezza su Saggezza alla fine di ogni suo turno e ogni volta che subisce danni; in quest\u0027ultimo caso, lo effettua con vantaggio. In caso di successo, l\u0027incantesimo termina.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 1º."},{"n":"Riscaldare il metallo","lv":2,"sc":"Trasmutazione di 2º livello (Bardo, Druido)","cl":"Bardo, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (un pezzo di ferro e una fiamma)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore sceglie un oggetto lavorato in metallo, come un\u0027arma in metallo o un\u0027armatura di metallo media o pesante entro gittata che egli è in grado di vedere e la rende incandescente. Qualsiasi creatura a contatto fisico con l\u0027oggetto subisce 2d8 danni da fuoco al momento del lancio dell\u0027incantesimo. Fino al termine dell\u0027incantesimo, l\u0027incantatore può effettuare un\u0027azione bonus in ognuno dei suoi turni successivi per infliggere di nuovo i danni se l\u0027oggetto si trova entro gittata.\n\nSe una creatura sta stringendo o indossando l\u0027oggetto e ne subisce i danni, deve superare un tiro salvezza su Costituzione o, se possibile, lasciar cadere l\u0027oggetto. Se non lascia cadere l\u0027oggetto, il bersaglio subisce svantaggio ai tiri per colpire e alle prove di caratteristica effettuati prima dell\u0027inizio del turno successivo dell\u0027incantatore.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 2º."},{"n":"Ristorare inferiore","lv":2,"sc":"Abiurazione di 2º livello (Bardo, Chierico, Druido, Paladino, Ranger)","cl":"Bardo, Chierico, Druido, Paladino, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** contatto\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore tocca una creatura e pone fine a una delle condizioni che la affligge tra: accecato, assordato, avvelenato o paralizzato."},{"n":"Ristorare superiore","lv":5,"sc":"Abiurazione di 5º livello (Bardo, Chierico, Druido, Paladino, Ranger)","cl":"Bardo, Chierico, Druido, Paladino, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (polvere di diamante del valore di 100 mo o più, che l\u0027incantesimo consuma)\n**Durata:** istantanea\n\nL\u0027incantatore tocca una creatura e rimuove magicamente da essa uno dei seguenti effetti:\n\n- 1 livello di indebolimento - La condizione affascinato o pietrificato - Una maledizione, inclusa la sintonia del bersaglio con un oggetto magico maledetto - Qualsiasi riduzione di un punteggio di caratteristica del bersaglio - Qualsiasi riduzione dei punti ferita massimi del bersaglio"},{"n":"Risveglio","lv":5,"sc":"Trasmutazione di 5º livello (Bardo, Druido)","cl":"Bardo, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 8 ore\n**Gittata:** contatto\n**Componenti:** V, S, M (un\u0027agata del valore di 1.000 mo o più, che l\u0027incantesimo consuma)\n**Durata:** istantanea\n\nL\u0027incantatore trascorre il tempo di lancio tracciando percorsi magici su una pietra preziosa, poi tocca il bersaglio. Il bersaglio deve essere una bestia o una creatura vegetale con Intelligenza pari o inferiore a 3 o una pianta naturale che non sia una creatura. Il bersaglio acquisisce Intelligenza pari a 10 e la capacità di parlare una lingua conosciuta dall\u0027incantatore. Se il bersaglio è una pianta naturale, diventa una creatura vegetale e ottiene l\u0027abilità di muovere i suoi rami, radici, liane, rampicanti e così via e sviluppa sensi simili a quelli umani. Il GM sceglie le statistiche appropriate per il vegetale risvegliato, come per esempio nel caso di un cespuglio risvegliato o di un albero risvegliato, in \"Mostri\".\n\nIl bersaglio risvegliato rimane affascinato per 30 giorni o finché l\u0027incantatore o i suoi alleati non gli infliggono danni. Quando l\u0027effetto di tale condizione svanisce, la creatura risvegliata sceglie il suo atteggiamento nei confronti dell\u0027incantatore."},{"n":"Ritirata rapida","lv":1,"sc":"Trasmutazione di 1º livello (Mago, Stregone, Warlock)","cl":"Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore effettua un\u0027azione di Scatto e, fino al termine dell\u0027incantesimo, può effettuarla di nuovo come azione bonus."},{"n":"Salto","lv":1,"sc":"Trasmutazione di 1º livello (Druido, Mago, Ranger, Stregone)","cl":"Druido, Mago, Ranger, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** contatto\n**Componente:** V, S, M (la zampa posteriore di una cavalletta)\n**Durata:** 1 minuto\n\nL\u0027incantatore tocca una creatura consenziente. La creatura, in ogni suo turno fino al termine dell\u0027incantesimo, può saltare fino a 9 metri, usando 3 metri di movimento.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 1º."},{"n":"Salvare i morenti","lv":0,"sc":"Trucchetto di Necromanzia (Chierico, Druido)","cl":"Chierico, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 4,5 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore sceglie una creatura entro gittata con 0 punti ferita ma che è ancora in vita, facendola diventare stabile.\n\n**Trucchetto potenziato.** La gittata raddoppia quando l\u0027incantatore raggiunge il 5º livello (9 metri), l\u002711º livello (18 metri) e il 17º livello (36 metri)."},{"n":"Santificare","lv":5,"sc":"Abiurazione di 5º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 24 ore\n**Gittata:** contatto\n**Componenti:** V, S, M (incenso del valore di 1.000 mo o più, che l\u0027incantesimo consuma)\n**Durata:** finché non viene dissolto\n\nL\u0027incantatore tocca un punto e infonde un potere sacro o sacrilego in un\u0027area del raggio massimo di 18 metri intorno a esso. L\u0027incantesimo tuttavia fallisce se il raggio comprende un\u0027area già sotto l\u0027effetto di santificare. L\u0027area influenzata è soggetta ai seguenti effetti:\n\n**Protezione consacrata.** L\u0027incantatore sceglie uno dei seguenti tipi di creature: aberrazione, celestiale, elementale, folletto, immondo o non morto. Le creature del tipo scelto non possono entrare volontariamente nell\u0027area, e qualsiasi creatura affascinata, spaventata o posseduta da tali creature non viene affascinata, spaventata o posseduta fintantoché si trova nell\u0027area.\n\n**Effetto aggiuntivo.** L\u0027incantatore vincola un effetto aggiuntivo all\u0027area, scegliendolo dalla lista sottostante:\n\n**Coraggio.** Le creature di qualsiasi tipo scelto dall\u0027incantatore non possono essere spaventate finché si trovano nell\u0027area.\n\n**Interferenza extradimensionale.** Le creature di qualsiasi tipo scelte dall\u0027incantatore non possono entrare o uscire dall\u0027area utilizzando il teletrasporto o i viaggi interplanari.\n\n**Linguaggi.** Le creature di qualsiasi tipo scelto dall\u0027incantatore possono comunicare con qualsiasi creatura all\u0027interno dell\u0027area, anche se non condividono la stessa lingua.\n\n**Luce diurna.** L\u0027area è pervasa di luce intensa. L\u0027oscurità magica creata dagli incantesimi di livello inferiore rispetto a questo incantesimo non può sopprimere la luce.\n\n**Oscurità.** L\u0027area si riempie di oscurità. La luce normale, nonché la luce magica creata dagli incantesimi di livello inferiore rispetto a questo incantesimo, non possono illuminare l\u0027area.\n\n**Paura.** Le creature di qualsiasi tipo scelto dall\u0027incantatore non possono essere spaventate finché si trovano nell\u0027area.\n\n**Resistenza.** Le creature di qualsiasi tipo scelto dall\u0027incantatore sono resistenti a un tipo di danno scelto dall\u0027incantatore finché si trovano nell\u0027area.\n\n**Sereno riposo.** I cadaveri sepolti nell\u0027area non possono diventare non morti.\n\n**Silenzio.** L\u0027area è insonorizzata, nessun suono può fuoriuscire o penetrare al suo interno.\n\nVulnerabilità. Le creature di qualsiasi tipo scelto dall\u0027incantatore sono vulnerabili a un tipo di danno scelto dall\u0027incantatore finché si trovano nell\u0027area."},{"n":"Santuario","lv":1,"sc":"Abiurazione di 1º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** 9 metri\n**Componenti:** V, S, M (un frammento di vetro di uno specchio)\n**Durata:** 1 minuto\n\nL\u0027incantatore protegge una creatura situata entro gittata. Fino al termine dell\u0027incantesimo, ogni creatura che bersaglia la creatura protetta con un tiro per colpire o con un incantesimo dannoso deve prima superare un tiro salvezza su Saggezza, altrimenti deve scegliere un bersaglio diverso o perdere l\u0027attacco o l\u0027incantesimo. Questo incantesimo non protegge la creatura protetta dalle aree di effetto. L\u0027incantesimo termina se la creatura protetta effettua un tiro per colpire, lancia un incantesimo o infligge danni."},{"n":"Santuario privato","lv":4,"sc":"Abiurazione di 4º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** 36 metri\n**Componenti:** V, S, M (una sottile lamina di piombo)\n**Durata:** 24 ore\n\nL\u0027incantatore rende magicamente sicura un\u0027area entro gittata: un cubo le cui dimensioni possono variare da un minimo di 1,5 metri per spigolo a un massimo di 30 metri per spigolo. L\u0027incantesimo permane per tutta la sua durata.\n\nQuando lancia l\u0027incantesimo, l\u0027incantatore decide che tipo di sicurezza esso fornisce, scegliendo una o più tra le proprietà seguenti:\n\n- I suoni non possono attraversare la barriera ai confini dell\u0027area protetta.\n\n- La barriera nell\u0027area protetta appare oscura e nebulosa, rendendo impossibile vedere oltre (anche utilizzando scurovisione).\n\n- I sensori creati dagli incantesimi di divinazione non possono apparire all\u0027interno dell\u0027area protetta né oltrepassarne il perimetro.\n\n- Le creature nell\u0027area non possono essere bersaglio di incantesimi di divinazione.\n\n- Nulla può teletrasportarsi dentro o fuori dall\u0027area protetta.\n\n- I viaggi planari sono bloccati all\u0027interno dell\u0027area protetta.\n\nLanciando questo incantesimo nello stesso punto ogni giorno per 365 giorni, l\u0027incantesimo dura finché non viene dissolto.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può aumentare le dimensioni del cubo di 30 metri per spigolo per ogni slot di livello superiore al 4º."},{"n":"Scagliare maledizione","lv":3,"sc":"Necromanzia di 3º livello (Bardo, Chierico, Mago)","cl":"Bardo, Chierico, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore tocca una creatura che deve superare un tiro salvezza su Saggezza, altrimenti verrà maledetta per la durata dell\u0027incantesimo. Finché la maledizione non svanisce, il bersaglio subisce uno dei seguenti effetti a scelta:\n\n- L\u0027incantatore sceglie una caratteristica. Il bersaglio subisce svantaggio alle prove di caratteristica e ai tiri salvezza effettuati con quella caratteristica.\n\n- Il bersaglio subisce svantaggio ai tiri per colpire contro l\u0027incantatore.\n\n- In combattimento, il bersaglio deve superare un tiro salvezza su Saggezza all\u0027inizio di ogni suo turno, altrimenti in quel turno è costretto a effettuare l\u0027azione Schivata.\n\n- Se l\u0027incantatore infligge danni al bersaglio con un tiro per colpire o un incantesimo, il bersaglio subisce 1d8 danni necrotici extra.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** Se l\u0027incantatore lancia questo incantesimo usando uno slot incantesimo di 4º livello, può mantenere la concentrazione su di esso fino a un massimo di 10 minuti. Se usa uno slot incantesimo di 5º livello o superiore, l\u0027incantesimo non richiede concentrazione e la durata diventa di 8 ore (slot di 5º e 6º livello) o 24 ore (slot di 7º o 8º livello). Se usa uno slot incantesimo di 9º livello, l\u0027incantesimo dura finché non viene dissolto."},{"n":"Scassinare","lv":2,"sc":"Trasmutazione di 2º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V\n**Durata:** Istantanea\n\nL\u0027incantatore sceglie un oggetto entro gittata che egli è in grado di vedere. Può trattarsi di una porta, uno scrigno, un forziere, un paio di manette, un lucchetto o un altro oggetto dotato di un mezzo normale o magico per la chiusura.\n\nUn bersaglio tenuto chiuso da una normale serratura, incastrato o sbarrato, cessa di essere tale. Se l\u0027oggetto è protetto da più serrature, con questo incantesimo se ne sblocca soltanto una.\n\nSe il bersaglio è tenuto chiuso da Serratura Arcana, quell\u0027incantesimo è soppresso per 10 minuti, nel corso dei quali l\u0027oggetto può essere aperto e chiuso.\n\nQuando l\u0027incantatore lancia l\u0027incantesimo, si percepisce un forte rumore simile al bussare proveniente dal bersaglio, udibile fino a una distanza di 90 metri."},{"n":"Sciame di meteore","lv":9,"sc":"Invocazione di 9º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 1,5 chilometri\n**Componenti:** V, S\n**Durata:** istantanea\n\nGlobi infuocati precipitano sul terreno in quattro punti differenti entro gittata che l\u0027incantatore è in grado di vedere. Ogni creatura situata in una sfera del raggio di 12 metri centrata su ognuno di quei punti effettua un tiro salvezza su Destrezza. Una creatura subisce 20d6 danni da fuoco e 20d6 danni contundenti in caso di fallimento, o la metà dei danni in caso di successo. Una creatura in un\u0027area con più sfere infuocate subisce l\u0027effetto soltanto una volta.\n\nAnche un oggetto non magico che non sia indossato o trasportato subisce i danni se si trova entro l\u0027area dell\u0027incantesimo, e inizia a bruciare se è infiammabile."},{"n":"Scolpire pietra","lv":4,"sc":"Trasmutazione di 4º livello (Chierico, Druido, Mago)","cl":"Chierico, Druido, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (argilla morbida)\n**Durata:** istantanea\n\nL\u0027incantatore tocca un oggetto di pietra di taglia Media o inferiore, oppure una sezione di pietra non più grande di 1,5 metri in ogni dimensione, modellandola nella forma che desidera. Per esempio, potrebbe trasformare una grossa roccia in un\u0027arma, una statua, un forziere o creare un piccolo sentiero di passaggio attraverso un muro spesso 1,5 metri. L\u0027incantatore può anche modellare una porta di pietra o i suoi stipiti per sigillarla. L\u0027oggetto creato può avere un massimo di due cardini e una chiusura, ma non può essere dotato di meccanismi più raffinati."},{"n":"Scopri il percorso","lv":6,"sc":"Divinazione di 6º livello (Bardo, Chierico, Druido)","cl":"Bardo, Chierico, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** incantatore\n**Componenti:** V, S, M (un set di strumenti di divinazione, come carte o rune, del valore di 100 mo o più)\n**Durata:** concentrazione, fino a 1 giorno\n\nL\u0027incantatore percepisce magicamente il percorso fisico più diretto verso una destinazione di cui nomina il nome e che gli sia nota. Se nomina una destinazione su un altro piano di esistenza, una destinazione in movimento (come una fortezza mobile) o una destinazione poco specifica (come \"la tana di un drago verde\"), l\u0027incantesimo non ha effetto.\n\nPer la durata dell\u0027incantesimo, finché l\u0027incantatore si trova sullo stesso piano di esistenza della destinazione, sa quanto è lontana e in che direzione si trova. Ogni volta che l\u0027incantatore si trova a scegliere tra più percorsi, sa qual è il più diretto."},{"n":"Scopri trappole","lv":2,"sc":"Divinazione di 2º livello (Chierico, Druido, Ranger)","cl":"Chierico, Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore percepisce qualsiasi trappola piazzata entro gittata e nel suo campo visivo. Ai fini di questo incantesimo, per trappola si intende qualsiasi oggetto o meccanismo creato per provocare danni o altri pericoli. Pertanto, l\u0027incantesimo è in grado di percepire gli incantesimi allarme o glifo di interdizione, o una fossa meccanica nascosta, ma non di rivelare un cedimento naturale del pavimento, un soffitto instabile o una voragine nascosta.\n\nQuesto incantesimo rivela la presenza di una trappola ma non la sua ubicazione. L\u0027incantatore scopre solo la natura generale del pericolo che la trappola pone."},{"n":"Scrigno segreto","lv":4,"sc":"Evocazione di 4º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (uno scrigno che misura 90 x 60 x 60 centimetri, realizzato con materiali rari del valore di 5.000 mo o più e una riproduzione minuscola dello scrigno fatta degli stessi materiali del valore di 50 mo o più)\n**Durata:** finché non viene dissolto\n\nL\u0027incantatore nasconde uno scrigno e tutti i suoi contenuti sul Piano Etereo. Per farlo, deve toccare lo scrigno e la riproduzione in miniatura che fungono da componenti materiali dell\u0027incantesimo. Il forziere può contenere fino a 12 cubi con spigolo di 30 centimetri di materiale non vivente (90 x 60 x 60 cm).\n\nFinché il forziere rimane sul Piano Etereo, l\u0027incantatore può effettuare un\u0027azione di Magia e toccare la riproduzione per richiamare a sé lo scrigno, che appare a terra in uno spazio libero entro 1,5 metri da lui. L\u0027incantatore può inviare nuovamente lo scrigno sul Piano Etereo, effettuando un\u0027azione di Magia per toccare lo scrigno e la riproduzione. Dopo 60 giorni, esiste una probabilità cumulativa del 5% al termine di ogni giorno che l\u0027incantesimo termini. L\u0027incantesimo termina anche se l\u0027incantatore lancia nuovamente questo incantesimo o se la riproduzione minuscola dello scrigno viene distrutta. Se l\u0027incantesimo termina e lo scrigno più grande si trova sul Piano Etereo, lo scrigno rimane lì per poter essere ritrovato dall\u0027incantatore o da qualcun altro."},{"n":"Scritto illusorio","lv":1,"sc":"Illusione di 1º livello (Bardo, Mago, Warlock)","cl":"Bardo, Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto o rituale\n**Gittata:** contatto\n**Componenti:** S, M (inchiostro del valore di 10 mo o più, che l\u0027incantesimo consuma)\n**Durata:** 10 giorni\n\nL\u0027incantatore scrive su una pergamena, un foglio o un altro materiale adatto e infonde nello scritto un\u0027illusione che permane per la durata dell\u0027incantesimo. All\u0027incantatore e a qualsiasi creatura indicata da lui al momento del lancio, lo scritto appare normale, sembra essere stilato nella calligrafia dell\u0027incantatore e trasmette il significato inteso nel momento in cui è stato scritto. Agli occhi di tutti gli altri, il messaggio appare scritto in una lingua magica o ignota che risulta per loro incomprensibile. In alternativa, l\u0027illusione può alterare il significato, la calligrafia e la lingua del testo, ma questa deve essere una lingua conosciuta dall\u0027incantatore. Se l\u0027incantesimo viene dissolto, il messaggio originale e l\u0027illusione scompaiono.\n\nUna creatura con vista pura può leggere il messaggio nascosto."},{"n":"Scrutare","lv":5,"sc":"Divinazione di 5º livello (Bardo, Chierico, Druido, Mago, Warlock)","cl":"Bardo, Chierico, Druido, Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** incantatore\n**Componenti:** V, S, M (un focus del valore di 1.000 mo o più, come una sfera di cristallo, uno specchio o una fonte d\u0027acqua)\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore può vedere e udire una creatura a sua scelta situata sul suo stesso piano di esistenza. Il bersaglio effettua un tiro salvezza su Saggezza, modificato (vedi le tabelle di seguito) dalla conoscenza e dal tipo di legame fisico che l\u0027incantatore ha nei confronti della creatura. Il bersaglio non sa contro cosa sta effettuando il tiro salvezza, avverte solo una sensazione di disagio.\n\nL\u0027incantatore conosce il bersaglio in Modificatore\nmaniera... al tiro salvezza\nIndiretta (ha sentito parlare del +5\nbersaglio)\nDiretta (ha incontrato il bersaglio) +0\nApprofondita (conosce bene −5\nil bersaglio)\nL\u0027oggetto del bersaglio che Modificatore\nl\u0027incantatore possiede è... al tiro salvezza\nImmagine o altra raffigurazione −2\nAbito o altro oggetto personale −4\nParte del corpo, ciocca di capelli −10\no pezzo di unghia\n\nIn caso di tiro salvezza superato, il bersaglio non viene influenzato dall\u0027incantesimo, che l\u0027incantatore non può lanciare su di esso per 24 ore.\n\nIn caso di fallimento, l\u0027incantesimo crea un sensore invisibile e intangibile entro 3 metri dal bersaglio, attraverso cui l\u0027incantatore può vedere e sentire come se si trovasse sul posto. Il sensore si muove insieme al bersaglio, rimanendo entro 3 metri da esso per la durata dell\u0027incantesimo. Se qualcosa è in grado di vedere il sensore, esso appare come un globo luminoso grande all\u0027incirca quanto un pugno umano.\n\nInvece di bersagliare una creatura, l\u0027incantatore può bersagliare un luogo che ha già visto. Quando lo fa, il sensore appare in quel luogo e non si muove."},{"n":"Scudo","lv":1,"sc":"Abiurazione di 1º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** reazione, che l\u0027incantatore effettua quando è colpito da un tiro per colpire o bersagliato dall\u0027incantesimo dardo incantato\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** 1 round\n\nUna barriera impercettibile di forza magica protegge l\u0027incantatore. Fino all\u0027inizio del suo turno successivo, l\u0027incantatore ottiene un bonus di +5 alla CA da applicare anche all\u0027attacco innescante e non subisce danni da dardo incantato."},{"n":"Scudo della fede","lv":1,"sc":"Abiurazione di 1º livello (Chierico, Paladino)","cl":"Chierico, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** 18 metri\n**Componenti:** V, S, M (una pergamena con una preghiera)\n**Durata:** concentrazione, fino a 10 minuti\n\nUn campo di energia scintillante avvolge una creatura scelta dall\u0027incantatore entro gittata, conferendole un bonus di +2 alla CA per la durata dell\u0027incantesimo."},{"n":"Scudo di fuoco","lv":4,"sc":"Invocazione di 4º livello (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (un frammento di fosforo o una lucciola)\n**Durata:** 10 minuti\n\nPer la durata dell\u0027incantesimo, il corpo dell\u0027incantatore è avvolto da fiamme sottili, che proiettano luce intensa in un raggio di 3 metri e luce fioca per ulteriori 3 metri.\n\nLe fiamme conferiscono all\u0027incantatore uno scudo ardente o gelido a sua scelta. Lo scudo ardente gli conferisce resistenza ai danni da freddo, mentre lo scudo gelido resistenza ai danni da fuoco. Inoltre, ogni volta che una creatura entro 1,5 metri dall\u0027incantatore lo colpisce con un tiro per colpire in mischia, dallo scudo erompono delle fiamme. L\u0027attaccante subisce 2d8 danni da fuoco da uno scudo ardente o 2d8 danni da freddo da uno scudo gelido."},{"n":"Scurovisione","lv":2,"sc":"Trasmutazione di 2º livello (Druido, Mago, Ranger, Stregone)","cl":"Druido, Mago, Ranger, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (una carota essiccata)\n**Durata:** 8 ore\n\nPer la durata dell\u0027incantesimo, una creatura consenziente toccata dall\u0027incantatore è dotata di scurovisione fino a 45 metri."},{"n":"Segugio fedele","lv":4,"sc":"Evocazione di 4º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S, M (un fischietto d\u0027argento)\n**Durata:** 8 ore\n\nL\u0027incantatore evoca un cane da guardia fantasma in uno spazio libero entro gittata che egli è in grado di vedere. Il segugio permane per la durata dell\u0027incantesimo o fino a quando la distanza tra il segugio e l\u0027incantatore non supera i 90 metri di distanza.\n\nSolo l\u0027incantatore è in grado di vedere il segugio, che è intangibile e invulnerabile. Quando una creatura di taglia Piccola o inferiore si avvicina entro 9 metri dal segugio senza prima aver pronunciato la parola d\u0027ordine specificata dall\u0027incantatore al momento del lancio dell\u0027incantesimo, il segugio inizia ad abbaiare sonoramente. Il segugio ottiene vista pura con un raggio di 9 metri.\n\nAll\u0027inizio di ogni turno dell\u0027incantatore, il segugio tenta di mordere un nemico entro 1,5 metri da sé. Il nemico deve superare un tiro salvezza su Destrezza, altrimenti subisce 4d8 danni da forza. Nei turni successivi, l\u0027incantatore può effettuare un\u0027azione di Magia per spostare il segugio fino a 9 metri."},{"n":"Sembrare","lv":5,"sc":"Illusione di 5º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S\n**Durata:** 8 ore\n\nL\u0027incantatore assegna un aspetto illusorio a ogni creatura a sua scelta entro gittata che egli è in grado di vedere. Un bersaglio non consenziente può effettuare un tiro salvezza su Carisma e, se lo supera, non ne viene influenzato.\n\nL\u0027incantatore può assegnare lo stesso aspetto oaspetti diversi ai bersagli. L\u0027incantesimo consente di modificare l\u0027aspetto fisico e l\u0027equipaggiamento dei bersagli. Ogni creatura può apparire 30 centimetri più alta o più bassa, più grassa o più magra. Il nuovo aspetto del bersaglio deve usare la stessa disposizione basilare degli arti del bersaglio. Entro questi limiti, la natura dell\u0027illusione dipende dall\u0027incantatore. L\u0027incantesimo permane per tutta la sua durata.\n\nI cambiamenti apportati da questo incantesimo non passano il vaglio di un\u0027ispezione fisica. Per esempio, se l\u0027incantatore usa questo incantesimo per aggiungere un cappello all\u0027abbigliamento della creatura, gli oggetti sono in grado di attraversarlo. Una creatura che effettua l\u0027azione di Studio per esaminare un bersaglio può effettuare una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull\u0027incantesimo. Se la supera, capisce che il bersaglio è camuffato."},{"n":"Semipiano","lv":8,"sc":"Evocazione di 8º livello (Mago, Stregone, Warlock)","cl":"Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** S\n**Durata:** 1 ora\n\nL\u0027incantatore crea una porta d\u0027ombra di taglia Media su una superficie piatta e solida entro gittata che egli è in grado di vedere. La porta può essere aperta e chiusa, e conduce verso un semipiano che appare come una stanza vuota di legno o pietra (a scelta dell\u0027incantatore) ampia 9 metri in ogni dimensione.\n\nAl termine dell\u0027incantesimo, la porta scompare e gli oggetti al suo interno rimangono nel semipiano. Ciò si applica anche alle creature, a meno che non scelgano di venire spinte attraverso la porta mentre questa svanisce, atterrando prone sugli spazi liberi più vicini allo spazio occupato precedentemente dalla porta.\n\nOgni volta che lancia questo incantesimo, l\u0027incantatore può creare un nuovo semipiano o collegare la porta d\u0027ombra a un semipiano da lui creato con un lancio precedente di questo incantesimo. Inoltre, se l\u0027incantatore conosce la natura e i contenuti di un semipiano creato da un\u0027altra creatura lanciando questo incantesimo, può fare invece in modo che la porta d\u0027ombra si colleghi a quel semipiano."},{"n":"Serratura arcana","lv":2,"sc":"Abiurazione di 2º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (polvere d\u0027oro del valore di 25 mo o più, che viene consumata dall\u0027incantesimo)\n**Durata:** finché non viene dissolto\n\nToccando una porta, una finestra, un cancello, un contenitore o una botola, l\u0027oggetto viene sigillato magicamente per la durata dell\u0027incantesimo. L\u0027oggetto non può essere aperto tramite mezzi non magici. L\u0027incantatore e le creature da lui designate al momento del lancio dell\u0027incantesimo possono aprire e chiudere l\u0027oggetto nonostante la serratura. L\u0027incantatore può anche stabilire una parola d\u0027ordine che, una volta pronunciata entro 1,5 metri dall\u0027oggetto, lo mantiene aperto per 1 minuto."},{"n":"Servitore inosservato","lv":1,"sc":"Evocazione di 1º livello (Bardo, Mago, Warlock)","cl":"Bardo, Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** 18 metri\n**Componenti:** V, S, M (un pezzo di spago e di legno)\n**Durata:** 1 ora\n\nFino al termine di questo incantesimo, una forza Media invisibile, amorfa e priva di volontà propria svolge dei compiti semplici su ordine dell\u0027incantatore. Il servitore appare sul terreno in uno spazio libero entro gittata, ha CA 10, 1 punto ferita, Forza pari a 2 e non può attaccare. Se scende a 0 punti ferita, l\u0027incantesimo termina.\n\nUna volta in ogni suo turno, come azione bonus, l\u0027incantatore può ordinare mentalmente al servitore di spostarsi di un massimo di 4,5 metri e interagire con un oggetto. Esso può eseguire compiti semplici alla stregua di un umano, come portare oggetti, pulire, riparare, ripiegare abiti, accendere fuochi, servire pietanze e versare bevande. Una volta impartito il comando, il servitore svolge il compito al meglio delle sue capacità finché non lo porta a termine, poi attende l\u0027ordine successivo dell\u0027incantatore.\n\nSe l\u0027incantatore ordina al servitore di eseguire un compito che lo porta a più di 18 metri da lui, l\u0027incantesimo termina."},{"n":"Sfera al vetriolo","lv":4,"sc":"Invocazione di 4º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 45 metri\n**Componenti:** V, S, M (una goccia di bile)\n**Durata:** istantanea\n\nL\u0027incantatore indica un punto entro gittata e un globo luminescente di acido del diametro di 30 centimetri sfreccia verso quel punto, dove esplode in una sfera del raggio di 6 metri. Ogni creatura nell\u0027area effettua un tiro salvezza su Destrezza. Se lo fallisce, subisce 10d4 danni da acido e altri 5d4 danni da acido alla fine del suo turno successivo. In caso di successo, subisce soltanto la metà dei danni iniziali.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni iniziali aumentano di 2d4 per ogni slot di livello superiore al 4º."},{"n":"Sfera congelante","lv":6,"sc":"Invocazione di 6º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 90 metri\n**Componenti:** V, S, M (una sfera di cristallo in miniatura)\n**Durata:** istantanea\n\nUna sfera congelata sfreccia dall\u0027incantatore verso un punto a sua scelta entro gittata, dove esplode in una sfera di 18 metri di raggio. Ogni creatura in quell\u0027area effettua un tiro salvezza su Costituzione, subendo 10d6 danni da freddo in caso di fallimento, o la metà dei danni in caso di successo.\n\nSe la sfera colpisce uno specchio d\u0027acqua, congela l\u0027acqua fino a una profondità di 15 centimetri su un\u0027area quadrata con lato di 9 metri. Lo strato di ghiaccio dura 1 minuto. Le creature che stavano nuotando sulla superficie dell\u0027acqua ghiacciata rimangono intrappolate nel ghiaccio e sono trattenute. Per liberarsi, possono effettuare un\u0027azione per effettuare una prova di Forza (Atletica) contro la CD del tiro salvezza sull\u0027incantesimo.\n\nUna volta completato il lancio dell\u0027incantesimo, l\u0027incantatore può decidere di non scagliare la sfera. Così facendo, una sfera grande all\u0027incirca quanto un proiettile da fionda, freddo al tatto, compare nella sua mano. In qualsiasi momento, l\u0027incantatore o una creatura a cui l\u0027ha consegnata può lanciare la sfera (entro una gittata di 12 metri) o scagliarla con una fionda (entro la normale gittata della fionda). La sfera si infrange all\u0027impatto, con lo stesso effetto di un lancio normale dell\u0027incantesimo. Tuttavia, l\u0027incantatore può anche appoggiare la sfera a terra senza romperla. Dopo 1 minuto, se non è ancora stata infranta, la sfera esplode.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d6 per ogni slot di livello superiore al 6º."},{"n":"Sfera elastica","lv":4,"sc":"Abiurazione di 4º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S, M (una sfera di vetro)\n**Durata:** concentrazione, fino a 1 minuto\n\nUna sfera di forza scintillante racchiude una creatura o un oggetto di taglia Grande o inferiore entro gittata. Una creatura non consenziente deve superare un tiro salvezza su Destrezza, altrimenti viene rinchiusa nella sfera per la durata dell\u0027incantesimo. Nulla può attraversare la barriera in entrata e in uscita (oggetti fisici, energia o altri effetti magici), ma una creatura all\u0027interno può respirare liberamente. La sfera è immune a tutti i danni e una creatura o un oggetto all\u0027interno non può essere danneggiato dagli attacchi o dagli effetti che provengono dall\u0027esterno; analogamente, non può infliggere danni a qualsiasi cosa si trovi all\u0027esterno. La sfera non ha peso ed è grande quanto basta da contenere la creatura o l\u0027oggetto al suo interno. Una creatura rinchiusa può effettuare un\u0027azione per spingere le pareti della sfera e farla rotolare a una velocità massima pari alla metà della propria. Analogamente, la sfera può essere sollevata e mossa da altre creature.\n\nUn incantesimo disintegrazione distrugge la sfera senza danneggiare ciò che contiene."},{"n":"Sfera infuocata","lv":2,"sc":"Evocazione di 2º livello (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (una pallina di cera)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore crea una sfera di fuoco del diametro di 1,5 metri in uno spazio libero del terreno entro gittata che permane per la durata dell\u0027incantesimo. Ogni creatura che termina il suo turno entro 1,5 metri dalla sfera effettua un tiro salvezza su Destrezza; se lo fallisce, subisce 2d6 danni da fuoco, mentre se lo supera subisce soltanto la metà di quei danni.\n\nCome azione bonus, l\u0027incantatore può muovere la sfera per un massimo di 9 metri, facendola rotolare sul terreno. Se l\u0027incantatore muove la sfera nello spazio di una creatura, quella creatura effettua un tiro salvezza contro la sfera, che smette di muoversi per quel turno.\n\nQuando l\u0027incantatore muove la sfera, può dirigerla oltre le barriere alte fino a 1,5 metri e farla saltare oltre le fosse larghe fino a 3 metri. Se tocca oggetti infiammabili che non sono indossati o trasportati, la sfera li incendia proiettando luce intensa entro un raggio di 6 metri e luce fioca per altri 6 metri.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d6 per ogni slot di livello superiore al 2º."},{"n":"Sfocatura","lv":2,"sc":"Illusione di 2º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V\n**Durata:** concentrazione, fino a 1 minuto\n\nIl corpo dell\u0027incantatore diventa sfocato. Per la durata dell\u0027incantesimo, tutte le creature subiscono svantaggio ai tiri per colpire contro l\u0027incantatore. Un attaccante è immune a questo effetto se percepisce l\u0027incantatore con vista cieca o vista pura."},{"n":"Sguardo penetrante","lv":6,"sc":"Necromanzia di 6º livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nPer la durata dell\u0027incantesimo, gli occhi dell\u0027incantatore diventano neri e vacui. Una creatura a scelta dell\u0027incantatore entro 18 metri da lui e che l\u0027incantatore è in grado di vedere deve superare un tiro salvezza su Saggezza o essere influenzata da uno dei seguenti effetti a sua scelta per la durata dell\u0027incantesimo.\n\nIn ogni suo turno fino al termine dell\u0027incantesimo, l\u0027incantatore può usare un\u0027azione di Magia per bersagliare un\u0027altra creatura, non potendo tuttavia bersagliare di nuovo una creatura che abbia superato un tiro salvezza contro questo lancio dell\u0027incantesimo.\n\n**Addormentato.** Il bersaglio cade privo di sensi e si risveglia se subisce danni o se un\u0027altra creatura usa un\u0027azione per svegliarla scuotendola.\n\n**In preda al panico.** Il bersaglio è spaventato. In ogni suo turno, il bersaglio spaventato deve effettuare l\u0027azione Scatto e muoversi per allontanarsi dall\u0027incantatore lungo il percorso più sicuro e rapido possibile. Se il bersaglio si muove in un punto a più di 18 metri dall\u0027incantatore dove non è più in grado di vederlo, l\u0027effetto termina.\n\n**Nauseato.** Il bersaglio viene avvelenato."},{"n":"Silenzio","lv":2,"sc":"Illusione di 2º livello (Bardo, Chierico, Ranger)","cl":"Bardo, Chierico, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** 36 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore genera una sfera del raggio di 6 metri centrata su un punto a sua scelta situato entro gittata e, per la durata dell\u0027incantesimo, nessun suono può essere creato all\u0027interno di quella sfera o attraversarla. Ogni creatura o oggetto interamente all\u0027interno della sfera è immune ai danni da tuono e ogni creatura interamente all\u0027interno della sfera è assordata. All\u0027interno dell\u0027area è impossibile lanciare un incantesimo che includa una componente verbale."},{"n":"Simbolo","lv":7,"sc":"Abiurazione di 7º livello (Bardo, Chierico, Druido, Mago)","cl":"Bardo, Chierico, Druido, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** contatto\n**Componenti:** V, S, M (polvere di diamante del valore di 1.000 mo o più, che l\u0027incantesimo consuma)\n**Durata:** finché non viene dissolto o innescato\n\nL\u0027incantatore traccia un glifo nocivo su una superficie (come una sezione di pavimento o una parete) o all\u0027interno di un oggetto che può essere chiuso (come un libro o un forziere). Il glifo può coprire un\u0027area massima del diametro di 3 metri. Se l\u0027incantatore sceglie un oggetto, questo non deve essere spostato; se ciò avviene, una volta che l\u0027oggetto si allontana di più di 3 metri dal luogo in cui è stato lanciato l\u0027incantesimo, il glifo si infrange e l\u0027incantesimo termina senza essere innescato.\n\nIl glifo è quasi impercettibile e, per notarlo, è necessario superare una prova di Saggezza (Percezione) contro la CD del tiro salvezza sull\u0027incantesimo.\n\nQuando viene tracciato, l\u0027incantatore sceglie l\u0027innesco, oltre all\u0027effetto che scatenerà: morte, discordia, paura, dolore, sonno o stordimento. Ciascuno di essi è spiegato di seguito.\n\n**Programmare l\u0027innesco.** Quando questo incantesimo viene lanciato, l\u0027incantatore decide cosa innesca il glifo. Nel caso di glifi tracciati su una superficie, gli inneschi più comuni includono: toccare o camminare su di essi, rimuovere un altro oggetto che li copre o avvicinarsi a una certa distanza da loro. Nel caso di glifi tracciati all\u0027interno di un oggetto, gli inneschi più comuni includono aprire quell\u0027oggetto o vedere il glifo.\n\nL\u0027incantatore può perfezionare l\u0027innesco in modo che venga attivato solo da un certo tipo di creature (ad esempio, il glifo potrebbe essere programmato per influenzare le aberrazioni). Può inoltre impostare delle condizioni per evitare di innescare il glifo, come pronunciare una specifica parola d\u0027ordine.\n\nUna volta attivato, il glifo brilla, proiettando luce fioca in una sfera del raggio di 18 metri per 10 minuti, dopodiché l\u0027incantesimo termina. Ogni creatura all\u0027interno della sfera quando il glifo si attiva, oppure che entra nella sfera per la prima volta in un turno o termina il suo turno qui, ne subisce l\u0027effetto. Una creatura può essere presa di mira una sola volta per turno.\n\n**Discordia.** Ogni bersaglio effettua un tiro salvezza su Saggezza. Se lo fallisce, inizia a litigare con le altre creature per 1 minuto, durante il quale non è in grado di comunicare in modo significativo e subisce svantaggio ai tiri per colpire e alle prove di caratteristica.\n\n**Dolore.** Ogni bersaglio deve superare un tiro salvezza su Costituzione, altrimenti sarà incapacitato per 1 minuto.\n\n**Morte.** Ogni bersaglio effettua un tiro salvezza su Costituzione, subendo 10d10 danni necrotici in caso di fallimento, o la metà dei danni in caso di successo.\n\n**Paura.** Ogni bersaglio deve superare un tiro salvezza su Saggezza, altrimenti sarà spaventato per 1 minuto. Mentre è spaventato, il bersaglio deve allontanarsi di almeno 9 metri dal glifo in ogni suo turno, se ne è in grado.\n\n**Sonno.** Ogni bersaglio deve superare un tiro salvezza su Saggezza, altrimenti cade privo di sensi per 10 minuti. Una creatura si risveglia se subisce danni o se qualcuno usa un\u0027azione per scuoterla.\n\n**Stordimento.** Ogni bersaglio deve superare un tiro salvezza su Saggezza, altrimenti sarà stordito per 1 minuto."},{"n":"Simulacro","lv":7,"sc":"Illusione di 7º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 12 ore\n**Gittata:** contatto\n**Componenti:** V, S, M (polvere di rubino del valore di 1.500 mo o più, che l\u0027incantesimo consuma)\n**Durata:** finché non viene dissolto\n\nIl personaggio crea un simulacro di una bestia o un umanoide entro 3 metri da sé per l\u0027intera durata del lancio dell\u0027incantesimo. Il lancio termina toccando sia il bersaglio che un cumulo di ghiaccio o neve della sua stessa taglia. Quest\u0027ultimo diventa il simulacro, il quale è una creatura che utilizza le statistiche di gioco della controparte originale al momento del lancio, tranne per il fatto che è un costrutto, per cui ha la metà dei punti ferita massimi e non può lanciare questo incantesimo.\n\nIl simulacro è amichevole nei confronti dell\u0027incantatore e delle creature da lui indicate. Inoltre, obbedisce ai comandi che gli impartisce durante il suo turno in combattimento. Il simulacro non può né ottenere livelli né compiere riposi brevi o lunghi.\n\nSe subisce dei danni, l\u0027unico modo che il personaggio ha di ripristinare i suoi punti ferita è ripararlo mentre compie un riposo lungo, durante il quale consuma componenti del valore di 100 mo per ogni punto ferita ripristinato. Per poter eseguire la riparazione, il simulacro deve essere entro 1,5 metri dal personaggio.\n\nIl simulacro permane finché non scende a 0 punti ferita, nel qual caso si ritrasforma in neve e si scioglie. Se l\u0027incantatore lancia di nuovo questo incantesimo, il simulacro da lui creato in precedenza viene istantaneamente distrutto."},{"n":"Soffio del drago","lv":2,"sc":"Trasmutazione di 2º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** contatto\n**Componenti:** V, S, M (un peperoncino)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore tocca una creatura consenziente e sceglie acido, freddo, fulmine, fuoco, o veleno. Fino al termine dell\u0027incantesimo, il bersaglio può usare la sua azione di Magia per esalare un cono di 4,5 metri. Ogni creatura nell\u0027area effettua un tiro salvezza su Destrezza; se lo fallisce, subisce 3d6 danni del tipo scelto, mentre se lo supera subisce la metà di quei danni.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d6 per ogni slot di livello superiore al 2º."},{"n":"Sogno","lv":5,"sc":"Illusione di 5º livello (Bardo, Mago, Warlock)","cl":"Bardo, Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** speciale\n**Componenti:** V, S, M (una manciata di sabbia)\n**Durata:** 8 ore\n\nL\u0027incantatore bersaglia una creatura che conosce sullo stesso piano di esistenza. L\u0027incantatore o una creatura consenziente da lui toccata entra in uno stato di trance, assumendo il ruolo di messaggero onirico. Durante la trance, il messaggero è incapacitato e la sua velocità è pari a 0.\n\nSe il bersaglio dorme, il messaggero gli appare in sogno e può conversare con lui finché rimane addormentato e l\u0027incantesimo non termina. Il messaggero può anche modellare l\u0027ambiente del sogno, creando paesaggi, oggetti e altre immagini. Il messaggero può uscire dalla trance in ogni momento, terminando l\u0027incantesimo. Al suo risveglio, il bersaglio ricorda il sogno perfettamente.\n\nSe il bersaglio è sveglio quando l\u0027incantatore lancia l\u0027incantesimo, il messaggero ne è consapevole e può terminare la trance (e l\u0027incantesimo) o aspettare che il bersaglio si addormenti e così apparire nei suoi sogni.\n\nL\u0027incantatore può fare in modo che il messaggero appaia terrificante al bersaglio. In questo caso, il messaggero può trasmettere un messaggio di massimo dieci parole e poi il bersaglio effettua un tiro salvezza su Saggezza. In caso di fallimento, il bersaglio non ottiene alcun beneficio dal suo riposo e subisce 3d6 danni psichici al risveglio."},{"n":"Sonno","lv":1,"sc":"Ammaliamento di 1º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (un pizzico di sabbia o dei petali di rosa)\n**Durata:** concentrazione, fino a 1 minuto\n\nOgni creatura a scelta dell\u0027incantatore in una sfera dal raggio di 1,5 metri in una posizione entro gittata deve superare un tiro salvezza su Saggezza, altrimenti sarà incapacitata fino al termine del proprio turno successivo. A questo punto, dovrà ripetere la prova e, in caso di fallimento, cadrà priva di sensi per la durata dell\u0027incantesimo. L\u0027effetto svanisce se il bersaglio subisce danni o se qualcuno entro 1,5 metri da esso effettua un\u0027azione per scuoterlo e farlo tornare in sé.\n\nLe creature che non dormono, come gli elfi, o che sono immuni all\u0027indebolimento superano automaticamente i tiri salvezza contro l\u0027incantesimo."},{"n":"Sortilegio","lv":1,"sc":"Ammaliamento di 1º livello (Warlock)","cl":"Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** 27 metri\n**Componenti:** V, S, M (l\u0027occhio pietrificato di un tritone)\n**Durata:** concentrazione, fino a 1 ora\n\nL\u0027incantatore scaglia una maledizione su una creatura entro gittata che egli è in grado di vedere. Fino al termine dell\u0027incantesimo, l\u0027incantatore infligge 1d6 danni necrotici extra al bersaglio ogni volta che lo colpisce con un tiro per colpire. Inoltre, quando l\u0027incantatore lancia l\u0027incantesimo, sceglie una caratteristica. Il bersaglio subisce svantaggio alle prove di caratteristica effettuate con la caratteristica scelta.\n\nSe il bersaglio scende a 0 punti ferita prima del termine dell\u0027incantesimo, l\u0027incantatore può effettuare un\u0027azione bonus in un suo turno successivo per maledire un\u0027altra creatura.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La concentrazione dell\u0027incantatore può durare di più utilizzando uno slot incantesimo di 2º livello (fino a 4 ore), di 3º o 4º livello (fino a 8 ore) o di 5º livello o superiore (24 ore)."},{"n":"Spada arcana","lv":7,"sc":"Invocazione di 7º livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 27 metri\n**Componenti:** V, S, M (una spada in miniatura del valore di 250 mo o più)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore crea una spada spettrale che fluttua entro gittata e permane per tutta la durata dell\u0027incantesimo.\n\nQuando la spada appare, l\u0027incantatore può effettuare un attacco in mischia con questo incantesimo contro un bersaglio che si trova entro 1,5 metri dalla spada. Se il colpo va a segno, il bersaglio subisce 4d12 danni da forza più il modificatore di caratteristica da incantatore dell\u0027incantatore. Nei suoi turni successivi, l\u0027incantatore può effettuare un\u0027azione bonus per spostare la spada fino a 9 metri in un punto che è in grado di vedere e ripetere l\u0027attacco contro lo stesso bersaglio o uno diverso."},{"n":"Spostamento planare","lv":7,"sc":"Evocazione di 7º livello (Chierico, Druido, Mago, Stregone, Warlock)","cl":"Chierico, Druido, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (una verga di metallo biforcuta del valore di 250 mo o più e in sintonia con un piano di esistenza)\n**Durata:** istantanea\n\nL\u0027incantatore e un massimo di otto creature consenzienti, che si tengono per mano formando un cerchio, vengono trasportati su un piano di esistenza diverso. L\u0027incantatore può specificare la destinazione in termini generici, come una città specifica sul Piano Elementale del Fuoco o palazzo sul secondo livello dei Nove Inferi, apparendo in quella destinazione o nelle sue immediate vicinanze, in base alla scelta del GM.\n\nIn alternativa, se l\u0027incantatore conosce la sequenza di sigilli di un cerchio di teletrasporto su un altro piano di esistenza, questo incantesimo può portarlo fino a quel cerchio. Se il cerchio di teletrasporto è troppo piccolo per contenere tutte le creature trasportate dall\u0027incantatore, esse appariranno negli spazi liberi più vicini."},{"n":"Spruzzo colorato","lv":1,"sc":"Illusione di 1º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (un pizzico di sabbia colorata)\n**Durata:** istantanea\n\nL\u0027incantatore lancia un lampo abbagliante di luce multicolore. Ogni creatura entro un cono di 4,5 metri originato dall\u0027incantatore deve superare un tiro salvezza su Costituzione, altrimenti è accecata fino al termine del turno successivo dell\u0027incantatore."},{"n":"Spruzzo prismatico","lv":7,"sc":"Invocazione di 7º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** istantanea\n\nOtto raggi di luce si sprigionano dall\u0027incantatore in un cono di 18 metri. Ogni creatura presente nel cono effettua un tiro salvezza su Destrezza. Per ogni bersaglio, si tira 1d8 per determinare da quale raggio viene influenzato, consultando la tabella Raggi prismatici.\n\nRaggi prismatici\n1d8 Raggio\n1 Rosso. Tiro salvezza fallito: 12d6 danni da fuoco.\nTiro salvezza superato: la metà dei danni.\n2 Arancione. Tiro salvezza fallito: 12d6 danni da\nacido. Tiro salvezza superato: la metà dei danni.\n3 Giallo. Tiro salvezza fallito: 12d6 danni da fulmine.\nTiro salvezza superato: la metà dei danni.\n4 Verde. Tiro salvezza fallito: 12d6 danni da veleno.\nTiro salvezza superato: la metà dei danni.\n5 Blu. Tiro salvezza fallito: 12d6 danni da freddo. Tiro\nsalvezza superato: la metà dei danni.\n6 Indaco. Tiro salvezza fallito: il bersaglio è trattenuto ed effettua un tiro salvezza su Costituzione\nalla fine di ogni suo turno. Se lo supera per tre\nvolte, pone fine alla condizione. Se fallisce per tre\nvolte, resta pietrificato finché non viene liberato\nda un effetto come quello dell\u0027incantesimo ristorare superiore . Non è necessario che i tiri superati\no falliti siano consecutivi: si tiene semplicemente\nil conto di entrambi finché il bersaglio non ne\naccumula tre di un certo tipo.\n7 Viola. Tiro salvezza fallito: il bersaglio è accecato\ned effettua un tiro salvezza su Saggezza all\u0027inizio\ndel turno successivo dell\u0027incantatore. Se lo\nsupera, non è più accecato. Se lo fallisce, non\nè più accecato e viene teletrasportato su un altro\npiano di esistenza (a scelta del GM).\n8 Speciale. Il bersaglio viene colpito da due raggi.\nSi tira altre due volte, rilanciando i dadi se il risultato ottenuto è 8."},{"n":"Spruzzo velenoso","lv":0,"sc":"Trucchetto di Necromanzia (Druido, Mago, Stregone, Warlock)","cl":"Druido, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore spruzza una nebbia tossica contro una creatura entro gittata, effettuando un attacco a distanza con incantesimo contro il bersaglio. Se il colpo va a segno, il bersaglio subisce 1d12 danni da veleno.\n\n**Trucchetto potenziato.** I danni aumentano di 1d12 quando l\u0027incantatore raggiunge il 5º livello (2d12), l\u002711º livello (3d12) e il 17º livello (4d12)."},{"n":"Stregoneria esplosiva","lv":0,"sc":"Trucchetto di Invocazione (Stregone)","cl":"Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componente:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore proietta energia stregonesca verso una creatura o un oggetto entro gittata, effettuando un attacco a distanza con incantesimo contro il bersaglio. Se il colpo va a segno, il bersaglio subisce 1d8 danni di un tipo a scelta tra: acido, freddo, fuoco, fulmine, psichici, tuono o veleno.\n\nSe l\u0027incantatore ottiene il risultato 8 su un d8, può tirare un altro d8 e aggiungere il risultato ai danni. Quando lancia l\u0027incantesimo, l\u0027incantatore può aggiungere ai danni dell\u0027incantesimo un numero di d8 pari al suo modificatore di caratteristica da incantatore.\n\n**Trucchetto potenziato.** I danni di questo incantesimo aumentano di 1d8 quando l\u0027incantatore raggiunge il 5º livello (2d8), l\u002711º livello (3d8) e il 17º livello (4d8)."},{"n":"Stretta folgorante","lv":0,"sc":"Trucchetto di Invocazione (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S\n**Durata:** istantanea\n\nUn fulmine si sprigiona dall\u0027incantatore verso una creatura da lui toccata. Con questo incantesimo, l\u0027incantatore effettua un attacco in mischia contro il bersaglio. Se il colpo va a segno, il bersaglio subisce 1d8 danni da fulmine e non può effettuare attacchi di opportunità fino all\u0027inizio del proprio turno successivo.\n\n**Trucchetto potenziato.** I danni aumentano di 1d8 quando l\u0027incantatore raggiunge il 5º livello (2d8), l\u002711º livello (3d8) e il 17º livello (4d8)."},{"n":"Suggestione","lv":2,"sc":"Ammaliamento di 2º livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, M (una goccia di miele)\n**Durata:** concentrazione, fino a 8 ore\n\nL\u0027incantatore suggerisce un corso d\u0027azione da intraprendere (descritto con non più di 25 parole) a una creatura entro gittata che egli è in grado di vedere. Le creature devono essere in grado di comprendere l\u0027incantatore. Il suggerimento deve apparire realizzabile e non deve comportare nulla che infligga palesemente danni al bersaglio o ai suoi alleati. Per esempio, l\u0027incantatore potrebbe dire \"Prendi la chiave per il caveau del tesoro della setta e portamela\". Oppure \"Smetti di combattere, esci dalla biblioteca pacificamente e non tornare mai più\". Il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti rimane affascinato per la durata dell\u0027incantesimo o finché l\u0027incantatore o i suoi alleati non gli infliggono danni. Il bersaglio affascinato segue il suggerimento al meglio delle sue capacità. L\u0027attività suggerita può continuare per l\u0027intera durata, ma se può essere completata in un tempo più breve, l\u0027incantesimo termina e non ha più effetto sul bersaglio una volta portata a termine."},{"n":"Suggestione di massa","lv":6,"sc":"Ammaliamento di 6º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, M (una lingua di serpente)\n**Durata:** 24 ore\n\nL\u0027incantatore suggerisce un corso d\u0027azione da intraprendere (descritto con non più di 25 parole) a fino a dodici creature entro gittata che egli è in grado di vedere. Le creature devono essere in grado di comprendere l\u0027incantatore. Il suggerimento deve apparire realizzabile e non deve comportare nulla che infligga palesemente danni ai bersagli o ai loro alleati. Ad esempio, l\u0027incantatore potrebbe dire: \"Cammina fino al villaggio in fondo alla strada e aiuta gli abitanti a raccogliere le colture fino al tramonto\". Oppure potrebbe dire: \"Non è il momento della violenza. Getta le armi e balla! Fermati tra un\u0027ora\".\n\nOgni bersaglio deve superare un tiro salvezza su Saggezza, altrimenti rimane affascinato per la durata dell\u0027incantesimo o finché l\u0027incantatore o isuoi alleati non gli infliggono danni. Ogni bersaglio affascinato segue il suggerimento al meglio delle sue capacità. L\u0027attività suggerita può continuare per l\u0027intera durata, ma se può essere completata in un tempo più breve, l\u0027incantesimo termina e non ha più effetto sul bersaglio che completa l\u0027attività.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La durata aumenta con uno slot incantesimo di 7º livello (10 giorni), 8º livello
