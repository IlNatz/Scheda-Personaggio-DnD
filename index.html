 occupa: li lava, li copre, li chiama per nome anche quando nessuno lo sa. Sono i druidi del Cairn, discendenti di culti più vecchi della città, e hanno imparato a guardare la faccia più scura della natura, quella che marcisce, e a prenderne la forza. Fanno paura a chiunque li veda, ma sono tra le poche sentinelle che il continente abbia contro chi non sa restare morto._\n\n### Livello 3: Carezza del Cairn\n\nImpari il trucchetto _spruzzo velenoso_, che non conta nel numero dei trucchetti che conosci.\n\n### Livello 3: Forma del Cairn\n\nQuando assumi la Forma Selvatica, puoi trasformarla in una **Forma del Cairn**. Se lo fai, i tuoi PF massimi si riducono di un ammontare pari al tuo livello da druido fino al termine del tuo prossimo riposo lungo, e i PF temporanei che ottieni dalla Forma Selvatica sono il triplo del tuo livello da druido invece del normale. Finché sei nella Forma del Cairn:\n- sei un **non morto** invece di una bestia;\n- hai resistenza ai danni da freddo, necrotici e da veleno, e vulnerabilità ai danni radianti;\n- hai scurovisione entro 18 m;\n- i tuoi attacchi infliggono 1d6 danni extra, necrotici o da freddo, a tua scelta quando assumi la forma; i danni extra diventano 1d8 al 6° livello, 1d10 al 10° e 1d12 al 14°;\n- finché sei in luce fioca o nell\u0027oscurità, puoi usare l\u0027azione di Nascondersi come azione bonus.\n\n### Livello 6: Legame con i Morti\n\nHai vantaggio ai tiri salvezza per non diventare Spaventato. Inoltre hai sempre preparati gli incantesimi indicati qui sotto, ai livelli da druido indicati, e non contano nel numero degli incantesimi che puoi preparare.\n\n| Livello da druido | Incantesimi |\n|---|---|\n| 6 | _animare morti_, _parlare con i morti_ |\n| 7 | _avvizzimento_ |\n| 9 | _nube mortale_ |\n\n### Livello 10: Il Tumulo che Cammina\n\nPuoi spendere due usi di Forma Selvatica insieme per assumere la forma del **Tumulo che Cammina**, usando le sue statistiche (vedi sotto) al posto di quelle di una bestia. Tutte le altre regole della Forma Selvatica restano valide, compresi i PF temporanei, e puoi renderla anche una Forma del Cairn.\n\n### Livello 14: Signore delle Ossa\n\nQuando un non morto ti attacca, puoi usare la reazione e spendere uno slot incantesimo per provare a prenderne il controllo. Se il Grado di Sfida del non morto è pari o inferiore al livello dello slot speso, deve superare un tiro salvezza su Saggezza contro la CD dei tuoi incantesimi, altrimenti cade sotto il tuo controllo; se il Grado di Sfida è più alto, lo slot si spende senza effetto. I non morti con Intelligenza 10 o più hanno vantaggio al tiro salvezza.\n\nFinché resta entro 18 m da te, il non morto obbedisce a ordini telepatici di una o due parole, come _difendimi_, _attacca_, _aspetta qui_ o _trascina questo_. Senza ordini, o se non riesce a eseguirli, si limita a difendersi con l\u0027azione di Schivare, restando entro 18 m da te se può. Resta sotto il tuo controllo finché non viene distrutto, finché non sorge la luna piena o finché non usi di nuovo questo privilegio su un altro non morto. Se l\u0027effetto termina senza che sia distrutto, il non morto resta Incapacitato per un round, e poi diventa ostile.\n\nInoltre hai sempre preparati _cerchio di morte_ e _dito della morte_, che non contano nel numero degli incantesimi che puoi preparare e che per te sono incantesimi da druido. Puoi lanciarne uno dei due senza spendere uno slot, e recuperi l\u0027uso al termine di un riposo lungo.\n\n---\n\n\u003e [!statblock]\n\u003e ### Il Tumulo che Cammina\n\u003e *Non morto Grande, neutrale*\n\u003e\n\u003e **CA** 17 (armatura naturale) · **Iniziativa** +0 (10)\n\u003e **PF** 107 (12d10 + 36)\n\u003e **Velocità** 9 m\n\u003e\n\u003e | | | MOD | TS | | | MOD | TS | | | MOD | TS |\n\u003e |---|---|---|---|---|---|---|---|---|---|---|---|\n\u003e | **FOR** | 18 | +4 | +4 | **DES** | 10 | +0 | +0 | **COS** | 17 | +3 | +3 |\n\u003e | **INT** | 6 | −2 | −2 | **SAG** | 10 | +0 | +0 | **CAR** | 5 | −3 | −3 |\n\u003e\n\u003e **Vulnerabilità** radiante\n\u003e **Resistenze** necrotico; contundente, perforante e tagliente da attacchi non magici\n\u003e **Immunità** veleno; Avvelenato, Paralizzato, Pietrificato, Privo di sensi, Spaventato, Trattenuto\n\u003e **Sensi** scurovisione 18 m; Percezione passiva 10\n\u003e **Lingue** capisce le lingue che conosci, ma non parla\n\u003e **Grado di Sfida** 5 (1.800 PE; BC +3)\n\u003e\n\u003e Un ammasso di carcasse di animali, fango, rami, terriccio e ossa, alto il doppio di un uomo, che cammina come si trascina un sacco. È la morte che resta nei campi e nei boschi, presa e messa in piedi.\n\u003e\n\u003e #### Azioni\n\u003e\n\u003e **Multiattacco.** Il Tumulo effettua due attacchi di _Schianto_.\n\u003e\n\u003e **Schianto.** *Tiro per colpire in mischia:* +7, portata 1,5 m. *Colpito:* 13 (2d8 + 4) danni contundenti, e il bersaglio deve superare un tiro salvezza su Saggezza con CD 12, altrimenti è Spaventato fino alla fine del suo turno successivo.\n\u003e\n\u003e **Mucchio di Carcasse (Ricarica 4–6).** Il Tumulo si disfa in un mucchio di ossa, fango e detriti, e ottiene i benefici delle azioni di Disimpegno e di Schivare fino all\u0027inizio del suo turno successivo. Se in questa forma attraversa lo spazio di una creatura, quella deve superare un tiro salvezza su Forza con CD 16, altrimenti subisce 6 (1d4 + 4) danni contundenti e cade Prona.\n\n---"},{"cl":"Guerriero","n":"Soldato dell\u0027Ultima Marca","md":"_La Marca teneva le strade del continente quando c\u0027era ancora un Sole. Adesso ne resta una compagnia sola, l\u0027Ultima Marca, che gira le strade dietro un capitano con l\u0027elmo chiuso, e ne restano gli insegnamenti, passati da soldato a soldato nei villaggi dove la compagnia si è fermata. I soldati dell\u0027Ultima Marca stanno tra le cose della Notte e la gente dei villaggi, e non hanno paura dell\u0027occulto: hanno visto troppe volte quello che c\u0027è dall\u0027altra parte per stupirsene ancora._\n\n### Livello 3: L\u0027Ordine\n\nCon un\u0027azione bonus dai un ordine a te stesso e alla tua arma: scegli un\u0027arma che impugni e una creatura che vedi entro 9 m. Per 1 minuto, o finché non usi di nuovo questo privilegio, hai vantaggio ai tiri salvezza su Saggezza, e l\u0027arma scelta infligge alla creatura danni extra pari al tuo modificatore di Saggezza (minimo 1).\n\nSe la creatura è un non morto, un immondo o un\u0027aberrazione e scende a 0 PF mentre l\u0027Ordine è attivo, da qualunque attacco sia stata colpita, la tua determinazione ti rimette in piedi: puoi riempire una delle tue Fiasche vuote. Puoi riempire una Fiasca in questo modo una volta per riposo breve.\n\nPuoi usare questo privilegio un numero di volte pari al tuo modificatore di Saggezza (minimo 1), e recuperi gli usi spesi al termine di un riposo lungo.\n\n### Livello 7: Veglia\n\nQuando spendi Dadi Vita durante un riposo breve, recuperi 2 PF extra per ogni dado speso. Inoltre, finché sei Sanguinante, hai vantaggio alle prove di Saggezza (Percezione) e vedi le creature invisibili ed eteree entro 9 m da te.\n\n### Livello 10: Spirito d\u0027Acciaio\n\nHai vantaggio ai tiri salvezza per non diventare Affascinato o Spaventato. Inoltre, quando una creatura o una Paura ti infligge uno o più livelli di Indebolimento, ne subisci uno in meno.\n\n### Livello 15: Il Guanto Nero\n\nQuando usi _L\u0027Ordine_ puoi scegliere tutte le creature che vedi entro 9 m invece di una sola. Inoltre l\u0027arma scelta con l\u0027Ordine conta come magica e d\u0027argento, e i suoi danni ignorano le resistenze dei non morti, degli immondi e delle aberrazioni.\n\n### Livello 18: Spirito d\u0027Adamante\n\nSei immune alla condizione Spaventato. Inoltre, quando subisci uno o più livelli di Indebolimento, puoi usare la reazione per recuperare 10 PF per ogni livello subito.\n\n---"},{"cl":"Ladro","n":"Agente della Luna","md":"_Corrieri che portano lettere che nessun altro porterebbe, ladri che lavorano soltanto quando il cielo è sgombro, sopravvissuti che hanno imparato a leggere il buio come una mappa: gli Agenti della Luna non hanno una gilda, ma si riconoscono da come alzano gli occhi prima di uscire. Si sono legati a Selenar senza riti e senza parole, e lei li ricambia cambiando con loro a ogni fase. Lavorano sul confine tra il buio e la luce d\u0027argento, e su quel confine sono più a loro agio di chiunque._\n\n### Livello 3: Abbraccio della Luna\n\nOttieni un beneficio che dipende dalla fase maggiore della luna (vedi _Le fasi della luna_ in [[Le Sottoclassi della Notte]]):\n- **Piena.** La luna illumina la mente: hai vantaggio alle prove di Saggezza (Intuizione), Saggezza (Percezione) e Intelligenza (Indagare).\n- **Crescente.** La luna dà coraggio: hai vantaggio ai tiri per l\u0027iniziativa e ai tiri salvezza per non diventare Spaventato.\n- **Calante.** La luna protegge la vita: la tua velocità aumenta di 3 m, e hai un bonus di +1 a tutti i tiri salvezza.\n- **Nuova.** La luna ti nasconde: hai vantaggio alle prove di Destrezza (Furtività), Destrezza (Rapidità di Mano) e Carisma (Inganno).\n\n### Livello 3: Fama dell\u0027Agente\n\nGli Agenti della Luna sono temuti e rispettati. Ottieni competenza in un\u0027abilità a tua scelta tra Intimidire e Persuasione, e maestria in quell\u0027abilità.\n\n### Livello 9: Doni d\u0027Argento\n\nPuoi lanciare gli incantesimi indicati qui sotto, a seconda della fase maggiore della luna, senza spendere uno slot. Ogni incantesimo si può lanciare una volta, e recuperi gli usi al termine di un riposo lungo. Usi l\u0027Intelligenza come caratteristica da incantatore.\n\n| Fase maggiore | Incantesimi |\n|---|---|\n| Piena | _luminescenza_, _vedere invisibilità_ |\n| Crescente | _passo velato_, _raggio lunare_ |\n| Calante | _passare senza tracce_, _ristorare inferiore_ |\n| Nuova | _oscurità_, _paura_ |\n\n### Livello 13: Morte al Buio\n\nQuando usi l\u0027Attacco Furtivo contro un non morto, un immondo o un\u0027aberrazione, ogni dado di Attacco Furtivo che dà 1 o 2 conta come se avesse dato 3.\n\n### Livello 17: Luna Affilata\n\nFinché sei all\u0027aperto, sotto il cielo, in qualunque fase della luna, hai vantaggio ai tiri per colpire contro i non morti, gli immondi e le aberrazioni, e quando li colpisci con l\u0027Attacco Furtivo infliggi anche 3d6 danni radianti extra.\n\n---"},{"cl":"Mago","n":"Scuola delle Fasi","md":"_La Scuola delle Fasi studia l\u0027influenza della luna sulla magia. All\u0027Accademia ha sede nella torre dell\u0027osservatorio, dove gli astronomi misurano la luce che la luna perde a ogni decennio. I suoi studiosi legano ogni scuola di magia a una delle otto fasi, e imparano a usare la luce della luna e la forza con cui tira le maree, le menti e la terra. Tra gli studenti si scherza sul fatto che gli studiosi della luna piena siano i più affidabili e quelli della luna nuova i più pericolosi. Nessuno della Scuola ride, quando lo sente._\n\n### Livello 3: Studioso della Luna\n\nScegli una delle otto fasi della luna (vedi _Le fasi della luna_ in [[Le Sottoclassi della Notte]]). Ogni fase è legata a una scuola di magia:\n\n| Fase | Scuola |\n|---|---|\n| Luna nuova | Necromanzia |\n| Luna crescente | Invocazione |\n| Primo quarto | Evocazione |\n| Gibbosa crescente | Trasmutazione |\n| Luna piena | Abiurazione |\n| Gibbosa calante | Divinazione |\n| Ultimo quarto | Illusione |\n| Luna calante | Ammaliamento |\n\nL\u0027oro e il tempo che servono per copiare nel libro degli incantesimi un incantesimo della scuola legata alla tua fase si dimezzano. Ogni volta che sali di livello come mago puoi scegliere una fase diversa.\n\n### Livello 3: Seleniaco\n\nFinché sei all\u0027aperto, sotto il cielo, puoi usare un\u0027azione bonus per sintonizzarti con la luna. Scegli uno di questi effetti, che vale per il prossimo incantesimo che lanci prima della fine del tuo turno successivo: hai vantaggio al tiro per colpire dell\u0027incantesimo, oppure una creatura a tua scelta ha svantaggio al primo tiro salvezza contro di esso. Puoi farlo un numero di volte pari al tuo modificatore di Intelligenza (minimo 1), e recuperi gli usi spesi al termine di un riposo lungo.\n\nInoltre, finché la luna è nella fase che hai scelto, la CD dei tuoi incantesimi aumenta di 1.\n\n### Livello 6: Voce d\u0027Argento\n\nPuoi comunicare telepaticamente con qualunque creatura che sa parlare e che vedi entro 30 m. Non serve che conosca la tua lingua, ma deve conoscerne almeno una.\n\n### Livello 10: La Luna Addosso\n\nPorti la luna con te. Puoi usare _Seleniaco_ anche al chiuso, sotto un cielo coperto, o in posti dove la luce della luna non arriva.\n\n### Livello 14: Anima d\u0027Argento\n\nL\u0027armonia con la luna è completa. I benefici di _Studioso della Luna_ e di _Seleniaco_ valgono in qualunque fase della luna. Inoltre hai vantaggio ai tiri salvezza per mantenere la concentrazione sugli incantesimi della scuola legata alla tua fase.\n\n---"},{"cl":"Monaco","n":"Via dei Quattro Chiodi","md":"_I monaci dei Quattro Chiodi non hanno un monastero. Hanno un mosaico, e una disciplina che si tramandano in pochi, da maestro ad allievo, nel tempio vuoto di Solvoran. Ogni chiodo del mosaico è una tecnica segreta, e ogni tecnica si capisce soltanto dopo aver guardato abbastanza a lungo il chiodo a cui appartiene. Chi finisce l\u0027addestramento lascia il tempio e diventa un guerriero e un protettore, con la mente ferma davanti a qualunque cosa la Notte gli metta davanti._\n\n### Livello 3: Primo Chiodo · Il Mare Senza Fondo\n\nQuando colpisci una creatura con un attacco di _Raffica di Colpi_, puoi costringerla a superare un tiro salvezza su Saggezza contro la CD dei tuoi privilegi da monaco. Se lo fallisce, invece di subire i danni del colpo, viene spinta fuori dal tempo e dallo spazio, in un buio senza fondo dove è Incapacitata. Alla fine del suo turno successivo ricompare nel punto esatto da cui è sparita, o nel punto libero più vicino.\n\nSpingere qualcosa così lontano ti costa: quando una creatura fallisce il tiro salvezza, devi superare un tiro salvezza su Costituzione con CD pari a 10 + il Grado di Sfida della creatura (o il suo livello), altrimenti subisci un livello di Indebolimento. Puoi usare questa tecnica una volta per turno, e una creatura che è già stata spinta via non può esserlo di nuovo finché non termini un riposo breve o lungo.\n\n### Livello 6: Secondo Chiodo · La Montagna che Regge\n\nQuando scendi a 0 PF ma non muori sul colpo, puoi usare la reazione per spendere un qualunque numero di punti Concentrazione: recuperi 5 PF per ogni punto speso.\n\n### Livello 11: Terzo Chiodo · Il Ghiaccio che Si Spacca\n\nQuando colpisci un non morto, un immondo o un\u0027aberrazione con un colpo senz\u0027armi, gli infliggi 1d8 danni radianti extra.\n\n### Livello 17: Quarto Chiodo · Il Cuore che Batte\n\nQuando fallisci un tiro per colpire, un tiro salvezza o una prova di caratteristica, puoi spendere 10 punti Concentrazione per riuscire invece.\n\n---"},{"cl":"Paladino","n":"Giuramento delle Stagioni","md":"_Quando la gente saliva sui Colli di Vesper a girare la Ruota, c\u0027erano cavalieri a fare la guardia al santuario. Ne sono rimasti pochi, sparsi, e portano ancora i mantelli di pelliccia rossa dei loro maestri. Sono il braccio armato del culto della Ruota: i sacerdoti tengono in piedi le stagioni, i cavalieri le difendono. Dalle stagioni hanno imparato una cosa sola, che il fiume in piena, l\u0027incendio, la tempesta e il gelo non fanno distinzioni, e la usano contro quello che esce dal buio._\n\n### Livello 3: Incantesimi del Giuramento\n\nHai sempre preparati gli incantesimi indicati qui sotto, ai livelli da paladino indicati. Non contano nel numero degli incantesimi che puoi preparare.\n\n| Livello da paladino | Incantesimi |\n|---|---|\n| 3 | _mani brucianti_, _onda tonante_ |\n| 5 | _freccia acida di Melf_, _sfocatura_ |\n| 9 | _invocare il fulmine_, _protezione dall\u0027energia_ |\n| 13 | _muro di fuoco_, _tempesta di ghiaccio_ |\n| 17 | _colpo infuocato_, _evoca elementale_ |\n\n### Livello 3: Incanalare Divinità\n\nOttieni queste due opzioni di Incanalare Divinità.\n\n**Arma della Stagione.** Con un\u0027azione bonus avvolgi un\u0027arma che impugni nell\u0027energia di una stagione. Per 10 minuti, l\u0027arma aggiunge il tuo modificatore di Carisma (minimo 1) ai danni, e tutti i suoi danni diventano da fuoco, da fulmine, da tuono o da freddo, a tua scelta ogni volta che colpisci. L\u0027arma emette luce intensa in un raggio di 6 m e luce fioca per altri 6 m. L\u0027effetto termina prima se lo concludi con un\u0027azione bonus, se l\u0027arma non è più nelle tue mani o se cadi privo di sensi.\n\n**Venti Primordiali.** Con un\u0027azione alzi il simbolo sacro e chiami un vento antico. Scegli una delle stagioni:\n- **L\u0027Estate.** Un\u0027esplosione di fiamme ti avvolge. Ogni creatura a tua scelta entro 4,5 m deve superare un tiro salvezza su Destrezza contro la CD dei tuoi incantesimi, altrimenti subisce 3d6 danni da fuoco, o la metà se lo supera.\n- **L\u0027Inverno.** Appoggi la mano a terra e il gelo si allarga. Il terreno entro 4,5 m da te diventa terreno difficile fino all\u0027inizio del tuo turno successivo, e ogni creatura a tua scelta nell\u0027area deve superare un tiro salvezza su Costituzione, altrimenti subisce 2d8 danni da freddo.\n- **L\u0027Autunno.** Alzi il simbolo e il cielo risponde con i fulmini. Ogni creatura a tua scelta entro 4,5 m deve superare un tiro salvezza su Destrezza, altrimenti subisce 2d6 danni da fulmine e non può effettuare reazioni fino alla fine del suo turno successivo.\n- **La Primavera.** Il tuo grido rimbomba come il disgelo di un fiume. Ogni creatura a tua scelta entro 4,5 m deve superare un tiro salvezza su Forza, altrimenti subisce 2d6 danni da tuono e viene spinta di 3 m lontano da te; se è di taglia Grande o inferiore, cade anche Prona.\n\nI danni di tutte e quattro le stagioni aumentano di un dado all\u002711° livello.\n\n### Livello 7: Aura delle Stagioni\n\nLe creature ostili entro 3 m da te non beneficiano della resistenza ai danni da fuoco, da fulmine, da tuono e da freddo. Il raggio dell\u0027aura diventa 9 m al 18° livello.\n\n### Livello 15: Abbraccio delle Stagioni\n\nQuando una creatura ti colpisce con un attacco in mischia, subisce danni da fuoco, da fulmine, da tuono o da freddo, a tua scelta, pari al tuo modificatore di Carisma.\n\n### Livello 20: Guardiano dell\u0027Anno\n\nCon un\u0027azione bonus ti lasci attraversare dalle quattro stagioni insieme. Per 1 minuto:\n- hai resistenza ai danni da fuoco, da fulmine, da tuono e da freddo;\n- i tuoi attacchi con le armi infliggono 2d6 danni extra di uno di questi quattro tipi, a tua scelta ogni volta che colpisci;\n- all\u0027inizio di ognuno dei tuoi turni, ogni creatura ostile entro 3 m da te subisce 10 danni di uno di questi quattro tipi, a tua scelta;\n- la prima volta che scendi a 0 PF senza morire sul colpo, scendi invece a 1 PF.\n\nPuoi farlo una volta, e recuperi l\u0027uso al termine di un riposo lungo, oppure spendendo uno slot incantesimo di 5° livello.\n\n---"},{"cl":"Ranger","n":"Viandante dei Sonni","md":"_Viandanti dei Sonni si nasce. Sono bambini che vengono al mondo dormendo e aprono gli occhi soltanto al terzo sonno, e da grandi sognano posti in cui non sono mai stati, e poi li riconoscono. Vedono quello che agli altri sfugge, e da adulti cominciano a dare la caccia a chi fa patti con quello che non dovrebbe: streghe, incantatori, Avatar. Vivono quasi sempre da soli, ma in qualche angolo del continente ci sono piccoli circoli che addestrano i nuovi e si ritrovano per cacciare insieme._\n\n### Livello 3: Incantesimi del Viandante\n\nHai sempre preparati gli incantesimi indicati qui sotto, ai livelli da ranger indicati. Non contano nel numero degli incantesimi che puoi preparare.\n\n| Livello da ranger | Incantesimi |\n|---|---|\n| 3 | _protezione dal bene e dal male_ |\n| 5 | _vedere invisibilità_ |\n| 9 | _dissolvi magie_ |\n| 13 | _localizza creatura_ |\n| 17 | _blocca mostri_ |\n\n### Livello 3: Ramo Utile\n\nImpari il trucchetto _randello incantato_, che non conta nel numero dei trucchetti che conosci, e puoi lanciarlo su qualunque oggetto di origine vegetale lungo almeno un metro, come un ramo, una liana o una radice, che sia un\u0027arma o no. Sei competente nell\u0027arma improvvisata finché è sotto l\u0027effetto di _randello incantato_.\n\n### Livello 3: Fortuna della Luna\n\nQuando effettui una prova di caratteristica, un tiro per colpire o un tiro salvezza con svantaggio, puoi usare la reazione per trasformare una fonte di svantaggio in vantaggio, per quel tiro soltanto. Altre fonti di svantaggio possono annullare il vantaggio, come di solito. Puoi farlo un numero di volte pari al tuo modificatore di Saggezza (minimo 1), e recuperi gli usi spesi al termine di un riposo lungo.\n\n### Livello 7: Il Viaggio nel Sonno\n\nQuando dormi, anche fuori da un riposo lungo, puoi staccare la coscienza dal corpo, che resta privo di sensi per tutto il tempo. La tua coscienza compare nel mondo sotto forma di uno spirito con l\u0027aspetto di un piccolo animale a tua scelta tra quelli di _trova famiglio_, e può esplorare senza limiti di distanza, purché resti sullo stesso piano di esistenza.\n\nPuoi restare nella forma di spirito per 8 ore, o finché non concludi il viaggio con un\u0027azione. Quando lo concludi puoi tornare nel corpo e svegliarti. Se lo spirito si trova entro 1,5 km dal corpo, puoi invece teletrasportare il corpo dove si trova lo spirito: in questo caso devi superare un tiro salvezza su Costituzione con CD 15, altrimenti subisci un livello di Indebolimento. Puoi teletrasportarti in questo modo una volta, e recuperi l\u0027uso al termine di un riposo lungo. Un viaggio nel sonno non conta come riposo.\n\n### Livello 11: Cacciatore di Patti\n\nQuando una creatura lancia un incantesimo entro 18 m da te, puoi segnarla come tua **preda**. I tuoi attacchi con armi contro la preda aggiungono ai danni il tuo modificatore di Saggezza, hai vantaggio ai tiri salvezza contro i suoi incantesimi, i suoi incantesimi con tiro per colpire contro di te hanno svantaggio, e hai resistenza a tutti i danni che ti infligge. La preda resta segnata finché tu o lei non cadete privi di sensi. Puoi farlo una volta, e recuperi l\u0027uso al termine di un riposo lungo.\n\nSe la preda è un Avatar, ne vedi il Segno anche quando è nascosto.\n\n### Livello 15: Il Sonno dei Morti\n\nSai sempre se ci sono non morti entro 60 m da te, e in che direzione si trovano, con un\u0027approssimazione di un quarto di cerchio. Inoltre i non morti non possono sorprenderti, hai un bonus di +2 all\u0027iniziativa quando combatti contro di loro, hai resistenza ai danni necrotici, e nessun effetto può ridurre i tuoi PF massimi.\n\n---"},{"cl":"Stregone","n":"Sangue del Dio Ucciso","md":"_La magia innata degli stregoni fa paura a molti. C\u0027è chi li caccia dai villaggi e chi li considera il segno di una forza più vecchia di qualunque scuola. Gli stregoni del Sangue del Dio Ucciso portano dentro di sé il ferro della terra rossa e il calore che sale dal fondo del Ferrugo, dove il mondo ha ancora un cuore che batte. Sanno scatenare la magia caotica delle ossa della terra, e la loro è una delle magie più distruttive del continente. I minatori di Vaucel li rispettano, e non li vogliono in galleria._\n\n### Livello 3: Sangue di Ferro\n\nFinché non indossi armature, la tua Classe Armatura è pari a 12 + il tuo modificatore di Destrezza + metà del tuo modificatore di Carisma (arrotondato per difetto). Inoltre, quando lanci un incantesimo, ottieni PF temporanei pari al livello dell\u0027incantesimo (un trucchetto ne dà 1). I PF temporanei raddoppiano se sei sottoterra, in una grotta naturale o in un crepaccio.\n\n### Livello 3: Eco delle Gallerie\n\nHai vantaggio alle prove di Saggezza (Percezione) basate sull\u0027udito, e se sei sottoterra, in una grotta naturale o in un crepaccio, raddoppi il tuo bonus di competenza per queste prove. Inoltre impari il trucchetto _messaggio_, che non conta nel numero dei trucchetti che conosci, e puoi lanciarlo attraverso la roccia fino a 36 m, purché il bersaglio sia sottoterra o tocchi la roccia viva.\n\n### Livello 6: Spinta della Roccia\n\nQuando lanci un incantesimo che ha un tempo di lancio di un\u0027azione, puoi effettuare un attacco con incantesimo in mischia come azione bonus. L\u0027attacco infligge 1d8 danni da forza, più 1 danno per ogni livello dell\u0027incantesimo lanciato (un trucchetto conta come livello 0).\n\nSe l\u0027attacco colpisce, puoi spendere da 1 a 3 punti stregoneria per scatenare la forza della terra, scegliendo un\u0027opzione diversa per ogni punto speso:\n- l\u0027attacco infligge danni extra pari al tuo modificatore di Carisma;\n- ogni altra creatura entro 1,5 m dal bersaglio, tu escluso, subisce danni da forza pari al tuo modificatore di Carisma, più 1 per ogni livello dell\u0027incantesimo;\n- il bersaglio cade Prono, e la sua velocità diventa 3 m fino alla fine del suo turno successivo;\n- ottieni un bonus di +2 alla CA e ai tiri salvezza fino all\u0027inizio del tuo turno successivo;\n- il bersaglio non può effettuare reazioni e ha una penalità di −2 alla CA fino all\u0027inizio del suo turno successivo.\n\n### Livello 14: Cuore di Pietra\n\nOttieni competenza nei tiri salvezza su Saggezza. Inoltre, finché hai almeno 1 punto stregoneria, sei immune alle condizioni Affascinato e Spaventato.\n\n### Livello 18: Ritorno nel Ventre\n\nQuando scendi a 0 PF, oppure quando spendi il tuo ultimo slot incantesimo di 4° livello o superiore, puoi usare la reazione per farti inghiottire dalla terra: ti teletrasporti in una grotta sicura, isolata e disabitata entro 10 km. Non devi conoscerne la posizione, né sapere che esiste, ma puoi scegliere come destinazione una grotta in cui sei già stato. Arrivi con PF pari alla metà dei tuoi PF massimi, se ne avevi di meno, perché la terra ti richiude le ferite mentre ti porta. Puoi farlo una volta, e recuperi l\u0027uso al termine di un riposo lungo.\n\n---"},{"cl":"Warlock","n":"Patrono della Notte","md":"_La Notte non è un dio, e non vuole quello che vogliono gli dèi. Vuole che il mondo smetta, del tutto, e il suo warlock vive in quel mondo. Qualcuno ci arriva perché la Notte era l\u0027unica cosa che rispondeva, qualcuno per paura, qualcuno per orgoglio. Il patto funziona: il buio lo lascia stare, le cose che ci vivono gli passano accanto senza toccarlo. Ma ogni luna la Notte chiede un passo in più verso di sé, e quella strada va in una direzione sola._\n\n### Livello 3: Incantesimi della Notte\n\nHai sempre preparati gli incantesimi indicati qui sotto, ai livelli da warlock indicati. Non contano nel numero degli incantesimi che puoi preparare.\n\n| Livello da warlock | Incantesimi |\n|---|---|\n| 3 | _cecità/sordità_, _individuazione del bene e del male_, _protezione dai veleni_, _vita falsa_ |\n| 5 | _animare morti_, _parlare con i morti_ |\n| 7 | _invisibilità superiore_, _tentacoli neri di Evard_ |\n| 9 | _guscio anti-vita_, _nube mortale_ |\n\n### Livello 3: Il Freddo della Notte\n\nImpari il trucchetto _tocco gelido_, che non conta nel numero dei trucchetti che conosci.\n\n### Livello 3: Abituato al Buio\n\nFinché hai almeno uno slot incantesimo da warlock non speso, hai scurovisione entro 36 m, vedi normalmente nell\u0027oscurità magica, e capisci la lingua che parlano le creature della Notte, anche quando non hanno una lingua.\n\n### Livello 6: Tollerato dal Buio\n\nFinché hai almeno uno slot incantesimo da warlock non speso, il buio ti riconosce. Quando un non morto, un immondo o un\u0027aberrazione prova ad attaccarti per la prima volta, deve superare un tiro salvezza su Saggezza contro la CD dei tuoi incantesimi, altrimenti sceglie un altro bersaglio o perde l\u0027attacco, e non può attaccarti fino alla fine del suo turno successivo. Se lo supera, per lei l\u0027effetto finisce fino al termine del tuo prossimo riposo lungo. L\u0027effetto finisce, per una creatura, anche se la attacchi o se lanci un incantesimo che la prende come bersaglio o la include nella sua area.\n\n### Livello 10: Morte alla Morte\n\nFinché hai almeno uno slot incantesimo da warlock non speso, aggiungi il tuo modificatore di Carisma al primo tiro per i danni che effettui in ognuno dei tuoi turni contro un non morto, un immondo o un\u0027aberrazione.\n\n### Livello 14: L\u0027Ultimo Brandello\n\nFinché hai almeno uno slot incantesimo da warlock non speso, quando scendi a 0 PF senza morire sul colpo puoi spendere quello slot per scendere invece a 1 PF: la Notte ti tiene in piedi, e per un istante tutti quelli che ti guardano vedono il buio che ti esce dalle ferite. Puoi farlo una volta, e recuperi l\u0027uso al termine di un riposo lungo.\n\n---"},{"cl":"Warlock","n":"Patrono di Lirvanne","md":"_Lirvanne, la Levatrice Verde, era la stagione delle nascite, del disgelo e dell\u0027acqua che torna a correre. Adesso la si prega senza saperlo, sotto il nome della Vergine del Fiume, e ogni anno si fa più debole. A pochi ha offerto un patto: dà loro quello che le resta, la forza che fa spaccare il seme e chiudere le ferite, e loro la portano in giro per il mondo come si porta una brace in una lanterna. Un warlock della Primavera cura, fa crescere, resiste, e quando serve si veste della terra stessa._\n\n### Livello 3: Incantesimi di Lirvanne\n\nHai sempre preparati gli incantesimi indicati qui sotto, ai livelli da warlock indicati. Non contano nel numero degli incantesimi che puoi preparare.\n\n| Livello da warlock | Incantesimi |\n|---|---|\n| 3 | _cura ferite_, _intralciare_, _preghiera di guarigione_, _ristorare inferiore_ |\n| 5 | _crescita vegetale_, _parola guaritrice di massa_ |\n| 7 | _insetto gigante_, _tempesta di ghiaccio_ |\n| 9 | _passo arboreo_, _reincarnazione_ |\n\n### Livello 3: La Mano della Levatrice\n\nImpari il trucchetto _salvare i morenti_, che non conta nel numero dei trucchetti che conosci.\n\n### Livello 3: Vitalità che Non Finisce\n\nHai vantaggio ai tiri salvezza contro la morte. Inoltre, quando spendi Dadi Vita durante un riposo breve, recuperi PF extra pari al tuo modificatore di Carisma per ogni dado speso.\n\n### Livello 6: Un Filo di Speranza\n\nQuando lanci un incantesimo di 1° livello o superiore, puoi spendere un Dado Vita e recuperare PF come se lo avessi speso durante un riposo breve.\n\n### Livello 10: Fonte della Vita\n\nQuando spendi un Dado Vita e il risultato del dado è 1 o 2, il dado non conta come speso, ma recuperi lo stesso i PF.\n\n### Livello 14: Lacrime della Terra che Muore\n\nCon un\u0027azione bonus diventi per 1 minuto un recipiente della forza che resta alla tua stagione. Ti copri della materia del posto in cui ti trovi, erba, terra, fango, ma anche acqua, neve o ghiaccio, e diventi una creatura simile a un elementale. Per la durata:\n- la tua taglia diventa Grande;\n- la tua Forza diventa 16, se non era già più alta;\n- hai resistenza ai danni contundenti, perforanti, taglienti, da fuoco, da freddo, da tuono e da fulmine;\n- ottieni velocità di scavare, scalare, nuotare e volare pari alla tua velocità a piedi;\n- puoi effettuare attacchi di _Schianto_ in mischia, con portata 3 m, che infliggono 2d8 danni contundenti più il tuo modificatore di Forza e contano come magici.\n\nQuando lanci un incantesimo di 1° livello o superiore con un tempo di lancio di un\u0027azione, puoi effettuare un attacco di _Schianto_ come azione bonus. Puoi usare questo privilegio una volta, e recuperi l\u0027uso al termine di un riposo lungo.\n\n---"},{"cl":"Warlock","n":"Patrono di Selenar","md":"_Selenar è l\u0027ultima luce del cielo, e regge da sola quello che una volta si reggeva in due. Ha poco tempo e pochissima voglia di ascoltare, e quasi nessuna preghiera la raggiunge. Quelle poche che arrivano ricevono una risposta fredda e generosa: il warlock della Luna impara a stare lontano da tutto, come lei, a non sentire il freddo, a saltare lo spazio come la luce salta da una nuvola all\u0027altra, a sapere ogni volta una cosa diversa._\n\n### Livello 3: Incantesimi di Selenar\n\nHai sempre preparati gli incantesimi indicati qui sotto, ai livelli da warlock indicati. Non contano nel numero degli incantesimi che puoi preparare.\n\n| Livello da warlock | Incantesimi |\n|---|---|\n| 3 | _caduta morbida_, _presagio_, _raggio lunare_, _spruzzo colorato_ |\n| 5 | _chiaroveggenza_, _intermittenza_ |\n| 7 | _libertà di movimento_, _sfera elastica di Otiluke_ |\n| 9 | _cono di freddo_, _legame telepatico di Rary_ |\n\n### Livello 3: Luce della Luna\n\nImpari il trucchetto _luci danzanti_, che non conta nel numero dei trucchetti che conosci. Le luci che crei hanno il colore della luna, e chi le guarda a lungo ha l\u0027impressione che lo guardino a loro volta.\n\n### Livello 3: Coscienza della Luna\n\nAl termine di ogni riposo breve o lungo, scegli un\u0027abilità: ne ottieni la competenza e la maestria finché non usi di nuovo questo privilegio. La luna cambia, e cambia quello che ti mostra.\n\n### Livello 6: Il Salto della Luce\n\nQuando lanci un incantesimo di 1° livello o superiore nel tuo turno, per il resto del turno puoi teletrasportarti invece di muoverti normalmente. La distanza percorsa con il teletrasporto conta come movimento, e puoi alternare quanti teletrasporti brevi vuoi al movimento normale, purché il totale non superi la tua velocità.\n\n### Livello 10: Corpo Distante\n\nHai resistenza ai danni da freddo, necrotici e radianti.\n\n### Livello 14: Lontana come il Cielo\n\nQuando un incantesimo di 3° livello o inferiore ti prende come bersaglio, o ti include nella sua area, puoi usare la reazione per ignorarne gli effetti. Se l\u0027incantesimo ha una durata, gli effetti ti ignorano fino alla fine del tuo turno successivo. Puoi farlo una volta, e recuperi l\u0027uso al termine di un riposo lungo.\n\n---"}],"patti":[{"n":"Il Patto del Buio","paura":"Il Buio","car":"SAG","tributo":"Lasciare qualcuno al buio, con quello che c\u0027è dentro.\n- Spegnere l\u0027ultima luce di qualcuno, in un posto da cui non sa uscire, e restargli vicino senza farsi sentire.\n- Chiudere un bambino in una stanza nera, e muovere qualcosa nell\u0027angolo.\n- Far sì che qualcuno abbia paura di aprire gli occhi.\n- Rubare a un villaggio l\u0027olio per l\u0027inverno.\n\n**Lo tradisce** accendere una luce dove non c\u0027era, confortare chi ha paura del buio, conservare con cura candele e olio, e soprattutto accendere una candela per qualcuno dicendone il nome (vedi [[Il Buio]]).","segno":"Le pupille si allargano e non si stringono più. Poi l\u0027ombra si fa più scura e più lunga di quanto la luce permetterebbe, e a volte si muove un istante dopo il corpo. Ai Gradi alti gli occhi diventano interamente neri, e intorno a un Avatar del Buio le fiamme si abbassano da sole, come se avessero freddo.","gradi":[{"g":"I","n":"Sfiorato","inc":"Braccia di Hadar","dn":"Gli Occhi del Buio","dt":"Hai scurovisione entro 36 m, e vedi normalmente nell\u0027oscurità magica entro 18 m. Finché sei in luce fioca o al buio hai vantaggio alle prove di Destrezza (Furtività). Una volta per turno, quando colpisci una creatura che non può vederti, le infliggi 1d8 danni necrotici in più, o 2d8 dal Grado III.","pn":"La Luce Punge","pt":"In luce intensa hai svantaggio ai tiri per colpire e alle prove di Saggezza (Percezione) basate sulla vista. Basta il cerchio di una torcia o di una lanterna."},{"g":"II","n":"Segnato","inc":"Oscurità","dn":"Spegnere","dt":"Con un\u0027azione bonus spegni tutte le luci non magiche entro 9 m da te. Con un\u0027azione fai scendere il buio sugli occhi di una creatura che si trova in luce fioca o al buio entro 18 m: deve superare un tiro salvezza su Saggezza contro la CD del patto, altrimenti è Accecata per 1 minuto, e all\u0027inizio di ogni suo turno subisce 2d6 danni psichici, perché nel buio qualcosa la tocca. Ripete il tiro salvezza alla fine di ogni suo turno. Puoi usare questa seconda parte un numero di volte pari al tuo bonus di competenza.","pn":"Il Raggio","pt":"Hai vulnerabilità ai danni radianti."},{"g":"III","n":"Servitore","inc":"Fame di Hadar","dn":"Ciò che Sta nel Buio","dt":"Finché sei in luce fioca o al buio, i tiri per colpire contro di te hanno svantaggio, e puoi usare l\u0027azione Nascondersi come azione bonus. Con un\u0027azione bonus puoi entrare in un\u0027ombra e uscire da un\u0027altra che vedi entro 18 m. Puoi usare questo passaggio un numero di volte pari al tuo bonus di competenza.","pn":"La Candela per Nome","pt":"Una candela accesa per qualcuno, con il suo nome detto ad alta voce, ti ferisce. Entro 9 m da lei non puoi usare i Doni né gli incantesimi del patto, e hai svantaggio ai tiri salvezza. A Dalewick ce n\u0027è una a ogni finestra."},{"g":"IV","n":"Avatar","inc":"Tentacoli Neri di Evard","dn":"La Coperta","dt":"Con un\u0027azione ti avvolgi in una sfera di oscurità magica di 9 m di raggio, centrata su di te e che si sposta con te, per 1 minuto, finché mantieni la concentrazione. Tu vedi normalmente al suo interno, e con un\u0027azione bonus puoi spostarti in qualunque punto libero della sfera. Ogni creatura ostile che inizia il turno nella sfera deve superare un tiro salvezza su Saggezza contro la CD del patto, altrimenti subisce 4d10 danni necrotici, o metà se lo supera, e finché resta nella sfera ha svantaggio ai tiri per colpire. Puoi usare questo Dono una volta per riposo breve.","pn":"La Luce Viva","pt":"Entro 3 m da una fiamma viva, o in una luce magica intensa, hai svantaggio ai tiri per colpire e ai tiri salvezza, e all\u0027inizio di ogni tuo turno subisci 1d6 danni radianti."},{"g":"V","n":"Manifestazione","inc":"—","dn":"Spegnere il Mondo","dt":"Sei immune ai danni necrotici, e al buio sei Invisibile. Una volta per riposo lungo, con un\u0027azione, spegni ogni luce non magica entro 1,5 km da te, e per 1 ora nessuna luce non magica si può accendere nell\u0027area; la luce magica, per la stessa ora, diventa fioca.","pn":"La Notte che Resta","pt":"Non sopporti più nessuna luce: in luce intensa sei Accecato. Alla fine dell\u0027arco che stai giocando il personaggio si lascia coprire, e da quel momento è del Master."}]},{"n":"Il Patto del Massacro","paura":"Il Massacro","car":"CAR","tributo":"Portare la violenza dove nessuno se l\u0027aspettava.\n- Cominciare un massacro durante una festa, una tregua, un funerale, e guardare la faccia di chi non ci credeva.\n- Far combattere tra loro persone che non lo volevano, finché non smettono di ricordare perché.\n- Colpire, di colpo, senza ragione, davanti a testimoni che da quel momento non dormiranno più tranquilli.\n\n**Lo tradisce** rifiutare un combattimento offerto, curare i feriti invece di combattere, stringere un patto di pace, disarmare un nemico senza ucciderlo (vedi [[Il Massacro]]).","segno":"Prima le mani tremano, sempre, finché non stringono un\u0027arma. Poi nelle orecchie entra un battito di tamburo che non smette, e addosso resta un odore di ferro. Ai Gradi alti chi sta vicino a un Avatar del Massacro sente la musica anche lui, e si accorge di avere le mani chiuse a pugno.","gradi":[{"g":"I","n":"Sfiorato","inc":"Sussurri Dissonanti","dn":"La Musica","dt":"Hai vantaggio ai tiri di iniziativa. Una volta per turno, quando colpisci una creatura con un attacco, le infliggi 1d8 danni in più dello stesso tipo dell\u0027arma. Quando riduci una creatura a 0 PF, ottieni PF temporanei pari al tuo livello.","pn":"Il Rumore","pt":"Non sai muoverti in silenzio: hai svantaggio alle prove di Destrezza (Furtività), e nessuna creatura può essere Sorpresa da te o da un gruppo di cui fai parte."},{"g":"II","n":"Segnato","inc":"Arma Spirituale","dn":"La Furia del Macellaio","dt":"Con un\u0027azione bonus entri in furia per 1 minuto. Finché dura hai vantaggio alle prove e ai tiri salvezza su Forza, resistenza ai danni contundenti, perforanti e taglienti, e i tuoi attacchi con le armi infliggono 3 danni in più, o 4 dal Grado IV. La furia non si somma all\u0027Ira del barbaro: se le hai tutte e due, scegli quale usare. Puoi usare questo Dono un numero di volte pari al tuo bonus di competenza.","pn":"La Forza","pt":"Hai vulnerabilità ai danni da forza."},{"g":"III","n":"Servitore","inc":"Manto del Crociato","dn":"Il Contagio del Sangue","dt":"Quando riduci una creatura a 0 PF, puoi fare un attacco con un\u0027arma come azione bonus, e ogni creatura entro 9 m che ti vede deve superare un tiro salvezza su Saggezza contro la CD del patto, altrimenti nel suo turno successivo usa l\u0027azione per attaccare la creatura più vicina, amica o nemica. Puoi usare il contagio un numero di volte pari al tuo bonus di competenza.","pn":"Niente Pace","pt":"Non riesci a offrire la pace: non puoi essere tu a proporre una tregua o una resa, e se ne accetti una proposta da altri hai svantaggio a tutti i tiri fino al tuo riposo lungo successivo. Finché ci sono creature ostili che puoi vedere, non puoi usare l\u0027azione Disimpegno."},{"g":"IV","n":"Avatar","inc":"Confusione","dn":"Nessuno Smette","dt":"Finché sei in furia non puoi essere Affascinato né Spaventato, e quando usi l\u0027azione Attacco puoi fare un attacco in più. Una volta per furia, quando scendi a 0 PF senza morire, scendi invece a 1 PF.","pn":"Nessuna Mano Amica","pt":"Finché dura uno scontro, le cure degli altri non ti fanno recuperare PF: guarisci soltanto quando la musica tace. Quando non sei in furia, hai svantaggio ai tiri salvezza su Saggezza."},{"g":"V","n":"Manifestazione","inc":"—","dn":"La Musica del Sangue","dt":"Una volta per riposo lungo, con un\u0027azione bonus, fai suonare la musica per 1 minuto in un\u0027area di 18 m di raggio intorno a te. Ogni creatura nell\u0027area, amica o nemica, ha vantaggio ai tiri per colpire, e anche i tiri per colpire contro di lei hanno vantaggio. Ogni volta che colpisci una creatura, recuperi PF pari al tuo bonus di competenza.","pn":"La Guerra","pt":"La musica non smette più. Alla fine dell\u0027arco che stai giocando il personaggio segue la nota fino a una guerra che non finisce, e da quel momento è del Master."}]},{"n":"Il Patto del Sepolto","paura":"Il Sepolto","car":"SAG","tributo":"Far sentire a qualcuno la stretta, fino a quando capisce che non uscirà.\n- Chiudere qualcuno in una cantina, in un baule, in una cella, e restare dall\u0027altra parte della porta ad ascoltarlo.\n- Seppellire un uomo fino al collo, e lasciarlo lì il tempo necessario.\n- Stringere qualcuno in un debito che non potrà mai pagare, e farglielo capire.\n- Far crollare una galleria su chi ci sta dentro, e sentire le unghie sulla pietra.\n\n**Lo tradisce** lasciare andare ciò che si possiede, liberare un prigioniero, accettare un addio, restare a lungo sotto un cielo aperto (vedi [[Il Sepolto]]).","segno":"La pelle si fa fredda e un poco umida, come una pietra di cantina, e sotto le unghie resta terra che non si lava. Poi la voce comincia ad arrivare da più lontano, come dal fondo di un pozzo, e gli occhi si scuriscono finché la sclera non diventa grigia. Ai Gradi alti chi parla con un Avatar del Sepolto sente il petto pesante, abbassa la voce senza sapere perché, e fa fatica ad alzarsi per andarsene.","gradi":[{"g":"I","n":"Sfiorato","inc":"Intralciare","dn":"La Terra Ricorda","dt":"Hai percezione tellurica entro 9 m e scurovisione entro 18 m, o 18 m in più se l\u0027avevi già. Finché tocchi il terreno non puoi essere spinto, trascinato né reso Prono contro la tua volontà. Puoi trattenere il respiro per 1 ora. Una volta per turno, quando colpisci una creatura con un attacco, la terra le si stringe intorno alle caviglie: la sua velocità diminuisce di 3 m fino all\u0027inizio del tuo turno successivo.","pn":"Le Tasche Piene","pt":"Non riesci a lasciare andare niente. Addosso hai sempre sassi, chiavi di porte che non esistono più, lettere, ossa: la tua velocità diminuisce di 1,5 m e la tua capacità di trasporto si dimezza. Un oggetto che possiedi da più di una luna non puoi venderlo, regalarlo né abbandonarlo: puoi soltanto perderlo, o fartelo togliere."},{"g":"II","n":"Segnato","inc":"Blocca Persone","dn":"La Mano sotto la Sabbia","dt":"Hai resistenza ai danni contundenti. Con un\u0027azione bonus fai aprire il terreno sotto una creatura che puoi vedere entro 18 m, purché sia su terra, sabbia o pietra. La creatura deve superare un tiro salvezza su Forza contro la CD del patto, altrimenti affonda fino alla vita, subisce 3d8 danni contundenti e diventa Trattenuta; se lo supera subisce metà dei danni e non affonda. Con un\u0027azione può tentare di liberarsi con una prova di Forza (Atletica) contro la CD del patto. Puoi usare questo Dono un numero di volte pari al tuo bonus di competenza.","pn":"Il Tuono","pt":"Hai vulnerabilità ai danni da tuono. Quando non ci sono muri né tetti entro 30 m da te, hai svantaggio ai tiri di iniziativa e ai tiri salvezza per mantenere la concentrazione."},{"g":"III","n":"Servitore","inc":"Lentezza","dn":"Nessuno Se Ne Va","dt":"Hai una velocità di scavare pari a metà della tua velocità, nella terra e nella pietra non lavorata, e non ti lasci dietro gallerie. Le creature ostili che iniziano il turno entro 4,5 m da te dimezzano la velocità fino alla fine del turno, e non possono usare l\u0027azione Disimpegno. Quando una di loro si allontana da te, puoi usare la reazione per costringerla a superare un tiro salvezza su Forza contro la CD del patto, altrimenti diventa Trattenuta fino alla fine del tuo turno successivo.","pn":"Il Sonno Chiuso","pt":"Un riposo lungo ti dà i suoi benefici soltanto se lo passi sottoterra o sotto un tetto di pietra. Sotto una tenda o sotto il cielo ti svegli come se non avessi dormito, e con un livello di Indebolimento. Hai svantaggio ai tiri salvezza su Destrezza: la terra ti tiene anche quando dovresti scappare."},{"g":"IV","n":"Avatar","inc":"Pelle di Pietra","dn":"La Cassa","dt":"Hai resistenza anche ai danni perforanti e taglienti. Con un\u0027azione chiudi una creatura Grande o più piccola che puoi vedere entro 18 m in una cassa di pietra che sale dal terreno. La creatura deve superare un tiro salvezza su Forza contro la CD del patto. Se lo fallisce subisce 6d10 danni contundenti ed è chiusa nella cassa: è Accecata e Trattenuta, non può respirare, e all\u0027inizio di ogni suo turno subisce 3d10 danni contundenti. Alla fine di ogni suo turno ripete il tiro salvezza, e se lo supera la cassa si spacca. Dall\u0027esterno la si apre infliggendole 60 danni (CA 17). Se supera il primo tiro salvezza subisce metà dei danni e non viene chiusa. Puoi usare questo Dono due volte, e recuperi gli usi spesi al termine di un riposo lungo.","pn":"Pesante","pt":"Pesi come la pietra, tre volte quanto dovresti. Non puoi nuotare: in acqua profonda affondi, e risalire ti costa il triplo del movimento. Gli incantesimi che fanno volare o levitare non hanno effetto su di te. I pavimenti di legno, i ponti di corda e le scale marce cedono sotto i tuoi piedi quando il Master lo decide. Hai svantaggio alle prove di Destrezza (Acrobazia) e (Furtività)."},{"g":"V","n":"Manifestazione","inc":"—","dn":"Tutto Resta","dt":"Sei immune ai danni contundenti e alle condizioni Afferrato, Prono e Trattenuto. Una volta per riposo lungo, con un\u0027azione, per 1 minuto il terreno entro 18 m da te diventa un Dominio del Sepolto: ogni creatura ostile che inizia il turno nell\u0027area deve superare un tiro salvezza su Forza contro la CD del patto, altrimenti subisce 5d10 danni contundenti e diventa Trattenuta; le creature che volano nell\u0027area vengono tirate giù di 9 m all\u0027inizio di ogni loro turno. Finché dura, ti muovi attraverso la terra e la pietra come se fossero aria.","pn":"Mai Più in Superficie","pt":"Per ogni ora che passi sotto il cielo aperto ottieni un livello di Indebolimento. Alla fine dell\u0027arco che stai giocando il personaggio scende sottoterra, e non ne risale più: da quel momento è del Master."}]},{"n":"Il Patto del Solitario","paura":"Il Solitario","car":"CAR","tributo":"Lasciare qualcuno solo, e fare in modo che lo sappia.\n- Abbandonare qualcuno in un posto da cui non sa tornare, e assicurarsi che sappia che nessuno lo sta cercando.\n- Tagliare l\u0027ultimo legame di qualcuno: allontanare l\u0027amico, far partire il figlio, far dimenticare il nome.\n- Stare accanto a qualcuno per mesi, e poi sparire senza una parola, nel momento in cui ha più bisogno.\n\n**Lo tradisce** stringere un legame, chiamare qualcuno per nome, dividere un pasto o un canto, promettere di tornare, tenere stretto qualcuno a lungo (vedi [[Il Solitario]]).","segno":"Prima la pelle si fa pallida e fredda, e le mani degli altri la lasciano in fretta. Poi la gente comincia a dimenticare il tuo nome a metà di una frase. Ai Gradi alti intorno ai piedi di un Avatar del Solitario c\u0027è sempre un velo di nebbia, anche al chiuso, e la sua voce sembra venire da lontano anche quando è vicinissimo.","gradi":[{"g":"I","n":"Sfiorato","inc":"Nube di Nebbia","dn":"Dimenticabile","dt":"Chi non ti conosce bene dimentica la tua faccia entro un\u0027ora da quando te ne sei andato, e non sa descriverti. Hai vantaggio alle prove di Destrezza (Furtività). Una volta per turno, quando colpisci una creatura che non ha nessun alleato entro 3 m da sé, le infliggi 1d8 danni psichici in più, o 2d8 dal Grado III.","pn":"La Folla","pt":"Troppa gente ti toglie l\u0027aria. Quando ci sono almeno quattro altre creature entro 9 m da te, hai svantaggio ai tiri per colpire e alle prove di caratteristica. La gente si ritrae dal tuo tocco senza saperne il perché: hai svantaggio alle prove di Carisma (Persuasione) con chi incontri per la prima volta."},{"g":"II","n":"Segnato","inc":"Invisibilità","dn":"La Nebbia","dt":"Con un\u0027azione bonus ti avvolgi in una nebbia di 4,5 m di raggio, centrata su di te e che si sposta con te, per 1 minuto. L\u0027area è pesantemente oscurata per tutti tranne che per te, e le creature al suo interno non sentono le voci delle altre. Puoi usare questo Dono un numero di volte pari al tuo bonus di competenza.","pn":"Il Tuono","pt":"Hai vulnerabilità ai danni da tuono. Una campana, un coro, una folla che canta ti raggiungono dove nient\u0027altro arriva."},{"g":"III","n":"Servitore","inc":"Muro di Vento","dn":"Nessuno Ti Trova","dt":"Non puoi essere bersaglio degli incantesimi di divinazione né percepito dai sensori magici di scrutamento, e non lasci tracce che si possano seguire senza magia. Le creature hanno svantaggio alle prove di Saggezza (Intuizione) per capire che cosa pensi. Quando vieni colpito da un attacco, puoi usare la reazione per diventare Invisibile fino alla fine del tuo turno successivo e spostarti di 9 m senza provocare attacchi di opportunità. Puoi usare questa reazione una volta per riposo breve.","pn":"Senza Mani Tese","pt":"Non puoi ricevere i benefici dell\u0027azione Aiuto, dell\u0027Ispirazione Bardica né di nessun\u0027altra capacità con cui un alleato ti dà un dado o un bonus. Gli incantesimi di guarigione lanciati da altri ti fanno recuperare soltanto metà dei PF."},{"g":"IV","n":"Avatar","inc":"Esilio","dn":"L\u0027Isolamento","dt":"Con un\u0027azione scegli una creatura entro 18 m. Deve superare un tiro salvezza su Carisma contro la CD del patto, altrimenti sparisce nella nebbia per 1 minuto, in un posto grigio dove non c\u0027è nessuno; alla fine del minuto torna nello spazio che occupava, subisce 8d10 danni psichici, e per 1 ora non può ricevere l\u0027aiuto degli alleati, come per _Senza Mani Tese_. Se lo supera subisce 4d10 danni psichici e non sparisce. Puoi usare questo Dono una volta per riposo breve.","pn":"Il Nome","pt":"Chi non ti vede per una luna intera dimentica il tuo nome, anche se ti ama, e lo ritrova soltanto se qualcuno glielo dice. Nessuno riesce più a toccarti a lungo: gli incantesimi degli alleati che richiedono di toccarti non hanno effetto su di te."},{"g":"V","n":"Manifestazione","inc":"—","dn":"La Distanza","dt":"Le creature che si trovano a più di 9 m da te non possono vederti, a meno che non conoscano il tuo nome. Una volta per riposo lungo, con un\u0027azione, riempi di nebbia una sfera di 30 m di raggio per 10 minuti: nella nebbia nessuna creatura tranne te può vedere o sentire le altre, né comunicare con loro in nessun modo.","pn":"Il Faro Spento","pt":"Non c\u0027è più nessuno che ricordi il tuo nome, nemmeno tu. Alla fine dell\u0027arco che stai giocando il personaggio entra nella nebbia, e non ne esce più: da quel momento è del Master."}]},{"n":"Il Patto del Vasto","paura":"Il Vasto","car":"SAG","tributo":"Mostrare a qualcuno l\u0027abisso, e quanto è piccolo davanti a lui.\n- Tenere qualcuno sospeso sopra un precipizio finché non capisce che la sua vita non pesa niente.\n- Abbandonare qualcuno in mare aperto, senza riva in vista, e lasciarlo galleggiare.\n- Costringere qualcuno a guardare il cielo nero finché non si aggrappa alla terra con le unghie.\n\n**Lo tradisce** restare in spazi piccoli e accoglienti, toccare la terra con un gesto rituale, abbracciarsi a lungo, stringere un patto di appartenenza con un luogo (vedi [[Il Vasto]]).","segno":"Prima chi sta vicino a un Avatar del Vasto ha le vertigini anche con i piedi per terra. Poi il suo corpo si fa leggero, troppo, e i suoi passi non lasciano quasi impronte. Ai Gradi alti gli occhi guardano sempre lontanissimo, anche quando parlano con qualcuno, e intorno a lui soffia un vento che non c\u0027è.","gradi":[{"g":"I","n":"Sfiorato","inc":"Caduta Morbida","dn":"Nessun Fondo","dt":"Non subisci danni da caduta, e una caduta non ti fa mai finire Prono. La distanza dei tuoi salti raddoppia. Una volta per turno, quando colpisci una creatura con un attacco in mischia, puoi spingerla di 3 m lontano da te.","pn":"Le Stanze Strette","pt":"Negli spazi chiusi e piccoli, dove nessun punto è a più di 3 m da una parete, nei cunicoli, nelle celle, nei corridoi, hai svantaggio ai tiri per colpire e ai tiri salvezza per mantenere la concentrazione."},{"g":"II","n":"Segnato","inc":"Levitazione","dn":"La Spinta","dt":"Con un\u0027azione scegli una creatura entro 18 m. Deve superare un tiro salvezza su Forza contro la CD del patto, altrimenti subisce 3d6 danni da forza e viene spinta di 15 m in una direzione a tua scelta, anche verso l\u0027alto, e poi cade normalmente. Puoi usare questo Dono un numero di volte pari al tuo bonus di competenza.","pn":"La Forza","pt":"Hai vulnerabilità ai danni da forza."},{"g":"III","n":"Servitore","inc":"Volare","dn":"Il Cielo Aperto","dt":"Quando non ci sono tetti entro 30 m sopra di te, hai una velocità di volare pari alla tua velocità, e puoi restare sospeso.","pn":"Leggero","pt":"Pesi troppo poco. Hai svantaggio ai tiri salvezza su Forza e alle prove contro gli effetti che ti spingono, ti spostano o ti fanno cadere Prono, e il vento forte dimezza la tua velocità."},{"g":"IV","n":"Avatar","inc":"Porta Dimensionale","dn":"La Caduta Senza Fondo","dt":"Con un\u0027azione scegli una creatura entro 36 m. Deve superare un tiro salvezza su Saggezza contro la CD del patto, altrimenti per 1 minuto è convinta di cadere senza fine: è Incapacitata, e all\u0027inizio di ogni suo turno subisce 6d10 danni psichici. Ripete il tiro salvezza alla fine di ogni suo turno. Se lo supera subisce 3d10 danni psichici. Puoi usare questo Dono una volta per riposo breve.","pn":"Insignificante","pt":"C\u0027è sempre meno di te. Il tuo massimo dei PF diminuisce di un numero pari al tuo livello, e hai svantaggio alle prove di Carisma (Intimidire) e (Persuasione) quando parli a più di una persona."},{"g":"V","n":"Manifestazione","inc":"—","dn":"Il Vasto","dt":"Hai una velocità di volare pari al doppio della tua velocità, ovunque, e puoi restare sospeso. Una volta per riposo lungo, con un\u0027azione, rovesci il cielo per 1 minuto in una sfera di 18 m di raggio intorno a te: ogni creatura che scegli nell\u0027area cade verso l\u0027alto per 30 m, e quando l\u0027effetto finisce, o quando esce dall\u0027area, cade di nuovo.","pn":"L\u0027Orizzonte","pt":"Non riesci più a stare dentro niente, neanche dentro il tuo nome. Alla fine dell\u0027arco che stai giocando il personaggio cammina verso l\u0027orizzonte, e non lo raggiunge mai: da quel momento è del Master."}]},{"n":"Il Patto della Caccia","paura":"La Caccia","car":"SAG","tributo":"Inseguire qualcuno finché non smette di sperare. Non serve ucciderlo: serve che corra, e che capisca che non c\u0027è un posto dove andare.\n- Dare la caccia a qualcuno per una notte intera, lasciandolo scappare quanto basta perché ci speri ancora.\n- Marchiare qualcuno, e fargli sapere che da quel momento è una preda.\n- Stanare qualcuno dal suo nascondiglio più sicuro.\n\n**Lo tradisce** liberare una preda per pietà, rifiutarsi di sceglierne una, mostrare clemenza a metà della caccia, accettare di essere preda senza reagire (vedi [[La Caccia]]).","segno":"Prima gli occhi riflettono la luce come quelli di un cane nel buio. Poi i canini si allungano, l\u0027olfatto si affila, e le mani non stanno ferme finché c\u0027è qualcuno che si allontana. Ai Gradi alti spuntano unghie dure e scure, il pelo, il muso, e chi guarda un Avatar della Caccia negli occhi sente l\u0027impulso di correre.","gradi":[{"g":"I","n":"Sfiorato","inc":"Marchio del Cacciatore","dn":"La Preda","dt":"Con un\u0027azione bonus dichiari come tua Preda una creatura che puoi vedere. Resta la tua Preda finché non ne dichiari un\u0027altra o non termini un riposo lungo. Sai sempre in che direzione si trova, se è entro 1,5 km, e hai vantaggio alle prove di Saggezza (Sopravvivenza) per seguirne le tracce e di Saggezza (Percezione) per trovarla. Una volta per turno, quando colpisci la tua Preda, le infliggi 1d6 danni in più dello stesso tipo dell\u0027attacco.","pn":"L\u0027Odore del Predatore","pt":"Gli animali domestici ti temono, i cani ti ringhiano, i cavalli non ti portano se non sono addestrati alla guerra: hai svantaggio alle prove di Saggezza (Addestrare Animali). Chi ti incontra per la prima volta sente che sei un pericolo, e hai svantaggio alle prove di Carisma (Persuasione) con lui."},{"g":"II","n":"Segnato","inc":"Passo Senza Tracce","dn":"Più Veloce","dt":"La tua velocità aumenta di 3 m, il terreno difficile naturale non ti rallenta, e hai vantaggio ai tiri di iniziativa. Quando la tua Preda si allontana da te, puoi usare la reazione per muoverti verso di lei fino a metà della tua velocità, senza provocare attacchi di opportunità.","pn":"La Mente Braccata","pt":"Hai vulnerabilità ai danni psichici: la Caccia abita la parte più vecchia della tua testa, e lì sei scoperto."},{"g":"III","n":"Servitore","inc":"Velocità","dn":"Il Morso","dt":"Il danno in più di _La Preda_ sale a 2d8. La tua Preda non può nasconderti la sua posizione: se è entro 18 m, sai sempre dov\u0027è. Quando la tua Preda scende a 0 PF, puoi usare la reazione per dichiarare subito una nuova Preda e muoverti verso di lei fino a metà della tua velocità.","pn":"La Preda che Fugge","pt":"Una Preda che ti sfugge, e resta viva e lontana da te fino alla fine della luna, ti lascia un livello di Indebolimento che non se ne va finché non la ritrovi. Per ogni Preda sfuggita, un livello. Puoi liberarne una di tua volontà, ma è un gesto che affama la Caccia."},{"g":"IV","n":"Avatar","inc":"Localizza Creatura","dn":"Non si Scappa","dt":"I tuoi attacchi contro la Preda sono colpi critici con un 19 o un 20, e la tua Preda ha svantaggio ai tiri salvezza contro i tuoi incantesimi e i tuoi Doni. Quando la tua Preda si teletrasporta o esce dalla tua vista, puoi usare la reazione per apparire in uno spazio libero entro 1,5 m da lei. Puoi usare questa reazione un numero di volte pari al tuo bonus di competenza.","pn":"Le Mani da Bestia","pt":"Le tue mani non sono più fatte per le cose fini. Hai svantaggio alle prove con gli attrezzi e alle prove di Destrezza (Rapidità di Mano), e non puoi più usare le armi con la proprietà Munizioni: l\u0027arco, la balestra, la fionda, nelle tue mani non tirano dritto."},{"g":"V","n":"Manifestazione","inc":"—","dn":"La Bestia","dt":"Una volta per riposo lungo, con un\u0027azione bonus, diventi per 1 minuto la cosa che insegue: sei Grande, la tua velocità aumenta di 6 m, hai resistenza ai danni contundenti, perforanti e taglienti, e quando usi l\u0027azione Attacco puoi fare un attacco in più. Durante la trasformazione la tua Preda ha svantaggio a tutti i tiri salvezza contro di te.","pn":"Il Contratto","pt":"La Caccia non finisce mai. Alla fine dell\u0027arco che stai giocando il personaggio va nel bosco dietro a una preda che non si fa prendere, e non torna: da quel momento è del Master."}]},{"n":"Il Patto della Carne","paura":"La Carne","car":"SAG","tributo":"Far sentire a qualcuno di essere soltanto carne.\n- Macellare qualcosa, o qualcuno, davanti a chi non riesce a distogliere lo sguardo.\n- Cambiare il corpo di qualcuno senza il suo permesso, e fargli vedere il risultato.\n- Far mangiare a qualcuno una carne di cui scoprirà la provenienza.\n- Ingrassare un prigioniero, e lasciargli capire perché.\n\n**Lo tradisce** guarire una ferita senza lasciare cicatrici, rifiutare ogni modifica del corpo, cremare i morti, rinunciare alla carne pur avendo fame (vedi [[La Carne]]).","segno":"Prima una fame che non passa mai, e smagliature rosse dove la pelle non dovrebbe tirare. Poi le ossa cominciano a sporgere in punti sbagliati, una costola in più, un dito più lungo, e sotto la pelle si vedono muscoli che si muovono per conto loro. Ai Gradi alti il corpo di un Avatar della Carne non ha più la forma di un uomo, ma quella che gli serve.","gradi":[{"g":"I","n":"Sfiorato","inc":"Falsa Vita","dn":"Carne in Più","dt":"I tuoi PF massimi aumentano del doppio del tuo livello, e aumentano di 2 ogni volta che sali di livello. Una volta per riposo lungo, quando mangi la carne di una creatura morta da meno di un\u0027ora, puoi spendere Dadi Vita come se finissi un riposo breve.","pn":"La Fame di Carne","pt":"Soltanto la carne ti nutre. Il pane, la frutta e la zuppa ti riempiono la pancia, ma ai fini della fame e della sete non contano. Se finisci un riposo lungo senza aver mangiato carne dal riposo precedente, non recuperi Dadi Vita."},{"g":"II","n":"Segnato","inc":"Ingrandire/Ridurre","dn":"Modellare","dt":"Con un\u0027azione tocchi una creatura, oppure, quando la colpisci con un attacco in mischia, usi questo Dono al posto del danno di quell\u0027attacco. La creatura deve superare un tiro salvezza su Costituzione contro la CD del patto. Se lo fallisce subisce 4d8 danni contundenti, mentre muscoli e ossa le si torcono sotto la pelle, e per 1 minuto la sua velocità si dimezza e ha svantaggio ai tiri per colpire e ai tiri salvezza su Destrezza; ripete il tiro salvezza alla fine di ogni suo turno. Se lo supera subisce metà dei danni. Puoi usare questo Dono un numero di volte pari al tuo bonus di competenza.","pn":"L\u0027Acido","pt":"Hai vulnerabilità ai danni da acido."},{"g":"III","n":"Servitore","inc":"Tocco del Vampiro","dn":"Le Ossa","dt":"Le ossa ti crescono sotto la pelle come una corazza: la tua CA aumenta di 2. Con un\u0027azione bonus estrai dal tuo corpo una lama d\u0027osso, che conta come un\u0027arma magica con cui hai competenza e infligge 1d10 danni taglienti più il modificatore della caratteristica del patto. Una volta per turno, quando colpisci con la lama, recuperi PF pari al tuo bonus di competenza. La lama torna nel corpo quando la lasci.","pn":"Il Corpo Non Entra","pt":"Il tuo corpo non ha più la forma per cui sono fatte le cose degli altri. Non puoi indossare armature pesanti, le armature medie devi farle allargare apposta, e non puoi indossare oggetti magici che si portano sulla testa, sulle mani o sulle braccia: non ti entrano più."},{"g":"IV","n":"Avatar","inc":"Polimorfia","dn":"Il Banchetto","dt":"Quando riduci una creatura a 0 PF con un attacco in mischia, ottieni PF temporanei pari al doppio del tuo livello. Con un\u0027azione bonus cresci per 1 minuto: diventi Grande, la tua portata aumenta di 1,5 m, i tuoi attacchi in mischia infliggono 1d10 danni in più, e hai resistenza ai danni contundenti, perforanti e taglienti. Puoi crescere una volta per riposo breve.","pn":"La Pelle che Mangia","pt":"Il tuo corpo guarisce davvero soltanto mangiando. Gli incantesimi di guarigione ti fanno recuperare soltanto metà dei PF, e le pozioni di guarigione non hanno effetto su di te."},{"g":"V","n":"Manifestazione","inc":"—","dn":"L\u0027Abbondanza","dt":"All\u0027inizio di ogni tuo turno recuperi 15 PF, se hai almeno 1 PF, a meno che nel turno precedente tu non abbia subito danni da fuoco o da acido. Una volta per riposo lungo, con un\u0027azione, tocchi una creatura: deve superare un tiro salvezza su Costituzione contro la CD del patto, altrimenti subisce 10d10 danni contundenti e il suo corpo si apre, per 1 minuto, in una massa di carne: è Incapacitata e Trattenuta, e ripete il tiro salvezza alla fine di ogni suo turno. Se lo supera subisce metà dei danni.","pn":"La Forma Persa","pt":"Non ricordi più com\u0027era il tuo corpo. Alla fine dell\u0027arco che stai giocando il personaggio diventa una cosa del Mercato, e da quel momento è del Master."}]},{"n":"Il Patto della Corruzione","paura":"La Corruzione","car":"CAR","tributo":"Far sentire a qualcuno che qualcosa gli vive dentro, o che qualcosa lo ama troppo per lasciarlo andare.\n- Far ammalare qualcuno, e restargli accanto mentre capisce che cosa ha nel sangue.\n- Infestare una casa di vermi, di api, di muffa, finché la famiglia non la abbandona piangendo.\n- Mostrare a qualcuno le uova sotto la sua pelle.\n- Farsi amare da qualcuno di un amore che lo mangia, e lasciarglielo capire.\n\n**Lo tradisce** sterilizzare, bruciare ciò che marcisce, curare un\u0027infezione fino a guarirla, tenere una cerchia di persone sana e separata dalle altre (vedi [[La Corruzione]]).","segno":"Prima un odore dolce, di frutta lasciata troppo al caldo, che resta nei vestiti. Poi buchi minuscoli sulla pelle, rotondi e puliti, e da qualcuno, a volte, esce un insetto che rientra in un altro. Ai Gradi alti la pelle diventa un favo, e chi sta vicino a un Avatar della Corruzione sente un ronzio basso che non smette, e un calore che somiglia all\u0027affetto.","gradi":[{"g":"I","n":"Sfiorato","inc":"Raggio di Infermità","dn":"Il Nido","dt":"Hai resistenza ai danni da veleno e vantaggio ai tiri salvezza per non diventare Avvelenato, e non contrai malattie. Gli insetti, i vermi e i parassiti non ti sono mai ostili, e puoi comunicare con loro idee semplici. Una volta per turno, quando colpisci una creatura con un attacco o la danneggi con un incantesimo, puoi infliggerle 1d6 danni da veleno in più, o 2d6 dal Grado III.","pn":"L\u0027Odore Dolce","pt":"Addosso hai un odore di frutta lasciata al caldo che non va via. Hai svantaggio alle prove di Destrezza (Furtività) e di Saggezza (Addestrare Animali), e le creature con l\u0027olfatto acuto ti sentono arrivare da 30 m. Cani e cavalli non ti portano e non ti seguono."},{"g":"II","n":"Segnato","inc":"Freccia Acida di Melf","dn":"Il Bacio","dt":"Con un\u0027azione bonus soffi, tocchi o baci una creatura entro 1,5 m. La creatura deve superare un tiro salvezza su Costituzione contro la CD del patto, altrimenti è Avvelenata per 1 minuto: all\u0027inizio di ogni suo turno subisce 2d10 danni da veleno, e finché è Avvelenata ha svantaggio ai tiri salvezza su Costituzione. Ripete il tiro salvezza alla fine di ogni suo turno, e se lo supera l\u0027effetto finisce. Puoi usare questo Dono un numero di volte pari al tuo bonus di competenza.","pn":"Il Fuoco","pt":"Hai vulnerabilità ai danni da fuoco. Quando subisci danni da fuoco, quello che vive dentro di te brucia, e fino alla fine del tuo turno successivo non puoi usare i Doni del patto."},{"g":"III","n":"Servitore","inc":"Nube Maleodorante","dn":"Lo Sciame","dt":"Sei immune ai danni da veleno e alla condizione Avvelenato. Con un\u0027azione fai uscire dal tuo corpo uno sciame che riempie una sfera di 6 m di raggio in un punto entro 18 m, per 1 minuto, finché mantieni la concentrazione. L\u0027area è leggermente oscurata e conta come terreno difficile. Ogni creatura che entra nell\u0027area per la prima volta in un turno, o vi inizia il turno, deve superare un tiro salvezza su Costituzione contro la CD del patto, altrimenti subisce 4d8 danni da veleno ed è Avvelenata fino all\u0027inizio del suo turno successivo; se lo supera subisce metà dei danni. Con un\u0027azione bonus puoi spostare la sfera di 9 m. Puoi usare questo Dono una volta per riposo breve.","pn":"Mai Soli","pt":"Non puoi passare un riposo lungo da solo: se per tutto il riposo non c\u0027è un\u0027altra creatura vivente entro 3 m da te, uno sciame, un animale o una persona, non ne ottieni i benefici. E chi dorme accanto a te si porta via qualcosa: ogni creatura che passa il riposo lungo entro 3 m da te deve superare un tiro salvezza su Costituzione contro la CD del patto, altrimenti si sveglia con un livello di Indebolimento che le passa soltanto con _ristorare inferiore_, o quando paghi il Tributo successivo."},{"g":"IV","n":"Avatar","inc":"Insetto Gigante","dn":"La Famiglia","dt":"Quando una creatura Avvelenata da un tuo Dono muore, all\u0027inizio del tuo turno successivo dal suo corpo esce uno sciame di insetti che obbedisce ai tuoi ordini e agisce subito dopo di te. Puoi avere al massimo un numero di sciami pari al tuo bonus di competenza, e quelli in più si disperdono. Quando subisci danni, puoi usare la reazione per dimezzarli: dalla ferita escono gli insetti e la richiudono. Puoi usare questa reazione un numero di volte pari al tuo bonus di competenza.","pn":"Chi Mangia per Primo","pt":"Quello che vive dentro di te mangia prima di te. Tutte le cure che ricevi, comprese le pozioni e i Dadi Vita, ti fanno recuperare soltanto metà dei PF. Fanno eccezione soltanto i tuoi Doni."},{"g":"V","n":"Manifestazione","inc":"—","dn":"L\u0027Alveare","dt":"Le creature ostili entro 9 m da te hanno svantaggio ai tiri salvezza per non diventare Avvelenate. Quando una creatura Avvelenata da te muore, recuperi PF pari al tuo livello. Una volta per riposo lungo, quando scendi a 0 PF senza morire, ti sciogli in uno sciame, e all\u0027inizio del tuo turno successivo ti ricomponi in uno spazio libero entro 9 m, con metà dei tuoi PF massimi.","pn":"Senza Nome","pt":"Il tuo nome non ti risponde più: rispondi a quello dell\u0027Alveare. Alla fine dell\u0027arco che stai giocando il personaggio diventa uno sciame con una faccia, e da quel momento è del Master."}]},{"n":"Il Patto della Desolazione","paura":"La Desolazione","car":"CAR","tributo":"Togliere a qualcuno la cosa che ama di più, davanti ai suoi occhi.\n- Bruciare la casa di qualcuno mentre guarda, e restare a guardare con lui.\n- Distruggere l\u0027oggetto più caro di qualcuno, la lettera, il ritratto, l\u0027anello, piano.\n- Far morire ciò che uno ama, un cane, un giardino, un fratello, e lasciargli capire che poteva impedirlo.\n\n**Lo tradisce** aggiustare ciò che è rotto, restituire a qualcuno una cosa perduta, confortare chi ha perso, ricostruire, proteggere ciò che lei vorrebbe bruciare (vedi [[La Desolazione]]).","segno":"Prima un odore di cera e di fumo, che non va via lavando. Poi la pelle si fa calda come una pietra rimasta accanto al focolare, e le cose che si toccano a lungo si anneriscono ai bordi. Ai Gradi alti la pelle si ammorbidisce come cera, e d\u0027estate cola, e intorno a un Avatar della Desolazione l\u0027aria trema come sopra un tetto rovente, senza che ci sia luce.","gradi":[{"g":"I","n":"Sfiorato","inc":"Mani Brucianti","dn":"Ciò che Ami","dt":"Hai resistenza ai danni da fuoco. Se osservi una creatura per 1 minuto, sai quale oggetto, tra quelli che porta con sé, ama di più, e se la persona che ama di più è presente. Una volta per turno, quando danneggi una creatura con un attacco o un incantesimo, le infliggi 1d6 danni da fuoco in più, o 2d6 dal Grado III.","pn":"Niente Dura","pt":"Una volta per luna il Master sceglie una cosa che possiedi e a cui tieni, anche un oggetto magico, purché non sia un artefatto: la perdi, o brucia, e non la ritrovi più."},{"g":"II","n":"Segnato","inc":"Riscaldare il Metallo","dn":"Bruciare il Caro","dt":"Con un\u0027azione bonus fai prendere fuoco a un oggetto non magico che una creatura entro 18 m porta o indossa. La creatura deve superare un tiro salvezza su Saggezza contro la CD del patto. Se lo fallisce l\u0027oggetto è distrutto, e la creatura subisce 3d6 danni da fuoco e 3d6 danni psichici. Se lo supera subisce metà dei danni e l\u0027oggetto si salva. Contro l\u0027oggetto che la creatura ama di più, i danni psichici raddoppiano. Puoi usare questo Dono un numero di volte pari al tuo bonus di competenza.","pn":"Il Freddo","pt":"Hai vulnerabilità ai danni da freddo, e svantaggio ai tiri salvezza su Costituzione contro gli effetti del gelo e della neve."},{"g":"III","n":"Servitore","inc":"Palla di Fuoco","dn":"La Cera","dt":"Hai resistenza ai danni psichici: non c\u0027è più niente che ti faccia male in quel punto. Quando una creatura ti colpisce con un attacco in mischia, subisce 3d6 danni da fuoco. I danni da fuoco dei tuoi incantesimi e dei tuoi Doni ignorano la resistenza al fuoco, e trattano l\u0027immunità come resistenza.","pn":"Le Mani che Non Riparano","pt":"Non riesci più ad aggiustare niente: _riparare_ e gli attrezzi da artigiano falliscono nelle tue mani, non puoi stabilizzare una creatura morente, e quando curi un\u0027altra creatura le fai recuperare soltanto metà dei PF."},{"g":"IV","n":"Avatar","inc":"Muro di Fuoco","dn":"Il Rogo","dt":"Con un\u0027azione ti circondi di fiamme senza luce, in un\u0027aura di 6 m, per 1 minuto, finché mantieni la concentrazione. Ogni creatura ostile che inizia il turno nell\u0027aura subisce 5d6 danni da fuoco, gli oggetti non indossati nell\u0027aura prendono fuoco, e chi muore nell\u0027aura brucia fino alla cenere. Le creature nell\u0027aura hanno svantaggio ai tiri salvezza contro _Bruciare il Caro_. Puoi usare questo Dono una volta per riposo breve.","pn":"Chi Ha Perso Ti Riconosce","pt":"Chi ha perso qualcuno nel fuoco ti riconosce a vista, e ti è ostile. Hai svantaggio a tutte le prove di Carisma, tranne Intimidire."},{"g":"V","n":"Manifestazione","inc":"—","dn":"Niente Resta","dt":"Sei immune ai danni da fuoco. Una volta per riposo lungo, con un\u0027azione, scegli una creatura entro 36 m: tutto quello che ama e che si trova entro 36 m da lei prende fuoco insieme. La creatura deve superare un tiro salvezza su Saggezza contro la CD del patto, altrimenti subisce 5d10 danni da fuoco e 5d10 danni psichici, o metà se lo supera. Le persone che ama e che sono nell\u0027area subiscono 5d10 danni da fuoco, o metà con un tiro salvezza su Destrezza riuscito.","pn":"La Fiamma Senza Luce","pt":"Non ti resta più niente da amare, e non puoi più ricevere il beneficio dell\u0027Ispirazione Eroica. Alla fine dell\u0027arco che stai giocando il personaggio brucia, senza fare luce, e da quel momento è del Master."}]},{"n":"Il Patto della Fine","paura":"La Fine","car":"SAG","tributo":"Costringere qualcuno a guardare la propria morte.\n- Dire a qualcuno il sonno in cui morirà, e lasciarlo aspettare.\n- Vegliare un morente che ha paura, senza consolarlo, finché non smette di respirare.\n- Mettere qualcuno davanti al proprio cadavere, in una visione, in uno specchio, in una fossa scavata apposta.\n\n**Lo tradisce** curare qualcuno oltre il punto in cui sarebbe morto, riportare in vita un morto, salvare chi era destinato a morire, non presentarsi al capezzale di un morente che chiama (vedi [[La Fine]]).","segno":"Prima le unghie e le labbra si fanno grigie. Poi addosso resta un odore di fiori lasciati su una tomba, e il cuore batte così piano che a cercarlo al polso non lo si trova. Ai Gradi alti la pelle è fredda come quella di un morto, e intorno a un Avatar della Fine si sente ticchettare un orologio anche dove non ce ne sono.","gradi":[{"g":"I","n":"Sfiorato","inc":"Infliggi Ferite","dn":"Il Conto","dt":"Con un\u0027azione bonus guardi una creatura che vedi entro 18 m e sai quanti PF le restano, e se morirà entro la fine della luna per una ferita o una malattia che ha già. Una volta per turno, quando colpisci una creatura che ha meno di metà dei suoi PF massimi, le infliggi 1d8 danni necrotici in più.","pn":"Le Cure Scivolano","pt":"Quando un incantesimo, una pozione o un Dado Vita ti fa recuperare PF tirando dei dadi, i dadi contano sempre il risultato minimo."},{"g":"II","n":"Segnato","inc":"Riposo Inviolato","dn":"L\u0027Ora Giusta","dt":"Quando una creatura che puoi vedere entro 18 m effettua un tiro salvezza contro la morte, puoi usare la reazione per decidere tu il risultato: un successo o un fallimento. Puoi usare questa reazione un numero di volte pari al tuo bonus di competenza. Inoltre, una volta per turno, quando una creatura entro 18 m da te scende a 0 PF, recuperi PF pari al tuo livello.","pn":"Il Freddo del Morto","pt":"Hai vulnerabilità ai danni radianti."},{"g":"III","n":"Servitore","inc":"Parlare con i Morti","dn":"Non Ancora","dt":"Hai resistenza ai danni necrotici, vantaggio ai tiri salvezza contro la morte, e non invecchi più. Una volta per riposo lungo, quando scendi a 0 PF senza morire, scendi invece a 1 PF, e ogni creatura che scegli entro 3 m da te subisce 4d8 danni necrotici.","pn":"Il Polso che Manca","pt":"Il cuore batte così piano che non lo si trova. Il tuo massimo dei PF diminuisce di un numero pari al tuo livello."},{"g":"IV","n":"Avatar","inc":"Interdizione alla Morte","dn":"La Falce Paziente","dt":"Una volta per turno, quando colpisci una creatura che ha meno di metà dei suoi PF massimi, o quando quella creatura fallisce un tiro salvezza contro un tuo incantesimo, subisce 4d8 danni necrotici in più. I tuoi attacchi contro le creature che hanno meno di metà dei loro PF massimi sono colpi critici con un 19 o un 20. Le creature che uccidi non possono essere riportate in vita se non con _desiderio_ o _resurrezione pura_.","pn":"Non si Torna","pt":"Neanche tu: se muori, puoi essere riportato in vita soltanto con _desiderio_. Ogni volta che scendi a 0 PF ottieni un livello di Indebolimento."},{"g":"V","n":"Manifestazione","inc":"—","dn":"L\u0027Ora","dt":"Le creature che scegli entro 9 m da te non possono recuperare PF. Una volta per riposo lungo, con un\u0027azione, scegli una creatura entro 18 m che ha 150 PF o meno: deve superare un tiro salvezza su Costituzione contro la CD del patto, altrimenti muore; se lo supera subisce 10d10 danni necrotici.","pn":"La Sedia Vuota","pt":"Non hai più un\u0027ora tua, e la cosa che ti siede accanto ha smesso di aspettare. Alla fine dell\u0027arco che stai giocando il personaggio si siede accanto al letto di qualcuno, e non si alza più: da quel momento è del Master."}]},{"n":"Il Patto della Ragnatela","paura":"La Ragnatela","car":"INT","tributo":"Far scoprire a qualcuno che la sua scelta non era sua.\n- Guidare qualcuno, un consiglio alla volta, fino a una rovina che crede di aver voluto, e poi mostrargli i fili.\n- Fare in modo che qualcuno tradisca chi ama, e lasciargli capire chi glielo ha suggerito.\n- Lasciare a qualcuno una lettera che gli spiega, punto per punto, tutto quello che ha fatto per lui senza che lo sapesse.\n\n**Lo tradisce** dichiarare le proprie intenzioni prima di agire, liberare qualcuno da una manipolazione, dire tutta la verità, confessare di aver tirato i fili (vedi [[La Ragnatela]]).","segno":"Prima, nella luce radente, intorno alle dita si vedono fili lucidi, sottilissimi, che spariscono appena si guarda dritto. Poi i ragni cominciano a seguire l\u0027Avatar, sui davanzali, sulle spalle, nei capelli, e non lo mordono mai. Ai Gradi alti le dita si allungano, e chi parla con un Avatar della Ragnatela si accorge di essere d\u0027accordo con lui prima di aver finito di ascoltarlo.","gradi":[{"g":"I","n":"Sfiorato","inc":"Comando","dn":"Il Consiglio","dt":"Dopo aver parlato con una creatura per almeno 10 min
