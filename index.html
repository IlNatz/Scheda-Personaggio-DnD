l\u0027aura.\n\nGli incantesimi già in corso, tranne quelli lanciati da manufatti o divinità, sono soppressi all\u0027interno dell\u0027area. Mentre un effetto è soppresso non funziona, ma il tempo che trascorre in questo stato conta ai fini della sua durata.\n\nDissolvi magie non ha alcun effetto sull\u0027aura, e le aure create da più incantesimi campo anti-magia non si annullano a vicenda."},{"n":"Camuffare se stesso","lv":1,"sc":"Illusione di 1º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** 1 ora\n\nL\u0027incantatore (compresi i suoi abiti, armatura, armi e altri oggetti personali presenti sulla sua persona) assume un aspetto diverso fino al termine dell\u0027incantesimo. Può apparire 30 centimetri più alto o più basso e apparire più grasso o più magro, adottando una forma che usi la stessa disposizione basilare degli arti. Entro questi limiti, la natura dell\u0027illusione dipende da lui.\n\nI cambiamenti apportati da questo incantesimo non passano il vaglio di un\u0027ispezione fisica. Per esempio, se l\u0027incantatore usa questo incantesimo per aggiungere un cappello al suo abbigliamento, gli oggetti attraverserebbero il cappello e chiunque lo toccasse non sentirebbe nulla. Per capire che l\u0027incantatore è camuffato, una creatura può usare la sua azione di Studio per ispezionarne l\u0027aspetto, superando una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull\u0027incantesimo."},{"n":"Capanna","lv":3,"sc":"Invocazione di 3º livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto o rituale\n**Gittata:** incantatore\n**Componenti:** V, S, M (una perla di cristallo)\n**Durata:** 8 ore\n\nUn\u0027emanazione di 3 metri si materializza attorno all\u0027incantatore e permane stazionaria per la durata dell\u0027incantesimo. L\u0027incantesimo fallisce quando l\u0027incantatore lo lancia ma l\u0027emanazione non è abbastanza grande da poter inglobare totalmente tutte le creature all\u0027interno della sua area.\n\nLe creature e gli oggetti all\u0027interno dell\u0027emanazione al momento del lancio dell\u0027incantesimo possono attraversarla liberamente, mentre a tutte le altre creature e oggetti è proibito. Non è possibile lanciare incantesimi di 3º livello o inferiore attraverso l\u0027emanazione, e gli effetti di tali incantesimi non si estendono al suo interno.\n\nL\u0027atmosfera all\u0027interno dell\u0027emanazione è gradevole e asciutta, a prescindere dal tempo atmosferico all\u0027esterno. Fino al termine dell\u0027incantesimo, l\u0027incantatore può decidere che all\u0027interno dell\u0027emanazione ci sia luce fioca o oscurità (nessuna azione richiesta). Dall\u0027esterno, l\u0027emanazione appare opaca e di un qualsiasi colore a scelta dell\u0027incantatore, ma dall\u0027interno risulta trasparente.\n\nL\u0027incantesimo termina in anticipo se l\u0027incantatore lo lancia di nuovo o se esce dall\u0027area dell\u0027emanazione."},{"n":"Caratteristica potenziata","lv":2,"sc":"Trasmutazione di 2º livello (Bardo, Chierico, Druido, Mago, Ranger, Stregone)","cl":"Bardo, Chierico, Druido, Mago, Ranger, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (un ciuffo di peli o una piuma)\n**Durata:** concentrazione, fino a 1 ora\n\nL\u0027incantatore tocca una creatura e sceglie Forza, Destrezza, Intelligenza, Saggezza o Carisma. Per la durata dell\u0027incantesimo, il bersaglio dispone di vantaggio sulle prove di caratteristica effettuate utilizzando l\u0027abilità scelta.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 2º. L\u0027incantatore può scegliere una caratteristica differente per ogni bersaglio."},{"n":"Carne in pietra","lv":6,"sc":"Trasmutazione di 6º livello (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (una piuma di coccatrice)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore tenta di tramutare in pietra una creatura entro gittata che egli è in grado di vedere. Il bersaglio effettua un tiro salvezza su Costituzione. In caso di fallimento, è trattenuto per la durata dell\u0027incantesimo. In caso di successo, la sua velocità è pari a 0 fino all\u0027inizio del turno successivo dell\u0027incantatore. I costrutti superano automaticamente il tiro salvezza.\n\nUn bersaglio trattenuto effettua un altro tiro salvezza su Costituzione al termine di ogni suo turno. L\u0027incantesimo termina se il bersaglio supera per tre volte il tiro salvezza contro questo incantesimo. Mentre se lo fallisce per tre volte, viene tramutato in pietra e diventa pietrificato per la durata dell\u0027incantesimo. Non è necessario che i tiri superati o falliti siano consecutivi: si tiene semplicemente il conto di entrambi finché il bersaglio non ne accumula tre di un certo tipo.\n\nSe l\u0027incantatore mantiene la concentrazione su questo incantesimo per l\u0027intera durata possibile, il bersaglio è pietrificato fino a quando non viene posta fine alla condizione con ristorare superiore o un\u0027altra magia simile."},{"n":"Catena di fulmini","lv":6,"sc":"Invocazione di 6º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 45 metri\n**Componenti:** V, S, M (tre spilli d\u0027argento)\n**Durata:** istantanea\n\nL\u0027incantatore scaglia un fulmine verso un bersaglio entro gittata e che egli è in grado di vedere. Tre fulmini sfrecciano poi dal bersaglio verso un massimo di altri tre bersagli a scelta dell\u0027incantatore, ognuno dei quali deve trovarsi entro 9 metri dal primo. I bersagli dell\u0027incantesimo possono essere creature o oggetti e possono essere bersagliati soltanto da uno dei fulmini.\n\nOgni bersaglio effettua un tiro salvezza su Destrezza, subendo 10d8 danni da fulmine in caso di fallimento, o la metà dei danni in caso di successo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** Un fulmine aggiuntivo si trasmette dal primo bersaglio a un altro bersaglio per ogni slot di livello superiore al 6º."},{"n":"Cecità/sordità","lv":2,"sc":"Trasmutazione di 2º livello (Bardo, Chierico, Mago, Stregone)","cl":"Bardo, Chierico, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V\n**Durata:** 1 minuto\n\nUna creatura entro gittata che l\u0027incantatore è in grado di vedere deve superare un tiro salvezza su Costituzione, altrimenti viene accecata o assordata (a scelta dell\u0027incantatore) per la durata dell\u0027incantesimo. Alla fine di ogni suo turno, il bersaglio ripete il tiro salvezza e, se lo supera, termina l\u0027incantesimo su di sé.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 2º."},{"n":"Celare","lv":7,"sc":"Trasmutazione di 7º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (polvere di gemme del valore di 5.000 mo o più, che l\u0027incantesimo consuma)\n**Durata:** finché non viene dissolto\n\nCon un tocco, l\u0027incantatore cela magicamente un oggetto o una creatura consenziente. Per la durata dell\u0027incantesimo, il bersaglio è invisibile e non può essere bersagliato da incantesimi di divinazione, individuato dalla magia o osservato a distanza con la magia.\n\nSe il bersaglio è una creatura, entra in uno stato di animazione sospesa, è priva di sensi, non invecchia e non necessita di cibo, acqua o aria.\n\nPer terminare prematuramente l\u0027incantesimo, l\u0027incantatore può stabilire una condizione, che può essere qualsiasi cosa a sua scelta che, tuttavia, debba verificarsi o essere visibile entro 1,5 chilometri dal bersaglio. Per esempio, \"dopo 1.000 anni\" o \"al risveglio del tarrasque\". Questo incantesimo termina inoltre se il bersaglio subisce danni."},{"n":"Cerchio di morte","lv":6,"sc":"Necromanzia di 6º livello (Mago, Stregone, Warlock)","cl":"Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 45 metri\n**Componenti:** V, S, M (polvere ricavata da una perla nera frantumata, del valore di 500 mo o più)\n**Durata:** istantanea\n\nUn flusso di energia negativa si espande in una sfera del raggio di 18 metri da un punto a scelta dell\u0027incantatore situato entro gittata. Ogni creatura nell\u0027area effettua un tiro salvezza su Costituzione, subendo 8d8 danni necrotici in caso di fallimento, o la metà dei danni in caso di successo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 2d8 per ogni slot di livello superiore al 6º."},{"n":"Cerchio di teletrasporto","lv":5,"sc":"Evocazione di 5º livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** 3 metri\n**Componenti:** V, M (inchiostri rari dal valore di 50 mo o più, che l\u0027incantesimo consuma)\n**Durata:** 1 round\n\nQuando lancia l\u0027incantesimo, l\u0027incantatore traccia un cerchio del diametro di 1,5 metri sul terreno dotato di sigilli che collegano il luogo in cui si trova a un cerchio di teletrasporto permanente a sua scelta, di cui conosce la sequenza di sigilli e che si trova sul suo stesso piano di esistenza. All\u0027interno del cerchio tracciato si apre un portale scintillante che rimane aperto fino al termine del suo turno successivo. Qualsiasi creatura che entra nel portale appare immediatamente entro 1,5 metri dal cerchio di destinazione o nello spazio libero più vicino se tale spazio è occupato.\n\nNella maggior parte dei casi, templi e palazzi delle gilde più grandi, oltre ad altri luoghi importanti, sono dotati di cerchi di teletrasporto permanenti. Ognuno di essi include una sequenza di sigilli unica: una serie di rune disposte secondo uno schema particolare.\n\nQuando l\u0027incantatore ottiene per la prima volta la capacità di lanciare questo incantesimo, apprende la sequenza di sigilli abbinata a due destinazioni situate sul Piano Materiale, determinate dal GM. Nel corso delle sue avventure può apprendere ulteriori sequenze di sigilli, imparando a memoria ciascuna di esse dopo 1 minuto di studio.\n\nL\u0027incantatore può creare un cerchio di teletrasporto permanente lanciando questo incantesimo nello stesso luogo ogni giorno per 365 giorni."},{"n":"Cerchio magico","lv":3,"sc":"Abiurazione di 3º livello (Chierico, Mago, Paladino, Warlock)","cl":"Chierico, Mago, Paladino, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** 3 metri\n**Componenti:** V, S, M (sale e polvere d\u0027argento del valore di 100 mo o più, che l\u0027incantesimo consuma)\n**Durata:** 1 ora\n\nL\u0027incantatore crea un cilindro di energia magica di 3 metri di raggio e 6 metri di altezza, centrato su un punto del terreno entro gittata che egli è in grado di vedere. Rune luminose appaiono nei punti in cui il cilindro si interseca con il pavimento o altre superfici.\n\nL\u0027incantatore sceglie uno o più tra i tipi di creature seguenti: celestiali, elementali, folletti, immondi o non morti. Il cerchio influenza una creatura del tipo scelto nei seguenti modi:\n\n- La creatura non può entrare volontariamente nel cilindro tramite mezzi non magici. Se prova a utilizzare il teletrasporto o il viaggio interplanare, deve prima superare un tiro salvezza su Carisma.\n\n- La creatura subisce svantaggio ai tiri per colpire contro i bersagli all\u0027interno del cilindro.\n\n- I bersagli all\u0027interno del cilindro non possono essere posseduti, affascinati o spaventati dalla creatura.\n\nOgni volta che lancia questo incantesimo, l\u0027incantatore può far funzionare la sua magia nella direzione inversa, impedendo cioè a una creatura di un tipo specifico di uscire dal cilindro e proteggendo i bersagli all\u0027esterno.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La durata aumenta di 1 ora per ogni slot di livello superiore al 3º."},{"n":"Charme sui mostri","lv":4,"sc":"Ammaliamento di 4º livello (Bardo, Druido, Mago, Stregone, Warlock)","cl":"Bardo, Druido, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S\n**Durata:** 1 ora\n\nUna creatura entro gittata che l\u0027incantatore è in grado di vedere effettua un tiro salvezza su Saggezza, disponendo di vantaggio se l\u0027incantatore o i suoi alleati stanno combattendo contro di essa. In caso di fallimento, il bersaglio è affascinato fino al termine dell\u0027incantesimo o finché non gli vengono inflitti danni dall\u0027incantatore o i suoi alleati. La creatura affascinata è amichevole nei confronti dell\u0027incantatore. Al termine dell\u0027incantesimo, il bersaglio capirà di essere stato affascinato dall\u0027incantatore.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 4º."},{"n":"Charme su persone","lv":1,"sc":"Ammaliamento di 1º livello (Bardo, Druido, Mago, Stregone, Warlock)","cl":"Bardo, Druido, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S\n**Durata:** 1 ora\n\nUn umanoide entro gittata che l\u0027incantatore è in grado di vedere effettua un tiro salvezza su Saggezza, disponendo di vantaggio se l\u0027incantatore o i suoi alleati stanno combattendo contro di essa. In caso di fallimento, il bersaglio è affascinato fino al termine dell\u0027incantesimo o finché non gli vengono inflitti danni dall\u0027incantatore o i suoi alleati. La creatura affascinata è amichevole nei confronti dell\u0027incantatore. Al termine dell\u0027incantesimo, il bersaglio capirà di essere stato affascinato dall\u0027incantatore.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 1º."},{"n":"Chiaroveggenza","lv":3,"sc":"Divinazione di 3º livello (Bardo, Chierico, Mago, Stregone)","cl":"Bardo, Chierico, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** 1,5 chilometri\n**Componenti:** V, S, M (un focus del valore di 100 mo o più, a scelta tra un cornetto acustico incastonato di gemme o un occhio di vetro per la vista)\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore crea un sensore invisibile entro gittata in un luogo a lui familiare (cioè che ha già visitato o visto), oppure in un luogo ovvio a lui non familiare (come per esempio dietro una porta, dietro un angolo o in un boschetto). Questo sensore intangibile e invulnerabile rimane in quella posizione per la durata dell\u0027incantesimo.\n\nQuando lancia l\u0027incantesimo, l\u0027incantatore sceglie tra vista e udito, potendo utilizzare il senso scelto attraverso il sensore come se si trovasse nel suo spazio. Come azione bonus, l\u0027incantatore può passare dalla vista all\u0027udito e viceversa.\n\nUna creatura che vede il sensore (per esempio una creatura che beneficia di vedere invisibilità o vista pura) scorge una sfera luminosa grande quanto il pugno dell\u0027incantatore."},{"n":"Clone","lv":8,"sc":"Necromanzia di 8º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 ora\n**Gittata:** contatto\n**Componenti:** V, S, M (un diamante del valore di 1.000 mo o più, che l\u0027incantesimo consuma, e un contenitore sigillabile del valore di 2.000 mo o più, abbastanza grande da contenere la creatura da clonare)\n**Durata:** istantanea\n\nL\u0027incantatore tocca una creatura o un cubo della sua carne di almeno 2,5 cm per lato. Un duplicato inerme di quella creatura si sviluppa all\u0027interno del contenitore utilizzato per lanciare l\u0027incantesimo e finisce di crescere dopo 120 giorni; l\u0027incantatore sceglie se il clone sviluppato ha la stessa età della creatura o è più giovane. Il clone rimane inerte e permane per un tempo indeterminato, fintantoché il suo involucro rimane indisturbato.\n\nDopo che il clone ha raggiunto la maturazione, se la creatura originale muore, la sua anima viene trasferita al clone, purché essa sia libera e disposta a tornare. Il clone è fisicamente identico all\u0027originale e possiede la sua personalità, i suoi ricordi e le sue abilità, ma non il suo equipaggiamento. I resti della creatura originale, se ancora esistono, diventano inerti e non possono più essere riportati in vita, in quanto l\u0027anima della creatura è altrove."},{"n":"Colpo accurato","lv":0,"sc":"Trucchetto di Divinazione (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** S, M (un\u0027arma nel cui uso l\u0027incantatore ha competenza e ha un valore di 1 mr o più)\n**Durata:** istantanea\n\nGuidato da un lampo di intuizione magica, l\u0027incantatore effettua un attacco con l\u0027arma utilizzata per lanciare l\u0027incantesimo. Per determinare il tiro per colpire e il tiro per i danni, l\u0027incantatore utilizza la sua caratteristica da incantatore invece che la Forza o la Destrezza. Se l\u0027attacco infligge danni, possono essere danni radiosi o danni normali inflitti dall\u0027arma (a scelta dell\u0027incantatore).\n\n**Trucchetto potenziato.** A prescindere dal tipo di danni che l\u0027incantatore sceglie (danni radiosi o danni normali dell\u0027arma), l\u0027attacco infligge danni radiosi extra quando l\u0027incantatore raggiunge il 5º livello (1d6), l\u002711º livello (2d6) e il 17º livello (3d6)."},{"n":"Colpo infuocato","lv":5,"sc":"Invocazione di 5º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (un pizzico di zolfo)\n**Durata:** istantanea\n\nUna colonna verticale di fuoco splendente si abbatte dall\u0027alto. Ogni creatura all\u0027interno di un cilindro del raggio di 3 metri e dell\u0027altezza di 12 metri centrato in un punto entro gittata effettua un tiro salvezza su Destrezza; se lo fallisce, subisce 5d6 danni da fuoco e 5d6 danni radiosi, mentre se lo supera subisce soltanto la metà di quei danni.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni da fuoco e i danni radiosi aumentano di 1d6 per ogni slot di livello superiore al 5º."},{"n":"Colpo intrappolante","lv":1,"sc":"Evocazione di 1º livello (Ranger)","cl":"Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus che l\u0027incantatore effettua subito dopo aver colpito una creatura con un\u0027arma\n**Gittata:** incantatore\n**Componenti:** V\n**Durata:** concentrazione, fino a 1 minuto\n\nQuando l\u0027incantatore colpisce il bersaglio, su di esso appare un groviglio di rampicanti. Il bersaglio effettua un tiro salvezza su Forza, disponendo di vantaggio a questo tiro se è una creatura di taglia Grande o superiore. Se lo fallisce, il bersaglio è trattenuto fino al termine dell\u0027incantesimo. Se lo supera, i rampicanti si ritraggono e avvizziscono, ponendo fine all\u0027incantesimo.\n\nFinché è trattenuto, il bersaglio subisce 1d6 danni perforanti all\u0027inizio di ogni suo turno. Il bersaglio o una creatura alla sua portata può usare un\u0027azione per effettuare una prova di Forza (Atletica) contro la CD del tiro salvezza sull\u0027incantesimo. In caso di successo, l\u0027incantesimo termina.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d6 per ogni slot di livello superiore al 1º."},{"n":"Coltello di ghiaccio","lv":1,"sc":"Evocazione di 1º livello (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** S, M (una goccia d\u0027acqua o un frammento di ghiaccio)\n**Durata:** istantanea\n\nL\u0027incantatore crea un frammento di ghiaccio e lo scaglia contro una creatura entro gittata, effettuando un attacco a distanza con incantesimo contro il bersaglio. Se il colpo va a segno, il bersaglio subisce 1d10 danni perforanti. Che colpisca o manchi il bersaglio, il frammento poi esplode. Il bersaglio e ogni creatura entro 1,5 metri dal punto in cui il ghiaccio è esploso devono superare un tiro salvezza su Destrezza, altrimenti subiscono 2d6 danni da freddo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni da freddo aumentano di 1d6 per ogni slot di livello superiore al 1º."},{"n":"Comando","lv":1,"sc":"Ammaliamento di 1º livello (Bardo, Chierico, Paladino)","cl":"Bardo, Chierico, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V\n**Durata:** istantanea\n\nL\u0027incantatore rivolge una parola di comando a una creatura entro gittata che egli è in grado di vedere. Il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti dovrà obbedire al comando nel suo turno successivo. Scegli il comando tra le seguenti opzioni:\n\n**Avvicinati.** Il bersaglio si muove verso l\u0027incantatore seguendo il percorso più breve e diretto, terminando il suo turno se giunge entro 1,5 metri da lui.\n\n**Fermo.** Nel suo turno, il bersaglio non si muove e non effettua alcuna azione o azione bonus.\n\n**Fuggi.** Il bersaglio usa il suo turno per allontanarsi dall\u0027incantatore nel modo più rapido possibile.\n\n**Lascia.** Il bersaglio lascia cadere ciò che stava impugnando, poi termina il suo turno.\n\n**Prostrati.** Il bersaglio cade a terra prono e termina il suo turno.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può influenzare una creatura aggiuntiva per ogni slot di livello superiore al 1º."},{"n":"Comprensione dei linguaggi","lv":1,"sc":"Divinazione di 1º livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** incantatore\n**Componenti:** V, S, M (un pizzico di fuliggine e di sale)\n**Durata:** 1 ora\n\nPer la durata dell\u0027incantesimo, l\u0027incantatore comprende il significato letterale di qualsiasi linguaggio che è in grado di sentire o vedere tramite segni. Comprende inoltre ogni linguaggio scritto che è in grado di vedere, ma deve toccare la superficie su cui sono scritte le parole. È necessario circa 1 minuto per leggere una pagina di testo. Questo incantesimo non decodifica simboli o messaggi segreti."},{"n":"Compulsione","lv":4,"sc":"Ammaliamento di 4º livello (Bardo)","cl":"Bardo","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nOgni creatura a scelta dell\u0027incantatore, entro gittata e che egli è in grado di vedere, deve superare un tiro salvezza su Saggezza, altrimenti diventa affascinata fino al termine dell\u0027incantesimo.\n\nPer la durata dell\u0027incantesimo, l\u0027incantatore può effettuare un\u0027azione bonus per scegliere una direzione orizzontale rispetto a lui. Ogni bersaglio affascinato deve usare la maggior parte possibile del suo movimento per muoversi in quella direzione nel suo turno successivo, percorrendo la via più sicura. Dopo essersi mosso in questo modo, un bersaglio ripete il tiro salvezza e, se lo supera, termina l\u0027incantesimo su di sé."},{"n":"Comunione","lv":5,"sc":"Divinazione di 5º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto o rituale\n**Gittata:** incantatore\n**Componenti:** V, S, M (incenso)\n**Durata:** 1 minuto\n\nL\u0027incantatore entra in contatto con una divinità o un emissario divino e, prima della fine dell\u0027incantesimo, pone fino a tre domande a cui è possibile rispondere con sì o no. L\u0027incantatore riceve una risposta corretta per ogni domanda.\n\nGli esseri divini non sono necessariamente onniscienti, quindi l\u0027incantatore potrebbe ricevere \"ignoto\" come risposta se una domanda riguarda informazioni che vanno oltre le loro conoscenze. Nel caso in cui una risposta di una parola sola possa rivelarsi fuorviante o contraria agli interessi della divinità, il GM può fornire come risposta una breve frase.\n\nSe l\u0027incantatore lancia l\u0027incantesimo più volte prima di completare un riposo lungo, esiste una probabilità cumulativa del 25% di non ottenere risposta per ogni lancio dopo il primo."},{"n":"Comunione con la natura","lv":5,"sc":"Divinazione di 5º livello (Druido, Ranger)","cl":"Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto o rituale\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore entra in comunione con gli spiriti della natura e acquisisce conoscenza dell\u0027area circostante. All\u0027aperto, l\u0027incantesimo fornisce all\u0027incantatore la conoscenza dell\u0027area entro un raggio di 4,5 chilometri. Nelle caverne e in altri ambienti naturali sotterranei, il raggio è limitato a 90 metri. L\u0027incantesimo non funziona nei luoghi in cui la natura è stata sostituita da costruzioni, come castelli e insediamenti.\n\nScegli tre dei seguenti fatti; l\u0027incantatore apprende i fatti che riguardano l\u0027area dell\u0027incantesimo:\n\n- Luoghi di insediamento - Ubicazione dei portali che conducono verso altri piani di esistenza - Ubicazione di una creatura con grado di sfida pari o superiore a 10 (a scelta del GM) che sia un celestiale, un elementale, un folletto, un immondo o un non morto - Il tipo di pianta, minerale o bestia più diffuso (l\u0027incantatore sceglie quale apprendere)\n\n- Ubicazione di distese d\u0027acqua Ad esempio, l\u0027incantatore può determinare l\u0027ubicazione di un potente mostro situato in quell\u0027area, l\u0027ubicazione delle distese d\u0027acqua e l\u0027ubicazione di eventuali cittadine."},{"n":"Confusione","lv":4,"sc":"Ammaliamento di 4º livello (Bardo, Druido, Mago, Stregone)","cl":"Bardo, Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 27 metri\n**Componenti:** V, S, M (tre gusci di noce)\n**Durata:** concentrazione, fino a 1 minuto\n\nOgni creatura all\u0027interno di una sfera del raggio di 3 metri centrata su un punto entro gittata a scelta dell\u0027incantatore deve superare un tiro salvezza su Saggezza, altrimenti non può effettuare azioni bonus o reazioni e deve tirare 1d10 all\u0027inizio di ogni suo turno per determinare il suo comportamento durante quel turno, consultando la tabella sottostante.\n\n1d10 Comportamento per il turno\n1 Il bersaglio non effettua alcuna azione e usa\ntutto il suo movimento per muoversi, tirando\n1d4 per la direzione: 1, nord; 2, est; 3, sud; o 4,\novest.\n2–6 Il bersaglio non si muove e non effettua azioni.\n7–8 Il bersaglio non si muove ed effettua l\u0027azione\ndi Attacco per eseguire un attacco in mischia\ncontro una creatura casuale entro portata.\nSe nessuna creatura si trova entro la sua portata, il bersaglio non effettua azioni.\n9–10 Il bersaglio sceglie il comportamento.\n\nAlla fine di ogni suo turno, un bersaglio influenzato ripete il tiro salvezza e, se lo supera, termina l\u0027incantesimo su di sé.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** Il raggio della sfera aumenta di 1,5 metri per ogni slot di livello superiore al 4º."},{"n":"Cono di freddo","lv":5,"sc":"Invocazione di 5º livello (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (un piccolo cono di cristallo o vetro)\n**Durata:** istantanea\n\nUn getto d\u0027aria gelida si propaga dall\u0027incantatore. Ogni creatura entro un cono di 18 metri che ha origine dall\u0027incantatore effettua un tiro salvezza su Costituzione, subendo 8d8 danni da freddo in caso di fallimento, o la metà dei danni in caso di successo. Una creatura uccisa da questo incantesimo si tramuta in una statua di ghiaccio finché non si scioglie.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 5º."},{"n":"Conoscenza delle leggende","lv":5,"sc":"Divinazione di 5º livello (Bardo, Chierico, Mago)","cl":"Bardo, Chierico, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** incantatore\n**Componenti:** V, S, M (incenso del valore di 250 mo o più, che l\u0027incantesimo consuma, e quattro bastoncini d\u0027avorio del valore di 50 mo o più ciascuno)\n**Durata:** istantanea\n\nL\u0027incantatore nomina o descrive una persona, un luogo o un oggetto famosi. L\u0027incantesimo riporta alla mente dell\u0027incantatore un breve riassunto delle conoscenze più significative relative a ciò che ha nominato, come descritto dal GM.\n\nQueste conoscenze possono includere dettagli importanti, rivelazioni sorprendenti o persino conoscenze segrete che non sono note ai più. Più informazioni l\u0027incantatore conosce già riguardo a ciò che ha nominato, più precise e dettagliate saranno le informazioni che riceverà. Le informazioni che riceve sono accurate, ma potrebbero essere celate da un linguaggio figurativo o sotto forma di poesia, in base alla scelta del GM.\n\nSe l\u0027incantatore nomina qualche cosa che in realtà non è famosa, sente il suono delle tristi note di un trombone, e l\u0027incantesimo fallisce."},{"n":"Contagio","lv":5,"sc":"Necromanzia di 5º livello (Chierico, Druido)","cl":"Chierico, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componente:** V, S\n**Durata:** 7 giorni\n\nIl tocco dell\u0027incantatore trasmette un contagio magico. Il bersaglio deve superare un tiro salvezza su Costituzione, altrimenti subirà 11d8 danni necrotici e sarà avvelenato. Inoltre, quando l\u0027incantatore lancia l\u0027incantesimo, sceglie una caratteristica. Mentre è avvelenato, il bersaglio subisce svantaggio ai tiri salvezza effettuati con la caratteristica scelta. Il bersaglio deve ripetere il tiro salvezza alla fine di ogni suo turno finché non raggiunge tre tiri superati o falliti. Se il bersaglio supera tre tiri salvezza, si libera dall\u0027effetto dell\u0027incantesimo. Se il bersaglio fallisce tre tiri salvezza, subisce l\u0027incantesimo per 7 giorni.\n\nOgni volta che il bersaglio avvelenato riceve un effetto che porrebbe fine all\u0027avvelenamento, deve riuscire a superare un tiro salvezza su Costituzione, altrimenti l\u0027avvelenamento permane."},{"n":"Contattare altri piani","lv":5,"sc":"Divinazione di 5º livello (Mago, Warlock)","cl":"Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto o rituale\n**Gittata:** incantatore\n**Componenti:** V\n**Durata:** 1 minuto\n\nL\u0027incantatore contatta mentalmente un semidio, lo spirito di un sapiente defunto da tempo o qualche altra entità saggia appartenente a un altro piano. Contattare questa intelligenza ultraterrena può sconvolgere la sua mente: quando l\u0027incantatore lancia questo incantesimo, deve effettuare un tiro salvezza su Intelligenza con CD 15. In caso di successo, l\u0027incantatore può porre all\u0027entità un massimo di cinque domande prima del termine dell\u0027incantesimo. Il GM risponde a ogni domanda con una parola, come per esempio \"sì\", \"no\", \"forse\", \"mai\", \"irrilevante\" o \"ignoto\" (se l\u0027entità non conosce la risposta alla domanda). Nel caso in cui una risposta di una parola sola possa rivelarsi fuorviante, il GM può fornire come risposta una breve frase. In caso di fallimento, l\u0027incantatore subisce 6d6 danni psichici ed è incapacitato finché non completa un riposo lungo. Un incantesimo ristorare superiore fa svanire questo effetto."},{"n":"Contingenza","lv":6,"sc":"Abiurazione di 6º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** incantatore\n**Componenti:** V, S, M (una statuetta dell\u0027incantatore tempestata di gemme, del valore di 1.500 mo o più)\n**Durata:** 10 giorni\n\nL\u0027incantatore sceglie un incantesimo di livello pari o inferiore a 5 che sia in grado di lanciare, che abbia un tempo di lancio di un\u0027azione e che possa avere come bersaglio l\u0027incantatore stesso. Lancia l\u0027incantesimo, chiamato incantesimo contingente, come parte del lancio di contingenza, consumando gli slot incantesimo per entrambi. L\u0027incantesimo contingente, tuttavia, non ha effetto finché non si verificano determinati inneschi che l\u0027incantatore descrive nel momento in cui lancia i due incantesimi. Per esempio, un lancio di contingenza con respirare sott\u0027acqua potrebbe stabilire che respirare sott\u0027acqua avrà effetto quando l\u0027incantatore sarà sommerso nell\u0027acqua o in un liquido simile.\n\nChe l\u0027incantatore lo desideri o meno, l\u0027incantesimo contingente ha effetto nel momento in cui gli inneschi vengono soddisfatti per la prima volta, poi contingenza termina.\n\nL\u0027incantesimo contingente ha effetto solamente sull\u0027incantatore, nonostante normalmente possa essere lanciato su altri bersagli. L\u0027incantatore può utilizzare un solo incantesimo contingenza alla volta. Se l\u0027incantatore lancia nuovamente questo incantesimo, l\u0027effetto di un altro incantesimo contingenza su di sé termina. Inoltre, contingenza termina qualora la sua componente materiale non si trovi sulla persona dell\u0027incantatore."},{"n":"Controincantesimo","lv":3,"sc":"Abiurazione di 3º livello (Mago, Stregone, Warlock)","cl":"Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** reazione, che l\u0027incantatore può effettuare quando vede una creatura entro 18 metri da lui lanciare un incantesimo con componenti verbali, somatiche o materiali\n**Gittata:** 18 metri\n**Componenti:** S\n**Durata:** istantanea\n\nL\u0027incantatore tenta di interrompere una creatura nell\u0027atto di lanciare un incantesimo. La creatura effettua un tiro salvezza su Costituzione. Se lo fallisce, l\u0027incantesimo si dissolve senza alcun effetto e l\u0027azione, azione bonus o reazione utilizzata per lanciarlo viene sprecata. Se l\u0027incantesimo è stato lanciato usando uno slot incantesimo, lo slot non viene consumato."},{"n":"Controllare acqua","lv":4,"sc":"Trasmutazione di 4º livello (Chierico, Druido, Mago)","cl":"Chierico, Druido, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 90 metri\n**Componenti:** V, S, M (una miscela di acqua e polvere)\n**Durata:** concentrazione, fino a 10 minuti\n\nFino al termine dell\u0027incantesimo, l\u0027incantatore controlla una massa d\u0027acqua all\u0027interno di un\u0027area a sua scelta, con un volume massimo pari a un cubo con spigolo di 30 metri, usando uno dei seguenti effetti. Come azione di Magia durante i suoi turni successivi, può ripetere il medesimo effetto o sceglierne uno differente.\n\n**Deviare la corrente.** L\u0027incantatore fa in modo che l\u0027acqua corrente nell\u0027area si muova in una direzione scelta da lui, anche se l\u0027acqua deve risalire ostacoli e pareti o scorrere in altre direzioni inverosimili. L\u0027acqua nell\u0027area si muove secondo le indicazioni dell\u0027incantatore, ma una volta superata l\u0027area dell\u0027incantesimo, riprende il suo corso in base al terreno. L\u0027acqua continua a scorrere nella direzione scelta fino al termine dell\u0027incantesimo o finché l\u0027incantatore non sceglie un effetto diverso.\n\n**Gorgo.** L\u0027incantatore crea un gorgo al centro dell\u0027area, che deve essere di almeno 15 metri per lato e 7,5 metri di profondità. Il gorgo permane finché l\u0027incantatore non sceglie un effetto diverso o fino al termine dell\u0027incantesimo. Il gorgo è alto 7,5 metri e ampio 1,5 metri alla base e fino a 15 metri alla sommità. Qualsiasi creatura nell\u0027acqua ed entro 7,5 metri dal gorgo viene trascinata per 3 metri verso di esso. Quando una creatura viene trascinata nel gorgo per la prima volta in un turno o vi finisce il suo turno, effettua un tiro salvezza su Forza. In caso di fallimento, la creatura subisce 2d8 danni contundenti, mentre se lo supera, subisce soltanto la metà di quei danni. Una creatura può nuotare via dal gorgo solo se prima effettua un\u0027azione per allontanarsi e supera una prova di Forza (Atletica) contro la CD del tiro salvezza sull\u0027incantesimo dell\u0027incantatore.\n\nIl livello dell\u0027acqua rimane elevato fino al termine dell\u0027incantesimo o finché l\u0027incantatore non sceglie un effetto diverso. Se questo effetto produce un\u0027onda, questa si ripete all\u0027inizio del turno successivo dell\u0027incantatore finché l\u0027effetto di inondazione permane.\n\n**Inondazione.** L\u0027incantatore fa in modo che il livello di tutta l\u0027acqua ferma dell\u0027area si alzi di un massimo di 6 metri. Se l\u0027incantatore sceglie un\u0027area all\u0027interno di un grande specchio d\u0027acqua, genera invece un\u0027onda alta 6 metri che da una parte dell\u0027area si infrange sull\u0027altra. Qualsiasi veicolo di taglia Enorme o inferiore sul percorso dell\u0027onda viene trascinato dall\u0027altra parte dell\u0027area e ha una probabilità del 25% di capovolgersi.\n\n**Separare le acque.** L\u0027incantatore fa in modo che l\u0027acqua presente nell\u0027area si separi, creando un canale che si estende per tutta l\u0027area dell\u0027incantesimo; le acque divise formano un muro su entrambi i lati. Il canale permane fino al termine dell\u0027incantesimo o finché l\u0027incantatore non sceglie un effetto diverso. L\u0027acqua poi riempie lentamente il canale nel corso del round successivo, finché il livello normale dell\u0027acqua non viene ripristinato."},{"n":"Controllare tempo atmosferico","lv":8,"sc":"Trasmutazione di 8º livello (Chierico, Druido, Mago)","cl":"Chierico, Druido, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** incantatore\n**Componenti:** V, S, M (incenso bruciato)\n**Durata:** concentrazione, fino a 8 ore\n\nL\u0027incantatore assume il controllo del tempo atmosferico entro 7,5 chilometri per la durata dell\u0027incantesimo, che dev\u0027essere lanciato in un luogo all\u0027aperto. L\u0027incantesimo termina anticipatamente se l\u0027incantatore si sposta in un luogo chiuso. Quando lancia un incantesimo, l\u0027incantatore cambia le condizioni atmosferiche attuali determinate dal GM. L\u0027incantatore può modificare le precipitazioni, la temperatura e il vento. Occorrono 1d4 × 10 minuti perché le nuove condizioni abbiano effetto. Quando questo accade, l\u0027incantatore le può cambiare di nuovo. Al termine dell\u0027incantesimo, il tempo atmosferico torna alla normalità.\n\nQuando l\u0027incantatore modifica le condizioni atmosferiche, trova la condizione attuale nelle tabelle seguenti e la modifica di un grado, verso l\u0027alto o verso il basso. Quando l\u0027incantatore cambia il vento, può modificarne anche la direzione.\n\nPrecipitazioni\nGrado Condizione\n1 Sereno\n2 Poco nuvoloso\n3 Nuvoloso o nebbia\n4 Pioggia, grandine o neve\n5 Pioggia torrenziale, grandinata violenta o\ntormenta\nTemperatura Vento\nGrado Condizione Grado Condizione\n1 Torrido 1 Calmo\n2 Caldo 2 Vento moderato\n3 Temperato 3 Vento forte\n4 Fresco 4 Burrasca\n5 Freddo 5 Tempesta\n6 Gelido"},{"n":"Costrizione","lv":5,"sc":"Ammaliamento di 5º livello (Bardo, Chierico, Druido, Mago, Paladino)","cl":"Bardo, Chierico, Druido, Mago, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** 18 metri\n**Componenti:** V\n**Durata:** 30 giorni\n\nL\u0027incantatore impartisce un comando verbale a una creatura entro gittata che egli è in grado di vedere, ordinandole di compiere un servizio di qualche tipo o ad astenersi dal compiere un\u0027azione o un\u0027attività, come da lui stabilito. Il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti rimane affascinato per la durata dell\u0027incantesimo. Il bersaglio supera automaticamente il tiro se non è in grado di comprendere il comando dell\u0027incantatore.\n\nMentre è affascinata, la creatura subisce 5d10 danni psichici se agisce in maniera direttamente contraria al comando dell\u0027incantatore, subendo questi danni non più di una volta al giorno. L\u0027incantatore può impartire al bersaglio un comando a sua scelta, a eccezione di un\u0027attività che ne provocherebbe la morte certa: se impartisce un comando suicida, l\u0027incantesimo termina.\n\nUn incantesimo desiderio, rimuovi maledizione o ristorare superiore è in grado di porre fine all\u0027incantesimo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** Se l\u0027incantatore usa uno slot incantesimo di 7º o 8º livello, la durata diventa 365 giorni. Se l\u0027incantatore usa uno slot incantesimo di 9º livello, l\u0027incantesimo dura finché uno degli incantesimi menzionati sopra non vi pone fine."},{"n":"Creare cibo e acqua","lv":3,"sc":"Evocazione di 3º livello (Chierico, Paladino)","cl":"Chierico, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore crea 22,5 chili di cibo e 120 litri d\u0027acqua fresca sul terreno o all\u0027interno di un contenitore entro gittata, utili per tenere lontani i rischi di malnutrizione e disidratazione. Il cibo è insipido ma nutriente e assomiglia a un alimento a scelta dell\u0027incantatore; l\u0027acqua è pulita. Il cibo marcisce dopo 24 ore se non viene consumato."},{"n":"Creare non morti","lv":6,"sc":"Necromanzia di 6º livello (Chierico, Mago, Warlock)","cl":"Chierico, Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** 3 metri\n**Componenti:** V, S, M (una pietra onice nera del valore di 150 mo o più per ogni cadavere)\n**Durata:** istantanea\n\nL\u0027incantatore può lanciare questo incantesimo solo di notte, scegliendo fino a tre cadaveri umanoidi di taglia Media o Piccola entro gittata. Ognuno di loro diventa un ghoul sotto il controllo dell\u0027incantatore (vedi il \"Mostri\" per la scheda delle statistiche). Come azione bonus a ogni suo turno, l\u0027incantatore può comandare mentalmente qualsiasi creatura animata con questo incantesimo, a patto che la creatura si trovi entro 36 metri da lui (se controlla varie creature, l\u0027incantatore può comandarne più di una allo stesso momento, impartendo lo stesso comando a ciascuna di loro). L\u0027incantatore decide quale azione effettuerà la creatura e dove si muoverà nel suo turno successivo, oppure può impartirle un comando generale, come restare a guardia di un determinato luogo. Se invece non impartisce alcun comando, la creatura effettua l\u0027azione Schivata e si sposta solo per evitare di subire danni. Una volta ricevuto un ordine, la creatura continua a seguirlo finché non ha portato a termine il compito.\n\nLa creatura rimane sotto il controllo dell\u0027incantatore per 24 ore, passate le quali smette di obbedire a qualsiasi comando ulteriore. Per mantenere il controllo sulla creatura per altre 24 ore, l\u0027incantatore deve lanciare questo incantesimo su di essa prima che l\u0027attuale periodo di 24 ore termini. Questo uso dell\u0027incantesimo gli permette di ristabilire il controllo su un massimo di tre creature da lui animate tramite questo incantesimo, anziché animarne di nuove.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** Se l\u0027incantatore usa uno slot incantesimo di 7º livello, può animare o ristabilire il controllo su quattro ghoul. Se l\u0027incantatore usa uno slot incantesimo di 8º livello, può animare o ristabilire il controllo su cinque ghoul, o due ghast o wight. Se l\u0027incantatore usa uno slot incantesimo di 9º livello, può animare o ristabilire il controllo su sei ghoul, tre ghast o wight, o due mummie. Vedi \"Mostri\" per le relative schede delle statistiche."},{"n":"Creare o distruggere acqua","lv":1,"sc":"Trasmutazione di 1º livello (Chierico, Druido)","cl":"Chierico, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S, M (una miscela di acqua e sabbia)\n**Durata:** istantanea\n\nL\u0027incantatore esegue una delle seguenti azioni:\n\n**Creare acqua.** L\u0027incantatore crea fino a 40 litri d\u0027acqua pulita in un contenitore aperto entro gittata. In alternativa, l\u0027acqua cade sotto forma di pioggia in un cubo con spigolo di 9 metri entro gittata, estinguendo le fiamme presenti nell\u0027area.\n\n**Distruggere acqua.** L\u0027incantatore distrugge fino a 40 litri d\u0027acqua in un contenitore aperto entro gittata. In alternativa, distrugge la nebbia presente in un cubo con spigolo di 9 metri entro gittata.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore crea o distrugge 40 litri aggiuntivi d\u0027acqua, oppure la grandezza del cubo aumenta di 1,5 metri per spigolo, per ogni slot di livello superiore al 1º."},{"n":"Creazione","lv":5,"sc":"Illusione di 5º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** 9 metri\n**Componenti:** V, S, M (un pennello)\n**Durata:** speciale\n\nL\u0027incantatore attrae a sé dei filamenti di sostanza d\u0027ombra dalla Coltre Oscura per creare un oggetto entro gittata. L\u0027oggetto può essere di materia vegetale (tessuti, corda, legno o materiali simili) o di materia minerale (pietra, cristallo, metallo o materiali simili). L\u0027oggetto non dev\u0027essere più grande di un cubo con spigolo di 1,5 metri e deve avere una forma ed essere un materiale che l\u0027incantatore ha già visto.\n\nLa durata dell\u0027incantesimo dipende dal materiale dell\u0027oggetto, come indicato nella tabella Materiali. se l\u0027oggetto è composto da vari materiali, si usa la durata più breve. Usare un qualsiasi oggetto creato da questo incantesimo come componente materiale di un altro incantesimo ne provoca il fallimento.\n\nMateriali\nMateriale Durata\nMateria vegetale 24 ore\nPietra o cristallo 12 ore\nMetalli preziosi 1 ora\nGemme 10 minuti\nAdamantio o mithral 1 minuto\n\n**Utilizzo di uno slot incantesimo di livello superiore.** Il cubo aumenta di 1,5 metri per spigolo per ogni slot di livello superiore al 5º."},{"n":"Crescita di spine","lv":2,"sc":"Trasmutazione di 2º livello (Druido, Ranger)","cl":"Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 45 metri\n**Componenti:** V, S, M (sette spine)\n**Durata:** concentrazione, fino a 10 minuti\n\nSpine e spuntoni nascono dal terreno in una sfera del raggio di 6 metri, centrata su un punto entro gittata. Per la durata dell\u0027incantesimo, l\u0027area diventa terreno difficile. Quando una creatura entra nell\u0027area o si muove al suo interno, subisce 2d4 danni perforanti ogni 1,5 metri di movimento. La trasformazione del terreno è mimetizzata in modo da sembrare naturale. Qualsiasi creatura che non stesse osservando l\u0027area al momento del lancio dell\u0027incantesimo deve effettuare un\u0027azione di Ricerca e superare una prova di Saggezza (Percezione o Sopravvivenza) contro la CD del tiro salvezza sull\u0027incantesimo per riconoscere la pericolosità del terreno prima di entrarvi."},{"n":"Crescita vegetale","lv":3,"sc":"Trasmutazione di 3º livello (Bardo, Druido, Ranger)","cl":"Bardo, Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione (Groviglio) o 8 ore (Fertilità)\n**Gittata:** 45 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nQuesto incantesimo incanala vitalità nei vegetali. Il tempo di lancio utilizzato dall\u0027incantatore determina l\u0027effetto che ha l\u0027incantesimo tra i due descritti di seguito: Groviglio o Fertilità.\n\n**Groviglio.** L\u0027incantatore sceglie un punto entro gittata e tutti i vegetali normali entro una sfera del raggio di 30 metri centrata su quel punto crescono rigogliosamente fino a formare un groviglio. Una creatura che si muove attraverso quell\u0027area deve usare 1,2 metri di movimento per ogni 30 centimetri di cui si muove. L\u0027incantatore può escludere dall\u0027influenza dell\u0027incantesimo una o più aree di qualsiasi dimensione all\u0027interno dell\u0027area scelta.\n\n**Fertilità.** Tutti i vegetali entro un raggio di 750 metri centrato in un punto entro gittata cresceranno rigogliosamente per 365 giorni e al momento del raccolto produrranno il doppio del cibo normale. I vegetali possono beneficiare di crescita vegetale solo una volta all\u0027anno."},{"n":"Cura ferite","lv":1,"sc":"Abiurazione di 1º livello (Bardo, Chierico, Druido, Paladino, Ranger)","cl":"Bardo, Chierico, Druido, Paladino, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S\n**Durata:** istantanea\n\nUna creatura toccata dall\u0027incantatore recupera un numero di punti ferita pari a 2d8 più il modificatore di caratteristica da incantatore dell\u0027incantatore.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La guarigione aumenta di 2d8 per ogni slot di livello superiore al 1º."},{"n":"Cura ferite di massa","lv":5,"sc":"Abiurazione di 5º livello (Bardo, Chierico, Druido)","cl":"Bardo, Chierico, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nUn\u0027ondata di energia curativa si sprigiona da un punto entro gittata che l\u0027incantatore è in grado di vedere. L\u0027incantatore sceglie fino a sei creature in una sfera di 9 metri di raggio centrata su quel punto: ogni bersaglio recupera una quantità di punti ferita pari a 5d8 più il modificatore di caratteristica da incantatore dell\u0027incantatore.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La guarigione aumenta di 1d8 per ogni slot di livello superiore al 5º."},{"n":"Danza irresistibile","lv":6,"sc":"Ammaliamento di 6º livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V\n**Durata:** concentrazione, fino a 1 minuto\n\nUna creatura entro gittata che l\u0027incantatore è in grado di vedere deve effettuare un tiro salvezza su Saggezza. In caso di successo, il bersaglio danza comicamente fino al termine del proprio turno successivo, durante il quale deve spendere tutto il suo movimento danzando sul posto.\n\nSe il bersaglio fallisce il tiro, diventa affascinato per la durata dell\u0027incantesimo. Mentre è affascinato, il bersaglio danza comicamente, deve spendere tutto il suo movimento danzando sul posto, subisce svantaggio ai tiri salvezza su Destrezza e ai tiri per colpire, e le altre creature dispongono di vantaggio ai tiri per colpire contro di esso. In ognuno dei suoi turni, il bersaglio può effettuare un\u0027azione per riprendere il controllo di sé e ripetere il tiro salvezza. Se lo supera, l\u0027incantesimo termina."},{"n":"Dardo di fuoco","lv":0,"sc":"Trucchetto di Invocazione (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore scaglia una scintilla di fuoco verso una creatura o un oggetto situato entro gittata, effettuando un attacco a distanza con incantesimo contro il bersaglio. Se il colpo va a segno, il bersaglio subisce 1d10 danni da fuoco. Un oggetto infiammabile colpito da questo incantesimo prende fuoco se non indossato o trasportato in quel momento.\n\n**Trucchetto potenziato.** I danni aumentano di 1d10 quando l\u0027incantatore raggiunge il 5º livello (2d10), l\u002711º livello (3d10) e il 17º livello (4d10)."},{"n":"Dardo incantato","lv":1,"sc":"Invocazione di 1º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore crea tre dardi lucenti di forza magica. Ogni dardo colpisce una creatura a scelta dell\u0027incantatore situata entro gittata che egli è in grado di vedere. Un dardo infligge 1d4 + 1 danni da forza al suo bersaglio. Tutti i dardi colpiscono simultaneamente e l\u0027incantatore può dirigerli per colpire una o più creature.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantesimo crea un dardo aggiuntivo per ogni slot di livello superiore al 1º."},{"n":"Dardo tracciante","lv":1,"sc":"Invocazione di 1º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S\n**Durata:** 1 round\n\nL\u0027incantatore scaglia un lampo di luce verso una creatura entro gittata, effettuando un attacco a distanza con incantesimo contro il bersaglio. Se il colpo va a segno, esso subisce 4d6 danni radiosi, e il successivo tiro per colpire effettuato contro il bersaglio prima del termine del turno successivo dell\u0027incantatore dispone di vantaggio.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d6 per ogni slot di livello superiore al 1º."},{"n":"Deflagrazione occulta","lv":0,"sc":"Trucchetto di Invocazione (Warlock)","cl":"Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore scaglia un raggio di energia crepitante, effettuando un attacco a distanza con incantesimo contro una creatura o un oggetto entro gittata. Se il colpo va a segno, il bersaglio subisce 1d10 danni da forza.\n\n**Trucchetto potenziato.** L\u0027incantesimo crea due raggi al 5º livello, tre raggi all\u002711º livello e quattro raggi al 17º livello. L\u0027incantatore può indirizzare i raggi contro lo stesso bersaglio o contro bersagli differenti, effettuando un tiro per colpire separato per ogni raggio."},{"n":"Desiderio","lv":9,"sc":"Evocazione di 9º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V\n**Durata:** istantanea\n\nDesiderio è l\u0027incantesimo più potente che un mortale sia in grado di lanciare. Gli basta parlare a voce alta per alterare l\u0027essenza stessa della realtà.\n\nL\u0027uso base di questo incantesimo è riprodurre un qualsiasi altro incantesimo di livello pari o inferiore all\u00278º. Utilizzandolo in questo modo, non è necessario soddisfare particolari requisiti per lanciarlo e non servono costose componenti: l\u0027incantesimo ha semplicemente effetto.\n\nIn alternativa, l\u0027incantatore può creare uno dei seguenti effetti a sua scelta:\n\n**Creazione di un oggetto.** L\u0027incantatore crea un oggetto del valore massimo di 25.000 mo che non sia un oggetto magico e che non misuri più di 90 metri in ogni dimensione. L\u0027oggetto si materializza a terra in uno spazio libero che l\u0027incantatore è in grado di vedere.\n\n**Salute istantanea.** L\u0027incantatore consente a sé e un massimo di venti creature che egli è in grado di vedere di recuperare tutti i punti ferita e pone fine a tutti gli effetti su di loro come descritto nell\u0027incantesimo ristorare superiore.\n\n**Resistenza.** L\u0027incantatore conferisce a un massimo di dieci creature che egli è in grado di vedere resistenza a un tipo di danno a sua scelta. La resistenza conferita è permanente.\n\n**Immunità a un incantesimo.** L\u0027incantatore conferisce a un massimo di dieci creature che egli è in grado di vedere immunità a un singolo incantesimo o un altro effetto magico per 8 ore.\n\n**Apprendimento improvviso.** L\u0027incantatore sostituisce uno dei suoi talenti con un altro di cui soddisfa i requisiti, perdendo tutti i benefici di quello precedente e ottenendo quelli del nuovo talento. Non è possibile sostituirne uno che è un prerequisito per altri talenti o caratteristiche del personaggio.\n\n**Ripetizione del tiro.** L\u0027incantatore annulla un singolo evento recente imponendo la ripetizione di un qualsiasi tiro effettuato entro l\u0027ultimo round (incluso il suo ultimo turno). La realtà viene rimodellata e si adatta al nuovo risultato. Per esempio, un incantesimo desiderio potrebbe annullare un tiro salvezza fallito da un alleato o il colpo critico inferto da un avversario. L\u0027incantatore può imporre che il tiro ripetuto sia effettuato con vantaggio o svantaggio e poi può scegliere se usare il tiro ripetuto o il tiro originale.\n\n**Riplasmazione della realtà.** L\u0027incantatore potrebbe desiderare qualcosa che non è incluso negli altri effetti elencati. Per farlo, deve dichiarare il suo desiderio al GM nel modo più preciso possibile. Il GM ha la massima libertà di decidere cosa accade in questi casi: più potente è il desiderio, maggiori sono le probabilità che qualcosa vada storto. L\u0027incantesimo potrebbe semplicemente fallire, l\u0027effetto desiderato potrebbe avverarsi solo in parte o l\u0027incantatore potrebbe subire conseguenze inaspettate come risultato della formulazione del desiderio. Per esempio, se desidera che un suo nemico sia morto, potrebbe essere trascinato nel futuro fino al momento in cui quel nemico non è più in vita, venendo a tutti gli effetti rimosso dal gioco. Analogamente, se desidera un manufatto o un oggetto magico leggendario, potrebbe essere trasportato istantaneamente in presenza del suo attuale proprietario. Se il desiderio viene esaudito e i suoi effetti hanno conseguenze per un\u0027intera comunità, regione o per tutto il mondo, l\u0027incantatore potrebbe attirare l\u0027attenzione di potenti nemici. Se invece potrebbe avere effetti su una divinità, i suoi servi divini potrebbero intervenire all\u0027istante per impedirlo o incoraggiare l\u0027incantatore a formularlo in un modo preciso. Se dovesse disfare il multiverso stesso, il desiderio fallisce.\n\nLa tensione provocata dal lancio di desiderio per produrre un qualsiasi effetto diverso dalla duplicazione di un altro incantesimo debilita l\u0027incantatore. Dopo aver sopportato quella tensione, ogni volta che l\u0027incantatore lancia un incantesimo prima di avere completato un riposo lungo, subisce 1d10 danni necrotici per livello di quell\u0027incantesimo. Questi danni non possono essere ridotti o prevenuti in alcun modo. Inoltre, il punteggio di Forza dell\u0027incantatore scende a 3 per 2d4 giorni. Per ognuno di quei giorni trascorso a riposare e a non fare nulla fuorché attività poco impegnative, il tempo di recupero rimanente diminuisce di 2 giorni. Esiste infine una probabilità del 33% che l\u0027incantatore non sia più in grado di lanciare desiderio, se non riesce a reggere la tensione."},{"n":"Destriero fantomatico","lv":3,"sc":"Illusione di 3º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto o rituale\n**Gittata:** 9 metri\n**Componenti:** V, S\n**Durata:** 1 ora\n\nUna creatura di taglia Grande, simile a un cavallo quasi reale, compare sul terreno in uno spazio libero entro gittata a scelta dell\u0027incantatore. L\u0027incantatore sceglie l\u0027aspetto della creatura, che è dotata di sella, morso e briglie. Qualsiasi equipaggiamento creato dall\u0027incantesimo svanisce in uno sbuffo di fumo se trasportato a più di 3 metri dal destriero.\n\nPer la durata dell\u0027incantesimo, l\u0027incantatore o una creatura a sua scelta può cavalcare il destriero, che usa la scheda delle statistiche del cavallo da galoppo (vedi \"Mostri\"), ma ha una velocità di 30 metri e può percorrere 20 chilometri in un\u0027ora. Al termine dell\u0027incantesimo, la cavalcatura svanisce gradualmente, dando al suo cavaliere 1 minuto per smontare. L\u0027incantesimo termina in anticipo se la cavalcatura subisce danni."},{"n":"Disco fluttuante","lv":1,"sc":"Evocazione di 1º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** 9 metri\n**Componenti:** V, S, M (una goccia di mercurio)\n**Durata:** 1 ora\n\nQuesto incantesimo crea un piano circolare e orizzontale di forza del diametro di 90 centimetri e spessore di 2,5 centimetri, che fluttua 90 centimetri sopra il terreno in uno spazio libero a scelta dell\u0027incantatore entro gittata e che egli è in grado di vedere. Questo disco permane per la durata dell\u0027incantesimo e può sostenere fino a 250 kg. Se si aggiunge ulteriore peso, l\u0027incantesimo termina e tutto ciò che si trovava sul disco precipita a terra. Il disco rimane immobile se l\u0027incantatore si trova entro 6 metri da esso. Se l\u0027incantatore si allontana a più di 6 metri, il disco lo segue per rimanere entro 6 metri da lui. Può muoversi sul terreno dissestato, lungo scalinate, pendii e terreni simili, ma non può superare un dislivello pari o superiore a 3 metri. Per esempio, il disco non può attraversare una fossa profonda 3 metri o uscirne se si trovasse sul fondo. L\u0027incantesimo termina se l\u0027incantatore si allontana di più di 30 metri dal disco (normalmente accade perché il disco non può superare un ostacolo per seguirlo)."},{"n":"Disintegrazione","lv":6,"sc":"Trasmutazione di 6º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (una calamita e della polvere)\n**Durata:** istantanea\n\nL\u0027incantatore lancia un raggio verde verso un bersaglio entro gittata che egli è in grado di vedere. Il bersaglio può essere una creatura, un oggetto non magico o una creazione di forza magica, come un muro creato da muro di forza.\n\nUna creatura bersagliata da questo incantesimo effettua un tiro salvezza su Destrezza. Se lo fallisce, subisce 10d6 + 40 danni da forza. Se tali danni riducono i punti ferita del bersaglio a 0, la creatura, insieme a qualsiasi oggetto non magico indossi o trasporti, viene disintegrata in polvere grigia. Il bersaglio può essere rianimato solo da un incantesimo desiderio o resurrezione pura.\n\nQuesto incantesimo disintegra automaticamente un oggetto non magico di taglia Grande o inferiore, oppure una creazione di forza magica. Se il bersaglio è Enorme o superiore, questo incantesimo ne disintegra una parte pari a un cubo con spigolo di 3 metri.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 3d6 per ogni slot di livello superiore al 6º."},{"n":"Disorientare","lv":8,"sc":"Ammaliamento di 8º livello (Bardo, Druido, Mago, Warlock)","cl":"Bardo, Druido, Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 45 metri\n**Componenti:** V, S, M (un portachiavi senza chiavi)\n**Durata:** istantanea\n\nL\u0027incantatore assale la mente di una creatura entro gittata che egli è in grado di vedere. Il bersaglio effettua un tiro salvezza su Intelligenza.\n\nSe lo fallisce, il bersaglio subisce 10d12 danni psichici e non può lanciare incantesimi o eseguire l\u0027azione di Magia. Alla fine di ogni 30 giorni, il bersaglio ripete il tiro salvezza e, se lo supera, l\u0027effetto svanisce. L\u0027effetto può essere dissolto anche tramite gli incantesimi ristorare superiore, guarigione o desiderio.\n\nIn caso di successo, subisce soltanto la metà di quei danni."},{"n":"Dissolvi il bene e il male","lv":5,"sc":"Abiurazione di 5º livello (Chierico, Paladino)","cl":"Chierico, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (polvere d\u0027argento e ferro)\n**Durata:** concentrazione, fino a 1 minuto\n\nPer la durata dell\u0027incantesimo, celestiali, elementali, folletti, immondi e non morti subiscono svantaggio ai tiri per colpire effettuati contro l\u0027incantatore. L\u0027incantatore può terminare prematuramente l\u0027incantesimo usando una delle funzioni speciali seguenti.\n\n**Congedo.** Come azione di Magia, l\u0027incantatore bersaglia una creatura che egli è in grado di vedere situata entro 1,5 metri da sé dei tipi sopraindicati. Il bersaglio deve superare un tiro salvezza su Carisma, altrimenti viene cacciata sul suo piano d\u0027origine (se non vi si trova già). Se non si trovano già sul loro piano d\u0027origine, i non morti vengono respinti nella Coltre Oscura e i folletti nella Selva Fatata.\n\n**Spezzare ammaliamento.** Come azione di Magia, l\u0027incantatore tocca una creatura affascinata, spaventata o posseduta da una o più creature dei tipi sopraindicati. Il bersaglio non è più posseduto, affascinato o spaventato da quelle creature."},{"n":"Dissolvi magie","lv":3,"sc":"Abiurazione di 3º livello (Bardo, Chierico, Druido, Mago, Paladino, Ranger, Stregone, Warlock)","cl":"Bardo, Chierico, Druido, Mago, Paladino, Ranger, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S\n**Durata:** Istantanea\n\nL\u0027incantatore sceglie una creatura, un oggetto o un effetto magico situato entro gittata. Ogni incantesimo di 3º livello o inferiore presente sul bersaglio termina. Per ogni incantesimo di 4º livello o superiore presente sul bersaglio, l\u0027incantatore effettua una prova di caratteristica usando la propria caratteristica da incantatore (CD 10 più il livello di quell\u0027incantesimo). Se la prova viene superata, l\u0027incantesimo termina.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore termina automaticamente un incantesimo sul bersaglio se il livello di quell\u0027incantesimo è pari o inferiore al livello dello slot incantesimo usato dall\u0027incantatore."},{"n":"Dito della morte","lv":7,"sc":"Necromanzia di 7º livello (Mago, Stregone, Warlock)","cl":"Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore scatena un\u0027ondata di energia negativa contro una creatura entro gittata che egli è in grado di vedere. Il bersaglio effettua un tiro salvezza su Costituzione, subendo 7d8 + 30 danni necrotici in caso di fallimento, o la metà dei danni in caso di successo.\n\nAll\u0027inizio del turno successivo dell\u0027incantatore, un umanoide ucciso da questo incantesimo si rianima come uno zombi (vedi \"Mostri\") che segue gli ordini verbali dell\u0027incantatore."},{"n":"Divinazione","lv":4,"sc":"Divinazione di 4º livello (Chierico, Druido, Mago)","cl":"Chierico, Druido, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** incantatore\n**Componenti:** V, S, M (incenso del valore di 25 mo o più, che l\u0027incantesimo consuma)\n**Durata:** istantanea\n\nQuesto incantesimo mette in contatto l\u0027incantatore con una divinità o con un servitore della divinità. L\u0027incantatore pone una sola domanda relativa a uno specifico obiettivo, evento o attività che si verificherà entro 7 giorni. Il GM fornisce una risposta onesta, che può essere una breve frase o una rima enigmatica. L\u0027incantesimo non tiene conto delle circostanze che potrebbero modificare la risposta, come il lancio di altri incantesimi.\n\nSe l\u0027incantatore lancia l\u0027incantesimo più volte prima di completare un riposo lungo, esiste una probabilità cumulativa del 25% di non ottenere risposta per ogni lancio dopo il primo."},{"n":"Dominare bestie","lv":4,"sc":"Ammaliamento di 4º livello (Druido, Ranger, Stregone)","cl":"Druido, Ranger, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nUna bestia entro gittata e che l\u0027incantatore è in grado di vedere deve superare un tiro salvezza su Saggezza, altrimenti diventa affascinata per la durata dell\u0027incantesimo. Il bersaglio dispone di vantaggio al tiro salvezza se l\u0027incantatore o i suoi alleati stanno combattendo contro di essa. Ogni volta che il bersaglio subisce danni, ripete il tiro salvezza; se lo supera, l\u0027effetto svanisce.\n\nL\u0027incantatore ha un legame telepatico con il bersaglio affascinato mentre i due si trovano sullo stesso piano di esistenza. Nel proprio turno, l\u0027incantatore può utilizzare questo legame per impartire comandi al bersaglio (nessuna azione richiesta), come ad esempio \"attacca quella creatura\", \"spostati lì\", o \"recupera quell\u0027oggetto\". Il bersaglio fa del suo meglio per obbedire nel suo turno. Se porta a termine un ordine e non riceve ulteriori istruzioni dall\u0027incantatore, agisce e si muove a suo piacimento, concentrandosi sulla propria incolumità.\n\nL\u0027incantatore può comandare al bersaglio di effettuare una reazione, ma per farlo dovrà utilizzare la propria reazione.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La concentrazione dell\u0027incantatore può durare più a lungo utilizzando uno slot incantesimo di 5º livello (fino a 10 minuti), di 6º livello (fino a 1 ora) o di 7º livello o superiore (fino a 8 ore)."},{"n":"Dominare mostri","lv":8,"sc":"Ammaliamento di 8º livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 ora\n\nUna creatura entro gittata e che l\u0027incantatore è in grado di vedere deve superare un tiro salvezza su Saggezza, altrimenti diventa affascinato per la durata dell\u0027incantesimo. Il bersaglio dispone di vantaggio al tiro salvezza se l\u0027incantatore o i suoi alleati stanno combattendo contro di essa. Ogni volta che il bersaglio subisce danni, ripete il tiro salvezza; se lo supera, l\u0027effetto svanisce.\n\nL\u0027incantatore ha un legame telepatico con il bersaglio affascinato mentre i due si trovano sullo stesso piano di esistenza. Nel proprio turno, l\u0027incantatore può utilizzare questo legame per impartire comandi al bersaglio (nessuna azione richiesta), come ad esempio \"attacca quella creatura\", \"spostati lì\", o \"recupera quell\u0027oggetto\". Il bersaglio fa del suo meglio per obbedire nel suo turno. Se porta a termine un ordine e non riceve ulteriori istruzioni dall\u0027incantatore, agisce e si muove a suo piacimento, concentrandosi sulla propria incolumità.\n\nL\u0027incantatore può comandare al bersaglio di effettuare una reazione, ma per farlo dovrà utilizzare la propria reazione.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La concentrazione dell\u0027incantatore può durare più a lungo usando uno slot incantesimo di 9º livello (fino a 8 ore)."},{"n":"Dominare persone","lv":5,"sc":"Ammaliamento di 5º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nUn umanoide entro gittata e che l\u0027incantatore è in grado di vedere deve superare un tiro salvezza su Saggezza, altrimenti diventa affascinato per la durata dell\u0027incantesimo. Il bersaglio dispone di vantaggio al tiro salvezza se l\u0027incantatore o i suoi alleati stanno combattendo contro di essa. Ogni volta che il bersaglio subisce danni, ripete il tiro salvezza; se lo supera, l\u0027effetto svanisce.\n\nL\u0027incantatore ha un legame telepatico con il bersaglio affascinato mentre i due si trovano sullo stesso piano di esistenza. Nel proprio turno, l\u0027incantatore può utilizzare questo legame per impartire comandi al bersaglio (nessuna azione richiesta), come ad esempio \"attacca quella creatura\", \"spostati lì\", o \"recupera quell\u0027oggetto\". Il bersaglio fa del suo meglio per obbedire nel suo turno. Se porta a termine un ordine e non riceve ulteriori istruzioni dall\u0027incantatore, agisce e si muove a suo piacimento, concentrandosi sulla propria incolumità.\n\nL\u0027incantatore può comandare al bersaglio di effettuare una reazione, ma per farlo dovrà utilizzare la propria reazione.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La concentrazione dell\u0027incantatore può durare più a lungo utilizzando uno slot incantesimo di 6º livello (fino a 10 minuti), di 7º livello (fino a 1 ora) o di 8º livello o superiore (fino a 8 ore)."},{"n":"Elementalismo","lv":0,"sc":"Trucchetto di Trasmutazione (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore esercita il suo controllo sugli elementi, creando uno dei seguenti effetti entro gittata.\n\n**Richiamo del fuoco.** Nell\u0027area di un cubo con spigolo di 1,5 metri, l\u0027incantatore crea una piccola nube di braci non incandescenti, colorate e che emettono fumo e un odore particolare. L\u0027incantatore sceglie il colore e l\u0027odore delle braci, che si possono usare per accendere candele, torce o lampade in quell\u0027area. L\u0027odore del fumo permane per 1 minuto.\n\n**Richiamo dell\u0027acqua.** L\u0027incantatore crea uno spruzzo d\u0027acqua fresca nebulizzata che inumidisce leggermente le creature e gli oggetti all\u0027interno di un cubo con spigolo di 1,5 metri. In alternativa, crea 1 coppa di acqua pulita da riversare all\u0027interno di un contenitore aperto o su una superficie; l\u0027acqua evapora dopo 1 minuto.\n\n**Richiamo dell\u0027aria.** Nell\u0027area di un cubo con spigolo di 1,5 metri, l\u0027incantatore crea una brezza in grado di far svolazzare i tessuti, sollevare la polvere, far oscillare le foglie e chiudere porte e persiane aperte. Se le porte e le persiane sono tenute aperte da qualcuno, l\u0027incantesimo non ha effetto su di esse.\n\n**Richiamo della terra.** L\u0027incantatore crea un sottile velo di polvere o sabbia che ricopre le superfici di un\u0027area di 1,5 metri per lato, oppure fa comparire una singola parola scritta nella sua calligrafia su un lembo di terra o un letto di sabbia.\n\n**Scolpire elementi.** L\u0027incantatore fa in modo che un elemento a sua scelta tra terra, sabbia, fuoco, fumo, nebbia o acqua (in una quantità tale da poter essere contenuto in un cubo con spigolo di 30 centimetri) assuma una forma rozza (come quella di una creatura) per 1 ora."},{"n":"Eroismo","lv":1,"sc":"Ammaliamento di 1º livello (Bardo, Paladino)","cl":"Bardo, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nUna creatura consenziente toccata dall\u0027incantatore è animata da grande coraggio. Fino al termine dell\u0027incantesimo, la creatura è immune alla condizione spaventato e all\u0027inizio di ogni suo turno ottiene una quantità di punti ferita temporanei pari al modificatore di caratteristica da incantatore dell\u0027incantatore.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 1º."},{"n":"Esilio","lv":4,"sc":"Abiurazione di 4º livello (Chierico, Mago, Paladino, Stregone, Warlock)","cl":"Chierico, Mago, Paladino, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S, M (un pentacolo)\n**Durata:** concentrazione, fino a 1 minuto\n\nUna creatura entro gittata che l\u0027incantatore è in grado di vedere deve superare un tiro salvezza su Carisma o essere trasportata in un semipiano sicuro per la durata dell\u0027incantesimo. Mentre si trova lì, il bersaglio è incapacitato. Al termine dell\u0027incantesimo, il bersaglio riappare nello spazio in cui si trovava prima del lancio o, se è occupato, nello spazio libero più vicino.\n\nSe l\u0027incantesimo sul bersaglio dura 1 minuto, il bersaglio non fa ritorno se è un\u0027aberrazione, un celestiale, un elementale, un folletto o un immondo. In questo caso, viene trasportato in un luogo casuale di un piano (a scelta del GM) associato al tipo di creatura di cui fa parte.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 4º."},{"n":"Esplosione solare","lv":8,"sc":"Invocazione di 8º livello (Chierico, Druido, Mago, Stregone)","cl":"Chierico, Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 45 metri\n**Componenti:** V, S, M (un frammento di pietra di sole)\n**Durata:** istantanea\n\nUna radiosa luce solare splende in una sfera del raggio di 18 metri, centrata su un punto entro gittata a scelta dell\u0027incantatore. Ogni creatura al suo interno deve effettuare un tiro salvezza su Costituzione. Se lo fallisce, subisce 12d6 danni radiosi e rimane accecata per 1 minuto, mentre se lo supera subisce solo la metà dei danni.\n\nUna creatura accecata da questo incantesimo effettua un altro tiro salvezza su Costituzione al termine di ogni suo turno, facendone svanire l\u0027effetto in caso di successo.\n\nQuesto incantesimo dissolve qualsiasi oscurità nell\u0027area creata da un incantesimo."},{"n":"Estasiare","lv":2,"sc":"Ammaliamento di 2º livello (Bardo, Warlock)","cl":"Bardo, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore pronuncia una sequenza di parole disorientante, costringendo le creature da lui scelte entro gittata e che egli è in grado di vedere a effettuare un tiro salvezza su Saggezza. Se l\u0027incantatore o i suoi compagni stanno combattendo contro una creatura, quella supera automaticamente questo tiro salvezza. In caso di fallimento, il bersaglio subisce una penalità di −10 alle prove di Saggezza (Percezione) e alla Percezione passiva fino al termine dell\u0027incantesimo."},{"n":"Evoca animali","lv":3,"sc":"Evocazione di 3º livello (Druido, Ranger)","cl":"Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore evoca degli spiriti della natura che appaiono come un branco Grande di animali spettrali e intangibili in uno spazio libero entro gittata che l\u0027incantatore è in grado di vedere. Il branco permane per la durata dell\u0027incantesimo e l\u0027incantatore può scegliere la forma animale assunta dagli spiriti, per esempio lupi, serpenti o uccelli.\n\nMentre si trova entro 1,5 metri dal branco, l\u0027incantatore dispone di vantaggio ai tiri salvezza su Forza e, quando si muove nel suo turno, può spostare anche il branco fino a 9 metri in uno spazio libero che è in grado di vedere.\n\nOgni volta che il branco si muove entro 3 metri da una creatura che l\u0027incantatore è in grado di vedere e ogni volta che una creatura che l\u0027incantatore è in grado di vedere entra in uno spazio entro 3 metri dal branco o vi termina il suo turno, l\u0027incantatore può costringerla a effettuare un tiro salvezza su Destrezza. In caso di fallimento, subisce 3d10 danni taglienti. Una creatura effettua questo tiro salvezza solo una volta per turno.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d10 per ogni slot di livello superiore al 3º."},{"n":"Evoca celestiale","lv":7,"sc":"Evocazione di 7º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 27 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore evoca uno spirito dai Piani Superiori, che si manifesta come un pilastro di luce in un cilindro del raggio di 3 metri e dell\u0027altezza di 12 metri centrato in un punto entro gittata. Per ogni creatura che l\u0027incantatore è in grado di vedere nel cilindro, sceglie quale di queste luci brilla su di essa:\n\n**Luce curatrice.** Il bersaglio recupera una quantità di punti ferita pari a 4d12 p
