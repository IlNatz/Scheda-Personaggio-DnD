u0027arma **+1** e conta come argentata. Guadagna tacche come le altre armi, ma **non si annerisce**: quando le tacche arrivano alla sua soglia, il primo attacco che va a segno in ogni tuo turno infligge 1d6 danni taglienti in più.","pag":"Armamenti III · Rari"},{"n":"L\u0027Arco della Preda Giurata","tipo":"arma (qualunque arco), raro","sint":false,"base":"qualunque arco","bonus":0,"md":"Un arco di corno e di tasso, con una tacca incisa sull\u0027impugnatura per ogni preda che ha ucciso. Quando fai un attacco a distanza contro una creatura, puoi dire _a morte la preda giurata_ e renderla la tua **preda giurata**. Ne puoi avere una sola alla volta, e per sceglierne un\u0027altra devi uccidere quella che hai, oppure aspettare che cambi la fase della luna. Contro la tua preda giurata hai vantaggio ai tiri per colpire con quest\u0027arco, la preda non beneficia di copertura, e non hai svantaggio a gittata lunga. Se la preda giurata è un Worgen o un\u0027altra creatura che cambia forma, ogni attacco a segno le infligge 3d8 danni perforanti in più.","pag":"Armamenti III · Rari"},{"n":"L\u0027Egida d\u0027Argento","tipo":"armatura (scudo), rara, richiede sintonia con chi ha giurato a Selenar","sint":true,"base":"","bonus":1,"md":"Uno scudo **+1** tutto d\u0027argento, con il simbolo della Luna nelle sue tre facce inciso al centro. Ha **2 cariche** e le recupera alla prima campana. Con un\u0027azione puoi spendere una carica per lanciare _velocità_ o _volare_ su di te, senza spendere slot.","pag":"Armamenti III · Rari"},{"n":"La Punta del Segugio","tipo":"arma (lancia, picca o tridente), rara","sint":false,"base":"lancia, picca o tridente","bonus":1,"md":"Un\u0027arma in asta con la punta d\u0027argento a forma di muso di cane. È un\u0027arma **+1**, conta come argentata, e la sua soglia di annerimento è più alta di 5.","pag":"Armamenti III · Rari"},{"n":"Il Maglio di Edric Vorne","tipo":"arma (maglio), molto rara, unica, richiede sintonia","sint":true,"base":"maglio","bonus":2,"md":"Un maglio di ferro nero con il manico di quercia cerchiato d\u0027argento annerito, così pesante che pochi lo alzano con una mano sola. Hai un bonus di **+2** ai tiri per colpire e ai danni con quest\u0027arma, e ogni colpo infligge 1d6 danni necrotici in più, che ignorano la resistenza e l\u0027immunità ai danni necrotici. Quando ottieni un 20 naturale con il maglio, ottieni 12 PF temporanei.","pag":"Armamenti IV · Molto Rari"},{"n":"Le Lame del Ghiaccio Vecchio","tipo":"arma (qualunque arma che infligge danni taglienti), molto rara, richiede sintonia","sint":true,"base":"qualunque arma che infligge danni taglienti","bonus":0,"md":"Lame scheggiate da un ghiaccio che non si scioglie, trasparente come il vetro, così fredde che non si possono toccare a mani nude. Ogni colpo infligge 1d4 danni da freddo in più, e i danni taglienti dell\u0027arma ignorano la resistenza. Quando ottieni un 20 naturale, dalla lama esce un vento gelido in un cono di 6 m: ogni creatura nel cono, tranne te, subisce 4d6 danni da freddo, o la metà se supera un tiro salvezza su Costituzione con CD 15.\nSe attacchi con una di queste lame senza essere in sintonia, subisci 1d8 danni da freddo a ogni attacco.","pag":"Armamenti IV · Molto Rari"},{"n":"I Pezzi della Luna","tipo":"armatura, molto rara","sint":false,"base":"","bonus":0,"md":"Tre pezzi d\u0027argento lavorati dalle Guardiane del Santuario, che danno luce fioca in un raggio di 1,5 m quando la luna li tocca. Funzionano soltanto **sotto la luce diretta della luna**, e funzionano meglio insieme.\n- **I Guanti della Luna.** Guanti di cuoio bianco con le dita d\u0027argento. Hai vantaggio alle prove di Destrezza (Rapidità di Mano). Se porti anche un altro Pezzo della Luna, puoi ritirare gli 1 e i 2 ai tiri per colpire, e devi tenere il nuovo risultato.\n- **L\u0027Elmo della Luna.** Un elmo aperto, liscio come uno specchio. Ottieni un bonus di +1 alla CA, o di +2 se porti anche un altro Pezzo della Luna.\n- **Gli Stivali della Luna.** Stivali alti, con la suola d\u0027argento. La tua velocità aumenta di 1,5 m, o di 3 m se porti anche un altro Pezzo della Luna.","pag":"Armamenti IV · Molto Rari"},{"n":"L\u0027Armatura della Cavalcata","tipo":"armatura (piastre), molto rara, richiede sintonia con un guerriero o un paladino","sint":true,"base":"","bonus":0,"md":"Una piastra completa nera, ammaccata da colpi che nessuno ha dato, gelida dentro come una cantina. Ottieni un bonus di +1 alla CA e l\u0027immunità ai danni necrotici. Una volta per riposo breve, puoi lasciare che l\u0027armatura beva da te: subisci 1d12 danni perforanti, che non possono essere ridotti, e fai un attacco con un\u0027arma come azione bonus.\n**Maledizione.** Una volta indossata non riesci più a togliertela. Se muori mentre la porti, ti rialzi alla prima campana come uno dei cavalieri della Cavalcata. Serve _rimuovi maledizione_ lanciato con uno slot di 7° livello o superiore.","pag":"Armamenti IV · Molto Rari"},{"n":"L\u0027Arma del Castigo d\u0027Argento","tipo":"arma (qualunque), molto rara, richiede sintonia","sint":true,"base":"qualunque","bonus":0,"md":"Un\u0027arma d\u0027argento brunito, con la luna incisa sul piatto. Conta come argentata. Quando colpisci con quest\u0027arma una creatura che cambia forma, le infliggi 1d6 danni radianti in più. Con un\u0027azione bonus puoi far brillare l\u0027arma di una luce pallida, e fino alla fine del tuo turno successivo i Worgen e le altre creature maledette dal lupo hanno svantaggio ai tiri per colpire contro di te.","pag":"Armamenti IV · Molto Rari"},{"n":"L\u0027Elmo del Muso d\u0027Orso","tipo":"armatura (elmo), molto raro","sint":false,"base":"","bonus":0,"md":"Un elmo di ferro nero battuto a forma di muso d\u0027orso infuriato, che sembra adattarsi al cranio di chi lo mette. Ottieni un bonus di +2 all\u0027iniziativa e hai vantaggio ai tiri per colpire contro le creature che non sono al massimo dei loro PF. I tuoi attacchi di opportunità sono critici con un 19 o un 20, e quando riduci una creatura a 0 PF ottieni PF temporanei pari al tuo modificatore di Costituzione.\n**Maledizione.** Finché lo indossi i tuoi PF massimi si riducono di 10, e non riesci a ignorare una creatura ferita: se ce n\u0027è una entro la tua velocità, devi muoverti verso di lei. Serve _rimuovi maledizione_ lanciato con uno slot di 6° livello o superiore.","pag":"Armamenti IV · Molto Rari"},{"n":"La Picca dello Stendardo","tipo":"arma (picca), leggendaria, richiede sintonia","sint":true,"base":"picca","bonus":3,"md":"Un\u0027asta di frassino nero con la punta di ferro della vecchia Marca e uno stendardo color stoppia, rammendato cento volte, con una lancia piantata in un campo di grano ricamata al centro e piastrine di piombo cucite sull\u0027orlo. È un\u0027arma magica **+3**.\n- **Piantare lo stendardo.** Con un\u0027azione pianti la picca nel terreno, in uno spazio libero entro 1,5 m da te, e srotoli lo stendardo. Dalla terra si alza un soldato della Marca, con le statistiche del cavaliere del manuale dei mostri ma di tipo non morto, che agisce subito dopo di te, obbedisce ai tuoi ordini e ti difende se sei Incapacitato. Finché lo stendardo resta piantato, tu e i tuoi alleati entro 9 m da lui non potete essere Spaventati. Il soldato torna sotto terra dopo 10 minuti, se lo congedi con un\u0027azione bonus o se qualcuno toglie la picca dal terreno. Non puoi farlo di nuovo finché non termini un riposo lungo.\n- **Il nome.** Quando con la picca riduci a 0 PF un non morto che un tempo era umanoide, puoi dire un nome e poi _è finita_. Se è il suo nome, non si rialza più, e nessuna magia della Notte può rialzarlo.\n- **Il peso.** Finché sei in sintonia, non puoi lasciare indietro un compagno caduto. Se un tuo alleato muore e te ne vai senza portare via il corpo o almeno il suo nome, la picca pesa come piombo, e hai svantaggio ai tiri per colpire con lei finché non torni a prenderlo.","pag":"Armamenti V · Leggendari"},{"n":"Il Bisturi del Quinto Chiodo","tipo":"arma (pugnale), leggendaria, richiede sintonia","sint":true,"base":"pugnale","bonus":3,"md":"Una lama lunga e sottile come quella di un chirurgo, con le misure incise sul piatto, e il manico di vetro trasparente, cavo, chiuso da un tappo d\u0027argento. È un\u0027arma magica **+3**, e i suoi danni perforanti ignorano la resistenza e l\u0027immunità.\n- **Il taglio pulito.** Quando colpisci una creatura con il bisturi, puoi decidere che non possa recuperare PF fino all\u0027inizio del tuo turno successivo.\n- **Il campione.** Quando riduci a 0 PF una creatura con il bisturi, nel manico di vetro resta un filo del suo sangue, e ottieni PF temporanei pari al doppio del suo Grado di Sfida, con un minimo di 1. Il manico tiene un campione alla volta, e svuotarlo richiede un\u0027azione.","pag":"Armamenti V · Leggendari"},{"n":"Il Maglio dell\u0027Ultimo Battito","tipo":"arma (maglio), leggendaria, richiede sintonia","sint":true,"base":"maglio","bonus":3,"md":"Un maglio di ferro dei Colli Rossi forgiato nelle sette notti in cui il cuore di un dio brucia nella brace madre di Vaucel, con il ferro del carro che lo ha portato fin lì. La testa è sempre tiepida, e dentro, appoggiando l\u0027orecchio, si sente battere. È un\u0027arma magica **+3**, e ogni colpo infligge 2d6 danni da fuoco in più. Il suo fuoco è **fuoco vecchio**, il più vecchio del continente.\n- **Il battito.** Quando colpisci una creatura con il maglio, puoi far battere il colpo come batteva il cuore: la creatura, e ogni creatura a tua scelta entro 3 m da lei, subisce 4d6 danni da tuono e deve superare un tiro salvezza su Costituzione con CD 18 o essere Stordita fino alla fine del tuo turno successivo. Non puoi farlo di nuovo finché non termini un riposo breve.\n- **Le incudini.** Quando colpisci con il maglio, le incudini e le campane entro 30 m suonano da sole.","pag":"Armamenti V · Leggendari"},{"n":"Il Tridente di Ottone Scaglia","tipo":"arma (tridente), leggendaria, richiede sintonia","sint":true,"base":"tridente","bonus":3,"md":"Un tridente d\u0027oro rosso, caldo al tatto, con l\u0027asta coperta di filamenti sottili come capelli che si muovono quando nessuno guarda. È un\u0027arma magica **+3**, ogni colpo infligge 2d8 danni da freddo in più, e puoi lanciarlo (gittata 6/18 m): torna nella tua mano subito dopo l\u0027attacco. Finché lo impugni respiri sott\u0027acqua e hai una velocità di nuoto pari alla tua velocità.\n- **Le Nozze.** Una volta per riposo lungo puoi piantarlo nell\u0027acqua e lanciare _controllare l\u0027acqua_ (CD 18) senza spendere slot.\n- **L\u0027oro cresce.** I filamenti dell\u0027asta entrano nel polso di chi lo impugna. Ogni volta che termini un riposo lungo in sintonia tira 1d20, e con 1–5 l\u0027oro avanza. La terza volta che succede ottieni il tratto _Anfibio_ e hai svantaggio ai tiri per colpire e alle prove di Saggezza (Percezione) basate sulla vista in luce intensa, e da quel momento non puoi più terminare la sintonia, a meno di non tagliarti la mano.","pag":"Armamenti V · Leggendari"},{"n":"L\u0027Arpione del Palco Vecchio","tipo":"arma (lancia), leggendaria, richiede sintonia","sint":true,"base":"lancia","bonus":3,"md":"Un arpione da foca con le punte d\u0027osso e l\u0027asta consumata dalle mani, legato a una corda di budello. Quando il vento dei ghiacciai ha imparato l\u0027inno, l\u0027ha imparato anche lui, e lo canta piano. È un\u0027arma magica **+3**, puoi lanciarlo (gittata 6/18 m), e con un\u0027azione bonus lo tiri indietro per la corda: se ha colpito una creatura di taglia Grande o inferiore, puoi trascinarla di 3 m verso di te.\n- **L\u0027inno.** Finché lo impugni hai vantaggio ai tiri salvezza su Saggezza e su Carisma, e sei immune agli effetti che fermano, rallentano o ripetono il tempo intorno a te.\n- **Uguale.** Quando colpisci con l\u0027arpione, puoi ripetere lo stesso colpo, uguale: la creatura subisce di nuovo gli stessi danni, senza tirarli. Non puoi farlo di nuovo finché non termini un riposo breve.","pag":"Armamenti V · Leggendari"},{"n":"Il Bastone del Pastore","tipo":"arma (bastone ferrato), leggendaria, richiede sintonia","sint":true,"base":"bastone ferrato","bonus":3,"md":"Un bastone da pastore bianco come il gesso, con il manico ricurvo consumato dalla mano di chi ci si è appoggiato per una vita. È tiepido, e non pesa niente. È un\u0027arma magica **+3**. Se sei un incantatore puoi usarlo come focus, e hai un bonus di +2 ai tiri per colpire con gli incantesimi e alla CD dei tuoi incantesimi.\n- **Dare un nome.** Con un\u0027azione indichi una creatura che vedi entro 18 m e le dai un nome ad alta voce. La creatura deve superare un tiro salvezza su Carisma con CD 19, o per 1 minuto non può cambiare forma, diventare invisibile, teletrasportarsi, diventare incorporea o lasciare questo piano: è quella, con quel nome, e basta. Non puoi farlo di nuovo finché non termini un riposo lungo.\n- **Il gregge.** Sai sempre dove sono i tuoi alleati entro 1,5 km. Quando un alleato entro 9 m da te sta per essere spostato contro la sua volontà, puoi usare la reazione per farlo restare dov\u0027è.\n- **La fame.** Chi lo porta non sente più la fame.","pag":"Armamenti V · Leggendari"},{"n":"L\u0027Arco dell\u0027Ultima Alba","tipo":"arma (arco lungo), leggendaria, richiede sintonia","sint":true,"base":"arco lungo","bonus":3,"md":"L\u0027arco delle guardie del campanile di Solvoran, di tasso nero e corno, con un grumo d\u0027oro incastonato nell\u0027impugnatura che illumina le dita di chi lo tende. È un\u0027arma magica **+3**. Ogni freccia scoccata brilla, e infligge 2d6 danni radianti in più, o 4d6 contro i non morti.\n- **La prima luce.** Con un\u0027azione scocchi una freccia che diventa un raggio di luce, una linea lunga 36 m e larga 1,5 m. Ogni creatura sulla linea deve superare un tiro salvezza su Destrezza con CD 19, o subire 8d8 danni radianti, la metà se lo supera. Non puoi farlo di nuovo finché non termini un riposo lungo.\n- **La luce del Sole.** Una volta sola, puoi consumare il grumo: la freccia porta la luce del Sole, quella vera. Dopo, l\u0027arco è un arco lungo +2, e non ha altri poteri.","pag":"Armamenti V · Leggendari"},{"n":"La Settima Catena","tipo":"arma (mazzafrusto), leggendaria, richiede sintonia","sint":true,"base":"mazzafrusto","bonus":3,"md":"Una catena di ferro e d\u0027argento lunga tre metri, con gli anelli consacrati nella lunaria, e in fondo un anello da muro strappato con un pezzo di pietra ancora attaccato. È un\u0027arma magica **+3** con portata 3 m. Contro i Worgen e le altre creature che cambiano forma infligge 2d6 danni radianti in più.\n- **Tenere.** Quando colpisci una creatura di taglia Grande o inferiore puoi avvolgerla con la catena: è Afferrata (CD 19 per sfuggire), e finché resta Afferrata non può cambiare forma né teletrasportarsi.\n- **Le Regole antiche.** Hai vantaggio ai tiri salvezza contro gli effetti che ti farebbero cambiare forma, perdere il controllo di te stesso o essere posseduto.","pag":"Armamenti V · Leggendari"},{"n":"Le Unghie della Prima","tipo":"arma (unghie), leggendaria, richiede sintonia","sint":true,"base":"unghie","bonus":3,"md":"Un paio di guanti di ferro nero, con montate sulle dita le unghie che una lupa ha consumato scavando nella roccia per anni. Sono armi da mischia **+3**, leggere e accurate, che infliggono 1d8 danni taglienti l\u0027una, e si usano insieme come due armi leggere.\n- **Il silenzio.** Gli animali non ti attaccano per primi, e hai vantaggio alle prove di Destrezza (Furtività) quando non indossi un\u0027armatura pesante.\n- **La regola.** Contro le creature che hanno mangiato carne umana, le unghie infliggono 2d8 danni taglienti in più.\n- **La forma di mezzo.** Con un\u0027azione bonus assumi per 1 minuto la forma di mezzo, né bestia né persona: la tua velocità aumenta di 3 m, hai vantaggio alle prove e ai tiri salvezza su Forza, la tua scurovisione aumenta di 18 m, e ogni colpo con le unghie infligge 1d6 danni taglienti in più. Non puoi farlo di nuovo finché non termini un riposo lungo.","pag":"Armamenti V · Leggendari"},{"n":"Il Falcione di Corno Bianco","tipo":"arma (falcione), leggendaria, richiede sintonia","sint":true,"base":"falcione","bonus":3,"md":"Un\u0027asta di pino bianco che profuma di resina, con la lama ricavata da un palco di cervo bianco come la neve, affilato fino a tagliare. È un\u0027arma magica **+3**, ogni colpo infligge 2d8 danni da freddo in più, e i suoi colpi non fanno nessun rumore.\n- **La neve sospesa.** Con un\u0027azione fermi la neve nell\u0027aria in una sfera di 9 m di raggio centrata su di te, per 1 minuto. Ogni creatura a tua scelta nella sfera deve superare un tiro salvezza su Costituzione con CD 19, o essere rallentata come dall\u0027incantesimo _lentezza_ finché resta nella sfera. Ripete il tiro salvezza alla fine di ogni suo turno. Non puoi farlo di nuovo finché non termini un riposo lungo.\n- **L\u0027inverno.** Alla luce del Sole, quella vera, il falcione non ha nessun potere.","pag":"Armamenti V · Leggendari"},{"n":"Lo Stocco del Quinto Atto","tipo":"arma (stocco), leggendaria, richiede sintonia","sint":true,"base":"stocco","bonus":3,"md":"Sembra uno stocco di scena, di legno dorato e con l\u0027elsa a forma di maschera, ma taglia come l\u0027acciaio. È un\u0027arma magica **+3**, e puoi usare il modificatore di Carisma invece di quello di Forza o di Destrezza per i tiri per colpire e per i danni.\n- **La battuta.** Quando colpisci una creatura con lo stocco, deve superare un tiro salvezza su Carisma con CD 18 o dimenticare la sua prossima battuta: fino alla fine del suo turno successivo non può parlare né lanciare incantesimi con componente verbale.\n- **La parte.** Con un\u0027azione bonus prendi la faccia, la voce e il modo di camminare di una creatura umanoide che hai colpito con lo stocco nell\u0027ultima ora, per 1 ora. Per smascherarti serve una prova di Saggezza (Intuizione) con CD 25. Non puoi farlo di nuovo finché non termini un riposo lungo.","pag":"Armamenti V · Leggendari"},{"n":"La Corona del Monarca","tipo":"armatura (elmo), leggendaria, unica, richiede sintonia","sint":true,"base":"","bonus":3,"md":"Una corona d\u0027oro rosso con i rubini grandi come unghie, pesante come un elmo, e dentro una fodera di velluto che sa ancora di fumo di pira. Indossata, ti dà un bonus di **+3** alla CA.\n- Una volta per riposo lungo puoi lanciare _preghiera di guarigione_ senza spendere slot. Quando lo fai tira 1d6, e con un 6 puoi lanciarlo di nuovo prima del riposo lungo.\n- Non puoi essere Accecato, resisti senza danni al freddo estremo, e i tuoi incantesimi che infliggono danni da fuoco ignorano la resistenza al fuoco.","pag":"Armamenti V · Leggendari"},{"n":"Lo Scettro dell\u0027Opale Rosso","tipo":"arma (mazza), leggendaria, unica, richiede sintonia con un Pallido","sint":true,"base":"mazza","bonus":3,"md":"Uno scettro nero, con in cima un opale tenuto da artigli che ricordano un braccio mostruoso. Nelle notti delle Due Lune, quando la seconda luna lo illumina, l\u0027opale vibra e manda un suono sottile, come un dito bagnato sul bordo di un bicchiere. Si usa come una mazza **+3** annerita, e non si pulisce mai.\n- **I doni.** Chi si sintonizza con lo scettro ottiene tre Doni della Notte in più, a sua scelta, tra quelli del [[Il Pallido|Pallido]], e la sintonia dura fino alla sua morte.\n- **Il padrone.** Se un\u0027altra creatura prova a sintonizzarsi con lo scettro mentre il suo padrone è vivo, il padrone lo sa subito, e può comparire accanto allo scettro, con la mano sull\u0027impugnatura. Se sceglie di non farlo, lo scettro rompe la sintonia con lui, e il padrone muore.","pag":"Armamenti V · Leggendari"},{"n":"Il Cappio del Mugnaio","tipo":"arma (mazzafrusto), leggendaria, richiede sintonia con una creatura di allineamento non buono","sint":true,"base":"mazzafrusto","bonus":3,"md":"Un cappio di canapa nera, consumato e indurito, che puzza di tutti quelli che ha strangolato. In fondo, legato con un nodo da boia, c\u0027è il teschio di un bambino, e si usa per colpire. È un mazzafrusto magico **+3**, e ogni colpo infligge 2d8 danni necrotici in più. Quando ottieni un 20 naturale, infliggi danni contundenti in più pari al doppio del tuo modificatore di Costituzione.\n**Maledizione.** Il cappio è già annerito, con una soglia di 7, e finché sei in sintonia i tuoi PF massimi si riducono di 7, e la riduzione non si toglie in nessun modo. Per terminare la sintonia serve _rimuovi maledizione_, o una magia simile.","pag":"Armamenti V · Leggendari"},{"n":"Lo Spillone della Matriarca","tipo":"arma (stocco), artefatto, richiede sintonia","sint":true,"base":"stocco","bonus":3,"md":"Un ago lungo come una spada, di un osso bianco lucido, con l\u0027elsa intarsiata a forma di ragnatela. È un\u0027arma magica **+3**: puoi usare il modificatore di Carisma per i tiri per colpire, e ogni colpo infligge 1d10 danni psichici in più, che ignorano la resistenza e l\u0027immunità.\n- Quando colpisci una creatura con lo spillone, deve superare un tiro salvezza su Carisma con CD 18, o essere Spaventata e non poter usare reazioni per 1 minuto. Ripete il tiro salvezza alla fine di ogni suo turno. Deve anche superare un tiro salvezza su Costituzione con CD 15, o essere Avvelenata per 1 ora.\n- Sei immune ai danni da veleno e alla condizione Avvelenato, puoi parlare con la mente a qualunque ragno o aberrazione entro 18 m, e una volta per riposo breve puoi lanciare _ragnatela_ come azione bonus.\n**Maledizione.** Non puoi separarti volontariamente dallo spillone, e dopo ogni riposo lungo i tuoi PF massimi si riducono di 1, finché resti in sintonia. Serve _rimuovi maledizione_ lanciato con uno slot di 9° livello.","pag":"Armamenti V · Leggendari"},{"n":"La Mannaia della Spartizione","tipo":"arma (ascia bipenne), artefatto, richiede sintonia","sint":true,"base":"ascia bipenne","bonus":4,"md":"Un\u0027ascia enorme con la lama a mezzaluna, nera di sangue vecchio, con il manico di corno legato da tendini secchi. È un\u0027arma magica **+4**, e quando ottieni un 20 naturale infliggi 5d6 danni taglienti in più. Mentre la impugni hai un bonus di +1 alla CA, e non puoi essere Accecato, Affascinato, Assordato, Pietrificato, Spaventato o Stordito.\n- **La benedizione della Caccia.** Se a sintonizzarsi è un Worgen, ottiene anche l\u0027immunità ai danni da veleno, e la sua scurovisione aumenta di 18 m.","pag":"Armamenti V · Leggendari"},{"n":"Lo Stoppino d\u0027Osso","tipo":"oggetto meraviglioso, comune","sint":false,"base":"","bonus":0,"md":"Una candela corta, con lo stoppino infilato nell\u0027osso cavo di un dito. Se la accendi per qualcuno, dicendone il nome, brucia per 8 ore senza consumarsi, e gli Spenti entro 9 m che la vedono si fermano a guardarla finché non vengono attaccati. Dopo averla usata, non funziona di nuovo finché non termini un riposo lungo (vedi [[Lo Spento]]).","pag":"Oggetti Magici della Notte"},{"n":"La Campanella del Sonno","tipo":"oggetto meraviglioso, comune","sint":false,"base":"","bonus":0,"md":"Una campanella di peltro grande come un\u0027unghia. Se la appendi sopra chi dorme, tintinna quando una creatura ostile si avvicina entro 9 m, ma non tintinna per le cose che non hanno peso.","pag":"Oggetti Magici della Notte"},{"n":"Il Guanto del Becchino","tipo":"oggetto meraviglioso, comune","sint":false,"base":"","bonus":0,"md":"Un guanto di cuoio nero, consumato sulle dita. Quando tocchi un cadavere sai da quante campane è morto, se è morto per mano di qualcuno e se si rialzerà.","pag":"Oggetti Magici della Notte"},{"n":"Il Fazzoletto d\u0027Erica","tipo":"oggetto meraviglioso, comune","sint":false,"base":"","bonus":0,"md":"Un fazzoletto giallo che profuma di miele d\u0027erica. Se lo leghi sulla bocca, per 1 ora hai vantaggio ai tiri salvezza per respirare la Foschia Verde e per non seguire la voce. Dopo averlo usato, non funziona di nuovo finché non termini un riposo lungo (vedi [[Foschia Verde]]).","pag":"Oggetti Magici della Notte"},{"n":"La Moneta dell\u0027Oste","tipo":"oggetto meraviglioso, comune","sint":false,"base":"","bonus":0,"md":"Una moneta d\u0027oro opaco con un boccale su un lato e una faccia senza occhi sull\u0027altro. Se la dai a un oste qualsiasi vale una notte di alloggio, una cena e una birra, e alla prima campana è di nuovo nella tua tasca. Da Velker non funziona (vedi [[Gordronlir Barbabronzea, l\u0027Oste di Tutte le Taverne]]).","pag":"Oggetti Magici della Notte"},{"n":"Il Sacchetto di Sale Nero","tipo":"oggetto meraviglioso, comune","sint":false,"base":"","bonus":0,"md":"Un sacchetto di tela che si riempie da solo di sale nero delle vigne, una manciata per ogni riposo breve. Una manciata gettata su un\u0027arma di sangue, su una pozza o su un Emomante dei Vendemmiatori ha l\u0027effetto del sale nero (vedi [[Il Credo Scarlatto]]).","pag":"Oggetti Magici della Notte"},{"n":"Il Mantello del Barcaiolo","tipo":"oggetto meraviglioso, non comune, richiede sintonia","sint":true,"base":"","bonus":0,"md":"Un mantello di tela cerata, pesante, che odora di fiume. Con un\u0027azione bonus puoi camminare sull\u0027acqua ferma o lenta per 1 minuto, e non puoi farlo di nuovo finché non termini un riposo breve. Le cose che vivono nell\u0027acqua non ti attaccano per prime, finché non sei tu ad attaccarle.","pag":"Oggetti Magici della Notte"},{"n":"Gli Occhiali di Fumo","tipo":"oggetto meraviglioso, non comune","sint":false,"base":"","bonus":0,"md":"Occhiali con le lenti di vetro affumicato, montati su ferro. Non puoi essere Accecato dalle luci intense, e vedi attraverso nebbia, neve e fumo non magici fino a 18 m.","pag":"Oggetti Magici della Notte"},{"n":"La Bussola del Raggio","tipo":"oggetto meraviglioso, non comune","sint":false,"base":"","bonus":0,"md":"Una bussola senza nord, con l\u0027ago che punta sempre verso il Dito di Aurel, anche sottoterra o nella Foschia. Ovunque ti trovi, sai sempre quante campane mancano alla prossima.","pag":"Oggetti Magici della Notte"},{"n":"Il Corno della Tosatura","tipo":"oggetto meraviglioso, non comune","sint":false,"base":"","bonus":0,"md":"Un corno di montone con il bocchino d\u0027ottone. Se lo suoni con un\u0027azione, le bestie domestiche entro 300 m tornano verso di te, e tra le Pietre Ritte, per 1 minuto, le pietre si contano giuste. Dopo averlo suonato, non funziona di nuovo finché non termini un riposo lungo (vedi [[Le Pietre che si Contano]]).","pag":"Oggetti Magici della Notte"},{"n":"L\u0027Amo del Nonno","tipo":"oggetto meraviglioso, non comune, richiede sintonia","sint":true,"base":"","bonus":0,"md":"Un amo d\u0027osso legato a una lenza di capelli, con cui si prende sempre qualcosa. Se lo getti in un\u0027acqua dove qualcuno è annegato, ne tiri su un ricordo, e puoi lanciare _parlare con i morti_ su quell\u0027annegato anche senza il corpo; dopo averlo fatto, non puoi rifarlo finché non termini un riposo lungo (vedi [[Il Nonno del Lago]]).","pag":"Oggetti Magici della Notte"},{"n":"Gli Stivali della Posta","tipo":"oggetto meraviglioso, non comune, richiede sintonia","sint":true,"base":"","bonus":0,"md":"Stivali di pelle grigia con la suola chiodata. La tua velocità aumenta di 3 m, e sulle strade non lasci tracce.","pag":"Oggetti Magici della Notte"},{"n":"La Lama del Rovescio","tipo":"arma (spada lunga), rara, richiede sintonia","sint":true,"base":"spada lunga","bonus":0,"md":"Arma magica +1, con l\u0027elsa consumata dove la impugnava Ser Galmond. Quando una creatura ti manca con un attacco in mischia, puoi usare la reazione per effettuare un attacco con quest\u0027arma contro di lei, e se la colpisci ha svantaggio al suo prossimo tiro per colpire. Dopo averlo fatto, non puoi rifarlo finché non termini un riposo breve.","pag":"Oggetti Magici della Notte"},{"n":"L\u0027Ascia dei Cent\u0027Anni","tipo":"arma (ascia bipenne), rara, richiede sintonia","sint":true,"base":"ascia bipenne","bonus":0,"md":"Arma magica +1, l\u0027ascia di una famiglia di taglialegna, passata di padre in figlia per cento anni. Infligge 2d6 danni in più alle piante, alle creature fatte di legno e radici e agli alberi della Foschia, e taglia con un solo colpo qualunque radice o ramo magico (vedi [[Sylvorn, il Guardiano Corrotto]]).","pag":"Oggetti Magici della Notte"},{"n":"La Lanterna delle Finestre","tipo":"oggetto meraviglioso, raro","sint":false,"base":"","bonus":0,"md":"Una lanterna da finestra, d\u0027ottone, con dentro una candela consumata che non finisce mai. Fa luce intensa per 9 m, e nessuna oscurità magica può spegnerla. Se la accendi per un morto dicendone il nome, puoi fargli tre domande, come con _parlare con i morti_, anche senza il corpo, e non puoi farlo di nuovo finché non termini un riposo lungo (vedi [[L\u0027Abate del Sole Nero]]).","pag":"Oggetti Magici della Notte"},{"n":"La Fiasca del Primo Pozzo","tipo":"oggetto meraviglioso, raro","sint":false,"base":"","bonus":0,"md":"Una fiasca di cristallo opaco, vecchia quanto l\u0027Accademia. Conta come una Fiasca in più, oltre alle tre previste dalla regola, e si riempie anche se si dorme al buio, purché chi la porta tenga in mano una candela accesa per qualcuno (vedi [[Le Fiasche]]).","pag":"Oggetti Magici della Notte"},{"n":"Il Velo di Sale","tipo":"oggetto meraviglioso, raro, richiede sintonia","sint":true,"base":"","bonus":0,"md":"Un velo nero, rigido di sale, che si porta sulle spalle. Hai resistenza ai danni necrotici, nessuno può prendere i tuoi PF per curarsi, né con i _Salassi_ né con i morsi che curano chi morde, e gli Emomanti dei Vendemmiatori hanno svantaggio ai tiri per colpirti.","pag":"Oggetti Magici della Notte"},{"n":"L\u0027Arpa del Coro Muto","tipo":"oggetto meraviglioso, molto raro, richiede sintonia","sint":true,"base":"","bonus":0,"md":"Una piccola arpa da viaggio con le corde di budello rosso. Con un\u0027azione puoi suonarla, e per 1 round nessuna creatura entro 18 m può effettuare attacchi: chi ci prova perde l\u0027azione. Dura soltanto un round, ma è un round in cui tutti si guardano in faccia. Dopo averla suonata, non puoi farlo di nuovo finché non termini un riposo lungo (vedi [[Il Coro delle Volte]]).","pag":"Oggetti Magici della Notte"},{"n":"Lo Scudo della Guardia del Passo","tipo":"armatura (scudo), molto raro, richiede sintonia","sint":true,"base":"","bonus":0,"md":"Uno scudo di abete cerchiato di ferro, con un lupo inciso, che dà +2 alla CA oltre al bonus normale. Quando un effetto ad area colpisce te e altre creature, puoi usare la reazione per proteggere le creature entro 1,5 m da te, che subiscono soltanto metà dei danni, o nessun danno se ne avrebbero subito la metà.","pag":"Oggetti Magici della Notte"},{"n":"Il Taccuino dei Nomi","tipo":"oggetto meraviglioso, molto raro, richiede sintonia","sint":true,"base":"","bonus":0,"md":"Un taccuino rilegato in pelle, pieno di nomi scritti a mano da persone diverse. Se ci scrivi il nome vero di una creatura, per 24 ore hai vantaggio ai tiri salvezza contro i suoi effetti, e quella creatura non può possederti, affascinarti o prendere il tuo volto; non puoi farlo di nuovo finché non termini un riposo lungo (vedi [[Re Senza Nome]] e [[Lo Straniero]]).","pag":"Oggetti Magici della Notte"},{"n":"La Rete d\u0027Argento","tipo":"oggetto meraviglioso, molto raro","sint":false,"base":"","bonus":0,"md":"Una rete da pesca di Lunedale, intrecciata con il lichene specchio del lago. Lanciata come un\u0027arma, con gittata 6 m, cattura anche le creature incorporee, gli spettri e i riflessi: la creatura colpita è Trattenuta, e finché resta nella rete non può attraversare oggetti né teletrasportarsi (CD 17 per liberarsi) (vedi [[Lunedale, La Città sul Lago Nero]]).","pag":"Oggetti Magici della Notte"},{"n":"Il Mantello dell\u0027Ultima Campana","tipo":"oggetto meraviglioso, leggendario, richiede sintonia","sint":true,"base":"","bonus":0,"md":"Un mantello pesante, color bronzo, che quando ti muovi suona piano come una campana lontana. Sai sempre che ora è. All\u0027inizio del tuo turno puoi suonare l\u0027ultima campana, e subito dopo questo turno ne hai un altro, durante il quale il tempo è fermo per tutti tranne te, come con _fermare il tempo_ ma per un solo turno. Dopo averlo fatto, non puoi rifarlo finché non termini un riposo lungo.","pag":"Oggetti Magici della Notte"},{"n":"La Falce della Prima Campana","tipo":"arma (falce), leggendaria, richiede sintonia","sint":true,"base":"falce","bonus":0,"md":"Arma magica +3, con la lama di bronzo da campana. Quando riduci una creatura a 0 PF con quest\u0027arma suona una campana che solo i tuoi alleati sentono, e ogni alleato entro 9 m recupera PF pari al tuo bonus di competenza + il tuo modificatore di Saggezza. Contro i non morti infligge 2d10 danni radianti in più.","pag":"Oggetti Magici della Notte"},{"n":"Lo Specchio di Oscaria","tipo":"oggetto meraviglioso, leggendario, richiede sintonia","sint":true,"base":"","bonus":0,"md":"Uno specchio da tasca, ovale, con la cornice di pietra delle Pietre Ritte. Chi lo porta è immune alle illusioni, e non può essere confuso sulla propria posizione. Guardandoci dentro puoi fare una domanda a cui si risponde sì o no su qualcosa che vedi, e lo specchio risponde il vero, scrivendo sul vetro con il fiato; non puoi farlo di nuovo finché non termini un riposo lungo (vedi [[Il Sorriso Troppo Largo, Manifestazione della Spirale]]).","pag":"Oggetti Magici della Notte"}],"corazze":[{"n":"La Pelliccia delle Affumicatrici","cat":"L","ca":11,"des":true,"max":null,"for":0,"furt":false},{"n":"La Veste dei Giurati","cat":"L","ca":11,"des":true,"max":null,"for":0,"furt":false},{"n":"Il Farsetto Trapuntato","cat":"M","ca":12,"des":true,"max":2,"for":0,"furt":false},{"n":"Il Cuoio Bianco","cat":"M","ca":13,"des":true,"max":2,"for":0,"furt":false},{"n":"La Corazza Incisa dei Crepuli","cat":"M","ca":14,"des":true,"max":2,"for":0,"furt":false},{"n":"La Mezza Armatura delle Bestie","cat":"M","ca":15,"des":true,"max":2,"for":13,"furt":true},{"n":"Le Scaglie di Ferro Fumo","cat":"P","ca":17,"des":false,"max":null,"for":15,"furt":true},{"n":"La Corazza a Stecche dei Cravani","cat":"P","ca":17,"des":false,"max":null,"for":15,"furt":true},{"n":"L\u0027Armatura della Vecchia Marca","cat":"P","ca":19,"des":false,"max":null,"for":15,"furt":true}],"incantesimi":[{"n":"Collana della Madre Pallida","lv":0,"sc":"Trucchetto di Trasmutazione (Bardo, Chierico, Druido)","cl":"Bardo, Chierico, Druido","fonte":"Magia della Luna","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** contatto\n**Componenti:** S, M (una collana o un pezzo di spago)\n**Durata:** 8 ore\n\nLo spago si indurisce, si fa freddo, e al centro gli cresce una pietra pallida e opaca, del colore della luna vista attraverso la nebbia. Chi la porta al collo o la tiene in mano ha vantaggio alla prossima prova di Intelligenza (Indagare), alla prossima prova di Saggezza (Intuizione) e alla prossima prova di Saggezza (Percezione) che si basano sulla vista, una per tipo. Quando le ha usate tutte e tre, l\u0027incantesimo termina.\n\nAlla fine dell\u0027incantesimo la collana torna quella che era. Puoi avere una sola _Collana della Madre Pallida_ alla volta."},{"n":"Globo d\u0027Eclisse","lv":0,"sc":"Trucchetto di Necromanzia (Chierico, Druido, Mago, Stregone, Warlock)","cl":"Chierico, Druido, Mago, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 36 m\n**Componenti:** V, S\n**Durata:** 1 round\n\nNello spazio di una creatura che vedi entro gittata compare un piccolo globo nero cerchiato di ghiaccio, come una luna coperta. Effettua un attacco con incantesimo a distanza contro la creatura: se colpisci, subisce 1d6 danni necrotici e ha svantaggio al prossimo tiro salvezza che effettua prima dell\u0027inizio del tuo turno successivo. Se la creatura è un non morto, questi danni ignorano la sua resistenza ai danni necrotici.\n\n**Potenziamento dei trucchetti.** I danni aumentano di 1d6 quando raggiungi il 5° livello (2d6), l\u002711° (3d6) e il 17° (4d6)."},{"n":"Goccia d\u0027Argento","lv":0,"sc":"Trucchetto di Evocazione (Druido, Mago, Stregone, Warlock)","cl":"Druido, Mago, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 18 m\n**Componenti:** V, S\n**Durata:** istantanea\n\nLa tua mano si accende di bianco e lanci una goccia di luce contro una creatura che vedi entro gittata. La creatura deve superare un tiro salvezza su Destrezza, altrimenti subisce 1d8 danni radianti e resta avvolta da una luce d\u0027argento fino alla fine del suo turno successivo. Finché la luce la avvolge, non può nascondersi né diventare Invisibile, e se è già Invisibile si vede lo stesso.\n\n**Potenziamento dei trucchetti.** Lanci una goccia in più quando raggiungi il 5° livello (due gocce), l\u002711° (tre) e il 17° (quattro). Puoi lanciarle tutte contro la stessa creatura o contro creature diverse, e ogni creatura colpita effettua un tiro salvezza per ogni goccia."},{"n":"Lingua d\u0027Argento","lv":0,"sc":"Trucchetto di Ammaliamento (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** S, M (un ramo d\u0027ulivo o una pietra di luna, da tenere in mano)\n**Durata:** concentrazione, fino a 1 minuto\n\nPuoi lanciare questo incantesimo soltanto sotto la luna. Ti si scalda la gola, e le parole ti escono più lente e più belle di come le avevi pensate. Per la durata hai vantaggio alle prove di Carisma contro gli umanoidi che non ti sono ostili.\n\nAlla fine dell\u0027incantesimo nessuno si accorge di averlo subito. A volte, però, chi ti ha ascoltato continua a pensare a te più di quanto dovrebbe, e il Master decide quanto."},{"n":"Lume Prestato","lv":0,"sc":"Trucchetto di Invocazione (Bardo, Chierico, Druido, Mago)","cl":"Bardo, Chierico, Druido, Mago","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (un pizzico di sale o un baccello di lunaria)\n**Durata:** 1 ora\n\nTocchi un oggetto piccolo, come un sasso, un coltello o un libro, e ci versi dentro un po\u0027 di luce di luna, che resta anche al chiuso e sottoterra. L\u0027oggetto emana luce intensa in un raggio di 3 m e luce fioca per altri 3 m. Coprirlo con qualcosa di opaco blocca la luce. Se l\u0027oggetto è impugnato o indossato da una creatura ostile, la creatura può superare un tiro salvezza su Destrezza per evitare l\u0027incantesimo.\n\nSe la luna è nella fase della tua luna di nascita, la luce intensa e la luce fioca arrivano a 12 m ciascuna, e la durata diventa 4 ore. L\u0027incantesimo termina se lo lanci di nuovo, oppure quando lo spegni soffiandoci sopra, senza usare azioni."},{"n":"Moneta Gelata","lv":0,"sc":"Trucchetto di Illusione (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 9 m\n**Componenti:** S, M (una vecchia moneta d\u0027argento dell\u0027Età del Sole, di quelle che non si spendono più)\n**Durata:** concentrazione, fino a 1 minuto\n\nLasci cadere una moneta d\u0027argento in un punto che vedi entro gittata. La moneta comincia a girare su se stessa, si solleva a un metro e mezzo da terra e resta lì, con un sibilo sottile e continuo, a emanare luce fioca in un raggio di 1,5 m. Una creatura che si trova entro 1,5 m dalla moneta quando la lanci, che entra nella luce per la prima volta in un turno o che termina il turno al suo interno deve superare un tiro salvezza su Saggezza, altrimenti ha svantaggio ai tiri per colpire e all\u0027iniziativa fino all\u0027inizio del suo turno successivo.\n\nChi afferra la moneta pone fine all\u0027incantesimo; se non sei tu, subisce 1d4 danni da freddo. Alla fine dell\u0027incantesimo la moneta sparisce e ti ricompare in mano.\n\n**Potenziamento dei trucchetti.** I danni da freddo aumentano di 1d4 quando raggiungi il 5° livello (2d4), l\u002711° (3d4) e il 17° (4d4)."},{"n":"Segno di Selenar","lv":0,"sc":"Trucchetto di Abiurazione (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** V, S\n**Durata:** 1 round\n\nDisegni nell\u0027aria con le braccia la mezzaluna di Selenar, e per un momento resta sospesa davanti a te, come un\u0027impronta su un vetro appannato. Fino alla fine del tuo turno successivo hai resistenza ai danni inflitti dagli incantesimi e dalle armi magiche."},{"n":"Sguardo della Madre Pallida","lv":0,"sc":"Trucchetto di Divinazione (Bardo, Chierico, Druido)","cl":"Bardo, Chierico, Druido","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** S\n**Durata:** 1 round\n\nUn alone pallido ti si posa sulla testa e gli occhi ti diventano bianchi. Hai vantaggio al prossimo tiro per colpire che effettui prima della fine del tuo turno successivo.\n\n---"},{"n":"Bacio di Selenar","lv":1,"sc":"Invocazione di 1° livello (Bardo, Chierico, Druido, Paladino, Ranger)","cl":"Bardo, Chierico, Druido, Paladino, Ranger","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S\n**Durata:** istantanea\n\nPuoi lanciare questo incantesimo soltanto sotto la luna. Appoggi le labbra o la mano sulla fronte di una creatura, e le ferite le si richiudono con un velo d\u0027argento che poi sbiadisce. La creatura recupera PF a seconda della fase maggiore della luna:\n- **Nuova:** 2d6 + il tuo modificatore di caratteristica da incantatore.\n- **Crescente o Calante:** 2d8 + il tuo modificatore di caratteristica da incantatore.\n- **Piena:** 2d10 + il tuo modificatore di caratteristica da incantatore.\n\nL\u0027incantesimo non ha effetto sui costrutti e sui non morti.\n\n**Usando uno slot di livello superiore.** I PF recuperati aumentano di due dadi della fase (2d6, 2d8 o 2d10) per ogni livello dello slot superiore al 1°."},{"n":"Balzo del Terrore","lv":1,"sc":"Trasmutazione di 1° livello (Sangue Selvatico)","cl":"Sangue Selvatico","fonte":"Sangue Selvatico","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** V, S, M (un tendine di animale)\n**Durata:** istantanea\n\nI muscoli delle gambe ti si gonfiano sotto la pelle, i tendini scricchiolano, e salti. Il balzo ti porta lontano quanto la tua velocità e in alto quanto metà della tua velocità, e mentre sei in aria ti circonda un\u0027ombra che ha la forma di qualcosa di più grosso di te. Quando atterri, ogni creatura entro 3 m da te deve superare un tiro salvezza su Saggezza, altrimenti subisce 1d8 danni psichici ed è Spaventata fino alla fine del tuo turno successivo.\n\n**Usando un livello superiore.** I danni aumentano di 1d8 per ogni Dado Vita speso oltre il primo."},{"n":"Benedizione di Marea","lv":1,"sc":"Abiurazione di 1° livello, rituale (Chierico, Paladino)","cl":"Chierico, Paladino","fonte":"Magia della Luna","md":"**Tempo di lancio:** 1 ora\n**Gittata:** contatto\n**Componenti:** V, S, M (incenso del valore di 25 mo, che l\u0027incantesimo consuma)\n**Durata:** 8 ore\n\nBruci l\u0027incenso in un cerchio, reciti il conto delle maree e alla fine tocchi la fronte di una creatura che vedi entro 3 m. Per la durata, la creatura aggiunge 1d4 a ogni tiro salvezza che effettua. L\u0027incantesimo termina prima se la fase della luna cambia.\n\n**Usando uno slot di livello superiore.** Puoi scegliere una creatura in più per ogni livello dello slot superiore al 1°."},{"n":"Chiarore","lv":1,"sc":"Divinazione di 1° livello (Bardo, Chierico, Mago, Paladino, Stregone, Warlock)","cl":"Bardo, Chierico, Mago, Paladino, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** personale\n**Componenti:** V, S\n**Durata:** 8 ore\n\nLa pelle ti si fa appena luminosa, come la faccia di chi sta davanti a una finestra in una notte di luna piena. Per la durata hai vantaggio alle prove di Carisma (Persuasione) e svantaggio alle prove di Destrezza (Furtività). Puoi porre fine all\u0027incantesimo quando vuoi, senza usare azioni."},{"n":"Faro di Luna","lv":1,"sc":"Invocazione di 1° livello (Chierico, Druido, Mago, Ranger, Stregone, Warlock)","cl":"Chierico, Druido, Mago, Ranger, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 18 m\n**Componenti:** V\n**Durata:** istantanea\n\nUn cono di luce bianca scende dall\u0027alto su un\u0027area di 6 m di raggio centrata su un punto che vedi entro gittata. Gli oggetti Invisibili nell\u0027area diventano visibili, e ogni creatura nell\u0027area deve effettuare un tiro salvezza su Destrezza. Se lo fallisce subisce 2d4 danni radianti e, se è Invisibile, smette di esserlo fino alla fine del suo turno successivo; se lo supera subisce la metà dei danni e resta come era. I non morti, gli immondi e le aberrazioni falliscono il tiro salvezza automaticamente.\n\n**Usando uno slot di livello superiore.** I danni aumentano di 1d4 per ogni livello dello slot superiore al 1°."},{"n":"Fiamma Cremisi","lv":1,"sc":"Invocazione di 1° livello (Sangue Selvatico)","cl":"Sangue Selvatico","fonte":"Sangue Selvatico","md":"**Tempo di lancio:** azione\n**Gittata:** personale (cono di 4,5 m)\n**Componenti:** V, S, M (un ciuffo di pelo di animale)\n**Durata:** istantanea\n\nTi apri il palmo con le unghie e scagli il sangue davanti a te a ventaglio. A contatto con l\u0027aria prende fuoco. Ogni creatura nel cono deve effettuare un tiro salvezza su Destrezza. Se lo fallisce subisce 3d6 danni da fuoco ed è Accecata fino alla fine del suo turno successivo, con il sangue che le brucia negli occhi; se lo supera subisce la metà dei danni e non è Accecata.\n\n**Usando un livello superiore.** I danni aumentano di 1d6 per ogni Dado Vita speso oltre il primo."},{"n":"Il Volto di Sotto","lv":1,"sc":"Necromanzia di 1° livello (Bardo, Chierico, Druido, Paladino, Stregone, Warlock)","cl":"Bardo, Chierico, Druido, Paladino, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** V, S\n**Durata:** 10 minuti\n\nLa luce della luna ti passa sotto la pelle e mostra a chi ti guarda la cosa che c\u0027è sotto: un altro volto, più magro, con troppi denti, che si muove un attimo dopo il tuo. Le creature immuni alla condizione Spaventato non vedono niente. Per la durata hai vantaggio alle prove di Carisma (Intimidire).\n\nQuando vuoi, prima della fine della durata, puoi porre fine all\u0027incantesimo per scegliere una creatura che ti guarda negli occhi. La creatura deve superare un tiro salvezza su Saggezza, altrimenti è Spaventata per 1 minuto. Alla fine di ognuno dei suoi turni ripete il tiro salvezza, e se lo supera l\u0027effetto termina.\n\n---"},{"n":"Inchiostro di Fase","lv":1,"sc":"Illusione di 1° livello (Bardo, Mago, Warlock)","cl":"Bardo, Mago, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** contatto\n**Componenti:** S, M (inchiostro del valore di 10 mo, che l\u0027incantesimo consuma)\n**Durata:** tre lune\n\nScrivi fino a cento parole su una pergamena, una tavoletta o una superficie simile. Quando hai finito, l\u0027inchiostro sparisce. Per la durata la scritta si può leggere soltanto con _visione del vero_ oppure alla luce della luna nella stessa fase in cui l\u0027hai scritta."},{"n":"Malia della Luna","lv":1,"sc":"Ammaliamento di 1° livello (Bardo, Druido, Mago, Ranger, Stregone, Warlock)","cl":"Bardo, Druido, Mago, Ranger, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 9 m\n**Componenti:** V, S, M (un sassolino bianco)\n**Durata:** concentrazione, fino a 1 minuto\n\nUna creatura che vedi entro gittata deve superare un tiro salvezza su Saggezza, altrimenti alza la testa verso la luna, o verso il punto in cui pensa che sia se è al chiuso o sottoterra, e resta a guardarla a bocca aperta. Per la durata la creatura è Incapacitata. Alla fine di ognuno dei suoi turni, e ogni volta che subisce danni, ripete il tiro salvezza, e se l\u0027ha ripetuto per i danni ha vantaggio. Se lo supera, l\u0027incantesimo termina."},{"n":"Pioggia d\u0027Argento","lv":1,"sc":"Evocazione di 1° livello (Bardo, Chierico, Druido, Mago, Stregone, Warlock)","cl":"Bardo, Chierico, Druido, Mago, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale (raggio di 3 m)\n**Componenti:** V\n**Durata:** istantanea\n\nChiami giù la luna, e una colonna di luce cade intorno a te in un raggio di 3 m, piena di schegge sottili e taglienti come aghi di vetro. Ogni altra creatura nell\u0027area deve effettuare un tiro salvezza su Destrezza. Se lo fallisce subisce 1d6 danni radianti e 1d6 danni perforanti, ed è Accecata e Assordata fino all\u0027inizio del suo turno successivo; se lo supera subisce la metà dei danni.\n\n**Usando uno slot di livello superiore.** I danni radianti aumentano di 1d6 per ogni livello dello slot superiore al 1°."},{"n":"Scala di Luna","lv":1,"sc":"Trasmutazione di 1° livello (Bardo, Druido, Mago, Ranger)","cl":"Bardo, Druido, Mago, Ranger","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione bonus\n**Gittata:** personale\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nPer la durata puoi camminare e arrampicarti sulla luce della luna come se fosse una superficie solida: un raggio che entra da una finestra, una striscia di luce su un muro, il chiarore sopra uno strapiombo. La luce conta come terreno difficile, e se la luce sparisce mentre ci sei sopra, cadi.\n\n**Usando uno slot di livello superiore.** Con uno slot di 3° livello o superiore la durata diventa di 1 ora. Con uno slot di 5° livello o superiore l\u0027incantesimo non richiede più concentrazione."},{"n":"Artiglio Vermiglio","lv":2,"sc":"Evocazione di 2° livello (Sangue Selvatico)","cl":"Sangue Selvatico","fonte":"Sangue Selvatico","md":"**Tempo di lancio:** azione bonus\n**Gittata:** personale\n**Componenti:** V, S, M (l\u0027artiglio di un predatore)\n**Durata:** concentrazione, fino a 1 minuto\n\nLa pelle del braccio ti si spacca dal gomito alle dita, e quello che esce è un artiglio rosso, lucido, fatto di sangue che non cola. Per la durata, quando effettui l\u0027azione di Attacco, puoi sostituire uno degli attacchi con un attacco con incantesimo in mischia con l\u0027artiglio, che ha portata 4,5 m. Se colpisci, il bersaglio subisce 3d6 danni taglienti ed è Afferrato (CD di fuga pari alla CD del tuo tiro salvezza degli incantesimi). Finché l\u0027artiglio lo tiene, all\u0027inizio di ognuno dei suoi turni il bersaglio subisce un livello di Indebolimento, perché l\u0027artiglio gli beve il sangue dalla ferita, fino a un massimo di due livelli per tutta la durata. Alla fine dell\u0027incantesimo, il bersaglio perde tutti i livelli di Indebolimento che l\u0027artiglio gli ha dato.\n\n**Usando un livello superiore.** I danni aumentano di 1d6 per ogni Dado Vita speso oltre il secondo."},{"n":"Buio di Luna Nuova","lv":2,"sc":"Invocazione di 2° livello (Chierico, Druido, Mago, Ranger)","cl":"Chierico, Druido, Mago, Ranger","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale (sfera di 9 m)\n**Componenti:** V, M (una perla in un sacchetto di velluto nero)\n**Durata:** concentrazione, fino a 10 minuti\n\nApri il sacchetto, e da dentro esce un buio a metà che si allarga intorno a te in una sfera di 9 m di raggio, si muove con te e gira dietro gli angoli. Dentro la sfera ogni luce naturale, e ogni luce creata da un incantesimo di 2° livello o inferiore, fa soltanto luce fioca. Ogni effetto che dipende dalla fase della luna, dentro la sfera, considera la luna nuova.\n\nSe lanci l\u0027incantesimo in luna nuova, il buio diventa oscurità magica: nessuno ci vede dentro, nemmeno con la scurovisione, tranne te, e né la luce naturale né quella degli incantesimi di 2° livello o inferiore riescono ad attraversarlo. L\u0027incantesimo non funziona in luna piena."},{"n":"Canto di Marea","lv":2,"sc":"Invocazione di 2° livello, rituale (Bardo, Chierico, Paladino, Ranger)","cl":"Bardo, Chierico, Paladino, Ranger","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 6 m\n**Componenti:** V\n**Durata:** istantanea\n\nPuoi lanciare questo incantesimo soltanto sotto la luna. Canti a bassa voce la canzone con cui le Guardiane delle Maree contano le onde. Ogni creatura a tua scelta entro gittata che può sentirti può spendere un Dado Vita, tirarlo e recuperare PF pari al risultato più il tuo modificatore di caratteristica da incantatore.\n\n**Usando uno slot di livello superiore.** Ogni creatura può spendere un Dado Vita in più ogni due livelli dello slot superiori al 2°."},{"n":"Cerchio di Luna Piena","lv":2,"sc":"Invocazione di 2° livello (Chierico, Druido, Mago, Paladino)","cl":"Chierico, Druido, Mago, Paladino","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale (sfera di 9 m)\n**Componenti:** V, M (una perla in un sacchetto di seta bianca)\n**Durata:** concentrazione, fino a 10 minuti\n\nApri il sacchetto, e intorno a te si accende una sfera di luce d\u0027argento di 9 m di raggio, che si muove con te e gira dietro gli angoli. La sfera è piena di luce intensa, e manda luce fioca per altri 9 m. L\u0027oscurità magica creata da incantesimi di 2° livello o inferiore non riesce a spegnerla né a coprirla. Ogni effetto che dipende dalla fase della luna, dentro la sfera, considera la luna piena.\n\nSe lanci l\u0027incantesimo in luna piena, nel momento in cui lo lanci si spengono tutte le altre luci entro 90 m da te, quelle naturali e quelle create da incantesimi di 2° livello o inferiore. L\u0027incantesimo non funziona in luna nuova."},{"n":"Coppa della Fortuna","lv":2,"sc":"Divinazione di 2° livello (Bardo, Chierico, Mago)","cl":"Bardo, Chierico, Mago","fonte":"Magia della Luna","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** 3 m\n**Componenti:** V, S, M (una coppa d\u0027argento del valore di almeno 100 mo, piena d\u0027acqua)\n**Durata:** 1 ora\n\nVersi l\u0027acqua della coppa ai piedi di una creatura consenziente che vedi entro gittata, e chiedi alla luna di guardarla. Una volta, prima della fine della durata, quando la creatura effettua un tiro per colpire, un tiro salvezza o una prova di caratteristica, può tirare di nuovo il dado e scegliere quale dei due risultati usare. Poi l\u0027incantesimo termina.\n\n**Usando uno slot di livello superiore.** Puoi scegliere una creatura in più ogni due livelli dello slot superiori al 2°."},{"n":"Lama delle Quattro Lune","lv":2,"sc":"Trasmutazione di 2° livello (Bardo, Druido, Mago, Stregone, Warlock)","cl":"Bardo, Druido, Mago, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione bonus\n**Gittata:** personale\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nChiudi la mano su un raggio di luna, e il raggio diventa una lama sottile e fredda. È un\u0027arma semplice in cui sei competente, con le proprietà accurata, leggera e da lancio (gittata 6/18 m). Quando attacchi con la lama puoi usare il tuo modificatore di caratteristica da incantatore per i tiri per colpire e per i danni, e se colpisci infligge 2d6 danni radianti più quel modificatore. Se la lanci o la lasci cadere, all\u0027inizio del tuo turno successivo sparisce e ti ricompare in mano, se hai una mano libera; altrimenti l\u0027incantesimo termina.\n\nLa lama cambia con la fase maggiore della luna:\n- **Nuova.** La lama è nera, e i suoi danni diventano 3d6 necrotici.\n- **Crescente.** Quando colpisci, una seconda creatura a tua scelta entro 1,5 m dal bersaglio subisce la metà dei danni.\n- **Piena.** Quando colpisci, ottieni 2d6 PF temporanei, e il bersaglio è Accecato fino alla fine del tuo turno.\n- **Calante.** I suoi danni diventano da freddo. Quando la lanci, invece di effettuare un attacco, la lama attraversa una linea lunga 18 m e larga 1,5 m: ogni creatura sulla linea deve superare un tiro salvezza su Destrezza, altrimenti subisce i danni della lama; se lo supera ne subisce la metà.\n\n**Usando uno slot di livello superiore.** I danni aumentano di 1d6 per ogni livello dello slot superiore al 2°."},{"n":"Mantello di Luna","lv":2,"sc":"Abiurazione di 2° livello (Bardo, Chierico, Druido, Mago, Paladino, Ranger)","cl":"Bardo, Chierico, Druido, Mago, Paladino, Ranger","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (un pendente d\u0027argento del valore di almeno 50 mo)\n**Durata:** 1 ora\n\nUna creatura che tocchi si copre di un riflesso di luna, come l\u0027acqua ferma di notte. Per la durata ha un bonus di +1 alla CA e ai tiri salvezza. Se lanci l\u0027incantesimo in una fase della tua luna di nascita, i danni contundenti, perforanti e taglienti che la creatura subisce si riducono di 1.\n\n**Usando uno slot di livello superiore.** Con uno slot di 3° livello o superiore la riduzione dei danni vale in qualunque fase, ed è pari al livello dello slot meno 2, fino a un massimo di 4. Nella fase della tua luna di nascita aumenta di 1."},{"n":"Moneta per i Ricordi","lv":2,"sc":"Ammaliamento di 2° livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 30 m\n**Componenti:** V, S, M (una vecchia moneta d\u0027argento dell\u0027Età del Sole, che regali al bersaglio)\n**Durata:** istantanea\n\nFai arrivare una moneta d\u0027argento nelle mani o nella tasca di una creatura che non sa che cosa stai facendo. La creatura deve superare un tiro salvezza su Saggezza, altrimenti scegli uno di questi effetti:\n- **Dimenticare un incantesimo.** La creatura dimentica uno degli incantesimi di 3° livello o inferiore che ha preparati o che conosce, a tua scelta tra quelli che le hai visto lanciare o che sai che ha, finché non termina un riposo lungo.\n- **Dimenticare un momento.** La creatura dimentica gli ultimi 2d6 minuti. Le restano soltanto sensazioni vaghe, come rabbia, paura o tristezza, e crede volentieri a chiunque le spieghi quel vuoto.\n- **Rubare un ricordo.** Vedi un ricordo della creatura, a tua scelta tra quelli che conosci o che sospetti, per il tempo di un respiro. L\u0027immagine è sbagliata nei dettagli e filtrata dagli occhi di chi l\u0027ha vissuta, ma è affidabile nelle cose grandi. La creatura non lo perde.\n\nLa creatura non sa di aver subito l\u0027incantesimo, ma se nessuno le dà una spiegazione per il momento di confusione, potrebbe insospettirsi.\n\n**Usando uno slot di livello superiore.** Puoi scegliere una creatura in più ogni due livelli dello slot superiori al 2°, e a ognuna serve una moneta."},{"n":"Sudario di Luna Nuova","lv":2,"sc":"Necromanzia di 2° livello (Bardo, Stregone, Warlock)","cl":"Bardo, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** contatto\n**Componenti:** V, S, M (il dente di un non morto e unguenti funebri del valore di almeno 100 mo, che l\u0027incantesimo consuma)\n**Durata:** un giro di campane (24 ore)\n\nUngi la faccia di una creatura consenziente e le metti il dente sotto la lingua. La pelle le si fa grigia e tesa, gli occhi le si velano, e per la durata ha l\u0027aspetto di un non morto. La creatura è immune alle malattie e alla condizione Avvelenato, ha resistenza ai danni da veleno, ignora gli effetti del primo livello di Indebolimento, non invecchia, non ha bisogno di mangiare né di respirare, e nessun incantesimo o privilegio può trasformarla in un non morto.\n\nGli incantesimi e i privilegi che rivelano il tipo delle creature la riconoscono come un non morto, e le altre creature la vedono così. Una creatura con Intelligenza 3 o più può effettuare una prova di Saggezza (Intuizione) contro la CD del tuo tiro salvezza degli incantesimi per capire che non lo è.\n\n---"},{"n":"Trasfusione","lv":2,"sc":"Necromanzia di 2° livello (Sangue Selvatico)","cl":"Sangue Selvatico","fonte":"Sangue Selvatico","md":"**Tempo di lancio:** azione\n**Gittata:** 9 m\n**Componenti:** V, S, M (una fiala di sangue di animale)\n**Durata:** istantanea\n\nPunti il dito contro un compagno ferito, e un filo di sangue ti esce dalla punta dell\u0027unghia e gli entra nella ferita, come un ago che cuce. Una creatura che non sei tu, e che vedi entro gittata, recupera PF pari al risultato di quattro tuoi Dadi Vita, tirati senza spenderli, più il tuo modificatore di Costituzione. I costrutti e i non morti non possono essere curati in questo modo.\n\n**Usando un livello superiore.** La creatura recupera un Dado Vita in più per ogni Dado Vita speso oltre il secondo."},{"n":"Carne di Vetro","lv":3,"sc":"Trasmutazione di 3° livello (Druido, Ranger)","cl":"Druido, Ranger","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 9 m\n**Componenti:** V, S, M (una biglia di vetro)\n**Durata:** concentrazione, fino a 1 ora\n\nUna creatura consenziente che vedi entro gittata diventa traslucida, lei e tutto quello che indossa e trasporta, e sotto la pelle le si vedono le ossa, come un pesce di lago tenuto controluce. Per la durata:\n- **Sotto la luce della luna**, la creatura si vede bene, e alla fine di ognuno dei suoi turni passati nella luce della luna ottiene 2d6 PF temporanei. Ignora il terreno difficile, se anche il terreno è illuminato dalla luna.\n- **Lontano dalla luce della luna**, la creatura è quasi trasparente: ha un bonus di +5 alle prove di Destrezza (Furtività) e non ha svantaggio alle prove di Saggezza (Percezione) basate sulla vista in luce fioca o al buio.\n\n**Usando uno slot di livello superiore.** I PF temporanei aumentano di 1d6 per ogni livello dello slot superiore al 3°."},{"n":"Liane Arteriose","lv":3,"sc":"Trasmutazione di 3° livello (Sangue Selvatico)","cl":"Sangue Selvatico","fonte":"Sangue Selvatico","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** V, S, M (tre vene seccate e intrecciate)\n**Durata:** 10 minuti\n\nTi escono dai polsi le arterie, rosse e vive, e si allungano fino a 12 m come corde. Per la durata puoi usarle così:\n- **Tirarti.** Una volta per turno, puoi agganciare un punto entro 12 m e tirarti fin lì senza spendere movimento.\n- **Aggrapparti.** Quando cadi, se c\u0027è un appiglio entro 12 m, puoi usare la reazione per afferrarlo: la caduta conta come se fosse più corta di 12 m.\n- **Strappare.** Con un\u0027azione puoi lanciare le liane contro due oggetti entro 12 m, ognuno del peso di non più di 50 kg, che nessuno indossa o trasporta, oppure contro due creature Medie o più piccole entro 12 m. Gli oggetti ti arrivano vicino. Le creature devono superare un tiro salvezza su Forza, altrimenti vengono trascinate in uno spazio libero vicino a te e cadono Prone.\n\nOgni volta che le usi, le liane si seccano, si spezzano e si sciolgono senza fare danni, e te ne escono di nuove nel tuo turno successivo."},{"n":"Litania del Disco","lv":3,"sc":"Illusione di 3° livello (Bardo, Chierico)","cl":"Bardo, Chierico","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 36 m\n**Componenti:** S, M (un sassolino dipinto di bianco)\n**Durata:** concentrazione, fino a 1 minuto\n\nIn cielo, sopra un cubo di 6 m di lato che vedi entro gittata, compare un disco lunare più grande e più vicino di quello vero, che gira lentamente. Ogni creatura nel cubo che può vedere il disco deve superare un tiro salvezza su Saggezza, altrimenti è Affascinata e ha velocità 0 finché resta Affascinata. Una creatura Affascinata ripete il tiro salvezza ogni volta che subisce danni, e se lo supera l\u0027effetto termina per lei.\n\nPer tutta la durata devi tenere viva la litania con la voce, e non puoi muoverti di tua volontà dal punto in cui ti trovi. Se lo fai, o se smetti di parlare, l\u0027incantesimo termina."},{"n":"Lume di Selenar","lv":3,"sc":"Invocazione di 3° livello (Bardo, Chierico, Druido, Ranger)","cl":"Bardo, Chierico, Druido, Ranger","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 18 m\n**Componenti:** V, S\n**Durata:** 1 ora\n\nUna luce di luna debole e ferma si accende intorno a te o a un oggetto che tocchi, e si allarga in un raggio di 18 m. È luce fioca. Le creature e gli oggetti Invisibili raggiunti da questa luce diventano visibili, e finché sono nell\u0027area non possono tornare Invisibili."},{"n":"Pozzo di Luna","lv":3,"sc":"Divinazione di 3° livello, rituale (Bardo, Chierico, Druido, Mago)","cl":"Bardo, Chierico, Druido, Mago","fonte":"Magia della Luna","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** illimitata\n**Componenti:** V, S, M (uno specchio d\u0027acqua abbastanza grande da riflettere la luna, e candele e incenso del valore di 100 mo, che l\u0027incantesimo consuma)\n**Durata:** concentrazione, fino a 10 minuti\n\nChiami la luna dentro l\u0027acqua, e l\u0027acqua diventa una finestra aperta su un altro specchio d\u0027acqua in cui hai già celebrato questo stesso rito. Attraverso la finestra si vede e si parla, da una parte e dall\u0027altra, ma niente la attraversa: né persone, né oggetti, né incantesimi.\n\nLa prima volta che celebri il rito, e ogni volta che lo specchio d\u0027acqua che cerchi è stato rotto, svuotato o prosciugato, l\u0027acqua ti mostra soltanto il nero assoluto della faccia della luna che non si vede."},{"n":"Scudo d\u0027Eclisse","lv":3,"sc":"Evocazione di 3° livello (Mago, Paladino, Stregone, Warlock)","cl":"Mago, Paladino, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** V, S, M (uno specchietto)\n**Durata:** concentrazione, fino a 1 minuto\n\nIl buio gelato di una luna coperta ti si stringe addosso, e la pelle ti si fa fredda come una lapide. Per la durata, ogni creatura che ti attacca in mischia deve effettuare un tiro salvezza su Saggezza: se lo fallisce subisce 1d6 danni radianti e 1d6 danni da freddo, se lo supera ne subisce la metà.\n\n**Usando uno slot di livello superiore.** I danni da freddo aumentano di 1d6 per ogni livello dello slot superiore al 3°."},{"n":"Sfera Vermiglia","lv":3,"sc":"Invocazione di 3° livello (Sangue Selvatico)","cl":"Sangue Selvatico","fonte":"Sangue Selvatico","md":"**Tempo di lancio:** azione\n**Gittata:** 36 m\n**Componenti:** V, S, M (l\u0027occhio cristallizzato di un predatore)\n**Durata:** istantanea\n\nLanci una goccia del tuo sangue in un punto che vedi entro gittata. Quando arriva, la goccia esplode in una vampata rossa di 6 m di raggio. Ogni creatura nell\u0027area subisce 4d6 danni da fuoco, dimezzati con un tiro salvezza su Destrezza superato, e 3d4 danni psichici in ogni caso. Poi ogni creatura nell\u0027area deve superare un tiro salvezza su Saggezza, altrimenti è Spaventata fino alla fine del suo turno successivo.\n\n**Usando un livello superiore.** I danni da fuoco aumentano di 1d6 e i danni psichici di 1d4 per ogni Dado Vita speso oltre il terzo."},{"n":"Tocco d\u0027Argento","lv":3,"sc":"Necromanzia di 3° livello (Bardo, Chierico, Druido, Mago, Paladino, Stregone)","cl":"Bardo, Chierico, Druido, Mago, Paladino, Stregone","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nLe mani ti si accendono di luna e diventano tiepide, e sotto la pelle dei polsi le vene ti si fanno grigie, come se dentro ci scorresse argento. Quando lanci l\u0027incantesimo, e poi con un\u0027azione in ognuno dei tuoi turni successivi, puoi toccare una creatura consenziente che non sia tu e passarle la tua vita: subisci danni necrotici pari a 1d6 più il tuo modificatore di caratteristica da incantatore, e la creatura recupera PF pari al doppio dei danni che hai subito. I PF in eccesso diventano PF temporanei.\n\n**Usando uno slot di livello superiore.** I danni necrotici aumentano di 1d6 per ogni livello dello slot superiore al 3°.\n\n---"},{"n":"Aureola della Madre Pallida","lv":4,"sc":"Evocazione di 4° livello (Chierico, Druido, Paladino)","cl":"Chierico, Druido, Paladino","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale (sfera di 4,5 m)\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nSopra la tua testa si accende una piccola luna, larga quanto una mano aperta, che si muove con te come un\u0027aureola e manda luce fioca in una sfera di 4,5 m di raggio. Quando una creatura a tua scelta entra nella sfera per la prima volta in un turno, o inizia lì il suo turno, effettua un tiro salvezza su Carisma. Se lo fallisce subisce un effetto che dipende dalla tua luna di nascita; se lo supera subisce la metà dei danni e nessun altro effetto.\n- **Nuova.** La creatura subisce 3d10 danni necrotici. La prima volta che fallisce il tiro salvezza subisce anche un livello di Indebolimento, e non più di uno per tutta la durata. Alla fine dell\u0027incantesimo perde il livello di Indebolimento che l\u0027incantesimo le ha dato.\n- **Crescente.** La creatura subisce 3d8 danni da fuoco ed è Accecata finché non esce dalla sfera.\n- **Piena.** La creatura subisce 3d10 danni radianti, e se è Invisibile diventa visibile. Finché resta nella sfera non può teletrasportarsi, diventare Invisibile o incorporea, cambiare forma né lasciare il piano in cui si trova.\n- **Calante.** La creatura subisce 3d8 danni da freddo, e la sua velocità si dimezza finché non esce dalla sfera.\n\nSe la luna è nella fase della tua luna di nascita, le aberrazioni, gli immondi e i non morti hanno svantaggio al tiro salvezza."},{"n":"Fulmine d\u0027Argento","lv":4,"sc":"Evocazione di 4° livello (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 36 m\n**Componenti:** V, S, M (un pendente d\u0027argento con uno zaffiro, del valore di 150 mo)\n**Durata:** istantanea\n\nUn fulmine bianco scende dal cielo su una creatura che vedi entro gittata e si apre dietro di lei in un cono di 4,5 m. Il bersaglio e ogni creatura nel cono effettuano un tiro salvezza su Destrezza: chi lo fallisce subisce 1d8 danni da fulmine e 2d8 danni radianti, chi lo supera ne subisce la metà. Il fulmine cambia con la fase maggiore della luna:\n- **Nuova.** Infligge anche 4d8 danni necrotici, dimezzati con il tiro salvezza superato.\n- **Crescente.** Infligge anche 3d8 danni da fuoco, dimezzati con il tiro salvezza superato, e appicca il fuoco agli oggetti infiammabili nell\u0027area che nessuno indossa o trasporta.\n- **Piena.** Infligge anche 4d8 danni radianti, dimezzati con il tiro salvezza superato.\n- **Calante.** Infligge anche 3d8 danni da freddo, dimezzati con il tiro salvezza superato, e chi fallisce il tiro salvezza non può effettuare reazioni fino all\u0027inizio del suo turno successivo.\n\n**Usando uno slot di livello superiore.** I danni da fulmine aumentano di 1d8 per ogni livello dello slot superiore al 4°."},{"n":"Immagine Vermiglia","lv":4,"sc":"Illusione di 4° livello (Sangue Selvatico)","cl":"Sangue Selvatico","fonte":"Sangue Selvatico","md":"**Tempo di lancio:** azione\n**Gittata:** 18 m\n**Componenti:** V, S, M (una costola di animale)\n**Durata:** concentrazione, fino a 1 ora\n\nIn un punto che vedi entro gittata crei l\u0027immagine di un oggetto, di una creatura o di qualunque altra cosa che stia dentro un cubo di 3 m di lato, e la fai orrenda: scuoiata, sventrata, gocciolante. L\u0027immagine sembra vera in tutto, compresi i suoni, gli odori e il calore, anche se non può causare danni né condizioni.\n\nUna creatura può usare un\u0027azione per guardarla da vicino, senza toccarla, ed effettuare una prova di Intelligenza (Indagare) contro la CD del tuo tiro salvezza degli incantesimi: se la supera capisce che è un\u0027illusione, e da quel momento ci vede attraverso. Chi la tocca, invece, la fa esplodere in una nube di schegge d\u0027osso e sangue cristallizzato: ogni creatura entro 3 m dall\u0027immagine subisce 3d8 danni taglienti, dimezzati con un tiro salvezza su Costituzione superato, e 3d4 danni psichici in ogni caso. Poi l\u0027incantesimo termina.\n\n**Usando un livello superiore.** I danni taglienti aumentano di 1d8 e i danni psichici di 1d4 per ogni Dado Vita speso oltre il quarto."},{"n":"Incanto di Luna","lv":4,"sc":"Ammaliamento di 4° livello (Bardo, Warlock)","cl":"Bardo, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale (sfera di 4,5 m)\n**Componenti:** V, S, M (un sassolino bianco e una perla)\n**Durata:** concentrazione, fino a 1 minuto\n\nTi si accende negli occhi la stessa luce che c\u0027è sull\u0027acqua ferma, e chi ti sta vicino non riesce a smettere di guardarla. Ogni creatura entro 4,5 m da te deve superare un tiro salvezza su Saggezza, altrimenti è Affascinata da te per la durata, e finché è Affascinata ha svantaggio ai tiri salvezza contro i tuoi incantesimi, compreso questo. Una creatura Affascinata ripete il tiro salvezza ogni volta che subisce danni e alla fine di ogni suo turno che termina a più di 6 m da te, e se lo supera l\u0027effetto termina per lei.\n\n**Usando uno slot di livello superiore.** Il raggio della sfera aumenta di 1,5 m per ogni livello dello slot superiore al 4°."},{"n":"Miraggio di Luna","lv":4,"sc":"Illusione di 4° livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** 90 m\n**Componenti:** V, S, M (una perla, un sasso e una biglia di vetro)\n**Durata:** un giro di campane (24 ore)\n\nProietti l\u0027illusione di un posto all\u0027aperto, come un prato, una radura o una spiaggia, dentro un cubo di 45 m di lato. Nel miraggio non si vedono creature, ma si sentono i loro versi: cani lontani, uccelli, voci. In alto, sopra il miraggio, c\u0027è la luna, nella fase che hai scelto tu.\n\nUna creatura che inizia il turno dentro il miraggio può effettuare una prova di Intelligenza (Indagare) contro la CD del tuo tiro salvezza degli incantesimi, e se la supera capisce che è un\u0027illusione. Per chi non l\u0027ha capito, finché resta nel miraggio, la fase della luna è quella che hai scelto tu, per tutti gli effetti."},{"n":"Occhio della Luna","lv":4,"sc":"Divinazione di 4° livello (Chierico, Druido, Mago)","cl":"Chierico, Druido, Mago","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** V, S, M (una perla del valore di 50 mo, che l\u0027incantesimo consuma)\n**Durata:** concentrazione, fino a 1 ora\n\nChiedi alla luna di prestarti il suo punto di vista. Per la durata, con un\u0027azione, puoi guardare qualunque punto sotto il cielo aperto entro 100 km da te, come se fossi sospeso sopra di lui. Quello che vedi dipende dalla fase maggiore della luna:\n- **Nuova.** Vedi come se avessi scurovisione.\n- **Piena.** Vedi come se avessi _visione del vero_.\n- **Crescente o Calante.** Vedi le creature e gli oggetti Invisibili.\n\nFinché guardi con gli occhi della luna, i tuoi sensi normali non funzionano: sei Accecato e Assordato per quello che ti succede intorno."},{"n":"Pelle d\u0027Argento","lv":4,"sc":"Abiurazione di 4° livello (Bardo, Mago, Paladino, Ranger, Stregone, Warlock)","cl":"Bardo, Mago, Paladino, Ranger, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (polvere di perla del valore di almeno 100 mo, che l\u0027incantesimo consuma)\n**Durata:** concentrazione, fino a 1 ora\n\nSoffi la polvere sulla pelle di una creatura consenziente, e la pelle diventa d\u0027argento lucido, così liscia che ci si specchia. Per la durata la creatura ha vantaggio ai tiri salvezza contro gli incantesimi."},{"n":"Pioggia di Sangue","lv":4,"sc":"Evocazione di 4° livello (Sangue Selvatico)","cl":"Sangue Selvatico","fonte":"Sangue Selvatico","md":"**Tempo di lancio:** azione\n**Gittata:** 36 m\n**Componenti:** V, S, M (il cuore di un animale, strappato da meno di un giro di campane)\n**Durata:** 1 round\n\nTi tagli il palmo e lasci cadere il sangue a terra, e il sangue, invece di cadere, sale: evapora in nuvole basse color ruggine, e da quelle nuvole comincia a piovere sangue bollente, che brilla. La pioggia cade in un cilindro di 4,5 m di raggio e 12 m di altezza, centrato su un punto che vedi entro gittata. Fino all\u0027inizio del tuo turno successivo l\u0027area è pesantemente oscurata.\n\nOgni creatura che si trova nell\u0027area quando lanci l\u0027incantesimo, o che termina il turno al suo interno, subisce 2d6 danni da fuoco e 4d4 danni psichici, e deve superare un tiro salvezza su Saggezza, altrimenti fino alla fine del suo turno successivo la sua velocità si dimezza ed è Spaventata."},{"n":"Vetro di Luna","lv":4,"sc":"Trasmutazione di 4° livello (Mago)","cl":"Mago","fonte":"Magia della Luna","md":"**Tempo di lancio:** 10 minuti, oppure 1 minuto in luna piena\n**Gittata:** 36 m\n**Componenti:** V, S, M (uno specchio rotondo largo almeno 90 cm, oppure una pozza d\u0027acqua dolce altrettanto larga in cui versi polvere d\u0027argento del valore di 50 mo, che l\u0027incantesimo consuma)\n**Durata:** istantanea\n\nNon puoi lanciare questo incantesimo in luna nuova. Prendi la luce della luna riflessa nello specchio, la stendi e la indurisci, e ne fai un oggetto vero in un punto entro gittata. L\u0027oggetto può essere Grande o più piccolo, e deve stare dentro un cubo di 3 m di lato. È grezzo, appena abbozzato, fatto di un vetro traslucido che manda un chiarore debole, e chiunque lo guardi capisce che è magico.\n\nL\u0027incantesimo non crea creature né oggetti magici. Per gli oggetti che richiedono un lavoro fine, come gioielli, armi, vetri lavorati o armature, devi essere competente negli attrezzi che servono a fabbricarli. L\u0027oggetto sparisce alla fine della fase della luna in corso.\n\n---"},{"n":"Arma di Selenite","lv":5,"sc":"Evocazione di 5° livello (Mago, Paladino, Ranger, Stregone)","cl":"Mago, Paladino, Ranger, Stregone","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione bonus\n**Gittata:** contatto\n**Componenti:** V, S, M (una perla del valore di almeno 200 mo)\n**Durata:** concentrazione, fino a 1 minuto\n\nTocchi un\u0027arma e ci versi dentro la luna. Per la durata l\u0027arma manda un chiarore debole, luce fioca in un raggio di 9 m, e chi la impugna infligge 2d8 danni radianti extra quando colpisce. Se l\u0027arma non era magica, lo diventa per la durata. Gli attacchi con l\u0027arma sono colpi critici con un 19 o un 20 sul dado.\n\n**Usando uno slot di livello superiore.** I danni extra aumentano di 1d8 per ogni livello dello slot superiore al 5°."},{"n":"Comandare la Fase","lv":5,"sc":"Trasmutazione di 5° livello (Druido, Mago, Ranger)","cl":"Druido, Mago, Ranger","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale (raggio di 800 m)\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 ora\n\nAlzi la mano verso la luna e la giri, come si gira una chiave. In cielo, sopra un\u0027area di 800 m di raggio centrata su di te, la luna cambia faccia, e prende la fase che scegli tu. Per la durata, per ogni creatura e ogni oggetto nell\u0027area, la fase della luna è quella che hai scelto, per tutti gli effetti. Se esci dall\u0027area, l\u0027incantesimo termina.\n\n**Usando uno slot di livello superiore.** Con uno slot di 6° livello la durata diventa di 8 ore. Con uno slot di 7° livello diventa di un giro di campane, e l\u0027incantesimo non termina se esci dall\u0027area. Con uno slot di 8° livello diventa di sette sonni, l\u0027incantesimo non termina se esci dall\u0027area e non richiede più concentrazione. Con uno slot di 9° livello dura finché qualcuno non lo dissolve, e non richiede concentrazione."},{"n":"Il Serpente Vermiglio","lv":5,"sc":"Invocazione di 5° livello (Sangue Selvatico)","cl":"Sangue Selvatico","fonte":"Sangue Selvatico","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** V, S, M (un pugnale d\u0027argento e rubini del valore di almeno 1.0
