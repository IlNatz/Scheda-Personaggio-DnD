ziente che supera un tiro salvezza su Costituzione non subisce l\u0027effetto dell\u0027incantesimo.\n\nIl bersaglio può muoversi soltanto spingendosi o aggrappandosi a un oggetto fisso o a una superficie entro portata (come per esempio una parete o un soffitto), che gli permetta di muoversi come se ne stesse scalando la superficie. Nel proprio turno, l\u0027incantatore può variare l\u0027altitudine del bersaglio per un massimo di 6 metri in ogni direzione. Se il bersaglio è l\u0027incantatore stesso, può muoversi verso l\u0027alto o verso il basso come parte del suo movimento. Altrimenti, l\u0027incantatore può usare la sua azione di Magia per muovere il bersaglio, che deve rimanere entro gittata.\n\nIl bersaglio, se è ancora sospeso, al termine dell\u0027incantesimo fluttua dolcemente fino a terra."},{"n":"Libertà di movimento","lv":4,"sc":"Abiurazione di 4º livello (Bardo, Chierico, Druido, Ranger)","cl":"Bardo, Chierico, Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (una cinghia di cuoio)\n**Durata:** 1 ora\n\nL\u0027incantatore tocca una creatura consenziente. Per la durata dell\u0027incantesimo, il movimento del bersaglio non è influenzato dal terreno difficile, inoltre incantesimi e altri effetti magici non possono né ridurne la velocità né trattenerlo o renderlo paralizzato. Il bersaglio dispone anche di una velocità di nuoto pari alla sua velocità.\n\nInoltre, il bersaglio può usare 1,5 metri di movimento per sfuggire automaticamente alle restrizioni non magiche, come un paio di manette o la presa di una creatura che lo afferra.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 4º."},{"n":"Linguaggi","lv":3,"sc":"Divinazione di 3º livello (Bardo, Chierico, Mago, Stregone, Warlock)","cl":"Bardo, Chierico, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, M (una ziggurat in miniatura)\n**Durata:** 1 ora\n\nQuesto incantesimo concede alla creatura toccata dall\u0027incantatore l\u0027abilità di comprendere qualsiasi lingua (parlata o non) che sente o vede. Inoltre, quando comunica con parole o gesti, qualsiasi creatura che conosce almeno una lingua può comprenderla se è in grado di sentire ciò che dice o vedere i suoi gesti."},{"n":"Localizza animali o vegetali","lv":2,"sc":"Divinazione di 2º livello (Bardo, Druido, Ranger)","cl":"Bardo, Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** incantatore\n**Componenti:** V, S, M (un ciuffo di peli di un segugio)\n**Durata:** istantanea\n\nL\u0027incantatore descrive o nomina un tipo specifico di bestia o creatura vegetale, oppure un vegetale non magico. Apprende la direzione e la distanza fino alla creatura o al vegetale di quel tipo più vicino entro 7,5 chilometri, se ne è presente almeno uno."},{"n":"Localizza creatura","lv":4,"sc":"Divinazione di 4º livello (Bardo, Chierico, Druido, Mago, Paladino, Ranger)","cl":"Bardo, Chierico, Druido, Mago, Paladino, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (un ciuffo di peli di un segugio)\n**Durata:** concentrazione, fino a 1 ora\n\nL\u0027incantatore descrive o nomina una creatura a lui familiare, percependo la direzione della sua ubicazione se la creatura si trova entro 300 metri da lui. Se la creatura è in movimento, l\u0027incantatore apprende verso quale direzione si sta dirigendo. L\u0027incantesimo può localizzare una creatura specifica nota all\u0027incantatore o una creatura di un tipo specifico più vicina (come un umano o un unicorno), purché l\u0027incantatore abbia visto tale creatura da vicino (entro 9 metri) almeno una volta. Se la creatura descritta o nominata ha una forma diversa, per esempio se si trova sotto l\u0027effetto di un incantesimo carne in pietra o metamorfosi, questo incantesimo non riesce a localizzarla.\n\nQuesto incantesimo non può localizzare una creatura se uno strato di piombo blocca il percorso diretto tra essa e l\u0027incantatore."},{"n":"Localizza oggetto","lv":2,"sc":"Divinazione di 2º livello (Bardo, Chierico, Druido, Mago, Paladino, Ranger)","cl":"Bardo, Chierico, Druido, Mago, Paladino, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (un ramoscello biforcuto)\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore descrive o nomina un oggetto a lui familiare, percependo la direzione della sua ubicazione se l\u0027oggetto si trova entro 300 metri da lui. Se l\u0027oggetto è in movimento, l\u0027incantatore apprende verso quale direzione si sta dirigendo.\n\nL\u0027incantesimo può localizzare un oggetto specifico noto all\u0027incantatore, purché l\u0027abbia visto da vicino (entro 9 metri) almeno una volta. In alternativa, può localizzare l\u0027oggetto di un tipo particolare più vicino, come per esempio un certo tipo di veste, gioiello, mobile, strumento o arma.\n\nQuesto incantesimo non può localizzare un oggetto se uno strato di piombo blocca il percorso diretto tra esso e l\u0027incantatore."},{"n":"Loquacità","lv":8,"sc":"Ammaliamento di 8º livello (Bardo, Warlock)","cl":"Bardo, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V\n**Durata:** 1 ora\n\nFino al termine dell\u0027incantesimo, quando l\u0027incantatore effettua una prova di Carisma, può sostituire il risultato del tiro con un 15. Inoltre, a prescindere da ciò che dice, le magie in grado di determinare se un bersaglio stia dicendo o meno la verità indicano che l\u0027incantatore è sincero."},{"n":"Luce","lv":0,"sc":"Trucchetto di Invocazione (Bardo, Chierico, Mago, Stregone)","cl":"Bardo, Chierico, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, M (una lucciola o del muschio fosforescente)\n**Durata:** 1 ora\n\nL\u0027incantatore tocca un oggetto di taglia Grande o inferiore che non sia stato indossato o trasportato da altri. Fino al termine dell\u0027incantesimo, l\u0027oggetto proietta luce intensa entro un raggio di 6 metri e luce fioca per altri 6 metri. L\u0027incantatore può scegliere il colore di luce che desidera.\n\nCoprire l\u0027oggetto con qualcosa di opaco blocca la luce. L\u0027incantesimo termina se l\u0027incantatore lo lancia di nuovo."},{"n":"Luce diurna","lv":3,"sc":"Invocazione di 3º livello (Chierico, Druido, Paladino, Ranger, Stregone)","cl":"Chierico, Druido, Paladino, Ranger, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** 1 ora\n\nPer la durata dell\u0027incantesimo, un fascio di luce solare si sprigiona da un punto entro gittata e riempie una sfera del raggio di 18 metri. L\u0027area della luce solare emette luce intensa e poi luce fioca per ulteriori 18 metri.\n\nIn alternativa, l\u0027incantatore lancia l\u0027incantesimo su un oggetto che non sia indossato o trasportato, facendo sì che la luce solare riempia un\u0027emanazione di 18 metri di cui l\u0027oggetto è il punto di origine. Coprire l\u0027oggetto con qualcosa di opaco, come una ciotola o un elmo, blocca la luce solare. Se una parte dell\u0027area di questo incantesimo si sovrappone a un\u0027area di oscurità creata da un incantesimo di 3º livello o inferiore, l\u0027incantesimo che ha creato la luce viene dissolto."},{"n":"Luce splendente","lv":0,"sc":"Trucchetto di Invocazione (Bardo, Druido)","cl":"Bardo, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore lancia un globo di luce contro una creatura o un oggetto entro gittata, effettuando un attacco a distanza con incantesimo contro il bersaglio. Se il colpo va a segno, il bersaglio subisce 1d8 danni radiosi e, fino al termine del turno successivo dell\u0027incantatore, emette luce fioca nel raggio di 3 metri e non può beneficiare della condizione di invisibilità.\n\n**Trucchetto potenziato.** I danni aumentano di 1d8 quando l\u0027incantatore raggiunge il 5º livello (2d8), l\u002711º livello (3d8) e il 17º livello (4d8)."},{"n":"Luci danzanti","lv":0,"sc":"Trucchetto di Illusione (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S, M ((un frammento di fosforo)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore crea fino a quattro luci delle dimensioni di una torcia, facendole apparire come lanterne, torce o globi luminosi che fluttuano per la durata dell\u0027incantesimo entro la sua gittata. In alternativa, l\u0027incantatore può fondere le quattro luci in un\u0027unica forma luminosa di taglia Media di aspetto simile a quello umano. Qualunque sia la forma scelta, ogni luce proietta luce fioca entro un raggio di 3 metri.\n\nCome azione bonus, l\u0027incantatore può muovere le luci per un massimo di 18 metri fino a un punto entro gittata. Ogni luce deve trovarsi entro 6 metri da un\u0027altra luce creata da questo incantesimo. Se una delle luci supera la gittata dell\u0027incantesimo, svanisce."},{"n":"Luminescenza","lv":1,"sc":"Invocazione di 1º livello (Bardo, Druido)","cl":"Bardo, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V\n**Durata:** concentrazione, fino a 1 minuto\n\nGli oggetti contenuti in un cubo con spigolo di 6 metri entro gittata vengono evidenziati da un alone di luce blu, verde o viola (a scelta dell\u0027incantatore). Ogni creatura presente nel cubo viene a sua volta evidenziata se fallisce un tiro salvezza su Destrezza. Per la durata dell\u0027incantesimo, gli oggetti e le creature influenzate proiettano luce fioca entro un raggio di 3 metri e non possono beneficiare della condizione di invisibilità.\n\nI tiri per colpire contro una creatura influenzata o un oggetto influenzato dispongono di vantaggio se l\u0027attaccante è in grado di vederli."},{"n":"Mani brucianti","lv":1,"sc":"Invocazione di 1º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** istantanea\n\nUn sottile velo di fiamme si propaga dall\u0027incantatore. Ogni creatura entro un cono di 4,5 metri effettua un tiro salvezza su Destrezza, subendo 3d6 danni da fuoco in caso di fallimento, o la metà dei danni in caso di successo.\n\nGli oggetti infiammabili nel cono che non sono indossati o trasportati iniziano a bruciare.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d6 per ogni slot di livello superiore al 1º."},{"n":"Mano arcana","lv":5,"sc":"Invocazione di 5º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S, M (un guscio d\u0027uovo e un guanto)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore crea una mano Grande di energia magica luccicante in uno spazio libero entro gittata che è in grado di vedere. La mano permane per la durata dell\u0027incantesimo e si muove al comando dell\u0027incantatore, imitando i movimenti della sua mano.\n\nLa mano è un oggetto che possiede CA 20 e una quantità di punti ferita pari ai punti ferita massimi dell\u0027incantatore; se scende a 0 punti ferita, l\u0027incantesimo termina. La mano non occupa spazio.\n\nQuando l\u0027incantatore lancia l\u0027incantesimo come azione bonus nei suoi turni successivi, può muovere la mano per un massimo di 18 metri e causare uno dei seguenti effetti:\n\n**Mano interposta.** La mano conferisce all\u0027incantatore mezza copertura contro gli attacchi e altri effetti che hanno origine dal suo spazio o che la attraversano. Inoltre, il suo spazio conta come terreno difficile per i nemici.\n\n**Mano possente.** La mano tenta di spingere una creatura di taglia Enorme o inferiore situata entro 1,5 metri da essa: Il bersaglio deve superare un tiro salvezza su Forza, altrimenti viene spinto dalla mano fino a una distanza pari a 1,5 metri, più un numero di metri pari a cinque volte il modificatore di caratteristica da incantatore. La mano si muove insieme al bersaglio, rimanendo entro 1,5 metri da esso.\n\n**Mano stritolatrice.** La mano tenta di afferrare una creatura di taglia Enorme o inferiore situata entro 1,5 metri da essa. Il bersaglio deve superare un tiro salvezza su Destrezza, altrimenti viene afferrato; la CD per sfuggire alla presa è pari alla CD del tiro salvezza sull\u0027incantesimo dell\u0027incantatore. Mentre la mano afferra il bersaglio, l\u0027incantatore può effettuare un\u0027azione bonus per ordinarle di stritolarlo, infliggendogli danni contundenti pari a 4d6 più il modificatore di caratteristica da incantatore dell\u0027incantatore.\n\n**Pugno serrato.** La mano colpisce un bersaglio che si trova entro 1,5 metri da essa. L\u0027incantatore effettua un attacco con incantesimo in mischia. Se il colpo va a segno, il bersaglio subisce 5d8 danni da forza.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni del pugno serrato aumentano di 2d8 e quelli della mano stritolatrice di 2d6 per ogni slot di livello superiore al 5º."},{"n":"Mano magica","lv":0,"sc":"Trucchetto di Evocazione (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S\n**Durata:** 1 minuto\n\nUna mano spettrale fluttuante compare in un punto a scelta dell\u0027incantatore situato entro gittata. La mano permane per la durata dell\u0027incantesimo e svanisce se si trova a più di 9 metri dall\u0027incantatore o se quest\u0027ultimo lancia nuovamente l\u0027incantesimo. Quando lancia l\u0027incantesimo, l\u0027incantatore può usare la mano per maneggiare un oggetto, aprire una porta o un contenitore che non siano chiusi a chiave, riporre o estrarre un oggetto da un contenitore aperto o versare il contenuto di una fiala. Come azione di Magia nei tuoi turni successivi, puoi controllare nuovamente la mano. Come parte di quell\u0027azione, puoi muoverla fino a 9 metri. La mano non può attaccare, attivare oggetti magici o trasportare più di 5 chilogrammi."},{"n":"Marchio del cacciatore","lv":1,"sc":"Divinazione di 1º livello (Ranger)","cl":"Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** 27 metri\n**Componenti:** V\n**Durata:** concentrazione, fino a 1 ora\n\nL\u0027incantatore marchia magicamente come sua preda una creatura entro gittata che egli è in grado di vedere. Fino al termine dell\u0027incantesimo, l\u0027incantatore infligge 1d6 danni da forza extra al bersaglio ogni volta che lo colpisce con un tiro per colpire. Inoltre, l\u0027incantatore dispone di vantaggio a qualsiasi prova di Saggezza (Percezione o Sopravvivenza) che effettua per trovare il bersaglio.\n\nSe il bersaglio scende a 0 punti ferita prima del termine dell\u0027incantesimo, l\u0027incantatore può effettuare un\u0027azione bonus per spostare il marchio su un\u0027altra creatura entro gittata che egli è in grado di vedere.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La concentrazione dell\u0027incantatore può durare di più utilizzando uno slot incantesimo di 3º o 4º livello (fino a 8 ore) o di 5º livello o superiore (fino a 24 ore)."},{"n":"Messaggio","lv":0,"sc":"Trucchetto di Trasmutazione (Bardo, Druido, Mago, Stregone)","cl":"Bardo, Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** S, M (un filo di rame)\n**Durata:** 1 round\n\nL\u0027incantatore indica una creatura entro gittata e sussurra un messaggio. Solo il bersaglio sente il messaggio e può sussurrare una risposta che unicamente l\u0027incantatore può sentire.\n\nL\u0027incantatore può lanciare questo incantesimo attraverso oggetti solidi se il bersaglio gli è noto e sa che si trova oltre la barriera. Tuttavia, l\u0027incantesimo viene bloccato da silenzio magico, una sottile lamina di piombo o 30 centimetri di pietra, metallo o legno."},{"n":"Metamorfosi","lv":4,"sc":"Trasmutazione di 4º livello (Bardo, Druido, Mago, Stregone)","cl":"Bardo, Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (il bozzolo di un bruco)\n**Durata:** concentrazione, fino a 1 ora\n\nL\u0027incantatore tenta di trasformare in bestia una creatura entro gittata che egli è in grado di vedere. Il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti assume la forma di una bestia per la durata dell\u0027incantesimo. La forma in cui muta può essere quella di qualsiasi bestia, a scelta dell\u0027incantatore, il cui grado di sfida sia pari o inferiore a quello del bersaglio (o al livello del bersaglio, se esso non possiede un grado di sfida). Le statistiche di gioco del bersaglio vengono sostituite dalla scheda delle statistiche della bestia scelta, ma il bersaglio conserva il proprio allineamento, personalità, tipo di creatura, punti ferita e Dadi Vita. Vedi la sezione \"Animali\" in \"Mostri\" per un esempio di scheda delle statistiche di una bestia.\n\nIl bersaglio guadagna un numero di punti ferita temporanei pari ai punti ferita della forma bestiale. Al termine dell\u0027incantesimo, il bersaglio perde tutti i punti ferita temporanei rimasti. L\u0027incantesimo termina in anticipo se il bersaglio non ha punti ferita temporanei rimasti.\n\nIl bersaglio è limitato alle azioni che può effettuare in base alla anatomia della sua nuova forma e non può parlare o lanciare incantesimi.\n\nL\u0027attrezzatura del bersaglio si fonde nella sua nuova forma e la creatura non può utilizzare il suo equipaggiamento o beneficiarne in alcun modo."},{"n":"Metamorfosi pura","lv":9,"sc":"Trasmutazione di 9º livello (Bardo, Mago, Warlock)","cl":"Bardo, Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S, M (una goccia di mercurio, una piccola quantità di resina e uno sbuffo di fumo)\n**Durata:** concentrazione, fino a 1 ora\n\nL\u0027incantatore sceglie una creatura o un oggetto non magico entro gittata che egli è in grado di vedere La prima si trasforma in un\u0027altra creatura o un oggetto non magico, mentre il secondo diventa una creatura (l\u0027oggetto non deve essere né indossato né trasportato). La trasformazione permane per la durata dell\u0027incantesimo, o finché il bersaglio non muore o viene distrutto. Tuttavia, se l\u0027incantatore mantiene la concentrazione per l\u0027intera durata, l\u0027incantesimo ha efficacia finché non viene dissolto o una creatura non consenziente supera un tiro salvezza su Saggezza.\n\n**Creatura in creatura.** Se l\u0027incantatore trasforma una creatura in un altro tipo di creatura, la nuova forma può essere di qualsiasi tipo, purché il suo grado di sfida sia pari o inferiore a quello del bersaglio (o al suo livello). Le sue statistiche di gioco sono sostituite dalla scheda delle statistiche della nuova forma, mantenendo punti ferita, Dadi Vita, allineamento e personalità.\n\nIl bersaglio guadagna un numero di punti ferita temporanei pari ai punti ferita della nuova forma. Al termine dell\u0027incantesimo, il bersaglio perde tutti i punti ferita temporanei rimasti.\n\nIl bersaglio è limitato alle azioni che può effettuare in base alla anatomia della sua nuova forma e non può parlare o lanciare incantesimi.\n\nL\u0027attrezzatura del bersaglio si fonde nella sua nuova forma e la creatura non può utilizzare il suo equipaggiamento o beneficiarne in alcun modo.\n\n**Oggetto in creatura.** L\u0027incantatore può trasformare un oggetto in un qualsiasi tipo di creatura, purché la sua taglia non sia superiore a quella dell\u0027oggetto e il suo grado di sfida sia pari o inferiore a 9. La creatura è amichevole nei confronti dell\u0027incantatore e dei suoi compagni e, in combattimento, obbedisce ai suoi comandi e svolge il suo turno subito dopo di lui.\n\nTuttavia, se l\u0027incantesimo dura per più di un\u0027ora, l\u0027incantatore perde il controllo su di essa. Potrebbe rimanere amichevole o meno nei suoi confronti, in base a come è stata trattata.\n\n**Creatura in oggetto.** Se l\u0027incantatore trasforma una creatura in un oggetto, tutto ciò che essa indossa o trasporta si fonde nella nuova forma, purché la taglia dell\u0027oggetto non sia superiore a quella della creatura. Le statistiche della creatura diventano quelle dell\u0027oggetto e, una volta terminato l\u0027incantesimo e tornata nella sua forma normale, essa non ricorderà nulla del tempo trascorso in quella forma."},{"n":"Miraggio arcano","lv":7,"sc":"Illusione di 7º livello (Bardo, Druido, Mago)","cl":"Bardo, Druido, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** vista\n**Componenti:** V, S\n**Durata:** 10 giorni\n\nL\u0027incantatore fa in modo che il terreno in un\u0027area quadrata con lato fino a 1,5 chilometri appaia, suoni, odori e perfino risulti al tatto come un altro tipo di terreno. Un campo aperto o una strada potrebbe così sembrare una palude, una collina, un crepaccio o qualche altro tipo di terreno impervio e invalicabile. Allo stesso modo, uno stagno potrebbe apparire come un prato erboso, un precipizio come un dolce pendio o un fosso irto di rocce come una strada ampia e accogliente.\n\nL\u0027incantatore può similmente modificare l\u0027aspetto di strutture o aggiungerne altre dove non sono presenti. Tuttavia, l\u0027incantesimo non può camuffare, occultare o aggiungere creature.\n\nL\u0027illusione include elementi uditivi, visivi, tattili e olfattivi, quindi può trasformare un terreno libero in un terreno difficile (o viceversa), oppure ostacolare in altri modi i movimenti all\u0027interno dell\u0027area. Ogni frammento di terreno illusorio (come una roccia o un bastone) che viene rimosso dall\u0027area dell\u0027incantesimo scompare immediatamente.\n\nLe creature con vista pura sono in grado di vedere la vera forma del terreno attraverso l\u0027illusione; tuttavia, permangono tutti gli altri elementi dell\u0027illusione, quindi, nonostante la creatura sia consapevole della sua presenza, può continuare a interagire fisicamente con essa."},{"n":"Modificare memoria","lv":5,"sc":"Ammaliamento di 5º livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore tenta di alterare i ricordi di un\u0027altra creatura entro gittata che egli è in grado di vedere, la quale effettua un tiro salvezza su Saggezza. Se l\u0027incantatore sta combattendo contro la creatura, essa dispone di vantaggio al tiro salvezza. Se il bersaglio fallisce il tiro, diventa affascinato per la durata dell\u0027incantesimo. Mentre è affascinato, il bersaglio è anche incapacitato e inconsapevole di ciò che gli accade intorno, ma può ancora udire l\u0027incantatore. Se subisce danni o è bersagliato da un altro incantesimo, questo incantesimo termina e nessun ricordo viene modificato.\n\nFinché questo ammaliamento permane, l\u0027incantatore può alterare il ricordo che il bersaglio ha di un evento avvenuto entro le 24 ore precedenti e della durata massima di 10 minuti. Può eliminare permanentemente tutti i ricordi dell\u0027evento, consentire al bersaglio di ricordarlo con estrema chiarezza, alterare il ricordo di alcuni dettagli o creare il ricordo di un evento diverso.\n\nPer descrivere in che modo i ricordi vengono alterati, l\u0027incantatore deve parlare con il bersaglio, che deve quindi comprendere il linguaggio usato affinché i ricordi modificati si radichino nella sua mente. La sua mente poi riempie le eventuali lacune presenti nella descrizione dell\u0027incantatore. Se l\u0027incantesimo termina prima che l\u0027incantatore abbia finito di descrivere i ricordi modificati, la memoria della creatura non subisce alcuna alterazione. In caso contrario, i ricordi modificati si radicano nella sua mente e l\u0027incantesimo termina. Un ricordo modificato non influenza necessariamente il comportamento di una creatura, in particolare se contraddice le sue inclinazioni naturali, il suo allineamento o le sue convinzioni. Un ricordo modificato illogicamente, come per esempio il falso ricordo di quanto la creatura ami nuotare nell\u0027acido, viene ignorato e considerato come un brutto sogno. Il GM potrebbe ritenere che un ricordo modificato sia troppo insensato per influenzare la creatura. Un incantesimo rimuovi maledizione o ristorare superiore lanciato su un bersaglio ripristina i veri ricordi della creatura.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può alterare i ricordi del bersaglio relativi a un evento risalente fino a 7 giorni prima (slot incantesimo di 6º livello), 30 giorni prima (slot incantesimo di 7º livello), 365 giorni prima (slot incantesimo di 8º livello) o a un qualsiasi momento del suo passato (slot incantesimo di 9º livello)."},{"n":"Movimenti del ragno","lv":2,"sc":"Trasmutazione di 2º livello (Mago, Stregone, Warlock)","cl":"Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (una goccia di bitume e un ragno)\n**Durata:** concentrazione, fino a 1 ora\n\nFino al termine dell\u0027incantesimo, una creatura consenziente toccata dall\u0027incantatore ottiene la capacità di muoversi verticalmente e orizzontalmente su pareti e soffitti, mantenendo le mani libere. Il bersaglio ottiene anche una velocità di scalata pari alla sua velocità.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 2º."},{"n":"Muovere il terreno","lv":6,"sc":"Trasmutazione di 6º livello (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S, M (una pala in miniatura)\n**Durata:** concentrazione, fino a 2 ore\n\nL\u0027incantatore sceglie un\u0027area di terreno entro gittata con un lato lungo al massimo 12 metri. Per la durata dell\u0027incantesimo, può rimodellare come desidera l\u0027argilla, il terriccio o la sabbia presente nell\u0027area. L\u0027incantatore può aumentare o ridurre l\u0027elevazione dell\u0027area, creare o riempire una fossa, erigere o spianare una parete, oppure innalzare una colonna. Tuttavia, l\u0027estensione di tali cambiamenti non può superare la metà della dimensione più grande dell\u0027area. Ad esempio, se l\u0027area dell\u0027incantesimo è un quadrato con lato di 12 metri, l\u0027incantatore può creare una colonna alta fino a 6 metri, aumentare o ridurre l\u0027elevazione del terreno di 6 metri, scavare una fossa della profondità massima di 6 metri e così via. Le modifiche verranno completate in 10 minuti. Dal momento che la trasformazione del terreno avviene lentamente, le creature nell\u0027area non restano intrappolate o ferite a causa dei movimenti del suolo.\n\nAl termine di ogni 10 minuti trascorsi a concentrarsi sull\u0027incantesimo, l\u0027incantatore può scegliere una nuova area di terreno entro gittata da influenzare.\n\nQuesto incantesimo non può manipolare la pietra naturale e le costruzioni realizzate in pietra: le rocce e le strutture si spostano per adattarsi al nuovo terreno. Se il modo in cui l\u0027incantatore modella il terreno rende una struttura instabile, essa potrebbe crollare.\n\nAllo stesso modo, questo incantesimo non influenza in modo diretto la crescita vegetale: la terra in movimento trasporta con sé i vegetali presenti."},{"n":"Muro di forza","lv":5,"sc":"Invocazione di 5º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S, M (un frammento di vetro)\n**Durata:** concentrazione, fino a 10 minuti\n\nUn muro di forza invisibile si materializza in un punto a scelta dell\u0027incantatore situato entro gittata. Esso appare nell\u0027orientamento che l\u0027incantatore desidera, come barriera orizzontale, verticale o inclinata. Può fluttuare nell\u0027aria o poggiare su una superficie solida. L\u0027incantatore può modellare la barriera in una cupola semisferica o in una sfera del raggio massimo di 3 metri, oppure come una superficie piatta composta da dieci pannelli quadrati con lato di 3 metri. Ogni pannello dev\u0027essere contiguo a un altro pannello. In qualsiasi forma, il muro ha uno spessore di 0,6 centimetri e permane per la durata dell\u0027incantesimo. Se, nel momento in cui appare, il muro passa attraverso lo spazio di una creatura, questa viene spinta verso un lato del muro a scelta dell\u0027incantatore.\n\nNulla può fisicamente attraversare il muro, che è immune a tutti i danni e non può essere dissolto con dissolvi magie. Tuttavia, un incantesimo disintegrazione lo distrugge all\u0027istante. Il muro si estende anche sul Piano Etereo e blocca i viaggi eterei che lo attraversano."},{"n":"Muro di fuoco","lv":4,"sc":"Invocazione di 4º livello (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S, M (un pezzo di carbone)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore crea un muro di fuoco su una superficie solida entro gittata. Il muro può essere lungo fino a 18 metri, alto 6 metri e spesso 30 cm, oppure essere un muro circolare del diametro massimo di 6 metri, alto 6 metri e spesso 30 cm. Il muro è opaco e permane per la durata dell\u0027incantesimo.\n\nQuando compare, ogni creatura al suo interno effettua un tiro salvezza su Destrezza, subendo 5d8 danni da fuoco in caso di fallimento, o la metà dei danni in caso di successo.\n\nUn lato del muro, scelto dall\u0027incantatore al momento del lancio dell\u0027incantesimo, infligge 5d8 danni da fuoco a ogni creatura che termina il proprio turno entro 3 metri da quel lato o all\u0027interno del muro. Una creatura subisce gli stessi danni quando lo attraversa per la prima volta in un turno o vi termina il suo turno. L\u0027altro lato del muro non infligge danni.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 4º."},{"n":"Muro di ghiaccio","lv":6,"sc":"Invocazione di 6º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S, M (un pezzo di quarzo)\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore crea un muro di ghiaccio su una superficie solida entro gittata, modellandolo in una cupola semisferica o in una sfera del raggio massimo di 3 metri, oppure in una superficie piatta composta da dieci pannelli quadrati con lato di 3 metri. Ogni pannello dev\u0027essere contiguo a un altro pannello. In qualsiasi forma, il muro ha uno spessore di 30 centimetri e permane per la durata dell\u0027incantesimo.\n\nSe il muro invade lo spazio di una creatura alla sua apparizione, quest\u0027ultima viene spinta verso un lato del muro (a scelta dell\u0027incantatore) ed effettua un tiro salvezza su Destrezza, subendo 10d6 danni da freddo in caso di fallimento, o la metà dei danni in caso di successo.\n\nIl muro è un oggetto che può essere danneggiato e quindi sfondato, con CA 12 e 30 punti ferita per ogni sezione di 3 metri. Inoltre, è immune ai danni da freddo, da veleno e psichici e vulnerabile ai danni da fuoco. Una sezione di 3 metri viene distrutta se scende a 0 punti ferita e, nello spazio che occupava in precedenza, permane una cortina d\u0027aria gelida. Una creatura che attraversa tale cortina d\u0027aria gelida per la per la prima volta in un turno effettua un tiro salvezza su Costituzione, subendo 5d6 danni da freddo in caso di fallimento, o la metà dei danni in caso di successo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni inflitti dal muro quando compare aumentano di 2d6 e quelli subiti da chi passa attraverso la cortina d\u0027aria gelida aumentano di 1d6 per ogni slot incantesimo di livello superiore al 6º."},{"n":"Muro di pietra","lv":5,"sc":"Invocazione di 5º livello (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S, M (un cubo di granito)\n**Durata:** concentrazione, fino a 10 minuti\n\nUn muro non magico di solida pietra si materializza in un punto a scelta dell\u0027incantatore situato entro gittata. Il muro è spesso 15 cm ed è composto da pannelli con lato di 3 metri, Ogni pannello dev\u0027essere contiguo a un altro pannello. In alternativa, l\u0027incantatore può creare pannelli di 3 metri per 6 metri spessi solo 8 centimetri.\n\nSe, nel momento in cui appare, il muro passa attraverso lo spazio di una creatura, questa viene spinta verso un lato del muro a scelta dell\u0027incantatore. Se una creatura rischia di trovarsi circondata su tutti i lati dal muro (o dal muro e un\u0027altra superficie solida) può effettuare un tiro salvezza su Destrezza. In caso di successo, può usare la sua reazione per muoversi fino alla sua velocità massima nel tentativo di non rimanere intrappolata dal muro.\n\nIl muro può avere la forma desiderata dall\u0027incantatore, ma non può occupare lo stesso spazio di una creatura o un oggetto. Non è necessario che sia verticale o poggi su fondamenta solide, deve tuttavia fondersi ed essere saldamente appoggiato a un blocco di pietra già esistente. È quindi possibile usare questo incantesimo per creare una rampa o realizzare un ponte che attraversi un baratro. Se l\u0027incantatore crea una campata di lunghezza superiore a 6 metri, deve dimezzare le dimensioni di ogni pannello per creare dei sostegni. Può modellare rozzamente il muro per creare parapetti e altri elementi simili.\n\nIl muro è un oggetto in pietra che può essere danneggiato e quindi sfondato. Ogni pannello ha CA 15 e 30 punti ferita per ogni 2,5 centimetri di spessore ed è immune ai danni da veleno e psichici. Quando un pannello scende a 0 punti ferita, viene distrutto e potrebbe causare il crollo dei pannelli collegati, a discrezione del GM.\n\nSe l\u0027incantatore mantiene la concentrazione su questo incantesimo per l\u0027intera durata, il muro diventa permanente e non può essere rimosso. In caso contrario, il muro scompare al termine dell\u0027incantesimo."},{"n":"Muro di spine","lv":6,"sc":"Evocazione di 6º livello (Druido)","cl":"Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S, M (una manciata di spine)\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore crea un muro di rovi irto di spine affilate. Il muro appare entro gittata su una superficie solida e permane per tutta la durata dell\u0027incantesimo. L\u0027incantatore può scegliere se creare un muro lungo fino a 18 metri, alto 3 metri e spesso 1,5 metri, oppure un muro circolare del diametro massimo di 6 metri, alto fino a 6 metri e spesso 1,5 metri. Il muro blocca la visuale.\n\nQuando compare, ogni creatura al suo interno effettua un tiro salvezza su Destrezza, subendo 7d8 danni perforanti in caso di fallimento, o la metà dei danni in caso di successo.\n\nUna creatura può muoversi attraverso il muro, seppur con fatica e dolore: per ogni 30 centimetri di muro che attraversa, deve usare 1,2 metri di movimento. Inoltre, la prima volta che una creatura entra in uno spazio nel muro in un turno o vi termina il proprio turno, effettua un tiro salvezza su Destrezza subendo 7d8 danni taglienti in caso di fallimento, o la metà dei danni in caso di successo. Una creatura effettua questo tiro salvezza solo una volta per turno.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** Entrambi i tipi di danno aumentano di 1d8 per ogni slot incantesimo di livello superiore al 6º."},{"n":"Muro di vento","lv":3,"sc":"Invocazione di 3º livello (Druido, Ranger)","cl":"Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S, M (un ventaglio e una piuma)\n**Durata:** concentrazione, fino a 1 minuto\n\nUn muro di vento forte si solleva dal terreno in un punto a scelta dell\u0027incantatore situato entro gittata. Il muro può essere lungo fino a 15 metri, alto 4,5 metri e spesso 30 cm. L\u0027incantatore può modellarlo nel modo che preferisce, purché formi un percorso continuo lungo il terreno. Il muro permane per tutta la durata dell\u0027incantesimo.\n\nQuando appare, ogni creatura nell\u0027area effettua un tiro salvezza su Forza, subendo 4d8 danni contundenti in caso di fallimento o la metà dei danni in caso di successo.\n\nIl vento forte tiene lontani fumo, nebbia e altri gas. Le creature o gli oggetti volanti di taglia Piccola o inferiore non possono passare attraverso il muro e i materiali leggeri, non fissati in qualche modo, volano verso l\u0027alto una volta portati al suo interno. Frecce, quadrelli e altri proiettili ordinari lanciati contro bersagli dietro il muro vengono deviati verso l\u0027alto e mancano automaticamente il bersaglio (i macigni scagliati dai giganti o dalle macchine d\u0027assedio e altri proiettili simili non sono influenzati dal muro). Inoltre, le creature in forma gassosa non possono attraversarlo."},{"n":"Muro prismatico","lv":9,"sc":"Abiurazione di 9º livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** 10 minuti\n\nUn piano scintillante di luce multicolore forma un muro opaco verticale (che può misurare fino a 27 metri di lunghezza, 9 metri di altezza e 2,5 centimetri di spessore), centrato su un punto entro gittata. In alternativa, l\u0027incantatore modella il muro in un globo del diametro massimo di 9 metri centrato su un punto entro gittata. Il muro permane per tutta la durata dell\u0027incantesimo. Se l\u0027incantatore posiziona il muro in uno spazio occupato da una creatura, l\u0027incantesimo termina immediatamente, senza alcun effetto.\n\nIl muro emana luce intensa entro 30 metri e luce fioca per ulteriori 30 metri. L\u0027incantatore e le creature da lui scelte al momento del lancio dell\u0027incantesimo possono passare attraverso il muro o rimanervi accanto senza subire danni. Se un\u0027altra creatura in grado di vedere il muro giunge entro 6 metri da esso o comincia lì il proprio turno, deve superare un tiro salvezza su Costituzione, altrimenti è accecata per 1 minuto.\n\nIl muro è composto da sette strati, ognuno di un colore diverso. Quando una creatura si protende oltre il muro o ci passa attraverso, lo fa attraversando uno strato alla volta. Ogni strato costringe la creatura a effettuare un tiro salvezza su Destrezza, altrimenti viene influenzata dalle proprietà di quello strato, come descritto nella tabella degli strati prismatici.\n\nIl muro, che ha una CA pari a 10, può essere distrutto uno strato alla volta e in ordine dal rosso al viola, in un modo specifico per ogni strato. Se uno strato viene distrutto, resta distrutto per la durata dell\u0027incantesimo. L\u0027incantesimo campo anti-magia non ha alcun effetto sul muro e l\u0027incantesimo dissolvi magie può influenzare solo lo strato viola.\n\nStrati prismatici\nOrdine Effetti\n1 Rosso. Tiro salvezza fallito: 12d6 danni da\nfuoco. Tiro salvezza superato: la metà dei\ndanni. Effetti aggiuntivi: gli attacchi a distanza\nnon magici non possono attraversare questo\nstrato, che viene distrutto se subisce almeno\n25 danni da freddo.\n2 Arancione. Tiro salvezza fallito: 12d6 danni da\nacido. Tiro salvezza superato: la metà dei danni.\nEffetti aggiuntivi: gli attacchi a distanza magici\nnon possono attraversare questo strato,\nche viene distrutto da un vento forte (come\nquello creato da folata di vento ).\n3 Giallo. Tiro salvezza fallito: 12d6 danni da fulmine. Tiro salvezza superato: la metà dei danni.\nEffetti aggiuntivi: questo strato viene distrutto\nse subisce almeno 60 danni da forza.\n4 Verde. Tiro salvezza fallito: 12d6 danni da\nveleno. Tiro salvezza superato: la metà dei\ndanni. Effetti aggiuntivi: un incantesimo\npassapareti o un altro incantesimo di livello\npari o superiore che è in grado di aprire un\nportale su una superficie solida, distrugge\nquesto strato.\n5 Blu. Tiro salvezza fallito: 12d6 danni da freddo.\nTiro salvezza superato: la metà dei danni. Effetti\naggiuntivi: questo strato viene distrutto se\nsubisce almeno 25 danni da fuoco.\n6 Indaco. Tiro salvezza fallito: il bersaglio è trattenuto ed effettua un tiro salvezza su Costituzione alla fine di ogni suo turno. Se lo supera\nper tre volte, pone fine alla condizione. Se\nfallisce per tre volte, resta pietrificato finché\nnon viene liberato da un effetto come quello\ndell\u0027incantesimo ristorare superiore . Non è\nnecessario che i tiri superati o falliti siano\nconsecutivi: si tiene semplicemente il conto di\nentrambi finché il bersaglio non ne accumula\ntre di un certo tipo. Effetti aggiuntivi: non\nè possibile lanciare incantesimi attraverso\nquesto strato, che viene distrutto dalla luce\nintensa emanata dall\u0027incantesimo luce diurna .\nOrdine Effetti\n7 Viola. Tiro salvezza fallito: il bersaglio è accecato ed effettua un tiro salvezza su Saggezza\nall\u0027inizio del turno successivo dell\u0027incantatore.\nSe lo supera, non è più accecato. Se lo fallisce,\nnon è più accecato e viene teletrasportato su\nun altro piano di esistenza (a scelta del GM).\nEffetti aggiuntivi: questo strato viene distrutto\nda dissolvi magie ."},{"n":"Nube di nebbia","lv":1,"sc":"Evocazione di 1º livello (Druido, Mago, Ranger, Stregone)","cl":"Druido, Mago, Ranger, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 ora\n\nL\u0027incantatore genera una sfera di nebbia del raggio di 6 metri centrata su un punto entro gittata. La sfera è pesantemente oscurata e permane la durata dell\u0027incantesimo o finché un vento forte (come quello creato da folata di vento) non la disperde.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** Il raggio della sfera di nebbia aumenta di 6 metri per ogni slot di livello superiore al 1º."},{"n":"Nube incendiaria","lv":8,"sc":"Evocazione di 8º livello (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 45 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nUna nube turbinante di fumo e tizzoni incandescenti appare in una sfera del raggio di 6 metri centrata su un punto entro gittata. L\u0027area coperta dalla nuvola è pesantemente oscurata. La nube permane per la durata dell\u0027incantesimo o finché un vento forte (come quello creato da folata di vento) non la disperde.\n\nQuando essa compare, ogni creatura al suo interno effettua un tiro salvezza su Destrezza, subendo 10d8 danni da fuoco in caso di fallimento, o la metà dei danni in caso di successo. Una creatura deve effettuare questo tiro salvezza anche quando la sfera si muove nel suo spazio e quando la creatura entra nella sfera o vi termina il suo turno. Una creatura effettua questo tiro salvezza solo una volta per turno.\n\nLa nube si allontana di 3 metri dall\u0027incantatore in una direzione scelta da quest\u0027ultimo all\u0027inizio di ogni suo turno."},{"n":"Nube maleodorante","lv":3,"sc":"Evocazione di 3º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 27 metri\n**Componenti:** V, S, M (un uovo marcio)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore genera una sfera di gas nauseante giallastro del raggio di 6 metri centrata su un punto entro gittata. La nube è pesantemente oscurata e rimane attiva per la durata dell\u0027incantesimo o finché un vento forte (come quello creato da folata di vento) non la disperde.\n\nOgni creatura che inizi il proprio turno all\u0027interno della sfera deve superare un tiro salvezza su Costituzione, altrimenti sarà avvelenata fino al termine del turno in corso. Finché è avvelenato, il bersaglio non può effettuare né azioni né azioni bonus."},{"n":"Nube mortale","lv":5,"sc":"Evocazione di 5º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore genera una sfera di nebbia giallo-verdastra del raggio di 6 metri centrata su un punto entro gittata. La nebbia permane la durata dell\u0027incantesimo o finché un vento forte (come quello creato da folata di vento) non la disperde, ponendo fine all\u0027incantesimo. L\u0027area della sfera è pesantemente oscurata.\n\nOgni creatura nella sfera effettua un tiro salvezza su Costituzione, subendo 5d8 danni da veleno in caso di fallimento, o la metà dei danni in caso di successo. Una creatura deve effettuare questo tiro salvezza anche quando la sfera si muove nel suo spazio e quando la creatura entra nella sfera o vi termina il suo turno. Una creatura effettua questo tiro salvezza solo una volta per turno.\n\nLa sfera si allontana di 3 metri dall\u0027incantatore all\u0027inizio di ogni suo turno.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 4º."},{"n":"Occhio arcano","lv":4,"sc":"Divinazione di 4º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S, M (un ciuffo di peli di pipistrello)\n**Durata:** concentrazione, fino a 1 ora\n\nL\u0027incantatore crea un occhio invisibile e invulnerabile che fluttua per la durata dell\u0027incantesimo entro la sua gittata. L\u0027incantatore riceve informazioni visive dall\u0027occhio, che può vedere in ogni direzione e che è inoltre dotato di scurovisione fino a 9 metri. Come azione bonus, l\u0027incantatore può muovere l\u0027occhio per un massimo di 9 metri in ogni direzione. Una barriera solida blocca il movimento dell\u0027occhio, che tuttavia può passare attraverso un\u0027apertura dal diametro minimo di 2,5 centimetri."},{"n":"Onda tonante","lv":1,"sc":"Invocazione di 1º livello (Bardo, Druido, Mago, Stregone)","cl":"Bardo, Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore sprigiona un\u0027ondata di energia tonante. Ogni creatura entro un cubo con spigolo di 4,5 metri originato dall\u0027incantatore effettua un tiro salvezza su Costituzione. Se lo fallisce, subisce 2d8 danni da tuono e viene spinta a una distanza di 3 metri dall\u0027incantatore. In caso di successo, subisce soltanto la metà di quei danni.\n\nInoltre, gli oggetti non fissati e situati interamente nel cubo vengono spinti a 3 metri dall\u0027incantatore, con un boato tonante entro 90 metri.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 1º."},{"n":"Oscurità","lv":2,"sc":"Invocazione di 2º livello (Mago, Stregone, Warlock)","cl":"Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, M (pelo di pipistrello e un pezzo di carbone)\n**Durata:** concentrazione, fino a 10 minuti\n\nPer la durata dell\u0027incantesimo, un\u0027oscurità magica si estende da un punto entro gittata e riempie una sfera del raggio di 4,5 metri. Una creatura dotata di scurovisione non è in grado di vedere attraverso di essa e la luce non magica non può illuminarla. In alternativa, l\u0027incantatore lancia l\u0027incantesimo su un oggetto che non sia indossato o trasportato, facendo sì che l\u0027oscurità riempia un\u0027emanazione di 4,5 metri di cui l\u0027oggetto è il punto di origine. Coprire l\u0027oggetto con qualcosa di opaco, come una ciotola o un elmo, blocca l\u0027oscurità.\n\nSe una parte dell\u0027area di questo incantesimo si sovrappone a un\u0027area di luce intensa o luce fioca creata da un incantesimo di 2º livello o inferiore, l\u0027incantesimo che ha creato la luce viene dissolto."},{"n":"Palla di fuoco","lv":3,"sc":"Invocazione di 3º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 45 metri\n**Componenti:** V, S, M (una pallina di guano di pipistrello e zolfo)\n**Durata:** istantanea\n\nUna scia di luce brillante parte dall\u0027incantatore e sfreccia fino a un punto a sua scelta entro gittata, provocando un\u0027esplosione infuocata con un profondo boato. Ogni creatura presente in una sfera dal raggio di 6 metri e centrata su quel punto deve effettuare un tiro salvezza su Destrezza, subendo 8d6 danni da fuoco in caso di fallimento, o la metà dei danni in caso di successo.\n\nGli oggetti infiammabili nell\u0027area che non sono indossati o trasportati iniziano a bruciare.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d6 per ogni slot di livello superiore al 3º."},{"n":"Palla di fuoco ritardata","lv":7,"sc":"Invocazione di 7º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 45 metri\n**Componenti:** V, S, M (una pallina di guano di pipistrello e zolfo)\n**Durata:** concentrazione, fino a 1 minuto\n\nUn raggio di luce gialla si sprigiona dall\u0027incantatore per poi condensarsi in un punto a sua scelta entro gittata, formando una sfera scintillante che permane per la durata dell\u0027incantesimo. Al termine dell\u0027incantesimo, la sfera esplode e ogni creatura all\u0027interno di una sfera del raggio di 6 metri centrata su quel punto effettua un tiro salvezza su Destrezza. In caso di fallimento, la creatura subisce una quantità di danni da fuoco pari al totale dei danni accumulati, o la metà dei danni in caso di successo.\n\nI danni base dell\u0027incantesimo sono pari a 12d6 e aumentano di 1d6 ogni volta che termina il turno dell\u0027incantatore e l\u0027incantesimo è ancora attivo. Se una creatura tocca la sfera scintillante prima del termine dell\u0027incantesimo, effettua un tiro salvezza su Destrezza. In caso di fallimento, l\u0027incantesimo termina, causando l\u0027esplosione della sfera. In caso di successo, la creatura può lanciare la sfera fino a una distanza di 12 metri: se entra nello spazio di una creatura o si scontra con un oggetto solido, l\u0027incantesimo termina, facendo esplodere la sfera. Quando la sfera esplode, gli oggetti infiammabili all\u0027interno dell\u0027esplosione che non sono indossati o trasportati iniziano a bruciare.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni base aumentano di 1d6 per ogni slot di livello superiore al 7º."},{"n":"Parlare con gli animali","lv":1,"sc":"Divinazione di 1º livello (Bardo, Druido, Ranger, Warlock)","cl":"Bardo, Druido, Ranger, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** 10 minuti\n\nPer la durata dell\u0027incantesimo, l\u0027incantatore comprende le bestie e può comunicare verbalmente con loro usando una qualunque abilità dell\u0027azione di Influenza.\n\nNella maggior parte dei casi hanno ben poco da dire su temi che esulano dalla sopravvivenza o dallo spirito di squadra, ma almeno possono fornire informazioni su luoghi e mostri nelle vicinanze, oltre a tutto ciò che hanno notato nel corso dell\u0027ultima giornata."},{"n":"Parlare con i morti","lv":3,"sc":"Necromanzia di 3º livello (Bardo, Chierico, Mago)","cl":"Bardo, Chierico, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 3 metri\n**Componenti:** V, S, M (incenso bruciato)\n**Durata:** 10 minuti\n\nL\u0027incantatore conferisce una parvenza di vita a un cadavere a sua scelta situato entro gittata, permettendogli di rispondere alle domande che gli vengono poste. Il cadavere deve avere la bocca e, se la creatura deceduta era un non morto al momento del trapasso, l\u0027incantesimo fallisce. Fallisce allo stesso modo se il cadavere è già stato il bersaglio di questo incantesimo negli ultimi 10 giorni.\n\nFino al termine dell\u0027incantesimo, l\u0027incantatore può porre al cadavere un massimo di cinque domande. Il cadavere conosce solo quello che sapeva in vita, incluse le lingue. Generalmente, le risposte sono brevi, criptiche o ripetitive e il cadavere non è obbligato a offrirne una sincera se l\u0027incantatore gli è ostile o se il cadavere lo riconosce come nemico. Questo incantesimo non riporta l\u0027anima della creatura nel suo corpo, solamente lo spirito animante. Perciò il cadavere non può apprendere nuove informazioni, non conosce nulla di ciò che è accaduto dopo la sua morte e non può speculare sugli eventi futuri."},{"n":"Parlare con i vegetali","lv":3,"sc":"Trasmutazione di 3º livello (Bardo, Druido, Ranger)","cl":"Bardo, Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** 10 minuti\n\nL\u0027incantatore infonde nei vegetali in un\u0027emanazione fissa di 9 metri una parvenza di animazione e volontà, donando loro l\u0027abilità di comunicare con lui e di seguire dei comandi semplici. Può interrogare i vegetali sugli eventi avvenuti nell\u0027area dell\u0027incantesimo nella giornata passata, ottenere informazioni riguardo alle creature transitate al suo interno, al clima e ad altre circostanze. Per la durata dell\u0027incantesimo, l\u0027incantatore può anche trasformare un terreno difficile a causa della crescita vegetale (come per esempio arbusti e sottobosco) in un terreno normale. In alternativa può trasformare un terreno normale dove siano presenti dei vegetali in un terreno difficile. L\u0027incantesimo non consente alle piante di sradicarsi e deambulare, ma permette loro di muovere rami, rampicanti e viticci per l\u0027incantatore. Se una creatura vegetale si trova nell\u0027area, il personaggio può comunicarci come se entrambi condividessero una lingua comune."},{"n":"Parola del potere guarire","lv":9,"sc":"Ammaliamento di 9º livello (Bardo, Chierico)","cl":"Bardo, Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componente:** V\n**Durata:** istantanea\n\nUn\u0027ondata di energia curativa investe una creatura entro gittata che l\u0027incantatore è in grado di vedere. Il bersaglio recupera tutti i suoi punti ferita. Se la creatura è affascinata, avvelenata, paralizzata, spaventata o stordita, questa condizione termina. Se la creatura è prona, può usare la sua reazione per rialzarsi."},{"n":"Parola del potere stordire","lv":8,"sc":"Ammaliamento di 8º livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V\n**Durata:** istantanea\n\nL\u0027incantatore sconvolge la mente di una creatura situata entro gittata che egli è in grado di vedere. Se il bersaglio possiede 150 punti ferita o meno, è stordito. Altrimenti, la sua velocità è pari a 0 fino all\u0027inizio del turno successivo dell\u0027incantatore. Il bersaglio stordito effettua un tiro salvezza su Costituzione alla fine di ogni suo turno e, se lo supera, pone fine alla condizione."},{"n":"Parola del potere uccidere","lv":9,"sc":"Ammaliamento di 9º livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componente:** V\n**Durata:** istantanea\n\nL\u0027incantatore costringe una creatura entro gittata che egli è in grado di vedere a morire. Se il bersaglio possiede 100 punti ferita o meno, muore. Altrimenti, subisce 12d12 danni psichici."},{"n":"Parola del ritiro","lv":6,"sc":"Evocazione di 6º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 1,5 metri\n**Componenti:** V\n**Durata:** istantanea\n\nL\u0027incantatore e un massimo di cinque creature consenzienti entro 1,5 metri da lui si teletrasportano immediatamente in un santuario indicato in precedenza. L\u0027incantatore e le creature che si teletrasportano con lui appaiono nello spazio libero più vicino al punto indicato dall\u0027incantatore quando ha preparato il suo santuario (vedi di seguito). Se lancia questo incantesimo senza prima preparare un santuario, l\u0027incantesimo non ha effetto.\n\nDeve designare un luogo (come un tempio o un santuario) lanciando lì l\u0027incantesimo."},{"n":"Parola divina","lv":7,"sc":"Invocazione di 7º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** 9 metri\n**Componenti:** V\n**Durata:** istantanea\n\nL\u0027incantatore pronuncia una parola pervasa di potere dei Piani Superiori. Ogni creatura a sua scelta situata entro gittata effettua una tiro salvezza su Carisma. In caso di fallimento, un bersaglio che ha 50 punti ferita o meno subisce un effetto basato sui suoi punti ferita attuali, come indicato nella tabella Effetti della parola divina. Indipendentemente dai suoi punti ferita, un bersaglio celestiale, elementale, folletto o immondo che fallisce il suo tiro salvezza viene respinto sul suo piano d\u0027origine (se non vi si trova già) e non può ritornare sul piano attuale per 24 ore in alcun modo se non tramite un incantesimo desiderio.\n\nEffetti della parola divina\nPunti\nferita Effetto\n0–20 Il bersaglio muore.\n21–30 Il bersaglio è accecato, assordato e stordito per 1 ora.\n31–40 Il bersaglio è accecato e assordato per\n10 minuti.\n41–50 Il bersaglio è assordato per 1 minuto."},{"n":"Parola guaritrice","lv":1,"sc":"Abiurazione di 1º livello (Bardo, Chierico, Druido)","cl":"Bardo, Chierico, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** 18 metri\n**Componenti:** V\n**Durata:** istantanea\n\nUna creatura scelta dall\u0027incantatore entro gittata e che egli è in grado di vedere recupera un ammontare di punti ferita pari a 2d4 più il modificatore di caratteristica da incantatore dell\u0027incantatore.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La guarigione aumenta di 2d4 per ogni slot di livello superiore al 1º."},{"n":"Parola guaritrice di massa","lv":3,"sc":"Abiurazione di 3º livello (Bardo, Chierico)","cl":"Bardo, Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** 18 metri\n**Componenti:** V\n**Durata:** istantanea\n\nFino a sei creature a scelta dall\u0027incantatore entro gittata e che egli è in grado di vedere recuperano un ammontare di punti ferita pari a 2d4 più il modificatore di caratteristica da incantatore dell\u0027incantatore.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La guarigione aumenta di 1d4 per ogni slot di livello superiore al 3º."},{"n":"Passapareti","lv":5,"sc":"Trasmutazione di 5º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S, M (un pizzico di semi di sesamo)\n**Durata:** 1 ora\n\nL\u0027incantatore sceglie un punto entro gittata e che egli è in grado di vedere su una superficie di legno, pietra o intonaco (come una parete, un soffitto o un pavimento), dove si apre un passaggio che permane per la durata dell\u0027incantesimo. L\u0027incantatore sceglie inoltre le dimensioni dell\u0027apertura, che non possono superare una larghezza di 1,5 metri, un\u0027altezza di 2,4 metri e una profondità di 6 metri. Il passaggio non crea alcuna instabilità nella struttura che lo circonda. Quando l\u0027apertura scompare, qualsiasi creatura o oggetto all\u0027interno del passaggio creato dall\u0027incantesimo viene espulso senza subire danni nello spazio libero più vicino alla superficie su cui l\u0027incantesimo è stato lanciato."},{"n":"Passare senza tracce","lv":2,"sc":"Abiurazione di 2º livello (Druido, Ranger)","cl":"Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (ceneri di vischio bruciato)\n**Durata:** concentrazione, fino a 1 ora\n\nL\u0027incantatore irradia un\u0027aura occultante in un\u0027emanazione di 9 metri per la durata dell\u0027incantesimo. Finché si trovano nell\u0027aura, l\u0027incantatore e ogni creatura a sua scelta ricevono un bonus di +10 alle prove di Destrezza (Furtività) e non lasciano tracce."},{"n":"Passo velato","lv":2,"sc":"Evocazione di 2º livello (Mago, Stregone, Warlock)","cl":"Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** incantatore\n**Componenti:** V\n**Durata:** istantanea\n\nL\u0027incantatore è avvolto per un istante da una foschia argentata e si teletrasporta di un massimo di 9 metri fino a uno spazio libero che è in grado di vedere."},{"n":"Passo veloce","lv":1,"sc":"Trasmutazione di 1º livello (Bardo, Druido, Mago, Ranger)","cl":"Bardo, Druido, Mago, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (un pizzico di terriccio)\n**Durata:** 1 ora\n\nL\u0027incantatore tocca una creatura, la cui velocità aumenta di 3 metri fino al termine dell\u0027incantesimo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 1º."},{"n":"Paura","lv":3,"sc":"Illusione di 3º livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (una piuma bianca)\n**Durata:** concentrazione, fino a 1 minuto\n\nOgni creatura entro un cono di 9 metri deve superare un tiro salvezza su Saggezza, altrimenti lascia cadere ciò che tiene in mano e diventa spaventata per la durata dell\u0027incantesimo.\n\nUna creatura spaventata effettua l\u0027azione di Scatto e si muove a ogni suo turno per allontanarsi dall\u0027incantatore lungo il percorso più sicuro possibile, sempre che abbia lo spazio per muoversi. Se la creatura termina il suo turno in uno spazio dove l\u0027incantatore non è in vista, effettua un tiro salvezza su Saggezza. In caso di successo, l\u0027incantesimo termina."},{"n":"Pelle coriacea","lv":2,"sc":"Trasmutazione di 2º livello (Druido, Ranger)","cl":"Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** contatto\n**Componente:** V, S, M (un pezzo di corteccia)\n**Durata:** 1 ora\n\nL\u0027incantatore tocca una creatura consenziente. Fino al termine dell\u0027incantesimo, la pelle del bersaglio assume l\u0027aspetto della corteccia. Inoltre, il bersaglio ha una Classe Armatura di 17 se la sua CA è inferiore a tale valore."},{"n":"Pelle di pietra","lv":4,"sc":"Trasmutazione di 4º livello (Druido, Mago, Ranger, Stregone)","cl":"Druido, Mago, Ranger, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (polvere di diamante del valore di 100 mo o più, che l\u0027incantesimo consuma)\n**Durata:** concentrazione, fino a 1 ora\n\nFino al termine dell\u0027incantesimo, una creatura consenziente toccata dall\u0027incantatore avrà resistenza a danni contundenti, perforanti e taglienti."},{"n":"Piaga degli insetti","lv":5,"sc":"Evocazione di 5º livello (Chierico, Druido, Stregone)","cl":"Chierico, Druido, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 90 metri\n**Componenti:** V, S, M (una locusta)\n**Durata:** concentrazione, fino a 10 minuti\n\nUno sciame di locuste riempie una sfera del raggio di 6 metri centrata su un punto a scelta dell\u0027incantatore situato entro gittata. La sfera permane per la durata dell\u0027incantesimo, la sua area è leggermente oscurata e lo spazio al suo interno è considerato terreno difficile.\n\nQuando lo sciame compare, ogni creatura al suo interno effettua un tiro salvezza su Costituzione, subendo 4d10 danni perforanti in caso di fallimento, o la metà dei danni in caso di successo. Inoltre, una creatura effettua questo tiro salvezza anche quando entra nell\u0027area dell\u0027incantesimo per la prima volta in un turno o quando vi termina il suo turno. Una creatura effettua questo tiro salvezza solo una volta per turno.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d10 per ogni slot di livello superiore al 5º."},{"n":"Porta dimensionale","lv":4,"sc":"Evocazione di 4º livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 150 metri\n**Componenti:** V\n**Durata:** istantanea\n\nL\u0027incantatore si teletrasporta in un punto entro gittata arrivando precisamente nel luogo desiderato, che può essere un punto che è in grado di vedere, che riesce a visualizzare o che è in grado di descrivere dichiarandone la distanza e la direzione, come per esempio \"60 metri in linea retta verso il basso\" o \"90 metri verso nord-ovest, a un\u0027angolazione ascendente di 45 gradi\".\n\nL\u0027incantatore può anche teletrasportare una creatura consenziente. Prima che si teletrasporti, la creatura deve trovarsi entro 1,5 metri dall\u0027incantatore, per poi teletrasportarsi in uno spazio entro 1,5 metri dalla destinazione dell\u0027incantatore. Se l\u0027incantatore, l\u0027altra creatura o entrambi arrivano in uno spazio occupato da una creatura o riempito completamente da uno o più oggetti, l\u0027incantatore e qualsiasi creatura che viaggia con lui subiscono 4d6 danni da forza e il teletrasporto fallisce."},{"n":"Portale","lv":9,"sc":"Evocazione di 9º livello (Chierico, Mago, Stregone, Warlock)","cl":"Chierico, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (un diamante del valore di 5.000 mo o più)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore evoca un portale che collega uno spazio libero entro gittata che egli è in grado di vedere a un luogo preciso su un piano di esistenza differente. Il portale è un\u0027apertura circolare, del diametro variabile tra 1,5 e 6 metri a scelta dell\u0027incantatore e può essere orientato in qualsiasi direzione. Il portale permane per la durata dell\u0027incantesimo e la sua destinazione è visibile attraverso di esso. Il portale ha un lato anteriore e un lato posteriore su ogni piano dove appare e i viaggi sono possibili solo attraversandolo dalla parte anteriore. Tutto ciò che lo attraversa è trasportato immediatamente sull\u0027altro piano, apparendo nello spazio libero più vicino al portale.\n\nDivinità e altri sovrani planari possono impedire che i portali creati tramite questo incantesimo si aprano in loro presenza o nei loro domini.\n\nQuando lancia questo incantesimo, l\u0027incantatore può pronunciare il nome di una creatura specifica (pseudonimi, titoli o soprannomi non funzionano). Se la creatura nominata si trova su un piano diverso da quello in cui si trova l\u0027incantatore, il portale si apre nelle immediate vicinanze della creatura, trasportandola fino allo spazio libero più vicino sul lato del portale in cui si trova l\u0027incantatore. L\u0027incantatore non ottiene alcun potere speciale sulla creatura, che è libera di agire come il GM ritiene più appropriato: potrebbe andarsene, attaccarlo o aiutarlo."},{"n":"Preghiera di guarigione","lv":2,"sc":"Abiurazione di 2º livello (Chierico, Paladino)","cl":"Chierico, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** 9 metri\n**Componenti:** V\n**Durata:** istantanea\n\nFino a cinque creature a scelta dell\u0027incantatore, situate entro gittata per l\u0027intera durata del lancio dell\u0027incantesimo, ottengono i benefici di un riposo breve e recuperano 2d8 punti ferita. Una creatura non può essere nuovamente influenzata da questo incantesimo fino a che non completa un riposo lungo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La guarigione aumenta di 1d8 per ogni slot di livello superiore al 2º."},{"n":"Presagio","lv":2,"sc":"Divinazione di 2º livello (Chierico, Druido, Mago)","cl":"Chierico, Druido, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto o rituale\n**Gittata:** incantatore\n**Componenti:** V, S, M (bastoncini, ossa, carte o altri oggetti da divinazione dotati di contrassegni speciali, del valore di 25 mo o più)\n**Durata:** istantanea\n\nL\u0027incantatore riceve un presagio da un\u0027entità ultraterrena sui risultati di un corso d\u0027azione che intende effettuare nei prossimi 30 minuti. Il GM sceglie il presagio dalla tabella Presagi.\n\nPresagi\nPresagio Con risultati...\nVentura Positivi\nSventura Negativi\nVentura e sventura Positivi e negativi\nIndifferenza Né positivi né negativi\n\nL\u0027incantesimo non tiene conto delle circostanze, come altri incantesimi, che potrebbero modificare i risultati.\n\nSe l\u0027incantatore lancia l\u0027incantesimo più volte prima di completare un riposo lungo, esiste una probabilità cumulativa del 25% di non ottenere risposta per ogni lancio dopo il primo."},{"n":"Prestidigitazione","lv":0,"sc":"Trucchetto di Trasmutazione (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 3 metri\n**Componenti:** V, S\n**Durata:** fino a 1 ora\n\nL\u0027incantatore crea un effetto magico entro gittata, scegliendolo tra quelli illustrati di seguito. Se l\u0027incantatore lancia questo incantesimo più volte, può tenere attivi fino a tre dei suoi effetti non istantanei contemporaneamente.\n\n**Effetto sensoriale.** L\u0027incantatore crea un effetto sensoriale innocuo e istantaneo, come una pioggia di scintille, una folata di vento, una tenue melodia musicale o uno strano odore.\n\n**Trucchetto col fuoco.** L\u0027incantatore accende o spegne istantaneamente una candela, una torcia o un piccolo fuoco da campo.\n\n**Pulire o sporcare.** L\u0027incantatore pulisce o sporca istantaneamente un oggetto non più grande di un cubo con spigolo di 30 centimetri.\n\n**Lieve sensazione.** L\u0027incantatore riscalda, raffredda o condisce materiale non vivente del volume massimo di un cubo con spigolo di 30 centimetri per 1 ora.\n\n**Segno magico.** L\u0027incantatore fa comparire un colore, un piccolo segno o un simbolo su un oggetto o una superficie per 1 ora.\n\n**Creazione minore.** L\u0027incantatore crea un monile non magico o un\u0027immagine illusoria che può stare nel palmo della sua mano e che permane fino al termine del suo turno successivo. Un monile non può infliggere danni e non ha valore monetario."},{"n":"Previsione","lv":9,"sc":"Divinazione di 9º livello (Bardo, Druido, Mago, Warlock)","cl":"Bardo, Druido, Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** contatto\n**Componenti:** V, S, M (una piuma di colibrì)\n**Durata:** 8 ore\n\nL\u0027incantatore tocca una creatura consenziente e le conferisce una capacità limitata di vedere nell\u0027immediato futuro. Per la durata dell\u0027incantesimo, il bersaglio dispone di vantaggio alle prove con d20. Inoltre, le altre creature subiscono svantaggio ai tiri per colpire contro di esso. L\u0027incantesimo termina in anticipo se l\u0027incantatore lo lancia di nuovo."},{"n":"Produrre fiamma","lv":0,"sc":"Trucchetto di Evocazione (Druido)","cl":"Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** 10 minuti\n\nUna fiamma tremolante compare nella mano dell\u0027incantatore e permane per la durata dell\u0027incantesimo. La fiamma non emette calore e non può incendiare nulla; emana luce intensa in un raggio di 6 metri e luce fioca per ulteriori 6 metri. L\u0027incantesimo termina se l\u0027incantatore lo lancia di nuovo.\n\nFino al termine dell\u0027incantesimo, l\u0027incantatore può effettuare un\u0027azione di Magia per scagliare la fiamma contro una creatura o un oggetto a 18 metri da lui, effettuando un attacco a distanza con incantesimo. Se il colpo va a segno, il bersaglio subisce 1d8 danni da fuoco.\n\n**Trucchetto potenziato.** I danni di questo incantesimo aumentano di 1d8 quando l\u0027incantatore raggiunge il 5º livello (2d8), l\u002711º livello (3d8) e il 17º livello (4d8)."},{"n":"Proibizione","lv":6,"sc":"Abiurazione di 6º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 10 minuti o rituale\n**Gittata:** contatto\n**Componenti:** V, S, M (polvere di rubino del valore di 1.000 mo o più)\n**Durata:** 1 giorno\n\nL\u0027incantatore crea una difesa contro i viaggi magici che protegge un\u0027area quadrata di terreno con lato di 60 metri e un\u0027altezza di massimo 9 metri. Per la durata dell\u0027incantesimo, per entrare in tale area le creature non possono utilizzare teletrasporto o portali, come quelli creati dall\u0027incantesimo portale. L\u0027incantesimo protegge l\u0027area dai viaggi planari, impedendo perciò alle creature di accedervi tramite il Piano Astrale, il Piano Etereo, la Selva Fatata, la Coltre Oscura e l\u0027incantesimo spostamento planare.\n\nInoltre, infligge danni a uno o più tipi di creature indicati dall\u0027incantatore al momento del lancio, scelti tra i seguenti: aberrazioni, celestiali, elementali, folletti, immondi e non morti. Quando una creatura del tipo scelto entra nell\u0027area dell\u0027incantesimo per la prima volta in un turno o termina il suo turno qui, subisce 5d10 danni necrotici o radiosi (a scelta dell\u0027incantatore al momento del lancio).\n\nQuando lancia l\u0027incantesimo, l\u0027incantatore può indicare una parola d\u0027ordine: una creatura che la pronuncia accedendo all\u0027area non subisce danni. L\u0027area di questo incantesimo non può sovrapporsi all\u0027area di un altro incantesimo proibizione. Se l\u0027incantatore lancia proibizione ogni giorno nello stesso luogo per 30 giorni, l\u0027incantesimo permane finché non viene dissolto e le componenti materiali vengono consumate al momento dell\u0027ultimo lancio."},{"n":"Proiezione astrale","lv":9,"sc":"Necromanzia di 9º livello (Chierico, Mago, Warlock)","cl":"Chierico, Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 ora\n**Gittata:** 3 metri\n**Componenti:** V, S, M (per ogni bersaglio dell\u0027incantesimo, l\u0027incantatore deve possedere un giacinto del valore di 1.000 mo o più e un lingotto d\u0027argento del valore di 100 mo o più; l\u0027incantesimo consuma entrambi)\n**Durata:** finché non viene dissolto\n\nL\u0027incantatore e un massimo di otto creature consenzienti entro gittata proiettano i loro corpi astrali sul Piano Astrale (l\u0027incantesimo termina immediatamente se l\u0027incantatore si trova già su quel piano). Il corpo di ogni bersaglio cade in uno stato di animazione sospesa; ha la condizione privo di sensi, non ha bisogno di cibo o aria e non invecchia. La forma astrale di un bersaglio assomiglia in tutto e per tutto al suo corpo, replicando le sue statistiche di gioco e le sue proprietà. La differenza principale consiste nell\u0027aggiunta di un cordone argentato che si snoda tra le scapole della forma astrale, diventando invisibile dopo 30 cm. Se il cordone viene reciso, cosa che può accadere solo quando un effetto lo specifica chiaramente, il corpo e la forma astrale del bersaglio muoiono entrambi. La forma astrale di un bersaglio può viaggiare sul Piano Astrale. Nel momento in cui una forma astrale lascia questo piano, il corpo e le proprietà del bersaglio vengono trasportati lungo il cordone argentato, permettendogli di rientrare nel suo corpo nel momento in cui accede al nuovo piano.\n\nQualsiasi danno o altro effetto che si applichi a una forma astrale non ha effetto sul corpo del bersaglio e viceversa. Inoltre, l\u0027incantesimo termina se il corpo originale o la forma astrale di un bersaglio scende a 0 punti ferita. L\u0027incantesimo termina per tutti i bersagli se l\u0027incantatore effettua un\u0027azione di Magia per interromperlo.\n\nQuando l\u0027incantesimo termina per un bersaglio che non è morto, il bersaglio riappare nel suo corpo ed esce dallo stato di animazione sospesa."},{"n":"Protezione dai veleni","lv":2,"sc":"Abiurazione di 2º livello (Chierico, Druido, Paladino, Ranger)","cl":"Chierico, Druido, Paladino, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S\n**Durata:** 1 ora\n\nL\u0027incantatore tocca una creatura e pone fine alla condizione avvelenato che la affligge. Per la durata dell\u0027incantesimo, il bersaglio dispone di vantaggio ai tiri salvezza eseguiti per evitare o terminare la condizione avvelenato, ed è resistente ai danni da veleno."},{"n":"Protezione dal bene e dal male","lv":1,"sc":"Abiurazione di 1º livello (Chierico, Druido, Mago, Paladino, Warlock)","cl":"Chierico, Druido, Mago, Paladino, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (un\u0027ampolla di acqua santa del valore di 25 mo o più, che l\u0027incantesimo consuma)\n**Durata:** concentrazione, fino a 10 minuti\n\nFino al termine dell\u0027incantesimo, una creatura consenziente toccata dall\u0027incantatore è protetta da certi tipi di creature: aberrazioni, celestiali, elementali, folletti, immondi o non morti. La protezione garantisce diversi vantaggi. Le creature contro cui è attiva subiscono svantaggio ai tiri per colpire indirizzati contro il bersaglio; inoltre, il bersaglio non può essere affascinato, spaventato o posseduto da creature analoghe. Se il bersaglio è già affascinato, spaventato o posseduto da una tale creatura, dispone di vantaggio a qualsiasi nuovo tiro salvezza contro il relativo effetto."},{"n":"Protezione dall\u0027energia","lv":3,"sc":"Abiurazione di 3º livello (Chierico, Druido, Mago, Ranger, Stregone)","cl":"Chierico, Druido, Mago, Ranger, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 ora\n\nPer la durata dell\u0027incantesimo, una creatura consenziente toccata dall\u0027incantatore dispone di resistenza a un tipo di danni a scelta di quest\u0027ultimo: acido, freddo, fulmine, fuoco o tuono."},{"n":"Punizione divina","lv":1,"sc":"Invocazione di 1º livello (Paladino)","cl":"Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus che l\u0027incantatore effettua subito dopo aver colpito un bersaglio con un\u0027arma da mischia o con un colpo senz\u0027armi\n**Gittata:** incantatore\n**Componente:** V\n**Durata:** istantanea\n\nIl bersaglio subisce 2d8 danni radiosi extra dall\u0027attacco. I danni aumentano di 1d8 se il bersaglio è un immondo o un non morto.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 1º."},{"n":"Punizione incandescente","lv":1,"sc":"Invocazione di 1º livello (Paladino)","cl":"Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus che l\u0027incantatore effettua subito dopo aver colpito un bersaglio con un\u0027arma da mischia o con un colpo senz\u0027armi\n**Gittata:** incantatore\n**Componente:** V\n**Durata:** 1 minuto\n\nQuando l\u0027incantatore colpisce il bersaglio, esso subisce 1d6 danni da fuoco extra dall\u0027attacco. All\u0027inizio di ogni suo turno fino al termine dell\u0027incantesimo, il bersaglio subisce 1d
