Inoltre, quando lanci _scudo della fede_ con Protettore Devoto, il bersaglio ottiene PF temporanei pari al tuo modificatore di Saggezza + metà del tuo livello da Giurato."},{"lv":14,"n":"Presagio Sicuro","md":"Quando ottieni un Presagio di Marea, invece di tirare puoi scegliere la fase che vuoi."},{"lv":18,"n":"Devozione Incrollabile","md":"La concentrazione su uno _scudo della fede_ lanciato con Protettore Devoto non si interrompe per i danni che subisci, e il bonus alla CA che dà diventa +3."},{"lv":19,"n":"Dono Epico","md":"Ottieni un talento Dono Epico, o un altro talento a tua scelta di cui soddisfi i requisiti."},{"lv":20,"n":"Il Volto di Selenar","md":"Con un\u0027azione bonus lasci che la luna ti entri in faccia. Per 1 minuto:\n- emani luce intensa in un raggio di 9 m e luce fioca per altri 9 m, e chiunque si trovi in quella luce conta come _sotto la luna_;\n- _Tocco di Selenite_ si applica a ogni creatura che colpisci, non soltanto alla prima;\n- le aberrazioni, gli immondi e i non morti nella tua luce intensa hanno svantaggio ai tiri salvezza contro i tuoi incantesimi e contro _Tocco di Selenite_;\n- all\u0027inizio di ognuno dei tuoi turni recuperi 10 PF.\n\nPuoi farlo una volta, e recuperi l\u0027uso al termine di un riposo lungo, oppure spendendo uno slot incantesimo di 5° livello.\n\n---"}],"sott":[{"n":"Giuramento della Luna Nuova","md":"_Giurati che hanno scelto la faccia della luna che non si vede. Combattono in prima fila contro le cose della Notte, e il loro scudo d\u0027argento, quando lo si colpisce, risponde._\n\n**Incantesimi del giuramento.** 3° livello: _rimprovero infernale_, _Il Volto di Sotto_ · 5°: _arma spirituale_, _Buio di Luna Nuova_ · 9°: _guardiani spirituali_, _Scudo d\u0027Eclisse_ · 13°: _scudo di fuoco_, _Aureola della Madre Pallida_ · 17°: _onda distruttiva_, _Arma di Selenite_.\n\n**3° livello: Lama della Luna Nera.** Ottieni la competenza in tutte le armi da guerra e il trucchetto _Globo d\u0027Eclisse_. Inoltre, finché sei sotto lo _scudo della fede_ lanciato con Protettore Devoto, quando una creatura ti colpisce con un attacco in mischia puoi usare la reazione per infliggerle danni radianti pari a 1d8 + il tuo modificatore di Saggezza.\n\n**7° livello: Luna Spietata.** I tuoi attacchi con le armi contro le aberrazioni, gli immondi e i non morti sono colpi critici con un 19 o un 20 sul dado.\n\n**11° livello: Bagliore Ustionante.** I danni della reazione di _Lama della Luna Nera_ diventano 2d8 + il tuo modificatore di Saggezza, e chi li subisce ha svantaggio al prossimo tiro per colpire che effettua prima della fine del suo turno successivo.\n\n**15° livello: Rovina della Luna Nuova.** Mentre sei sotto lo _scudo della fede_ lanciato con Protettore Devoto, puoi porvi fine con un\u0027azione bonus: la prossima volta che colpisci con un\u0027arma entro 1 minuto, il colpo infligge 4d10 danni radianti extra, e il bersaglio non può recuperare PF fino all\u0027inizio del tuo turno successivo."},{"n":"Giuramento della Luna Crescente","md":"_Giurati della luna che sale. Viaggiano, chiedono, ascoltano, e sono quasi sempre i primi ad accorgersi che qualcosa non va._\n\n**Incantesimi del giuramento.** 3° livello: _charme su persone_, _Chiarore_ · 5°: _aiuto_, _Coppa della Fortuna_ · 9°: _linguaggi_, _Pozzo di Luna_ · 13°: _occhio arcano_, _Occhio della Luna_ · 17°: _legame telepatico di Rary_, _Patto sotto la Luna_.\n\n**3° livello: Lanterna nella Notte.** Ottieni la competenza in due abilità o strumenti a tua scelta e il trucchetto _guida_. Inoltre, finché uno _scudo della fede_ lanciato con Protettore Devoto è attivo, tu e la creatura che lo porta aggiungete 1 a tutte le prove di caratteristica e ai tiri salvezza.\n\n**7° livello: Luna Esperta.** Scegli due abilità o strumenti in cui sei competente, e ottieni la maestria in essi.\n\n**11° livello: Sentinella d\u0027Argento.** Non puoi essere sorpreso, e aggiungi il tuo modificatore di Saggezza ai tiri per l\u0027iniziativa. Puoi usare _Veglia Devota_ anche quando sei sorpreso o Incapacitato, purché tu sia cosciente.\n\n**15° livello: Esplosione Splendente.** Quando tu o una creatura che vedi entro 9 m effettuate un tiro salvezza, puoi usare la reazione per porre fine a uno _scudo della fede_ lanciato con Protettore Devoto: fino all\u0027inizio del tuo turno successivo, tu e ogni creatura a tua scelta entro 9 m aggiungete il vostro modificatore di Saggezza (il tuo, minimo 1) a tutti i tiri salvezza, compreso quello che ha fatto scattare la reazione."},{"n":"Giuramento della Luna Piena","md":"_Giurati della luna intera. Stanno dove gli altri cadono, e portano a casa chi non riesce a camminare._\n\n**Incantesimi del giuramento.** 3° livello: _scudo_, _Bacio di Selenar_ · 5°: _immagine speculare_, _Canto di Marea_ · 9°: _parola guaritrice di massa_, _Tocco d\u0027Argento_ · 13°: _interdizione alla morte_, _Pelle d\u0027Argento_ · 17°: _Manto di Marea_, _cura ferite di massa_.\n\n**3° livello: Luce di Vita.** Ottieni la competenza nelle armature pesanti e il trucchetto _interdizione alle lame_. Inoltre, quando lanci _scudo della fede_ con Protettore Devoto, il bersaglio ottiene 2d6 + il tuo modificatore di Saggezza PF temporanei, che perde quando lo scudo termina.\n\n**7° livello: Luna Risoluta.** I tuoi PF massimi aumentano di un numero pari al tuo livello da Giurato, e da qui in avanti aumentano di 1 ogni volta che sali di livello in questa classe.\n\n**11° livello: Faro nel Buio.** Mentre sei sotto lo _scudo della fede_ lanciato con Protettore Devoto, puoi usare un\u0027azione bonus e spendere uno slot incantesimo: tu e ogni creatura a tua scelta entro 9 m recuperate PF pari a 1d6 per livello dello slot speso + il tuo modificatore di Saggezza. Puoi farlo una volta per turno.\n\n**15° livello: Vortice di Vita.** Mentre sei sotto lo _scudo della fede_ lanciato con Protettore Devoto, puoi porvi fine con un\u0027azione bonus: ogni creatura a tua scelta entro 9 m recupera 2d8 + il tuo modificatore di Saggezza PF, e tu recuperi il totale dei PF che hanno recuperato gli altri. Puoi farlo una volta, e recuperi l\u0027uso al termine di un riposo lungo."},{"n":"Giuramento della Luna Calante","md":"_Giurati della luna che se ne va. Sono veloci, sfuggenti, e quando passano lasciano dietro di sé gente che non sapeva di essere stata salvata._\n\n**Incantesimi del giuramento.** 3° livello: _camuffare se stesso_, _Scala di Luna_ · 5°: _passo velato_, _Mantello di Luna_ · 9°: _intermittenza_, _Carne di Vetro_ · 13°: _libertà di movimento_, _porta dimensionale_ · 17°: _Comandare la Fase_, _passapareti_.\n\n**3° livello: Foschia Notturna.** Ottieni la competenza in tutte le armi da guerra e il trucchetto _Segno di Selenar_. Inoltre, finché sei sotto lo _scudo della fede_ lanciato con Protettore Devoto, la tua velocità aumenta di 3 m e ignori il terreno difficile.\n\n**7° livello: Luna Sfuggente.** Il primo attacco di opportunità che una creatura effettua contro di te in ogni round ti manca automaticamente.\n\n**11° livello: Ombra sulla Luna.** Finché sei sotto lo _scudo della fede_ lanciato con Protettore Devoto, la tua velocità aumenta di altri 3 m. Inoltre, se nel tuo turno ti sei mosso di almeno 4,5 m prima di attaccare, hai vantaggio al primo tiro per colpire con un\u0027arma che effettui in quel turno.\n\n**15° livello: Velo Purificatore.** Mentre sei sotto lo _scudo della fede_ lanciato con Protettore Devoto, puoi porvi fine con un\u0027azione bonus: ogni creatura a tua scelta entro 9 m pone fine a una condizione che la affligge, tra Accecato, Affascinato, Assordato, Avvelenato, Paralizzato, Spaventato e Stordito.\n\n---"}],"extra":[],"crea":"### Punti Ferita\n- **Dado Vita:** d10 per livello da Giurato.\n- **PF al 1° livello:** 10 + il tuo modificatore di Costituzione.\n- **PF ai livelli successivi:** 1d10 (o 6) + il tuo modificatore di Costituzione.\n\n### Competenze\n- **Tiri salvezza:** Forza, Saggezza.\n- **Abilità:** due a scelta tra Arcano, Indagare, Intimidire, Intuizione, Medicina, Persuasione, Religione e Storia.\n- **Armi:** armi semplici, e armi da guerra con la proprietà Accurata o Leggera.\n- **Armature:** armature leggere e medie, scudi.\n- **Strumenti:** Kit da Erborista oppure strumenti da alchimista.\n\n### Equipaggiamento iniziale\nScegli A o B. **(A)** corazza di scaglie, scudo con la faccia d\u0027argento, lancia, 4 giavellotti, dotazione da sacerdote, simbolo sacro di Selenar (una conchiglia legata con nove nodi), 9 mo; **(B)** 150 mo.\n\n### Multiclasse\nServono Forza 13 e Saggezza 13. Al primo livello da Giurato ottieni i PF di un livello successivo e la competenza nelle armature leggere e medie, negli scudi e nelle armi da guerra Accurate o Leggere. Per gli slot incantesimo, il Giurato conta come metà dei suoi livelli, arrotondando per eccesso, come il Paladino e il Ranger.\n\n---"},{"n":"Pallido","dv":8,"ts":["FOR","COS"],"tab":{"h":["Livello","Bonus Comp.","Morso","Sorsi massimi","Doni della Notte","Privilegi di Classe"],"r":[["1°","+2","1d4","—","2","Il Morso, Doni della Notte, Figlio della Notte, Maestria nelle Armi"],["2°","+2","1d4","2","2","La Sete, Fiuto del Sangue"],["3°","+2","1d4","3","3","Sentiero Oscuro, Cuore di Tenebra"],["4°","+2","1d4","4","3","Aumento dei Punteggi di Caratteristica"],["5°","+3","1d6","5","4","Attacco Extra"],["6°","+3","1d6","6","4","Privilegio del Sentiero"],["7°","+3","1d6","7","4","Resilienza Vermiglia"],["8°","+3","1d6","8","5","Aumento dei Punteggi di Caratteristica"],["9°","+4","1d6","9","5","Anima di Tenebra"],["10°","+4","1d8","10","6","Privilegio del Sentiero"],["11°","+4","1d8","11","6","Sorso Rubato"],["12°","+4","1d8","12","6","Aumento dei Punteggi di Caratteristica"],["13°","+5","1d8","13","6","La Maschera della Bestia"],["14°","+5","1d8","14","6","Privilegio del Sentiero, Resilienza Vermiglia (II)"],["15°","+5","1d10","15","7","—"],["16°","+5","1d10","16","7","Aumento dei Punteggi di Caratteristica"],["17°","+6","1d10","17","7","Signore della Notte"],["18°","+6","1d10","18","7","Equilibrio del Sangue"],["19°","+6","1d10","19","8","Dono Epico"],["20°","+6","1d12","20","8","Apoteosi della Bestia"]]},"priv":[{"lv":1,"n":"Il Morso","md":"Non puoi più nutrirti di altro che di sangue fresco, e ti sono cresciuti i denti per prenderlo. Quando effettui un colpo senz\u0027armi contro una creatura che ha sangue, puoi mordere invece di colpire. Il **Morso** usa la Forza o la Destrezza, a tua scelta, per il tiro per colpire e per i danni, e infligge danni perforanti pari al dado indicato dalla tabella + il modificatore scelto.\n\nPuoi mordere soltanto se hai vantaggio al tiro per colpire, oppure se il bersaglio è Afferrato da te, Prono o Incapacitato. Quando il Morso colpisce, ottieni PF temporanei pari ai danni inflitti. Se il bersaglio è un\u0027aberrazione, un immondo o un non morto, il suo sangue ti fa male, e sei Avvelenato fino alla fine del tuo turno successivo."},{"lv":1,"n":"Doni della Notte","md":"Ti stanno spuntando i poteri di cui parlano le storie. Scegli due **Doni** dalla lista in fondo ai privilegi di classe, e ne scegli altri ai livelli indicati dalla tabella. Molti Doni si possono scegliere più volte, e ogni volta si rafforzano; il secondo grado di un Dono richiede il 5° livello, il terzo il 9°. Quando sali di livello puoi sostituire un Dono con un altro."},{"lv":1,"n":"Figlio della Notte","md":"Hai scurovisione entro 18 m, o la tua scurovisione aumenta di 18 m. Non hai bisogno di respirare. Ma la luna ti conosce, e tiene il conto di quello che prendi:\n- **In luna piena** non puoi entrare in una casa abitata senza che qualcuno che ci vive ti abbia invitato. Un invito basta per sempre.\n- **In luna piena**, quando tu o il bersaglio di una tua azione siete nella luce diretta della luna, hai svantaggio ai tiri per colpire e alle prove di Saggezza (Percezione) basate sulla vista. Questo svantaggio non si applica se tutto il sangue che hai bevuto dal tuo ultimo riposo lungo ti è stato **dato**, da una creatura consenziente che sapeva che cosa stava facendo."},{"lv":1,"n":"Maestria nelle Armi","md":"Puoi usare le proprietà di maestria di due tipi di armi semplici o da guerra a tua scelta, in cui sei competente. Al termine di un riposo lungo puoi cambiare i tipi scelti."},{"lv":2,"n":"La Sete","md":"Il sangue che bevi non ti nutre soltanto: si accumula, e lo puoi spendere. Lo misuri in **Sorsi**, e ne puoi avere al massimo quanti ne indica la tabella.\n- **Bere.** Ottieni un Sorso ogni volta che il Morso colpisce una creatura che ha sangue.\n- **Donatori.** Se durante un riposo breve o lungo bevi da una creatura consenziente, che perde un Dado Vita senza recuperare PF, recuperi tutti i Sorsi fino al massimo.\n- **La fame.** Al termine di un riposo lungo, se non hai bevuto da un donatore durante il riposo, i tuoi Sorsi scendono alla metà del massimo, arrotondando per difetto, o restano quelli che sono se sono già di meno.\n\nI privilegi che spendono Sorsi lo dicono. Non puoi spendere Sorsi che non hai."},{"lv":2,"n":"Fiuto del Sangue","md":"Senti l\u0027odore del sangue che esce. Sai dove si trovano tutte le creature Sanguinanti entro 9 m da te, anche se sono nascoste o Invisibili, purché abbiano sangue."},{"lv":3,"n":"Sentiero Oscuro","md":"Scegli che cosa fare di quello che sei diventato: il **Soldato Scarlatto**, il **Cacciatore Pallido** o il **Mistico della Notte**. Ottieni i privilegi del tuo sentiero al 3°, al 6°, al 10° e al 14° livello."},{"lv":3,"n":"Cuore di Tenebra","md":"Il sangue degli umanoidi ti nutre più di quello delle bestie. Quando il Morso colpisce un umanoide, ottieni due Sorsi invece di uno, e i PF temporanei aumentano del tuo modificatore di Costituzione."},{"lv":4,"n":"Aumento dei Punteggi di Caratteristica","md":"Ottieni il talento Aumento dei Punteggi di Caratteristica, o un altro talento di cui soddisfi i requisiti. Ottieni di nuovo questo privilegio all\u00278°, al 12° e al 16° livello."},{"lv":5,"n":"Attacco Extra","md":"Quando effettui l\u0027azione di Attacco nel tuo turno, puoi attaccare due volte invece di una. Il Morso può essere uno di questi attacchi."},{"lv":7,"n":"Resilienza Vermiglia","md":"Quando scendi a 0 PF senza morire sul colpo, puoi spendere Sorsi per restare a 1 PF. La prima volta ti costa 2 Sorsi, la seconda 4, la terza 8, e il costo raddoppia a ogni uso; torna a 2 al termine di un riposo lungo. Al 14° livello, quando resti a 1 PF in questo modo, ottieni anche PF temporanei pari al tuo livello da Pallido."},{"lv":9,"n":"Anima di Tenebra","md":"Quando fallisci un tiro salvezza, puoi spendere 2 Sorsi per ripeterlo, e devi usare il nuovo risultato."},{"lv":11,"n":"Sorso Rubato","md":"Quando il Morso colpisce, il bersaglio deve superare un tiro salvezza su Costituzione (CD 8 + il tuo bonus di competenza + il tuo modificatore di Costituzione), altrimenti i suoi PF massimi si riducono di un ammontare pari ai danni del Morso, finché non termina un riposo lungo."},{"lv":13,"n":"La Maschera della Bestia","md":"Con un\u0027azione spendi 4 Sorsi e lasci uscire quello che ti porti dentro: assumi la forma del **Predatore della Notte** (vedi sotto) per 1 ora, o finché non torni alla tua forma con un\u0027azione bonus. Mentre sei in questa forma:\n- usi la CA, le velocità, i sensi, la Forza, la Destrezza e le azioni del Predatore, ma tieni i tuoi PF, i tuoi Dadi Vita, il tuo bonus di competenza, Intelligenza, Saggezza e Carisma, le tue abilità e i tuoi privilegi di classe;\n- quando assumi la forma ottieni PF temporanei pari al doppio del tuo livello da Pallido;\n- non puoi lanciare incantesimi, ma puoi mantenere la concentrazione;\n- i tuoi equipaggiamenti cadono a terra o si fondono con la forma, a tua scelta."},{"lv":17,"n":"Signore della Notte","md":"Sei immune alle condizioni Affascinato e Spaventato. Le bestie che vivono di notte, come i lupi, i pipistrelli e i ratti, non ti attaccano mai, a meno che tu non le attacchi per primo."},{"lv":18,"n":"Equilibrio del Sangue","md":"Con un\u0027azione bonus spendi un qualunque numero di Sorsi, e per ognuno recuperi 1d10 + il tuo modificatore di Costituzione PF. Puoi farlo una volta, e recuperi l\u0027uso al termine di un riposo lungo."},{"lv":19,"n":"Dono Epico","md":"Ottieni un talento Dono Epico, o un altro talento a tua scelta di cui soddisfi i requisiti."},{"lv":20,"n":"Apoteosi della Bestia","md":"_La Maschera della Bestia_ non ti costa più Sorsi, e puoi usarla quando vuoi. Inoltre la tua Costituzione aumenta di 2, fino a un massimo di 22.\n\n---\n\n\u003e [!statblock]\n\u003e ### Il Predatore della Notte\n\u003e *Mostruosità Grande*\n\u003e\n\u003e **CA** 15 (armatura naturale)\n\u003e **Velocità** 10,5 m, volare 18 m\n\u003e **FOR** 18 · **DES** 16\n\u003e\n\u003e **Sensi** vista cieca 18 m\n\u003e **Resistenze** contundente, perforante e tagliente da armi non d\u0027argento\n\u003e **Vulnerabilità** radiante\n\u003e\n\u003e Un lupo nero grande come un cavallo, con le ali da pipistrello tese tra le zampe anteriori e il muso spaccato fino alle orecchie. Quando vola non fa rumore, e quando atterra sì.\n\u003e\n\u003e **Fiuto di Sangue.** Hai vantaggio ai tiri per colpire contro le creature che hai Afferrato.\n\u003e\n\u003e **Sensi Acuti.** Hai vantaggio alle prove di Saggezza (Percezione) basate sull\u0027udito e sull\u0027olfatto.\n\u003e\n\u003e **Multiattacco.** Effettui un attacco con gli Artigli e uno con il Morso, oppure, se hai Attacco Extra di un Sentiero o di un\u0027altra classe, il numero di attacchi che quella ti concede, scegliendo tra Artigli e Morso.\n\u003e\n\u003e **Artigli.** *Tiro per colpire in mischia:* il tuo modificatore di Forza + il tuo bonus di competenza, portata 1,5 m. *Colpito:* 2d6 + il tuo modificatore di Forza danni taglienti, e il bersaglio è Afferrato (CD di fuga 8 + il tuo bonus di competenza + il tuo modificatore di Forza).\n\u003e\n\u003e **Morso.** In questa forma il Morso infligge 2d10 + il tuo modificatore di Forza danni perforanti, e funziona come il tuo privilegio _Il Morso_.\n\n---"}],"sott":[{"n":"Il Soldato Scarlatto","md":"_Pallidi che hanno scoperto quanto può diventare forte un corpo che non muore più del tutto, e che lo usano. Combattono corpo a corpo, stringono, mordono, e non lasciano andare._\n\n**3° livello: Corpo da Battaglia.** Ottieni la competenza in tutte le armi da guerra, negli scudi e nelle armature medie. I tuoi PF massimi aumentano di 3, e di 1 ogni volta che sali di livello in questa classe.\n\n**3° livello: Presa Assetata.** Quando, con l\u0027azione di Attacco, usi un colpo senz\u0027armi per afferrare una creatura e ci riesci, puoi subito mordere quella creatura come parte della stessa azione.\n\n**6° livello: Calice del Vigore.** La prima volta in ogni tuo turno che il Morso infligge danni a una creatura che ha sangue, per 1 minuto hai un bonus di +1 alla CA e +2 ai danni dei tuoi attacchi in mischia. L\u0027effetto non si somma con se stesso, ma la durata riparte.\n\n**10° livello: Furia Scarlatta.** Con un\u0027azione bonus spendi 2 Sorsi e lasci che il sangue bevuto ti indurisca la carne. Per 1 minuto hai vantaggio alle prove e ai tiri salvezza su Forza, e finché hai PF temporanei ottenuti dal Morso hai resistenza ai danni contundenti, perforanti e taglienti.\n\n**14° livello: Vigore della Luna di Sangue.** La tua Forza e la tua Costituzione aumentano di 2, fino a un massimo di 22. Inoltre, quando usi _Presa Assetata_, il Morso infligge un dado di danni in più."},{"n":"Il Cacciatore Pallido","md":"_Pallidi che hanno imparato a essere ombra. Non si vedono arrivare. Si sentono soltanto i denti._\n\n**3° livello: Cacciatore Notturno.** Ottieni la competenza in Furtività e in un\u0027altra abilità a tua scelta. La tua scurovisione aumenta di 18 m, e hai vantaggio alle prove di Destrezza (Furtività) per nasconderti in luce fioca o nell\u0027oscurità.\n\n**3° livello: Colpo dal Buio.** Una volta per turno, quando colpisci una creatura con un attacco con vantaggio, le infliggi 1d6 danni extra. I danni extra diventano 2d6 al 6° livello, 3d6 al 10° e 4d6 al 14°.\n\n**6° livello: Imboscata Assetata.** Puoi mordere una creatura Sorpresa anche senza le condizioni del Morso, e se la colpisci il Morso è un colpo critico. Inoltre la tua velocità aumenta di 3 m.\n\n**10° livello: Calice del Terrore.** Quando il Morso colpisce, il bersaglio deve superare un tiro salvezza su Saggezza (CD 8 + il tuo bonus di competenza + il tuo modificatore di Costituzione), altrimenti è Spaventato da te per 1 minuto. Alla fine di ognuno dei suoi turni ripete il tiro salvezza, e se lo supera l\u0027effetto termina e per un giro di campane è immune a questo privilegio.\n\n**14° livello: Acutezza della Luna di Sangue.** La tua Destrezza e la tua Saggezza aumentano di 2, fino a un massimo di 22. Inoltre, nella luce fioca e nell\u0027oscurità, le creature non hanno vantaggio ai tiri per colpire contro di te."},{"n":"Il Mistico della Notte","md":"_Pallidi in cui il sangue ha cominciato a parlare. Gli occhi gli si fanno neri, e la magia gli esce dalle vene come il freddo da una cantina._\n\n**3° livello: Incantesimi del Mistico.** Impari a lanciare incantesimi con il sangue che porti.\n- **Trucchetti.** Conosci due trucchetti a tua scelta tra _illusione minore_, _messaggio_, _mano magica_, _tocco gelido_ e _spruzzo velenoso_.\n- **Slot e incantesimi preparati.** La tabella qui sotto indica quanti incantesimi prepari e quanti slot hai. Prepari gli incantesimi dalla lista del Mistico, e ognuno deve essere di un livello per cui hai slot. Recuperi gli slot al termine di un riposo lungo, e quando sali di livello puoi sostituire un incantesimo preparato con un altro.\n- **Caratteristica da incantatore.** Carisma.\n\n| Livello | Preparati | 1° | 2° | 3° | 4° |\n|:---:|:---:|:---:|:---:|:---:|:---:|\n| 3° | 3 | 2 | — | — | — |\n| 4° | 4 | 3 | — | — | — |\n| 5°–6° | 4 | 3 | — | — | — |\n| 7° | 5 | 4 | 2 | — | — |\n| 8°–9° | 6 | 4 | 2 | — | — |\n| 10° | 7 | 4 | 3 | — | — |\n| 11°–12° | 8 | 4 | 3 | — | — |\n| 13° | 9 | 4 | 3 | 2 | — |\n| 14°–15° | 10 | 4 | 3 | 2 | — |\n| 16°–18° | 11 | 4 | 3 | 3 | — |\n| 19° | 12 | 4 | 3 | 3 | 1 |\n| 20° | 13 | 4 | 3 | 3 | 1 |\n\n**La lista del Mistico.**\n- **1° livello:** _amicizia con gli animali_, _charme su persone_, _comando_, _individuazione del magico_, _camuffare se stesso_, _ritirata rapida_, _vita falsa_, _nube di nebbia_, _parlare con gli animali_, _sonno_.\n- **2° livello:** _alterare se stesso_, _movimento del ragno_, _sfocatura_, _calmare emozioni_, _oscurità_, _individuazione dei pensieri_, _potenziare caratteristica_, _blocca persone_, _invisibilità_, _suggestione_.\n- **3° livello:** _animare morti_, _intermittenza_, _scagliare maledizione_, _chiaroveggenza_, _controincantesimo_, _dissolvi magie_, _paura_, _forma gassosa_, _trama ipnotica_, _anti-individuazione_, _parlare con i morti_, _tocco del vampiro_.\n- **4° livello:** _avvizzimento_, _compulsione_, _confusione_, _libertà di movimento_, _invisibilità superiore_, _terreno illusorio_, _assassino fantasmatico_, _metamorfosi_.\n\n**6° livello: Sangue che Indebolisce.** Quando il Morso colpisce, il bersaglio ha svantaggio al prossimo tiro salvezza contro un tuo incantesimo che effettua entro 1 minuto.\n\n**10° livello: Calice del Potere.** Quando il Morso colpisce, puoi spendere 2 Sorsi per recuperare uno slot incantesimo di 1° o di 2° livello. Puoi farlo un numero di volte pari al tuo modificatore di Costituzione (minimo 1), e recuperi gli usi spesi al termine di un riposo lungo.\n\n**14° livello: Maestà della Luna di Sangue.** La tua Saggezza e il tuo Carisma aumentano di 2, fino a un massimo di 22. Inoltre, quando lanci un incantesimo di 1° livello o superiore, puoi effettuare un Morso come azione bonus, anche senza le condizioni del Morso.\n\n---"}],"extra":[{"t":"I Doni della Notte","md":"| Dono | I grado | II grado (dal 5° livello) | III grado (dal 9° livello) |\n|---|---|---|---|\n| **Grazia Oscura** | Con un\u0027azione bonus, fino alla fine del turno la distanza dei tuoi salti aumenta di 3 m, e non subisci danni da caduta fino a 9 m. | Puoi lanciare _caduta morbida_ a volontà, senza slot. | Puoi lanciare _levitazione_ su te stesso senza slot; recuperi l\u0027uso al termine di un riposo breve o lungo. |\n| **Fascino del Predatore** | Ottieni la competenza in Inganno, Intimidire o Persuasione, o la maestria se ce l\u0027hai già. | Come il I grado, con una seconda abilità. | Come il I grado, con la terza abilità; inoltre puoi lanciare _charme su persone_ senza slot, e recuperi l\u0027uso al termine di un riposo lungo. |\n| **Magnetismo Ferino** | Nelle prove di Saggezza (Addestrare Animali) consideri ogni risultato del d20 inferiore a 8 come un 8. | Puoi lanciare _messaggero animale_ a volontà, senza slot. | Puoi lanciare _amicizia con gli animali_ senza slot; recuperi l\u0027uso al termine di un riposo breve o lungo. |\n| **Corpo di Nebbia** | Quando un attacco con un\u0027arma non magica e non d\u0027argento ti colpisce con danni contundenti o taglienti, puoi usare la reazione per ridurli di 1d10 + il tuo modificatore di Costituzione. | La riduzione vale anche per i danni perforanti e per gli attacchi a distanza. | Puoi lanciare _forma gassosa_ su te stesso senza slot; recuperi l\u0027uso al termine di un riposo lungo. |\n| **Dominio sulle Creature della Notte** | Con un\u0027azione evochi uno _sciame di pipistrelli_, che compare in uno spazio libero entro 9 m, agisce subito dopo di te e obbedisce ai tuoi ordini verbali per 1 minuto. Recuperi l\u0027uso al termine di un riposo lungo. | Puoi evocare invece 1d4 _lupi_. | Le creature evocate restano per 1 ora, o finché non scendono a metà dei loro PF. |\n| **Prodezza Sovrumana** | Con un\u0027azione bonus, fino alla fine del turno hai vantaggio alle prove di Forza, e le creature che provi ad afferrare o a spingere hanno svantaggio al tiro salvezza. | La tua capacità di carico raddoppia, e puoi afferrare creature fino a due taglie più grandi di te. | Quando attivi il Dono, fino alla fine del turno i tuoi attacchi in mischia infliggono 1d6 danni extra. |\n| **Minaccia dall\u0027Alto** | Ottieni una velocità di scalare pari a metà della tua velocità, e puoi muoverti sulle superfici lisce e sui soffitti a testa in giù senza prove. | La velocità di scalare diventa pari alla tua velocità. | Hai vantaggio ai tiri per colpire contro le creature che si trovano sotto di te, quando sei su un muro o su un soffitto. |\n| **Occhi del Predatore** | La tua scurovisione aumenta di 18 m. | Vedi normalmente nell\u0027oscurità magica entro 9 m. | Hai vista del vero entro 3 m. |\n\n---"}],"crea":"### Punti Ferita\n- **Dado Vita:** d8 per livello da Pallido.\n- **PF al 1° livello:** 8 + il tuo modificatore di Costituzione.\n- **PF ai livelli successivi:** 1d8 (o 5) + il tuo modificatore di Costituzione.\n\n### Competenze\n- **Tiri salvezza:** Forza, Costituzione.\n- **Abilità:** tre a scelta tra Arcano, Atletica, Furtività, Indagare, Inganno, Intimidire, Intuizione, Percezione, Persuasione, Religione e Storia.\n- **Armi:** armi semplici, e armi da guerra con la proprietà Accurata o Leggera.\n- **Armature:** armature leggere.\n\n### Equipaggiamento iniziale\nScegli A o B. **(A)** armatura imbottita, lancia, balestra leggera e 20 quadrelli, pugnale, dotazione da esploratore, un mantello con il cappuccio profondo, 10 mo; **(B)** 120 mo.\n\n### Multiclasse\nServono Costituzione 13 e Carisma 13. Al primo livello da Pallido ottieni i PF di un livello successivo, il Morso e la competenza nelle armature leggere. Non puoi diventare Pallido per multiclasse se non sei stato trasformato in gioco, o se non sei nato in una linea: è una cosa che si decide con il Master.\n\n---"},{"n":"Portanime","dv":10,"ts":["DES","CAR"],"tab":{"h":["Livello","Bonus Comp.","Artigli del Fantasma","Privilegi di Classe"],"r":[["1°","+2","2d6","Il Fantasma in Agguato, Artiglio Spettrale, Maestria nelle Armi"],["2°","+2","2d6","Stile di Combattimento, Determinazione Oscura"],["3°","+2","2d6","Natura del Fantasma"],["4°","+2","2d6","Aumento dei Punteggi di Caratteristica, Artiglio Crudele"],["5°","+3","2d6","Attacco Extra"],["6°","+3","2d6","Privilegio della Natura"],["7°","+3","3d8","Il Fantasma in Agguato (II), Artiglio d\u0027Acciaio"],["8°","+3","3d8","Aumento dei Punteggi di Caratteristica"],["9°","+4","3d8","Determinazione Oscura (2d10)"],["10°","+4","3d8","Privilegio della Natura, Squarcio Spettrale"],["11°","+4","3d8","Laccio Spettrale"],["12°","+4","3d8","Aumento dei Punteggi di Caratteristica"],["13°","+5","3d8","Artigli Gemelli"],["14°","+5","5d10","Privilegio della Natura, Il Fantasma in Agguato (III)"],["15°","+5","5d10","Una Mano Nell\u0027Altra"],["16°","+5","5d10","Aumento dei Punteggi di Caratteristica"],["17°","+6","5d10","Due Prede"],["18°","+6","5d10","Pelle d\u0027Ombra"],["19°","+6","5d10","Dono Epico"],["20°","+6","5d10","Una Sola Carne"]]},"priv":[{"lv":1,"n":"Il Fantasma in Agguato","md":"Dentro di te vive un **fantasma**, un\u0027anima che hai accolto e che combatte con te. Il fantasma non ha statistiche proprie: è una presenza che si vede appena, un freddo, un viso dietro la tua spalla.\n\n- **Fuori.** Con un\u0027azione bonus fai uscire il fantasma dal tuo corpo, e resta sospeso dietro di te, **in agguato**, per 1 minuto o finché non torna dentro di te. Molti privilegi funzionano soltanto mentre il fantasma è fuori.\n- **Aggrapparsi.** Mentre il fantasma è in agguato, quando una creatura entro 9 m da te ti colpisce con un attacco, puoi usare la reazione per mandarle addosso il fantasma, che le si **aggrappa**. Mentre il fantasma le è aggrappato, la creatura non può recuperare PF, e se è un non morto ha svantaggio ai tiri per colpire contro di te.\n- **Gli Artigli.** Alla fine del turno successivo della creatura, il fantasma affonda gli artigli: tira gli **Artigli del Fantasma** indicati dalla tabella. Se il risultato è pari o superiore ai PF che restano alla creatura, la creatura scende a 0 PF. Altrimenti subisce danni necrotici pari al risultato. Le creature immuni ai danni necrotici sono immuni agli Artigli. Poi il fantasma torna dentro di te.\n\nPuoi far aggrappare il fantasma una volta, e recuperi l\u0027uso al termine di un riposo breve o lungo. Al 7° livello puoi farlo due volte, e al 14°, quando gli Artigli portano una creatura a 0 PF, recuperi PF pari alla metà dei PF che le restavano."},{"lv":1,"n":"Artiglio Spettrale","md":"Conosci il trucchetto _tocco gelido_, e la tua caratteristica da incantatore per lanciarlo è il Carisma. Quando lo lanci, l\u0027effetto sul bersaglio dura fino alla fine del tuo turno successivo, invece che fino all\u0027inizio."},{"lv":1,"n":"Maestria nelle Armi","md":"Puoi usare le proprietà di maestria di due tipi di armi semplici o da guerra a tua scelta. Al termine di un riposo lungo puoi cambiare i tipi scelti."},{"lv":2,"n":"Stile di Combattimento","md":"Ottieni un talento Stile di Combattimento a tua scelta."},{"lv":2,"n":"Determinazione Oscura","md":"Il fantasma ti presta la sua ostinazione, quella di chi non è riuscito a morire del tutto. Con un\u0027azione bonus ottieni PF temporanei pari a 2d6 + il tuo livello da Portanime. Puoi farlo un numero di volte pari al tuo bonus di competenza, e recuperi gli usi spesi al termine di un riposo lungo. Dal 9° livello i PF temporanei diventano 2d10 + il tuo livello da Portanime."},{"lv":3,"n":"Natura del Fantasma","md":"Più passa il tempo, più capisci chi è il fantasma che porti, e che cosa lo tiene qui. Scegli una natura: il **Fantasma Errante**, il **Fantasma Fedele** o il **Fantasma Rancoroso**. Ottieni i privilegi della natura scelta al 3°, al 6°, al 10° e al 14° livello, compresi i suoi incantesimi.\n\n**Incantesimi del fantasma.** Ogni natura ti dà alcuni incantesimi, che lanci senza spendere slot e senza componenti materiali, usando il Carisma come caratteristica da incantatore. La **CD del fantasma**, che vale per questi incantesimi e per tutti i privilegi della natura, è 8 + il tuo bonus di competenza + il tuo modificatore di Carisma. La tabella della natura indica quante volte puoi lanciare ognuno; recuperi gli usi spesi al termine di un riposo lungo."},{"lv":4,"n":"Aumento dei Punteggi di Caratteristica","md":"Ottieni il talento Aumento dei Punteggi di Caratteristica, o un altro talento di cui soddisfi i requisiti. Ottieni di nuovo questo privilegio all\u00278°, al 12° e al 16° livello."},{"lv":4,"n":"Artiglio Crudele","md":"Quando manchi una creatura con _tocco gelido_, la creatura subisce comunque danni necrotici pari a 1 + il tuo modificatore di Carisma, senza altri effetti."},{"lv":5,"n":"Attacco Extra","md":"Quando effettui l\u0027azione di Attacco nel tuo turno, puoi attaccare due volte invece di una."},{"lv":7,"n":"Artiglio d\u0027Acciaio","md":"Quando effettui l\u0027azione di Attacco nel tuo turno, puoi sostituire uno degli attacchi con un _tocco gelido_."},{"lv":10,"n":"Squarcio Spettrale","md":"I tuoi attacchi con le armi sono colpi critici con un 19 o un 20 sul dado contro una creatura a cui è aggrappato il fantasma, o che è sotto l\u0027effetto del tuo _tocco gelido_."},{"lv":11,"n":"Laccio Spettrale","md":"Quando metti a segno un colpo critico con un attacco con un\u0027arma, se il fantasma non è già aggrappato a una creatura, esce, se non era già fuori, e si aggrappa subito al bersaglio. Non conta negli usi del Fantasma in Agguato."},{"lv":13,"n":"Artigli Gemelli","md":"Quando metti a segno un colpo critico con _tocco gelido_, puoi lanciarlo subito di nuovo, senza azione, contro una seconda creatura entro 4,5 m dalla prima."},{"lv":15,"n":"Una Mano Nell\u0027Altra","md":"Mentre il fantasma è fuori, hai vantaggio ai tiri salvezza su Saggezza e Carisma, e non puoi essere posseduto da nessuna creatura: il posto, dentro di te, è già occupato."},{"lv":17,"n":"Due Prede","md":"Quando il fantasma si aggrappa a una creatura, una sua parte resta in agguato dietro di te: puoi farlo aggrappare a una seconda creatura con un\u0027altra reazione, spendendo un altro uso, prima che torni dentro di te."},{"lv":18,"n":"Pelle d\u0027Ombra","md":"Hai resistenza ai danni necrotici, e i tuoi PF massimi non possono essere ridotti."},{"lv":19,"n":"Dono Epico","md":"Ottieni un talento Dono Epico, o un altro talento a tua scelta di cui soddisfi i requisiti."},{"lv":20,"n":"Una Sola Carne","md":"Con un\u0027azione bonus lasci che il fantasma ti riempia tutto. Per 1 minuto:\n- hai resistenza a tutti i danni tranne quelli da forza e radianti;\n- puoi muoverti attraverso le creature e gli oggetti come se fossero terreno difficile, e subisci 1d10 danni da forza se finisci il turno dentro un oggetto;\n- ogni tuo attacco con un\u0027arma può essere un _tocco gelido_;\n- il fantasma è sempre in agguato, e puoi farlo aggrappare senza spendere usi.\n\nPuoi farlo una volta, e recuperi l\u0027uso al termine di un riposo lungo.\n\n---"}],"sott":[{"n":"Il Fantasma Errante","md":"_Un\u0027anima che non ha mai smesso di cercare la strada. Si muove, scivola, passa dove i vivi non passano, e il Portanime finisce per assomigliarle: leggero, sfuggente, un po\u0027 trasparente quando la luce è bassa._\n\n| Livello | Incantesimo | Usi |\n|:---:|---|---|\n| 3° | _passo velato_ | pari al tuo modificatore di Carisma (minimo 1) |\n| 6° | _intermittenza_ | uno |\n| 10° | _libertà di movimento_ | uno |\n| 14° | _passapareti_ | uno |\n\n**3° livello: Velo Spettrale.** Mentre il fantasma è fuori, la tua velocità aumenta di 3 m, e gli attacchi di opportunità contro di te hanno svantaggio.\n\n**6° livello: Fantasma Rapace.** Quando una creatura entro 18 m da te ti colpisce con un attacco a distanza, puoi usare la reazione per far aggrappare il fantasma a quella creatura, anche se il fantasma non era fuori. Spendi un uso del Fantasma in Agguato.\n\n**10° livello: Fuga Spettrale.** Quando usi _Determinazione Oscura_, puoi anche effettuare l\u0027azione di Disimpegno o di Scatto come parte della stessa azione bonus.\n\n**14° livello: Svanire nell\u0027Etere.** Quando gli Artigli del Fantasma portano una creatura a 0 PF, diventi Invisibile fino alla fine del tuo turno successivo, o finché non attacchi o non lanci un incantesimo."},{"n":"Il Fantasma Fedele","md":"_Un\u0027anima che è rimasta per proteggere qualcuno. Ha la rabbia calma di chi ha fatto la guardia per tutta la vita, e il Portanime sente il suo coraggio nel petto come un secondo cuore._\n\n| Livello | Incantesimo | Usi |\n|:---:|---|---|\n| 3° | _parola guaritrice_ | pari al tuo modificatore di Carisma (minimo 1) |\n| 6° | _faro di speranza_ | uno |\n| 10° | _interdizione alla morte_ | uno |\n| 14° | _cura ferite di massa_ | uno |\n\n**3° livello: Scudo Spettrale.** Mentre il fantasma è fuori, ogni altra creatura a tua scelta entro 3 m da te ha un bonus di +1 alla CA e ai tiri salvezza. Il bonus diventa +2 al 10° livello.\n\n**6° livello: Fantasma Stratega.** Quando una creatura alleata che vedi colpisce con un attacco in mischia una creatura entro 18 m da te, puoi usare la reazione per far aggrappare il fantasma a quella creatura. Spendi un uso del Fantasma in Agguato.\n\n**10° livello: Riposo Spettrale.** Quando usi _Determinazione Oscura_, ogni altra creatura a tua scelta entro 3 m da te ottiene la metà dei PF temporanei che ottieni tu.\n\n**14° livello: Rinvigorimento Etereo.** Quando gli Artigli del Fantasma portano una creatura a 0 PF, tu e ogni creatura a tua scelta entro 9 m ottenete PF temporanei pari a 1d10 + il tuo modificatore di Carisma, e ognuno può porre fine alla condizione Spaventato, se ce l\u0027ha."},{"n":"Il Fantasma Rancoroso","md":"_Un\u0027anima che è rimasta per odio. Sa a memoria il nome di chi l\u0027ha uccisa, e lo ripete ogni notte, e le maledizioni le escono dalle dita come il fiato dalla bocca d\u0027inverno._\n\n| Livello | Incantesimo | Usi |\n|:---:|---|---|\n| 3° | _anatema_ | pari al tuo modificatore di Carisma (minimo 1) |\n| 6° | _scagliare maledizione_ | uno |\n| 10° | _confusione_ | uno |\n| 14° | _contagio_ | uno |\n\n**3° livello: Palude Spettrale.** Mentre il fantasma è fuori, ogni creatura ostile che termina il turno entro 9 m da te deve superare un tiro salvezza su Forza contro la CD del fantasma, altrimenti la sua velocità scende a 3 m fino alla fine del suo turno successivo.\n\n**6° livello: Fantasma Maligno.** Quando una creatura che vedi entro 9 m fallisce un tiro salvezza, puoi usare la reazione per far aggrappare il fantasma a quella creatura. Spendi un uso del Fantasma in Agguato.\n\n**10° livello: Terrore Spettrale.** Quando usi _Determinazione Oscura_, ogni creatura ostile entro 3 m da te deve superare un tiro salvezza su Saggezza contro la CD del fantasma, altrimenti è Spaventata fino alla fine del suo turno successivo.\n\n**14° livello: Carneficina Eterea.** Quando gli Artigli del Fantasma portano una creatura a 0 PF, il fantasma non torna dentro di te: si aggrappa subito a un\u0027altra creatura entro 3 m dalla prima, e gli Artigli scattano alla fine del suo turno successivo.\n\n---"}],"extra":[],"crea":"### Punti Ferita\n- **Dado Vita:** d10 per livello da Portanime.\n- **PF al 1° livello:** 10 + il tuo modificatore di Costituzione.\n- **PF ai livelli successivi:** 1d10 (o 6) + il tuo modificatore di Costituzione.\n\n### Competenze\n- **Tiri salvezza:** Destrezza, Carisma.\n- **Abilità:** due a scelta tra Acrobazia, Arcano, Furtività, Indagare, Intimidire, Rapidità di Mano, Religione e Storia.\n- **Armi:** armi semplici e armi da guerra.\n- **Armature:** armature leggere e medie.\n\n### Equipaggiamento iniziale\nScegli A o B. **(A)** armatura di cuoio borchiato, spada lunga, due pugnali, arco corto e 20 frecce, dotazione da esploratore, un oggetto appartenuto al tuo fantasma, 8 mo; **(B)** 150 mo.\n\n### Multiclasse\nServono Destrezza 13 e Carisma 13. Al primo livello da Portanime ottieni i PF di un livello successivo e la competenza nelle armature leggere e nelle armi da guerra.\n\n---"},{"n":"Archivista","dv":8,"ts":["INT","SAG"],"tab":{"h":["Livello","Bonus Comp.","Dado del Sapere","Trucchetti","Rituali","Livello massimo dei rituali","Privilegi di Classe"],"r":[["1°","+2","1d4","2","—","—","Il Punto Debole, Sapere del Maestro, Trucchetti dell\u0027Archivio"],["2°","+2","1d4","2","3","1°","Occhio dello Studioso, Rituali dell\u0027Archivio"],["3°","+2","1d4","2","3","2°","Fondo dell\u0027Archivio, Racconti di Mostri e di Magia"],["4°","+2","1d4","3","4","2°","Aumento dei Punteggi di Caratteristica"],["5°","+3","1d6","3","4","3°","Tenacia del Maestro (+1), Lezione sul Campo"],["6°","+3","1d6","3","5","3°","Privilegio del Fondo"],["7°","+3","1d6","3","5","4°","Sapere del Maestro (II), Mente d\u0027Archivio"],["8°","+3","1d6","3","6","4°","Aumento dei Punteggi di Caratteristica"],["9°","+4","1d6","3","6","5°","Racconti che Guariscono"],["10°","+4","1d6","4","7","5°","Privilegio del Fondo, Tenacia del Maestro (+2)"],["11°","+4","1d8","4","7","6°","Due Pagine Aperte"],["12°","+4","1d8","4","8","6°","Aumento dei Punteggi di Caratteristica"],["13°","+5","1d8","4","8","6°","Nota a Margine"],["14°","+5","1d8","4","9","6°","Privilegio del Fondo, Sapere del Maestro (III)"],["15°","+5","1d8","4","9","6°","Tenacia del Maestro (+3)"],["16°","+5","1d8","4","10","6°","Aumento dei Punteggi di Caratteristica"],["17°","+6","1d10","4","10","6°","—"],["18°","+6","1d10","4","11","6°","Memoria Perfetta"],["19°","+6","1d10","4","11","6°","Dono Epico"],["20°","+6","1d10","4","12","6°","Maestro delle Leggende"]]},"priv":[{"lv":1,"n":"Il Punto Debole","md":"Guardi una creatura per un istante e ricordi in quale pagina sta. Con un\u0027azione bonus scegli una creatura che vedi entro 18 m e dici ai compagni dove colpirla: per 1 minuto la creatura è **Segnata**. Quando tu o una creatura alleata che può sentirti la colpite con un attacco, il colpo infligge un **Dado del Sapere** di danni extra, dello stesso tipo del colpo. Ogni creatura può aggiungere il dado una sola volta per turno, e in tutto il dado si aggiunge al massimo un numero di volte per round pari al tuo modificatore di Intelligenza (minimo 1): dopo, fino all\u0027inizio del tuo turno successivo, la pagina è chiusa.\n\nPuoi usare questo privilegio un numero di volte pari al tuo modificatore di Intelligenza (minimo 1), e recuperi gli usi spesi al termine di un riposo breve o lungo. Una sola creatura per volta può essere Segnata; se ne segni un\u0027altra, la prima smette di esserlo. Il Dado del Sapere cresce con il livello, come indica la tabella."},{"lv":1,"n":"Sapere del Maestro","md":"Scegli un\u0027abilità in cui sei competente, tra quelle della lista dell\u0027Archivista: ottieni la maestria in quell\u0027abilità. Ne scegli un\u0027altra al 7° livello, e un\u0027altra ancora al 14°."},{"lv":1,"n":"Trucchetti dell\u0027Archivio","md":"Conosci due trucchetti a tua scelta dalla lista del Mago, e ne impari altri ai livelli indicati dalla tabella. La tua caratteristica da incantatore è l\u0027Intelligenza: la CD è 8 + il tuo bonus di competenza + il tuo modificatore di Intelligenza, e il modificatore di attacco è il tuo bonus di competenza + il tuo modificatore di Intelligenza. Puoi usare un libro, un quaderno o uno strumento da calligrafo come focus."},{"lv":2,"n":"Occhio dello Studioso","md":"Puoi effettuare l\u0027azione di Studiare come azione bonus. Inoltre, quando segni una creatura con il Punto Debole, puoi chiedere al Master una di queste informazioni, e lui risponde onestamente: le sue immunità, le sue resistenze, le sue vulnerabilità, oppure un suo tratto speciale."},{"lv":2,"n":"Rituali dell\u0027Archivio","md":"Hai un **libro dei rituali**, rilegato in pelle e numerato a mano. Contiene tre incantesimi di 1° livello con il marchio _rituale_, presi dalla lista di qualunque classe. Puoi lanciare gli incantesimi del libro soltanto come rituali, usando l\u0027Intelligenza come caratteristica da incantatore, e non hai slot incantesimo.\n\nIl numero di rituali nel libro e il livello massimo che puoi imparare crescono come indica la tabella. Quando trovi un rituale scritto, in un altro libro o su una pergamena, puoi copiarlo nel tuo libro spendendo 2 ore e 50 mo per livello dell\u0027incantesimo, purché sia di un livello che puoi imparare; i rituali copiati così non contano nel numero indicato dalla tabella."},{"lv":3,"n":"Fondo dell\u0027Archivio","md":"L\u0027Archivio è diviso in fondi, e ogni Archivista finisce per passare la vita dentro uno di loro. Scegli tra il **Fondo delle Tombe**, il **Fondo dei Patti** e il **Fondo del Cielo**. Ottieni i privilegi del tuo fondo al 3°, al 6°, al 10° e al 14° livello."},{"lv":3,"n":"Racconti di Mostri e di Magia","md":"Durante un riposo breve puoi raccontare ai compagni una storia vera, presa dai tuoi quaderni. Fino a cinque creature che ti ascoltano per tutto il riposo, e che capiscono la tua lingua, ottengono Ispirazione Eroica al termine del riposo. Puoi farlo una volta, e recuperi l\u0027uso al termine di un riposo lungo."},{"lv":4,"n":"Aumento dei Punteggi di Caratteristica","md":"Ottieni il talento Aumento dei Punteggi di Caratteristica, o un altro talento di cui soddisfi i requisiti. Ottieni di nuovo questo privilegio all\u00278°, al 12° e al 16° livello."},{"lv":5,"n":"Tenacia del Maestro","md":"Sai come funzionano le cose che vengono dal buio, e non ti lasci prendere alla sprovvista. Hai un bonus di +1 ai tiri salvezza contro gli incantesimi e i privilegi delle aberrazioni, degli immondi e dei non morti. Il bonus diventa +2 al 10° livello e +3 al 15°."},{"lv":5,"n":"Lezione sul Campo","md":"Quando una creatura alleata che vedi entro 18 m, e che può sentirti, effettua un tiro per colpire o un tiro salvezza contro la creatura Segnata, puoi usare la reazione per gridarle quello che sai: aggiunge un Dado del Sapere al tiro. Puoi farlo un numero di volte pari al tuo bonus di competenza, e recuperi gli usi spesi al termine di un riposo lungo."},{"lv":7,"n":"Mente d\u0027Archivio","md":"Hai vantaggio ai tiri salvezza su Intelligenza, e i tuoi ricordi non possono essere cancellati o modificati da nessun incantesimo di 5° livello o inferiore, a meno che tu non lo accetti."},{"lv":9,"n":"Racconti che Guariscono","md":"Quando usi _Racconti di Mostri e di Magia_, una creatura a tua scelta che ti ha ascoltato perde anche un livello di Indebolimento. Una volta per luna, invece, puoi raccontare la storia lunga, quella che si racconta di rado: ogni creatura che ti ha ascoltato perde un livello di Indebolimento. Una storia raccontata bene rimette a posto quello che la Notte si è presa."},{"lv":11,"n":"Due Pagine Aperte","md":"Puoi avere due creature Segnate contemporaneamente. Segnare la seconda costa un altro uso del Punto Debole."},{"lv":13,"n":"Nota a Margine","md":"Quando tu o una creatura che vedi entro 9 m fallite una prova di caratteristica o un tiro salvezza, puoi usare la reazione per ricordare una nota scritta di lato: la creatura ripete il tiro e aggiunge il tuo modificatore di Intelligenza, e deve usare il nuovo risultato. Puoi farlo una volta, e recuperi l\u0027uso al termine di un riposo breve o lungo."},{"lv":18,"n":"Memoria Perfetta","md":"Ricordi tutto quello che hai visto, sentito o letto, parola per parola. Hai resistenza ai danni psichici, e sei immune alla condizione Affascinato."},{"lv":19,"n":"Dono Epico","md":"Ottieni un talento Dono Epico, o un altro talento a tua scelta di cui soddisfi i requisiti."},{"lv":20,"n":"Maestro delle Leggende","md":"Il Punto Debole non ha più un numero limitato di usi. Inoltre puoi lanciare _leggende e tradizioni_ senza componenti materiali e senza spendere uno slot, e recuperi l\u0027uso al termine di un riposo lungo.\n\n---"}],"sott":[{"n":"Il Fondo delle Tombe","md":"_Riti funebri, morti che non restano morti, la Foschia, le cripte e quello che c\u0027è sotto. Gli Archivisti delle Tombe sono quelli che scendono, e che tornano con la terra sulle maniche._\n\n**3° livello: Il Mito della Luce.** Conosci i trucchetti _fiamma sacra_ e _salvare i morenti_, che per te sono trucchetti dell\u0027Archivio. Inoltre, quando la creatura Segnata è un non morto, il Dado del Sapere è un dado più grande (1d4 diventa 1d6, 1d6 diventa 1d8, e così via, fino a 1d12), e i suoi danni diventano radianti.\n\n**6° livello: Racconti dalla Cripta.** Hai vantaggio ai tiri salvezza per evitare la condizione Spaventato o porvi fine, e resistenza ai danni necrotici.\n\n**10° livello: Leggenda della Luna Splendente.** Puoi lanciare _raggio lunare_ come incantesimo di 4° livello, senza spendere uno slot, usando l\u0027Intelligenza. Recuperi l\u0027uso al termine di un riposo breve o lungo.\n\n**14° livello: La Morale dei Morti.** I tuoi PF massimi non possono essere ridotti. Inoltre, quando un effetto ti ucciderebbe all\u0027istante, o ti porterebbe a 0 PF senza infliggerti danni, scendi invece a 1 PF. Puoi farlo una volta, e recuperi l\u0027uso al termine di un riposo lungo."},{"n":"Il Fondo dei Patti","md":"_Gli immondi, chi tratta con le Presenze, gli Avatar e le Paure che li hanno presi. Gli Archivisti dei Patti leggono contratti che nessuno dovrebbe aver firmato, e sanno riconoscere la firma._\n\n**3° livello: Il Mito della Magia.** Puoi lanciare _protezione dal bene e dal male_ su te stesso, senza spendere uno slot, usando l\u0027Intelligenza; recuperi l\u0027uso al termine di un riposo breve o lungo. Inoltre, quando la creatura Segnata è un immondo, il Dado del Sapere è un dado più grande, e i colpi che lo aggiungono ignorano la sua resistenza ai danni.\n\n**6° livello: Racconti dell\u0027Inquisizione.** Hai resistenza ai danni da fuoco. Inoltre, quando segni con il Punto Debole un Avatar, sai che è un Avatar e a quale Paura appartiene, anche se nasconde il Segno.\n\n**10° livello: Leggenda dell\u0027Esilio.** Puoi lanciare _esilio_ senza spendere uno slot, usando l\u0027Intelligenza. Recuperi l\u0027uso al termine di un riposo breve o lungo.\n\n**14° livello: La Morale del Rogo.** Sei immune ai danni da fuoco, e hai vantaggio ai tiri salvezza contro gli incantesimi e i privilegi degli immondi e degli Avatar."},{"n":"Il Fondo del Cielo","md":"_Il cosmo, le cose che non sono di qui, i sogni e quello che li attraversa. Gli Archivisti del Cielo dormono poco, e quando dormono prendono appunti._\n\n**3° livello: Il Mito dell\u0027Incubo.** Puoi lanciare _santuario_ senza spendere uno slot, usando l\u0027Intelligenza, un numero di volte pari al tuo modificatore di Intelligenza (minimo 1), e recuperi gli usi spesi al termine di un riposo lungo. Inoltre, quando la creatura Segnata è un\u0027aberrazione, il Dado del Sapere è un dado più grande; e ogni volta che un colpo aggiunge il Dado del Sapere, puoi chiedere al Master un dettaglio della creatura, tra un suo punteggio di caratteristica, la CA, le velocità, i PF attuali e massimi, un tratto speciale, una resistenza, un\u0027immunità o una vulnerabilità.\n\n**6° livello: Racconti dal Profondo.** Hai resistenza ai danni psichici, e vantaggio ai tiri salvezza per evitare le condizioni Incapacitato, Paralizzato, Privo di sensi e Stordito, o per porvi fine.\n\n**10° livello: Leggenda del Sogno Rivelatore.** Puoi lanciare _occhio arcano_ senza spendere uno slot, usando l\u0027Intelligenza. Recuperi l\u0027uso al termine di un riposo breve o lungo.\n\n**14° livello: La Morale dell\u0027Eternità.** Smetti di invecchiare, e hai vantaggio ai tiri salvezza contro gli incantesimi.\n\n---"}],"extra":[],"crea":"### Punti Ferita\n- **Dado Vita:** d8 per livello da Archivista.\n- **PF al 1° livello:** 8 + il tuo modificatore di Costituzione.\n- **PF ai livelli successivi:** 1d8 (o 5) + il tuo modificatore di Costituzione.\n\n### Competenze\n- **Tiri salvezza:** Intelligenza, Saggezza.\n- **Abilità:** tre a scelta tra Arcano, Indagare, Intuizione, Medicina, Natura, Percezione, Religione e Storia.\n- **Armi:** armi semplici.\n- **Armature:** armature leggere.\n- **Strumenti:** strumenti da calligrafo.\n\n### Equipaggiamento iniziale\nScegli A o B. **(A)** armatura di cuoio, bastone ferrato, fionda e 20 proiettili, strumenti da calligrafo, dotazione da studioso, tre quaderni bianchi, 12 mo; **(B)** 100 mo.\n\n### Multiclasse\nServono Intelligenza 13 e Saggezza 13. Al primo livello da Archivista ottieni i PF di un livello successivo, la competenza nelle armature leggere e in un\u0027abilità della lista dell\u0027Archivista.\n\n---"},{"n":"Emomante","dv":10,"ts":["FOR","COS"],"tab":{"h":["Livello","Bonus Comp.","Punti Cuore","Dado Ematico","Privilegi di Classe"],"r":[["1°","+2","—","1d6","Costituzione Vitale, Armeria Venosa, Maestria nelle Armi"],["2°","+2","2","1d6","Il Cuore, Ferita Aperta, Emostasi, Stile di Combattimento"],["3°","+2","3","1d6","Arteria Primaria"],["4°","+2","4","1d6","Aumento dei Punteggi di Caratteristica"],["5°","+3","5","1d8","Attacco Extra, Coagulazione Rapida"],["6°","+3","6","1d8","Privilegio dell\u0027Arteria"],["7°","+3","7","1d8","Purificazione Interna"],["8°","+3","8","1d8","Aumento dei Punteggi di Caratteristica"],["9°","+4","9","1d8","Percezione del Battito"],["10°","+4","10","1d8","Privilegio dell\u0027Arteria"],["11°","+4","11","1d10","Sovraccarico Ematico"],["12°","+4","12","1d10","Aumento dei Punteggi di Caratteristica"],["13°","+5","13","1d10","Forma Liquida"],["14°","+5","14","1d10","Privilegio dell\u0027Arteria"],["15°","+5","15","1d10","Cuore che non Cessa"],["16°","+5","16","1d10","Aumento dei Punteggi di Caratteristica"],["17°","+6","17","1d12","Burattinaio di Sangue, Sovraccarico Superiore"],["18°","+6","18","1d12","Il Sangue Ricorda"],["19°","+6","19","1d12","Dono Epico"],["20°","+6","20","1d12","Apoteosi del Sangue"]]},"priv":[{"lv":1,"n":"Costituzione Vitale","md":"Il tuo corpo risponde alla tua volontà prima che alle leggi della carne.\n- **Difesa Naturale.** Se non indossi armature e non usi uno scudo, la tua CA è pari a 10 + il tuo modificatore di Destrezza + il tuo modificatore di Costituzione.\n- **Arma Biologica.** Con le tue **Armi Venose** usi la Costituzione al posto della Forza o della Destrezza, sia per i tiri per colpire sia per i danni.\n- **CD del Sangue.** La CD dei tiri salvezza contro i tuoi privilegi è pari a 8 + il tuo bonus di competenza + il tuo modificatore di Costituzione."},{"lv":1,"n":"Armeria Venosa","md":"Con un\u0027azione bonus ti apri una piccola ferita, e il sangue si solidifica in un\u0027**Arma Venosa**. Subisci danni pari a un tiro del tuo Dado Ematico, che non possono essere ridotti in alcun modo. L\u0027arma è magica e ti appartiene, e dura finché non termini un riposo breve o lungo, finché non la dissolvi, cosa che non richiede azioni, finché non ne crei un\u0027altra o finché non perdi i sensi. Se la lasci andare, si scioglie alla fine del turno. Ogni volta che la crei ne scegli la forma:\n\n| Forma | Danni | Proprietà |\n|---|---|---|\n| **Lama** | 1d8 taglienti | Versatile (1d10) |\n| **Frusta** | 1d4 taglienti | Accurata, Portata |\n| **Spuntone Arterioso** | 1d6 perforanti | A distanza, gittata 24/96 m; lo spari dai palmi, senza munizioni e senza bisogno di una mano libera per ricaricare |\n\nLe Armi Venose contano come armi da guerra per i privilegi che lo richiedono."},{"lv":1,"n":"Maestria nelle Armi","md":"Puoi usare le proprietà di maestria di due tipi di armi semplici o da guerra a tua scelta. Ogni forma di Arma Venosa conta come un tipo di arma, cioè la Lama come spada lunga, la Frusta come frusta e lo Spuntone come arco corto, e per usarne la maestria devi aver scelto quel tipo. Al termine di un riposo lungo puoi cambiare i due tipi scelti."},{"lv":2,"n":"Il Cuore","md":"Il tuo cuore pompa più di quanto serva per vivere, e quello che avanza è potere: sono i **Punti Cuore**, e ne hai quanti ne indica la tabella.\n- **Recupero.** Recuperi tutti i Punti Cuore spesi al termine di un riposo breve o lungo, mentre il cuore rallenta e il sangue si rifà.\n- **Pagare con la Carne.** Quando non hai più Punti Cuore, puoi ottenerne 1 perdendo un numero di PF pari a 5 + il tuo livello da Emomante, una perdita che non può essere ridotta in alcun modo. Puoi farlo un numero di volte pari al tuo bonus di competenza, e recuperi tutti gli usi spesi al termine di un riposo lungo. I punti ottenuti in questo modo non si possono spendere per _Emostasi_."},{"lv":2,"n":"Ferita Aperta","md":"Una volta per turno, quando colpisci una creatura con un\u0027Arma Venosa, puoi spendere 1 Punto Cuore: il colpo infligge un Dado Ematico di danni necrotici in più, e il bersaglio non può recuperare PF fino all\u0027inizio del tuo turno successivo."},{"lv":2,"n":"Stile di Combattimento","md":"Ottieni un talento Stile di Combattimento a tua scelta. Le Armi Venose contano come armi per tutti gli stili: la Lama impugnata a due mani vale per Combattere con Armi Grandi, la Lama a una mano per Duellare e lo Spuntone per Tiro."},{"lv":2,"n":"Emostasi","md":"Una volta per turno, con un\u0027azione bonus, puoi spendere un numero di Punti Cuore fino al tuo bonus di competenza, e per ogni punto speso recuperi PF pari a un tiro del Dado Ematico + il tuo modificatore di Costituzione."},{"lv":3,"n":"Arteria Primaria","md":"Il tuo sangue si specializza in una delle quattro grandi discipline: l\u0027**Arteria del Ferro**, l\u0027**Arteria della Ruggine**, l\u0027**Arteria del Vincolo** o l\u0027**Arteria della Genesi**. Ottieni i privilegi della tua Arteria al 3°, al 6°, al 10° e al 14° livello."},{"lv":4,"n":"Aumento dei Punteggi di Caratteristica","md":"Ottieni il talento Aumento dei Punteggi di Caratteristica, o un altro talento di cui soddisfi i requisiti. Ottieni di nuovo questo privilegio all\u00278°, al 12° e al 16° livello."},{"lv":5,"n":"Attacco Extra","md":"Quando effettui l\u0027azione di Attacco nel tuo turno, puoi attaccare due volte invece di una."},{"lv":5,"n":"Coagulazione Rapida","md":"Il sangue ti si chiude intorno mentre lo manipoli. Nel turno in cui crei un\u0027Arma Venosa o spendi almeno 1 Punto Cuore con un\u0027azione bonus, il tuo movimento non provoca attacchi di opportunità."},{"lv":7,"n":"Purificazione Interna","md":"Il tuo sangue è un posto ostile per tutto ciò che non sei tu. Sei immune alle malattie e alla condizione Avvelenato, hai resistenza ai danni da veleno e hai vantaggio ai tiri salvezza per evitare la condizione Paralizzato o porvi fine."},{"lv":9,"n":"Percezione del Battito","md":"Hai vista cieca entro 9 m, ma soltanto sulle creature con un cuore che batte: ne percepisci il sangue anche se sono invisibili, nell\u0027oscurità magica o dietro una copertura leggera. Non percepisci costrutti, non morti ed elementali."},{"lv":11,"n":"Sovraccarico Ematico","md":"Una volta per turno, quando colpisci una creatura con un\u0027Arma Venosa, puoi spendere 2 Punti Cuore per infliggere due Dadi Ematici di danni in più del tipo dell\u0027arma. Se il bersaglio è Grande o più piccolo deve superare un tiro salvezza su Forza, altrimenti viene spinto di 3 m e cade Prono. Puoi usare questo privilegio nello stesso colpo di _Ferita Aperta_. **Sovraccarico Superiore:** dal 17° livello infligge tre Dadi Ematici invece di due."},{"lv":13,"n":"Forma Liquida","md":"Quando subisci danni da un attacco, puoi usare la reazione e spendere 3 Punti Cuore per scioglierti in un getto di sangue: dimezzi i danni di quell\u0027attacco e ti teletrasporti fino a 9 m in uno spazio libero che puoi vedere, dove ti riformi."},{"lv":15,"n":"Cuore che non Cessa","md":"Quando scendi a 0 PF senza morire sul colpo, puoi invece scendere a un numero di PF pari al tuo livello da Emomante, perché il sangue ti si cristallizza nelle vene e ti tiene in piedi. Dopo averlo usato, non puoi farlo di nuovo finché non termini un riposo lungo."},{"lv":17,"n":"Burattinaio di Sangue","md":"Con un\u0027azione puoi spendere 4 Punti Cuore per afferrare il sangue di una creatura entro 18 m che hai ferito con un\u0027Arma Venosa nell\u0027ultimo minuto. La creatura deve superare un tiro salvezza su Costituzione, altrimenti è Trattenuta per 1 minuto (concentrazione), e all\u0027inizio di ogni tuo turno puoi muoverla fino a metà della sua velocità e farle effettuare un attacco con un\u0027arma contro una creatura a tua scelta. Alla fine di ogni suo turno la creatura ripete il tiro salvezza, e se lo supera l\u0027effetto termina. I costrutti, i non morti e le creature senza sangue sono immuni."},{"lv":18,"n":"Il Sangue Ricorda","md":"Il tuo sangue non dimentica chi sei. Quando effettui un tiro salvezza o una prova di Costituzione e il totale è inferiore al tuo punteggio di Costituzione, puoi usare il punteggio al posto del totale. Inoltre smetti di invecchiare."},{"lv":19,"n":"Dono Epico","md":"Ottieni un talento Dono Epico, o un altro talento a tua scelta di cui soddisfi i requisiti."},{"lv":20,"n":"Apoteosi del Sangue","md":"- La tua Costituzione aumenta di 4, fino a un massimo di 25.\n- **Marea Interna.** Quando tiri l\u0027iniziativa, se hai meno della metà dei tuoi Punti Cuore li recuperi fino a quella metà.\n\n---"}],"sott":[{"n":"Arteria del Ferro","md":"_Questi Emomanti induriscono il sangue sotto la pelle in placche nere simili al ferro. Stanno davanti agli altri, e puniscono chi li colpisce._\n\n**3° livello: Pelle di Ferro.** Con un\u0027azione bonus spendi 1 Punto Cuore. Per 1 minuto hai +1 alla CA e vantaggio ai tiri salvezza su Forza e alle prove per non essere spinto o atterrato, e quando tu o una creatura entro 1,5 m da te subite danni da un attacco puoi usare la reazione per ridurli di un tiro del Dado Ematico + il tuo modificatore di Costituzione.\n\n**3° livello: Sfida di Sangue.** Quando colpisci una creatura con un\u0027Arma Venosa mentre _Pelle di Ferro_ è attiva, puoi marchiarla fino alla fine del tuo turno successivo, e finché è marchiata ha svantaggio ai tiri per colpire contro creature diverse da te.\n\n**6° livello: Contrattacco Spinoso.** Quando una creatura ti colpisce con un attacco in mischia mentre _Pelle di Ferro_ è attiva, ti escono dalla pelle spuntoni di sangue, e la creatura subisce danni perforanti pari a un tiro del Dado Ematico + il tuo modificatore di Costituzione.\n\n**10° livello: Fortezza Inamovibile.** Mentre _Pelle di Ferro_ è attiva hai resistenza ai danni contundenti, perforanti e taglienti, e sei immune alla condizione Prono. Quando usi _Emostasi_, aggiungi il tuo bonus di competenza ai PF recuperati per ogni punto speso.\n\n**14° livello: Sangue di Piombo.** Quando attivi _Pelle di Ferro_, puoi spendere altri 3 Punti Cuore per entrare in **Densità Critica** per la stessa durata. Hai resistenza a tutti i danni tranne quelli psichici e da forza, la tua velocità è dimezzata, non puoi volare, e i tuoi attacchi in mischia infliggono danni doppi a oggetti e strutture. Le creature a tua scelta entro 3 m da te hanno mezza copertura. Dopo aver usato la Densità Critica, non puoi farlo di nuovo finché non termini un riposo breve o lungo."},{"n":"Arteria della Ruggine","md":"_Il loro sangue è acido e instabile. Combattono da lontano, e sciolgono armature e carne._\n\n**3° livello: Getto Corrosivo.** I tuoi Spuntoni Arteriosi infliggono 1d8 danni da acido invece di 1d6 perforanti, e ignorano la mezza copertura. Una volta per turno, quando colpisci con uno Spuntone, puoi spendere 1 Punto Cuore: il colpo infligge un Dado Ematico di danni da acido in più, e il bersaglio ha −1 alla CA fino alla fine del tuo turno successivo, una penalità che non si cumula. Al 10° livello la penalità diventa −2.\n\n**6° livello: Sangue Instabile.** Quando subisci danni da una creatura entro 3 m da te, puoi usare la reazione e spendere 1 Punto Cuore per far esplodere il sangue dalla ferita: ogni creatura a tua scelta entro 3 m deve superare un tiro salvezza su Destrezza, altrimenti subisce danni da acido pari a due Dadi Ematici, o la metà con un successo.\n\n**10° livello: Nebbia Rossa.** I tuoi danni da acido ignorano la resistenza. Inoltre, con un\u0027azione e 3 Punti Cuore, puoi emettere una nube di sangue vaporizzato in una sfera di 6 m di raggio centrata su di te, che dura 1 minuto (concentrazione). L\u0027area è pesantemente oscurata, tranne che per te, e una creatura che inizia il turno nella nube subisce danni da acido pari a un tiro del Dado Ematico + il tuo modificatore di Costituzione.\n\n**14° livello: Disintegrazione Venosa.** Con un\u0027azione spendi 5 Punti Cuore e spari un raggio di sangue nero lungo una linea di 30 m e larga 1,5 m. Ogni creatura sulla linea effettua un tiro salvezza su Destrezza, e subisce 10d10 danni da acido con un fallimento, o la metà con un successo. Una creatura ridotta a 0 PF da questi danni diventa una pozza di liquido, e si può riportare in vita soltanto con _desiderio_. Dopo averlo usato, non puoi farlo di nuovo finché non termini un riposo breve o lungo."},{"n":"Arteria del Vincolo","md":"_Sanno che il sangue lega ogni essere vivo, e usano la propria vita per tenere in piedi gli altri._\n\n**3° livello: Trasfusione Vitale.** Con un\u0027azione bonus tocchi un alleato e tiri un numero di Dadi Ematici a tua scelta, fino al tuo bonus di competenza. Perdi un numero di PF pari al risultato, che non può essere ridotto, e l\u0027alleato ne recupera un numero pari al risultato + il doppio del tuo modificatore di Costituzione. Puoi farlo un numero di volte pari al tuo bonus di competenza, e recuperi tutti gli usi spesi al termine di un riposo lungo; ogni uso oltre questi ti costa 1 Punto Cuore. Dal 6° livello puoi farlo fino a 9 m di distanza, con un filo di sangue.\n\n**3° livello: Sangue Donato.** Quando usi _Emostasi_, puoi far recuperare i PF a un alleato entro 9 m invece che a te.\n\n**6° livello: Legame Empatico.** Con un\u0027azione bonus spendi 2 Punti Cuore e leghi a te, con un filo rosso, un alleato entro 18 m per 10 minuti. L\u0027alleato ha +1 alla CA e ai tiri salvezza, e quando subisce danni puoi scegliere di prenderne tu la metà, danni che nessuna tua capacità può ridurre. Il legame termina se uno dei due scende a 0 PF o se leghi a te un\u0027altra creatura.\n\n**10° livello: Adrenalina Condivisa.** Quando usi l\u0027azione di Attacco, puoi rinunciare a uno dei tuoi attacchi per permettere all\u0027alleato legato dal _Legame Empatico_ di usare la reazione ed effettuare subito un attacco con un\u0027arma. Inoltre, quando usi _Emostasi_ su un alleato, recupera anche un numero di PF pari al tuo bonus di competenza per ogni punto speso.\n\n**14° livello: Sacrificio Supremo.** Quando un alleato entro 18 m sta per scendere a 0 PF, puoi usare la reazione e spendere 3 Punti Cuore: l\u0027alleato resta a 1 PF ed è immune a tutti i danni fino alla fine del turno, e sei tu a scendere a 0 PF al posto suo, anche se puoi usare _Cuore che non Cessa_, se ce l\u0027hai. Dopo averlo usato, non puoi farlo di nuovo finché non termini un riposo lungo."},{"n":"Arteria della Genesi","md":"_Usano il sangue come argilla, e creano servitori, trappole e orrori che combattono al loro fianco._\n\n**3° livello: Coagulo Servitore.** Al termine di un riposo lungo, oppure con un\u0027azione e 2 Punti Cuore, versi il tuo sangue e crei un **Coagulo** in uno spazio libero entro 1,5 m, e non puoi averne più di uno. Il Coagulo agisce nel tuo turno, subito dopo di te: si muove e usa la reazione da solo, ma per fargli usare un\u0027azione devi spendere la tua azione bonus, oppure rinunciare a uno dei tuoi attacchi quando usi l\u0027azione di Attacco, e in caso contrario usa Schivare. Se scende a 0 PF esplode, e ogni creatura a tua scelta entro 1,5 m da lui subisce danni necrotici pari a due Dadi Ematici. Quando usi _Emostasi_, puoi far recuperare i PF al Coagulo invece che a te, se si trova entro 18 m, perché il sangue è lo stesso.\n\n\u003e **Coagulo di Sangue**\n\u003e *Costrutto Medio, neutrale*\n\u003e **CA** 13 + il tuo bonus di competenza · **PF** 5 + cinque volte il tuo livello da Emomante · **Velocità** 9 m, scalare 9 m\n\u003e **FOR** 14 · **DES** 14 · **COS** 16 · **INT** 6 · **SAG** 10 · **CAR** 6\n\u003e **Immunità** necrotico, veleno; Affascinato, Avvelenato, Indebolimento, Spaventato\n\u003e **Sensi** vista cieca 9 m; Percezione passiva 10 · **Lingue** capisce le tue\n\u003e **Legame di Sangue.** Usa il tuo bonus di competenza per i tiri per colpire, i tiri salvezza e le prove.\n\u003e **Artigli di Sangue.** *Tiro per colpire in mischia:* il tuo modificatore di Costituzione + il tuo bonus di competenza, portata 1,5 m. *Colpito:* 1d6 + il tuo bonus di competenza danni taglienti.\n\n**6° livello: Trappola Emoglobinica.** Con un\u0027azione bonus spendi 1 Punto Cuore e trasformi una pozza di sangue entro 9 m, anche una creata da te, in una trappola invisibile, e puoi averne attive un numero pari al tuo modificatore di Costituzione. La prima creatura ostile che ci entra deve superare un tiro salvezza su Destrezza, altrimenti subisce 3d8 danni perforanti ed è Trattenuta (la CD per liberarsi è pari alla tua CD del Sangue); con un successo subisce soltanto la metà dei danni.\n\n**10° livello: Mimesi Rossa.** Puoi scagliare i tuoi Spuntoni Arteriosi dalla posizione del Coagulo. Inoltre, quando una creatura ti attacca, puoi usare la reazione e spendere 2 Punti Cuore per scambiarti di posto con il Coagulo, se si trova entro 18 m, e l\u0027attacco è diretto a lui, contro la sua CA.\n\n**14° livello: L\u0027Abominio.** Con un\u0027azione spendi 5 Punti Cuore e trasformi il Coagulo in un **Abominio di Sangue** per 1 minuto. L\u0027Abominio è Grande, ottiene un numero di PF temporanei pari a cinque volte il tuo livello da Emomante e recupera 10 PF all\u0027inizio di ogni suo turno. Effettua due attacchi con gli Artigli invece di uno, i suoi Artigli infliggono 2d6 + il tuo bonus di competenza danni, e la sua esplosione infligge quattro Dadi Ematici entro 3 m. Alla fine del minuto torna a essere un Coagulo. Dopo averlo usato, non puoi farlo di nuovo finché non termini un riposo lungo.\n\n---"}],"extra":[],"crea":"### Punti Ferita\n- **Dado Vita:** d10 per livello da Emomante.\n- **PF al 1° livello:** 10 + il tuo modificatore di Costituzione.\n- **PF ai livelli successivi:** 1d10 (o 6) + il tuo modificatore di Costituzione.\n\n### Competenze\n- **Tiri salvezza:** Forza, Costituzione.\n- **Abilità:** due a scelta tra Atletica, Indagare, Intimidire, Medicina, Percezione e Sopravvivenza.\n- **Armi:** armi semplici e da guerra.\n- **Armature:** armature leggere e medie, scudi.\n- **Strumenti:** Kit da Erborista oppure strumenti da alchimista.\n\n### Equipaggiamento iniziale\nScegli A o B. **(A)** giaco di maglia, spada lunga, pugnale cerimoniale, balestra leggera e 20 quadrelli, dotazione da esploratore, 5 mo; **(B)** 150 mo.\n\n### Multiclasse\nServe Costituzione 13. Le regole complete, e il modo in cui l\u0027Emomante si combina con le altre classi, si trovano in fondo alla pagina, nella sezione _Multiclasse_.\n\n---"}],"sottoclassi":[{"cl":"Barbaro","n":"Sentiero della Notte nel Petto","md":"_Ci sono guerrieri che nella Notte hanno smesso di combattere il buio e hanno cominciato a berlo. Nelle Terre Basse li chiamano i Bevuti, nei porti i Senzafondo, e nessun villaggio li tiene per più di una notte: fanno il lavoro sporco, prendono la paga e se ne vanno prima che qualcuno guardi bene nei loro occhi. Più si avvicinano alla fine, più diventano forti, e lo sanno, e non si fermano._\n\n### Livello 3: Sete della Notte\n\nMentre sei in Ira, all\u0027inizio di ogni tuo turno puoi spendere un Dado Vita senza tirarlo. Se lo fai, il prossimo attacco con un\u0027arma da mischia basato sulla Forza che colpisce in questo turno infligge 1d12 danni necrotici extra. Se quell\u0027attacco riduce il bersaglio a 0 PF, il buio si nutre di quello che ne esce, e recuperi il Dado Vita che hai speso.\n\n### Livello 3: Sangue del Buio\n\nQuando subisci uno o più livelli di Indebolimento, oppure quando diventi Spaventato, puoi usare la reazione per ottenere 1d12 PF temporanei e vantaggio ai tiri salvezza fino alla fine del tuo turno successivo.\n\n### Livello 6: Sull\u0027Orlo\n\nTi senti a tuo agio quando sei vicino a finire. Finché ti resta meno della metà dei tuoi Dadi Vita, ignori le penalità dei primi due livelli di Indebolimento, e dal 14° livello dei primi quattro. Gli altri pesano come sempre, e il sesto ti uccide comunque.\n\n### Livello 10: Divoratore del Buio\n\nQuando un non morto, un immondo o un\u0027aberrazione scende a 0 PF entro 9 m da te mentre sei in Ira, ti nutri di quello che ne esce: recuperi un Dado Vita speso, o due se il Grado di Sfida della creatura era 10 o più.\n\n### Livello 14: Ira Senza Fondo\n\nIl buio si è preso quello che restava. Entrare in Ira ti costa un Dado Vita, che spendi senza tirarlo, e finché sei in Ira aggiungi il tuo modificatore di Costituzione ai danni dei tuoi attacchi con armi da mischia. Se non ti restano Dadi Vita puoi entrare in Ira lo stesso, ma subisci un livello di Indebolimento.\n\n---"},{"cl":"Bardo","n":"Collegio della Ronda Storta","md":"_Prima della Notte la ronda era una festa: si ballava intorno al primo covone, sui Colli di Vesper, per chiudere la stagione. Dopo, è diventata una difesa. I suonatori della Ronda Storta girano di villaggio in villaggio con il tamburello, e la gente apre loro la porta anche dopo l\u0027ultima campana, cosa che non fa per nessun altro. Il ritmo che suonano non è allegro. È storto, insistente, e prende i nervi a chi lo ascolta, nemici compresi._\n\n### Livello 3: Rapsodia Convulsa\n\nQuando una creatura ostile comincia il turno entro 9 m da te, puoi usare la reazione e spendere un uso di Ispirazione Bardica per suonare una melodia storta. La creatura deve superare un tiro salvezza su Saggezza contro la CD dei tuoi incantesimi, altrimenti comincia a ballare. Tira il dado di Ispirazione Bardica: per quel numero di round la creatura ha la velocità dimezzata, svantaggio ai tiri salvezza su Destrezza e svantaggio al primo tiro per colpire di ognuno dei suoi turni. Alla fine di ogni suo turno la creatura ripete il tiro salvezza, e se lo supera l\u0027effetto termina.\n\n### Livello 3: Note delle Feste Antiche\n\nPuoi suonare per almeno 10 minuti di fila una delle melodie delle feste del raccolto. Fino a quattro creature a tua scelta che la ascoltano per tutto il tempo hanno, per le 8 ore successive, vantaggio alle prove di Intelligenza (Religione) e ai tiri salvezza per non diventare Spaventate. Puoi farlo una volta, e recuperi l\u0027uso al termine di un riposo lungo.\n\n### Livello 6: Danza Irrefrenabile\n\nIl tuo senso del ritmo è diventato un modo di combattere. Ottieni questi benefici:\n- **Trascinare.** Se nel tuo turno ti muovi di almeno 6 m e finisci il movimento a non più di 3 m dal punto di partenza, puoi usare un\u0027azione bonus per costringere una creatura che vedi entro 3 m a superare un tiro salvezza su Saggezza contro la CD dei tuoi incantesimi. Se lo fallisce, imita i tuoi movimenti, e la sposti di 3 m nella direzione che vuoi. Questo movimento provoca attacchi di opportunità.\n- **Schivare ballando.** Se usi l\u0027azione di Schivare e nel turno ti muovi di almeno 6 m, finendo il movimento a non più di 3 m dal punto di partenza, puoi effettuare un attacco con un\u0027arma da mischia come azione bonus, e aggiungere ai danni un dado di Ispirazione Bardica, spendendone un uso.\n- **Passo leggero.** Quando usi l\u0027azione di Disimpegno, la tua velocità aumenta di 3 m fino alla fine del turno.\n\n### Livello 14: Danza delle Lame\n\nNel tuo turno puoi spendere un uso di Ispirazione Bardica per aumentare la tua velocità di 6 m fino alla fine del turno. Se in quel turno usi l\u0027azione di Attacco, puoi effettuare un attacco con un\u0027arma da mischia contro ogni creatura che si trova entro la portata della tua arma in un qualunque momento del tuo movimento, invece dei tuoi attacchi normali, e il tuo movimento non provoca attacchi di opportunità dalle creature che hai colpito.\n\n---"},{"cl":"Chierico","n":"Dominio della Ruota","md":"_Il culto della Ruota non ha chiese. Ha i campi, i fiumi, le montagne, e il santuario sui Colli di Vesper dove una volta, a ogni cambio di stagione, tutti salivano a girare la grande ruota di pietra. Da quando il Sole tace le stagioni si stanno spegnendo, e i loro sacerdoti sono diventati i custodi di quello che ne resta: chiamano gli elementi come si chiama un vecchio che non sente più bene, ad alta voce, e con pazienza._\n\n### Livello 3: Incantesimi del Dominio della Ruota\n\nHai sempre preparati gli incantesimi indicati qui sotto, ai livelli da chierico indicati. Non contano nel numero degli incantesimi che puoi preparare.\n\n| Livello da chierico | Incantesimi |\n|---|---|\n| 3 | _creare o distruggere acqua_, _folata di vento_, _onda tonante_, _sfera infuocata_ |\n| 5 | _protezione dall\u0027energia_, _tempesta di nevischio_ |\n| 7 | _pelle di pietra_, _scudo di fuoco_ |\n| 9 | _evoca elementale_, _reincarnazione_ |\n\n### Livello 3: Mani della Ruota\n\nOttieni competenza in un tipo di strumenti da artigiano a tua scelta e in un\u0027abilità a tua scelta tra Natura, Religione e Sopravvivenza.\n\n### Livello 3: Scintille delle Stagioni\n\nImpari un trucchetto a tua scelta tra _produrre fiamma_, _raggio di gelo_, _randello incantato_ e _stretta folgorante_, che per te conta come un incantesimo da chierico. Inoltre, quando lanci un incantesimo da chierico di 1° livello o superiore, puoi lanciare quel trucchetto come azione bonus nello stesso turno, anche se di solito non potresti lanciare un altro incantesimo. Puoi farlo un numero di volte pari al tuo modificatore di Saggezza (minimo 1), e recuperi gli usi spesi al termine di un riposo lungo.\n\n### Livello 3: Incanalare Divinità · Respiro delle Stagioni\n\nCon un\u0027azione alzi il simbolo sacro e chiami una delle quattro stagioni. L\u0027effetto è immediato, e accanto a te compare uno spiritello della stagione, che usa le statistiche del mefitico indicato (senza i suoi incantesimi innati). Lo spiritello resta finché non scende a 0 PF, finché non cadi privo di sensi o per 1 minuto. Ti obbedisce telepaticamente, e agisce subito dopo di te a partire dal tuo turno successivo.\n- **L\u0027Estate.** Una vampata di braci e di cenere riempie un cono di 9 m davanti a te: ogni creatura nel cono subisce danni da fuoco pari a 1d4 + il tuo modificatore di Saggezza. Compare un mefitico del vapore.\n- **L\u0027Autunno.** Un vento forte ti solleva: ottieni una velocità di volare di 9 m fino alla fine del tuo turno successivo, e ogni creatura di taglia Grande o inferiore entro 6 m da te viene spinta di 3 m lontano da te. Compare un mefitico della polvere.\n- **La Primavera.** Una pioggia violenta cade in un raggio di 9 m intorno a te: spegne ogni fiamma non magica, e fino alla fine del tuo turno successivo tutte le creature nell\u0027area hanno resistenza ai danni da fuoco. Compare un mefitico del vapore.\n- **L\u0027Inverno.** Il terreno sotto di te gela e si spacca in un quadrato di 6 m di lato, centrato su di te, che diventa terreno difficile. Ogni creatura di taglia Grande o inferiore nell\u0027area, tranne te, cade Prona. Compare un mefitico della polvere.\n\n### Livello 6: Egida degli Elementi\n\nQuando subisci danni da freddo, da fulmine, da fuoco o da tuono, puoi usare la reazione per spendere uno slot incantesimo di 1° livello o superiore. I danni si riducono di 1d8 per ogni livello dello slot speso.\n\n### Livello 6: Colpo della Stagione\n\nLe stagioni ti prestano il loro modo di ferire. Quando un incantesimo da chierico o un tuo privilegio da chierico infligge danni radianti o necrotici, puoi trasformarli in danni da freddo, da fulmine, da fuoco o da tuono, a tua scelta. Inoltre i trucchetti delle _Scintille delle Stagioni_ ignorano la resistenza al tipo di danni che infliggono.\n\n### Livello 17: Ritmo della Ruota\n\nQuando lanci un incantesimo del Dominio della Ruota di 1° livello o superiore, tira 1d6. Se il risultato è pari o inferiore al livello dell\u0027incantesimo, recuperi un uso di Incanalare Divinità, senza superare il massimo.\n\n---"},{"cl":"Druido","n":"Circolo del Cairn","md":"_A sud-ovest di Athredheim c\u0027è un tumulo di sassi dove si lasciano i morti che nessuno reclama. Qualcuno se ne
