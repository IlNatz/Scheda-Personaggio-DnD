iù il modificatore di caratteristica da incantatore dell\u0027incantatore.\n\n**Luce ustionante.** Il bersaglio effettua un tiro salvezza su Destrezza, subendo 6d12 danni radiosi in caso di fallimento, o la metà dei danni in caso di successo.\n\nFino al termine dell\u0027incantesimo, una luce intensa riempie il cilindro e, quando l\u0027incantatore si muove nel suo turno, può spostare anche il cilindro fino a 9 metri.\n\nOgni volta che il cilindro si muove nello spazio di una creatura che l\u0027incantatore è in grado di vedere e ogni volta che una creatura che l\u0027incantatore è in grado di vedere entra nel cilindro o vi termina il suo turno, l\u0027incantatore può immergerla in una di queste luci. Una creatura può essere influenzata da questo incantesimo solo una volta per turno.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni e la guarigione aumentano di 1d12 per ogni slot di livello superiore al 7º."},{"n":"Evoca creature boschive","lv":4,"sc":"Evocazione di 4º livello (Druido, Ranger)","cl":"Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore evoca degli spiriti della natura che gli fluttuano attorno in un\u0027emanazione di 3 metri per la durata dell\u0027incantesimo. Ogni volta che l\u0027emanazione entra nello spazio di una creatura che l\u0027incantatore è in grado di vedere e ogni volta che una creatura che l\u0027incantatore è in grado di vedere entra nell\u0027emanazione o vi termina il suo turno, l\u0027incantatore può costringerla a effettuare un tiro salvezza su Saggezza. In caso di fallimento, subisce 5d8 danni da forza, o la metà dei danni in caso di successo. Una creatura effettua questo tiro salvezza solo una volta per turno.\n\nInoltre, per la durata dell\u0027incantesimo, l\u0027incantatore può effettuare l\u0027azione di Disimpegno come azione bonus.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 4º."},{"n":"Evoca elementale","lv":5,"sc":"Evocazione di 5º livello (Druido, Mago)","cl":"Druido, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore può evocare uno spirito intangibile di taglia Grande dai Piani Elementali che appare in uno spazio libero entro gittata. L\u0027incantatore sceglie l\u0027elemento dello spirito, che ne determina il tipo di danno: aria (fulmine), terra (tuono), fuoco (fuoco) o acqua (freddo). Lo spirito permane per la durata dell\u0027incantesimo.\n\nOgni volta che una creatura che l\u0027incantatore è in grado di vedere entra nello spazio dello spirito o inizia il suo turno entro un raggio di 1,5 metri da esso, l\u0027incantatore può costringerla a effettuare un tiro salvezza su Destrezza, a patto che lo spirito non stia trattenendo una creatura. In caso di fallimento, il bersaglio subisce 8d8 danni del tipo dello spirito, e il bersaglio è trattenuto fino al termine dell\u0027incantesimo. All\u0027inizio di ogni suo turno, il bersaglio trattenuto ripete il tiro. In caso di fallimento, il bersaglio subisce 4d8 danni del tipo determinato dallo spirito. In caso di successo, il bersaglio non è più trattenuto dallo spirito.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 4º."},{"n":"Evoca elementali minori","lv":4,"sc":"Evocazione di 4º livello (Druido, Mago)","cl":"Druido, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore evoca degli spiriti dai Piani Elementali che gli fluttuano attorno in un\u0027emanazione di 4,5 metri per la durata dell\u0027incantesimo. Fino al termine dell\u0027incantesimo, ogni attacco effettuato dall\u0027incantatore infligge 2d8 danni extra quando colpisce una creatura nell\u0027emanazione. I danni inflitti sono da acido, freddo, fuoco o fulmine (a scelta dell\u0027incantatore quando effettua l\u0027attacco). Inoltre, il terreno all\u0027interno dell\u0027emanazione diventa terreno difficile per i nemici.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 4º."},{"n":"Evoca folletto","lv":6,"sc":"Evocazione di 6º livello (Druido)","cl":"Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore evoca uno spirito di taglia Media dalla Selva Fatata in uno spazio libero entro gittata che egli è in grado di vedere. Lo spirito permane per la durata dell\u0027incantesimo e ha le sembianze di una creatura fatata a scelta dell\u0027incantatore. Quando lo spirito appare, l\u0027incantatore può effettuare un attacco in mischia con incantesimo contro una creatura entro 1,5 metri dallo spirito. Se il colpo va a segno, il bersaglio subisce danni psichici pari a 3d12 più il modificatore di caratteristica da incantatore dell\u0027incantatore. Inoltre, il bersaglio è spaventato fino all\u0027inizio del turno successivo dell\u0027incantatore, con l\u0027incantatore e lo spirito come fonti della sua paura.\n\nCome azione bonus nei suoi turni successivi, l\u0027incantatore può teletrasportare lo spirito in uno spazio libero che è in grado di vedere, a una distanza massima di 9 metri dal punto in cui si trovava prima, ed effettuare l\u0027attacco contro una creatura entro 1,5 metri dallo spirito.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d12 per ogni slot di livello superiore al 6º."},{"n":"Evocazioni istantanee","lv":6,"sc":"Evocazione di 6º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto o rituale\n**Gittata:** contatto\n**Componenti:** V, S, M (uno zaffiro del valore di 1.000 mo o più)\n**Durata:** finché non viene dissolto\n\nL\u0027incantatore tocca lo zaffiro utilizzato per lanciare l\u0027incantesimo e un oggetto del peso pari o inferiore a 5 kg e la cui dimensione più lunga sia pari o inferiore a 1,8 metri. L\u0027incantesimo imprime un marchio invisibile su quell\u0027oggetto e traccia in modo invisibile il nome dell\u0027oggetto sullo zaffiro. Ogni volta che l\u0027incantatore lancia questo incantesimo, deve utilizzare uno zaffiro diverso.\n\nSuccessivamente, l\u0027incantatore può effettuare un\u0027azione di Magia per pronunciare il nome dell\u0027oggetto e distruggere lo zaffiro. L\u0027oggetto appare immediatamente nella mano dell\u0027incantatore, a prescindere dalle distanze fisiche o planari e l\u0027incantesimo termina.\n\nSe un\u0027altra creatura impugna o trasporta l\u0027oggetto, la distruzione dello zaffiro non comporta l\u0027apparizione dell\u0027oggetto, ma l\u0027incantatore apprende invece chi è la creatura in suo possesso e l\u0027ubicazione attuale."},{"n":"Fabbricare","lv":4,"sc":"Trasmutazione di 4º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** 36 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore converte materie prime in prodotti dello stesso materiale. Per esempio, può fabbricare un ponte di legno da una catasta di tronchi, una corda da un groviglio di canapa o abiti da lino o lana.\n\nL\u0027incantatore sceglie materie prime entro gittata che egli è in grado di vedere e, qualora ne possegga una quantità sufficiente, può fabbricare un oggetto di taglia Grande o inferiore (contenuto in un cubo con spigolo di 3 metri o in otto cubi con spigolo di 1,5 metri collegati tra loro). Tuttavia, se l\u0027incantatore lavora con metallo, pietra o un\u0027altra sostanza minerale, l\u0027oggetto fabbricato potrà essere al massimo di taglia Media (contenuto in un cubo con spigolo di 1,5 metri). La qualità degli oggetti realizzati è basata sulla qualità delle materie prime. Questo incantesimo non può creare creature o oggetti magici. Inoltre, l\u0027incantatore non può utilizzarlo per creare oggetti che richiedono un alto grado di precisione, come armi o armature, a meno che non possegga competenza con il tipo di strumenti da artigiano usati per realizzare tali oggetti."},{"n":"Faro di speranza","lv":3,"sc":"Abiurazione di 3º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore sceglie un qualsiasi numero di creature entro gittata. Per la durata dell\u0027incantesimo, ogni bersaglio dispone di vantaggio ai tiri salvezza su Saggezza, ai tiri salvezza contro morte e recupera il numero massimo di punti ferita possibile da qualsiasi guarigione."},{"n":"Fatale","lv":9,"sc":"Illusione di 9º livello (Mago, Warlock)","cl":"Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore tenta di creare orrori illusori nella mente degli avversari. Ogni creatura a sua scelta all\u0027interno di una sfera con raggio di 9 metri, centrata su un punto entro gittata, effettua un tiro salvezza su Saggezza. In caso di fallimento, il bersaglio subisce 10d10 danni psichici ed è spaventato per la durata dell\u0027incantesimo. Se invece lo supera, subisce soltanto la metà di quei danni.\n\nUn bersaglio spaventato effettua un tiro salvezza su Saggezza alla fine di ogni suo turno. In caso di fallimento, subisce 5d10 danni psichici, mentre in caso di successo l\u0027incantesimo termina."},{"n":"Favore divino","lv":1,"sc":"Trasmutazione di 1º livello (Paladino)","cl":"Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** 1 minuto\n\nFino al termine dell\u0027incantesimo, i suoi attacchi con le armi infliggono 1d4 danni radiosi extra se il colpo va a segno."},{"n":"Ferire","lv":6,"sc":"Necromanzia di 6º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore scatena una malattia virulenta su una creatura entro gittata che egli è in grado di vedere. Il bersaglio effettua un tiro salvezza su Costituzione. Se lo fallisce, subisce 14d6 danni necrotici, e i suoi punti ferita massimi vengono ridotti di una quantità pari ai danni necrotici subiti, mentre se lo supera, subisce solo la metà dei danni. Questo incantesimo non può ridurre i punti ferita massimi del bersaglio a meno di 1."},{"n":"Fermare il tempo","lv":9,"sc":"Trasmutazione di 9º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V\n**Durata:** istantanea\n\nL\u0027incantatore interrompe brevemente lo scorrere nel tempo per tutti tranne che per se stesso. Per le altre creature il tempo non passa, mentre l\u0027incantatore effettua 1d4 + 1 turni consecutivamente, nel corso dei quali può usare azioni e muoversi normalmente.\n\nQuesto incantesimo termina se una delle azioni usate o qualsiasi effetto creato dall\u0027incantatore nel corso della sua durata influenza una creatura diversa da lui o un oggetto indossato o trasportato da qualcuno diverso da lui. Termina inoltre se l\u0027incantatore si muove in un luogo a più di 300 metri dal punto in cui ha lanciato l\u0027incantesimo."},{"n":"Fiamma perenne","lv":2,"sc":"Invocazione di 2º livello (Chierico, Druido, Mago)","cl":"Chierico, Druido, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (polvere di rubino del valore di 50 mo o più, che l\u0027incantesimo consuma)\n**Durata:** finché non viene dissolto\n\nUna fiamma si sprigiona da un oggetto toccato dall\u0027incantatore. L\u0027effetto proietta luce intensa in un raggio di 6 metri e luce fioca per ulteriori 6 metri. L\u0027effetto è quello di una fiamma comune, ma non genera calore e non utilizza combustibile. La fiamma può essere coperta o nascosta, ma non soffocata o estinta."},{"n":"Fiamma sacra","lv":0,"sc":"Trucchetto di Invocazione (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nUn bagliore simile a una fiamma discende su una creatura entro gittata che egli è in grado di vedere. Il bersaglio deve superare un tiro salvezza su Destrezza, altrimenti subisce 1d8 danni radiosi. Per questo tiro salvezza, il bersaglio non trae beneficio dalla mezza copertura o dai tre quarti di copertura.\n\n**Trucchetto potenziato.** I danni aumentano di 1d8 quando l\u0027incantatore raggiunge il 5º livello (2d8), l\u002711º livello (3d8) e il 17º livello (4d8)."},{"n":"Fiotto acido","lv":0,"sc":"Trucchetto di Invocazione (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore crea una bolla di acido in un punto entro gittata, dove la bolla esplode in una sfera del raggio di 1,5 metri. Ogni creatura all\u0027interno della sfera deve superare un tiro salvezza su Destrezza, altrimenti subisce 1d6 danni da acido.\n\n**Trucchetto potenziato.** I danni aumentano di 1d6 quando l\u0027incantatore raggiunge il 5º livello (2d6), l\u002711º livello (3d6) e il 17º livello (4d6)."},{"n":"Folata di vento","lv":2,"sc":"Invocazione di 2º livello (Druido, Ranger, Mago, Stregone)","cl":"Druido, Ranger, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (un seme di legume)\n**Durata:** concentrazione, fino a 1 minuto\n\nUna linea di vento forte lunga 18 metri e ampia 3 metri viene indirizzata dall\u0027incantatore in una direzione a sua scelta per la durata dell\u0027incantesimo. Ogni creatura sulla linea deve superare un tiro salvezza su Forza, altrimenti viene spinta per 4,5 metri lontano dall\u0027incantatore nella direzione della linea. Una creatura che termina il suo turno sulla linea deve effettuare lo stesso tiro salvezza. Qualsiasi creatura sulla linea deve usare 60 centimetri di movimento per ogni 30 centimetri percorsi per avvicinarsi all\u0027incantatore.\n\nLa folata può disperdere gas o vapore e spegne candele e simili fiamme non protette nell\u0027area. Le fiamme protette, come quelle delle lanterne, tremolano e hanno il 50% di possibilità di spegnersi. Come azione bonus nei suoi turni successivi, l\u0027incantatore può modificare la direzione in cui indirizzare la linea."},{"n":"Fondersi nella pietra","lv":3,"sc":"Trasmutazione di 3º livello (Chierico, Druido, Ranger)","cl":"Chierico, Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** contatto\n**Componenti:** V, S\n**Durata:** 8 ore\n\nL\u0027incantatore entra in un oggetto o in una superficie di pietra sufficientemente grande da contenere il suo corpo, fondendosi con esso insieme al suo l\u0027equipaggiamento per la durata dell\u0027incantesimo. Per farlo, l\u0027incantatore deve toccare la pietra, e nulla della sua presenza rimane visibile o individuabile da qualsiasi senso non magico.\n\nMentre è fuso nella pietra, l\u0027incantatore non può vedere ciò che accade al di fuori e subisce svantaggio in qualsiasi prova di Saggezza (Percezione) effettuata per udire i suoni all\u0027esterno. Rimane tuttavia cosciente del passare del tempo e può lanciare incantesimi su di sé. L\u0027incantatore può usare 1,5 metri del suo movimento per uscire dalla pietra nel punto in cui è entrato, ponendo fine all\u0027incantesimo; altrimenti, non può muoversi.\n\nEventuali danni fisici minori inflitti alla pietra non danneggiano l\u0027incantatore, ma una distruzione parziale o un\u0027alterazione nella forma (al punto da non contenerne più il corpo) provoca l\u0027espulsione dell\u0027incantatore, infliggendogli 6d6 danni da forza. La completa distruzione della pietra (o la sua trasmutazione in una sostanza differente) provoca l\u0027espulsione dell\u0027incantatore e gli infligge 50 danni da forza. Se l\u0027incantatore viene espulso, cade a terra prono nello spazio libero più vicino al punto in cui era entrato."},{"n":"Forma eterea","lv":7,"sc":"Evocazione di 7º livello (Bardo, Chierico, Mago, Stregone, Warlock)","cl":"Bardo, Chierico, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** Fino a 8 ore\n\nL\u0027incantatore mette piede nelle regioni di confine in cui il Piano Etereo si sovrappone al suo piano attuale. Rimane nel Confine Etereo per la durata dell\u0027incantesimo. Durante questo periodo, l\u0027incantatore può muoversi in ogni direzione. Muovendosi su o giù, ogni 30 cm di movimento gli costano 30 cm extra. L\u0027incantatore può percepire il piano da cui proviene, che appare in scala di grigi ed è visibile solo fino a una distanza di 18 metri.\n\nMentre si trova sul Piano Etereo, l\u0027incantatore può influenzare ed essere influenzato solo dalle creature, gli oggetti e gli effetti che si trovano su quel piano. Le creature che non sono presenti sul Piano Etereo non possono percepire o interagire con l\u0027incantatore, a meno che un privilegio non dia loro la capacità per farlo.\n\nAl termine dell\u0027incantesimo, l\u0027incantatore torna sul piano da cui proviene, sul punto che corrisponde al suo spazio nel Confine Etereo. Se l\u0027incantatore appare in uno spazio occupato, viene sbalzato nello spazio libero più vicino e subisce una quantità di danni da forza pari al doppio del numero di metri di cui si è mosso.\n\nQuesto incantesimo termina all\u0027istante se l\u0027incantatore lo lancia mentre si trova sul Piano Etereo o su un piano non confinante, come uno dei Piani Esterni.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare fino a un massimo di tre creature consenzienti (incluso se stesso) per ogni slot di livello superiore al 7º. Al momento del lancio dell\u0027incantesimo, le creature non devono trovarsi a più di 3 metri dall\u0027incantatore."},{"n":"Forma gassosa","lv":3,"sc":"Trasmutazione di 3º livello (Mago, Stregone, Warlock)","cl":"Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (un pezzo di garza)\n**Durata:** concentrazione, fino a 1 ora\n\nUna creatura consenziente, toccata dall\u0027incantatore, muta forma, insieme a tutto ciò che indossa o trasporta, trasformandosi in una nube fosca per la durata dell\u0027incantesimo. L\u0027effetto svanisce se il bersaglio scende a 0 punti ferita o se effettua un\u0027azione di Magia per terminare l\u0027incantesimo su di sé.\n\nMentre si trova in questa forma, una velocità di volo di 3 metri è l\u0027unico metodo di movimento del bersaglio, che può fluttuare e può entrare nello spazio di un\u0027altra creatura e occuparlo. Il bersaglio è resistente ai danni contundenti, perforanti e taglienti; è immune alla condizione prono; dispone di vantaggio ai tiri salvezza su Forza, Destrezza e Costituzione. Il bersaglio può passare attraverso aperture strette, tuttavia tratta i liquidi come fossero superfici solide.\n\nIl bersaglio non può parlare o manipolare oggetti e quelli che trasporta o impugna non possono essere lasciati cadere, usati o manipolati in alcun modo. Infine, il bersaglio non può attaccare o lanciare incantesimi.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 3º."},{"n":"Forme animali","lv":8,"sc":"Trasmutazione di 8º livello (Druido)","cl":"Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S\n**Durata:** 24 ore\n\nL\u0027incantatore sceglie un qualsiasi numero di creature consenzienti entro gittata che egli è in grado di vedere. Ogni bersaglio muta forma in una bestia Grande o Piccola a scelta, con un grado di sfida pari o inferiore a 4. L\u0027incantatore può scegliere una forma differente per ogni bersaglio e, nei turni successivi, può effettuare un\u0027azione di Magia per trasformare nuovamente i bersagli.\n\nLe statistiche della bestia scelta sostituiscono le statistiche di gioco del bersaglio, il cui tipo di creatura non cambia. Inoltre, il bersaglio conserva i punti ferita, i dadi vita, il proprio allineamento, l\u0027abilità di comunicare e i punteggi di Intelligenza, Saggezza e Carisma. Le azioni del bersaglio sono limitate dalla forma anatomica della bestia scelta, che non può lanciare incantesimi. L\u0027equipaggiamento del bersaglio si fonde nella nuova forma e non può essere utilizzato finché non viene assunta di nuovo la forma originale.\n\nIl bersaglio guadagna un numero di punti ferita temporanei pari ai punti ferita della prima forma in cui viene mutato. Al termine dell\u0027incantesimo, il bersaglio perde tutti i punti ferita temporanei rimasti. La trasformazione permane per la durata dell\u0027incantesimo o finché il bersaglio non la termina come azione bonus."},{"n":"Frantumare","lv":2,"sc":"Invocazione di 2º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (un frammento di mica)\n**Durata:** istantanea\n\nUn rumore assordante esplode da un punto a scelta dell\u0027incantatore entro gittata. Ogni creatura all\u0027interno di una sfera di 3 metri di raggio centrata su quel punto effettua un tiro salvezza su Costituzione. In caso di fallimento, subisce 3d8 danni da tuono o la metà dei danni in caso di successo. Un costrutto subisce svantaggio al tiro salvezza. Anche un oggetto non magico che non sia indossato o trasportato subisce i danni se si trova entro l\u0027area dell\u0027incantesimo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 2º."},{"n":"Freccia acida","lv":2,"sc":"Invocazione di 2º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 27 metri\n**Componenti:** V, S, M (foglia di rabarbaro in polvere)\n**Durata:** istantanea\n\nUna freccia verde scintillante sfreccia verso un bersaglio entro gittata ed esplode in uno spruzzo di acido. L\u0027incantatore effettua un attacco a distanza con incantesimo contro il bersaglio. Se il colpo va a segno, il bersaglio subisce 4d4 danni da acido e 2d4 danni da acido alla fine del suo turno successivo. Se il colpo manca, la freccia schizza acido sul bersaglio, infliggendo solo la metà dei danni iniziali.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni (sia iniziali che successivi) aumentano di 1d4 per ogni slot di livello superiore al 2º."},{"n":"Fulmine","lv":3,"sc":"Invocazione di 3º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (un ciuffo di pelo e una verga di cristallo)\n**Durata:** istantanea\n\nUn fulmine parte dall\u0027incantatore in una direzione a sua scelta, formando una linea lunga 30 metri e larga 1,5 metri. Ogni creatura sulla linea effettua un tiro salvezza su Destrezza; se lo fallisce, subisce 8d6 danni da fulmine, mentre se lo supera subisce la metà dei danni.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d6 per ogni slot di livello superiore al 3º."},{"n":"Fuorviare","lv":5,"sc":"Illusione di 5º livello (Bardo, Mago, Warlock)","cl":"Bardo, Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** S\n**Durata:** concentrazione, fino a 1 ora\n\nL\u0027incantatore diventa invisibile nello stesso momento in cui un suo sosia illusorio appare nel punto in cui si trova. Il sosia permane per la durata dell\u0027incantesimo, ma l\u0027invisibilità termina se non appena l\u0027incantatore effettua un tiro per colpire, infligge danni o lancia un incantesimo.\n\nCome azione di Magia, l\u0027incantatore può muovere il sosia illusorio fino al doppio della sua velocità e farlo gesticolare, parlare e comportare nel modo che ritiene più opportuno. Il sosia è intangibile e invulnerabile.\n\nInoltre, l\u0027incantatore può vedere e sentire attraverso il sosia, come se si trovasse nello stesso punto."},{"n":"Gabbia di forza","lv":7,"sc":"Invocazione di 7º livello (Bardo, Mago, Warlock)","cl":"Bardo, Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 30 metri\n**Componenti:** V, S, M (polvere di rubino del valore di 1.500 mo o più, che l\u0027incantesimo consuma)\n**Durata:** concentrazione, fino a 1 ora\n\nUna prigione cubica di forza magica invisibile e immobile si materializza intorno a un\u0027area entro gittata scelta dall\u0027incantatore. La prigione può essere una gabbia o una struttura solida a sua scelta.\n\nUna prigione a forma di gabbia può misurare fino a 6 metri per lato ed essere composta da sbarre di 1,25 centimetri di diametro disposte a 1,25 centimetri di distanza. Una prigione a forma di scatola chiusa può misurare fino a 3 metri per lato e crea una barriera compatta che impedisce a ogni tipo di materia di passarle attraverso e blocca qualsiasi incantesimo lanciato verso l\u0027interno o l\u0027esterno dell\u0027area.\n\nAl momento del lancio dell\u0027incantesimo, ogni creatura completamente all\u0027interno dell\u0027area della gabbia è intrappolata. Le creature situate solo parzialmente all\u0027interno dell\u0027area o quelle di dimensioni troppo grandi per essere contenute al suo interno sono spinte lontano dal centro dell\u0027area finché non ne fuoriescono completamente.\n\nUna creatura all\u0027interno della gabbia non può uscirne tramite mezzi non magici. Se la creatura prova a utilizzare il teletrasporto o il viaggio interplanare, deve prima effettuare un tiro salvezza su Carisma. Se lo supera, la creatura può usare quella magia per uscire dalla gabbia, mentre se lo fallisce, non può uscire dalla gabbia e spreca un uso di quell\u0027incantesimo o effetto. La gabbia si estende anche sul Piano Etereo, bloccando i viaggi eterei. Questo incantesimo non può essere dissolto con dissolvi magie."},{"n":"Giara magica","lv":6,"sc":"Necromanzia di 6º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** incantatore\n**Componenti:** V, S, M (una gemma, un cristallo o un reliquiario del valore di 500 mo o più)\n**Durata:** finché non viene dissolto\n\nIl corpo dell\u0027incantatore cade in uno stato catatonico e la sua anima lo abbandona entrando nel contenitore utilizzato come componente materiale dell\u0027incantesimo. Mentre la sua anima si trova all\u0027interno del contenitore, l\u0027incantatore è consapevole di ciò che accade intorno a lui come se si trovasse nello spazio del contenitore. L\u0027incantatore non può muoversi o effettuare reazioni, l\u0027unica azione che può effettuare è proiettare la propria anima fino a 30 metri fuori dal contenitore, tornando nel suo corpo (e così terminando l\u0027incantesimo) o provando a prendere possesso di un corpo di un umanoide.\n\nL\u0027incantatore può tentare di possedere un qualsiasi umanoide entro 30 metri da lui che egli è in grado di vedere (tranne le creature protette da un incantesimo protezione dal bene e dal male o cerchio magico). Il bersaglio effettua un tiro salvezza su Carisma. In caso di fallimento, l\u0027anima dell\u0027incantatore entra nel corpo del bersaglio, la cui anima viene intrappolata nel contenitore. In caso di successo, il bersaglio resiste agli sforzi dell\u0027incantatore di possederlo e quest\u0027ultimo non può riprovare per le 24 ore successive.\n\nQuando l\u0027incantatore prende possesso del corpo di una creatura, ne ha il pieno controllo. I suoi punti ferita, Dadi Vita, Forza, Destrezza, Costituzione, Velocità e sensi vengono sostituiti da quelli della creatura. Altrimenti, l\u0027incantatore conserva le proprie statistiche di gioco.\n\nNel frattempo, l\u0027anima della creatura posseduta può percepire ciò che accade intorno al contenitore utilizzando i propri sensi, ma non può muoversi ed è incapacitata.\n\nMentre è in possesso di un corpo, l\u0027incantatore può effettuare la sua azione di Magia per tornare nel contenitore se si trova entro 30 metri da lui, riportando l\u0027anima della creatura ospite nel suo corpo. Se il corpo ospite muore mentre l\u0027incantatore si trova al suo interno, anche la creatura muore e l\u0027incantatore effettua un tiro salvezza su Carisma contro la CD del suo stesso incantesimo. In caso di successo, l\u0027incantatore torna nel contenitore, che deve tuttavia trovarsi entro 30 metri da lui; altrimenti muore.\n\nSe il contenitore viene distrutto o l\u0027incantesimo termina, l\u0027anima dell\u0027incantatore torna nel suo corpo. Tuttavia, se il suo corpo si trova a più di 30 metri da lui o se è morto, anche l\u0027incantatore muore. Se l\u0027anima di un\u0027altra creatura si trova all\u0027interno del contenitore quando viene distrutto, questa ritorna nel suo corpo, a patto che sia vivo e si trovi entro 30 metri; altrimenti, la creatura muore. Al termine dell\u0027incantesimo, il contenitore viene distrutto."},{"n":"Glifo di interdizione","lv":3,"sc":"Abiurazione di 3º livello (Bardo, Chierico, Mago)","cl":"Bardo, Chierico, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 ora\n**Gittata:** contatto\n**Componenti:** V, S, M (polvere di diamante del valore di 200 mo o più, che l\u0027incantesimo consuma)\n**Durata:** finché non viene dissolto o innescato\n\nL\u0027incantatore traccia un glifo da cui, in seguito, si sprigionerà un effetto magico. Il glifo può essere tracciato su una superficie (come un tavolo o una sezione di pavimento) o, al fine di nasconderlo, all\u0027interno di un oggetto che può essere chiuso (come un libro o un forziere). Il glifo può coprire un\u0027area massima del diametro di 3 metri. Se la superficie o l\u0027oggetto viene spostato per più di 3 metri dal punto in cui l\u0027incantatore ha lanciato questo incantesimo, il glifo si infrange e l\u0027incantesimo termina senza essere innescato.\n\nIl glifo è quasi impercettibile e, per notarlo, è necessario superare una prova di Saggezza (Percezione) contro la CD del tiro salvezza sull\u0027incantesimo.\n\nQuando l\u0027incantatore traccia il glifo, ne programma l\u0027innesco e sceglie se si tratta di una runa esplosiva o di un glifo magico, come illustrato di seguito.\n\n**Programmare l\u0027innesco.** Quando questo incantesimo viene lanciato, l\u0027incantatore decide cosa innesca il glifo. Nel caso di glifi tracciati su una superficie, gli inneschi più comuni includono: toccare o camminare su di essi, rimuovere un altro oggetto che li copre o avvicinarsi a una certa distanza da loro. Nel caso di glifi tracciati all\u0027interno di un oggetto, gli inneschi più comuni includono aprire quell\u0027oggetto o vedere il glifo. Una volta che un glifo viene innescato, l\u0027incantesimo termina. L\u0027incantatore può perfezionare l\u0027innesco in modo che venga attivato solo da un certo tipo di creature (ad esempio, il glifo potrebbe essere programmato per influenzare le aberrazioni). L\u0027incantatore può inoltre impostare delle condizioni per evitare di innescare il glifo, come pronunciare una specifica parola d\u0027ordine.\n\n**Runa esplosiva.** Quando attivato, il glifo esplode in una sfera di energia magica con raggio di 6 metri centrata su di esso. Ogni creatura presente nell\u0027area effettua un tiro salvezza su Destrezza. In caso di fallimento, subisce 5d8 danni da acido, freddo, fulmine, fuoco o tuono (a scelta dell\u0027incantatore al momento della creazione del glifo), o la metà dei danni in caso di successo.\n\n**Glifo magico.** L\u0027incantatore può custodire un incantesimo preparato di 3º livello o inferiore all\u0027interno del glifo lanciandolo come parte del suo processo di creazione. L\u0027incantesimo deve avere come bersaglio una sola creatura o un\u0027area. In questo modo, l\u0027incantesimo custodito non ha effetto immediato, ma ha effetto quando il glifo si attiva. Se l\u0027incantesimo ha un bersaglio, risulterà essere la creatura che ha attivato il glifo, mentre se influenza un\u0027area, tale area sarà centrata su quella creatura. Se l\u0027incantesimo evoca creature ostili oppure crea oggetti o trappole dannose, ciò che viene evocato o creato appare nel punto più vicino possibile all\u0027intruso e lo attacca. Se l\u0027incantesimo richiede concentrazione, permane per tutta la sua durata.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni di una runa esplosiva aumentano di 1d8 per ogni slot di livello superiore al 3º. Se l\u0027incantatore crea un glifo magico, può custodirvi qualsiasi incantesimo di livello pari o inferiore a quello dello slot incantesimo usato per il glifo di interdizione."},{"n":"Globo cromatico","lv":1,"sc":"Invocazione di 1º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 27 metri\n**Componenti:** V, S, M (un diamante del valore di 50 mo o più)\n**Durata:** istantanea\n\nL\u0027incantatore scaglia un globo di energia contro un bersaglio entro gittata. Può scegliere che tipo di globo creare tra acido, freddo, fulmine, fuoco, tuono o veleno, e poi effettuare un attacco a distanza con incantesimo contro il bersaglio. Se il colpo va a segno, il bersaglio subisce 3d8 danni del tipo scelto. Se l\u0027incantatore ottiene lo stesso risultato su due o più d8, il globo schizza verso un altro bersaglio a scelta dell\u0027incantatore che si trovi entro 9 metri dal primo bersaglio. L\u0027incantatore effettua un tiro per colpire contro il secondo bersaglio e anche un altro tiro per i danni. Il globo non può più schizzare verso un altro bersaglio, a meno che l\u0027incantatore non lanci l\u0027incantesimo usando uno slot incantesimo di 2º livello o superiore.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 1º. Il globo può schizzare verso un altro bersaglio un numero massimo di volte pari al livello dello slot incantesimo consumato, ed è possibile bersagliare una creatura soltanto una volta per ogni lancio di questo incantesimo."},{"n":"Globo di invulnerabilità","lv":6,"sc":"Abiurazione di 6º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (una perla di vetro)\n**Durata:** concentrazione, fino a 1 minuto\n\nUna barriera scintillante e immobile si materializza in un\u0027emanazione di 3 metri attorno all\u0027incantatore e permane per la durata dell\u0027incantesimo.\n\nQualsiasi incantesimo di 5º livello o inferiore lanciato dall\u0027esterno della barriera non può influenzare niente che si trovi al suo interno. Questo tipo di incantesimo può essere rivolto contro le creature e gli oggetti all\u0027interno della barriera, senza tuttavia avere effetti su di loro. Allo stesso modo, l\u0027area all\u0027interno della barriera è esclusa dalle aree di effetto create da questo tipo di incantesimi.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La barriera blocca incantesimi superiori di 1 livello per ogni slot di livello superiore al 6º."},{"n":"Guardiani spirituali","lv":3,"sc":"Evocazione di 3º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (una pergamena con una preghiera)\n**Durata:** concentrazione, fino a 10 minuti\n\nDegli spiriti protettori fluttuano attorno al personaggio in un\u0027emanazione di 4,5 metri per la durata dell\u0027incantesimo. Se l\u0027incantatore è buono o neutrale, la loro forma spettrale appare angelica o fatata (a scelta dell\u0027incantatore). Se è malvagio, appaiono con sembianze demoniache.\n\nQuando l\u0027incantatore lancia questo incantesimo, può indicare le creature che non ne saranno influenzate. All\u0027interno dell\u0027emanazione, la velocità di ogni altra creatura è dimezzata e, ogni volta che una creatura entra nel suo spazio e viceversa, o ogni volta che vi termina lì il turno, dovrà effettuare un tiro salvezza su Saggezza. Se lo fallisce, subisce 3d8 danni radiosi (se l\u0027incantatore è buono o neutrale) o 3d8 danni necrotici (se è malvagio), mentre se lo supera subisce soltanto la metà di quei danni. Una creatura effettua questo tiro salvezza solo una volta per turno.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 3º."},{"n":"Guardiano della fede","lv":4,"sc":"Evocazione di 4º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V\n**Durata:** 8 ore\n\nPer la durata dell\u0027incantesimo, un guardiano spettrale di taglia Grande compare e fluttua in uno spazio libero entro gittata che l\u0027incantatore è in grado di vedere. Il guardiano occupa quello spazio ed è invulnerabile: assume inoltre una forma appropriata alla divinità o al pantheon dell\u0027incantatore. Qualsiasi nemico si muova in uno spazio entro 3 metri dal guardiano per la prima volta in un turno o che inizi il proprio turno lì, effettua un tiro salvezza su Destrezza. In caso di fallimento, subisce 20 danni radiosi o la metà dei danni in caso di successo. Il guardiano svanisce quando ha inflitto un totale di 60 danni."},{"n":"Guarigione","lv":6,"sc":"Abiurazione di 6º livello (Chierico, Druido)","cl":"Chierico, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore sceglie una creatura entro gittata che egli è in grado di vedere. Un flusso di energia positiva investe il bersaglio, facendogli recuperare 70 punti ferita. Inoltre, questo incantesimo termina le condizioni accecato, assordato e avvelenato che affliggono il bersaglio.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La guarigione aumenta di 10 per ogni slot di livello superiore al 6º."},{"n":"Guarigione di massa","lv":9,"sc":"Abiurazione di 9º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nUn\u0027ondata di energia curativa si sprigiona dall\u0027incantatore, investendo le creature intorno a lui. In questo modo, ripristina fino a 700 punti ferita, ripartendoli come desidera tra un qualsiasi numero di creature entro gittata che egli è in grado di vedere. Le creature guarite da questo incantesimo vengono inoltre curate dalle condizioni accecato, assordato e avvelenato."},{"n":"Guida","lv":0,"sc":"Trucchetto di Divinazione (Chierico, Druido)","cl":"Chierico, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componente:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore tocca una creatura consenziente e sceglie un\u0027abilità. Fino al termine dell\u0027incantesimo, la creatura aggiunge 1d4 a qualsiasi prova di caratteristica effettuata utilizzando l\u0027abilità scelta."},{"n":"Guscio anti-vita","lv":5,"sc":"Abiurazione di 5º livello (Druido)","cl":"Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 ora\n\nUn\u0027aura si estende dall\u0027incantatore in un\u0027emanazione di 3 metri e permane per la durata dell\u0027incantesimo, impedendo a tutte le creature che non siano non morti e costrutti di attraversarla o protendersi oltre essa. Una creatura influenzata può lanciare incantesimi o effettuare attacchi utilizzando armi a distanza o con portata attraverso la barriera. Se l\u0027incantatore si muove in modo che una creatura influenzata sia costretta ad attraversare la barriera, l\u0027incantesimo termina."},{"n":"Identificare","lv":1,"sc":"Divinazione di 1º livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto o rituale\n**Gittata:** contatto\n**Componenti:** V, S, M (una perla del valore di 100 mo o più)\n**Durata:** istantanea\n\nL\u0027incantatore tocca un oggetto per la durata del lancio dell\u0027incantesimo. Se si tratta di un oggetto magico o di un altro oggetto infuso di magia, apprende le sue proprietà e come usarlo, se richiede sintonia e quante cariche contiene, se ce ne sono. Apprende anche se l\u0027oggetto è influenzato da eventuali incantesimi in corso e di quali si tratta. Se l\u0027oggetto è stato creato da un incantesimo, l\u0027incantatore apprende il nome di quell\u0027incantesimo. Se invece durante il lancio dell\u0027incantesimo l\u0027incantatore tocca una creatura, apprende quali incantesimi in corso la stanno influenzando, se ce ne sono."},{"n":"Illusione minore","lv":0,"sc":"Trucchetto di Illusione (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** S, M (un ciuffo di lana)\n**Durata:** 1 minuto\n\nL\u0027incantatore crea un suono o un\u0027immagine di un oggetto entro gittata che permane per la durata dell\u0027incantesimo. Di seguito sono descritti gli effetti di ciascuno di essi. L\u0027illusione termina se l\u0027incantatore lancia nuovamente l\u0027incantesimo.\n\nSe una creatura effettua l\u0027azione di Studio per esaminare il suono o l\u0027immagine, può determinare che si tratta di un\u0027illusione superando una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull\u0027incantesimo. Se una creatura riconosce l\u0027illusione per ciò che è, l\u0027illusione risulta attenuata per quella creatura.\n\n**Suono.** Se l\u0027incantatore crea un suono, la sua intensità può variare da quella di un sussurro a quella di un urlo. Può trattarsi della voce dell\u0027incantatore o di altri, del ruggito di un leone, di un rullo di tamburi o di un qualsiasi altro suono a sua scelta. Il suono può echeggiare ininterrottamente per tutta la durata dell\u0027incantesimo, oppure l\u0027incantatore può emettere dei suoni separati in momenti diversi prima che l\u0027incantesimo termini.\n\n**Immagine.** Se l\u0027incantatore crea l\u0027immagine di un oggetto (come per esempio una sedia, una serie di impronte nel fango o uno scrigno), quell\u0027oggetto non deve essere più grande di un cubo con spigolo di 1,5 metri. L\u0027illusione non può emettere suoni, luci, odori o qualsiasi altro effetto sensoriale L\u0027illusione può essere rivelata da un\u0027interazione fisica, poiché gli oggetti possono attraversarla."},{"n":"Illusione programmata","lv":6,"sc":"Illusione di 6º livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S, M (polvere di giada del valore di 25 mo o più)\n**Durata:** finché non viene dissolto\n\nL\u0027incantatore crea un\u0027illusione di un oggetto, una creatura o qualche altro fenomeno visibile entro gittata che si attiva al verificarsi di un innesco specifico. Fino ad allora, l\u0027illusione è impercettibile. Inoltre, essa non può essere più grande di un cubo con spigolo di 9 metri ed è l\u0027incantatore, al momento del lancio, a decidere come si comporta e quali suoni emette. Questa esibizione programmata può durare un massimo di 5 minuti.\n\nQuando l\u0027innesco specificato si verifica, l\u0027illusione si materializza e si comporta nella maniera descritta dall\u0027incantatore. Al termine della sua esibizione, l\u0027illusione scompare e rimane latente per 10 minuti, dopo i quali può essere attivata nuovamente.\n\nL\u0027innesco può essere sia generale che dettagliato, ma deve essere basato su fenomeni visibili o udibili che si verificano entro 9 metri dall\u0027area. Per esempio, l\u0027incantatore potrebbe creare un\u0027illusione di se stesso per avvertire coloro che tentano di aprire una porta protetta da una trappola.\n\nL\u0027illusione può essere rivelata da un\u0027interazione fisica, poiché gli oggetti possono attraversarla. Una creatura che effettua l\u0027azione di Studio per esaminare l\u0027immagine può determinare che si tratta di un\u0027illusione superando una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull\u0027incantesimo. Se una creatura riconosce l\u0027illusione per ciò che è, riesce a vedere attraverso l\u0027immagine e gli eventuali suoni che emette si attenuano alle sue orecchie."},{"n":"Immagine maggiore","lv":3,"sc":"Illusione di 3º livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S, M (un ciuffo di lana)\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore crea l\u0027immagine di un oggetto, una creatura o qualche altro fenomeno visibile che non sia più grande di un cubo con spigolo di 6 metri. L\u0027immagine, apparendo in un punto situato entro gittata che l\u0027incantatore è in grado di vedere, permane per la durata dell\u0027incantesimo. L\u0027immagine sembra reale e include temperature, suoni e odori appropriati all\u0027elemento raffigurato, ma non può infliggere danni o causare condizioni.\n\nSe l\u0027incantatore si trova entro la gittata dell\u0027immagine illusoria, può effettuare la sua azione di Magia per fare in modo che l\u0027immagine si muova fino a un qualsiasi altro punto entro gittata. Mentre l\u0027immagine è in movimento, l\u0027incantatore può alterarne l\u0027aspetto in modo che i movimenti risultino naturali. Ad esempio, se l\u0027incantatore crea l\u0027immagine di una creatura e decide di farla muovere, può alterare l\u0027immagine in modo da simulare che stia camminando. Analogamente, può fare in modo che l\u0027illusione generi suoni diversi in momenti diversi, in modo da, per esempio, farle persino sostenere una conversazione.\n\nL\u0027illusione può essere rivelata da un\u0027interazione fisica, poiché è possibile passarle attraverso. Una creatura che effettua l\u0027azione di Studio per esaminare l\u0027immagine può determinare che si tratta di un\u0027illusione superando una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull\u0027incantesimo. Se una creatura riconosce l\u0027illusione per ciò che è, riesce a vedere attraverso l\u0027immagine, di cui si attenuano le altre caratteristiche sensoriali.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantesimo dura finché non viene dissolto, e non necessita di concentrazione, se viene lanciato con uno slot incantesimo 4º livello o superiore."},{"n":"Immagine proiettata","lv":7,"sc":"Illusione di 7º livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 800 chilometri\n**Componenti:** V, S, M (una statuetta dell\u0027incantatore del valore di 5 mo o più)\n**Durata:** concentrazione, fino a 1 giorno\n\nL\u0027incantatore crea una copia illusoria di se stesso che permane per la durata dell\u0027incantesimo.\n\nLa copia può apparire in qualsiasi luogo entro gittata che l\u0027incantatore abbia visto in precedenza, a prescindere dalla presenza di ostacoli. L\u0027illusione assomiglia in tutto e per tutto all\u0027incantatore, ma è intangibile. Inoltre, se subisce danni, scompare e l\u0027incantesimo termina.\n\nL\u0027incantatore può vedere e sentire attraverso gli occhi e le orecchie dell\u0027illusione, come se si trovasse nel suo spazio. Come azione di Magia, l\u0027incantatore può muovere l\u0027illusione fino a 18 metri e farla gesticolare, parlare e comportare nel modo che ritiene più opportuno. L\u0027illusione imita i modi di fare dell\u0027incantatore alla perfezione.\n\nL\u0027illusione può essere rivelata da un\u0027interazione fisica, poiché gli oggetti possono attraversarla. Una creatura che effettua l\u0027azione di Studio per esaminare l\u0027immagine può determinare che si tratta di un\u0027illusione superando una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull\u0027incantesimo. Se una creatura riconosce l\u0027illusione per ciò che è, riesce a vedere attraverso l\u0027immagine e gli eventuali suoni che emette si attenuano alle sue orecchie."},{"n":"Immagine silenziosa","lv":1,"sc":"Illusione di 1º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (un ciuffo di lana)\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore crea l\u0027immagine di un oggetto, una creatura o qualche altro fenomeno visibile che non sia più grande di un cubo con spigolo di 4,5 metri. L\u0027immagine compare in un punto situato entro gittata e permane per la durata dell\u0027incantesimo. L\u0027immagine è puramente visiva: non è accompagnata da suoni, odori o altri effetti sensoriali. Come azione di Magia, il personaggio può far muovere l\u0027immagine verso qualunque posizione entro gittata. Mentre l\u0027immagine è in movimento, l\u0027incantatore può alterarne l\u0027aspetto in modo che i movimenti risultino naturali. Ad esempio, se l\u0027incantatore crea l\u0027immagine di una creatura e decide di farla muovere, può modificarla per simulare il fatto che sta camminando.\n\nL\u0027illusione può essere rivelata da un\u0027interazione fisica, poiché gli oggetti possono attraversarla. Una creatura che effettua l\u0027azione di Studio per esaminare l\u0027immagine può determinare che si tratta di un\u0027illusione superando una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull\u0027incantesimo. Se una creatura riconosce l\u0027illusione per ciò che è, riesce a vedere attraverso l\u0027immagine."},{"n":"Immagine speculare","lv":2,"sc":"Illusione di 2º livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** 1 minuto\n\nTre duplicati illusori dell\u0027incantatore appaiono nel suo spazio. Fino al termine dell\u0027incantesimo, i duplicati si muovono con l\u0027incantatore e imitano le sue azioni, cambiando posizione in modo che sia impossibile individuare quale sia l\u0027immagine reale. Ogni volta che una creatura colpisce l\u0027incantatore con tiro per colpire nel corso della durata dell\u0027incantesimo, l\u0027incantatore tira un d6 per ognuno dei duplicati rimasti. Se uno qualsiasi dei risultati che ottiene è pari o superiore a 3, uno dei duplicati subisce il colpo al posto dell\u0027incantatore, e poi viene distrutto. Altrimenti, i duplicati ignorano tutti gli altri danni o effetti. L\u0027incantesimo termina quando tutti e i tre duplicati vengono distrutti.\n\nUna creatura non è influenzata da questo incantesimo se è accecata o se ha vista cieca o vista pura."},{"n":"Imprigionare","lv":9,"sc":"Abiurazione di 9º livello (Mago, Warlock)","cl":"Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** 9 metri\n**Componenti:** V, S, M (una statuetta del bersaglio del valore di 5.000 mo o più)\n**Durata:** finché non viene dissolto\n\nL\u0027incantatore crea una costrizione magica per trattenere una creatura entro gittata che egli è in grado di vedere. Il bersaglio deve effettuare un tiro salvezza su Saggezza. In caso di successo, il bersaglio non viene influenzato ed è immune a questo incantesimo per le 24 ore successive. In caso di fallimento, il bersaglio è imprigionato. Mentre è imprigionato, il bersaglio non ha bisogno di respirare, mangiare o bere, e non invecchia. Gli incantesimi di divinazione non possono localizzare il bersaglio imprigionato e questo non può teletrasportarsi. Inoltre, fino al termine dell\u0027incantesimo, il bersaglio subisce uno dei seguenti effetti a scelta dell\u0027incantatore:\n\n**Ceppi.** Il bersaglio è bloccato da una serie di catene saldamente ancorate al terreno. Il bersaglio è trattenuto e non può essere spostato in alcun modo.\n\n**Prigione protetta.** Il bersaglio è intrappolato in un semipiano protetto da teletrasporto e viaggi planari. Il semipiano può essere un labirinto, una gabbia, una torre o una struttura simile, a scelta dell\u0027incantatore.\n\n**Prigionia ridotta.** Il bersaglio viene rimpicciolito fino all\u0027altezza di 2,5 centimetri ed è intrappolato in una gemma indistruttibile o un oggetto simile. La luce passa attraverso la gemma (permettendo al bersaglio di guardare all\u0027esterno e alle altre creature di guardare all\u0027interno), ma nient\u0027altro può attraversarla in alcun modo.\n\n**Sepoltura.** Il bersaglio viene sepolto nelle viscere della terra in un globo di forza magica sufficientemente ampio da contenerlo. Nulla può entrare o uscire dal globo.\n\n**Sonno.** Il bersaglio è privo di sensi e non può essere risvegliato.\n\nPorre fine all\u0027incantesimo. Quando lancia l\u0027incantesimo, l\u0027incantatore specifica un innesco che porrà fine all\u0027incantesimo. L\u0027innesco può essere tanto semplice quanto complesso, in base alla scelta dell\u0027incantatore, ma il GM deve ritenere che abbia una certa probabilità di verificarsi entro i dieci anni successivi. L\u0027innesco deve essere un\u0027azione osservabile, ad esempio: una persona che fa un\u0027offerta particolare al tempio della divinità dell\u0027incantatore, il salvataggio del vero amore dell\u0027incantatore, o la sconfitta di un mostro specifico.\n\nDissolvi magie può porre fine a questo incantesimo solo se viene lanciato con uno slot incantesimo di 9º livello, bersagliando la prigione o la componente usata per crearla."},{"n":"Inaridire","lv":4,"sc":"Necromanzia di 4º livello (Druido, Mago, Stregone, Warlock)","cl":"Druido, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nUna creatura entro gittata che l\u0027incantatore è in grado di vedere effettua un tiro salvezza su Costituzione, subendo 8d8 danni necrotici in caso di fallimento, o la metà dei danni in caso di successo. Una creatura vegetale fallisce automaticamente il tiro salvezza.\n\nIn alternativa, l\u0027incantatore bersaglia un vegetale non magico che non sia una creatura, come un albero o un arbusto. Il vegetale non effettua il tiro salvezza, semplicemente appassisce e muore.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 4º."},{"n":"Individuazione dei pensieri","lv":2,"sc":"Divinazione di 2º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (1 pezzo di rame)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore attiva uno dei seguenti effetti. Fino al termine dell\u0027incantesimo, può attivare entrambi gli effetti come azione di Magia nei suoi turni successivi.\n\n**Pensieri sensoriali.** L\u0027incantatore percepisce la presenza di pensieri entro 9 metri da sé appartenenti a creature che conoscono delle lingue o che comunicano telepaticamente. L\u0027incantatore non legge nel pensiero, ma avverte la presenza di una creatura pensante.\n\nL\u0027incantesimo viene bloccato da 30 cm di pietra, terriccio o legno, 2,5 centimetri di metallo o una sottile lamina di piombo.\n\n**Lettura del pensiero.** L\u0027incantatore bersaglia una creatura entro 9 metri da sé che egli è in grado di vedere o che ha individuato con l\u0027opzione Pensieri sensoriali e apprende i pensieri superficiali del bersaglio, ciò che sta pensando in quel momento. Se il bersaglio non conosce alcuna lingua e non comunica telepaticamente, l\u0027incantatore non apprende nulla. Come azione di Magia nel suo turno successivo, l\u0027incantatore può provare a scavare più in profondità nella mente della creatura. Nell\u0027ultimo caso, il bersaglio effettua un tiro salvezza su Saggezza. In caso di fallimento, l\u0027incantatore ha accesso ai suoi ragionamenti, al suo stato emotivo e a ciò che principalmente riempie la sua mente (qualcosa di cui si preoccupa, che ama o odia). In caso di successo, l\u0027incantesimo termina. In ogni caso, il bersaglio è consapevole che l\u0027incantatore ha accesso alla sua mente e, se quest\u0027ultimo non distoglie la sua attenzione dalla mente del bersaglio, il bersaglio può usare un\u0027azione nel proprio turno per effettuare una prova di Intelligenza (Arcano) contro la CD del tiro salvezza sull\u0027incantesimo; in caso di successo, l\u0027incantesimo termina."},{"n":"Individuazione del bene e del male","lv":1,"sc":"Divinazione di 1º livello (Chierico, Paladino)","cl":"Chierico, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nPer la durata dell\u0027incantesimo, l\u0027incantatore percepisce la posizione di aberrazioni, celestiali, elementali, folletti, immondi o non morti entro 9 metri di distanza da sé. Percepisce inoltre se l\u0027incantesimo santificare è attivo e, se sì, dove.\n\nL\u0027incantesimo viene bloccato da 30 cm di pietra, terriccio o legno, 2,5 centimetri di metallo o una sottile lamina di piombo."},{"n":"Individuazione delle malattie e dei veleni","lv":1,"sc":"Divinazione di 1º livello (Chierico, Druido, Paladino, Ranger)","cl":"Chierico, Druido, Paladino, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** incantatore\n**Componenti:** V, S, M (una foglia di tasso)\n**Durata:** concentrazione, fino a 10 minuti\n\nPer la durata dell\u0027incantesimo, l\u0027incantatore percepisce l\u0027ubicazione di veleni, creature velenose e contagi magici entro 9 metri da sé. Inoltre, in ciascun caso può identificare il tipo di veleno, di creatura velenosa o di malattia.\n\nL\u0027incantesimo viene bloccato da 30 cm di pietra, terriccio o legno, 2,5 centimetri di metallo o una sottile lamina di piombo."},{"n":"Individuazione del magico","lv":1,"sc":"Divinazione di 1º livello (Bardo, Chierico, Druido, Mago, Paladino, Ranger, Stregone, Warlock)","cl":"Bardo, Chierico, Druido, Mago, Paladino, Ranger, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nPer la durata dell\u0027incantesimo, l\u0027incantatore percepisce la presenza di effetti magici entro 9 metri da sé. Se percepisce tali effetti, può eseguire un azione di Magia per vedere una debole aura attorno a ogni creatura o oggetto visibile nell\u0027area che contenga magia e apprende di che scuola di magia si tratta, se ne esiste una.\n\nL\u0027incantesimo viene bloccato da 30 cm di pietra, terriccio o legno, 2,5 centimetri di metallo o una sottile lamina di piombo."},{"n":"Infliggi ferite","lv":1,"sc":"Necromanzia di 1º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S\n**Durata:** istantanea\n\nUna creatura toccata dall\u0027incantatore effettua un tiro salvezza su Costituzione, subendo 2d10 danni necrotici in caso di fallimento, o la metà dei danni in caso di successo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d10 per ogni slot di livello superiore al 1º."},{"n":"Ingrandire/ridurre","lv":2,"sc":"Trasmutazione di 2º livello (Bardo, Druido, Mago, Stregone)","cl":"Bardo, Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S, M (un pizzico di polvere di ferro)\n**Durata:** concentrazione, fino a 1 minuto\n\nPer la durata dell\u0027incantesimo, l\u0027incantatore ingrandisce o riduce una creatura o un oggetto entro gittata che egli è in grado di vedere (vedi di seguito l\u0027effetto scelto). L\u0027oggetto bersaglio non deve essere né indossato né trasportato. Se il bersaglio è una creatura non consenziente, può effettuare un tiro salvezza su Costituzione. Se lo supera, l\u0027incantesimo non sortisce alcun effetto.\n\nTutto ciò che la creatura indossa o trasporta cambia di taglia insieme a lei. Se un oggetto cade a terra, torna immediatamente alle sue dimensioni normali. Le armi da lancio e le munizioni tornano alle loro dimensioni normali subito dopo aver colpito o mancato un bersaglio.\n\n**Ingrandire.** La taglia del bersaglio aumenta di una categoria (da Media a Grande, per esempio). Il bersaglio dispone anche di vantaggio alle prove di Forza e ai tiri salvezza su Forza. Gli attacchi effettuati dal bersaglio con armi ingrandite o con colpi senz\u0027armi infliggono 1d4 danni extra se il colpo va a segno.\n\n**Ridurre.** La taglia del bersaglio diminuisce di una categoria (da Media a Piccola, per esempio). Il bersaglio dispone anche di svantaggio alle prove di Forza e ai tiri salvezza su Forza. Gli attacchi effettuati dal bersaglio con armi ridotte o con colpi senz\u0027armi infliggono 1d4 danni in meno se il colpo va a segno (i danni non possono scendere a meno di 1)."},{"n":"Insetto gigante","lv":4,"sc":"Evocazione di 4º livello (Druido)","cl":"Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore evoca un millepiedi gigante, un ragno gigante o una vespa gigante (a sua scelta al momento del lancio). L\u0027insetto si manifesta in uno spazio libero entro gittata che l\u0027incantatore è in grado di vedere e utilizza la scheda delle statistiche dell\u0027 insetto gigante. La forma scelta dall\u0027incantatore determina alcuni dettagli della sua scheda delle statistiche. La creatura scompare quando scende a 0 punti ferita o quando l\u0027incantesimo termina. ed è un alleato per il personaggio e i suoi alleati. In combattimento, la creatura ha lo stesso punteggio di iniziativa dell\u0027incantatore, ma inizia il turno immediatamente dopo il suo, obbedendo ai suoi comandi verbali (nessuna azione richiesta da parte dell\u0027incantatore). Se l\u0027incantatore non pronuncia comandi verbali, la creatura compie l\u0027azione di Schivata e usa il suo movimento per sottrarsi al pericolo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** Usa il livello dello slot incantesimo relativo al livello dell\u0027incantesimo nella scheda delle statistiche.\n\n#### Insetto gigante\n\nBestia Grande, senza allineamento\nCA 11 + il livello dell\u0027incantesimo\nPF 30 + 10 per ogni livello di incantesimo sopra il 4º\nVelocità 12 m, scalata 12 m, volo 12 m (solo vespa)\nMOD SALV MOD SALV MOD SALV\nFor 17 +3 +3 Des 13 +1 +1 Cos 15 +2 +2\nInt 4 −3 −3 Sag 14 +2 +2 Car 3 −4 −4\nSensi Percezione passiva 12; scurovisione 18 m\nLingue comprende le lingue parlate dal personaggio\nGS nessuno (PE 0; BC pari al bonus di competenza del\npersonaggio)\n\n#### Tratti\n\nMovimenti del ragno. L\u0027insetto può scalare le superfici\ndifficili, compresi i soffitti, senza effettuare una prova di\ncaratteristica.\n\n#### Azioni\n\nMultiattacco. L\u0027insetto effettua un numero di attacchi\npari alla metà del livello di quest\u0027incantesimo (arrotondando per difetto).\nColpo velenoso. Tiro per colpire in mischia: Il bonus\nequivale al modificatore di attacco dell\u0027incantesimo del\npersonaggio, portata di 3 metri. Colpito: 1d6 + 3 più\nil livello dell\u0027incantesimo danni perforanti e 1d4 danni\nda veleno.\nDardo di ragnatela (solo ragno). Tiro per colpire\na distanza: il bonus equivale al modificatore di attacco\ndell\u0027incantesimo del personaggio, gittata di 18 metri.\nColpito: 1d10 + 3 più il livello dell\u0027incantesimo danni\ncontundenti. Inoltre, la velocità del bersaglio è ridotta\na 0 fino all\u0027inizio del turno successivo dell\u0027insetto.\n\n#### Azioni bonus\n\nRigurgito velenoso (solo millepiedi). Tiro salvezza su\nCostituzione: CD del tiro salvezza sull\u0027incantesimo,\nuna creatura che l\u0027insetto può vedere entro 3 metri.\nFallimento: il bersaglio è avvelenato fino all\u0027inizio del\nturno successivo dell\u0027insetto."},{"n":"Interdizione alla morte","lv":4,"sc":"Abiurazione di 4º livello (Chierico, Paladino)","cl":"Chierico, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S\n**Durata:** 8 ore\n\nL\u0027incantatore tocca una creatura e le concede una misura di protezione dalla morte. La prima volta che il bersaglio scende a 0 punti ferita prima del termine dell\u0027incantesimo, scende invece a 1 punto ferita e l\u0027incantesimo termina.\n\nSe l\u0027incantesimo è ancora attivo quando il bersaglio è soggetto a un effetto che ne provocherebbe la morte istantanea senza infliggere danni, quell\u0027effetto viene annullato e l\u0027incantesimo termina."},{"n":"Intermittenza","lv":3,"sc":"Trasmutazione di 3º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** 1 minuto\n\nL\u0027incantatore tira 1d6 alla fine di ogni suo turno per la durata dell\u0027incantesimo. Con un risultato di 4–6, l\u0027incantatore svanisce dal piano di esistenza in cui si trova per riapparire sul Piano Etereo (l\u0027incantesimo termina immediatamente se l\u0027incantatore si trova già su quel piano). Mentre si trova sul Piano Etereo, l\u0027incantatore può percepire il piano da cui proviene, che è proiettato in scala di grigi ed è visibile solo fino a una distanza di 18 metri. Può influenzare ed essere influenzato solo dalle creature che si trovano sul Piano Etereo, e le creature che si trovano sull\u0027altro piano non possono percepirlo a meno che non abbiano una capacità speciale che consenta loro di percepire le cose sul Piano Etereo.\n\nL\u0027incantatore fa ritorno sull\u0027altro piano all\u0027inizio del suo turno successivo e al termine dell\u0027incantesimo se si trova sul Piano Etereo, tornando in uno spazio libero a propria scelta egli è in grado di vedere entro 3 metri dallo spazio che ha abbandonato. Se nessuno spazio libero è disponibile entro quella distanza, l\u0027incantatore appare nello spazio libero più vicino."},{"n":"Intimorire infernale","lv":1,"sc":"Invocazione di 1º livello (Warlock)","cl":"Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** reazione, che l\u0027incantatore effettua quando subisce danni da una creatura che egli è in grado di vedere entro 18 metri da sé\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nLa creatura che ha inflitto danni all\u0027incantatore viene temporaneamente avviluppata da fiamme verdi. La creatura effettua un tiro salvezza su Destrezza, subendo 2d10 danni da fuoco in caso di fallimento, o la metà dei danni in caso di successo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d10 per ogni slot di livello superiore al 1º."},{"n":"Intralciare","lv":1,"sc":"Evocazione di 1º livello (Druido, Ranger)","cl":"Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 27 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nDei vegetali afferranti spuntano dal terreno in un quadrato di 6 metri per lato in un punto situato entro gittata. Per la durata dell\u0027incantesimo, i vegetali trasformano quell\u0027area in un terreno difficile. I vegetali scompaiono al termine dell\u0027incantesimo.\n\nQuando viene lanciato l\u0027incantesimo, ogni creatura diversa dall\u0027incantatore all\u0027interno dell\u0027area deve superare un tiro salvezza su Forza, altrimenti è trattenuta fino al termine dell\u0027incantesimo. Le creature trattenute possono usare un\u0027azione per effettuare una prova di Forza (Atletica) contro la CD del tiro salvezza sull\u0027incantesimo. In caso di successo, si liberano dai vegetali afferranti e non sono più trattenute."},{"n":"Inversione della gravità","lv":7,"sc":"Trasmutazione di 7º livello (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 30 metri\n**Componenti:** V, S, M (una calamita e limatura di ferro)\n**Durata:** concentrazione, fino a 1 minuto\n\nQuesto incantesimo inverte la gravità all\u0027interno di un cilindro del raggio di 15 metri e dell\u0027altezza di 30 metri centrato su un punto entro gittata. Tutte le creature e gli oggetti presenti nell\u0027area che non sono ancorati al terreno vengono trascinati verso l\u0027alto e raggiungono la parte superiore del cilindro. Una creatura può effettuare un tiro salvezza su Destrezza per afferrare un oggetto ancorato entro portata, evitando così di essere trascinata verso l\u0027alto.\n\nSe un soffitto o un oggetto ancorato viene urtato durante questa caduta, gli oggetti e le creature subiscono un impatto identico a quello che subirebbero durante una normale caduta verso il basso. Se una creatura o un oggetto influenzato arriva in cima al cilindro senza colpire niente, rimane lì a fluttuare per la durata dell\u0027incantesimo. Al termine dell\u0027incantesimo, le creature e gli oggetti influenzati cadono verso il basso."},{"n":"Inviare","lv":3,"sc":"Divinazione di 3º livello (Bardo, Chierico, Mago)","cl":"Bardo, Chierico, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** Illimitata\n**Componenti:** V, S, M (un filo di rame)\n**Durata:** istantanea\n\nL\u0027incantatore invia un breve messaggio di un massimo di 25 parole a una creatura che ha incontrato o a una creatura che gli è stata descritta da qualcuno che ha conosciuto. Il bersaglio sente il messaggio nella sua mente, riconosce l\u0027incantatore come colui che l\u0027ha inviato e può rispondere immediatamente allo stesso modo. L\u0027incantesimo consente ai bersagli di comprendere il significato del messaggio dell\u0027incantatore.\n\nL\u0027incantatore può inviare il messaggio a qualsiasi distanza e perfino ad altri piani di esistenza, ma se il bersaglio si trova su un piano di esistenza diverso dal suo, c\u0027è una probabilità del 5% che il messaggio non arrivi. Se l\u0027invio del messaggio fallisce, l\u0027incantatore se ne rende conto.\n\nQuando riceve il messaggio, una creatura può bloccare la capacità dell\u0027incantatore di contattarla nuovamente tramite questo incantesimo per 8 ore. Se l\u0027incantatore cerca di inviare un altro messaggio durante quel periodo, capisce di essere stato bloccato e l\u0027incantesimo fallisce."},{"n":"Invisibilità","lv":2,"sc":"Illusione di 2º livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (un ciglio in uno strato di resina)\n**Durata:** concentrazione, fino a 1 ora\n\nUna creatura toccata dall\u0027incantatore diventa invisibile fino al termine dell\u0027incantesimo. L\u0027incantesimo termina immediatamente quando il bersaglio effettua un tiro per colpire, infligge danni o lancia un incantesimo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 2º."},{"n":"Invisibilità superiore","lv":4,"sc":"Illusione di 4º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nUna creatura toccata dall\u0027incantatore diventa invisibile fino al termine dell\u0027incantesimo."},{"n":"Invocare il fulmine","lv":3,"sc":"Evocazione di 3º livello (Druido)","cl":"Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nUna nube di tempesta appare in un punto situato entro gittata che l\u0027incantatore è in grado di vedere sopra di sé. Ha la forma di un cilindro alto 3 metri con un raggio di 18 metri.\n\nQuando lancia questo incantesimo, l\u0027incantatore sceglie un punto che è in grado di vedere al di sotto della nube, dove si abbatte un fulmine originato da essa. Ogni creatura entro un raggio di 1,5 metri da quel punto effettua un tiro salvezza su Destrezza; se lo fallisce, subisce 3d10 danni da fulmine, mentre se lo supera subisce la metà di quei danni.\n\nFino al termine dell\u0027incantesimo, l\u0027incantatore può effettuare un\u0027azione di Magia per richiamare il fulmine in questo modo, bersagliando lo stesso punto o un punto diverso.\n\nSe l\u0027incantatore lancia questo incantesimo mentre si trova all\u0027aperto durante una tempesta, l\u0027incantesimo permette di controllare quella tempesta invece di crearne una nuova. In queste condizioni, i danni provocati dall\u0027incantesimo aumentano di 1d10.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d10 per ogni slot di livello superiore al 3º."},{"n":"Labirinto","lv":8,"sc":"Evocazione di 8º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore bandisce una creatura entro gittata che egli è in grado di vedere in un semipiano labirintico. Il bersaglio rimane laggiù per la durata dell\u0027incantesimo o finché non fugge dal labirinto. Il bersaglio può effettuare un\u0027azione di Studio per provare a fuggire. Quando questo avviene, effettua una prova di Intelligenza (Indagare) con CD 20. In caso di successo, il bersaglio fugge e l\u0027incantesimo termina.\n\nAl termine dell\u0027incantesimo, il bersaglio riappare nello spazio in cui si trovava prima del lancio o, se è occupato, nello spazio libero più vicino."},{"n":"Lama infuocata","lv":2,"sc":"Invocazione di 2º livello (Druido, Stregone)","cl":"Druido, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** incantatore\n**Componenti:** V, S, M (una foglia di sommacco)\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore evoca una lama infuocata nella sua mano libera. La lama ha forma e dimensioni simili a una scimitarra e permane per la durata dell\u0027incantesimo. Se l\u0027incantatore la lascia cadere, la lama scompare, ma può essere evocata di nuovo come azione bonus.\n\nCome azione di Magia, l\u0027incantatore può effettuare un attacco in mischia con la lama infuocata. Se il colpo va a segno, il bersaglio subisce 3d6 danni da fuoco più il modificatore di caratteristica da incantatore dell\u0027incantatore.\n\nLa lama infuocata emana luce intensa in un raggio di 3 metri e luce fioca per ulteriori 3 metri.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d6 per ogni slot di livello superiore al 2º."},{"n":"Legame planare","lv":5,"sc":"Abiurazione di 5º livello (Bardo, Chierico, Druido, Mago, Warlock)","cl":"Bardo, Chierico, Druido, Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 ora\n**Gittata:** 18 metri\n**Componenti:** V, S, M (un gioiello del valore di 1.000 mo o più, che l\u0027incantesimo consuma)\n**Durata:** 24 ore\n\nL\u0027incantatore tenta di vincolare un celestiale, un elementale, un folletto o un immondo al suo servizio. La creatura deve trovarsi entro gittata per l\u0027intera durata del lancio dell\u0027incantesimo (in genere, la creatura viene prima evocata al centro di una versione invertita dell\u0027incantesimo cerchio magico per tenerla intrappolata mentre questo incantesimo viene lanciato). Completato il lancio dell\u0027incantesimo, il bersaglio deve superare un tiro salvezza su Carisma, altrimenti è obbligato a servire l\u0027incantatore per la durata dell\u0027incantesimo. Se la creatura è stata evocata o creata da un altro incantesimo, la durata di quell\u0027incantesimo viene estesa per corrispondere alla durata di questo.\n\nUna creatura vincolata deve eseguire gli ordini al meglio delle sue capacità. L\u0027incantatore potrebbe ordinarle di accompagnarlo in un\u0027avventura, di proteggere un luogo o di consegnare un messaggio. Se la creatura è ostile, cercherà in tutti i modi di distorcere gli ordini dell\u0027incantatore per perseguire i suoi obiettivi personali. Se la creatura porta a termine gli ordini dell\u0027incantatore prima del termine dell\u0027incantesimo, si reca da lui per riferirglielo, ma solo se si trovano sullo stesso piano di esistenza. Se l\u0027incantatore si trova su un piano diverso, la creatura ritorna nel luogo in cui è stata vincolata e vi rimane fino al termine dell\u0027incantesimo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La durata aumenta con uno slot incantesimo di 6º livello (10 giorni), di 7º livello (30 giorni), di 8º livello (180 giorni) e di 9º livello (366 giorni)."},{"n":"Legame telepatico","lv":5,"sc":"Divinazione di 5º livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** 9 metri\n**Componenti:** V, S, M (due uova)\n**Durata:** 1 ora\n\nL\u0027incantatore stringe un legame telepatico con un massimo di otto creature consenzienti a sua scelta entro gittata, collegando mentalmente ogni creatura a tutte le altre per la durata dell\u0027incantesimo. Le creature che non sono in grado di comunicare in nessuna lingua, non sono influenzate da questo incantesimo.\n\nFino al termine dell\u0027incantesimo, i bersagli possono comunicare telepaticamente attraverso il legame, a prescindere dal fatto che condividano la stessa lingua. La comunicazione è possibile attraverso qualsiasi distanza, ma non può estendersi ad altri piani di esistenza."},{"n":"Lentezza","lv":3,"sc":"Trasmutazione di 3º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S, M (una goccia di melassa)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore altera il tempo intorno a un massimo di sei creature a sua scelta all\u0027interno in un cubo con spigolo di 12 metri entro gittata. Ogni bersaglio deve superare un tiro salvezza su Saggezza, altrimenti è influenzato da questo incantesimo per tutta la sua durata.\n\nUn bersaglio influenzato subisce una penalità di −2 alla CA e ai tiri salvezza su Destrezza, non può effettuare reazioni e la sua velocità è dimezzata. Quando è il suo turno, può effettuare un\u0027azione o un\u0027azione bonus, non entrambe. Inoltre, se sceglie di eseguire l\u0027azione di Attacco, può sferrare un solo attacco. Se lancia un incantesimo con una componente somatica, ha una probabilità di fallimento del 25%, poiché l\u0027incantatore effettua troppo lentamente i movimenti necessari al lancio.\n\nInoltre, ripeterà il tiro salvezza alla fine di ogni suo turno. Se lo supera, l\u0027incantesimo svanisce."},{"n":"Levitazione","lv":2,"sc":"Trasmutazione di 2º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (una molla in metallo)\n**Durata:** concentrazione, fino a 10 minuti\n\nUna creatura o un oggetto a scelta dell\u0027incantatore, situato entro gittata e che egli è in grado di vedere, si solleva verticalmente fino a 6 metri rimanendo sospeso per la durata dell\u0027incantesimo. L\u0027incantesimo può far levitare un oggetto che pesa fino a 250 kg. Una creatura non consen
