    if (+s.lv !== lv) { lv = +s.lv; h += `<h3 class="sotto">${lv ? lv + "° livello" : "Trucchetti"}</h3>`; }

    h += `<details class="apri"><summary><span class="nome">${esc(s.n)}</span>${lv ? `<button class="chip${s.prep ? " on" : ""}" data-a="prep" data-i="${i}" aria-pressed="${!!s.prep}">${s.prep ? "preparato" : "non preparato"}</button>` : ""}</summary><div class="dentro">
      ${V ? `<p class="nota">${esc(V.sc)}</p><div class="md">${md(V.md)}</div>` : `<textarea class="campo" data-k="magia.inc.${i}.testo" placeholder="Note sull'incantesimo (dal manuale)">${esc(s.testo)}</textarea>`}
      <div class="riga fine"><button class="btn piccolo" data-a="togliinc" data-i="${i}">Togli</button></div></div></details>`;
  });
  h += `<div class="riga" style="margin-top:10px"><button class="btn forte" data-a="nuovoinc">+ Aggiungi un incantesimo</button></div>`;
  if (D.srd) h += `<p class="nota" style="margin-top:18px;font-size:13px">${esc(D.srd)}</p>`;
 return h;
}

    <div class="riga" style="margin-top:8px">${spunta("patto.grande", pg.patto.grande, "Grande Tributo pagato dall'ultimo cambio di Grado")}</div>

  // incantesimi del patto
  const inc = c.ptGradi.filter(g => g.inc && g.inc !== "—");
  if (inc.length) {

    inc.forEach(g => { h += `<div class="riga" style="padding:4px 0"><label class="interr" style="flex:1"><input type="checkbox" data-k="patto.incUsati.${g.g}"${pg.patto.incUsati[g.g] ? " checked" : ""}>${esc(g.inc)}</label><span class="et">Grado ${g.g}</span></div>`; });

function regolaHtml(n) { const r = D.regole.find(x => x.n === n); return r ? `<details class="apri"><summary><span class="nome">${esc(r.n)}</span><span class="dx">regola</span></summary><div class="dentro md">${md(r.md)}</div></details>` : ""; }

}

      ${V ? `<p class="nota">${esc(V.tipo)}</p><div class="md">${md(V.md)}</div>` : `<div class="griglia2">${campo(`oggetti.${i}.n`, o.n, "Nome")}</div>`}
      <div class="griglia2" style="margin-top:6px">${num(`oggetti.${i}.q`, o.q, "Quanti")}${V ? "" : `<label class="etichettato"><span class="et">Note</span><input class="campo" data-k="oggetti.${i}.note" value="${esc(o.note)}"></label>`}</div>
     <div class="riga" style="margin-top:8px">${o.sint ? spunta(`oggetti.${i}.s`, o.s, "In sintonia") : (V ? "" : spunta(`oggetti.${i}.sint`, o.sint, "Richiede sintonia"))}${V && V.base ? `<button class="btn piccolo oro" data-a="oggarma" data-i="${i}">Mettilo tra le armi</button>` : ""}<button class="btn piccolo" data-a="toglioggetto" data-i="${i}" style="margin-left:auto">Togli</button></div></div></details>`;
  });

  c.cl.forEach((x, ci) => {
    const k = x.k;
    h += `<h2 class="sez">${esc(k.n)}<span class="dx">${x.lv}° livello</span></h2>`;
    const riga = rigaTabella(k, x.lv);
    if (riga.length) h += `<div class="chips" style="margin-bottom:8px">${riga.map(([a, b]) => `<span class="chip">${esc(a)}: <b>${esc(b)}</b></span>`).join("")}</div>`;
    if (k.v) {
      const ora = k.v.priv.filter(p => p.lv <= x.lv), poi = k.v.priv.filter(p => p.lv > x.lv);
      ora.forEach(p => { h += `<details class="apri"><summary><span class="nome">${esc(p.n)}</span><span class="dx">${p.lv}°</span></summary><div class="dentro md">${md(p.md)}</div></details>`; });
      const so = sottDellaNotte(k, x.sott);
      if (so) h += `<details class="apri"><summary><span class="nome"><b>${esc(so.n)}</b></span><span class="dx">sottoclasse</span></summary><div class="dentro md">${md(so.md)}</div></details>`;
      (k.v.extra || []).forEach(e => { h += `<details class="apri"><summary><span class="nome">${esc(e.t)}</span><span class="dx">da scegliere</span></summary><div class="dentro md">${md(e.md)}</div></details>`; });
      h += noteSott(pg, x, so);
      if (poi.length) h += `<p class="nota">Più avanti: ${poi.slice(0, 4).map(p => esc(p.n) + " (" + p.lv + "°)").join(", ")}${poi.length > 4 ? "…" : ""}</p>`;
    } else {
      const so = sottDellaNotte(k, x.sott);
      const au = automatici(x, c);
      if (au.ch.length) h += `<div class="chips" style="margin-bottom:8px">${au.ch.map(([a, b]) => `<span class="chip">${esc(a)}: <b>${esc(b)}</b></span>`).join("")}</div>`;
      const lista = privilegiManuale(k.n, so ? "" : x.sott, x.lv) || [];
      const ora = lista.filter(p => p.lv <= x.lv), poi = lista.filter(p => p.lv > x.lv);
      if (ora.length) h += `<ul class="privlista">${ora.map(p => `<li${p.s ? ` class="sott"` : ""}><span>${esc(p.n)}</span><span class="dx">${p.lv}°</span></li>`).join("")}</ul>`;
      if (so) h += `<details class="apri"><summary><span class="nome"><b>${esc(so.n)}</b></span><span class="dx">sottoclasse della Notte</span></summary><div class="dentro md">${md(so.md)}</div></details>`;
      h += noteSott(pg, x, so);
      if (poi.length) h += `<p class="nota">Più avanti: ${poi.slice(0, 4).map(p => esc(p.n) + " (" + p.lv + "°)").join(", ")}${poi.length > 4 ? "…" : ""}</p>`;
      if (ci === 0 || !c.cl.slice(0, ci).some(y => !y.k.v)) h += `<label class="etichettato" style="margin-top:8px"><span class="et">Note sui privilegi</span><textarea class="campo" data-k="privilegi" placeholder="Quello che ti serve ricordare dei privilegi, dal tuo manuale">${esc(pg.privilegi)}</textarea></label>`;
    }
  });
  if (!c.cl.length) h += `<p class="nota">Scegli una classe nella scheda.</p>`;
  // risorse
  h += `<h2 class="sez">Usi e cariche</h2>`;
  c.auto.forEach(r => {
    const u = Math.min(r.max, +pg.usiAuto[r.k] || 0), rest = r.max - u;
    const ric = r.ric === "breve" ? "riposo breve" : r.ric === "breve1" ? "una con il breve, tutte con il lungo" : "riposo lungo";
    h += `<div class="carta"><div class="capo"><span class="nome">${esc(r.n)}</span><span class="rar">${ric}</span></div><div style="margin-top:6px">${r.max > 12
      ? `<div class="riga"><span class="num" style="font-family:var(--f-titolo);font-size:24px;flex:1">${rest} / ${r.max}</span><button class="btn tondo" data-a="autouso" data-k="${esc(r.k)}" data-d="5" aria-label="Spendi 5">−5</button><button class="btn tondo" data-a="autouso" data-k="${esc(r.k)}" data-d="1" aria-label="Spendi 1">−</button><button class="btn tondo" data-a="autouso" data-k="${esc(r.k)}" data-d="-1" aria-label="Recupera 1">+</button></div>`
      : pips(r.max, rest, "autopip", `data-k="${esc(r.k)}" data-max="${r.max}"`, "oro")}</div></div>`;
  });
  if (!pg.risorse.length && !c.auto.length) h += `<p class="nota">Per tenere il conto di quello che si spende: Furia, Sgusciare, i Doni del patto, le cariche di un oggetto.</p>`;
  pg.risorse.forEach((r, i) => {
    const max = maxRisorsa(r, c), u = Math.min(max, +r.usati || 0);
    h += `<div class="carta"><div class="capo"><span class="nome">${esc(r.n || "Senza nome")}</span><span class="rar">${r.ric === "breve" ? "riposo breve" : r.ric === "lungo" ? "riposo lungo" : "a mano"}</span></div><div style="margin-top:6px">${pips(Math.min(max, 20), Math.min(20, max - u), "risorsa", `data-r="${i}"`, "oro")}</div>
      <details class="apri" style="margin-top:6px"><summary><span class="nome et">Modifica</span></summary><div class="dentro"><div class="griglia2">${campo(`risorse.${i}.n`, r.n, "Nome")}
      ${scelta(`risorse.${i}.max`, [...[1, 2, 3, 4, 5, 6, 8, 10].map(n => [String(n), String(n)]), ["BC", "Bonus di competenza"], ...AB.map(a => [a, "Modificatore di " + ABN[a]])], r.max, "Quante")}
      ${scelta(`risorse.${i}.ric`, [["breve", "Riposo breve"], ["lungo", "Riposo lungo"], ["mano", "Le recupero a mano"]], r.ric, "Tornano con")}</div><div class="riga fine"><button class="btn piccolo" data-a="togliris" data-i="${i}">Togli</button></div></div></details></div>`;
  });
  h += `<div class="riga" style="margin-top:8px"><button class="btn piccolo" data-a="nuovaris">+ Aggiungi un uso</button></div>`;
  h += `<h2 class="sez">Il personaggio</h2><div style="display:grid;gap:10px">
    <label class="etichettato"><span class="et">Aspetto</span><textarea class="campo" data-k="aspetto">${esc(pg.aspetto)}</textarea></label>
    <label class="etichettato"><span class="et">Storia e legami</span><textarea class="campo" data-k="storia">${esc(pg.storia)}</textarea></label>
    <label class="etichettato"><span class="et">Note</span><textarea class="campo" data-k="note" placeholder="Nomi, debiti, chi vi deve qualcosa">${esc(pg.note)}</textarea></label></div>`;
  h += `<h2 class="sez">Regole della casa</h2>${["Le Fiasche", "L'Ultima Difesa", "Il Colpo Critico", "Il Colpo di Grazia"].map(regolaHtml).join("")}`;
  return h;
}
function noteSott(pg, x, so) {
  if (!x.sott || so) return "";
  const n = pg.classi[x.i].sottNote || "";
  return `<label class="etichettato" style="margin-top:8px"><span class="et">Privilegi della sottoclasse · ${esc(x.sott)}</span><textarea class="campo" data-k="classi.${x.i}.sottNote" placeholder="I privilegi che ti dà la sottoclasse, livello per livello">${esc(n)}</textarea></label>`;
}
function maxRisorsa(r, c) { if (r.max === "BC") return c.bc; if (AB.includes(r.max)) return Math.max(1, c.m[r.max]); return Math.max(1, +r.max || 1); }

const VISTE = { scheda: vScheda, armi: vArmi, magia: vMagia, patto: vPatto, zaino: vZaino, tratti: vTratti };

function ridisegna() { const y = window.scrollY; render(); window.scrollTo(0, y); }

// ------------------------------------------------------------ il foglio dal basso
function foglio(titolo, html) { $("#f-tit").textContent = titolo; $("#f-corpo").innerHTML = html; $("#foglio").hidden = false; $("#f-corpo").scrollTop = 0; }
function chiudiFoglio() { $("#foglio").hidden = true; $("#f-corpo").innerHTML = ""; }
function scegliDaLista(titolo, voci, onScegli, intro = "") {
  // voci: [{g: gruppo, n, dx, sotto, v}]
  foglio(titolo, `${intro}<input class="campo" id="f-cerca" placeholder="Cerca" autocomplete="off" style="margin-bottom:10px"><ul class="lista" id="f-lista"></ul>`);
  const disegna = q => {
    q = (q || "").toLowerCase(); let g = null, h = "";
    voci.forEach((x, i) => {
      if (q && !(x.n + " " + (x.sotto || "") + " " + (x.g || "")).toLowerCase().includes(q)) return;
      if (x.g !== g) { g = x.g; if (g) h += `<li class="gruppo">${esc(g)}</li>`; }
      h += `<li><button data-scegli="${i}"><span class="nome">${esc(x.n)}${x.sotto ? `<span class="sotto">${esc(x.sotto)}</span>` : ""}</span><span class="dx">${esc(x.dx || "")}</span></button></li>`;
    });
    $("#f-lista").innerHTML = h || `<li class="vuoto">Niente con questo nome.</li>`;
  };
  disegna("");
  $("#f-cerca").addEventListener("input", e => disegna(e.target.value));
  $("#f-lista").addEventListener("click", e => { const b = e.target.closest("[data-scegli]"); if (!b) return; onScegli(voci[+b.dataset.scegli]); });
}

  nuovo() { const p = nuovoPg(); S.pg[p.id] = p; S.attivo = p.id; S.tab = "scheda"; salva(); chiudiFoglio(); render(); window.scrollTo(0, 0); },
  duplica() { const p = normalizza(JSON.parse(JSON.stringify(P()))); p.id = uid(); p.nome = (p.nome || "Senza nome") + " (copia)"; p.esempio = false; S.pg[p.id] = p; S.attivo = p.id; salva(); chiudiFoglio(); render(); },
  elimina() { foglio("Eliminare " + (P().nome || "questo personaggio") + "?", `<p>La scheda sparisce da questo dispositivo. Se non hai un file di salvataggio, non si recupera.</p><div class="riga fine"><button class="btn" data-a="menu">Annulla</button><button class="btn forte" data-a="eliminaok">Elimina</button></div>`); },
  eliminaok() { delete S.pg[S.attivo]; if (!Object.keys(S.pg).length) { const p = nuovoPg(); S.pg[p.id] = p; } S.attivo = Object.keys(S.pg)[0]; salva(); chiudiFoglio(); render(); },
  esporta(d) { esporta(d.v === "tutti"); },
  importa() { $("#importa-file").click(); },
  condividi(d) {
    const t = codice(d.v === "tutti"), msg = $("#cod-msg");
    if (!navigator.share) { msg.textContent = "Questo telefono non permette di condividere da qui: usa «Copia il codice»."; return; }
    navigator.share({ title: "Ultimo Raggio · " + (d.v === "tutti" ? "personaggi" : (P().nome || "personaggio")), text: t })
      .then(() => { msg.textContent = "Condiviso. Per ricaricarlo: menu, «Incolla un codice»."; })
      .catch(e => { if (!e || e.name !== "AbortError") msg.textContent = "Qui la condivisione non funziona: usa «Copia il codice»."; });
  },
  copiacodice() {
    const ta = $("#cod-t"), msg = $("#cod-msg");
    const fatto = () => { msg.textContent = "Codice copiato. Incollalo in una nota o in un messaggio a te stesso."; };
    const amano = () => { try { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); if (document.execCommand("copy")) { fatto(); return; } } catch (e) {} msg.textContent = "Il testo è selezionato: tienilo premuto e scegli Copia."; };
    try { navigator.clipboard.writeText(ta.value).then(fatto, amano); } catch (e) { amano(); }
  },
  scaricafile(d) { const tutti = d.v === "tutti"; const nome = (tutti ? "Ultimo Raggio · personaggi" : "Ultimo Raggio · " + (P().nome || "personaggio")).replace(/[\\/:*?"<>|]/g, "") + ".json"; salvaFile(nome, codice(tutti)); },
  incolla() { foglio("Incolla il codice di una scheda", `<textarea class="campo" id="inc-t" style="min-height:180px" placeholder="Incolla qui il codice"></textarea><div class="riga fine" style="margin-top:10px"><button class="btn forte" data-a="incollaok">Carica</button></div>`); },
  incollaok() { leggiImport($("#inc-t").value); },
  installa() { if (!installaEvento) return; installaEvento.prompt(); installaEvento.userChoice.finally(() => { installaEvento = null; chiudiFoglio(); }); }
};
function aggiungiArma(v) {
  const pg = P();
  const o = v.ogg;
  const base = o ? (arma(o.base) ? arma(o.base).n : "") : v.base;
  pg.armi.push({ id: uid(), nome: o ? o.n : (base || "Arma"), base, bonus: o ? o.bonus : 0, comp: true, car: "auto", extra: "", tacche: 0, nonAnn: !!(o && /non si anneriscono mai|non si annerisce mai/i.test(o.md)), temprata: false, ogg: o ? o.n : "", dado: "", tipo: "", due: false });
  salva(); S.tab = "armi"; ridisegna();
}
function mostraCodice(t) { foglio("Il codice della scheda", `<p class="nota">Selezionalo e copialo a mano, poi incollalo dove vuoi tenerlo.</p><textarea class="campo" style="min-height:200px" readonly onfocus="this.select()">${esc(t)}</textarea>`); }

// ------------------------------------------------------------ l'app installata: installazione e dati permanenti
let installaEvento = null, persistente = false;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installaEvento = e; });
if (window.WEBAPP) {
  try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => p || navigator.storage.persist()).then(p => { persistente = !!p; }); } catch (e) {}
}

// ------------------------------------------------------------ menu, salvataggi su file
function menu() {
  const lista = Object.values(S.pg).map(p => { const c = calc(p); return `<li><button data-a="scegli" data-v="${p.id}"><span class="nome">${esc(p.nome || "Senza nome")}${p.id === S.attivo ? " · aperto" : ""}<span class="sotto">${esc([p.specie, c.cl.map(x => x.k.n + " " + x.lv).join(" · ")].filter(Boolean).join(" · "))}</span></span><span class="dx">${p.esempio ? "esempio" : ""}</span></button></li>`; }).join("");
  foglio("I personaggi", `<ul class="lista">${lista}</ul>
    <div class="riga" style="margin-top:12px"><button class="btn forte" data-a="nuovo">+ Nuovo personaggio</button><button class="btn" data-a="duplica">Duplica</button><button class="btn" data-a="elimina">Elimina</button></div>
    <h2 class="sez">Salvataggi</h2><p class="nota">La scheda resta salvata su questo telefono, in questo browser. Per non perderla, o per portarla su un altro dispositivo, salvala ogni tanto: diventa un codice da tenere in una nota o in un messaggio.</p>
    <div class="riga"><button class="btn oro" data-a="esporta" data-v="uno">Salva questo personaggio</button><button class="btn" data-a="esporta" data-v="tutti">Salva tutti</button></div>
    <div class="riga" style="margin-top:8px"><button class="btn" data-a="incolla">Incolla un codice</button><button class="btn" data-a="importa">Carica da un file</button></div>
    ${window.WEBAPP ? `<h2 class="sez">L'app</h2><p class="nota">${installaEvento ? "Installala sul telefono: avrà la sua icona e funzionerà anche senza rete." : "Se non è ancora installata, dal menu del browser scegli «Installa app» o «Aggiungi a schermata Home»."} ${persistente ? "I personaggi sono salvati in modo permanente su questo dispositivo." : ""}</p>${installaEvento ? `<div class="riga"><button class="btn forte" data-a="installa">Installa l'app</button></div>` : ""}` : ""}
    <p class="nota" style="margin-top:16px">Dati del manuale aggiornati al ${esc(D.generato)}.</p>${D.srd ? `<p class="nota" style="font-size:13px">${esc(D.srd)}</p>` : ""}`);
}
let dl = undefined;
async function scarica() { if (dl === undefined) { try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; } } return dl; }
async function salvaFile(nome, dati) {
  const x = await scarica();
  if (x) { try { await x.save({ filename: nome, data: dati }); statoSalva("file salvato", false); return true; } catch (e) { if (e && e.code === "declined") { statoSalva("salvataggio annullato", false); return false; } } }
  if (location.protocol === "file:" || !window.claude) { try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([dati], { type: "application/octet-stream" })); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); return true; } catch (e) {} }
  mostraCodice(typeof dati === "string" ? dati : ""); return false;
}
function codice(tutti) { return JSON.stringify({ ultimoRaggio: 1, salvato: new Date().toISOString(), pg: tutti ? Object.values(S.pg) : [P()] }); }
function esporta(tutti) {
  const v = tutti ? "tutti" : "uno", t = codice(tutti);
  foglio(tutti ? "Salva tutti i personaggi" : "Salva " + (P().nome || "il personaggio"), `<p>Il personaggio diventa un codice di testo. Tienilo dove vuoi: in una nota, in un messaggio a te stesso, nella chat del gruppo. Per ricaricarlo, dal menu scegli «Incolla un codice».</p>
    <div class="riga"><button class="btn forte" data-a="condividi" data-v="${v}">Condividi</button><button class="btn oro" data-a="copiacodice">Copia il codice</button><button class="btn" data-a="scaricafile" data-v="${v}">Scarica il file</button></div>
    <p class="nota" id="cod-msg" aria-live="polite" style="min-height:1.5em"></p>
    <textarea class="campo" id="cod-t" style="min-height:120px;font-family:var(--f-ui);font-size:12px" readonly>${esc(t)}</textarea>`);
}
function leggiImport(t) {
  try {
    const x = JSON.parse(t); const lista = Array.isArray(x) ? x : (x.pg ? (Array.isArray(x.pg) ? x.pg : Object.values(x.pg)) : [x]);
    let n = 0, ultimo = null;
    lista.forEach(p => { if (!p || typeof p !== "object") return; p = normalizza(p); if (!p.id) p.id = uid(); S.pg[p.id] = p; ultimo = p.id; n++; });
    if (!n) throw new Error("vuoto");
    S.attivo = ultimo; salva(); chiudiFoglio(); render(); statoSalva(n === 1 ? "personaggio caricato" : n + " personaggi caricati", false);
  } catch (e) { foglio("Non riesco a leggerlo", `<p>Il file o il codice non è una scheda dell'Ultimo Raggio. Controlla di aver scelto il file giusto, salvato da «Salva questo personaggio».</p>`); }
}
$("#importa-file").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => leggiImport(String(r.result)); r.readAsText(f); e.target.value = ""; });

// ------------------------------------------------------------ gli ascoltatori
document.addEventListener("input", e => { const el = e.target; if (!el.dataset || !el.dataset.k) return; setK(el); });
document.addEventListener("change", e => { const el = e.target; if (!el.dataset || !el.dataset.k) return; setK(el); ridisegna(); });
function setK(el) {
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.t === "n") { v = String(v).replace(",", "."); v = v === "" ? "" : (isNaN(+v) ? 0 : +v); }
  const k = el.dataset.k;
  if (/^patto\.grado$/.test(k)) v = +v;
  setPath(P(), k, v);
  if (/^classi\.\d+\.c$/.test(k)) { const i = +k.split(".")[1]; P().classi[i].sott = ""; P().classi[i].libera = false; }
  if (/^classi\.\d+\.sott$/.test(k) && v === "__altra") { const i = +k.split(".")[1]; P().classi[i].sott = ""; P().classi[i].libera = true; }
  if (k === "patto.n") { const pt = D.patti.find(x => x.n === v); P().patto.car = pt ? pt.car : ""; }
  salva();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const f = AZ[b.dataset.a]; if (!f) return;
  if (b.dataset.a === "tsprof") { e.stopPropagation(); }
  e.preventDefault(); f(b.dataset, b, e);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#foglio").hidden) chiudiFoglio(); });
render();
statoSalva(location.protocol === "file:" ? "senza rete" : "", false);
</script>
