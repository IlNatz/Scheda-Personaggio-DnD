 (30 giorni) o 9º livello (366 giorni)."},{"n":"Sussurri dissonanti","lv":1,"sc":"Ammaliamento di 1º livello (Bardo)","cl":"Bardo","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V\n**Durata:** istantanea\n\nUna creatura a scelta dell\u0027incantatore, situata entro gittata e che egli è in grado di vedere, sente una melodia dissonante nella sua mente. Il bersaglio effettua un tiro salvezza su Saggezza. Se lo fallisce, subisce 3d6 danni psichici e, se disponibile, deve usare immediatamente la sua reazione per muoversi fin dove la sua velocità glielo consente, percorrendo la via più sicura. In caso di successo, subisce soltanto la metà di quei danni.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d6 per ogni slot di livello superiore al 1º."},{"n":"Taumaturgia","lv":0,"sc":"Trucchetto di Trasmutazione (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V\n**Durata:** Fino a 1 minuto\n\nL\u0027incantatore genera una meraviglia minore entro gittata, oltre a uno degli effetti elencati di seguito. Se l\u0027incantatore lancia questo incantesimo più volte, può tenere attivi contemporaneamente fino a tre dei suoi effetti dalla durata di 1 minuto.\n\n**Mano invisibile.** L\u0027incantatore fa in modo che una porta o una finestra non chiusa a chiave si spalanchi o si chiuda di colpo da sola.\n\n**Occhi alterati.** L\u0027incantatore altera l\u0027aspetto dei suoi occhi per 1 minuto.\n\n**Suono spettrale.** L\u0027incantatore crea un suono improvviso che ha origine da un punto entro gittata a sua scelta, come un rombo di tuono, il verso di un corvo o un mormorio sinistro.\n\n**Tremiti.** L\u0027incantatore genera un tremito innocuo sul terreno per 1 minuto.\n\n**Trucchetto col fuoco.** L\u0027incantatore fa in modo che una fiamma tremi, si intensifichi, si affievolisca o cambi colore per 1 minuto.\n\n**Voce tonante.** La voce dell\u0027incantatore rimbomba con potenza tre volte superiore rispetto al normale per 1 minuto. Per la durata dell\u0027incantesimo, dispone di vantaggio alle prove di Carisma (Intimidire)."},{"n":"Telecinesi","lv":5,"sc":"Trasmutazione di 5º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore ottiene la capacità di spostare o manipolare creature e oggetti con la forza del pensiero. Al lancio e come sua azione di Magia ogni turno successivo prima del termine dell\u0027incantesimo, l\u0027incantatore può esercitare la propria volontà su una creatura o un oggetto entro gittata che egli è in grado di vedere, provocando l\u0027effetto appropriato descritto di seguito. L\u0027incantatore può influenzare lo stesso bersaglio in ogni round o sceglierne uno nuovo in ogni momento. Se cambia bersaglio, quello precedente non risentirà più degli effetti dell\u0027incantesimo.\n\n**Creatura.** L\u0027incantatore può provare a spostare una creatura di taglia Enorme o inferiore. Il bersaglio deve superare un tiro salvezza su Forza, altrimenti verrà spostato dall\u0027incantatore di massimo 9 metri in una direzione entro la gittata dell\u0027incantesimo. Fino alla fine del suo turno successivo, la creatura è trattenuta e, se alzata a mezz\u0027aria, rimarrà sospesa lì. Cadrà al termine del turno successivo dell\u0027incantatore, a meno che non utilizzi di nuovo questa opzione su di essa e fallisca il tiro salvezza.\n\n**Oggetto.** L\u0027incantatore può provare a spostare un oggetto di taglia Enorme o inferiore. Se esso non è indossato o trasportato, lo sposta automaticamente fino a 9 metri in qualsiasi direzione entro la gittata dell\u0027incantesimo.\n\nSe l\u0027oggetto è indossato o trasportato da una creatura, quest\u0027ultima deve superare un tiro salvezza su Forza, altrimenti l\u0027incantatore lo tirerà via e lo sposterà fino a 9 metri in qualsiasi direzione entro la gittata dell\u0027incantesimo.\n\nCon la sua presa telecinetica, l\u0027incantatore può esercitare un controllo più preciso sugli oggetti, come manipolare uno strumento semplice."},{"n":"Teletrasporto","lv":7,"sc":"Evocazione di 7º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 3 metri\n**Componenti:** V\n**Durata:** istantanea\n\nQuesto incantesimo teletrasporta immediatamente l\u0027incantatore e un solo oggetto o un massimo di otto creature consenzienti, che si trovano entro gittata e che egli è in grado di vedere, fino a una destinazione a sua scelta. Se il bersaglio è un oggetto, deve essere di taglia Grande o inferiore e non può essere impugnato o trasportato da una creatura non consenziente.\n\nLa destinazione scelta deve essere nota all\u0027incantatore e deve trovarsi sul suo stesso piano di esistenza. La sua familiarità con la destinazione determina il successo del teletrasporto. Il GM tira 1d100 e consulta la tabella Risultato del teletrasporto e le spiegazioni successive.\n\nRisultato del teletrasporto\nArea Fuori Sul\nFamiliarità Errore simile bersaglio bersaglio\nCerchio — — — 01–00\npermanente\nOggetto — — — 01–00\ncollegato\nMolto 01–05 06–13 14–24 25–00\nfamiliare\nVisto occa - 01–33 34–43 44–53 54–00\nsionalmente\nVisto una 01–43 44–53 54–73 74–00\nvolta o\ndescritto\nFalsa 01–50 51–00 — —\ndestinazione\n\n**Familiarità.** Di seguito vengono spiegati i significati dei termini presenti nella colonna Familiarità:\n\n- \"Cerchio permanente\" indica un cerchio di teletrasporto permanente di cui l\u0027incantatore conosce la sequenza di sigilli.\n\n- \"Oggetto collegato\" indica un oggetto in possesso dell\u0027incantatore prelevato dalla destinazione desiderata negli ultimi sei mesi, come un libro della biblioteca di un mago.\n\n- \"Molto familiare\" indica un luogo che l\u0027incantatore ha visitato spesso, un luogo che ha studiato con attenzione o un luogo che è in grado di vedere quando lancia l\u0027incantesimo.\n\n- \"Visto occasionalmente\" indica un luogo che l\u0027incantatore ha visto più di una volta, ma che non gli è troppo familiare.\n\n- \"Visto una volta o descritto\" indica un luogo che l\u0027incantatore ha visto una volta, magari usando la magia, o un luogo noto attraverso la descrizione di un\u0027altra persona o una mappa.\n\n- \"Falsa destinazione\" è un luogo inesistente. Per esempio, l\u0027incantatore ha cercato di scrutare il rifugio segreto di un nemico ma ha visto invece un\u0027illusione, oppure tenta di teletrasportarsi in un luogo che non esiste più.\n\n**Errore.** La magia imprevedibile dell\u0027incantesimo rende difficile il viaggio. Ogni creatura che si teletrasporta (o l\u0027oggetto bersaglio) subisce 3d10 danni da forza e il GM lancia di nuovo sulla tabella per determinare dove arriverà (potrebbero verificarsi vari errori, nel qual caso i danni verranno inflitti ogni volta).\n\n**Area simile.** L\u0027incantatore e il suo gruppo (o l\u0027oggetto bersaglio) arrivano in un\u0027area diversa che è visivamente o tematicamente simile all\u0027area bersaglio, oltre a essere nelle sue immediate vicinanze. Per esempio, se l\u0027incantatore vuole dirigersi al suo laboratorio personale, potrebbe comparire in quello di un\u0027altra persona nella stessa città.\n\n**Fuori bersaglio.** L\u0027incantatore e il suo gruppo (o l\u0027oggetto bersaglio) compaiono a una distanza di 2d12 chilometri dalla destinazione in una direzione casuale. Tira 1d8 per la direzione: 1, est; 2, sud-est; 3, sud; 4, sud-ovest; 5, ovest; 6, nord-ovest; 7, nord; oppure 8, nord-est.\n\n**Sul bersaglio.** L\u0027incantatore e il suo gruppo (o l\u0027oggetto bersaglio) compaiono nel luogo designato."},{"n":"Tempesta di fuoco","lv":7,"sc":"Invocazione di 7º livello (Chierico, Druido, Stregone)","cl":"Chierico, Druido, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 45 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nUna tempesta di fuoco compare in un luogo entro gittata. L\u0027area della tempesta è composta da dieci cubi con spigolo di 3 metri, che l\u0027incantatore può disporre come desidera. Ogni cubo deve essere contiguo ad almeno un altro cubo. Ogni creatura nell\u0027area effettua un tiro salvezza su Destrezza; se lo fallisce, subisce 7d10 danni da fuoco, mentre se lo supera subisce la metà dei danni.\n\nGli oggetti infiammabili nell\u0027area che non sono indossati o trasportati iniziano a bruciare."},{"n":"Tempesta di ghiaccio","lv":4,"sc":"Invocazione di 4º livello (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 90 metri\n**Componenti:** V, S, M (una muffola)\n**Durata:** istantanea\n\nChicchi di grandine cadono in un cilindro del raggio di 6 metri e alto 12 metri, centrato su un punto entro gittata. Ogni creatura presente nel cilindro effettua un tiro salvezza su Destrezza, subendo 2d10 danni contundenti e 4d6 danni da freddo in caso di fallimento, o la metà dei danni in caso di successo. La grandine trasforma l\u0027area all\u0027interno del cilindro in terreno difficile fino al termine del turno successivo dell\u0027incantatore.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni contundenti aumentano di 1d10 per ogni slot di livello superiore al 4º."},{"n":"Tempesta di nevischio","lv":3,"sc":"Evocazione di 3º livello (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 45 metri\n**Componenti:** V, S, M (un ombrello in miniatura)\n**Durata:** concentrazione, fino a 1 minuto\n\nFino al termine dell\u0027incantesimo cade del nevischio in un cilindro alto 12 metri dal raggio di 6 metri il cui centro è un punto a scelta dell\u0027incantatore entro gittata. L\u0027area è pesantemente oscurata e le fiamme libere al suo interno vengono estinte.\n\nLa superficie all\u0027interno del cilindro è un terreno difficile. Quando una creatura entra nell\u0027area del cilindro per la prima volta in un turno o vi inizia il proprio turno, deve superare un tiro salvezza su Destrezza, altrimenti cadrà a terra prona e perderà la concentrazione."},{"n":"Tempesta di vendetta","lv":9,"sc":"Evocazione di 9º livello (Druido)","cl":"Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 1,5 chilometri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nPer la durata dell\u0027incantesimo, l\u0027incantatore genera una minacciosa nube temporalesca che si espande fino a una raggio di 90 metri centrata su un punto entro gittata. Ogni creatura che si trova sotto alla nube quando appare deve superare un tiro salvezza su Costituzione, altrimenti subirà 2d6 danni da tuono e sarà assordata per la durata dell\u0027incantesimo.\n\nAll\u0027inizio di ciascun turno successivo, la tempesta produce effetti diversi, come indicato sotto.\n\n**2º turno.** Cade della pioggia acida. Ogni creatura e ogni oggetto sotto la nube subisce 4d6 danni da acido.\n\n**3º turno.** L\u0027incantatore invoca sei fulmini che scendono dalla nube e colpiscono sei creature o oggetti situati sotto di essa. Ogni bersaglio effettua un tiro salvezza su Destrezza, subendo 10d6 danni da fulmine in caso di fallimento, o la metà dei danni in caso di successo.\n\n**4º turno.** Cade della grandine. Ogni creatura sotto la nube subisce 2d6 danni contundenti.\n\n**Dal 5º al 10º turno.** L\u0027area sotto la nube è attraversata da raffiche di vento e pioggia gelida, ogni creatura sotto di essa subisce 1d6 danni da freddo. Fino al termine dell\u0027incantesimo, quest\u0027area è considerata terreno difficile ed è pesantemente oscurata. È sferzata da forti venti e al suo interno è impossibile eseguire attacchi a distanza."},{"n":"Tentacoli neri","lv":4,"sc":"Evocazione di 4º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 27 metri\n**Componenti:** V, S, M (un tentacolo)\n**Durata:** concentrazione, fino a 1 minuto\n\nUna massa di tentacoli brulicanti color ebano riempie un quadrato con lato di 6 metri situato sul terreno entro gittata e che l\u0027incantatore è in grado di vedere. Per la durata dell\u0027incantesimo, questi tentacoli trasformano quell\u0027area in un terreno difficile. Ogni creatura nell\u0027area effettua un tiro salvezza su Forza. In caso di fallimento, subisce 3d6 danni contundenti ed è trattenuta fino al termine dell\u0027incantesimo. Una creatura effettua il tiro salvezza anche se entra nell\u0027area o vi termina il suo turno. Il tiro salvezza può essere effettuato solo una volta per turno.\n\nUna creatura trattenuta può usare un\u0027azione per effettuare una prova di Forza (Atletica) contro la CD del tiro salvezza sull\u0027incantesimo, ponendo fine alla sua condizione \"trattenuta\" in caso di successo."},{"n":"Terremoto","lv":8,"sc":"Trasmutazione di 8º livello (Chierico, Druido, Stregone)","cl":"Chierico, Druido, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 150 metri\n**Componenti:** V, S, M (una roccia fratturata)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore sceglie un punto del terreno entro gittata che egli è in grado di vedere. Per la durata dell\u0027incantesimo, una scossa intensa sconquassa il terreno in un raggio di 30 metri centrato su quel punto, rendendolo terreno difficile.\n\nQuando l\u0027incantatore lancia questo incantesimo, e alla fine di ogni suo turno per tutta la durata, ogni creatura sul terreno nell\u0027area effettua un tiro salvezza su Destrezza. In caso di fallimento, la creatura cade prona e la sua concentrazione viene interrotta.\n\nL\u0027incantatore può anche causare i seguenti effetti.\n\n**Crepe.** Un totale di 1d6 crepe si apre nell\u0027area dell\u0027incantesimo alla fine del turno in cui viene lanciato. L\u0027incantatore sceglie i punti in cui si aprono le crepe, che non possono trovarsi al di sotto di strutture. Ognuna di esse è profonda 1d10 × 3 metri, ampia 3 metri e si estende da un lato all\u0027altro dell\u0027area dell\u0027incantesimo. Se una creatura si trova nel punto i cui si apre una crepa, deve superare un tiro salvezza su Destrezza o vi cade dentro. Una creatura che supera il tiro salvezza riesce a spostarsi insieme al bordo della crepa mentre si apre.\n\n**Strutture.** La scossa infligge 50 danni contundenti a una qualsiasi struttura a contatto con il terreno nell\u0027area in cui è stato lanciato l\u0027incantesimo e alla fine di ogni turno dell\u0027incantatore fino al termine dell\u0027incantesimo. Se la struttura scende a 0 punti ferita, crolla.\n\nUna creatura situata entro una distanza da una struttura in disfacimento pari alla metà dell\u0027altezza della struttura stessa effettua un tiro salvezza su Destrezza. Se fallisce, subisce 12d6 danni contundenti, viene buttata a terra prona e rimane sepolta sotto le macerie; per liberarsi con un\u0027azione deve effettuare una prova di Forza (Atletica) con CD 20. In caso di successo, subisce soltanto la metà di quei danni."},{"n":"Terreno illusorio","lv":4,"sc":"Illusione di 4º livello (Bardo, Druido, Mago, Warlock)","cl":"Bardo, Druido, Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** 90 metri\n**Componenti:** V, S, M (un fungo)\n**Durata:** 24 ore\n\nL\u0027incantatore fa in modo che un terreno naturale in un cubo con spigolo di 45 metri entro gittata abbia l\u0027aspetto, i suoni e gli odori di un altro tipo di terreno naturale. Un campo aperto o una strada potrebbe così sembrare una palude, una collina, un crepaccio o qualche altro tipo di terreno difficile e invalicabile. Allo stesso modo, uno stagno potrebbe apparire come un prato erboso, un precipizio come un dolce pendio o un fosso irto di rocce come una strada ampia e accogliente. Tuttavia, le strutture artificiali, l\u0027equipaggiamento e le creature all\u0027interno dell\u0027area non cambiano.\n\nInoltre, le caratteristiche tattili del terreno rimangono invariate, quindi le creature che entrano nell\u0027area hanno buone probabilità di accorgersi dell\u0027illusione. Se la differenza non è ovvia al tatto, una creatura che esamina l\u0027illusione può effettuare l\u0027azione di Studio per effettuare una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull\u0027incantesimo per non essere tratta in inganno. Se una creatura si accorge che il terreno è illusorio, vede un\u0027immagine indistinta sovrapposta al terreno reale."},{"n":"Tocco del vampiro","lv":3,"sc":"Necromanzia di 3º livello (Stregone, Mago, Warlock)","cl":"Stregone, Mago, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nIl tocco della mano dell\u0027incantatore, avviluppata in una cortina d\u0027ombra, può risucchiare l\u0027energia vitale delle altre creature per curare le proprie ferite. Effettua un attacco con incantesimo in mischia contro una creatura a portata. Se il colpo va a segno, il bersaglio subisce 3d6 danni necrotici e l\u0027incantatore recupera una quantità di punti ferita pari alla metà dei danni necrotici inflitti.\n\nFino al termine dell\u0027incantesimo, come azione di Magia, l\u0027incantatore può effettuare di nuovo l\u0027attacco a ogni suo turno, prendendo di mira la stessa creatura o un\u0027altra.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d6 per ogni slot di livello superiore al 3º."},{"n":"Tocco gelido","lv":0,"sc":"Trucchetto di Necromanzia (Mago, Stregone, Warlock)","cl":"Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"Tempo di lancio: azione Gittata: contatto Componenti: V, S Durata: istantanea Incanalando un flusso di gelo sepolcrale, l\u0027incantatore effettua un attacco con incantesimo in mischia contro un bersaglio a portata. Se il colpo va a segno, il bersaglio subisce 1d10 danni necrotici e non può recuperare punti ferita fino al termine del turno successivo dell\u0027incantatore.\n\n**Trucchetto potenziato.** I danni aumentano di 1d10 quando l\u0027incantatore raggiunge il 5º livello (2d10), l\u002711º livello (3d10) e il 17º livello (4d10)."},{"n":"Trama ipnotica","lv":3,"sc":"Illusione di 3º livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** S, M (una manciata di coriandoli)\n**Durata:** concentrazione, fino a 1 minuto\n\nAll\u0027interno di un cubo con spigolo di 9 metri entro gittata, l\u0027incantatore crea un intreccio di colori serpeggianti che appare per qualche secondo prima di svanire. Ogni creatura all\u0027interno dell\u0027area in grado di vedere l\u0027intreccio deve superare un tiro salvezza su Saggezza, altrimenti rimane affascinata per la durata dell\u0027incantesimo. Finché è affascinata, la creatura è incapacitata e la sua velocità è pari a 0. L\u0027incantesimo su una creatura influenzata termina se questa subisce danni o se qualcuno usa un\u0027azione per scuoterla, destandola dal suo stato confusionale."},{"n":"Trasformazione","lv":9,"sc":"Trasmutazione di 9º livello (Druido, Mago)","cl":"Druido, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (un diadema di giada del valore di 1.500 mo o più)\n**Durata:** concentrazione, fino a 1 ora\n\nL\u0027incantatore assume la forma di una creatura diversa per la durata dell\u0027incantesimo o finché non effettua un\u0027azione di Magia per mutare in un\u0027altra forma possibile. La nuova forma deve essere quella di una creatura con un grado di sfida pari o inferiore al livello o al grado di sfida dell\u0027incantatore. La creatura non può essere un costrutto o un non morto e deve essere un tipo di creatura che l\u0027incantatore abbia già visto.\n\nQuando l\u0027incantatore lancia l\u0027incantesimo, ottiene un numero di punti ferita temporanei pari ai punti ferita della prima forma in cui si trasforma. Al termine dell\u0027incantesimo, il bersaglio perde tutti i punti ferita temporanei rimasti.\n\nLe statistiche di gioco dell\u0027incantatore vengono sostituite dalla scheda delle statistiche della forma scelta, ma l\u0027incantatore conserva il suo tipo di creatura, allineamento, personalità, punteggi di Intelligenza, Saggezza e Carisma, punti ferita, Dadi Vita, competenze e abilità di comunicare. Se l\u0027incantatore possiede il privilegio Incantesimi, conserva anche quello.\n\nQuando si trasforma, l\u0027incantatore sceglie se lasciare a terra il suo equipaggiamento o se cambiarne taglia e aspetto per adattarlo alla sua nuova forma e continuare a indossarlo."},{"n":"Traslazione arborea","lv":5,"sc":"Evocazione di 5º livello (Druido, Ranger)","cl":"Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore ottiene la capacità di entrare in un albero e muoversi al suo interno fino ad arrivare a un altro albero dello stesso tipo posto entro 150 metri. Entrambi gli alberi devono essere vivi e di taglia pari o superiore a quella dell\u0027incantatore, che deve usare 1,5 metri di movimento per entrare in uno di essi. L\u0027incantatore apprende immediatamente l\u0027ubicazione di tutti gli altri alberi dello stesso tipo entro 150 metri e, come parte del movimento usato per entrare nell\u0027albero, può scegliere se passare in uno di quegli alberi o riemergere da quello in cui si trova. L\u0027incantatore ricompare in un punto a sua scelta entro 1,5 metri dall\u0027albero di destinazione, usando ulteriori 1,5 metri di movimento. Se non gli rimane più alcun movimento, ricompare entro 1,5 metri dall\u0027albero in cui è entrato.\n\nQuest\u0027abilità di trasporto è utilizzabile una sola volta per turno. Inoltre, l\u0027incantatore deve concludere ogni suo turno fuori dall\u0027albero."},{"n":"Trasporto vegetale","lv":6,"sc":"Evocazione di 6º livello (Druido)","cl":"Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 3 metri\n**Componenti:** V, S\n**Durata:** 1 minuto\n\nQuesto incantesimo crea un legame magico tra un vegetale inanimato di taglia Grande o superiore situato entro gittata e un altro vegetale, situato a qualsiasi distanza sullo stesso piano di esistenza. L\u0027incantatore deve aver visto o toccato il vegetale di destinazione almeno una volta in precedenza. Per la durata dell\u0027incantesimo, qualsiasi creatura può entrare nel vegetale bersaglio e uscire da quello di destinazione usando 1,5 metri di movimento."},{"n":"Trova cavalcatura","lv":2,"sc":"Evocazione di 2º livello (Paladino)","cl":"Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componente:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore evoca un essere ultraterreno che appare come una cavalcatura forte e fedele in uno spazio libero a scelta dell\u0027incantatore entro gittata. Questa creatura usa la scheda delle statistiche della cavalcatura ultraterrena. Se l\u0027incantatore possiede già una cavalcatura evocata con questo incantesimo, essa viene sostituita da quella nuova. La cavalcatura ha l\u0027aspetto di un animale di taglia Grande a scelta dell\u0027incantatore, per esempio un cavallo, un cammello, un lupo feroce o un alce. Ogni volta che l\u0027incantatore lancia l\u0027incantesimo, sceglie il tipo di creatura della cavalcatura (celestiale, folletto o immondo) e questa scelta determina i tratti e la scheda delle statistiche della creatura.\n\n**Combattimento.** La cavalcatura diventa un alleato per l\u0027incantatore e i suoi alleati. In combattimento, ha lo stesso punteggio di iniziativa dell\u0027incantatore, il quale può salirci in sella e guidarla come se fosse una cavalcatura controllata (come descritto nelle regole riguardanti il combattimento in sella). Se l\u0027incantatore è incapacitato, la cavalcatura inizia il suo turno subito dopo quello dell\u0027incantatore: la creatura è indipendente e si concentra sul proteggere l\u0027incantatore.\n\n**Scomparsa della cavalcatura.** La cavalcatura scompare quando scende a 0 punti ferita o se l\u0027incantatore muore. Quando scompare, nello spazio che occupava in precedenza lascia qualsiasi oggetto stesse indossando o trasportando. Lanciando nuovamente l\u0027incantesimo, l\u0027incantatore può scegliere se evocare la cavalcatura scomparsa o una diversa.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** Usa il livello dello slot incantesimo relativo al livello dell\u0027incantesimo nella scheda delle statistiche.\n\n#### Cavalcatura ultraterrena\n\nCelestiale Grande, folletto o immondo (a scelta\ndell\u0027incantatore), neutrale\nCA 10 + 1 per livello dell\u0027incantesimo\nPF 5 + 10 per livello dell\u0027incantesimo (la cavalcatura\nha un numero di Dadi Vita [d10] pari al livello\ndell\u0027incantesimo)\nVelocità 18 m, volo 18 m (richiede incantesimo di\n4º livello o superiore)\nMOD SALV MOD SALV MOD SALV\nFor 18 +4 +4 Des 12 +1 +1 Cos 14 +2 +2\nInt 6 −2 −2 Sag 12 +1 +1 Car 8 −1 −1\nSensi Percezione passiva 11\nLingue telepatia 1,5 km (funziona solo con l\u0027incantatore)\nGS nessuno (PE 0; BC pari al bonus di competenza del\npersonaggio)\n\n#### Tratti\n\nLegame vitale. Quando l\u0027incantatore recupera punti\nferita grazie a un incantesimo di 1º livello o superiore,\nla cavalcatura recupera la stessa quantità di punti ferita\nse l\u0027incantatore si trova entro 1,5 metri da essa.\n\n#### Azioni\n\nSchianto ultraterreno. Tiro per colpire in mischia:\nil bonus equivale al modificatore di attacco dell\u0027incantesimo del personaggio, portata di 1,5 m Colpito: 1d8\npiù il livello dell\u0027incantesimo danni radiosi (celestiale),\ndanni psichici (folletto) o danni necrotici (immondo).\n\n#### Azioni bonus\n\nPasso fatato (solo folletto; ricarica dopo un riposo\nlungo). La cavalcatura si teletrasporta, insieme al suo\ncavaliere, in un uno spazio libero a scelta del personaggio situato a 18 metri da sé.\nSguardo letale (solo immondo; ricarica dopo un\nriposo lungo). Tiro salvezza su Saggezza: La CD è pari\nalla CD del tiro salvezza sull\u0027incantesimo, una creatura\nentro 18 metri che la cavalcatura è in grado di vedere.\nFallimento: Il bersaglio è spaventato fino al termine del\nturno successivo dell\u0027incantantore.\nTocco guaritore (solo celestiale; ricarica dopo un\nriposo lungo). Una creatura entro 1,5 metri dalla cavalcatura recupera un numero di punti ferita pari a 2d8\npiù il livello dell\u0027incantesimo."},{"n":"Trova famiglio","lv":1,"sc":"Evocazione di 1º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 ora o rituale\n**Gittata:** 3 metri\n**Componenti:** V, S, M (incenso bruciato del valore di 10 mo o più, che l\u0027incantesimo consuma)\n**Durata:** istantanea\n\nL\u0027incantatore ottiene i servigi di un famiglio, uno spirito che assume la forma di un animale a sua scelta: pipistrello, gatto, rana, falco, lucertola, piovra, gufo, ratto, corvo, ragno, faina o un\u0027altra bestia che abbia un grado di sfida pari a 0. Il famiglio appare in uno spazio libero entro gittata, ha le statistiche della forma scelta (vedi \"Mostri\"), anche se si tratta di un celestiale, un folletto o un immondo (a scelta dell\u0027incantatore) invece di una bestia. Il famiglio è indipendente dall\u0027incantatore, ma obbedisce ai suoi comandi.\n\n**Connessione telepatica.** Finché il famiglio si trova a 30 metri dall\u0027incantatore, quest\u0027ultimo può comunicare con lui telepaticamente. Inoltre, come azione bonus, l\u0027incantatore è in grado di vedere attraverso gli occhi del famiglio e sentire ciò che sente fino all\u0027inizio del suo turno successivo, ottenendo i benefici di eventuali sensi speciali posseduti dal famiglio.\n\nInfine, quando l\u0027incantatore lancia un incantesimo con gittata a contatto, il suo famiglio può trasmettere il tocco. Il famiglio deve trovarsi entro 30 metri dall\u0027incantatore e usare la sua reazione per trasmettere il tocco quando l\u0027incantesimo viene lanciato.\n\n**Combattimento.** Il famiglio diventa un alleato per l\u0027incantatore e i suoi alleati. Tira per la propria iniziativa e agisce nel proprio turno. Un famiglio non può attaccare, ma può effettuare altre azioni normalmente.\n\n**Scomparsa del famiglio.** Quando un famiglio scende a 0 punti ferita, scompare e riappare quando l\u0027incantatore lancia nuovamente questo incantesimo. Come azione di Magia, l\u0027incantatore può temporaneamente congedare il famiglio, che scompare in una sacca dimensionale. In alternativa, l\u0027incantatore può farlo sparire per sempre. Come azione di Magia, finché il famiglio è congedato temporaneamente, l\u0027incantatore può farlo ricomparire in uno spazio libero entro 9 metri da sé. Ogni volta che il famiglio scende a 0 punti ferita o scompare in una sacca dimensionale, nello spazio che occupava in precedenza lascia qualsiasi oggetto stesse indossando o trasportando.\n\n**Un solo famiglio.** Un incantatore non può avere più di un famiglio alla volta. Se lancia questo incantesimo mentre è già presente un famiglio, l\u0027incantatore gli impartisce un\u0027altra forma possibile."},{"n":"Trucco della corda","lv":2,"sc":"Trasmutazione di 2º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (un pezzo di corda)\n**Durata:** 1 ora\n\nL\u0027incantatore tocca una corda: un\u0027estremità fluttua verso l\u0027alto finché la corda non pende perpendicolarmente al terreno oppure raggiunge il soffitto. All\u0027estremità superiore della corda, si apre un portale invisibile (che misura 90 centimetri per 1,5 metri) verso uno spazio extradimensionale che permane fino al termine dell\u0027incantesimo. È possibile raggiungere questo spazio arrampicandosi in cima alla corda, la quale può essere ritratta al suo interno o lasciata cadere fuori di esso.\n\nLo spazio può contenere un massimo di otto creature di taglia Media o inferiore. Attacchi, incantesimi e altri effetti non possono attraversare in entrata o in uscita lo spazio, ma le creature al suo interno possono vedere attraverso il portale. Tutto ciò che si trova all\u0027interno dello spazio cade all\u0027esterno al termine dell\u0027incantesimo."},{"n":"Tsunami","lv":8,"sc":"Evocazione di 8º livello (Druido)","cl":"Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** 1,5 chilometri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 6 round\n\nUn muro di acqua si materializza in un punto a scelta dell\u0027incantatore entro gittata. Il muro può avere dimensioni massime di 90 metri di lunghezza, 90 metri di altezza e 15 metri di spessore Il muro permane per tutta la durata dell\u0027incantesimo. Quando appare, ogni creatura nell\u0027area effettua un tiro salvezza su Forza, subendo 6d10 danni contundenti in caso di fallimento o la metà dei danni in caso di successo.\n\nAll\u0027inizio di ogni turno dell\u0027incantatore, dopo l\u0027apparizione del muro, esso si sposta di 15 metri (insieme alle creature che contiene) allontanandosi dall\u0027incantatore. Qualsiasi creatura di taglia Enorme o inferiore all\u0027interno del muro e qualsiasi creatura in uno spazio in cui il muro entra quando si sposta, deve superare un tiro salvezza su Forza, altrimenti subisce 5d10 danni contundenti. Una creatura può subire questi danni solo una volta per round. Alla fine del turno, l\u0027altezza del muro si riduce di 15 metri e i danni che infligge nei round successivi sono ridotti di 1d10. Quando il muro raggiunge 0 metri di altezza, l\u0027incantesimo termina. Una creatura immersa nel muro può muoversi nuotando. Tuttavia, a causa della forza dell\u0027onda, per potersi effettivamente muovere deve superare una prova di Forza (Atletica) contro la CD del tiro salvezza sull\u0027incantesimo. Se fallisce la prova, non può muoversi. Una creatura che, muovendosi, esce dal muro, cade a terra."},{"n":"Unto","lv":1,"sc":"Evocazione di 1º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (un pezzo di cotenna di maiale o burro)\n**Durata:** 1 minuto\n\nUna patina di unto non infiammabile ricopre un\u0027area di terreno di 3 metri per lato centrata su un punto entro gittata che diventa terreno difficile per la durata dell\u0027incantesimo.\n\nQuando l\u0027unto compare, ogni creatura nell\u0027area deve superare un tiro salvezza su Destrezza, altrimenti cade a terra prona. Anche una creatura che entra nell\u0027area o vi termina il proprio turno deve superare lo stesso tiro salvezza, altrimenti cade prona."},{"n":"Vedere invisibilità","lv":2,"sc":"Divinazione di 2º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (un pizzico di talco)\n**Durata:** 1 ora\n\nPer la durata dell\u0027incantesimo, l\u0027incantatore è in grado di vedere le creature e gli oggetti invisibili e proiettare la sua vista sul Piano Etereo. Le creature e gli oggetti appaiono spettrali."},{"n":"Velocità","lv":3,"sc":"Trasmutazione di 3º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S, M (una scaglia di radice di liquirizia)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore sceglie una creatura consenziente entro gittata che egli è in grado di vedere. Fino al termine dell\u0027incantesimo, il bersaglio ottiene un bonus di +2 alla Classe Armatura, dispone di vantaggio ai tiri salvezza su Destrezza, la sua velocità raddoppia e ottiene un\u0027azione aggiuntiva per ogni turno. Tale azione può essere utilizzata solo per effettuare un\u0027azione di Attacco (un solo attacco), Scatto, Disimpegno, Nascondersi o Utilizzo.\n\nAl termine dell\u0027incantesimo, il bersaglio è incapacitato e ha una velocità pari a 0 fino al termine del proprio turno successivo, essendo sopraffatto da un\u0027ondata di spossatezza."},{"n":"Vigilanza e interdizione","lv":6,"sc":"Abiurazione di 6º livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 ora\n**Gittata:** contatto\n**Componenti:** V, S, M (una verga d\u0027argento del valore di 10 mo o più)\n**Durata:** 24 ore\n\nL\u0027incantatore crea una difesa che protegge un\u0027area di terreno di massimo 225 metri quadrati. L\u0027area protetta può essere alta fino a 6 metri e l\u0027incantatore può darle una delle seguenti forme: un quadrato con lato di 15 metri, cento quadrati contigui con lato di 1,5 metri o venticinque quadrati contigui con lato di 3 metri.\n\nQuando lancia questo incantesimo, l\u0027incantatore può specificare quali individui non saranno influenzati dagli effetti dell\u0027incantesimo. Può anche specificare una parola d\u0027ordine che, una volta pronunciata a voce alta entro 1,5 metri dall\u0027area protetta, renderà chi la pronuncia immune a questi effetti. L\u0027incantesimo crea gli effetti illustrati di seguito all\u0027interno dell\u0027area protetta. Dissolvi magie non ha effetti su vigilanza e interdizione, ma ciascuno dei seguenti effetti può essere dissolto. Se tutti e quattro vengono dissolti, vigilanza e interdizione termina. Se l\u0027incantatore lancia l\u0027incantesimo ogni giorno per 365 giorni sulla stessa area, esso permane finché tutti i suoi effetti non vengono dissolti.\n\n**Corridoi.** Tutti i corridoi protetti si riempiono di nebbia e diventano pesantemente oscurati. Inoltre, a ogni incrocio o diramazione che richieda di scegliere una direzione, una creatura diversa dall\u0027incantatore ha una probabilità del 50% di credere di andare in una direzione differente da quella che ha scelto.\n\n**Porte.** Tutte le porte nell\u0027area protetta vengono chiuse a chiave magicamente, come sigillate dall\u0027incantesimo serratura arcana. Inoltre, l\u0027incantatore può coprire fino a dieci porte con un\u0027illusione per farle apparire come normali sezioni di parete.\n\n**Scale.** Tutte le scale nell\u0027area protetta si riempiono da cima a fondo di ragnatele, come succederebbe lanciando l\u0027incantesimo ragnatela. Per la durata dell\u0027incantesimo vigilanza e interdizione, i fili di queste ragnatele si riformano in 10 minuti se queste vengono distrutte.\n\n**Altri effetti dell\u0027incantesimo.** L\u0027incantatore posiziona uno dei seguenti effetti magici all\u0027interno dell\u0027area protetta:\n\n- Luci danzanti in quattro corridoi, specificando anche un semplice schema che le luci ripetono per la durata di vigilanza e interdizione.\n\n- Bocca magica in due luoghi.\n\n- Nube maleodorante in due luoghi (il vapore riappare nel giro di 10 minuti se disperso fintantoché vigilanza e interdizione permane).\n\n- Folata di vento in un corridoio o una stanza (il vento soffia ininterrottamente per la durata dell\u0027incantesimo).\n\n- Suggestione in un\u0027area quadrata con lato di 1,5 metri. Qualsiasi creatura che entri nell\u0027area riceve mentalmente la suggestione."},{"n":"Vincolo di interdizione","lv":2,"sc":"Abiurazione di 2º livello (Chierico, Paladino)","cl":"Chierico, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (un paio di anelli di platino del valore di 50 mo o più, che l\u0027incantatore e il bersaglio devono indossare per la durata dell\u0027incantesimo)\n**Durata:** 1 ora\n\nL\u0027incantatore tocca un\u0027altra creatura consenziente e crea un collegamento mistico tra sé e il bersaglio fino al termine dell\u0027incantesimo. Finché il bersaglio si trova entro 18 metri dall\u0027incantatore, ottiene un bonus di +1 alla CA e ai tiri salvezza e dispone di resistenza a tutti i danni. Inoltre, ogni volta che subisce danni, l\u0027incantatore ne subisce la stessa quantità.\n\nL\u0027incantesimo termina se l\u0027incantatore scende a 0 punti ferita, se lui e il bersaglio si allontanano di più di 18 metri o se l\u0027incantesimo viene lanciato di nuovo su una delle due creature collegate."},{"n":"Visione del vero","lv":6,"sc":"Divinazione di 6º livello (Bardo, Chierico, Mago, Stregone, Warlock)","cl":"Bardo, Chierico, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (polvere di funghi del valore di 25 mo o più, che l\u0027incantesimo consuma)\n**Durata:** 1 ora\n\nPer la durata dell\u0027incantesimo, una creatura consenziente toccata dall\u0027incantatore è dotata di vista pura fino a 36 metri."},{"n":"Vita falsata","lv":1,"sc":"Necromanzia di 1º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (una goccia di alcol)\n**Durata:** istantanea\n\nL\u0027incantatore ottiene 2d4 + 4 punti ferita temporanei.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore ottiene 5 punti ferita temporanei aggiuntivi per ogni slot di livello superiore al 1º."},{"n":"Volare","lv":3,"sc":"Trasmutazione di 3º livello (Mago, Stregone, Warlock)","cl":"Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (una piuma)\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore tocca una creatura consenziente. Per la durata dell\u0027incantesimo, il bersaglio ottiene una velocità di volo di 18 metri e può fluttuare. Al termine dell\u0027incantesimo, il bersaglio ancora sospeso in aria cade, sempre che non abbia modo di impedire la caduta.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 3º."},{"n":"Vuoto mentale","lv":8,"sc":"Abiurazione di 8º livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S\n**Durata:** 24 ore\n\nFino al termine dell\u0027incantesimo, l\u0027incantatore tocca una creatura consenziente rendendola immune ai danni psichici e alla condizione affascinato. Inoltre, il bersaglio non è influenzato da nulla che sia in grado di percepire le sue emozioni o allineamento, leggere i suoi pensieri o individuare magicamente la sua posizione. Nessun incantesimo, nemmeno l\u0027incantesimo desiderio, può raccogliere informazioni sul bersaglio, osservarlo a distanza, o controllarne la mente."},{"n":"Zona di verità","lv":2,"sc":"Ammaliamento di 2º livello (Bardo, Chierico, Paladino)","cl":"Bardo, Chierico, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** 10 minuti\n\nL\u0027incantatore crea una zona magica che protegge dagli inganni all\u0027interno di una sfera del raggio di 4,5 metri, centrata su un punto entro gittata. Fino al termine dell\u0027incantesimo, una creatura che entra nell\u0027area dell\u0027incantesimo per la prima volta in un turno o che inizia qui il suo turno effettua un tiro salvezza su Carisma. Se lo fallisce, non può mentire deliberatamente mentre si trova nell\u0027area. L\u0027incantatore sa se il bersaglio supera o meno il tiro salvezza.\n\nUna creatura influenzata è consapevole dell\u0027incantesimo e può evitare di rispondere alle domande a cui normalmente risponderebbe mentendo. In tal caso, deve essere evasiva, ma sincera."}],"soglie":[["randello",3],["falcetto",3],["dardo",3],["fionda",3],["pugnale",4],["randello pesante",4],["giavellotto",4],["martello leggero",4],["mazza",4],["cerbottana",4],["ascia",5],["bastone ferrato",5],["lancia",5],["tridente",5],["frusta",5],["balestra a mano",5],["balestra leggera",5],["arco corto",5],["mazzafrusto",7],["morning star",7],["scimitarra",7],["spada corta",7],["piccone da guerra",7],["ascia da battaglia",10],["spada lunga",10],["stocco",10],["martello da guerra",10],["balestra pesante",10],["falcione",13],["ascia bipenne",13],["spadone",13],["alabarda",13],["lancia da cavaliere",13],["maglio",13],["picca",13],["arco lungo",13]],"afflizioni":["**Le catene.** Dall\u0027arma salgono catene fredde che nessun altro vede, e gli si stringono intorno al petto. È Paralizzato finché non subisce danni.","**Lo schianto.** Qualcosa lo colpisce da dentro. È Incapacitato, e passa dal ridere al piangere al balbettare.","**Lo specchio.** Vede per un istante dall\u0027altra parte, e gli occhi gli diventano neri. È Spaventato da tutto ciò che vede, e a ogni turno usa il movimento per allontanarsene.","**La lingua.** La lingua gli diventa nera, appuntita e marcia, e nessuno capisce più quello che dice, tranne i posseduti.","**La furia.** La pelle gli si arrossa e le vene si gonfiano. A ogni turno attacca la creatura più vicina, amica o nemica.","**Le visioni.** Ovunque guardi vede cose che non ci sono, e piange lacrime nere. Ha svantaggio a tutte le prove di caratteristica.","**La resa.** Abbassa la testa, e obbedisce a qualunque ordine, tranne quelli che lo ucciderebbero.","**La fame.** Mangia tutto quello che trova, le razioni, poi la terra, poi quello che c\u0027è per terra, e la mascella gli si sloga come quella di un serpente. È Incapacitato.","**Lo sguardo.** Vede una cosa bellissima e terribile, e non riesce a smettere di guardarla. È Accecato e Stordito.","**La caduta.** Cade come un burattino a cui hanno tagliato i fili. È Privo di sensi."],"regole":[{"n":"Le Fiasche","md":"## Cosa sono\n\nOgni agente dell\u0027Accademia porta al collo una **Fiasca**, una boccetta di cristallo bianco, lo stesso delle torri, chiusa con un tappo di piombo. Dentro c\u0027è l\u0027**Acqua di Torre**, acqua lasciata per una notte intera sotto l\u0027Ultimo Raggio, che brilla appena di una luce calda che non si vede in nessun\u0027altra parte del mondo. Sa di ferro e di qualcosa che nessuno sa più descrivere, e chi è nato prima della Notte dice che sa di sole.\n\nBevuta, chiude le ferite. Le pozioni di guarigione esistono ancora, ma sono rare e care, e nessuno se ne fida quanto di una Fiasca.\n\n---\n\n## La regola\n\n### Quante Fiasche hai\n\nOgni personaggio ha **3 Fiasche**, e il numero sale trovando le **Schegge di Cristallo** (vedi _Migliorare le Fiasche_).\n\n### Bere una Fiasca\n\n- **Azione bonus:** bevi una Fiasca e recuperi Punti Ferita.\n- **Quanto curi:** tira un numero di dadi del tuo tipo di **Dado Vita** pari alla **metà del tuo bonus di competenza, arrotondata per eccesso**, più il tuo modificatore di **Costituzione** (minimo 0). Non spendi Dadi Vita, ne usi soltanto il tipo.\n- **Il rischio:** chi beve abbassa la guardia, e dopo aver bevuto **non puoi effettuare reazioni** fino all\u0027inizio del tuo turno successivo.\n\n### Far bere un compagno\n\nCon l\u0027azione **Utilizzare** puoi far bere la tua Fiasca a una creatura entro 1,5 m, anche se è a 0 Punti Ferita. La creatura recupera PF come se l\u0027avesse bevuta lei, usando i suoi Dadi Vita e la sua Costituzione.\n\n### Riempirle\n\nLe Fiasche si riempiono **al termine di un riposo lungo passato accanto a una fiamma viva**, tenuta accesa per tutto il riposo, perché la luce si ricarica dalla luce. Una fiamma magica non basta, e senza fuoco il riposo lungo funziona normalmente, ma le Fiasche restano vuote.\n\n### Gettare una Fiasca\n\nCon un\u0027**azione** puoi lanciare una Fiasca piena contro una creatura entro 9 m, con un tiro per colpire a distanza in cui sei competente e che usa la Destrezza. Se colpisci, la Fiasca si apre addosso al bersaglio: i non morti, le creature del Buio e quelle con _Sensibilità alla Luce Viva_, come il Popolo del Profondo, subiscono **2d8 danni radianti**, più 2d8 per ogni Cenere del Sole sciolta nelle Fiasche del gruppo (vedi sotto), mentre le altre creature non subiscono niente. La Fiasca non si rompe, ma resta vuota.\n\n### Cosa non si può fare\n\n- Durante l\u0027**Ultima Difesa** non puoi bere Fiasche, né riceverle (vedi [[L\u0027Ultima Difesa]]).\n- Una Fiasca è legata a chi la porta. Se la presti l\u0027acqua funziona, ma una volta vuota si riempie soltanto al collo del suo padrone.\n\n---\n\n## Migliorare le Fiasche\n\nNel mondo si trovano due cose:\n- **Schegge di Cristallo.** Sono pezzi del cristallo bianco delle torri, sparsi dove l\u0027Accademia è stata o dove qualcuno li ha portati. Portata a un vetraio dell\u0027Accademia (vedi [[Lapidario I · Le Colline di Val di Sole]]), una Scheggia diventa una **Fiasca in più** per un personaggio, fino a un massimo di 7 Fiasche a testa.\n- **Ceneri del Sole.** Sono granelli di una polvere dorata, calda al tatto, che si trovano dove il Primo Sole ha lasciato qualcosa di sé. Una Cenere sciolta nell\u0027Acqua di Torre aumenta di 1 la **Potenza** delle Fiasche di **tutto il gruppo**, e ogni Fiasca cura **un dado in più**, fino a un massimo di **due Ceneri**, cioè due dadi in più.\n\n### Quanto curano\n\n| | 1° livello | 5° livello | 11° livello | 17° livello |\n|---|---|---|---|---|\n| **Mago** (d6, Cos +1/+2) | 1d6 + 1 · media 4,5 | 2d6 + 1 · media 8 | 2d6 + 2 · media 9 | 3d6 + 2 · media 12,5 |\n| **Guerriero** (d10, Cos +3/+4) | 1d10 + 3 · media 8,5 | 2d10 + 3 · media 14 | 2d10 + 4 · media 15 | 3d10 + 4 · media 20,5 |\n| **Barbaro** (d12, Cos +3/+5) | 1d12 + 3 · media 9,5 | 2d12 + 3 · media 16 | 2d12 + 4 · media 17 | 3d12 + 5 · media 24,5 |\n\nOgni Cenere del Sole aggiunge un dado a tutte queste cifre, fino a due.\n\n---"},{"n":"L\u0027Ultima Difesa","md":"## La regola\n\n### Quando si dichiara\n\nQuando il tuo personaggio scende a **0 Punti Ferita**, o quando sta già effettuando **tiri salvezza contro la morte**, puoi dichiarare l\u0027**Ultima Difesa**. Il personaggio non crolla, ma si rialza subito, senza spendere movimento, e agisce nel suo turno, tenuto in piedi dall\u0027adrenalina e dalla forza di volontà.\n\n### I Punti Ferita nascosti\n\nDa quel momento **non sai più quanti Punti Ferita hai**.\n- Il Master tira in segreto la tua **riserva**: un tuo Dado Vita ogni due livelli (minimo uno), più il tuo modificatore di Costituzione (minimo 1). Quelli sono i tuoi Punti Ferita per tutta la durata dell\u0027Ultima Difesa.\n- Ogni danno che subisci viene sottratto in segreto. Il Master non ti dice quanto hai perso né quanto ti resta, ma ti descrive soltanto quello che succede al tuo corpo.\n- La riserva non scende sotto 0, e se arriva a 0 **continui a combattere lo stesso**, senza che il personaggio lo sappia, né tu.\n\n### Cosa puoi fare\n\n- L\u0027Ultima Difesa dura fino alla fine dello scontro, e comunque **non più di 10 round**.\n- **Ogni tua azione deve servire ad attaccare un nemico**: puoi usare l\u0027azione di Attacco, oppure un incantesimo, un trucchetto o una capacità che infligge danni a un nemico, ma non puoi usare le azioni Aiutare, Cercare, Disimpegnarsi, Influenzare, Nascondersi, Scattare, Studiare e Utilizzare, né lanciare incantesimi che non feriscono nessuno.\n- Puoi usare le **azioni bonus** e le **reazioni** soltanto per attaccare o per rendere un attacco più letale, come un attacco di opportunità, un attacco con l\u0027arma secondaria o una punizione.\n- Puoi **muoverti** liberamente.\n- **Non puoi ricevere cure né Punti Ferita temporanei** di alcun tipo, da nessuno, nemmeno da te stesso.\n- Metti a segno un **colpo critico con 19 o 20** ai tiri per colpire.\n- Non effettui tiri salvezza contro la morte.\n\n### Quando finisce\n\nAlla fine dello scontro, o alla fine del decimo round, il corpo crolla.\n- **Se la riserva è a 0**, il personaggio **muore sul colpo**, senza tiri salvezza e senza appello.\n- **Se la riserva è sopra 0**, il personaggio sopravvive. Cade a terra Prono, con i Punti Ferita che gli restano nella riserva, che a questo punto il Master ti comunica, e subisce subito **3 livelli di Indebolimento** per lo sforzo.\n\n### Casi particolari\n\n- **Una volta per riposo lungo.** Un personaggio può dichiarare l\u0027Ultima Difesa una sola volta tra un riposo lungo e il successivo.\n- **I danni enormi** che di solito uccidono sul colpo una creatura a 0 PF non si applicano, e finiscono nella riserva come tutti gli altri.\n- **Gli effetti che uccidono senza infliggere danni**, come _parola del potere: uccidere_, funzionano normalmente, e controllano i Punti Ferita della riserva.\n- **L\u0027Indebolimento** si somma a quello che il personaggio ha già, e al sesto livello il personaggio muore.\n\n---"},{"n":"Il Colpo Critico","md":"## La regola\n\nQuando metti a segno un **colpo critico**, non tiri il doppio dei dadi di danno, ma:\n- **prendi il massimo** dei dadi di danno dell\u0027attacco;\n- **aggiungi un tiro normale** degli stessi dadi;\n- **poi aggiungi i modificatori**, una volta sola, come sempre.\n\nIn breve: **massimo dei dadi + tiro dei dadi + modificatori.**\n\nPer esempio, se metti a segno un critico con un\u0027arma da 1d8, invece di tirare 2d8 infliggi **8 + 1d8**, più i tuoi modificatori, e così un critico ha davvero peso.\n\n**La regola vale anche per i nemici.**\n\n### Esempi\n\n| Attacco | Critico normale | Con questa regola |\n|---|---|---|\n| Spada lunga (1d8 + 3) | 2d8 + 3 · media 12 | 8 + 1d8 + 3 · media 15,5 |\n| Stocco con attacco furtivo (1d8 + 3d6 + 4) | 2d8 + 6d6 + 4 · media 34 | 26 + 1d8 + 3d6 + 4 · media 45 |\n| Spadone con punizione (2d6 + 2d8 + 4) | 4d6 + 4d8 + 4 · media 36 | 28 + 2d6 + 2d8 + 4 · media 48 |\n| Il pugno di un gigante (6d8 + 10) | 12d8 + 10 · media 64 | 48 + 6d8 + 10 · media 85 |\n\n### Cosa conta\n\n- **Tutti i dadi di danno dell\u0027attacco**, cioè l\u0027arma, l\u0027attacco furtivo, le punizioni, le maledizioni e i dadi degli incantesimi con tiro per colpire.\n- **I modificatori non raddoppiano.**\n- **I dadi in più che un tratto aggiunge solo sui critici** si tirano normalmente, senza prenderne il massimo.\n- **Gli incantesimi con tiro salvezza** non fanno colpi critici, come nelle regole normali.\n- Durante l\u0027**Ultima Difesa** il critico arriva con 19 o 20, e si calcola con questa regola (vedi [[L\u0027Ultima Difesa]]).\n\n---"},{"n":"Il Colpo di Grazia","md":"## La regola\n\n### Quando si usa\n\nQuando un personaggio giocante porta un **Boss** a 0 Punti Ferita con il colpo che lo uccide davvero, quel momento non è una semplice morte meccanica, e il giocatore che ha dato il colpo **prende in mano la scena**.\n\n### Cosa fa il giocatore\n\n1. **Descrive il colpo:** come arriva, che cosa si vede, che cosa si sente.\n2. **Dichiara un Bersaglio Mirato:** una parte del corpo del Boss, la sua arma oppure un suo accessorio.\n\n### Cosa ottiene\n\nDal bersaglio mirato il Master ricava un **Trofeo**, cioè un materiale raro o un oggetto unico che **non si può ottenere in nessun altro modo**, e che si aggiunge al bottino normale del Boss. Per esempio:\n- recidere una coda velenosa e ricavarne una lama che avvelena;\n- spaccare un\u0027armatura e recuperarne intatto il nucleo magico.\n\n### Le condizioni\n\n- **Il colpo deve poterci arrivare.** La descrizione deve stare in piedi: una freccia può accecare un occhio e un\u0027ascia può staccare una zanna, ma una palla di fuoco non recide una coda di netto. Se il colpo non può raggiungere quel bersaglio, il Master chiede di sceglierne un altro.\n- **Quello che colpisci si salva, quello intorno si perde.** Se spacchi l\u0027armatura per prendere il nucleo, l\u0027armatura non c\u0027è più, e se tagli la testa la testa è tua, ma quello che c\u0027era nel collo no.\n- **Un solo Trofeo per Boss**, scelto da chi dà il colpo finale.\n- **Conta solo il colpo che lo uccide davvero**, e nei Boss a più fasi conta l\u0027ultima.\n- **Niente Colpo di Grazia** se il colpo finale lo dà un PNG, una trappola, il crollo di una caverna o qualunque cosa che non sia un personaggio giocante.\n- **Se il giocatore non dichiara un bersaglio**, il Boss muore normalmente e lascia soltanto il suo bottino.\n\n### Cos\u0027è un Boss\n\nSono Boss le grandi creature della Notte, quelle uniche, che hanno un nome e una storia, e ogni creatura con Azioni Leggendarie. Prima dello scontro il Master dice se una creatura è un Boss.\n\n---"},{"n":"I Talismani","md":"### Un talismano\n\n- Un personaggio può avere **un solo talismano attivo**, o due se porta la **Sacca delle Due Voci** (vedi sotto). Può portarne addosso quanti ne vuole, ma gli altri non funzionano.\n- I talismani **non richiedono sintonia** e **non contano** nel limite dei tre oggetti in sintonia.\n- Per **attivare** un talismano, o per sostituirlo con un altro, serve un **riposo breve** passato tenendolo in mano. Alla fine del riposo il nuovo talismano è attivo, e quello di prima smette di funzionare.\n- Un talismano attivo funziona finché resta **sulla persona** di chi l\u0027ha attivato, al collo, in tasca o cucito nella fodera, e se resta a più di 30 m da lui per un intero sonno smette di essere attivo.\n- Le caratteristiche aumentate da un talismano non possono superare 22.\n\n### La Sacca delle Due Voci\n\nChi ne porta due sente due voci, e le due voci litigano. Esiste però una sacca che le mette d\u0027accordo, e si trova soltanto addosso a chi l\u0027ha rubata a un altro.\n\n\n- **La regola.** Finché porti la sacca alla cintura, puoi avere **due talismani attivi** invece di uno. Devono essere diversi, e non possono essere due gradi dello stesso talismano.\n- **Attivarli.** Ognuno si attiva con il suo riposo breve, come sempre.\n- **Perderla.** Se la sacca ti viene tolta, o resta a più di 30 m da te per un intero sonno, il secondo talismano che hai attivato smette di funzionare.\n- **Rarità.** È un oggetto meraviglioso molto raro, e non richiede sintonia.\n\n### I gradi\n\nAlcuni talismani esistono in più **gradi** (+1, +2, +3), cioè oggetti della stessa origine, più antichi o più forti, che si trovano in posti diversi.\n\n### I talismani maledetti\n\nAlcuni talismani sono **maledetti**, ed è scritto nella loro descrizione. Una volta attivato, un talismano maledetto non si può sostituire con un riposo breve, ma serve _rimuovi maledizione_ o un\u0027altra magia che ponga fine a una maledizione, e chi lo trova non lo sa finché non lo prova."},{"n":"Il patto","md":"Quando accetta l\u0027Offerta, il personaggio sceglie una caratteristica tra **Intelligenza**, **Saggezza** e **Carisma**: è la sua caratteristica del patto, e non cambia più. Ogni patto ne consiglia una, ma la scelta resta del giocatore.\n\n- **CD del patto** = 8 + il tuo bonus di competenza + il modificatore della caratteristica del patto.\n- **Bonus d\u0027attacco del patto** = il tuo bonus di competenza + il modificatore della caratteristica del patto.\n\nQuando un Dono dice _una volta per riposo lungo_, recuperi l\u0027uso al termine di un riposo lungo. Quando dice _una volta per riposo breve_, lo recuperi al termine di un riposo breve o lungo. Quando dice _un numero di volte pari al tuo bonus di competenza_, recuperi tutti gli usi spesi al termine di un riposo lungo.\n\nÈ il cuore del patto. Una Paura mangia la paura degli altri, e il suo Avatar deve portargliela.\n\n**Il Tributo.** Pagare il Tributo vuol dire far provare davvero a qualcuno la paura della propria Paura: chiudere un uomo in un pozzo per l\u0027Avatar del Sepolto, inseguire qualcuno fino a che non smette di sperare per quello della Caccia, farsi raccontare da qualcuno la cosa peggiore che gli è successa per quello dell\u0027Occhio. Non c\u0027è un tiro: è una scena, che il giocatore propone e il Master accetta. La vittima può essere un nemico, un estraneo o un amico, e non deve per forza morire; quello che conta è che abbia avuto paura nel modo giusto, e che l\u0027Avatar fosse lì a guardarla. Ogni pagina dei patti dà degli esempi.\n\n**Quanto spesso.** Un Avatar deve pagare **un Tributo per luna**. Dal Grado IV, **due**.\n\n**Il Grande Tributo.** È un Tributo che conta di più, e serve per salire di Grado: pagato in un Dominio della Paura, oppure su qualcuno di importante per la storia o per l\u0027Avatar stesso. Il Master decide se un Tributo è anche un Grande Tributo, e lo dice.\n\n**Tradire la Paura.** Ogni Paura ha dei gesti che la affamano, elencati nella sua pagina del capitolo 2. Se l\u0027Avatar ne compie uno di proposito, il Tributo di quella luna non conta più, e va pagato di nuovo. Non è un divieto: è un prezzo, e a volte un personaggio lo pagherà volentieri.\n\n**I Richiami di un Avatar.** Per chi è già Avatar di una Paura, due Richiami verso la sua Paura nella stessa luna valgono un Tributo.\n\n### La Fame\n\nUna Paura che non mangia comincia a mangiare il suo Avatar. La Fame ha tre stati, e un Tributo pagato li toglie tutti.\n\n| Stato | Quando | Che cosa succede |\n|---|---|---|\n| **Affamato** | finisce una luna senza il Tributo | Il Segno si vede, e non puoi lanciare gli incantesimi del patto né usare i Doni di Grado III o superiore. |\n| **Consumato** | finisce la seconda luna senza Tributo | Come Affamato, e in più hai un livello di Indebolimento che non si toglie in nessun modo finché non paghi. |\n| **Reclamato** | finisce la terza luna senza Tributo | La Paura viene a prenderti. Prima del tuo riposo lungo successivo devi pagare un Grande Tributo, oppure cominciare a rinnegarla. Se non fai nessuna delle due cose, diventi una sua creatura e il personaggio passa al Master. |"}],"srd":"Quest\u0027opera include materiale tratto dal System Reference Document 5.2.1 (\"SRD 5.2.1\") di Wizards of the Coast LLC, disponibile all\u0027indirizzo https://www.dndbeyond.com/srd. Il SRD 5.2.1 è concesso in licenza ai sensi della licenza di attribuzione 4.0 Internazionale di Creative Commons, disponibile all\u0027indirizzo https://creativecommons.org/licenses/by/4.0/legalcode."}</script>

const passo = (a, v, et, min = 0, max = 99) => `<div class="riga"><span class="et" style="flex:1">${et}</span><button class="btn tondo" data-a="${a}" data-d="-1" ${v <= min ? "disabled" : ""} aria-label="Meno">−</button><span class="num" style="min-width:2ch;text-align:center;font-size:22px;font-family:var(--f-titolo)">${v}</span><button class="btn tondo" data-a="${a}" data-d="1" ${v >= max ? "disabled" : ""} aria-label="Più">+</button></div>`;

// ------------------------------------------------------------ la scheda
function vScheda(pg, c) {
  const specie = [...D.specie.map(s => s.n), ...SPECIE_MANUALE];
  const sp = D.specie.find(s => s.n === pg.specie);
  let h = "";
  if (pg.esempio) h += `<div class="avviso oro">Questo è un personaggio d'esempio, per vedere come funziona la scheda. Crea il tuo dal pulsante in alto a destra: l'esempio si può eliminare quando vuoi.</div>`;
  h += `<h2 class="sez">Il personaggio</h2><div class="ident">${campo("nome", pg.nome, "Nome")}${campo("giocatore", pg.giocatore, "Giocatore")}
    <label class="etichettato"><span class="et">Specie</span><select class="campo" data-k="specie">${opz(specie, pg.specie, "Scegli")}</select></label>
    ${sp && /o Piccola/.test(sp.taglia) ? scelta("taglia", ["Media", "Piccola"], pg.taglia, "Taglia", "Scegli") : ""}
    ${campo("background", pg.background, "Background")}${scelta("luna", LUNE, pg.luna, "Luna di nascita", "Non la so")}</div>`;
  h += `<h3 class="sotto">Classe e livello</h3><div style="display:grid;gap:8px">`;
  pg.classi.forEach((x, i) => {
    const k = classe(x.c);
    const notte = k.v ? k.v.sott.map(s => s.n) : D.sottoclassi.filter(s => s.cl === x.c).map(s => s.n);
    const manuale = SOTT_MANUALE[x.c] || [], tasha = SOTT_TASHA[x.c] || [];
    const libera = x.libera || (x.sott && !notte.includes(x.sott) && !manuale.includes(x.sott) && !tasha.includes(x.sott));
    const selSott = `<select class="campo" data-k="classi.${i}.sott"><option value="">—</option>${notte.length ? `<optgroup label="Della Notte">${opz(notte, x.sott)}</optgroup>` : ""}${manuale.length ? `<optgroup label="${x.c === "Artefice" ? "Artefice" : "Del manuale 2024"}">${opz(manuale, x.sott)}</optgroup>` : ""}${tasha.length ? `<optgroup label="Da Tasha">${opz(tasha, x.sott)}</optgroup>` : ""}<option value="__altra">Un'altra, la scrivo io</option></select>`;
    const campoSott = libera ? `<div class="riga" style="flex-wrap:nowrap"><input class="campo" data-k="classi.${i}.sott" value="${esc(x.sott)}" placeholder="Nome della sottoclasse"><button class="btn tondo" data-a="sottlista" data-i="${i}" aria-label="Torna all'elenco">≡</button></div>` : selSott;
    h += `<div class="classe-riga"><label class="etichettato"><span class="et">${i ? "Seconda classe" : "Classe"}</span><select class="campo" data-k="classi.${i}.c">${opz([["", "Scegli"], ...NOMI_CLASSI.map(n => [n, n])], x.c)}</select></label>
      <label class="etichettato"><span class="et">Livello</span><input class="campo" data-k="classi.${i}.lv" data-t="n" inputmode="numeric" value="${esc(x.lv)}"></label>
      <label class="etichettato sott"><span class="et">Sottoclasse</span>${campoSott}</label>
      ${i ? `<button class="btn tondo" data-a="togliclasse" data-i="${i}" aria-label="Togli la classe">×</button>` : `<span></span>`}</div>`;
  });
  h += `</div><div class="riga" style="margin-top:8px"><button class="btn piccolo" data-a="piuclasse">+ Un'altra classe</button><span class="nota">Livello ${c.liv} · bonus di competenza ${segno(c.bc)}</span></div>`;

  // vitali
  const perc = Math.max(0, Math.min(100, Math.round(100 * pg.pf.att / c.pfMax)));
  h += `<h2 class="sez">Punti Ferita${pg.ud.attiva ? ` <span class="badge sangue">Ultima Difesa</span>` : ""}</h2>`;
  if (pg.ud.attiva) {
    h += `<div class="blocco"><p style="margin:0 0 8px">Sei in piedi per l'<b>Ultima Difesa</b>. I tuoi PF li tiene il Master, e non li sai. Ogni azione deve servire ad attaccare un nemico. Non puoi ricevere cure né PF temporanei, né bere Fiasche. Metti a segno un critico con 19 o 20.</p>
      ${passo("udround", pg.ud.round, "Round (massimo 10)", 1, 10)}<div class="riga" style="margin-top:8px"><button class="btn forte" data-a="udfine">Fine dello scontro</button></div></div>`;
  } else {
    h += `<div class="blocco"><div class="pf"><div><div class="grande num">${pg.pf.att}<small> / ${c.pfMax}</small></div>${pg.pf.temp ? `<div class="temp">+${pg.pf.temp} PF temporanei</div>` : ""}<div class="barra"><i style="width:${perc}%"></i></div></div>
      <div style="display:grid;gap:6px"><div class="pfmossa"><input class="campo num" id="pf-q" inputmode="numeric" placeholder="0" aria-label="Quantità"></div></div></div>
      <div class="riga" style="margin-top:10px"><button class="btn forte" data-a="pf" data-v="danno">Danno</button><button class="btn" data-a="pf" data-v="cura" style="color:var(--vivo);border-color:var(--vivo)">Cura</button><button class="btn oro" data-a="pf" data-v="temp">PF temporanei</button></div>
      ${c.pfRid ? `<p class="nota">Le armi annerite ti tolgono ${c.pfRid} PF massimi.</p>` : ""}
      ${pg.pf.att <= 0 ? `<div class="avviso">Sei a 0 PF. Tira i tiri salvezza contro la morte, oppure dichiara l'Ultima Difesa.</div>` : ""}</div>`;
  }
  h += `<div class="tessere">
    <div class="tessera"><span class="v num">${c.ca}</span><span class="l">CA</span></div>
    <button class="tessera" data-a="tira" data-l="Iniziativa" data-m="${c.init}"><span class="v num">${segno(c.init)}</span><span class="l">Iniziativa</span></button>
    <div class="tessera"><span class="v num" style="font-size:22px">${metri(c.vel)}</span><span class="l">Velocità</span></div>
    <div class="tessera"><span class="v num">${segno(c.bc)}</span><span class="l">Competenza</span></div>
    <div class="tessera"><span class="v num">${c.passiva}</span><span class="l">Percezione passiva</span></div>
    <button class="tessera${pg.isp ? " on" : ""}" data-a="isp" aria-pressed="${pg.isp}"><span class="v">${pg.isp ? "✦" : "·"}</span><span class="l">Ispirazione</span></button></div>`;

  // dadi vita, fiasche, morte
  h += `<div class="griglia2" style="margin-top:12px">`;
  h += `<div class="blocco"><div class="et">Dadi Vita</div>${Object.entries(c.dv).map(([f, n]) => { const sp = Math.min(n, +pg.dvSpesi[f] || 0); return `<div class="riga" style="margin-top:6px"><span class="num" style="font-family:var(--f-titolo);font-size:20px;width:58px">${n - sp}d${f}</span>${pips(n, n - sp, "dv", `data-f="${f}"`, "oro")}</div>`; }).join("") || `<p class="nota">Scegli una classe.</p>`}</div>`;
  h += `<div class="blocco"><div class="et">Fiasche · cura ${esc(c.fiaCura)}</div><div style="margin-top:6px">${pips(c.fiaMax, Math.min(c.fiaMax, pg.fiasche.piene), "fiasca", "", "vivo")}</div>
    <div class="riga" style="margin-top:8px"><button class="btn piccolo" data-a="bevi" ${pg.fiasche.piene > 0 && !pg.ud.attiva ? "" : "disabled"}>Bevi una Fiasca</button></div><p class="nota">Azione bonus. Dopo aver bevuto non puoi usare reazioni fino al tuo turno successivo.</p></div>`;
  h += `<div class="blocco"><div class="et">Tiri salvezza contro la morte</div><div class="riga" style="margin-top:6px"><span style="width:84px">Successi</span>${pips(3, pg.morte.s, "morte", 'data-v="s"', "vivo")}</div><div class="riga" style="margin-top:6px"><span style="width:84px">Fallimenti</span>${pips(3, pg.morte.f, "morte", 'data-v="f"')}</div>
    <div class="riga" style="margin-top:8px"><button class="btn piccolo" data-a="tiramorte">Tira</button>${!pg.ud.attiva ? `<button class="btn piccolo forte" data-a="udvia" ${pg.ud.usata ? "disabled" : ""}>Ultima Difesa</button>` : ""}</div>${pg.ud.usata && !pg.ud.attiva ? `<p class="nota">Ultima Difesa già usata: torna con il riposo lungo.</p>` : ""}</div>`;
  h += `</div>`;

  // stato
  h += `<h2 class="sez">Condizioni</h2><div class="blocco">${passo("indeb", +pg.indeb || 0, "Indebolimento", 0, 6)}${pg.indeb ? `<p class="nota">−${2 * pg.indeb} a ogni tiro di d20 (lo tolgo io dai tiri), −${metri(1.5 * pg.indeb)} di velocità.${pg.indeb >= 6 ? " Al sesto livello il personaggio muore." : ""}</p>` : ""}
    <div class="chips" style="margin-top:10px">${CONDIZIONI.map(k => `<button class="chip${pg.cond.includes(k) ? " on" : ""}" data-a="cond" data-v="${k}" aria-pressed="${pg.cond.includes(k)}">${k}</button>`).join("")}</div></div>`;
  h += `<div class="riga" style="margin-top:12px"><button class="btn" data-a="riposo" data-v="breve">Riposo breve</button><button class="btn oro" data-a="riposo" data-v="lungo">Riposo lungo</button></div>`;

  // caratteristiche
  h += `<h2 class="sez">Caratteristiche<span class="dx">tocca un numero per tirare</span></h2><div class="caratt">`;
  AB.forEach(a => {
    const up = c.car[a] - (+pg.car[a] || 10);
    h += `<div class="car"><span class="n">${ABN[a]}</span><button class="m num" data-a="tira" data-l="Prova di ${ABN[a]}" data-m="${c.m[a]}">${segno(c.m[a])}</button>
      <input data-k="car.${a}" data-t="n" inputmode="numeric" value="${esc(pg.car[a])}" aria-label="Punteggio di ${ABN[a]}">${up ? `<span class="up">talismano: ${c.car[a]}</span>` : ""}
      <button class="ts" data-a="tira" data-l="Tiro salvezza su ${ABN[a]}" data-m="${c.ts[a]}"><span class="dot${c.tsProf[a] ? " si" : ""}" data-a="tsprof" data-v="${a}" role="button" aria-label="Competenza nel tiro salvezza"></span>TS ${segno(c.ts[a])}</button></div>`;
  });
  h += `</div><p class="nota">Il pallino dei tiri salvezza segna la competenza: la prima classe la dà da sola, ma puoi cambiarla toccandolo.</p>`;
  h += `<h2 class="sez">Abilità<span class="dx">● competenza · ◉ maestria</span></h2><ul class="abil">`;
  ABILITA.forEach(([n, a]) => { const p = +pg.abil[n] || 0; h += `<li><button class="dot${p === 1 ? " si" : p === 2 ? " due" : ""}" data-a="abil" data-v="${n}" aria-label="Competenza in ${n}"></button><span class="nome">${n}<small>${a}</small></span><button class="val num" data-a="tira" data-l="${n}" data-m="${c.abil[n]}">${segno(c.abil[n])}</button></li>`; });
  h += `</ul>`;
  h += `<details class="apri" style="margin-top:14px"><summary><span class="nome et">Correzioni a mano</span></summary><div class="dentro"><div class="griglia2">
    ${num("pf.maxMan", pg.pf.maxMan, "PF massimi (vuoto = calcolati)", 'placeholder="auto"')}${num("pf.bonusMax", pg.pf.bonusMax, "PF massimi in più")}
    ${num("initBonus", pg.initBonus, "Iniziativa in più")}${num("velBonus", pg.velBonus, "Velocità in più (m)")}${num("tsBonus", pg.tsBonus, "Bonus a tutti i TS")}</div>
    <p class="nota">I PF massimi calcolati usano il dado pieno al 1° livello e la media ai livelli dopo, più la Costituzione.</p></div></details>`;
  return h;
}

// ------------------------------------------------------------ armi e armatura
function vArmi(pg, c) {
  const a = c.armatura;
  let h = `<h2 class="sez">Armatura<span class="dx">CA ${c.ca}</span></h2><div class="blocco"><div class="griglia2">
    <label class="etichettato"><span class="et">Armatura</span><select class="campo" data-k="ca.arm"><option value="">Nessuna</option>
      <optgroup label="Del manuale">${opz(ARMATURE.filter(x => !x.notte).map(x => [x.n, x.n + " · " + CAT[x.cat]]), pg.ca.arm)}</optgroup>
      <optgroup label="Le Corazze della Notte">${opz(ARMATURE.filter(x => x.notte).map(x => [x.n, x.n + " · " + CAT[x.cat]]), pg.ca.arm)}</optgroup></select></label>
    ${a ? num("ca.bonusArm", pg.ca.bonusArm, "Bonus magico dell'armatura") : scelta("ca.senza", [["auto", "Automatica"], ["base", "10 + Des"], ["barbaro", "10 + Des + Cos (Barbaro)"], ["monaco", "10 + Des + Sag (Monaco)"]], pg.ca.senza, "Difesa senza armatura")}
    ${num("ca.bonus", pg.ca.bonus, "Altri bonus alla CA")}</div>
    <div class="riga" style="margin-top:10px">${spunta("ca.scudo", pg.ca.scudo, "Scudo (+2)")}${pg.ca.scudo ? `<input class="campo corto" data-k="ca.bonusScudo" data-t="n" inputmode="numeric" value="${esc(pg.ca.bonusScudo)}" aria-label="Bonus magico dello scudo"><span class="nota">bonus magico dello scudo</span>` : ""}</div>
    <p class="nota">${esc(c.caNota)}${a ? ` · CA ${a.ca}${a.des ? " + Des" + (a.max != null ? " (max " + a.max + ")" : "") : ""}` : ""}${c.fx.ca ? ` · talismano +${c.fx.ca}` : ""}</p>
    ${a && a.furt ? `<p class="nota">Svantaggio alle prove di Destrezza (Furtività).</p>` : ""}
    ${c.forzaManca ? `<div class="avviso">Ti serve Forza ${a.for} per questa armatura: la tua velocità cala di 3 m.</div>` : ""}</div>`;
  h += `<h2 class="sez">Armi<span class="dx">tocca per tirare</span></h2>`;
  if (!pg.armi.length) h += `<div class="vuoto">Nessuna arma. Aggiungi quella che porti.</div>`;
  pg.armi.forEach((w, i) => {
    const x = datiArma(w, c), s = sogliaArma(w), ann = annerita(w);
    const ogg = w.ogg ? D.oggetti.find(o => o.n === w.ogg) : null;
    h += `<div class="carta${ann ? " annerita" : ""}"><div class="capo"><span class="nome">${esc(w.nome || (x.b ? x.b.n : "Arma"))}</span>${ann ? `<span class="badge">annerita</span>` : ""}${+w.bonus ? `<span class="rar">+${w.bonus}</span>` : ""}</div>
      <div class="colpi"><button class="colpo" data-a="attacco" data-i="${w.id}"><span class="v num">${segno(x.colpire)}</span><span class="l">per colpire</span></button><button class="colpo" data-a="danni" data-i="${w.id}"><span class="v num" style="font-size:20px">${esc(x.danni)}</span><span class="l">${esc(x.tipo || "danni")}</span></button></div>
      <div class="prop">${x.prop ? `<b>Proprietà</b> ${esc(x.prop)}. ` : ""}${x.maestria ? `<b>Maestria</b> ${esc(x.maestria)}: ${esc(MAESTRIE[x.maestria])}` : ""}</div>
      ${ann ? `<div class="avviso" style="border-color:var(--nero)">Vantaggio ai tiri per colpire contro aberrazioni, immondi e non morti, e conta come magica. Vantaggio a Carisma (Intimidire) con la mano sull'elsa. Ti toglie ${s} PF massimi finché la porti, e con un 1 naturale tiri un TS su Saggezza con CD 15.</div>` : ""}
      ${s && !w.nonAnn ? `<div class="riga" style="margin-top:8px"><span class="et" style="flex:1">Tacche ${+w.tacche || 0} su ${s}</span><button class="btn tondo" data-a="tacca" data-i="${i}" data-d="-1" aria-label="Togli una tacca">−</button><button class="btn tondo" data-a="tacca" data-i="${i}" data-d="1" aria-label="Aggiungi una tacca">+</button></div>
        <div class="riga" style="margin-top:6px"><button class="btn piccolo" data-a="acquasanta" data-i="${i}" ${+w.tacche && !ann ? "" : "disabled"}>Acqua santa</button><button class="btn piccolo" data-a="vasca" data-i="${i}" ${+w.tacche ? "" : "disabled"}>Acqua della vasca</button></div>` : ""}
      <details class="apri" style="margin-top:8px"><summary><span class="nome et">Modifica</span></summary><div class="dentro"><div class="griglia2">
        ${campo(`armi.${i}.nome`, w.nome, "Nome")}
        <label class="etichettato"><span class="et">Arma di base</span><select class="campo" data-k="armi.${i}.base"><option value="">Personalizzata</option><optgroup label="Semplici">${opz(ARMI.filter(a => a.cat === "S").map(a => a.n), w.base)}</optgroup><optgroup label="Da guerra">${opz(ARMI.filter(a => a.cat === "G").map(a => a.n), w.base)}</optgroup></select></label>
        ${!x.b ? campo(`armi.${i}.dado`, w.dado, "Dado di danno", 'placeholder="1d6"') + campo(`armi.${i}.tipo`, w.tipo, "Tipo di danno", 'placeholder="taglienti"') : ""}
        ${num(`armi.${i}.bonus`, w.bonus, "Bonus magico")}
        ${scelta(`armi.${i}.car`, [["auto", "Automatica"], ...AB.map(a => [a, ABN[a]])], w.car || "auto", "Caratteristica")}
        ${campo(`armi.${i}.extra`, w.extra, "Danni in più", 'placeholder="1d6"')}</div>
        <div class="riga" style="margin-top:8px">${spunta(`armi.${i}.comp`, w.comp, "Competente")}${x.b && /Versatile/.test(x.b.prop) ? spunta(`armi.${i}.due`, w.due, "A due mani") : ""}${spunta(`armi.${i}.nonAnn`, w.nonAnn, "Non si annerisce")}${spunta(`armi.${i}.temprata`, w.temprata, "Temprata nella vasca")}</div>
        ${ogg ? `<div class="md">${md(ogg.md)}</div>` : ""}
        <div class="riga fine"><button class="btn piccolo" data-a="toglierma" data-i="${i}">Togli l'arma</button></div></div></details></div>`;
  });
  h += `<div class="riga" style="margin-top:10px"><button class="btn forte" data-a="nuovarma">+ Aggiungi un'arma</button><button class="btn" data-a="tira" data-l="Colpo senz'armi" data-m="${c.m.FOR + c.bc}" data-att="1">Colpo senz'armi ${segno(c.m.FOR + c.bc)} · ${Math.max(1, 1 + c.m.FOR)} contundenti</button></div>`;
  h += `<details class="apri" style="margin-top:16px"><summary><span class="nome">Le armi annerite</span><span class="dx">regola</span></summary><div class="dentro md"><p>Un'arma prende una <b>tacca</b> ogni volta che dà il colpo che porta a 0 PF un'aberrazione, un immondo o un non morto. Alla soglia diventa annerita.</p><p>L'acqua santa toglie metà delle tacche, ma non pulisce un'arma già annerita: per quella serve l'acqua della vasca del Santuario delle Maree.</p></div></details>`;
  h += `<details class="apri"><summary><span class="nome">Il colpo critico</span><span class="dx">regola della casa</span></summary><div class="dentro md"><p><b>Massimo dei dadi + un tiro degli stessi dadi + i modificatori</b>, una volta sola. Vale anche per i nemici.</p></div></details>`;
  return h;
}

// ------------------------------------------------------------ magia
function vMagia(pg, c) {
  let h = "";
  h += `<h2 class="sez">Caratteristica e CD</h2>`;
  if (!c.incantatori.length && !pg.magia.inc.length) h += `<div class="vuoto">La tua classe non lancia incantesimi. Se la specie, un talismano o un patto te ne dà, aggiungili qui sotto.</div>`;
  c.incantatori.forEach((x, i) => {
    h += `<div class="blocco"><div class="riga"><b style="flex:1;font-family:var(--f-epi);font-size:19px;font-weight:400">${esc(x.n)} · ${ABN[x.car]}</b></div><div class="tessere" style="margin-top:6px"><div class="tessera"><span class="v num">${x.cd}</span><span class="l">${esc(x.cdN)}</span></div>${x.noAtt ? "" : `<button class="tessera" data-a="tira" data-l="Attacco con un incantesimo" data-m="${x.att}" data-att="1"><span class="v num">${segno(x.att)}</span><span class="l">attacco con gli incantesimi</span></button>`}</div>
      ${i === 0 ? `<div style="margin-top:8px">${scelta("magia.car", [["", "Quella della classe"], ...AB.map(a => [a, ABN[a]])], pg.magia.car, "Caratteristica da incantatore")}</div>` : ""}</div>`;
  });
  pg.classi.forEach((x, i) => { if ((x.c === "Guerriero" || x.c === "Ladro") && !INC_SOTT[x.sott]) h += `<div style="margin-top:8px">${scelta(`classi.${i}.inc`, [["", "Non lancio incantesimi"], ["terzo", "Lancio incantesimi (Cavaliere Mistico o Mistificatore Arcano)"]], x.inc, x.c + ": incantesimi")}</div>`; });
  const slot = c.slots, extra = c.fx.slot;
  if (slot.length || c.patto || extra.length) {
    h += `<h2 class="sez">Slot incantesimo<span class="dx">tocca per spendere</span></h2><div>`;
    slot.forEach((n, l) => { if (!n) return; const u = Math.min(n, +pg.magia.usati[l] || 0); h += `<div class="slot-riga"><span class="lv num">${l + 1}°</span>${pips(n, n - u, "slot", `data-l="${l}"`)}<span class="nota" style="margin-left:auto">${n - u} su ${n}</span></div>`; });
    if (c.patto) { const u = Math.min(c.patto.n, +pg.magia.patto || 0); h += `<div class="slot-riga"><span class="lv num">${c.patto.l}°</span>${pips(c.patto.n, c.patto.n - u, "slotpatto", "", "oro")}<span class="nota" style="margin-left:auto">slot del patto · tornano con il riposo breve</span></div>`; }
    extra.forEach((l, i) => { const u = pg.magia.extra[i] ? 1 : 0; h += `<div class="slot-riga"><span class="lv num">${l}°</span>${pips(1, 1 - u, "slotextra", `data-l="${i}"`, "vivo")}<span class="nota" style="margin-left:auto">del talismano · torna con il riposo lungo</span></div>`; });
    h += `</div>`;
  }
  h += `<h2 class="sez">Incantesimi<span class="dx">${pg.luna ? "nato in " + esc(pg.luna.toLowerCase()) : ""}</span></h2>`;
  const lista = [...pg.magia.inc].sort((a, b) => (+a.lv) - (+b.lv) || String(a.n).localeCompare(b.n));
  if (!lista.length) h += `<div class="vuoto">Nessun incantesimo. Aggiungi quelli che conosci o che hai preparato.</div>`;
  let lv = -1;
  lista.forEach(s => {
