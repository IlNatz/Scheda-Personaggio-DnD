00 mo)\n**Durata:** concentrazione, fino a 1 ora\n\nTi apri la gola con il pugnale, non abbastanza da morire, e il sangue che cade a terra si rapprende, si gonfia, si allunga e si mette a strisciare. È il **Serpente Vermiglio**, e ha fame del sangue degli altri (vedi le statistiche qui sotto). Il serpente compare in uno spazio libero vicino a te, obbedisce ai tuoi ordini mentali e agisce nell\u0027ordine di iniziativa subito prima di te.\n\nQuando l\u0027incantesimo termina, o quando il serpente scende a 0 PF, si scioglie in una pozza di sangue di 3 m di raggio, che conta come terreno difficile, e tu resti Incapacitato fino alla fine del tuo turno successivo.\n\n---\n\n\u003e [!statblock]\n\u003e ### Il Serpente Vermiglio\n\u003e *Aberrazione Grande, senza allineamento*\n\u003e\n\u003e **CA** 14 · **Iniziativa** +2 (12)\n\u003e **PF** 114 (12d10 + 48)\n\u003e **Velocità** 9 m, nuotare 18 m, scalare 9 m\n\u003e\n\u003e | | | MOD | TS | | | MOD | TS | | | MOD | TS |\n\u003e |---|---|---|---|---|---|---|---|---|---|---|---|\n\u003e | **FOR** | 18 | +4 | +4 | **DES** | 14 | +2 | +2 | **COS** | 18 | +4 | +4 |\n\u003e | **INT** | 5 | −3 | −3 | **SAG** | 10 | +0 | +0 | **CAR** | 8 | −1 | −1 |\n\u003e\n\u003e **Vulnerabilità** fuoco\n\u003e **Resistenze** freddo, necrotico; contundente, perforante e tagliente\n\u003e **Immunità** veleno; Afferrato, Avvelenato, Indebolimento, Paralizzato, Pietrificato, Prono, Trattenuto\n\u003e **Sensi** percezione cieca 9 m; Percezione passiva 10\n\u003e **Lingue** capisce le lingue che conosci, ma non parla\n\u003e **Grado di Sfida** 5 (1.800 PE; BC +3)\n\u003e\n\u003e Un serpente lungo quanto tre uomini, fatto di sangue rappreso, senza occhi e senza squame. Quando striscia lascia una scia rossa che fuma, e quando apre la bocca dentro non ci sono denti: c\u0027è soltanto altro sangue, che gira.\n\u003e\n\u003e #### Tratti\n\u003e\n\u003e **Corpo di Sangue.** Il serpente può entrare nello spazio di un\u0027altra creatura e fermarsi lì, e può passare per uno spazio largo 2,5 cm senza stringersi.\n\u003e\n\u003e **Fiuto del Sangue.** Il serpente ha vantaggio ai tiri per colpire contro le creature Sanguinanti.\n\u003e\n\u003e #### Azioni\n\u003e\n\u003e **Multiattacco.** Il serpente effettua due attacchi di _Frustata_.\n\u003e\n\u003e **Frustata.** *Tiro per colpire in mischia:* +7, portata 3 m. *Colpito:* 13 (2d8 + 4) danni contundenti, e il bersaglio è Avvelenato fino alla fine del suo turno successivo.\n\u003e\n\u003e **Ingoiare (Ricarica 4–6).** *Tiro salvezza su Forza:* CD pari a quella del tuo tiro salvezza degli incantesimi, ogni creatura Grande o più piccola nello spazio del serpente. *Fallimento:* 22 (4d8 + 4) danni contundenti, e la creatura è Afferrata (CD di fuga 14) e Trattenuta finché resta Afferrata; all\u0027inizio di ogni turno del serpente subisce di nuovo 22 (4d8 + 4) danni contundenti. *Successo:* la creatura viene spinta fuori dallo spazio del serpente, in uno spazio libero vicino. Ogni volta che _Ingoiare_ infligge danni, l\u0027incantatore che ha evocato il serpente ottiene altrettanti PF temporanei.\n\n---"},{"n":"Manto di Marea","lv":5,"sc":"Abiurazione di 5° livello (Bardo, Chierico, Paladino)","cl":"Bardo, Chierico, Paladino","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nTi avvolge un manto di luce che si muove come l\u0027acqua sotto la luna, su e giù, piano. Per la durata sei immune ai danni psichici e hai vantaggio ai tiri salvezza su Intelligenza, Saggezza e Carisma. Inoltre, quando una creatura che vedi entro 9 m da te fallisce un tiro salvezza, puoi usare la reazione per farglielo ripetere; deve usare il nuovo risultato."},{"n":"Patto sotto la Luna","lv":5,"sc":"Ammaliamento di 5° livello (Bardo, Chierico, Mago, Paladino, Warlock)","cl":"Bardo, Chierico, Mago, Paladino, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** contatto\n**Componenti:** V\n**Durata:** una luna\n\nPuoi lanciare questo incantesimo soltanto sotto la luna. Tocchi due creature consenzienti e le leghi con un patto. I termini devono essere chiari, ed entrambe devono averli capiti; quello che promettono può essere difficile, ma deve essere possibile, altrimenti l\u0027incantesimo non ha effetto.\n\nPer la durata, se una delle due creature rompe il patto, subisce 5d10 danni psichici, e poi di nuovo a ogni giro di campane, finché l\u0027altra creatura non la perdona. _Rimuovi maledizione_, _ristorare superiore_ e _desiderio_ pongono fine all\u0027incantesimo.\n\n**Usando uno slot di livello superiore.** Con uno slot di 7° o di 8° livello la durata diventa di tredici lune. Con uno slot di 9° livello il patto è per sempre."},{"n":"Rancore di Luna","lv":5,"sc":"Necromanzia di 5° livello (Druido, Ranger, Stregone)","cl":"Druido, Ranger, Stregone","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 9 m\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nLa luce della luna si fa pesante e cattiva, e si posa su una creatura che vedi entro gittata come un panno bagnato. La creatura deve superare un tiro salvezza su Destrezza. Se lo fallisce subisce 4d8 danni radianti, e per la durata, in ognuno dei tuoi turni, puoi usare l\u0027azione bonus per infliggerle altri 2d8 danni radianti, senza tiro. Se lo supera subisce comunque 2d8 danni radianti, e l\u0027incantesimo termina.\n\nL\u0027incantesimo termina anche se usi l\u0027azione bonus per qualcos\u0027altro, se la creatura esce dalla gittata, o se lanci un altro incantesimo di 1° livello o superiore.\n\n**Usando uno slot di livello superiore.** I danni del primo colpo, sia con il tiro salvezza fallito sia con quello superato, aumentano di 1d8 per ogni livello dello slot superiore al 5°."},{"n":"Schegge di Sangue","lv":5,"sc":"Trasmutazione di 5° livello (Sangue Selvatico)","cl":"Sangue Selvatico","fonte":"Sangue Selvatico","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (una fiala di sangue di un predatore morto da meno di due ore)\n**Durata:** 1 ora\n\nLa creatura che tocchi prende un colore rossastro, e sotto la pelle le si vedono le arterie, gonfie e scure. Per la durata, ogni volta che la creatura subisce danni perforanti o taglienti, il sangue che le esce cade a terra e si cristallizza in schegge: lo spazio entro 1,5 m da lei diventa terreno difficile per le altre creature, fino alla fine dell\u0027incantesimo.\n\nQuando una creatura che non è il bersaglio entra in quel terreno, o ci si muove per la prima volta in un turno, subisce 3d6 danni taglienti e deve superare un tiro salvezza su Costituzione, altrimenti fino all\u0027inizio del suo turno successivo la sua velocità si dimezza e non può effettuare reazioni."},{"n":"Sogno di Luna","lv":5,"sc":"Illusione di 5° livello (Bardo, Mago, Warlock)","cl":"Bardo, Mago, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** personale\n**Componenti:** V, S, M (una manciata di sabbia e un inchiostro fatto con il mercurio)\n**Durata:** 8 ore\n\nScegli una creatura che conosci e che si trova sul tuo stesso piano di esistenza, e trasformi i suoi sogni in incubi. Le creature che non dormono non sono influenzate. Per la durata cadi in uno stato di trance: sai quello che succede intorno a te, ma non puoi muoverti né compiere azioni. Puoi porre fine all\u0027incantesimo quando vuoi, uscendo dalla trance.\n\nSe la creatura dorme quando lanci l\u0027incantesimo, entri nel suo sogno: puoi cambiarlo come vuoi e parlarle, finché l\u0027incantesimo non termina o lei non si sveglia. La creatura deve superare un tiro salvezza su Saggezza, altrimenti non ottiene i benefici del riposo, breve o lungo che sia, e quando si sveglia subisce 3d6 danni psichici. Se la luna è nella fase della tua luna di nascita, la creatura ha svantaggio al tiro salvezza.\n\n---"},{"n":"Bocca di Luna","lv":6,"sc":"Invocazione di 6° livello (Chierico, Druido)","cl":"Chierico, Druido","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale (linea di 18 m)\n**Componenti:** V, S, M (una lente)\n**Durata:** concentrazione, fino a 1 minuto\n\nApri la bocca e gli occhi, e da tutti e tre esce la luna: un raggio bianco lungo 18 m e largo 1,5 m, nella direzione che scegli. Ogni creatura sulla linea deve effettuare un tiro salvezza su Intelligenza. Se lo fallisce subisce 3d8 danni radianti ed è Incapacitata fino alla fine del suo turno successivo; se lo supera subisce la metà dei danni e non è Incapacitata. Se la luna è nella fase della tua luna di nascita, le creature hanno svantaggio al tiro salvezza.\n\nPer la durata, con un\u0027azione nel tuo turno, puoi aprire di nuovo la bocca e mandare un altro raggio. Puoi farlo tre volte, dopo di che l\u0027incantesimo termina.\n\n**Usando uno slot di livello superiore.** Per ogni livello dello slot superiore al 6°, i danni aumentano di 1d8 e puoi mandare un raggio in più."},{"n":"Collirio della Verità","lv":6,"sc":"Divinazione di 6° livello (Bardo, Chierico, Mago)","cl":"Bardo, Chierico, Mago","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** V, S, M (un collirio preparato con ingredienti del valore di 50 mo, che l\u0027incantesimo consuma)\n**Durata:** 1 ora\n\nTi versi una goccia d\u0027argento in ogni occhio, e per la durata vedi la luna nelle cose. Entro 36 m da te le porte segrete, le trappole, gli effetti magici e le creature Invisibili brillano come se ci fosse sopra una luce. Inoltre sai se una creatura o un oggetto che vedi è legato a una fase della luna, come una pergamena scritta con _Inchiostro di Fase_ o un oggetto che porta il _Marchio dell\u0027Inconoscibile_, e a quale."},{"n":"Corpo d\u0027Argento Vivo","lv":6,"sc":"Trasmutazione di 6° livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** V, S, M (una fiala di mercurio, che bevi)\n**Durata:** concentrazione, fino a 1 minuto\n\nBevi il mercurio, e il mercurio ti si sparge sotto la pelle. Per la durata non puoi lanciare incantesimi, e ottieni questi benefici:\n- 40 PF temporanei, che perdi alla fine dell\u0027incantesimo.\n- Vantaggio ai tiri per colpire con le armi semplici e da guerra.\n- I tuoi attacchi in mischia infliggono 2d8 danni radianti extra.\n- Competenza nei tiri salvezza su Destrezza e su Costituzione.\n- Quando effettui l\u0027azione di Attacco nel tuo turno, puoi attaccare due volte invece di una. Se puoi già attaccare più volte con quell\u0027azione, non ottieni niente in più.\n- Con un\u0027azione bonus puoi teletrasportarti in un punto libero che vedi, entro una distanza pari alla tua velocità.\n- Puoi effettuare le azioni di Disimpegno e di Schivata come azioni bonus.\n\nAlla fine dell\u0027incantesimo il mercurio esce dalla pelle in gocce grigie. Devi superare un tiro salvezza su Costituzione con CD 15, altrimenti subisci un livello di Indebolimento."},{"n":"Egida di Luna","lv":6,"sc":"Abiurazione di 6° livello (Bardo, Chierico, Druido, Mago, Stregone, Warlock)","cl":"Bardo, Chierico, Druido, Mago, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** reazione, che effettui quando subisci danni\n**Gittata:** personale\n**Componenti:** V\n**Durata:** 1 round\n\nDavanti a te si apre un disco d\u0027argento, come una luna piena appoggiata in verticale. Sei immune al tipo di danni che hai appena subito, compresi quelli che hanno fatto scattare l\u0027incantesimo, fino all\u0027inizio del tuo turno successivo."},{"n":"Gabbia senza Stelle","lv":6,"sc":"Illusione di 6° livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 18 m\n**Componenti:** S\n**Durata:** concentrazione, fino a 1 minuto\n\nMostri a una creatura che vedi entro gittata il cielo come sarebbe senza Selenar: nero, vuoto, senza stelle e senza niente da cui partire o verso cui andare. La creatura deve effettuare un tiro salvezza su Intelligenza. Se lo fallisce subisce 5d10 danni psichici e resta chiusa nella propria mente per la durata; se lo supera non subisce danni e non resta chiusa. Le creature immuni alla condizione Affascinato, e quelle che non possono essere ingannate dalle illusioni, superano il tiro salvezza automaticamente.\n\nFinché è chiusa nella propria mente, la creatura è Accecata e Assordata, ma può agire, e si muove come se tutto il terreno fosse difficile. Alla fine di ognuno dei suoi turni ripete il tiro salvezza, e se lo supera trova la strada per uscire e l\u0027incantesimo termina. Se invece qualcuno la scuote o la colpisce con un attacco in mischia, l\u0027incantesimo termina e la creatura, svegliandosi di colpo, subisce 5d10 danni psichici."},{"n":"Sfida della Luna","lv":6,"sc":"Necromanzia di 6° livello (Chierico, Druido)","cl":"Chierico, Druido","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale (sfera di 9 m)\n**Componenti:** V, S, M (polvere di una perla bianca del valore di almeno 500 mo)\n**Durata:** istantanea\n\nIl corpo ti si apre in una sfera di luna di 9 m di raggio, che esce da te come l\u0027acqua da una diga rotta. Ogni altra creatura nella sfera effettua un tiro salvezza su Costituzione: chi lo fallisce subisce 8d6 danni radianti, chi lo supera la metà. L\u0027incantesimo cambia con la fase maggiore della luna:\n- **Piena.** Chi fallisce il tiro salvezza è anche Accecato fino alla fine del suo turno successivo.\n- **Nuova.** I danni diventano 4d6 necrotici e 4d6 radianti, e chi fallisce il tiro salvezza è anche Spaventato fino alla fine del suo turno successivo.\n\n**Usando uno slot di livello superiore.** I danni aumentano di 2d6 per ogni livello dello slot superiore al 6°."},{"n":"Sguardo della Luna Nera","lv":6,"sc":"Ammaliamento di 6° livello (Mago, Stregone, Warlock)","cl":"Mago, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 18 m\n**Componenti:** V, S\n**Durata:** 1 round\n\nGuardi una creatura entro gittata con gli occhi della luna nuova, quella che non si vede. La creatura deve effettuare un tiro salvezza su Intelligenza. Se lo fallisce subisce 8d6 danni psichici ed è Incapacitata fino alla fine del suo turno successivo; se lo supera subisce la metà dei danni e non è Incapacitata.\n\n**Usando uno slot di livello superiore.** I danni aumentano di 2d6 per ogni livello dello slot superiore al 6°."},{"n":"Via dei Riflessi","lv":6,"sc":"Evocazione di 6° livello (Druido, Mago)","cl":"Druido, Mago","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 3 m\n**Componenti:** V, S\n**Durata:** 1 round\n\nColleghi due superfici che riflettono la luna, come specchi, pozzanghere, vetri o lame lucide. La prima deve essere entro 3 m da te; la seconda può essere ovunque sul tuo stesso piano di esistenza, ma devi averla vista o toccata almeno una volta. Per la durata, una creatura che entra in una delle due superfici esce dall\u0027altra spendendo soltanto 1,5 m di movimento.\n\n---"},{"n":"Carne di Selenite","lv":7,"sc":"Trasmutazione di 7° livello (Druido)","cl":"Druido","fonte":"Magia della Luna","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** contatto\n**Componenti:** V, S, M (un amuleto d\u0027argento a forma di mezzaluna)\n**Durata:** 1 ora\n\nTocchi una creatura consenziente, e la sua carne comincia a brillare piano, come la selenite tenuta controluce. La creatura recupera subito 1d8 + 7 PF, e per la durata recupera 2 PF all\u0027inizio di ognuno dei suoi turni. Gli arti e le parti del corpo che ha perso, come dita, mani, braccia o una coda, ricrescono in 1 minuto. Se la parte tagliata viene appoggiata sul moncone mentre la ferita è ancora fresca, si riattacca subito, e la creatura recupera 1d8 PF."},{"n":"Il Ritorno per Marea","lv":7,"sc":"Necromanzia di 7° livello (Chierico)","cl":"Chierico","fonte":"Magia della Luna","md":"**Tempo di lancio:** 1 ora\n**Gittata:** contatto\n**Componenti:** V, S, M (una perla del valore di 1.000 mo, che l\u0027incantesimo consuma)\n**Durata:** istantanea\n\nTocchi una creatura morta da non più di un secolo, che non sia morta di vecchiaia e che non sia un non morto. Se la sua anima è libera e vuole tornare, la luna la riporta su come la marea riporta a riva quello che ha preso: la creatura torna in vita con tutti i suoi PF, le ferite mortali si richiudono e le parti del corpo che le mancavano ricrescono. Tu e la creatura subite due livelli di Indebolimento ciascuno."},{"n":"La Parola Lunatica","lv":7,"sc":"Ammaliamento di 7° livello (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 18 m\n**Componenti:** V\n**Durata:** istantanea\n\nPronunci una sola parola, nella lingua che si parla sulla faccia nascosta della luna, rivolta a una creatura che vedi entro gittata. La creatura sente un dolore dietro gli occhi e il pavimento le gira sotto i piedi. Se ha 100 PF o meno, diventa **lunatica** (vedi _Marchio dell\u0027Inconoscibile_). Alla fine di ognuno dei suoi turni ripete un tiro salvezza su Intelligenza, e se lo supera l\u0027effetto termina. Se ha più di 100 PF, l\u0027incantesimo non ha effetto."},{"n":"Marchio dell\u0027Inconoscibile","lv":7,"sc":"Abiurazione di 7° livello (Mago, Stregone, Warlock)","cl":"Mago, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** contatto\n**Componenti:** V, S, M (mercurio e perle del valore di 1.000 mo, che l\u0027incantesimo consuma)\n**Durata:** finché non viene dissolto o non si attiva\n\nIncidi un marchio all\u0027interno di un oggetto che si può chiudere, come un libro, uno scrigno o un baule. Il marchio si vede soltanto alla luce della luna nella stessa fase in cui l\u0027hai inciso, oppure, nelle altre fasi, con una prova di Intelligenza (Indagare) con CD 15.\n\nIl marchio si attiva quando una creatura che non sei tu prova ad aprire l\u0027oggetto. Ogni creatura che vede l\u0027oggetto entro 3 m da lui effettua un tiro salvezza su Costituzione: chi lo fallisce subisce 10d8 danni radianti, chi lo supera la metà. Poi ogni creatura colpita deve superare un tiro salvezza su Intelligenza, altrimenti diventa **lunatica** per 1 minuto.\n\n**Lunatica.** Una creatura lunatica è Incapacitata, emette soltanto versi gutturali e ha Intelligenza 2. Il suo movimento lo decide il Master."},{"n":"Occhi di Selenite","lv":7,"sc":"Divinazione di 7° livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** V, S\n**Durata:** 8 ore\n\nTi si accendono gli occhi di luna, e per la durata la magia ti sembra una cosa che si vede. Quando una creatura che vedi entro 18 m da te lancia un incantesimo, sai subito quale incantesimo è e con quale livello di slot l\u0027ha lanciato. Se guardi una creatura o un oggetto per un round intero, sai se è sotto l\u0027effetto di un incantesimo, e di quale. Se ti concentri per 10 minuti su un effetto magico o su un oggetto magico, lo identifichi."},{"n":"Pianto della Madre Pallida","lv":7,"sc":"Invocazione di 7° livello (Chierico, Druido)","cl":"Chierico, Druido","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 45 m\n**Componenti:** V, S\n**Durata:** istantanea\n\nSu un punto che scegli entro gittata, e in un raggio di 9 m intorno a lui, comincia a cadere una pioggia di gocce iridescenti, fredde come il vuoto sopra il cielo. Ogni creatura nell\u0027area effettua un tiro salvezza su Costituzione: chi lo fallisce subisce 4d8 danni radianti e 4d8 danni da freddo, chi lo supera la metà. Ogni incantesimo di 3° livello o inferiore attivo nell\u0027area termina."},{"n":"Tempio di Luce Lunare","lv":7,"sc":"Evocazione di 7° livello (Chierico)","cl":"Chierico","fonte":"Magia della Luna","md":"**Tempo di lancio:** 1 ora\n**Gittata:** 36 m\n**Componenti:** V, S, M (una perla del valore di almeno 50 mo)\n**Durata:** un giro di campane (24 ore)\n\nDai forma alla luce della luna, e da un punto che vedi entro gittata sale un tempio, dentro un cubo di 36 m di lato che deve essere libero. Il tempio ha i segni delle otto fasi sulle pareti; porte, scale, statue e il resto li decidi tu. Dentro c\u0027è luce fioca, e ogni luce più forte si abbassa fino a diventare fioca. L\u0027aria sa di incenso, ed è fredda. La luce della luna, dentro il tempio, arriva anche sul Piano Etereo, e le creature eteree al suo interno si vedono.\n\nQuando crei il tempio, puoi escludere dall\u0027ingresso uno o più tipi di creature. Una creatura esclusa che prova a entrare deve superare un tiro salvezza su Carisma, altrimenti non può entrare per tutta la durata. Se lo supera ed entra, finché resta dentro sottrae 1d4 a ogni tiro per colpire, tiro salvezza e prova di caratteristica.\n\nUna creatura dentro il tempio non può essere bersaglio di incantesimi di divinazione lanciati da fuori. Il tempio non subisce danni né effetti di nessun genere, tranne _disintegrazione_, che lo distrugge all\u0027istante.\n\nUna creatura che fa un riposo breve dentro il tempio aggiunge 1d6 ai PF che recupera con ogni Dado Vita che spende. Una creatura che fa un riposo lungo dentro il tempio guarisce da ogni veleno, malattia e maledizione, recupera i PF massimi che aveva perso, e perde tutti i livelli di Indebolimento.\n\n---"},{"n":"Crollo della Luna","lv":8,"sc":"Necromanzia di 8° livello (Mago, Stregone, Warlock)","cl":"Mago, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 45 m\n**Componenti:** V, S, M (una goccia di mercurio)\n**Durata:** istantanea\n\nFai cadere un pezzo di luna su un cubo di 9 m di lato centrato su un punto che scegli entro gittata. Ogni creatura nel cubo effettua un tiro salvezza su Costituzione: chi lo fallisce subisce 10d8 danni, chi lo supera la metà. Il tipo di danni dipende dalla fase maggiore della luna: **radianti** in luna piena, **necrotici** in luna nuova, **da freddo** nelle altre fasi. Le aberrazioni, gli immondi e i non morti hanno svantaggio al tiro salvezza contro i danni radianti; gli umanoidi, le bestie e i giganti hanno svantaggio al tiro salvezza contro i danni necrotici."},{"n":"Dominio d\u0027Argento","lv":8,"sc":"Ammaliamento di 8° livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 18 m\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 ora\n\nTi entra negli occhi la luce della luna, e la usi per prendere la volontà di una creatura che vedi entro gittata. La creatura deve superare un tiro salvezza su Saggezza, altrimenti è Affascinata da te per la durata. Se ti è chiaramente ostile, ha vantaggio al tiro salvezza.\n\nFinché la creatura è Affascinata, puoi usare la tua azione per prendere il controllo del suo corpo: decidi tu quali azioni e quali reazioni compie nel suo turno successivo. Usare la sua reazione ti costa la tua. Ogni volta che la creatura subisce danni, ripete il tiro salvezza: se lo supera, un lampo bianco le esplode negli occhi, la lascia Accecata fino alla fine del suo turno successivo e pone fine all\u0027incantesimo.\n\n**Usando uno slot di livello superiore.** Con uno slot di 9° livello la durata diventa di 8 ore."},{"n":"Eclisse del Terrore","lv":8,"sc":"Illusione di 8° livello (Druido)","cl":"Druido","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale (raggio di 30 m)\n**Componenti:** V, S, M (una pietra di luna)\n**Durata:** concentrazione, fino a 10 minuti\n\nSopra di te una cosa nera passa davanti alla luna e la copre, e nel buio che resta il cielo sembra più basso. Ogni creatura a tua scelta che inizia il turno entro 30 m da te, o che entra nell\u0027area per la prima volta in un turno, subisce 2d8 danni da freddo e deve superare un tiro salvezza su Saggezza, altrimenti cade Prona ed è Spaventata finché resta nell\u0027area.\n\nLe aberrazioni, gli immondi e i non morti che falliscono il tiro salvezza non hanno paura: impazziscono. Finché restano nell\u0027area devono usare l\u0027azione per attaccare in mischia la creatura più vicina, chiunque sia, e ogni volta che infliggono danni subiscono danni radianti pari alla metà di quelli inflitti."},{"n":"Esilio sul Volto della Luna","lv":8,"sc":"Evocazione di 8° livello (Bardo, Chierico, Mago, Stregone)","cl":"Bardo, Chierico, Mago, Stregone","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 18 m\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nUna creatura che vedi entro gittata deve superare un tiro salvezza su Carisma, altrimenti sparisce, e si ritrova su una pianura di polvere grigia bucata da crateri, sotto un cielo nero con le stelle lontane. Resta lì finché l\u0027incantesimo non termina, oppure finché non riesce a scappare: con un\u0027azione può effettuare un tiro salvezza su Intelligenza contro la CD del tuo tiro salvezza degli incantesimi, e se lo supera torna. Ogni volta che lo fallisce, il freddo le entra nelle ossa: subisce 1d6 danni da freddo al primo tentativo fallito, 2d6 al secondo, 3d6 al terzo, e così via.\n\nSe la creatura scende a 0 PF per il freddo, l\u0027incantesimo termina e lei torna, ma torna rinsecchita e gelata come una mummia. In realtà è viva: il corpo le si è soltanto rallentato, e invece di effettuare i tiri salvezza contro la morte a ogni round li effettua una volta ogni ora. Se viene stabilizzata, in poco tempo riprende il suo aspetto.\n\nQuando l\u0027incantesimo termina, la creatura ricompare nello spazio che aveva lasciato, o in quello libero più vicino, se è occupato."},{"n":"Mano Ferma della Luna","lv":8,"sc":"Trasmutazione di 8° livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** V\n**Durata:** 1 ora\n\nLa luna ti fa le mani ferme e la testa lucida. Per la durata, quando effettui una prova di caratteristica, puoi decidere di non tirare e considerare il dado un 10; se hai vantaggio alla prova, puoi considerarlo un 15. Finché non sei sotto la luna, il beneficio è sospeso, ma l\u0027incantesimo non termina."},{"n":"Mente Velata","lv":8,"sc":"Abiurazione di 8° livello (Bardo, Mago, Warlock)","cl":"Bardo, Mago, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** contatto\n**Componenti:** V, S, M (un diamante del valore di 500 mo)\n**Durata:** un giro di campane (24 ore)\n\nStendi sulla mente di una creatura consenziente un velo di luna, come una garza bagnata su un taglio. Per la durata la creatura è immune ai danni psichici, supera automaticamente ogni tiro salvezza contro gli incantesimi di illusione e di ammaliamento, e nessuna divinazione può localizzarla."},{"n":"Squarcio di Luna","lv":8,"sc":"Invocazione di 8° livello (Chierico, Druido)","cl":"Chierico, Druido","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 45 m\n**Componenti:** V, S, M (una fiamma e una pietra di luna)\n**Durata:** istantanea\n\nStrappi il cielo sopra un punto che vedi entro gittata, e la luna ci cade dentro tutta insieme, in un cerchio di 9 m di raggio. Ogni creatura nell\u0027area effettua un tiro salvezza su Costituzione. Se lo fallisce subisce 8d8 danni radianti, ed è Accecata e Incapacitata per 1 minuto; alla fine di ognuno dei suoi turni ripete il tiro salvezza, e se lo supera l\u0027effetto termina. Se lo supera subisce la metà dei danni ed è Accecata soltanto fino alla fine del suo turno successivo. Ogni luce e ogni oscurità create da incantesimi nell\u0027area si dissolvono.\n\n**Usando uno slot di livello superiore.** Con uno slot di 9° livello i danni diventano 12d8."},{"n":"Sussurri della Luna","lv":8,"sc":"Divinazione di 8° livello (Chierico, Druido, Warlock)","cl":"Chierico, Druido, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** illimitata\n**Componenti:** V, S\n**Durata:** istantanea\n\nResti in ascolto sotto la luna finché non ti dice dove si trova un luogo, una creatura o un oggetto che cerchi. Per trovare una creatura devi averla vista almeno una volta; per trovare un oggetto devi averlo toccato. I modi normali di nascondersi dalle divinazioni non funzionano, e soltanto gli effetti e gli incantesimi di 8° livello o superiore possono impedirti di sapere. Se quello che cerchi è su un altro piano di esistenza, sai su quale piano, ma non dove.\n\n---"},{"n":"Il Giudizio Antico","lv":9,"sc":"Ammaliamento di 9° livello (Bardo)","cl":"Bardo","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 18 m\n**Componenti:** V\n**Durata:** istantanea\n\nPronunci la sentenza della luna su una creatura che vedi entro gittata. Se la creatura ha 100 PF o meno, la sua mente viene cancellata: perde ogni ricordo, ogni tratto del carattere, ogni competenza nelle abilità e negli attrezzi, e tutte le lingue che conosce tranne una, di solito la prima che ha imparato. Se ha più di 100 PF, l\u0027incantesimo non ha effetto."},{"n":"Incubo di Luna","lv":9,"sc":"Illusione di 9° livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 36 m\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nScegli fino a cinque creature che vedi entro gittata, e le chiudi dentro le loro teste con le cose peggiori che ci trovi. Ogni creatura deve superare un tiro salvezza su Saggezza, altrimenti è Stordita per la durata. Alla fine di ognuno dei suoi turni ripete il tiro salvezza: se lo supera l\u0027effetto termina per lei, se lo fallisce subisce 4d10 danni psichici."},{"n":"L\u0027Istante Trattenuto","lv":9,"sc":"Trasmutazione di 9° livello (Mago)","cl":"Mago","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale (sfera di 3 m)\n**Componenti:** V\n**Durata:** concentrazione, fino a 1 minuto\n\nIntorno a te si chiude una bolla d\u0027argento di 3 m di raggio, che non si muove. Dentro la bolla tutto è in luce fioca, qualunque luce ci sia, e tutto ha perso il colore: si vede in bianco e nero, come in un\u0027incisione. Da dentro la bolla è trasparente. Da fuori è opaca, e mostra un\u0027immagine ferma e perfetta di quello che c\u0027era dentro nel momento in cui l\u0027hai lanciata.\n\nQuando vedi una creatura subire danni o fallire un tiro salvezza, puoi usare la reazione per porre fine all\u0027incantesimo. Quando l\u0027incantesimo termina, per qualunque motivo, la bolla si scioglie, e puoi scegliere di riportare tutto com\u0027era nel momento in cui l\u0027hai lanciata: la posizione delle creature, le loro condizioni, i loro PF e i loro slot incantesimo di 3° livello o inferiore. Non tornano gli usi dei privilegi, le cariche degli oggetti magici, i consumabili, le munizioni e nient\u0027altro. Ogni creatura che era nella bolla quando l\u0027hai lanciata, e che quando l\u0027incantesimo termina è fuori, subisce un livello di Indebolimento."},{"n":"Maledizione dell\u0027Ultima Luna","lv":9,"sc":"Evocazione di 9° livello (Mago, Warlock)","cl":"Mago, Warlock","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** a vista\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 7 round\n\nCostringi la luna a mostrare la sua faccia peggiore. Scegli un punto che vedi: ogni creatura entro 1 km da quel punto, tranne te e gli alleati entro 1,5 m da te, subisce gli effetti dell\u0027incantesimo, che crescono a ogni round. In ognuno dei tuoi turni dopo il primo devi usare l\u0027azione per tenere viva la maledizione, altrimenti termina. Gli effetti di ogni round si sommano a quelli dei round precedenti.\n- **Round 1.** Le creature e gli oggetti Invisibili diventano visibili, e per un giro di campane non possono tornare Invisibili.\n- **Round 2.** Ogni creatura e ogni oggetto subiscono 1d6 danni radianti. Le piante appassiscono e la frutta secca sui rami.\n- **Round 3.** Per un giro di campane, nessuna creatura può recuperare PF.\n- **Round 4.** Ogni creatura e ogni oggetto subiscono 3d6 danni radianti. Il cibo marcisce, e l\u0027acqua nelle cisterne e nei pozzi diventa fetida.\n- **Round 5.** Per un giro di campane, nell\u0027area non funziona nessun teletrasporto.\n- **Round 6.** I PF massimi di ogni creatura si riducono di 1 per ogni suo Dado Vita, per sempre; soltanto _desiderio_ può restituirli. Il legno delle case marcisce, si piega e a volte crolla sotto il proprio peso.\n- **Round 7.** Ogni creatura diventa sterile per sempre; soltanto _desiderio_ può guarirla. La pietra perde la presa, la calce si sbriciola, il marmo si crepa, e gli edifici di pietra diventano pericolanti o crollano.\n\nOgni volta che l\u0027incantesimo termina, invecchi di un decimo della vita che la tua specie vive di solito. Se sei una creatura che non muore di vecchiaia, tira 1d10: con 1 l\u0027immortalità ti si spezza, e muori di vecchiaia nel round successivo."},{"n":"Meteora d\u0027Argento","lv":9,"sc":"Invocazione di 9° livello (Druido, Mago, Stregone)","cl":"Druido, Mago, Stregone","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** 5 km\n**Componenti:** V, S\n**Durata:** istantanea\n\nScegli un punto che vedi entro gittata. Dopo 1d10 round, dal cielo cade una meteora d\u0027argento che si abbatte sul punto e schiaccia tutto quello che c\u0027è entro 30 m. Ogni creatura nell\u0027area effettua un tiro salvezza su Destrezza: chi lo fallisce subisce 20d6 danni da fuoco e 20d6 danni radianti, chi lo supera la metà. Gli oggetti nell\u0027area che nessuno indossa o trasporta subiscono 60 danni da fuoco e 60 danni radianti."},{"n":"Pelle delle Otto Fasi","lv":9,"sc":"Abiurazione di 9° livello (Chierico)","cl":"Chierico","fonte":"Magia della Luna","md":"**Tempo di lancio:** azione\n**Gittata:** personale\n**Componenti:** V, S\n**Durata:** 10 minuti\n\nLa luna ti entra nella pelle, e ti protegge nel modo della fase in cui l\u0027hai chiamata. Per la durata, ogni volta che una creatura ti colpisce con un attacco in mischia, o che tu colpisci una creatura con un attacco in mischia, la creatura subisce un effetto che dipende dalla fase in cui hai lanciato l\u0027incantesimo. Ogni condizione dura fino alla fine del suo turno successivo.\n\n| Fase | Effetto |\n|---|---|\n| Luna nuova | 6d8 danni necrotici, e la creatura è Spaventata |\n| Luna crescente | 6d8 danni da tuono, e la creatura cade Prona |\n| Primo quarto | 6d8 danni da fulmine, e la creatura non può effettuare reazioni |\n| Gibbosa crescente | 6d8 danni da acido, e la creatura è Trattenuta |\n| Luna piena | 6d8 danni radianti, e la creatura è Accecata |\n| Gibbosa calante | 6d8 danni da veleno, e la creatura è Avvelenata |\n| Ultimo quarto | 6d8 danni da freddo, e la velocità della creatura scende a 3 m |\n| Luna calante | 6d8 danni psichici, e la creatura è Incapacitata |"},{"n":"Prodigio di Luna","lv":9,"sc":"Divinazione di 9° livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"Magia della Luna","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** contatto\n**Componenti:** V, S, M (una perla e una fiala di mercurio)\n**Durata:** 8 ore\n\nTocchi una creatura consenziente e le dai in mano il riflesso della luna. Per la durata la creatura ha vantaggio ai tiri salvezza e alle prove di caratteristica, e i tiri per colpire contro di lei hanno svantaggio. Inoltre, quando dovrebbe subire più di un livello di Indebolimento da una sola fonte, ne subisce uno solo. L\u0027incantesimo termina se lo lanci di nuovo su un\u0027altra creatura."},{"n":"Proiezione d\u0027Argento","lv":9,"sc":"Necromanzia di 9° livello (Chierico, Druido, Mago, Stregone)","cl":"Chierico, Druido, Mago, Stregone","fonte":"Magia della Luna","md":"**Tempo di lancio:** 1 ora\n**Gittata:** 3 m\n**Componenti:** V, S, M (un lingotto d\u0027argento del valore di 1.000 mo, che l\u0027incantesimo consuma)\n**Durata:** speciale\n\nLasci il tuo corpo, che resta Privo di sensi, sospeso: non ha bisogno di mangiare né di respirare, e non invecchia. Il tuo spirito compare entro gittata, con il tuo aspetto ma con la pelle d\u0027argento, luminosa. Mantiene tutte le tue caratteristiche, le tue abilità e i tuoi poteri, ma non può fare riposi lunghi. Non può attraversare i posti in cui la luce della luna non arriva. Finché è sotto la luna, con un\u0027azione può teletrasportare se stesso e ogni creatura consenziente entro 1,5 m in un punto illuminato dalla luna entro 1 km.\n\nAlla fine di ogni fase della luna lo spirito torna nel corpo per un sonno intero, durante il quale recupera tutti i Dadi Vita spesi, e poi può uscire di nuovo. Se il corpo subisce danni, lo spirito sa quanti e di che tipo, ma non chi li ha inflitti.\n\nL\u0027incantesimo termina quando lo spirito scende a 0 PF, quando usi un\u0027azione bonus per terminarlo, o quando viene usato _desiderio_ per farlo terminare. Quando termina, per qualunque motivo, ti svegli con quattro livelli di Indebolimento, e le condizioni che avevano colpito lo spirito non ti colpiscono, tranne le maledizioni. Se il tuo corpo fallisce un tiro salvezza su Carisma mentre lo spirito è fuori, viene teletrasportato nel punto in cui si trova lo spirito, e l\u0027incantesimo termina.\n\n---"},{"n":"Aculeo mentale","lv":2,"sc":"Divinazione di 2º livello (Mago, Stregone, Warlock)","cl":"Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** S\n**Durata:** concentrazione, fino a 1 ora\n\nL\u0027incantatore guida un flusso di energia psionica nella mente di una creatura entro gittata che egli è in grado di vedere. Il bersaglio effettua un tiro salvezza su Saggezza, subendo 3d8 danni psichici in caso di fallimento, o la metà dei danni in caso di successo. Se fallisce il tiro, l\u0027incantatore sa sempre dove si trova il bersaglio fino al termine dell\u0027incantesimo, ma solo se entrambi si trovano sullo stesso piano di esistenza. Finché l\u0027incantatore è in possesso di queste conoscenze, il bersaglio non può nascondersi da lui e, se è invisibile, non ottiene alcun beneficio da questa condizione contro di lui.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 2º."},{"n":"Aiuto","lv":2,"sc":"Abiurazione di 2º livello (Bardo, Chierico, Druido, Paladino, Ranger)","cl":"Bardo, Chierico, Druido, Paladino, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S, M (una striscia di tessuto bianco)\n**Durata:** 8 ore\n\nL\u0027incantatore sceglie fino a tre creature entro gittata. I punti ferita massimi e i punti ferita attuali di ogni bersaglio aumentano di 5 per la durata dell\u0027incantesimo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I punti ferita di ciascun bersaglio aumentano di 5 per ogni slot incantesimo di livello superiore al 2º."},{"n":"Allarme","lv":1,"sc":"Abiurazione di 1º livello (Mago, Ranger)","cl":"Mago, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto o rituale\n**Gittata:** 9 metri\n**Componenti:** V, S, M (una campanella e un filo d\u0027argento)\n**Durata:** 8 ore\n\nL\u0027incantatore predispone un allarme che segnala un\u0027intrusione. Sceglie una porta, una finestra o un\u0027area entro gittata che non sia più ampia di un cubo con spigolo di 6 metri. Fino al termine dell\u0027incantesimo, un allarme avverte l\u0027incantatore tutte le volte che una creatura tocca o entra nell\u0027area protetta. Al momento del lancio dell\u0027incantesimo, l\u0027incantatore designa quali creature non faranno scattare l\u0027allarme. Inoltre, sceglie se l\u0027allarme è acustico o mentale.\n\n**Allarme acustico.** L\u0027allarme produce il suono di una campanella per 10 secondi entro 18 metri dall\u0027area protetta.\n\n**Allarme mentale.** Un suono nella mente avverte l\u0027incantatore se questi si trova entro 1,5 chilometri dall\u0027area protetta. Il suono sveglia l\u0027incantatore se sta dormendo."},{"n":"Alleato planare","lv":6,"sc":"Evocazione di 6º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nL\u0027incantatore chiede aiuto a un\u0027entità ultraterrena che deve essergli nota: un dio, un principe dei demoni o qualche altro essere dotato di poteri cosmici. Quell\u0027entità invia in aiuto un celestiale, un elementale o un immondo a lei fedele, che appare in uno spazio libero entro gittata. Se l\u0027incantatore conosce il nome di una creatura specifica, può pronunciarlo quando lancia l\u0027incantesimo per richiedere il suo intervento, ma potrebbe apparire comunque una creatura diversa (a scelta del GM). Quando la creatura appare, non è obbligata a comportarsi in un modo particolare. L\u0027incantatore può chiederle di svolgere per lui un servizio in cambio di pagamento, ma essa non è costretta ad accettare. Il compito richiesto potrebbe essere qualcosa di semplice (\"portaci in volo oltre il baratro\" o \"aiutaci a combattere una battaglia\") o di complesso (\"spia i nostri nemici\" o \"proteggici durante la nostra incursione nel dungeon\"). L\u0027incantatore deve essere in grado di comunicare con la creatura per contrattare per i suoi servigi.\n\nIl pagamento può avere varie forme: Un celestiale potrebbe richiedere un\u0027ingente donazione in oro o oggetti magici a un tempio alleato, un immondo esigere una creatura vivente in sacrificio o un tesoro in dono. Alcune creature potrebbero scambiare i propri servigi con una missione che l\u0027incantatore deve svolgere.\n\nUn compito che può essere misurato in minuti richiede un pagamento del valore di 100 mo al minuto, un compito misurato in ore richiede 1.000 mo all\u0027ora e un compito misurato in giorni (per un massimo di 10 giorni) richiede 10.000 mo al giorno. Il GM può modificare questi pagamenti in base alle circostanze del lancio. Se il compito è in sintonia con l\u0027etica della creatura, il pagamento potrebbe essere dimezzato o addirittura revocato. I compiti non pericolosi richiedono tipicamente solo la metà del pagamento suggerito, mentre quelli particolarmente rischiosi potrebbero richiedere una ricompensa superiore. È raro che una creatura accetti un compito potenzialmente suicida.\n\nDopo aver portato a termine il compito o quando la durata pattuita termina, la creatura fa ritorno al suo piano d\u0027origine dopo aver fatto rapporto all\u0027incantatore, se possibile. Se l\u0027incantatore e la creatura non riescono ad accordarsi sul prezzo del suo servizio, quest\u0027ultima ritorna immediatamente sul suo piano d\u0027origine."},{"n":"Allucinazione di forza","lv":2,"sc":"Illusione di 2º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (un ciuffo di lana)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore tenta di creare un\u0027illusione nella mente di una creatura entro gittata che egli è in grado di vedere. Il bersaglio effettua un tiro salvezza su Intelligenza. Se lo fallisce, l\u0027incantatore crea l\u0027illusione di un oggetto, una creatura o un fenomeno di altra natura, che non sia più grande di un cubo con spigolo di 3 metri e che sia percepibile soltanto dal bersaglio per la durata dell\u0027incantesimo. L\u0027allucinazione include suoni, temperature e altri stimoli analoghi.\n\nIl bersaglio può effettuare un\u0027azione di Studio per esaminare l\u0027allucinazione con una prova di Intelligenza (Indagare) contro la CD del tiro salvezza sull\u0027incantesimo. Se supera la prova, il bersaglio capisce che l\u0027allucinazione è un\u0027illusione e l\u0027incantesimo termina.\n\nFinché il bersaglio è influenzato dall\u0027incantesimo, considera l\u0027allucinazione come se fosse reale e razionalizza qualsiasi esito illogico prodotto dalle sue interazioni con essa. Ad esempio, se il bersaglio cammina attraverso un ponte illusorio e sopravvive alla caduta, crederà comunque che il ponte esista e che sia stato qualcos\u0027altro a causare la caduta. Un bersaglio influenzato può perfino subire danni dall\u0027illusione se l\u0027allucinazione rappresenta una creatura pericolosa o un pericolo. In ogni turno dell\u0027incantatore, l\u0027allucinazione può infliggere 2d8 danni psichici al bersaglio se questo si trova nell\u0027area dell\u0027allucinazione o entro 1,5 metri da essa. Il bersaglio percepisce i danni come se fossero del tipo appropriato per l\u0027illusione."},{"n":"Allucinazione mortale","lv":4,"sc":"Illusione di 4º livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore attinge agli incubi di una creatura entro gittata che egli è in grado di vedere e crea un\u0027illusione delle sue paure più profonde, visibile solo a lei. Il bersaglio effettua un tiro salvezza su Saggezza. In caso di fallimento, subisce 4d10 danni psichici e subisce svantaggio alle prove di caratteristica e ai tiri per colpire per la durata dell\u0027incantesimo. In caso di successo, subisce soltanto la metà di quei danni e l\u0027incantesimo termina.\n\nPer la durata dell\u0027incantesimo, il bersaglio effettua un tiro salvezza su Saggezza alla fine di ogni suo turno. In caso di fallimento, subisce nuovamente i danni psichici. In caso di successo, l\u0027incantesimo termina.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d10 per ogni slot di livello superiore al 4º."},{"n":"Alterare se stesso","lv":2,"sc":"Trasmutazione di 2º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 ora\n\nL\u0027incantatore altera la propria forma fisica scegliendo tra le opzioni seguenti. Gli effetti permangono per la sua durata, durante la quale l\u0027incantatore può effettuare un\u0027azione di Magia per sostituire l\u0027opzione scelta con una diversa.\n\n**Adattamento acquatico.** L\u0027incantatore sviluppa le branchie e una membrana tra le dita. Inoltre, può respirare sott\u0027acqua e ottenere una velocità di nuoto pari alla sua velocità.\n\n**Armi naturali.** L\u0027incantatore sviluppa artigli (taglienti), zanne (perforanti), corna (perforanti) o zoccoli (contundenti). Quando usa il suo colpo senz\u0027armi per infliggere danni con l\u0027arma naturale creata, infligge 1d6 danni (del tipo indicato tra parentesi) invece di infliggere i danni normali del colpo senz\u0027armi, usando il modificatore di caratteristica da incantatore per i tiri per colpire e per i tiri per i danni anziché quello di Forza.\n\n**Cambiare aspetto.** L\u0027incantatore altera il suo aspetto: decide come apparire e definisce altezza, peso, lineamenti facciali, tono della voce, lunghezza dei capelli, carnagione e altri tratti distintivi. Può scegliere di assomigliare a un membro di un\u0027altra specie, ma le sue statistiche non subiscono modifiche. Non può apparire come una creatura di taglia diversa e la sua forma base rimane la stessa; per esempio, se è bipede, non può usare l\u0027incantesimo per diventare quadrupede. Per la durata dell\u0027incantesimo, può effettuare un\u0027azione di Magia per cambiare di nuovo il suo aspetto."},{"n":"Amicizia con gli animali","lv":1,"sc":"Ammaliamento di 1º livello (Bardo, Druido, Ranger)","cl":"Bardo, Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S, M (un boccone di cibo)\n**Durata:** 24 ore\n\nL\u0027incantatore sceglie come bersaglio una bestia entro gittata che egli è in grado di vedere. Il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti rimane affascinato per la durata dell\u0027incantesimo. Se l\u0027incantatore o uno dei suoi alleati infligge danni al bersaglio, l\u0027incantesimo termina.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può scegliere come bersaglio una bestia aggiuntiva per ogni slot di livello superiore al 1º."},{"n":"Anatema","lv":1,"sc":"Ammaliamento di 1º livello (Bardo, Chierico, Warlock)","cl":"Bardo, Chierico, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S, M (una goccia di sangue)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore sceglie fino a tre creature situate entro gittata che egli è in grado di vedere, ciascuna delle quali deve effettuare un tiro salvezza su Carisma. Se un bersaglio fallisce il tiro, ogni volta che effettua un tiro per colpire o un tiro salvezza prima del termine dell\u0027incantesimo deve sottrarre 1d4 da essi.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 1º."},{"n":"Animale messaggero","lv":2,"sc":"Ammaliamento di 2º livello (Bardo, Druido, Ranger)","cl":"Bardo, Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** 9 metri\n**Componenti:** V, S, M (un boccone di cibo)\n**Durata:** 24 ore\n\nUna bestia Minuscola a scelta entro gittata che l\u0027incantatore è in grado di vedere deve superare un tiro salvezza su Carisma, altrimenti deve cercare di consegnare un messaggio da parte dell\u0027incantatore (se il grado di sfida del bersaglio non è 0, la prova viene superata automaticamente). L\u0027incantatore specifica il luogo di consegna, che ha già visitato, e un destinatario che corrisponda a una descrizione generica, come \"una persona che indossa l\u0027uniforme della guardia cittadina\" o \"un nano dai capelli rossi che indossa un cappello a punta\". Inoltre, l\u0027incantatore comunica un messaggio composto da un massimo di venticinque parole. La bestia bersaglio viaggia per la durata dell\u0027incantesimo verso il luogo specificato, percorrendo circa 37,5 chilometri in 24 ore o 75 chilometri se è una bestia volante. Quando la bestia arriva a destinazione, trasmette il messaggio alla creatura descritta, imitando il modo di comunicare dell\u0027incantatore. Se la bestia non raggiunge la sua destinazione prima della fine dell\u0027incantesimo, il messaggio viene perso e la bestia torna nel luogo dove l\u0027incantatore ha lanciato l\u0027incantesimo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** La durata dell\u0027incantesimo aumenta di 48 ore per ogni slot di livello superiore al 2º."},{"n":"Animare morti","lv":3,"sc":"Necromanzia di 3º livello (Chierico, Mago)","cl":"Chierico, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** 3 metri\n**Componenti:** V, S, M (una goccia di sangue, un pezzo di carne e un pizzico di polvere d\u0027osso)\n**Durata:** istantanea\n\nL\u0027incantatore sceglie una pila di ossa o un cadavere umanoide di taglia Media o Piccola entro gittata, animandolo come creatura non morta. Il bersaglio si trasforma in uno scheletro se l\u0027incantatore sceglie la pila di ossa, o in uno zombi se l\u0027incantatore sceglie un cadavere (vedi \"Mostri\" per le schede delle statistiche).\n\nA ogni suo turno, l\u0027incantatore può effettuare un\u0027azione bonus per comandare mentalmente qualsiasi creatura creata con questo incantesimo, a patto che si trovi entro 18 metri da lui (se controlla varie creature, l\u0027incantatore può comandarne più di una allo stesso momento, impartendo lo stesso comando a ciascuna di loro). L\u0027incantatore decide quale azione effettuerà la creatura e dove si muoverà nel suo turno successivo, oppure può impartirle un comando generale, come restare a guardia di una stanza o un di corridoio. Se invece non impartisce alcun comando, la creatura effettua l\u0027azione Schivata e si sposta solo per evitare di subire danni. Una volta ricevuto un ordine, la creatura continua a seguirlo finché non ha portato a termine il compito.\n\nLa creatura rimane sotto il controllo dell\u0027incantatore per 24 ore, passate le quali smette di obbedire a qualsiasi comando ulteriore. Per mantenere il controllo sulla creatura per altre 24 ore, l\u0027incantatore deve lanciare di nuovo questo incantesimo su di essa prima che l\u0027attuale periodo di 24 ore termini. Questo uso dell\u0027incantesimo gli permette di ristabilire il controllo su un massimo di quattro creature da lui animate tramite questo incantesimo, anziché animarne una nuova.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore anima due creature non morte aggiuntive o ristabilisce il controllo su di esse per ogni slot incantesimo di livello superiore al 3º. Ognuna delle creature deve provenire da un diverso cadavere o mucchio d\u0027ossa."},{"n":"Animare oggetti","lv":5,"sc":"Trasmutazione di 5º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nGli oggetti si animano su ordine dell\u0027incantatore. L\u0027incantatore sceglie un numero di oggetti non magici entro gittata che non siano indossati o trasportati, fissati su una superficie o di dimensioni Mastodontiche. Il numero massimo di oggetti è uguale al suo modificatore di caratteristica da incantatore; per questo numero, un bersaglio di taglia Media o inferiore conta come un oggetto, un bersaglio di taglia Grande conta come due e un bersaglio Enorme conta come tre.\n\nOgni bersaglio si anima e diventa un costrutto provvisto di gambe che utilizza la scheda delle statistiche dell\u0027 oggetto animato; questa creatura è sotto il controllo dell\u0027incantatore fino al termine dell\u0027incantesimo o finché non viene ridotta a 0 punti ferita. Ogni creatura creata con questo incantesimo diventa un alleato per l\u0027incantatore e i suoi alleati. In combattimento, la creatura ha lo stesso punteggio di iniziativa dell\u0027incantatore, ma inizia il turno immediatamente dopo il suo.\n\nFino al termine dell\u0027incantesimo, come azione bonus, l\u0027incantatore può comandare mentalmente qualsiasi creatura creata con questo incantesimo, a patto che si trovi entro 150 metri da sé (se controlla varie creature, l\u0027incantatore può comandarne più di una allo stesso momento, impartendo lo stesso comando a ciascuna di loro). Se invece non impartisce alcun comando, la creatura effettua l\u0027azione Schivata e si sposta solo per evitare di subire danni. Quando la creatura scende a 0 punti ferita, riassume la sua forma di oggetto, a cui vengono trasferiti eventuali danni rimanenti.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni da Schianto della creatura aumentano di 1d4 (taglia Media o inferiore), 1d6 (taglia Grande) o 1d12 (taglia Enorme) per ogni slot di livello superiore al 5º.\n\n#### Oggetto animato\n\nCostrutto Enorme o inferiore, senza allineamento\nCA 15\nPF 10 (taglia Media o inferiore), 20 (taglia Grande),\n40 (taglia Enorme)\nVelocità 9 m\nMOD SALV MOD SALV MOD SALV\nFor 16 +3 +3 Des 10 +0 +0 Cos 10 +0 +0\nInt 3 −4 −4 Sag 3 −4 −4 Car 1 −5 −5\nImmunità affascinato, avvelenato, indebolimento,\nparalizzato, psichico, spaventato, veleno\nSensi Percezione passiva 6; vista cieca 9 m\nLingue comprende le lingue parlate dal personaggio\nGS nessuno (PE 0; BC pari al bonus di competenza del\npersonaggio)\n\n#### Azioni\n\nSchianto. Tiro per colpire in mischia: il bonus equivale\nal modificatore di attacco dell\u0027incantesimo del personaggio, portata di 1,5 m Colpito: danni da forza pari\na 1d4 + 3 (taglia Media o inferiore), 2d6 + 3 + il modificatore di caratteristica da incantatore dell\u0027incantatore\n(taglia Grande) o 2d12 + 3 + il modificatore di caratteristica da incantatore dell\u0027incantatore (taglia Enorme)."},{"n":"Anti-individuazione","lv":3,"sc":"Abiurazione di 3º livello (Bardo, Mago, Ranger)","cl":"Bardo, Mago, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (un pizzico di polvere di diamante del valore di 25 mo o più, che l\u0027incantesimo consuma)\n**Durata:** 8 ore\n\nPer la durata dell\u0027incantesimo, l\u0027incantatore nasconde agli incantesimi di divinazione un bersaglio da lui toccato. Il bersaglio può essere una creatura consenziente, oppure un luogo o un oggetto non più grande di 3 metri in qualsiasi dimensione. Il bersaglio non può essere preso di mira da alcun incantesimo di divinazione né percepito da sensori di scrutamento magico."},{"n":"Antipatia/simpatia","lv":8,"sc":"Ammaliamento di 8º livello (Bardo, Druido, Mago)","cl":"Bardo, Druido, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 ora\n**Gittata:** 18 metri\n**Componenti:** V, S, M (una miscela di aceto e miele)\n**Durata:** 10 giorni\n\nQuando l\u0027incantatore lancia l\u0027incantesimo, decide se creare antipatia o simpatia e sceglie come bersaglio una creatura o un oggetto di taglia Enorme o inferiore. Dopodiché, specifica un tipo di creatura, come per esempio draghi rossi, goblin o vampiri. Una creatura del tipo scelto effettua un tiro salvezza su Saggezza quando si trova entro 36 metri dal bersaglio. La scelta dell\u0027incantatore tra gli effetti di antipatia e simpatia determina cosa accade a una creatura quando questa fallisce il tiro salvezza.\n\n**Antipatia.** La creatura è spaventata e deve usare il movimento nel suo turno per allontanarsi il più possibile dal bersaglio, muovendosi per la via più sicura.\n\n**Simpatia.** La creatura è affascinata e deve usare il movimento nel suo turno per avvicinarsi il più possibile al bersaglio, muovendosi per la via più sicura. Se la creatura si trova entro 1,5 metri dal bersaglio, non può allontanarsi volontariamente. Se il bersaglio infligge danni alla creatura affascinata, questa può effettuare un tiro salvezza su Saggezza per porre fine all\u0027effetto, come descritto di seguito.\n\nPorre fine all\u0027effetto. Se la creatura spaventata o affascinata termina il suo turno a più di 36 metri di distanza dal bersaglio, effettua un tiro salvezza su Saggezza. In caso di successo, la creatura non è più sotto l\u0027influenza del bersaglio. Una creatura che supera un tiro salvezza contro l\u0027effetto ne è immune per 1 minuto, al termine del quale può esserne influenzata di nuovo."},{"n":"Arma magica","lv":2,"sc":"Trasmutazione di 2º livello (Mago, Paladino, Ranger, Stregone)","cl":"Mago, Paladino, Ranger, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** contatto\n**Componenti:** V, S\n**Durata:** 1 ora\n\nL\u0027incantatore tocca un\u0027arma non magica, e, fino al termine dell\u0027incantesimo, quell\u0027arma diventa un\u0027arma magica con un bonus di +1 ai tiri per colpire e ai tiri per i danni. L\u0027incantesimo termina in anticipo se l\u0027incantatore lo lancia di nuovo.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** Il bonus aumenta a +2 con uno slot incantesimo compreso tra il 3º e 5º livello. Il bonus aumenta a +3 con uno slot incantesimo di 6º livello o superiore."},{"n":"Arma spirituale","lv":2,"sc":"Invocazione di 2º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione bonus\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore crea una forza spettrale e fluttuante che ha la forma di un\u0027arma a sua scelta e permane per la durata dell\u0027incantesimo. L\u0027arma appare entro gittata in un luogo a scelta dell\u0027incantatore, il quale può subito effettuare un attacco in mischia con incantesimo contro una creatura entro 1,5 metri dall\u0027arma. Se il colpo va a segno, il bersaglio subisce 1d8 danni da forza + il modificatore di caratteristica da incantatore dell\u0027incantatore.\n\nCome azione bonus nei suoi turni successivi, l\u0027incantatore può muovere l\u0027arma spirituale di un massimo di 6 metri e ripetere l\u0027attacco contro una creatura situata entro 1,5 metri da essa.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d8 per ogni slot di livello superiore al 2º."},{"n":"Armatura magica","lv":1,"sc":"Abiurazione di 1º livello (Mago, Stregone)","cl":"Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (un pezzo di cuoio trattato)\n**Durata:** 8 ore\n\nL\u0027incantatore tocca una creatura consenziente che non indossa un\u0027armatura. Fino al termine dell\u0027incantesimo, la CA base del bersaglio diventa 13 più il suo modificatore di Destrezza. L\u0027incantesimo termina in anticipo se il bersaglio indossa un\u0027armatura."},{"n":"Artificio druidico","lv":0,"sc":"Trucchetto di Trasmutazione (Druido)","cl":"Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S\n**Durata:** istantanea\n\nSussurrando agli spiriti della natura, l\u0027incantatore crea uno degli effetti seguenti entro gittata.\n\n**Sensore atmosferico.** L\u0027incantatore crea un Minuscolo e innocuo effetto sensoriale che predice il tempo atmosferico nel luogo in cui si trova per le successive 24 ore. L\u0027effetto potrebbe manifestarsi come una sfera dorata in caso di cieli tersi, una nuvola in caso di pioggia, fiocchi di neve in caso di nevicate e così via. Questo effetto permane per 1 round.\n\n**Fioritura.** L\u0027incantatore fa istantaneamente sbocciare un fiore, aprire un baccello o schiudere un germoglio.\n\n**Effetto sensoriale.** L\u0027incantatore crea un effetto sensoriale innocuo, come la caduta di foglie, delle fate spettrali danzanti, una brezza leggera, il rumore di un piccolo animale o il debole odore di una puzzola. L\u0027effetto deve poter essere contenuto in un cubo con spigolo di 1,5 metri.\n\n**Trucchetto col fuoco.** L\u0027incantatore accende o spegne una candela, una torcia o un fuoco da campo."},{"n":"Aura di vita","lv":4,"sc":"Abiurazione di 4º livello (Chierico, Paladino)","cl":"Chierico, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore irradia un\u0027aura in un\u0027emanazione di 9 metri da sé che permane per la durata dell\u0027incantesimo. Mentre sono nell\u0027aura, l\u0027incantatore e i suoi alleati ottengono resistenza ai danni necrotici e i loro punti ferita massimi non possono essere ridotti. Se un alleato con 0 punti ferita inizia il suo turno nell\u0027aura, ne recupera 1."},{"n":"Aura magica dell\u0027arcanista","lv":2,"sc":"Illusione di 2º livello (Mago)","cl":"Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** contatto\n**Componenti:** V, S, M (un piccolo pezzo quadrato di seta)\n**Durata:** 24 ore\n\nL\u0027incantatore tocca una creatura consenziente o un oggetto che non sia indossato o trasportato e vi pone un\u0027illusione. Una creatura riceve l\u0027effetto Maschera, mentre un oggetto riceve l\u0027effetto Falsa aura. Entrambi gli effetti, descritti di seguito, permangono per tutta la durata dell\u0027incantesimo. Se l\u0027incantatore lancia l\u0027incantesimo sullo stesso bersaglio ogni giorno per 30 giorni, l\u0027illusione permane finché non viene dissolta.\n\n**Maschera (creatura).** L\u0027incantatore sceglie un tipo di creatura diverso da quello del bersaglio. Gli incantesimi e altri effetti magici considerano il bersaglio come se fosse una creatura del tipo scelto dall\u0027incantatore.\n\n**Falsa aura (oggetto).** L\u0027incantatore modifica il modo in cui il bersaglio appare agli incantesimi e agli effetti magici che individuano le aure magiche, come per esempio individuazione del magico. L\u0027incantatore può fare in modo che un oggetto non magico appaia come magico e viceversa, oppure può cambiare l\u0027aura di un oggetto in modo che sembri appartenere a una scuola di magia a sua scelta."},{"n":"Aura sacra","lv":8,"sc":"Abiurazione di 8º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (un reliquiario del valore di 1.000 mo o più)\n**Durata:** concentrazione, fino a 1 minuto\n\nPer la durata dell\u0027incantesimo, l\u0027incantatore irradia un\u0027aura in un\u0027emanazione di 9 metri. Le creature scelte dell\u0027incantatore che si trovano all\u0027interno dell\u0027aura dispongono di vantaggio a tutti i tiri salvezza, mentre le altre creature subiscono svantaggio ai tiri per colpire contro le creature scelte. Inoltre, quando un immondo o un non morto colpisce una creatura influenzata con un tiro per colpire in mischia, l\u0027attaccante deve superare un tiro salvezza su Costituzione, altrimenti viene accecato fino al termine del proprio turno successivo."},{"n":"Bacche benefiche","lv":1,"sc":"Evocazione di 1º livello (Druido, Ranger)","cl":"Druido, Ranger","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (un rametto di vischio)\n**Durata:** 24 ore\n\nPer la durata dell\u0027incantesimo, nella mano dell\u0027incantatore appaiono dieci bacche infuse di magia. Una creatura può effettuare un\u0027azione bonus per mangiare una bacca, recuperando così 1 punto ferita e ottenendo nutrimento sufficiente per una giornata intera.\n\nLe bacche non mangiate scompaiono al termine dell\u0027incantesimo."},{"n":"Bagliore lunare","lv":2,"sc":"Invocazione di 2º livello (Druido)","cl":"Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 36 metri\n**Componenti:** V, S, M (una foglia di un vitigno legnoso)\n**Durata:** concentrazione, fino a 1 minuto\n\nUn bagliore argentato di luce pallida forma un cilindro del raggio di 1,5 metri e dell\u0027altezza di 12 metri centrato su un punto entro gittata. Fino al termine dell\u0027incantesimo, il cilindro è pervaso da luce fioca e l\u0027incantatore può effettuare un\u0027azione di Magia nei turni successivi per spostare il cilindro fino a 18 metri.\n\nQuando appare il cilindro, ogni creatura al suo interno effettua un tiro salvezza su Costituzione. In caso di fallimento, una creatura subisce 2d10 danni radiosi e, se la creatura è in forma mutata (ad esempio, come conseguenza all\u0027incantesimo metamorfosi), torna alla sua forma naturale e non può trasformarsi finché non esce dal cilindro. In caso di successo, subisce soltanto la metà di quei danni. Una creatura effettua questo tiro salvezza anche quando l\u0027area dell\u0027incantesimo si muove nel suo spazio e quando la creatura entra nell\u0027area dell\u0027incantesimo o vi termina il suo turno. Una creatura effettua questo tiro salvezza solo una volta per turno.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** I danni aumentano di 1d10 per ogni slot di livello superiore al 2º."},{"n":"Bagliore solare","lv":6,"sc":"Invocazione di 6º livello (Chierico, Druido, Mago, Stregone)","cl":"Chierico, Druido, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (una lente d\u0027ingrandimento)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore lancia un bagliore solare in una linea larga 1,5 metri e lunga 18 metri. Ogni creatura nella sua traiettoria effettua un tiro salvezza su Costituzione e, se lo fallisce, subisce 6d8 danni radiosi e rimane accecata fino all\u0027inizio del turno successivo dell\u0027incantatore. Se lo supera, invece, subisce solo la metà dei danni.\n\nFino al termine dell\u0027incantesimo, l\u0027incantatore può effettuare un\u0027azione di Magia per creare una nuova linea radiosa.\n\nPer la durata dell\u0027incantesimo, una scintilla di luce radiosa risplende nella sua mano ed emana luce intensa in un raggio di 9 metri e luce fioca per ulteriori 9 metri. Questa luce è considerata luce solare."},{"n":"Banchetto degli eroi","lv":6,"sc":"Evocazione di 6º livello (Bardo, Chierico, Druido)","cl":"Bardo, Chierico, Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 10 minuti\n**Gittata:** incantatore\n**Componenti:** V, S, M (una ciotola tempestata di gemme del valore di 1.000 mo o più, che l\u0027incantesimo consuma)\n**Durata:** istantanea\n\nL\u0027incantatore evoca accanto a sé un banchetto che appare su una superficie all\u0027interno di un cubo libero con spigolo di 3 metri. Consumare il banchetto richiede 1 ora, solo al termine della quale il convivio scompare e i suoi effetti benefici vengono applicati. Fino a un massimo di dodici creature possono partecipare al banchetto.\n\nUna creatura che partecipa al banchetto ottiene numerosi benefici che durano 24 ore. La creatura diventa resistente ai danni da veleno e immune alle condizioni avvelenato e spaventato. Inoltre, i suoi punti ferita massimi aumentano di 2d10 e ottiene lo stesso numero di punti ferita."},{"n":"Barriera di lame","lv":6,"sc":"Invocazione di 6º livello (Chierico)","cl":"Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 27 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 10 minuti\n\nL\u0027incantatore crea un muro di lame turbinanti composte da energia magica. Il muro compare entro gittata e permane per la durata dell\u0027incantesimo. L\u0027incantatore crea un muro lineare lungo fino a 30 metri, alto 6 metri e spesso 1,5 metri, oppure un muro circolare del diametro massimo di 18 metri, alto 6 metri e spesso 1,5 metri. Il muro garantisce tre quarti di copertura e il suo spazio è un terreno difficile.\n\nQualsiasi creatura situata nello spazio del muro deve effettuare un tiro salvezza su Destrezza, subendo 6d10 danni forza in caso di fallimento, o la metà dei danni in caso di successo. Una creatura effettua il tiro salvezza anche se entra nello spazio del muro o vi termina il suo turno. Il tiro salvezza può essere effettuato solo una volta per turno."},{"n":"Beffa crudele","lv":0,"sc":"Trucchetto di Ammaliamento (Bardo)","cl":"Bardo","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V\n**Durata:** istantanea\n\nL\u0027incantatore pronuncia una sequenza di insulti mescolati a impercettibili ammaliamenti contro una creatura entro gittata che egli è in grado di vedere o di sentire. Il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti subisce 1d6 danni psichici e svantaggio al tiro per colpire successivo che effettua prima della fine del suo turno successivo.\n\n**Trucchetto potenziato.** I danni aumentano di 1d6 quando l\u0027incantatore raggiunge il 5º livello (2d6), l\u002711º livello (3d6) e il 17º livello (4d6)."},{"n":"Benedizione","lv":1,"sc":"Ammaliamento di 1º livello (Chierico, Paladino)","cl":"Chierico, Paladino","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 9 metri\n**Componenti:** V, S, M (un simbolo sacro del valore di 5 mo o più)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore benedice fino a tre creature entro gittata. Se un bersaglio effettua un tiro per colpire o un tiro salvezza prima del termine dell\u0027incantesimo, il bersaglio aggiunge a essi 1d4.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 1º."},{"n":"Blocca mostri","lv":5,"sc":"Ammaliamento di 5º livello (Bardo, Mago, Stregone, Warlock)","cl":"Bardo, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 27 metri\n**Componenti:** V, S, M (una sbarra di ferro)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore sceglie una creatura entro gittata che egli è in grado di vedere. Il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti rimane paralizzato per la durata dell\u0027incantesimo. Alla fine di ogni suo turno, il bersaglio ripete il tiro salvezza e, se lo supera, termina l\u0027incantesimo su di sé.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare una creatura aggiuntiva per ogni slot di livello superiore al 5º."},{"n":"Blocca persone","lv":2,"sc":"Ammaliamento di 2º livello (Bardo, Chierico, Druido, Mago, Stregone, Warlock)","cl":"Bardo, Chierico, Druido, Mago, Stregone, Warlock","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S, M (una sbarra di ferro)\n**Durata:** concentrazione, fino a 1 minuto\n\nL\u0027incantatore sceglie un umanoide entro gittata che egli è in grado di vedere. Il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti rimane paralizzato per la durata dell\u0027incantesimo. Alla fine di ogni suo turno, il bersaglio ripete il tiro salvezza e, se lo supera, termina l\u0027incantesimo su di sé.\n\n**Utilizzo di uno slot incantesimo di livello superiore.** L\u0027incantatore può bersagliare un umanoide aggiuntivo per ogni slot di livello superiore al 2º."},{"n":"Bocca magica","lv":2,"sc":"Illusione di 2º livello (Bardo, Mago)","cl":"Bardo, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto o rituale\n**Gittata:** 9 metri\n**Componenti:** V, S, M (polvere di giada del valore di 10 mo o più, che l\u0027incantesimo consuma)\n**Durata:** finché non viene dissolto\n\nL\u0027incantatore imprime un messaggio all\u0027interno di un oggetto entro gittata, che viene pronunciato quando si verifica una condizione di innesco. L\u0027incantatore sceglie un oggetto che egli è in grado di vedere e che non è indossato o trasportato da un\u0027altra creatura. Quindi pronuncia il messaggio, che non deve essere più lungo di 25 parole, ma può essere enunciato nell\u0027arco di 10 minuti. Infine, determina la circostanza che innesca l\u0027incantesimo e l\u0027emissione del messaggio.\n\nQuando quell\u0027innesco si verifica, sull\u0027oggetto appare una bocca magica che recita il messaggio con il tono e il volume di voce dell\u0027incantatore. Se l\u0027oggetto scelto presenta già una bocca o qualcosa di simile (per esempio, la bocca di una statua), la bocca magica appare in modo che le parole sembrino pronunciate dalla bocca dell\u0027oggetto. Quando lancia questo incantesimo, l\u0027incantatore può fare in modo che esso termini una volta consegnato il messaggio o che rimanga attivo ripetendo il messaggio ogniqualvolta si verifica la circostanza di innesco. L\u0027innesco può essere sia generale che dettagliato, ma deve essere basato su condizioni visibili o udibili che si verificano entro 9 metri dall\u0027oggetto. Per esempio, l\u0027incantatore potrebbe ordinare alla bocca di parlare quando, entro 9 metri dall\u0027oggetto, una qualsiasi creatura si muove, oppure un campana d\u0027argento suona."},{"n":"Caduta morbida","lv":1,"sc":"Trasmutazione di 1º livello (Bardo, Mago, Stregone)","cl":"Bardo, Mago, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** reazione, che l\u0027incantatore può effettuare quando egli stesso o una creatura entro 18 metri da lui che egli è in grado di vedere cade\n**Gittata:** 18 metri\n**Componenti:** V, M (una piccola piuma)\n**Durata:** 1 minuto\n\nL\u0027incantatore sceglie fino a cinque creature in caduta entro gittata. La velocità di discesa di una creatura in caduta rallenta fino a 18 metri per round finché l\u0027incantesimo non termina. Se una creatura cade prima del termine dell\u0027incantesimo, non subisce alcun danno da caduta e interrompe l\u0027effetto dell\u0027incantesimo."},{"n":"Calmare emozioni","lv":2,"sc":"Ammaliamento di 2º livello (Bardo, Chierico)","cl":"Bardo, Chierico","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** 18 metri\n**Componenti:** V, S\n**Durata:** concentrazione, fino a 1 minuto\n\nOgni umanoide all\u0027interno di una sfera del raggio di 6 metri centrata su un punto scelto dall\u0027incantatore entro gittata deve effettuare un tiro salvezza su Carisma o essere influenzato da uno dei seguenti effetti (a scelta per ogni creatura):\n\n- La creatura è immune alle condizioni affascinato e spaventato fino al termine dell\u0027incantesimo. Se la creatura è già affascinata o spaventata, queste condizioni sono soppresse per la durata dell\u0027incantesimo.\n\n- La creatura diventa indifferente alle creature (a scelta dell\u0027incantatore) verso cui è ostile. Questa indifferenza termina se il bersaglio subisce danni o se vede uno dei suoi alleati subire danni. Al termine dell\u0027incantesimo, l\u0027atteggiamento della creatura torna alla normalità."},{"n":"Camminare nel vento","lv":6,"sc":"Trasmutazione di 6º livello (Druido)","cl":"Druido","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** 1 minuto\n**Gittata:** 9 metri\n**Componenti:** V, S, M (una candela)\n**Durata:** 8 ore\n\nL\u0027incantatore e un massimo di dieci creature consenzienti a sua scelta entro gittata assumono una forma gassosa per la durata dell\u0027incantesimo, apparendo come sbuffi di nuvole. Finché il bersaglio ha queste sembianze, ha una velocità di volo di 90 metri e può fluttuare. Inoltre, è immune alla condizione prono e resistente ai danni contundenti, perforanti e taglienti. Le uniche azioni che può effettuare in questa forma sono l\u0027azione Scatto, un\u0027azione di Magia o riassumere la propria forma normale. Quest\u0027ultima opzione richiede 1 minuto, durante il quale il bersaglio è stordito. Fino al termine dell\u0027incantesimo, il bersaglio può assumere nuovamente la forma di nuvola usando un\u0027azione di Magia seguita da 1 minuto di trasformazione. Se una creatura è in forma gassosa e sta volando quando l\u0027effetto termina, scende di 18 metri per round per 1 minuto finché non atterra, senza subire danni. Se tuttavia non riesce ad atterrare in 1 minuto, cade per la distanza rimanente."},{"n":"Camminare sull\u0027acqua","lv":3,"sc":"Trasmutazione di 3º livello (Chierico, Druido, Ranger, Stregone)","cl":"Chierico, Druido, Ranger, Stregone","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione o rituale\n**Gittata:** 9 metri\n**Componenti:** V, S, M (un pezzo di sughero)\n**Durata:** 1 ora\n\nQuesto incantesimo conferisce la capacità di muoversi su una qualsiasi superficie liquida, come l\u0027acqua, l\u0027acido, il fango, la neve, le sabbie mobili o la lava, come se si trattasse di un innocuo terreno solido (ma le creature che attraversano un tratto di lava fusa possono comunque subire danni dal calore). Fino a dieci creature consenzienti entro gittata a scelta dell\u0027incantatore ottengono questa capacità per la durata dell\u0027incantesimo.\n\nUn bersaglio colpito deve usare un\u0027azione bonus per passare dalla superficie del liquido all\u0027interno del liquido stesso e viceversa, ma se il bersaglio cade dentro di esso passa attraverso la superficie nel liquido sottostante."},{"n":"Campo anti-magia","lv":8,"sc":"Abiurazione di 8º livello (Chierico, Mago)","cl":"Chierico, Mago","fonte":"SRD 5.2.1","md":"**Tempo di lancio:** azione\n**Gittata:** incantatore\n**Componenti:** V, S, M (limatura di ferro)\n**Durata:** concentrazione, fino a 1 ora\n\nUn\u0027aura di anti-magia circonda l\u0027incantatore in un\u0027emanazione di 3 metri. Nessuno può lanciare incantesimi, compiere azioni di Magia o creare altri effetti magici all\u0027interno dell\u0027aura, e tali azioni non possono colpire o influenzare in alcun modo nulla al suo interno. Le proprietà degli oggetti magici non funzionano all\u0027interno dell\u0027aura o su qualsiasi cosa al suo interno.\n\nLe aree di effetto create da incantesimi o da altre magie non possono estendersi all\u0027interno dell\u0027aura e nessuno può teletrasportarsi all\u0027interno o all\u0027esterno di essa o utilizzare il viaggio planare. I portali si chiudono temporaneamente quando si trovano all\u0027interno del
