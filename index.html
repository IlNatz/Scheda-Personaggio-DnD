uti, fino alla fine della luna hai vantaggio alle prove di Carisma (Persuasione) e di Saggezza (Intuizione) contro di lei, e sai se qualcun altro la sta manipolando. Quando una creatura che vedi entro 18 m effettua un tiro per colpire, una prova o un tiro salvezza, puoi usare la reazione per imporle svantaggio: un filo le tira il polso. Puoi usare questa reazione una volta per riposo breve.","pn":"Sempre un Piano","pt":"Non sai più agire d\u0027impulso. Hai svantaggio ai tiri di iniziativa, e non puoi effettuare reazioni prima del tuo primo turno in uno scontro."},{"g":"II","n":"Segnato","inc":"Suggestione","dn":"Il Filo","dt":"Dopo aver parlato con una creatura per almeno 1 minuto, puoi legarla con un filo. Le suggerisci una cosa da fare, e un momento in cui farla, entro le 24 ore successive, come per l\u0027incantesimo _suggestione_. La creatura deve superare un tiro salvezza su Saggezza contro la CD del patto, altrimenti quando arriva il momento lo fa, convinta di averlo scelto da sola. Se lo supera, non si accorge che ci hai provato. Puoi usare questo Dono un numero di volte pari al tuo bonus di competenza.","pn":"Il Necrotico","pt":"Hai vulnerabilità ai danni necrotici."},{"g":"III","n":"Servitore","inc":"Trama Ipnotica","dn":"La Burattinata","dt":"Le creature legate da un tuo filo hanno svantaggio ai tiri salvezza contro i tuoi incantesimi di ammaliamento. Quando una creatura legata da un tuo filo, o che vedi entro 9 m, effettua un tiro per colpire, puoi usare la reazione per costringerla a superare un tiro salvezza su Saggezza contro la CD del patto, altrimenti l\u0027attacco colpisce un\u0027altra creatura a portata, scelta da te. Puoi usare questa reazione un numero di volte pari al tuo bonus di competenza.","pn":"Chi Dichiara è Libero","pt":"Una creatura che dichiara ad alta voce la propria intenzione prima di agire non può essere bersaglio dei tuoi Doni in quel turno, e fino alla fine del suo turno successivo ha vantaggio ai tiri salvezza contro i tuoi incantesimi."},{"g":"IV","n":"Avatar","inc":"Charme sui Mostri","dn":"La Tela","dt":"Una volta per riposo lungo, per 1 ora, vedi e senti quello che vede e sente una creatura legata da un tuo filo, ovunque si trovi; durante quell\u0027ora, una volta, puoi farle compiere un\u0027azione a tua scelta, e deve superare un tiro salvezza su Saggezza contro la CD del patto, altrimenti la compie. Una volta per riposo lungo puoi anche lanciare _dominare persone_ senza spendere uno slot.","pn":"Il Volto di Adam","pt":"Tutti i fili della Ragnatela salgono verso chi porta il volto di Adam Thorne, e anche i tuoi. Chi lo porta sa sempre dove sei, e può, una volta per luna, tirare. Hai svantaggio ai tiri salvezza contro gli incantesimi di ammaliamento: anche il tuo filo è legato a qualcuno."},{"g":"V","n":"Manifestazione","inc":"—","dn":"Il Ragno sulla Soglia","dt":"Sai che cosa intendono fare le creature entro 9 m da te prima che lo facciano: non puoi essere Sorpreso, e hai vantaggio ai tiri salvezza contro i loro incantesimi e le loro capacità. Una volta per riposo lungo puoi lanciare _dominare mostri_ senza spendere uno slot.","pn":"La Tela Tira","pt":"Sei il centro della tela, e la tela non ha bisogno di te come persona. Alla fine dell\u0027arco che stai giocando il personaggio si siede in una stanza senza polvere, e aspetta: da quel momento è del Master."}]},{"n":"Il Patto della Spirale","paura":"La Spirale","car":"INT","tributo":"Far dubitare qualcuno della propria mente.\n- Convincere qualcuno che ciò che ricorda non è mai successo, finché non smette di fidarsi di sé.\n- Far perdere qualcuno in un luogo che non può esistere, e lasciarlo uscire, una volta sola, per tornarci.\n- Spostare le cose di qualcuno, ogni notte, di pochi centimetri, finché non lo vede nessuno tranne lui.\n\n**Lo tradisce** dire verità semplici e dirette, confermare ciò che un altro percepisce, aiutare qualcuno a orientarsi, risolvere un enigma in modo lineare (vedi [[La Spirale]]).","segno":"Prima il sorriso si allarga un poco troppo, e resta anche quando non c\u0027è niente da ridere. Poi il riflesso negli specchi arriva in ritardo, di un istante. Ai Gradi alti le linee intorno a un Avatar della Spirale si piegano, gli spigoli dei tavoli, le travi, i pavimenti, e chi lo guarda troppo a lungo ha la nausea.","gradi":[{"g":"I","n":"Sfiorato","inc":"Risata Incontenibile di Tasha","dn":"Il Sorriso","dt":"Hai vantaggio alle prove di Carisma (Inganno), e nessuna magia può rivelare se stai mentendo. Quando una creatura che vedi entro 9 m ti colpisce con un attacco, puoi usare la reazione per farle credere di averti mancato: deve superare un tiro salvezza su Saggezza contro la CD del patto, altrimenti l\u0027attacco manca, perché tu non eri davvero lì. Puoi usare questa reazione un numero di volte pari al tuo bonus di competenza.","pn":"La Verità Ti Sfugge","pt":"Quando dici una verità semplice non riesci a smettere di sorridere, e nessuno ti crede: hai svantaggio alle prove di Carisma (Persuasione) quando dici il vero. Non puoi usare l\u0027azione Aiuto: quello che dici per aiutare suona come un trucco."},{"g":"II","n":"Segnato","inc":"Immagine Speculare","dn":"La Porta Sbagliata","dt":"Con un\u0027azione bonus attraversi una porta, un arco o un varco, ed esci da un\u0027altra porta, arco o varco che hai visto e che si trova entro 36 m. Puoi portare con te una creatura consenziente che stai toccando. Puoi usare questo Dono un numero di volte pari al tuo bonus di competenza.","pn":"La Mente Piegata","pt":"Hai vulnerabilità ai danni psichici: una mente che sa esattamente che cosa vuole ti raggiunge al centro."},{"g":"III","n":"Servitore","inc":"Immagine Maggiore","dn":"La Vertigine","dt":"Con un\u0027azione scegli una creatura che puoi vedere entro 18 m. Deve superare un tiro salvezza su Saggezza contro la CD del patto, altrimenti per 1 minuto lo spazio le gira intorno: all\u0027inizio di ogni suo turno subisce 3d6 danni psichici e tira 1d8 per decidere la direzione in cui si muove, può muoversi soltanto di metà della sua velocità, e ha svantaggio ai tiri per colpire contro le creature a più di 1,5 m. Ripete il tiro salvezza alla fine di ogni suo turno. Puoi usare questo Dono un numero di volte pari al tuo bonus di competenza.","pn":"Lo Specchio","pt":"Il tuo riflesso è in ritardo, e a volte fa un\u0027altra cosa. Hai svantaggio ai tiri salvezza contro le illusioni e alle prove per riconoscerle: anche tu, ormai, non sei sicuro di che cosa è vero."},{"g":"IV","n":"Avatar","inc":"Terreno Illusorio","dn":"Il Corridoio","dt":"Con un\u0027azione scegli una creatura entro 18 m. Deve superare un tiro salvezza su Intelligenza contro la CD del patto, altrimenti sparisce in un corridoio che torna su se stesso, per un massimo di 1 minuto, finché mantieni la concentrazione. Alla fine di ogni suo turno può tentare di uscirne con una prova di Intelligenza (Indagare) contro la CD del patto. Quando esce, o quando l\u0027effetto finisce, torna nello spazio che aveva lasciato e subisce 6d10 danni psichici. Puoi usare questo Dono una volta per riposo breve.","pn":"Il Dettaglio Falso","pt":"Una volta per riposo lungo il Master ti descrive un dettaglio della scena che non c\u0027è, soltanto a te, come se fosse vero, e non saprai mai quale. Sempre una volta per riposo lungo, il Master può dichiarare che uno dei tuoi tiri per colpire era contro un\u0027immagine che non c\u0027era: l\u0027attacco manca."},{"g":"V","n":"Manifestazione","inc":"—","dn":"Il Sorriso Troppo Largo","dt":"Sei immune alle condizioni Affascinato e Spaventato, e hai resistenza ai danni psichici. Una volta per riposo lungo, con un\u0027azione, ogni creatura che scegli entro 18 m deve superare un tiro salvezza su Saggezza contro la CD del patto, altrimenti per 1 minuto è sotto l\u0027effetto dell\u0027incantesimo _confusione_ e non distingue più gli amici dai nemici.","pn":"La Strada che Gira","pt":"Non trovi più l\u0027uscita, perché non c\u0027è mai stata. Alla fine dell\u0027arco che stai giocando il personaggio prende una svolta in più, e da quel momento è del Master."}]},{"n":"Il Patto dell\u0027Estinzione","paura":"L\u0027Estinzione","car":"INT","tributo":"Far finire qualcosa per sempre, senza che ne resti il ricordo.\n- Distruggere l\u0027ultima copia di un libro, l\u0027ultimo seme di una pianta, l\u0027ultimo di una stirpe.\n- Far dimenticare a un villaggio il nome di qualcuno, e guardare la sua sedia restare vuota.\n- Chiudere per sempre un posto che nessuno ricorderà di aver visitato.\n\n**Lo tradisce** far crescere o proteggere qualcosa di vivo, restaurare ciò che era scomparso, tenere viva la speranza davanti a tutti, fondare, scrivere, piantare, creare insieme (vedi [[L\u0027Estinzione]]).","segno":"Fin dal primo istante non si proietta più ombra. Poi chi guarda un Avatar dell\u0027Estinzione dimentica i dettagli della sua faccia appena volta lo sguardo. Ai Gradi alti le luci non magiche intorno a lui si abbassano, i colori sbiadiscono, e nelle stanze in cui è passato manca sempre qualcosa che nessuno sa dire.","gradi":[{"g":"I","n":"Sfiorato","inc":"Anatema","dn":"Senza Ombra","dt":"Hai vantaggio ai tiri salvezza contro gli incantesimi e le capacità delle Paure, dei loro Avatar e delle loro creature, comprese le Manifestazioni. Una volta per turno, quando colpisci una di queste creature o un non morto, le infliggi 1d10 danni da forza in più.","pn":"Nessuno Ricorda Bene","pt":"Chi ti incontra per la prima volta dimentica il tuo nome entro un\u0027ora. Hai svantaggio alle prove di Carisma con chiunque non ti abbia visto nell\u0027ultima ora: per lui sei di nuovo uno sconosciuto."},{"g":"II","n":"Segnato","inc":"Silenzio","dn":"La Negazione","dt":"Quando una creatura che puoi vedere entro 18 m lancia un incantesimo di 4° livello o inferiore, o usa un Dono di un patto, puoi usare la reazione per farlo finire nel nulla: l\u0027incantesimo o il Dono non ha effetto. Puoi usare questo Dono un numero di volte pari al tuo bonus di competenza.","pn":"Il Costo Vitale","pt":"I tuoi Doni costano: ogni volta che ne usi uno di Grado II o superiore, perdi PF pari al doppio del Grado del Dono, e questi PF non si recuperano finché non termini un riposo lungo."},{"g":"III","n":"Servitore","inc":"Dissolvi Magie","dn":"L\u0027Annullamento","dt":"Le creature delle Paure e i non morti entro 9 m da te perdono tutte le resistenze e le immunità ai danni, e le creature evocate o chiamate da un incantesimo che iniziano il turno entro 3 m da te subiscono 3d10 danni da forza.","pn":"Ciò che Non Finisce","pt":"Le cose che si rifiutano di finire ti raggiungono dove nient\u0027altro arriva. Hai vulnerabilità ai danni radianti e da fuoco."},{"g":"IV","n":"Avatar","inc":"Avvizzimento","dn":"Cancellare","dt":"Due volte per riposo lungo, quando riduci una creatura a 0 PF, puoi cancellarla: non resta il corpo, non resta niente, e chi la conosceva la dimentica, tranne te. In alternativa, con un\u0027azione, puoi cancellare un oggetto non magico o una parte di una struttura che entra in un cubo di 3 m di lato.","pn":"Ciò che Crei Svanisce","pt":"Quello che scrivi, costruisci o pianti sparisce entro la fine della luna. Fuori da un riposo lungo non puoi recuperare PF oltre la metà del tuo massimo: anche quello che si rimargina, in te, finisce."},{"g":"V","n":"Manifestazione","inc":"—","dn":"La Quindicesima","dt":"Sei immune ai Doni di tutti gli altri patti. Una volta per riposo lungo, con un\u0027azione, per 1 minuto ogni magia si spegne in una sfera di 18 m di raggio centrata su di te e che si sposta con te: gli incantesimi finiscono, gli oggetti magici che non sono artefatti smettono di funzionare, le creature evocate spariscono.","pn":"La Fine di Tutto","pt":"Non proietti più ombra perché non c\u0027è più niente da coprire. Alla fine dell\u0027arco che stai giocando il personaggio va dove le cose finiscono, come Iselde, e da quel momento è del Master."}]},{"n":"Il Patto dello Straniero","paura":"Lo Straniero","car":"CAR","tributo":"Far capire a qualcuno che chi ama non è più chi ama.\n- Prendere il posto di qualcuno in una famiglia, e farsi scoprire, piano, da chi lo amava.\n- Lasciare qualcuno davanti a una figura che ha la sua stessa faccia.\n- Far parlare un manichino, un ritratto, un morto vestito a festa, davanti a chi lo conosceva.\n\n**Lo tradisce** scoprire il proprio vero volto, farsi riconoscere per chi si è, mantenere una sola identità, guardarsi in uno specchio onesto (vedi [[Lo Straniero]]).","segno":"Prima la faccia diventa difficile da ricordare, e le ciglia non si muovono quando dovrebbero. Poi sotto il mento, dove la pelle incontra il collo, c\u0027è un bordo sottile, come di una pelle appoggiata sopra un\u0027altra. Ai Gradi alti la faccia di un Avatar dello Straniero scivola, appena, quando gira la testa troppo in fretta, e sotto non c\u0027è niente che si possa descrivere.","gradi":[{"g":"I","n":"Sfiorato","inc":"Camuffare Se Stesso","dn":"La Voce Prestata","dt":"Puoi imitare alla perfezione la voce di una creatura che hai sentito parlare per almeno 1 minuto; chi la conosce bene ha diritto a una prova di Saggezza (Intuizione) contro la CD del patto per accorgersene. Puoi lanciare _camuffare se stesso_ a volontà, senza spendere slot, e hai vantaggio alle prove di Carisma (Inganno) per passare per qualcun altro.","pn":"Gli Animali Sanno","pt":"I cani abbaiano, i cavalli si impennano, i bambini piangono: hai svantaggio alle prove di Saggezza (Addestrare Animali) e a tutte le prove di Carisma con i bambini e con gli animali. Le bestie che ti vedono per la prima volta ti sono ostili, o scappano."},{"g":"II","n":"Segnato","inc":"Alterare Se Stesso","dn":"Le Maschere","dt":"Puoi tenere un numero di Maschere pari al tuo bonus di competenza: sono i volti di creature umanoidi che hai studiato da vicino per 10 minuti, o che hai ucciso. Con un\u0027azione indossi una Maschera, e assumi la faccia, la voce e la corporatura di quella creatura, purché abbia la tua stessa taglia. Non è un\u0027illusione: resiste al tatto e alla magia che rivela le illusioni. Chi conosceva bene l\u0027originale ha vantaggio alle prove di Saggezza (Intuizione) contro la CD del patto per accorgersi che qualcosa non va.","pn":"La Pelle Indossata","pt":"Sotto la faccia c\u0027è una cosa che si finge carne, e il ferro la trova. Ogni volta che subisci danni contundenti, perforanti o taglienti, ne subisci 1d4 in più, o 1d8 dal Grado IV."},{"g":"III","n":"Servitore","inc":"Paura","dn":"Il Volto Sbagliato","dt":"Con un\u0027azione bonus mostri, per un istante, che cosa c\u0027è sotto la faccia. Ogni creatura entro 9 m che ti vede deve superare un tiro salvezza su Saggezza contro la CD del patto, altrimenti è Spaventata da te per 1 minuto: finché lo è non può effettuare reazioni, e all\u0027inizio di ogni suo turno subisce 2d8 danni psichici. Ripete il tiro salvezza alla fine di ogni suo turno. Puoi usare questo Dono un numero di volte pari al tuo bonus di competenza.","pn":"La Faccia che Scivola","pt":"Negli specchi il tuo riflesso ha sempre la faccia sbagliata, e chi lo vede lo capisce. I colpi critici contro di te infliggono un dado di danni in più, e fanno cadere la Maschera che stai indossando."},{"g":"IV","n":"Avatar","inc":"Invisibilità Superiore","dn":"La Sostituzione","dt":"Puoi indossare o togliere una Maschera con un\u0027azione bonus, e nessuna magia può rivelare la tua vera forma. Una volta per riposo lungo, toccando una creatura umanoide Incapacitata, diventi lei per 8 ore: ne assumi la faccia, la voce e i modi, e sai le cose che sapeva nell\u0027ultima ora. Le tue statistiche non cambiano. Chi la conosceva ha svantaggio alle prove per accorgersi della differenza.","pn":"Senza Volto","pt":"Se passi un riposo lungo con la tua vera faccia, ottieni un livello di Indebolimento, che si toglie soltanto passando un riposo lungo con una Maschera. Hai svantaggio ai tiri salvezza su Carisma: è difficile restare dentro un corpo quando non si sa più di chi sia."},{"g":"V","n":"Manifestazione","inc":"—","dn":"Il Ballo dei Volti","dt":"Non hai più una forma vera. Una volta per riposo lungo, con un\u0027azione, ogni creatura che scegli entro 18 m deve superare un tiro salvezza su Saggezza contro la CD del patto, altrimenti per 1 minuto vede tutte le altre creature con un volto sbagliato: non distingue gli amici dai nemici, e quando attacca sceglie il bersaglio a caso tra le creature a portata. Ripete il tiro salvezza alla fine di ogni suo turno.","pn":"Nessuno","pt":"Non sai più chi eri. Alla fine dell\u0027arco che stai giocando il personaggio indossa l\u0027ultima Maschera, e non se la toglie più: da quel momento è del Master."}]},{"n":"Il Patto dell\u0027Occhio","paura":"L\u0027Occhio","car":"INT","tributo":"Farsi raccontare da qualcuno, per intero, ciò che non ha mai detto.\n- Ascoltare qualcuno raccontare la cosa peggiore che gli è successa, dall\u0027inizio alla fine, senza interromperlo, e guardarlo mentre lo fa.\n- Strappare a qualcuno il segreto che lo tiene sveglio.\n- Far sapere a qualcuno che è osservato da sempre: leggergli il suo diario, ripetergli le parole che ha detto da solo.\n\n**Lo tradisce** distruggere una conoscenza, lasciar morire un segreto, distogliere lo sguardo da una verità, mentire per proteggere qualcuno (vedi [[L\u0027Occhio]]).","segno":"Prima si smette di sbattere le palpebre, quasi del tutto. Poi le iridi si schiariscono, e negli angoli bui sembrano accendersi. Ai Gradi alti sulla pelle, sul dorso delle mani, alla base del collo, sotto lo sterno, si aprono piccole palpebre chiuse, e ogni tanto una si apre per guardare qualcuno.","gradi":[{"g":"I","n":"Sfiorato","inc":"Identificare","dn":"Il Testimone","dt":"Non puoi essere Sorpreso finché sei cosciente, e sai sempre se una creatura che puoi vedere ti sta guardando. Aggiungi il modificatore della caratteristica del patto ai tiri di iniziativa e alle prove di Saggezza (Intuizione) e (Percezione).","pn":"Non Distogli lo Sguardo","pt":"Non riesci a chiudere gli occhi davanti a ciò che guardi: non puoi evitare gli effetti di uno sguardo distogliendo gli occhi, e hai svantaggio ai tiri salvezza contro di essi e contro la condizione Spaventato. Quello che vedi, non lo dimentichi."},{"g":"II","n":"Segnato","inc":"Individuazione dei Pensieri","dn":"La Domanda","dt":"Sai sempre quando una creatura che senti dice una cosa che sa essere falsa. Con un\u0027azione fai una domanda a una creatura entro 9 m che può sentirti e capirti. La creatura deve superare un tiro salvezza su Saggezza contro la CD del patto, altrimenti risponde, per intero e con la verità, e sa di essere stata costretta. Puoi usare questo Dono un numero di volte pari al tuo bonus di competenza.","pn":"Il Raggio","pt":"Hai vulnerabilità ai danni radianti: la luce della verità sacra ti raggiunge come un\u0027accusa."},{"g":"III","n":"Servitore","inc":"Chiaroveggenza","dn":"Le Palpebre","dt":"Vedi le creature e gli oggetti invisibili entro 18 m. Con un\u0027azione bonus studi una creatura che vedi entro 18 m: fino alla fine del tuo turno successivo i tuoi tiri per colpire contro di lei hanno vantaggio, e sai quali resistenze, immunità e vulnerabilità ha. Puoi studiare un numero di volte pari al tuo bonus di competenza. Una volta per riposo lungo, con un\u0027azione, puoi leggere l\u0027ultimo sogno di una creatura addormentata entro 9 m, oppure, toccando un oggetto o un muro, vedere la cosa più importante che è successa lì nell\u0027ultima luna.","pn":"Il Non Sapere","pt":"Quello che non vedi ti terrorizza. Quando sei Accecato, o al buio senza poter vedere, sei anche Spaventato, e la tua velocità è 0."},{"g":"IV","n":"Avatar","inc":"Occhio Arcano","dn":"Vista del Vero","dt":"Hai vista del vero entro 18 m, e le creature entro quella distanza non possono essere nascoste per te. Una volta per riposo lungo puoi lanciare _scrutare_ senza componenti e senza spendere uno slot.","pn":"Nessuno Guarda","pt":"Senza nessuno da guardare non sai più chi sei. Quando non c\u0027è nessuna creatura entro 18 m che tu possa vedere, hai svantaggio ai tiri salvezza su Saggezza e su Carisma, e non puoi beneficiare di un riposo breve."},{"g":"V","n":"Manifestazione","inc":"—","dn":"Il Testimone Insonne","dt":"Non hai più bisogno di dormire, e non puoi essere Accecato se non da un effetto magico. Una volta per riposo lungo, con un\u0027azione, apri tutti gli occhi su una creatura entro 18 m: deve superare un tiro salvezza su Saggezza contro la CD del patto, altrimenti è Stordita per 1 minuto mentre leggi tutta la sua vita, e all\u0027inizio di ogni suo turno subisce 4d10 danni psichici. Ripete il tiro salvezza alla fine di ogni suo turno. Quando l\u0027effetto finisce, sai tutto quello che sapeva lei.","pn":"Le Palpebre Aperte","pt":"Non chiudi più gli occhi, nessuno di tutti quelli che hai. Alla fine dell\u0027arco che stai giocando il personaggio smette di parlare, e guarda, per sempre: da quel momento è del Master."}]}],"talismani":[{"n":"Ambra di Torre Rossa","pag":"Il Corpo","rar":"+0 non comune · +1 raro · +2 molto raro · +3 leggendario","mal":false,"md":"Una goccia d\u0027ambra rossa, liscia, calda come la pelle, con dentro un filo d\u0027oro che si muove, se la si guarda contro una fiamma.\n- **+0:** il tuo massimo dei PF aumenta di 10.\n- **+1:** il tuo massimo dei PF aumenta di 20.\n- **+2:** il tuo massimo dei PF aumenta di 30.\n- **+3:** il tuo massimo dei PF aumenta di 40.","opz":[{"l":"+0","t":"il tuo massimo dei PF aumenta di 10."},{"l":"+1","t":"il tuo massimo dei PF aumenta di 20."},{"l":"+2","t":"il tuo massimo dei PF aumenta di 30."},{"l":"+3","t":"il tuo massimo dei PF aumenta di 40."}]},{"n":"Ambra di Torre Azzurra","pag":"Il Corpo","rar":"+0 non comune · +1 raro · +2 molto raro · +3 leggendario","mal":false,"md":"Una goccia d\u0027ambra azzurra e fredda, che sa di inchiostro, con dentro un punto di luce che gira come una stella.\n- **+0:** ottieni uno slot incantesimo di 1° livello legato al talismano.\n- **+1:** ottieni uno slot di 3° livello.\n- **+2:** ottieni uno slot di 5° livello.\n- **+3:** ottieni uno slot di 7° livello.\n\nPuoi usare lo slot per lanciare un incantesimo che conosci o che hai preparato, e lo recuperi al termine di un riposo lungo.","opz":[{"l":"+0","t":"ottieni uno slot incantesimo di 1° livello legato al talismano."},{"l":"+1","t":"ottieni uno slot di 3° livello."},{"l":"+2","t":"ottieni uno slot di 5° livello."},{"l":"+3","t":"ottieni uno slot di 7° livello."}]},{"n":"Ambra di Torre Verde","pag":"Il Corpo","rar":"+0 non comune · +1 raro · +2 molto raro · +3 leggendario","mal":false,"md":"Una goccia d\u0027ambra verde con dentro un filo d\u0027erba fresca, che nella Notte è l\u0027unica erba verde che molti abbiano mai visto.\n- **+0:** la tua velocità aumenta di 1,5 m.\n- **+1:** la tua velocità aumenta di 3 m, e hai vantaggio ai tiri salvezza per evitare l\u0027Indebolimento.\n- **+2:** come il +1, ma la velocità aumenta di 4,5 m.\n- **+3:** come il +1, ma la velocità aumenta di 6 m.","opz":[{"l":"+0","t":"la tua velocità aumenta di 1,5 m."},{"l":"+1","t":"la tua velocità aumenta di 3 m, e hai vantaggio ai tiri salvezza per evitare l\u0027Indebolimento."},{"l":"+2","t":"come il +1, ma la velocità aumenta di 4,5 m."},{"l":"+3","t":"come il +1, ma la velocità aumenta di 6 m."}]},{"n":"Seme Rosso del Giardino","pag":"Il Corpo","rar":"+0 raro · +1 molto raro","mal":false,"md":"Un seme rosso scuro, grande come un\u0027unghia, che germoglia piano dentro una capsula di vetro. Viene dal Giardino delle Erbe dell\u0027Accademia, dove le piante crescono sotto il Raggio, e quando bevi una Fiasca le sue radici si muovono.\n- **+0:** ogni volta che bevi una Fiasca, recuperi 1d4 + 1 PF in più.\n- **+1:** ogni volta che bevi una Fiasca, tiri un dado in più del tuo Dado Vita (vedi [[Le Fiasche]]).","opz":[{"l":"+0","t":"ogni volta che bevi una Fiasca, recuperi 1d4 + 1 PF in più."},{"l":"+1","t":"ogni volta che bevi una Fiasca, tiri un dado in più del tuo Dado Vita (vedi [[Le Fiasche]])."}]},{"n":"Seme Azzurro del Giardino","pag":"Il Corpo","rar":"+0 raro · +1 molto raro (richiede la capacità di lanciare incantesimi con slot)","mal":false,"md":"Un seme azzurro, chiuso in un ditale d\u0027argento, che manda un piccolo lampo quando l\u0027Acqua di Torre ti scende in gola.\n- **+0:** quando bevi una Fiasca, puoi rinunciare ai PF e recuperare invece slot incantesimo spesi per un livello totale pari al tuo bonus di competenza, nessuno dei quali di livello superiore al 5°.\n- **+1:** come il +0, ma recuperi comunque metà dei PF che la Fiasca ti avrebbe dato.","opz":[{"l":"+0","t":"quando bevi una Fiasca, puoi rinunciare ai PF e recuperare invece slot incantesimo spesi per un livello totale pari al tuo bonus di competenza, nessuno dei quali di livello superiore al 5°."},{"l":"+1","t":"come il +0, ma recuperi comunque metà dei PF che la Fiasca ti avrebbe dato."}]},{"n":"Rugiada del Raggio","pag":"Il Corpo","rar":"raro","mal":false,"md":"Una lacrima di cristallo di torre piena d\u0027acqua che non evapora mai, sul cui vetro ogni tanto si forma una goccia che brilla.\n- Finché hai almeno 1 PF, recuperi 1d6 PF ogni 10 minuti.","opz":[]},{"n":"Rugiada di Luna","pag":"Il Corpo","rar":"raro (richiede la capacità di lanciare incantesimi con slot)","mal":false,"md":"Una lacrima di vetro opaco, come quella del Raggio, ma la goccia che vi si forma è d\u0027argento e fredda, e si riempie soltanto sotto Selenar.\n- Quando termini un riposo breve, recuperi uno slot incantesimo di 1° livello speso.","opz":[]},{"n":"Guscio del Lago Pallido","pag":"Il Corpo","rar":"non comune","mal":false,"md":"Il guscio di una delle tartarughe del Lago Pallido, piccolo come una noce, coperto da un muschio verde che non muore mai. Le tartarughe del lago vivono trecento anni, e non si ammalano.\n- Con un\u0027azione riduci di 1 il tuo livello di Indebolimento e poni fine su di te alla condizione Avvelenato, e non puoi farlo di nuovo finché non termini un riposo lungo.","opz":[]},{"n":"Guscio a Due Teste","pag":"Il Corpo","rar":"raro","mal":false,"md":"Il guscio di una tartaruga del Lago Pallido nata con due teste che spuntano dallo stesso collo, una che guarda avanti e l\u0027altra indietro.\n- Puoi usare l\u0027azione Scattare o Disimpegnarsi come azione bonus, e non puoi farlo di nuovo finché non termini un riposo breve.","opz":[]},{"n":"Il Basto di Ferro","pag":"Il Corpo","rar":"+0 non comune · +1 raro · +2 molto raro","mal":false,"md":"Un pezzo di basto da mulo, di ferro, con incisi i nomi di tutti i muli che l\u0027hanno portato, appartenuto alla carovana che costruì la Grande Muraglia, sasso dopo sasso.\n- **+0:** la tua capacità di carico aumenta di 30 kg, e se sei Piccolo puoi usare le armi pesanti senza svantaggio.\n- **+1:** la tua capacità di carico aumenta di 60 kg, puoi usare le armi pesanti senza svantaggio anche se sei Piccolo, e la tua velocità non si riduce quando indossi un\u0027armatura pesante, anche se non hai la Forza richiesta.\n- **+2:** come il +1, ma la capacità di carico aumenta di 90 kg, e tutte le armi che impugni contano come leggere per il combattimento con due armi.","opz":[{"l":"+0","t":"la tua capacità di carico aumenta di 30 kg, e se sei Piccolo puoi usare le armi pesanti senza svantaggio."},{"l":"+1","t":"la tua capacità di carico aumenta di 60 kg, puoi usare le armi pesanti senza svantaggio anche se sei Piccolo, e la tua velocità non si riduce quando indossi un\u0027armatura pesante, anche se non hai la Forza richiesta."},{"l":"+2","t":"come il +1, ma la capacità di carico aumenta di 90 kg, e tutte le armi che impugni contano come leggere per il combattimento con due armi."}]},{"n":"Favore della Torre","pag":"Il Corpo","rar":"+0 raro · +1 molto raro · +2 leggendario","mal":false,"md":"Un frammento levigato del cristallo bianco delle torri, con dentro un filo di luce dorata.\n- **+0:** il tuo massimo dei PF aumenta di 10, la tua velocità di 1,5 m e la tua capacità di carico di 15 kg.\n- **+1:** PF +15, velocità +1,5 m, carico +30 kg.\n- **+2:** PF +20, velocità +3 m, carico +45 kg.","opz":[{"l":"+0","t":"il tuo massimo dei PF aumenta di 10, la tua velocità di 1,5 m e la tua capacità di carico di 15 kg."},{"l":"+1","t":"PF +15, velocità +1,5 m, carico +30 kg."},{"l":"+2","t":"PF +20, velocità +3 m, carico +45 kg."}]},{"n":"Il Marchio di Harrow · La Ferita di Harrow","pag":"Il Corpo","rar":"Marchio molto raro · Ferita leggendaria","mal":false,"md":"Un pezzo di cuoio con inciso a fuoco il segno dei cacciatori di Harrow, tre graffi paralleli, che rende il corpo di chi lo porta più forte e la sua pelle più sottile. La Ferita è un pezzo di pelle umana con lo stesso segno.\n- **Marchio:** la tua Forza, la tua Destrezza e la tua Costituzione aumentano di 2, e sei vulnerabile ai danni contundenti, perforanti e taglienti.\n- **Ferita:** la tua Forza, la tua Destrezza e la tua Costituzione aumentano di 4, e sei vulnerabile a tutti i danni.","opz":[{"l":"Marchio","t":"la tua Forza, la tua Destrezza e la tua Costituzione aumentano di 2, e sei vulnerabile ai danni contundenti, perforanti e taglienti."},{"l":"Ferita","t":"la tua Forza, la tua Destrezza e la tua Costituzione aumentano di 4, e sei vulnerabile a tutti i danni."}]},{"n":"Il Voto di Iselde · La Rinuncia di Iselde","pag":"Il Corpo","rar":"Voto molto raro · Rinuncia leggendaria","mal":false,"md":"Un sole d\u0027oro a sette raggi, il simbolo dei Sette, graffiato come se qualcuno avesse provato a cancellarlo con le unghie. La Rinuncia è lo stesso sole, spezzato a metà.\n- **Voto:** la tua Intelligenza, la tua Saggezza e il tuo Carisma aumentano di 2, e sei vulnerabile ai danni contundenti, perforanti e taglienti.\n- **Rinuncia:** la tua Intelligenza, la tua Saggezza e il tuo Carisma aumentano di 4, e sei vulnerabile a tutti i danni.","opz":[{"l":"Voto","t":"la tua Intelligenza, la tua Saggezza e il tuo Carisma aumentano di 2, e sei vulnerabile ai danni contundenti, perforanti e taglienti."},{"l":"Rinuncia","t":"la tua Intelligenza, la tua Saggezza e il tuo Carisma aumentano di 4, e sei vulnerabile a tutti i danni."}]},{"n":"I Cimeli","pag":"Il Corpo","rar":"molto raro (il Cimelio del Fuori è leggendario)","mal":false,"md":"Oggetti appartenuti a qualcuno di cui il mondo si ricorda ancora, che aumentano ciascuno di 2 una caratteristica.\n\n| Cimelio | Com\u0027è | Caratteristica |\n|---|---|---|\n| **Cimelio dei Trecento** | Una fibbia di cintura della cavalleria del Monarca, con un cavallo inciso. | Forza +2 |\n| **Cimelio del Protesista** | Un dito d\u0027ottone articolato, staccato da una mano finta, che si muove ancora. | Destrezza +2 |\n| **Cimelio dell\u0027Osservatorio** | Una lente d\u0027ottone rotta, che mostra una stella anche quando non ce n\u0027è. | Intelligenza +2 |\n| **Cimelio del Testimone** | Una piccola palpebra di vetro che non si chiude mai. | Saggezza +2 |\n| **Cimelio del Monarca** | Un anello d\u0027oro di Carcosa, con lo stemma raschiato via. | Carisma +2 |\n| **Cimelio del Fuori** | Una scheggia bianca, liscia e calda, che non appartiene a niente di questo mondo. | +2 a una caratteristica a scelta, quando lo attivi. **Il prezzo:** al termine di ogni riposo lungo passato senza fuoco vivo devi superare un tiro salvezza su Saggezza con CD 13, altrimenti ottieni un livello di Indebolimento, perché nel sonno qualcosa da fuori ti guarda. |","opz":[{"l":"Cimelio dei Trecento","t":"Com\u0027è: Una fibbia di cintura della cavalleria del Monarca, con un cavallo inciso. · Caratteristica: Forza +2"},{"l":"Cimelio del Protesista","t":"Com\u0027è: Un dito d\u0027ottone articolato, staccato da una mano finta, che si muove ancora. · Caratteristica: Destrezza +2"},{"l":"Cimelio dell\u0027Osservatorio","t":"Com\u0027è: Una lente d\u0027ottone rotta, che mostra una stella anche quando non ce n\u0027è. · Caratteristica: Intelligenza +2"},{"l":"Cimelio del Testimone","t":"Com\u0027è: Una piccola palpebra di vetro che non si chiude mai. · Caratteristica: Saggezza +2"},{"l":"Cimelio del Monarca","t":"Com\u0027è: Un anello d\u0027oro di Carcosa, con lo stemma raschiato via. · Caratteristica: Carisma +2"},{"l":"Cimelio del Fuori","t":"Com\u0027è: Una scheggia bianca, liscia e calda, che non appartiene a niente di questo mondo. · Caratteristica: +2 a una caratteristica a scelta, quando lo attivi. **Il prezzo:** al termine di ogni riposo lungo passato senza fuoco vivo devi superare un tiro salvezza su Saggezza con CD 13, altrimenti ottieni un livello di Indebolimento, perché nel sonno qualcosa da fuori ti guarda."}]},{"n":"Il Disco della Muraglia","pag":"Il Corpo","rar":"raro","mal":false,"md":"Un disco di bronzo verde di ossido, grande come un palmo, che pesa il triplo di quanto dovrebbe. Era il contrappeso del portone della Grande Muraglia.\n- Mentre indossi un\u0027armatura pesante, i danni contundenti, perforanti e taglienti che subisci sono ridotti di 2, e se trasporti più della metà della tua capacità di carico la riduzione sale a 4.","opz":[]},{"n":"La Corona di Latta","pag":"Il Corpo","rar":"raro","mal":false,"md":"Una piccola corona di latta, da bambino, a cui manca una gemma di vetro. La portava il figlio di un capitano di Corvalis, prima che il padre tornasse in mare.\n- Quando bevi una Fiasca, per 1 minuto non puoi cadere Prono, e hai vantaggio ai tiri salvezza su Forza e Costituzione per non essere spinto, tirato o atterrato.\n\n\n---","opz":[]},{"n":"Scaglia del Dorso · Scaglia del Petto del Padre","pag":"La Difesa","rar":"Dorso +0 non comune, +1 raro, +2 molto raro · Petto del Padre leggendaria","mal":false,"md":"Una scaglia del dorso, color bronzo e dura come la pietra, montata su una catenella. Le scaglie del dorso proteggono dalle armi, perché il dorso era quello che la Guardia di Bronzo di Marathen offriva al nemico. La Scaglia del Petto del Padre è grande come uno scudo, e viene da Murozond in persona.\n- **Dorso +0** (muta di un Bronzeo): i danni contundenti, perforanti e taglienti che subisci sono ridotti di 1.\n- **Dorso +1** (muta di un Patriarca bronzeo): sono ridotti di 2.\n- **Dorso +2** (muta di un drago di bronzo giovane o adulto): sono ridotti di 3.\n- **Petto del Padre:** sono ridotti di 5.","opz":[{"l":"Dorso +0","t":"i danni contundenti, perforanti e taglienti che subisci sono ridotti di 1."},{"l":"Dorso +1","t":"sono ridotti di 2."},{"l":"Dorso +2","t":"sono ridotti di 3."},{"l":"Petto del Padre","t":"sono ridotti di 5."}]},{"n":"Le Scaglie delle Cinque Casate","pag":"La Difesa","rar":"+0 non comune · +1 raro · +2 molto raro · +3 leggendario","mal":false,"md":"Ognuna delle cinque Casate dei Bronzei ha ereditato dal padre un respiro diverso, e le sue scaglie proteggono da quel respiro. Il grado dice da chi viene la scaglia: **+0** dalla muta di un Bronzeo, **+1** da quella di un Patriarca, **+2** da quella di un drago di bronzo giovane o adulto della stessa Casata, **+3** da quella di un drago di bronzo antico.\n\n| Scaglia | Com\u0027è | Danni ridotti | +0 | +1 | +2 | +3 |\n|---|---|---|---|---|---|---|\n| **Scaglia dell\u0027Arcano** | bronzo con riflessi azzurri, fredda, che ronza | da forza | 2 | 3 | 4 | 5 |\n| **Scaglia della Fiamma** | bronzo e rosso, sempre tiepida | da fuoco | 2 | 3 | 4 | 5 |\n| **Scaglia del Fulmine** | bronzo e giallo, che fa drizzare i capelli | da fulmine | 2 | 3 | 4 | 5 |\n| **Scaglia della Luce** | bronzo chiaro, con una luce dentro | radianti | 2 | 3 | 4 | 5 |\n| **Scaglia della Perla** | bronzo lattiginoso, liscio come un\u0027unghia | da acido, freddo, necrotici, da tuono e psichici | 1 | 2 | 3 | 4 |","opz":[{"l":"Scaglia dell\u0027Arcano","t":"Com\u0027è: bronzo con riflessi azzurri, fredda, che ronza · Danni ridotti: da forza · +0: 2 · +1: 3 · +2: 4 · +3: 5"},{"l":"Scaglia della Fiamma","t":"Com\u0027è: bronzo e rosso, sempre tiepida · Danni ridotti: da fuoco · +0: 2 · +1: 3 · +2: 4 · +3: 5"},{"l":"Scaglia del Fulmine","t":"Com\u0027è: bronzo e giallo, che fa drizzare i capelli · Danni ridotti: da fulmine · +0: 2 · +1: 3 · +2: 4 · +3: 5"},{"l":"Scaglia della Luce","t":"Com\u0027è: bronzo chiaro, con una luce dentro · Danni ridotti: radianti · +0: 2 · +1: 3 · +2: 4 · +3: 5"},{"l":"Scaglia della Perla","t":"Com\u0027è: bronzo lattiginoso, liscio come un\u0027unghia · Danni ridotti: da acido, freddo, necrotici, da tuono e psichici · +0: 1 · +1: 2 · +2: 3 · +3: 4"}]},{"n":"Scaglia di Cenere","pag":"La Difesa","rar":"+0 raro · +1 molto raro · +2 leggendario","mal":false,"md":"Una scaglia grigia e sottile, che resta tiepida anche al freddo e puzza appena di fumo, e che viene dalla muta di un Cinereo o di un drago di cenere. Chi la porta si sente forte, e affamato.\n- **+0:** i danni necrotici, e quelli di qualunque tipo inflitti dai non morti, sono ridotti di 3.\n- **+1:** sono ridotti di 5.\n- **+2** (muta di un drago di cenere antico): sono ridotti di 7, e hai resistenza ai danni necrotici.\n- **Il prezzo:** durante ogni riposo lungo devi mangiare il doppio delle razioni, e se non lo fai devi superare un tiro salvezza su Costituzione con CD 13, altrimenti ottieni un livello di Indebolimento, perché la fame del padre ti entra nel sangue.","opz":[{"l":"+0","t":"i danni necrotici, e quelli di qualunque tipo inflitti dai non morti, sono ridotti di 3."},{"l":"+1","t":"sono ridotti di 5."},{"l":"+2","t":"sono ridotti di 7, e hai resistenza ai danni necrotici."}]},{"n":"Treccia di Maelis","pag":"La Difesa","rar":"molto raro","mal":false,"md":"Una treccia di capelli biondi, legata con un filo d\u0027oro, che non ingrigisce mai ed è calda. Erano i capelli della regina di Carcosa, tagliati da Malthor prima di seppellirla.\n- I danni radianti e necrotici che subisci sono ridotti di 4.","opz":[]},{"n":"Scudo di Madreperla","pag":"La Difesa","rar":"raro","mal":false,"md":"Un piccolo scudo di madreperla, grande come un\u0027unghia, con una luna incisa, che i pescatori di Lunedale regalano ai figli che partono.\n- Mentre impugni uno scudo, i danni che subisci e che non sono contundenti, perforanti o taglienti sono ridotti di 3.","opz":[]},{"n":"I Tre Corni","pag":"La Difesa","rar":"+0 non comune · +1 raro · +2 molto raro","mal":false,"md":"Corni di animali, intagliati e appesi a un laccio di cuoio, ognuno dei quali viene da un animale che sa resistere a un male.\n\n| Corno | Com\u0027è | Contro cosa | +0 | +1 | +2 |\n|---|---|---|---|---|---|\n| **Corno della Capra di Vorthas** | un corno nero con le punte d\u0027argento, perché le capre del convento mangiano erbe velenose da secoli | tiri salvezza contro la condizione Avvelenato e contro le malattie | +3 | +5 | +7 |\n| **Corno del Bue della Muraglia** | un corno spesso, con un anello di ferro, dei buoi che trascinarono nella neve i sassi della Muraglia | tiri salvezza contro il freddo e per evitare l\u0027Indebolimento; inoltre hai resistenza ai danni perforanti dei colpi critici con il +0, e immunità con il +1 e il +2 | +3 | +5 | +7 |\n| **Corno del Cervo Bianco** | un corno bianco e liscio, dei cervi che seguono Vaelharn e non hanno paura di niente | tiri salvezza contro le condizioni Affascinato e Spaventato e contro il sonno magico | +3 | +5 | +7 |","opz":[{"l":"Corno della Capra di Vorthas","t":"Com\u0027è: un corno nero con le punte d\u0027argento, perché le capre del convento mangiano erbe velenose da secoli · Contro cosa: tiri salvezza contro la condizione Avvelenato e contro le malattie · +0: +3 · +1: +5 · +2: +7"},{"l":"Corno del Bue della Muraglia","t":"Com\u0027è: un corno spesso, con un anello di ferro, dei buoi che trascinarono nella neve i sassi della Muraglia · Contro cosa: tiri salvezza contro il freddo e per evitare l\u0027Indebolimento; inoltre hai resistenza ai danni perforanti dei colpi critici con il +0, e immunità con il +1 e il +2 · +0: +3 · +1: +5 · +2: +7"},{"l":"Corno del Cervo Bianco","t":"Com\u0027è: un corno bianco e liscio, dei cervi che seguono Vaelharn e non hanno paura di niente · Contro cosa: tiri salvezza contro le condizioni Affascinato e Spaventato e contro il sonno magico · +0: +3 · +1: +5 · +2: +7"}]},{"n":"Collana dei Tre Corni","pag":"La Difesa","rar":"+0 non comune · +1 raro · +2 molto raro","mal":false,"md":"Una collana con tre piccole punte di corno, nero, grigio e bianco, infilate su un capello.\n- Ottieni un bonus a tutti i tiri salvezza dei Tre Corni: +1 con il +0, +3 con il +1 e +5 con il +2.","opz":[]},{"n":"Pustola del Cairn · Cisti del Cairn","pag":"La Difesa","rar":"Pustola non comune · Cisti rara","mal":false,"md":"Un rigonfiamento di carne grigia e secca, chiuso in un reliquiario di ferro, che viene dai morti del Cairn dei Senzanome che si sono rialzati e poi si sono rifiutati di morire di nuovo. La Cisti è più grande, e ogni tanto pulsa.\n- **Pustola:** ottieni +3 ai tiri salvezza contro la morte.\n- **Cisti:** ottieni +5 ai tiri salvezza contro la morte.","opz":[{"l":"Pustola","t":"ottieni +3 ai tiri salvezza contro la morte."},{"l":"Cisti","t":"ottieni +5 ai tiri salvezza contro la morte."}]},{"n":"Testa di Montone di Brennock","pag":"La Difesa","rar":"raro","mal":false,"md":"Una testa di montone di bronzo, pesante come un ferro di cavallo, il premio della lotta dei pastori di Brennock.\n- Ottieni +5 alle prove e ai tiri salvezza per resistere alle condizioni Stordito, Trattenuto, Prono e Afferrato.","opz":[]},{"n":"Sacchetto della Levatrice","pag":"La Difesa","rar":"non comune","mal":false,"md":"Un sacchetto di garza chiuso con lo spago, pieno di erbe amare, che le levatrici dell\u0027ospizio di Athredheim appendono al collo delle partorienti.\n- Quando fallisci un tiro salvezza e subisci una condizione, hai vantaggio ai tiri salvezza per porle fine, e per 1 minuto hai vantaggio ai tiri salvezza contro la stessa condizione.","opz":[]},{"n":"Piuma Blu di Sylvara","pag":"La Difesa","rar":"molto raro","mal":false,"md":"Una piuma blu, legata a una scheggia della lancia di Sylvara, che si piega senza spezzarsi.\n- Finché i tuoi PF sono sotto la metà del massimo, hai +2 alla CA.","opz":[]},{"n":"Scudo del Torneo","pag":"La Difesa","rar":"raro","mal":false,"md":"Un piccolo scudo d\u0027argento, il premio del torneo degli studenti dell\u0027Accademia, con il bordo intatto e il centro graffiato.\n- Finché i tuoi PF sono al massimo, hai +2 alla CA.","opz":[]},{"n":"Coda del Gatto Nero","pag":"La Difesa","rar":"raro","mal":false,"md":"Una statuetta d\u0027osso di un gatto seduto, con la coda arrotolata intorno alle zampe, che ritrae il gatto dei tetti del Quartiere Vecchio di Carcosa, quello che non è mai caduto.\n- Non subisci danni da caduta, a meno che il totale dei danni non sia pari o superiore ai tuoi PF attuali.\n\n\n---","opz":[]},{"n":"Corteccia del Bosco Sacro","pag":"La Difesa","rar":"raro","mal":false,"md":"_un pezzo di corteccia bianca che non brucia_\n\nI colpi critici in mischia contro di te diventano colpi normali.","opz":[]},{"n":"Nodo del Bosco Sacro","pag":"La Difesa","rar":"raro","mal":false,"md":"_un nodo di legno duro come il ferro_\n\nI colpi critici a distanza contro di te diventano colpi normali.","opz":[]},{"n":"Foglia del Bosco Sacro","pag":"La Difesa","rar":"molto raro","mal":false,"md":"_una foglia verde e viva, che non appassisce_\n\nLa tua CA aumenta di 3 e hai +5 ai tiri salvezza su Destrezza, ma i danni che subisci dagli attacchi e dai tiri salvezza su Destrezza falliti raddoppiano.","opz":[]},{"n":"Foglia Secca del Bosco Sacro","pag":"La Difesa","rar":"raro","mal":false,"md":"_la stessa foglia, morta, leggera come il fumo_\n\nPuoi usare l\u0027azione Disimpegnarsi come azione bonus, ma ogni attacco che ti colpisce ti infligge 2 danni in più.","opz":[]},{"n":"Seme del Bosco Sacro","pag":"La Difesa","rar":"leggendario","mal":false,"md":"_un seme nero, grande come un pugno, che pulsa_\n\nHai gli effetti della Corteccia e del Nodo, la tua CA aumenta di 2 e puoi Disimpegnarti come azione bonus, ma ogni volta che subisci danni ne subisci 1d8 in più.","opz":[]},{"n":"La Firma del Coltellaccio","pag":"Le Armi","rar":"raro","mal":false,"md":"Una lama di pugnale spezzata, senza elsa, legata a un laccio. Il Coltellaccio, l\u0027assassino del Quartiere Vecchio di Carcosa, ne lascia una sul petto di ogni vittima.\n- Quando metti a segno un colpo critico con un attacco in mischia, tiri un dado di danno dell\u0027arma in più, o due se l\u0027arma è un pugnale.","opz":[]},{"n":"Il Rovescio di Ser Galmond","pag":"Le Armi","rar":"molto raro","mal":false,"md":"Un piccolo scudo tondo, con una spada curva incisa che gli gira intorno. Ser Galmond insegnava che il colpo migliore è quello che l\u0027altro ti regala.\n- Mentre impugni uno scudo, quando una creatura ti manca con un attacco in mischia puoi usare la reazione per effettuare un attacco in mischia con un\u0027arma contro di lei.","opz":[]},{"n":"Il Perno del Giocoliere","pag":"Le Armi","rar":"raro","mal":false,"md":"Due lame minuscole, unite per l\u0027elsa, che girano su un perno d\u0027ottone. Erano del giocoliere del Teatro del Re Giallo, quello che non sbagliava mai.\n- Quando effettui un attacco in mischia con un\u0027arma come azione bonus, l\u0027attacco infligge 2d4 danni in più.","opz":[]},{"n":"L\u0027Ascia di Quillon","pag":"Le Armi","rar":"raro","mal":false,"md":"Una piccola testa d\u0027ascia da boscaiolo, con il filo intaccato dalla corteccia nera del Bosco dei Corvi.\n- Quando effettui il primo attacco in mischia con un\u0027arma nel tuo turno, puoi caricarlo, e l\u0027attacco infligge 2d6 danni in più. Se lo fai, in quel turno non puoi effettuare altri attacchi, qualunque capacità o oggetto tu abbia.","opz":[]},{"n":"L\u0027Incudine del Debitore","pag":"Le Armi","rar":"non comune","mal":false,"md":"Una testa di martello da fabbro, nera, ammaccata da mille colpi, appartenuta a un fabbro che si giocò la bottega a dadi con il signore del guado.\n- Hai +2 ai tiri per colpire contro le creature che impugnano uno scudo.","opz":[]},{"n":"La Banderuola della Sentinella","pag":"Le Armi","rar":"raro","mal":false,"md":"Una punta di lancia arrugginita, con un nastro sbiadito, che gira sempre contro vento, e che stava in cima alla torre più a nord della Grande Muraglia.\n- Quando usi la reazione per effettuare un attacco con un\u0027arma da mischia che infligge danni perforanti, l\u0027attacco infligge 1d10 danni in più.","opz":[]},{"n":"Il Nastro Rosso dei Trecento","pag":"Le Armi","rar":"molto raro","mal":false,"md":"Un nastro rosso da lancia di cavaliere, dal colore ancora vivo dopo secoli, che i cavalieri del Monarca legavano alla lancia prima di caricare.\n- Mentre sei in sella, i tuoi attacchi in mischia con un\u0027arma infliggono 1d6 danni in più.","opz":[]},{"n":"L\u0027Unghia d\u0027Orso","pag":"Le Armi","rar":"raro","mal":false,"md":"Un artiglio d\u0027orso ricurvo, montato in argento, che i cacciatori di Harrow danno a chi ha ucciso il suo primo orso.\n- Se nel tuo turno, prima di un attacco in mischia con un\u0027arma, fai un salto in alto di almeno 1 m, quell\u0027attacco infligge 1d4 danni in più, o 2d4 se è un colpo senz\u0027armi.","opz":[]},{"n":"La Borchia di Kaelmont","pag":"Le Armi","rar":"raro","mal":false,"md":"Una borchia di ferro grande come un pugno, staccata dagli scudi dei soldati che facevano la guardia al porto di Carcosa ai tempi di Idris Kaelmont.\n- Mentre impugni uno scudo, la tua CA aumenta di 1.","opz":[]},{"n":"L\u0027Elsa dello Schiavista","pag":"Le Armi","rar":"raro","mal":false,"md":"Un\u0027elsa lunga, senza lama, consumata dove si tenevano le mani in due incavi, uno sopra l\u0027altro. Era di uno schiavista delle Rovine del Nord, che con lo spadone contava le teste.\n- Quando colpisci con un\u0027arma a due mani, o con un\u0027arma versatile impugnata a due mani, l\u0027attacco infligge 1d6 danni in più.","opz":[]},{"n":"Il Martelletto dell\u0027Orafo","pag":"Le Armi","rar":"non comune","mal":false,"md":"Un piccolo martello d\u0027orafo con il manico d\u0027osso, che il fabbro di Dalewick usa per bilanciare i coltelli da lancio.\n- Gli attacchi con le armi da lancio infliggono 1d4 danni in più, e la loro gittata normale e lunga aumenta di 3 m.","opz":[]},{"n":"I Rami Incrociati di Malgrave","pag":"Le Armi","rar":"raro","mal":false,"md":"Due rametti di noce incrociati e legati con un filo rosso, che i figli di Bertil Malgrave appendevano sulla porta contro i Covoni. Uno ha le punte affilate, l\u0027altro i nodi.\n- **Le Punte:** se ti muovi di almeno 6 m in linea retta verso un bersaglio subito prima di colpirlo con un attacco in mischia, l\u0027attacco infligge 1d8 danni in più.\n- **I Nodi:** se nel tuo turno precedente hai usato l\u0027azione Disimpegnarsi o Schivare, il primo attacco che va a segno in questo turno infligge 1d8 danni in più.","opz":[]},{"n":"Il Sasso di Corvalis","pag":"Le Armi","rar":"non comune","mal":false,"md":"Un sasso spaccato in due, tenuto insieme da un anello di bronzo, con cui i bambini di Corvalis giocano a chi spinge più lontano.\n- Quando usi un colpo senz\u0027armi per spingere una creatura, la spingi di 3 m invece che di 1,5 m, e la creatura subisce 1d6 danni contundenti.","opz":[]},{"n":"Il Cammeo delle Due Lune","pag":"Le Armi","rar":"molto raro","mal":false,"md":"Un cammeo d\u0027avorio con due lune scolpite, una bianca e una gialla, che a Carcosa considerano un portasfortuna, perché chi lo porta impara a restare fermo, e ad aspettare.\n- Se dall\u0027inizio del tuo turno precedente non ti sei mosso, il primo attacco che va a segno in questo turno infligge 2d6 danni in più.","opz":[]},{"n":"Le Punte del Falco","pag":"Le Armi","rar":"la Punta Nera molto rara · la Punta d\u0027Argento non comune · la Penna del Falco Bianco leggendaria","mal":false,"md":"Punte di freccia montate su un anello. La Punta Nera è di ferro brunito, la Punta d\u0027Argento era di un arciere di Harnholt, e la Penna del Falco Bianco è una penna dei falchi di Vaelharn, con una punta di ghiaccio che non si scioglie.\n- **Punta Nera:** gli attacchi con armi che usano frecce o quadrelli infliggono 1d8 danni in più.\n- **Punta d\u0027Argento:** la gittata normale e lunga degli archi e delle balestre che usi aumenta di 9 m.\n- **Penna del Falco Bianco:** la gittata normale e lunga degli archi e delle balestre che usi aumenta della metà, e gli attacchi con frecce o quadrelli infliggono 1d8 danni in più.","opz":[{"l":"Punta Nera","t":"gli attacchi con armi che usano frecce o quadrelli infliggono 1d8 danni in più."},{"l":"Punta d\u0027Argento","t":"la gittata normale e lunga degli archi e delle balestre che usi aumenta di 9 m."},{"l":"Penna del Falco Bianco","t":"la gittata normale e lunga degli archi e delle balestre che usi aumenta della metà, e gli attacchi con frecce o quadrelli infliggono 1d8 danni in più."}]},{"n":"La Lente del Cacciatore","pag":"Le Armi","rar":"raro","mal":false,"md":"Una lente d\u0027ambra con un filo nero teso in mezzo, come un mirino, appartenuta a un cacciatore di Corvalis che non volle mai sposarsi.\n- Se nel tuo turno non ti sei mosso, i tuoi attacchi con armi a distanza infliggono 1d6 danni in più e ignorano la mezza copertura.","opz":[]},{"n":"Lo Stemma di Ser Galmond","pag":"Le Armi","rar":"raro","mal":false,"md":"Lo stemma d\u0027argento lavorato a filigrana di Ser Galmond, maestro d\u0027armi di Harnholt, con una spada e una luna.\n- Quando lo attivi, scegli un tuo privilegio di classe che ha un numero limitato di usi, come _Azione Impetuosa_, _Ira_, _Incanalare Divinità_ o _Ispirazione Bardica_: quel privilegio ha un uso in più, che si recupera come gli altri.","opz":[]},{"n":"Il Coccio della Cavalcata · Il Grande Coccio","pag":"Le Armi","rar":"Coccio raro · Grande Coccio molto raro","mal":false,"md":"Un pezzo della grande giara di terracotta in cui i soldati della cavalleria del Monarca mettevano le ceneri dei compagni, con ancora pezzetti di ossa incrostati dentro.\n- **Coccio:** quando colpisci con un\u0027arma di cui conosci la **Maestria** e applichi la sua proprietà di Maestria, l\u0027attacco infligge 1d6 danni in più.\n- **Grande Coccio:** come il Coccio, ma l\u0027attacco infligge 2d6 danni in più.\n\n\n---","opz":[{"l":"Coccio","t":"quando colpisci con un\u0027arma di cui conosci la **Maestria** e applichi la sua proprietà di Maestria, l\u0027attacco infligge 1d6 danni in più."},{"l":"Grande Coccio","t":"come il Coccio, ma l\u0027attacco infligge 2d6 danni in più."}]},{"n":"La Tavoletta del Novizio · La Tavoletta dei Cento","pag":"Gli Incantesimi","rar":"Novizio raro · Cento molto raro","mal":false,"md":"Una tavoletta d\u0027ardesia con un incantesimo inciso nella lingua dei Sette, che gli studenti dell\u0027Accademia usano per esercitarsi. La Tavoletta dei Cento è grande come un libro, con cento incantesimi incisi uno sull\u0027altro da cento mani diverse.\n- **Novizio:** una volta per turno, quando infliggi danni a una creatura con un incantesimo della lista del **mago**, dello **stregone** o del **bardo**, infliggi 1d4 danni in più a un bersaglio dell\u0027incantesimo.\n- **Cento:** come il Novizio, ma i danni in più sono 1d8.","opz":[{"l":"Novizio","t":"una volta per turno, quando infliggi danni a una creatura con un incantesimo della lista del **mago**, dello **stregone** o del **bardo**, infliggi 1d4 danni in più a un bersaglio dell\u0027incantesimo."},{"l":"Cento","t":"come il Novizio, ma i danni in più sono 1d8."}]},{"n":"Il Santino · Il Santino dei Cento Volti","pag":"Gli Incantesimi","rar":"Santino raro · Cento Volti molto raro","mal":false,"md":"Un quadratino di tela dipinta con il volto di un santo di Aurel. Su quello dei Cento Volti i santi sono cento, uno accanto all\u0027altro, e guardano tutti chi lo porta.\n- **Santino:** una volta per turno, quando infliggi danni a una creatura con un incantesimo della lista del **chierico**, del **druido**, del **paladino**, del **ranger** o del **warlock**, infliggi 1d4 danni in più a un bersaglio dell\u0027incantesimo.\n- **Cento Volti:** come il Santino, ma i danni in più sono 1d8.","opz":[{"l":"Santino","t":"una volta per turno, quando infliggi danni a una creatura con un incantesimo della lista del **chierico**, del **druido**, del **paladino**, del **ranger** o del **warlock**, infliggi 1d4 danni in più a un bersaglio dell\u0027incantesimo."},{"l":"Cento Volti","t":"come il Santino, ma i danni in più sono 1d8."}]},{"n":"La Lama Vetrosa","pag":"Gli Incantesimi","rar":"molto raro","mal":false,"md":"Una lama di cristallo azzurro, sottile come un\u0027unghia, che taglia chi la tocca. È una scheggia della ventesima pietra delle Pietre Ritte, quella che c\u0027è solo quando non la si conta, e beve un po\u0027 di chi la porta.\n- Quando spendi uno slot incantesimo per lanciare un incantesimo, puoi spendere invece uno slot di un livello inferiore, fino a un minimo del 1°, e lanciarlo comunque al livello originale.\n- **Il prezzo:** il tuo massimo dei PF è dimezzato.","opz":[]},{"n":"La Luna di Selenar","pag":"Gli Incantesimi","rar":"leggendario (richiede la capacità di lanciare incantesimi)","mal":false,"md":"Una piccola luna d\u0027argento che ha sempre la stessa fase della luna in cielo, e che nelle notti delle Due Lune diventa due.\n- Il numero di incantesimi che puoi preparare, o conoscere, aumenta di 4. Li scegli quando attivi il talismano, e non puoi cambiarli, nemmeno se lo riattivi più avanti.\n- Se hai più classi con incantesimi, quando attivi il talismano scegli una classe, per sempre.\n- Gli incantesimi in più smettono di essere preparati se il talismano smette di essere attivo.","opz":[]},{"n":"L\u0027Anello di Ancora un Poco","pag":"Gli Incantesimi","rar":"leggendario","mal":false,"md":"Un anello di bronzo, troppo grande per un dito, con un\u0027iscrizione che dice _Ancora un poco_. Apparteneva a un Custode dell\u0027Accademia, morto da secoli, che chiedeva sempre un\u0027altra ora per finire il lavoro.\n- Quando lanci un incantesimo con una durata di 1 minuto o più, la durata aumenta della metà: un incantesimo di 1 ora dura 1 ora e mezza.","opz":[]},{"n":"L\u0027Icona del Sole a Sette Raggi","pag":"Gli Incantesimi","rar":"leggendario","mal":false,"md":"Un\u0027icona di legno dipinto con il sole dei Sette Sigilli, che ha sette raggi, uno dei quali è stato raschiato via.\n- Quando lanci un incantesimo con un\u0027azione bonus, nello stesso turno puoi lanciare un altro incantesimo con uno slot, anche di 1° livello o superiore.","opz":[]},{"n":"La Polvere dell\u0027Osservatorio","pag":"Gli Incantesimi","rar":"molto raro","mal":false,"md":"Un pizzico di polvere luminosa in un\u0027ampolla, raccolta dalla lente del telescopio grande del Vecchio Osservatorio, che da sempre è puntato dove stava il Sole. Chi la porta ha sempre un filo di luce negli occhi.\n- Una volta per turno puoi lanciare come azione bonus un trucchetto con un tempo di lancio di un\u0027azione.\n- **Il prezzo:** ogni volta che subisci danni, ne subisci 2 in più.","opz":[]},{"n":"La Pietra Calda del Ferrugo","pag":"Gli Incantesimi","rar":"raro","mal":false,"md":"Un pezzo di roccia nera e rossa, ancora calda, staccata dalla galleria dove dorme un drago di bronzo della Fiamma.\n- Quando un incantesimo che lanci infligge danni da fuoco in un\u0027area a terra, il terreno resta ardente fino all\u0027inizio del tuo turno successivo, e una creatura che ci entra o ci termina il turno subisce 1d6 danni da fuoco.","opz":[]},{"n":"Il Dente della Tempesta","pag":"Gli Incantesimi","rar":"raro","mal":false,"md":"Un dente enorme e giallo, con dentro un vento che fischia quando lo si avvicina all\u0027orecchio, che viene dalla bocca di un drago di bronzo del Fulmine.\n- Quando un incantesimo che lanci infligge danni da tuono o da fulmine, puoi spingere un bersaglio colpito di 1,5 m in più, o di 1,5 m se l\u0027incantesimo non spinge, e infliggi 1d4 danni in più a un bersaglio.","opz":[]},{"n":"Il Vetro Azzurro di Raven","pag":"Gli Incantesimi","rar":"molto raro (richiede la capacità di lanciare incantesimi con slot)","mal":false,"md":"Un pugnale minuscolo di vetro blu, che si scalda quando colpisce giusto. Raven dice di averlo fatto lui, ma non spiega con che cosa.\n- Quando metti a segno un colpo critico contro una creatura ostile, recuperi slot incantesimo spesi per un livello totale pari al tuo bonus di competenza.","opz":[]},{"n":"Il Velluto del Cervo Bianco","pag":"Gli Incantesimi","rar":"molto raro (richiede la capacità di lanciare incantesimi con slot)","mal":false,"md":"Un pezzo di velluto di corno, bianco, staccato dal cervo più grande di Vaelharn, che si muove quando qualcosa muore lì vicino.\n- Quando uccidi una creatura di GS 1 o superiore, recuperi slot incantesimo spesi per un livello totale di 3.\n\n\n---","opz":[]},{"n":"Piuma Rossa di Sylvara","pag":"Il Sangue","rar":"molto raro","mal":false,"md":"Una piuma rossa, sempre bagnata, legata a una scheggia della lancia di Sylvara: è la gemella della Piuma Blu.\n- Finché i tuoi PF sono sotto la metà del massimo, ogni volta che tiri i danni infliggi 1d4 danni in più.","opz":[]},{"n":"Spada del Torneo","pag":"Il Sangue","rar":"molto raro","mal":false,"md":"Una piccola spada d\u0027argento, lucida e mai usata, il secondo premio del torneo degli studenti dell\u0027Accademia.\n- Finché i tuoi PF sono al massimo, ogni volta che tiri i danni infliggi 1d4 danni in più.","opz":[]},{"n":"Il Vetro Rosso del Coltellaccio","pag":"Il Sangue","rar":"raro","mal":false,"md":"Un pugnale minuscolo di vetro rosso, che si scalda quando colpisce giusto, e che il Coltellaccio tiene nello stivale.\n- Quando metti a segno un colpo critico contro una creatura ostile, recuperi PF pari a un tiro del tuo Dado Vita più il tuo livello.","opz":[]},{"n":"L\u0027Insegna dell\u0027Ufficiale · L\u0027Insegna Ammuffita","pag":"Il Sangue","rar":"Insegna rara · Ammuffita molto rara","mal":false,"md":"L\u0027insegna di bronzo degli ufficiali della Grande Muraglia, una spada con le ali. Quella Ammuffita è verde, con un buco al centro come se l\u0027avesse mangiata un verme, e viene dallo Stagno delle Vedove.\n- **Insegna:** nel tuo turno, ogni tuo attacco infligge 1d6 danni in più per ogni attacco che hai già messo a segno in quel turno.\n- **Ammuffita:** come l\u0027Insegna, ma i danni in più sono 1d8 per ogni attacco già messo a segno.","opz":[{"l":"Insegna","t":"nel tuo turno, ogni tuo attacco infligge 1d6 danni in più per ogni attacco che hai già messo a segno in quel turno."},{"l":"Ammuffita","t":"come l\u0027Insegna, ma i danni in più sono 1d8 per ogni attacco già messo a segno."}]},{"n":"La Mano d\u0027Oro dell\u0027Attrice","pag":"Il Sangue","rar":"molto raro","mal":false,"md":"Una mano d\u0027oro di donna, dalle dita affusolate, che la prima attrice del Teatro del Re Giallo portava al posto di quella che aveva perso. È tiepida, e a volte si stringe da sola.\n- La tua Destrezza aumenta di 1, e nel tuo turno ogni tuo attacco infligge 1d4 danni in più per ogni attacco che hai già messo a segno in quel turno.","opz":[]},{"n":"La Pelle del Santo","pag":"Il Sangue","rar":"molto raro","mal":false,"md":"Una striscia di pelle sottile e bianca, che sembra seta, avvolta come una fascia da neonato: è la pelle di un santo di Aurel, conciata dai monaci del Monastero Muto.\n- Nel tuo turno, ogni attacco che metti a segno contro una creatura ostile ti fa recuperare 1d8 PF per ogni attacco che avevi già messo a segno in quel turno.","opz":[]},{"n":"Il Bozzolo del Lazzaretto · Il Dente dell\u0027Amante","pag":"Il Sangue","rar":"raro","mal":false,"md":"Il Bozzolo è un pezzo di carne secca avvolto nel filo, preso dalla culla di un neonato del Lazzaretto delle Vedove. Il Dente è un dente umano incastonato in un anello d\u0027oro, di quelli che gli Amanti della Casa di Velluto si scambiano.\n- **Bozzolo:** finché una creatura entro 9 m da te è Avvelenata o ha una malattia, ogni volta che tiri i danni infliggi 1d6 danni in più.\n- **Dente:** quando una creatura entro 9 m da te subisce danni perforanti, il prossimo danno che infliggi prima della fine del tuo turno successivo aumenta di 1d6.","opz":[{"l":"Bozzolo","t":"finché una creatura entro 9 m da te è Avvelenata o ha una malattia, ogni volta che tiri i danni infliggi 1d6 danni in più."},{"l":"Dente","t":"quando una creatura entro 9 m da te subisce danni perforanti, il prossimo danno che infliggi prima della fine del tuo turno successivo aumenta di 1d6."}]},{"n":"L\u0027Occhio Dilatato · Il Profumo che Addormenta","pag":"Il Sangue","rar":"raro","mal":false,"md":"L\u0027Occhio Dilatato è un occhio di vetro con la pupilla larga, preso da un viandante delle Pietre Ritte che non riconosce più nessuno. Il Profumo è una boccetta vuota che sa ancora di fiori e di sonno, che usavano gli schiavisti delle Rovine del Nord.\n- **Occhio Dilatato:** finché una creatura entro 9 m da te è Spaventata, i tuoi attacchi infliggono 1d6 danni psichici in più.\n- **Profumo:** finché una creatura entro 9 m da te è Priva di Sensi o addormentata, i tuoi attacchi infliggono 1d6 danni in più.","opz":[{"l":"Occhio Dilatato","t":"finché una creatura entro 9 m da te è Spaventata, i tuoi attacchi infliggono 1d6 danni psichici in più."},{"l":"Profumo","t":"finché una creatura entro 9 m da te è Priva di Sensi o addormentata, i tuoi attacchi infliggono 1d6 danni in più."}]},{"n":"La Misericordia · La Croce delle Tacche","pag":"Il Sangue","rar":"raro","mal":false,"md":"La Misericordia è un pugnale sottile per finire i feriti, che una Vegliatrice tiene sotto il cuscino dei morenti. La Croce delle Tacche è una croce di ferro con una tacca per ogni morto, che portava un Cavaliere Spettrale della Cavalcata.\n- **Misericordia:** dopo un tuo colpo critico, e fino alla fine del tuo turno successivo, i tuoi attacchi infliggono 2d6 danni in più.\n- **Croce delle Tacche:** quando porti a 0 PF una creatura ostile, fino alla fine del tuo turno successivo i tuoi attacchi infliggono 1d6 danni in più.","opz":[{"l":"Misericordia","t":"dopo un tuo colpo critico, e fino alla fine del tuo turno successivo, i tuoi attacchi infliggono 2d6 danni in più."},{"l":"Croce delle Tacche","t":"quando porti a 0 PF una creatura ostile, fino alla fine del tuo turno successivo i tuoi attacchi infliggono 1d6 danni in più."}]},{"n":"Il Mazzo del Cane Fedele","pag":"Il Sangue","rar":"raro","mal":false,"md":"Un mazzetto di fiori secchi legato con un nastro nero, preso da una tomba del Cairn dei Senzanome su cui c\u0027è scritto _Il più fedele_. Chi lo porta sente ogni tanto un cane che abbaia, lontano.\n- Quando una creatura che hai evocato, il tuo famiglio o il tuo compagno animale scende a 0 PF, per 1 minuto i tuoi attacchi infliggono 1d8 danni in più.","opz":[]},{"n":"Il Cammeo del Macellaio","pag":"Il Sangue","rar":"molto raro","mal":false,"md":"Un cammeo di pietra nera con il profilo di un uomo che sorride, un sorriso che si allarga se lo si guarda a lungo. Lo porta il macellaio più vecchio del Mercato delle Mezze Luci.\n- Quando uccidi una creatura, recuperi PF pari a un tiro del tuo Dado Vita più il tuo bonus di competenza, ma non più del massimo dei PF della creatura uccisa.","opz":[]},{"n":"Il Re che Aspetta","pag":"Il Sangue","rar":"molto raro","mal":false,"md":"Un\u0027icona di legno con un re seduto che aspetta, la spada sulle ginocchia, nascosta dietro lo schienale del trono vuoto di Carcosa. Il re dipinto non ha volto.\n- Una volta nel tuo turno, quando tiri i danni contro una creatura, puoi rimandarli all\u0027inizio del tuo turno successivo, aumentandoli del tuo bonus di competenza. La creatura li subisce soltanto se è ancora entro la gittata o la portata dell\u0027attacco originale.","opz":[]},{"n":"Gli Scorpioni di Resina","pag":"Il Sangue","rar":"raro","mal":false,"md":"Scorpioni veri, seccati e chiusi in una goccia di resina, ognuno di un colore diverso, che pungono chi li porta.\n\n| Scorpione | Danni in più | Il prezzo |\n|---|---|---|\n| **Scorpione Azzurro** (delle zone spezzate) | 1d10 in più quando infliggi danni da forza | vulnerabilità ai danni da forza |\n| **Scorpione Rosso** (di Asheval) | 1d10 in più quando infliggi danni da fuoco | vulnerabilità ai danni da fuoco |\n| **Scorpione Giallo** (dei Denti di Morwen) | 1d10 in più quando infliggi danni da fulmine | vulnerabilità ai danni da fulmine |\n| **Scorpione Bianco** (di Solvoran) | 1d10 in più quando infliggi danni radianti | vulnerabilità ai danni radianti |","opz":[{"l":"Scorpione Azzurro","t":"Danni in più: 1d10 in più quando infliggi danni da forza · Il prezzo: vulnerabilità ai danni da forza"},{"l":"Scorpione Rosso","t":"Danni in più: 1d10 in più quando infliggi danni da fuoco · Il prezzo: vulnerabilità ai danni da fuoco"},{"l":"Scorpione Giallo","t":"Danni in più: 1d10 in più quando infliggi danni da fulmine · Il prezzo: vulnerabilità ai danni da fulmine"},{"l":"Scorpione Bianco","t":"Danni in più: 1d10 in più quando infliggi danni radianti · Il prezzo: vulnerabilità ai danni radianti"}]},{"n":"La Scarpetta della Ballerina","pag":"Il Sangue","rar":"molto raro","mal":false,"md":"Una scarpetta da ballo blu, consumata sulla punta, della ballerina della Casa di Velluto, l\u0027unica Amante che Velisande abbia lasciato andare.\n- Quando infliggi danni contundenti, perforanti o taglienti, infliggi danni in più a seconda di che cosa indossi e impugni:\n\n| Se… | Danni in più |\n|---|---|\n| non indossi armatura e non impugni armi | 1d8 |\n| non indossi armatura e impugni un\u0027arma a una mano | 1d6 |\n| non indossi armatura e impugni un\u0027arma a due mani, o due armi | 1d4 |\n| indossi un\u0027armatura leggera e impugni un\u0027arma a una mano | 1d4 |","opz":[]},{"n":"Il Ruggito del Padre","pag":"Il Sangue","rar":"molto raro","mal":false,"md":"Un dente cavo di drago di bronzo che, soffiato, fa il verso del drago, e che i Bronzei usano per chiamarsi da una costa all\u0027altra.\n- Quando usi un\u0027**Arma a Soffio** o lanci un incantesimo che colpisce un **cono** o una **linea**, l\u0027effetto infligge 1d6 danni in più.\n- Quando usi una capacità che rende Spaventate più creature insieme, la CD del tiro salvezza aumenta di 1.\n- Se sei un Figlio della Scaglia, la tua Arma a Soffio infligge invece 2d6 danni in più (vedi [[I Figli della Scaglia]]).","opz":[]},{"n":"La Fiaschetta del Lanciatore · La Boccetta dell\u0027Erborista","pag":"Il Sangue","rar":"non comune","mal":false,"md":"La Fiaschetta è una piccola borraccia di cuoio con un cordino, usata dai granatieri della Muraglia. La Boccetta è di cristallo, con il collo a spirale, ed era di un\u0027erborista dello Stagno delle Vedove.\n- **Fiaschetta:** quando infliggi danni con un oggetto lanciato, come un _fuoco dell\u0027alchimista_, una fiala d\u0027acido o una Fiasca gettata contro i non morti, aggiungi ai danni il tuo bonus di competenza.\n- **Boccetta:** quando infliggi danni con un veleno, un olio o una nube che hai preparato tu (vedi [[Erbario della Notte]]), aggiungi ai danni il tuo bonus di competenza.\n\n\n---","opz":[{"l":"Fiaschetta","t":"quando infliggi danni con un oggetto lanciato, come un _fuoco dell\u0027alchimista_, una fiala d\u0027acido o una Fiasca gettata contro i non morti, aggiungi ai danni il tuo bonus di competenza."},{"l":"Boccetta","t":"quando infliggi danni con un veleno, un olio o una nube che hai preparato tu (vedi [[Erbario della Notte]]), aggiungi ai danni il tuo bonus di competenza."}]},{"n":"Lo Scarabeo d\u0027Oro di Raven","pag":"Le Stranezze","rar":"non comune","mal":false,"md":"Uno scarabeo d\u0027oro, vivo, che dorme in una scatolina di latta. Raven li alleva nel retrobottega e li vende a chi cerca qualcosa, e quando c\u0027è qualcosa di prezioso vicino lo scarabeo si sveglia e gratta.\n- Senti la direzione dell\u0027oro, delle gemme e dei **Ricordi** che si trovano entro 36 m da te.","opz":[]},{"n":"Lo Scarabeo d\u0027Argento di Raven","pag":"Le Stranezze","rar":"non comune","mal":false,"md":"Uno scarabeo d\u0027argento, vivo e più piccolo, che si sveglia per la magia. Raven ne ha pochi, e non li vende, ma li presta.\n- Senti la direzione degli oggetti magici e dei **talismani** che si trovano entro 18 m da te.","opz":[]},{"n":"La Fiala Muta","pag":"Le Stranezze","rar":"non comune","mal":false,"md":"Una fiala di vetro scuro, piena di un liquido che non fa rumore nemmeno quando la si scuote: è l\u0027acqua del Monastero Muto, dove i monaci si sono cuciti la bocca.\n- Hai +3 alle prove di Destrezza (Furtività) per muoverti senza fare rumore.","opz":[]},{"n":"Il Velo della Dama","pag":"Le Stranezze","rar":"non comune","mal":false,"md":"Un velo grigio di seta di ragno, leggerissimo, che visto da lontano si confonde con l\u0027ombra. Era della dama della Selva Grigia.\n- Hai +3 alle prove di Destrezza (Furtività) per nasconderti dalle creature che si trovano a più di 18 m da te.","opz":[]},{"n":"Lo Specchio dell\u0027Attrice","pag":"Le Stranezze","rar":"non comune","mal":false,"md":"Uno specchietto da borsetta, con il vetro opaco, che viene dal camerino della prima attrice del Teatro del Re Giallo. Chi ci si guarda vede per un istante una faccia che non è la sua.\n- Hai vantaggio alle prove per far credere a qualcuno che tu sia un\u0027altra persona.","opz":[]},{"n":"Lo Specchio della Vecchia di Dalewick","pag":"Le Stranezze","rar":"non comune","mal":false,"md":"Uno specchietto di vetro grigio, appannato come se qualcuno ci avesse respirato sopra da dentro. Una vecchia di Dalewick ci si specchiava ogni volta che usciva, e gli Spenti non l\u0027hanno mai toccata.\n- Gli Spenti, gli annegati e gli altri non morti senza intelligenza (Intelligenza 4 o meno) ti scambiano per uno di loro, e non ti attaccano per primi finché non sei tu ad attaccare loro o qualcuno vicino a te. Hai vantaggio alle prove per convincere un non morto che sei come lui (vedi [[Lo Spento]]).","opz":[]},{"n":"Le Orbite del Fratello Cieco","pag":"Le Stranezze","rar":"non comune","mal":false,"md":"Due orbite vuote di ceramica unite da un filo, come un paio di occhiali senza vetri, appartenute a un Fratello Muto che si è cavato gli occhi per non guardare. Chi le porta sente sempre qualcuno che lo guarda con odio.\n- Le creature ostili che iniziano il turno entro 18 m da te devono superare un tiro salvezza su Saggezza con CD 15, altrimenti nel loro turno devono attaccare te, se possono.","opz":[]},{"n":"L\u0027Anello della Sposa","pag":"Le Stranezze","rar":"non comune, maledetto","mal":true,"md":"Un anello nuziale d\u0027oro di Y\u0027thalla, bellissimo, che pesa il doppio dell\u0027oro normale e sembra un talismano prezioso, ma non lo è.\n- Ogni volta che subisci danni, i danni raddoppiano.\n- **Maledizione.** Una volta attivato non lo puoi sostituire con un riposo breve, ma serve _rimuovi maledizione_, e finché è attivo sei convinto che ti protegga.\n\n\n---","opz":[]}],"oggetti":[{"n":"Le Armi del Sale","tipo":"arma (qualunque arma da mischia), comune","sint":false,"base":"qualunque arma da mischia","bonus":0,"md":"Armi forgiate con fedi e posate d\u0027argento fuse nel ferro e temprate nell\u0027acqua delle saline, con il sale nero che resta incrostato nelle venature della lama. Contano come armi argentate, e **non si anneriscono mai**: non guadagnano tacche (vedi _Le armi annerite_ in [[Armamenti]]).","pag":"Armamenti II · Comuni e Non Comuni"},{"n":"Le Lame dell\u0027Età del Sole","tipo":"arma (spada o pugnale), non comune, richiede sintonia","sint":true,"base":"spada o pugnale","bonus":0,"md":"Lame di bronzo chiaro con il filo d\u0027acciaio, battute prima della Notte con una scheggia di luce del Sole chiusa nell\u0027elsa. La lama dà luce intensa in un raggio di 3 m e luce fioca per altri 3 m, e si spegne soltanto se la rinfoderi. Quando ottieni un 20 naturale a un tiro per colpire con quest\u0027arma, puoi infliggere danni radianti o da fuoco, a tua scelta, invece del tipo di danni normale.","pag":"Armamenti II · Comuni e Non Comuni"},{"n":"Il Cuoio del Contrappeso","tipo":"armatura (cuoio, cuoio borchiato o pelle), non comune, richiede sintonia","sint":true,"base":"","bonus":0,"md":"Un cuoio scuro e pesante, conciato a lungo, con le cuciture fatte dall\u0027interno perché non si vedano. Quando una creatura o un incantesimo cerca di spingerti, di tirarti o di spostarti contro la tua volontà, sei tu a restare dove sei, ed è la creatura, o chi ha lanciato l\u0027incantesimo, a essere spostata della stessa distanza nella direzione opposta.","pag":"Armamenti II · Comuni e Non Comuni"},{"n":"Il Bastone del Branco","tipo":"arma (bastone ferrato), non comune, richiede sintonia","sint":true,"base":"bastone ferrato","bonus":1,"md":"Un bastone ferrato **+1**, fasciato di cuoio, con le unghie di un lupo appese a corde annodate sotto il pomo. Ha **3 cariche**. Con un\u0027azione puoi spenderne una per chiamare un lupo, con le statistiche del lupo del manuale dei mostri, che compare in uno spazio libero entro 9 m e resta per 1 ora, finché non scende a 0 PF o finché non lo congedi con un\u0027azione bonus. Agisce da solo, con la sua iniziativa, e obbedisce ai tuoi ordini, che costano un\u0027azione bonus, nel modo in cui un lupo li può capire, e non si allontana da te più di 9 m. Il bastone recupera 1d2 + 1 cariche alla prima campana. Se spendi l\u0027ultima, tira 1d20: con 1 il bastone si sbriciola.","pag":"Armamenti II · Comuni e Non Comuni"},{"n":"Le Armi della Vendemmia Rossa","tipo":"arma (qualunque), rara, richiede sintonia","sint":true,"base":"qualunque","bonus":0,"md":"Armi temprate nelle botti delle cantine di Sale Nero, nel sangue invece che nell\u0027acqua, con il ferro che resta rosso scuro anche al freddo. La loro **soglia** di annerimento è la metà di quella normale, arrotondata per difetto. Quando ottieni un 20 naturale a un tiro per colpire con quest\u0027arma, puoi subire 1d6 danni necrotici, che non possono essere ridotti in nessun modo, e aggiungere lo stesso numero ai danni del colpo, come danni necrotici che ignorano la resistenza.\n**Maledizione.** Una volta annerita, l\u0027arma non si pulisce con l\u0027acqua della vasca: serve _rimuovi maledizione_, o una magia simile.","pag":"Armamenti III · Rari"},{"n":"Il Bastone d\u0027Ossa e di Piume","tipo":"arma (bastone ferrato), rara, richiede sintonia con un druido, un mago, un monaco, uno stregone o un warlock","sint":true,"base":"bastone ferrato","bonus":0,"md":"Un bastone ferrato magico fatto di ossa di animali legate con budello, con piume di corvo e un teschio di gufo in cima. Ha **3 cariche**. Quando colpisci una creatura con il bastone puoi spendere una carica per infliggerle 2d8 danni necrotici in più, e recuperi tanti PF quanti sono i danni necrotici inflitti. Il bastone recupera 1d2 + 1 cariche a ogni luna nuova.","pag":"Armamenti III · Rari"},{"n":"Il Dente di Malthor","tipo":"arma (qualunque arma che infligge danni contundenti), rara, richiede sintonia","sint":true,"base":"qualunque arma che infligge danni contundenti","bonus":0,"md":"Una mazza, un martello o un randello con la testa fatta di un dente enorme, giallo e venato, cerchiato di ferro. Quando colpisci una creatura di taglia Media o inferiore, deve superare un tiro salvezza su Forza con CD 15 o cadere Prona. Con un 20 naturale contro una di quelle creature infliggi 1d6 danni contundenti in più.","pag":"Armamenti III · Rari"},{"n":"La Mazza delle Fasi","tipo":"arma (mazza), rara, richiede sintonia con chi ha giurato a Selenar","sint":true,"base":"mazza","bonus":0,"md":"Una mazza d\u0027argento con le otto fasi della luna incise in cerchio sulla testa, che si scalda quando la luna la illumina. **Non si annerisce mai.** Contro i non morti, le aberrazioni e gli immondi infligge 1d6 danni radianti in più.\nPossono sintonizzarsi un Giurato della Luna, un chierico o un druido di Selenar, e un warlock con il Patrono di Selenar.","pag":"Armamenti III · Rari"},{"n":"La Corazza dello Specchio Santo","tipo":"armatura (media o pesante), rara, richiede sintonia","sint":true,"base":"","bonus":0,"md":"Piastre lucidate a specchio, come le portavano i cavalieri-servi del tempio di Aurel perché riflettessero il Sole sulla Campana. Chi la indossa ha resistenza ai danni necrotici, e quando una creatura lo colpisce con un attacco che infligge danni necrotici subisce danni radianti pari alla metà dei danni necrotici inflitti.","pag":"Armamenti III · Rari"},{"n":"La Pelle delle Tredici Bestie","tipo":"armatura (cuoio, cuoio borchiato o pelle), rara, richiede sintonia","sint":true,"base":"","bonus":0,"md":"Un\u0027armatura conciata nel sangue di tredici bestie feroci, una per ogni luna dell\u0027anno e una in più. Quando assumi una forma diversa, come la Forma Selvatica di un druido o la forma ibrida di un Worgen, puoi fondere la pelle con la tua carne invece di toglierla: finché resti in quella forma ottieni un bonus alla CA di +1 se è di cuoio, +2 se è di cuoio borchiato e +3 se è di pelle.","pag":"Armamenti III · Rari"},{"n":"La Lama Senza Luna","tipo":"arma (qualunque spada), rara, richiede sintonia","sint":true,"base":"qualunque spada","bonus":2,"md":"Una spada con la lama intarsiata delle fasi della luna, che sotto la luna è un\u0027arma qualunque e dorme. Quando la luna non si vede, al chiuso, sottoterra, sotto le nuvole o nella fase di luna nuova, la lama si sveglia, dà luce fioca in un raggio di 3 m, diventa un\u0027arma **+2** e infligge 1d6 danni in più che ignorano resistenza e immunità. Il tipo di danni dipende dall\u0027ultima fase della luna che la lama ha visto: radianti con la luna piena, da forza con la crescente, psichici con la calante, necrotici con la nuova.\n**Maledizione.** Una volta in sintonia, non riesci a separartene: per ogni ora passata a più di 3 m dalla spada subisci 2d12 danni psichici. _Rimuovi maledizione_ toglie la maledizione e la sintonia insieme.","pag":"Armamenti III · Rari"},{"n":"La Zanna d\u0027Avorio","tipo":"arma (qualunque arma che infligge danni taglienti o perforanti), rara, richiede sintonia con un Worgen o con chi è maledetto dal lupo","sint":true,"base":"qualunque arma che infligge danni taglienti o perforanti","bonus":1,"md":"Una lama che sembra fatta tutta d\u0027avorio, battuta con un dente di Worgen nel ferro e temprata nell\u0027argento liquido. È un\
