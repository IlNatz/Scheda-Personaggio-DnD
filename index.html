<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icona-192.png"><link rel="apple-touch-icon" href="icona-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script>window.WEBAPP = true;</script><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Ultimo Raggio · Scheda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#15120e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Una scheda da tasca: testata con il nome, sei schede in basso, i numeri grandi dove si guardano durante lo scontro. */
:root {
  --carta: #efe6d2;
  --carta-2: #e6dbc3;
  --carta-3: #d9c9a8;
  --inchiostro: #2a231c;
  --tenue: #6b5d4c;
  --sangue: #8a2420;
  --oro: #87672a;
  --filetto: #c7b48c;
  --vivo: #4c6a38;
  --nero: #3b2f4a;
  --ombra: rgba(60, 40, 20, 0.18);
  --velo: rgba(30, 20, 10, 0.45);
  --f-titolo: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --f-epi: "IM Fell English", Georgia, serif;
  --f-testo: "EB Garamond", Garamond, "Palatino Linotype", Georgia, serif;
  --f-ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-et: "Alegreya Sans SC", "Alegreya Sans", system-ui, sans-serif;
  --nav: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #15120e; --carta-2: #1e1914; --carta-3: #2a2219; --inchiostro: #e8dcc5; --tenue: #a8977d;
    --sangue: #dc6553; --oro: #cfa75a; --filetto: #3d3226; --vivo: #93b574; --nero: #b9a6d6; --ombra: rgba(0, 0, 0, 0.5); --velo: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #15120e; --carta-2: #1e1914; --carta-3: #2a2219; --inchiostro: #e8dcc5; --tenue: #a8977d;
  --sangue: #dc6553; --oro: #cfa75a; --filetto: #3d3226; --vivo: #93b574; --nero: #b9a6d6; --ombra: rgba(0, 0, 0, 0.5); --velo: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--carta); color: var(--inchiostro);
  font-family: var(--f-testo); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--carta); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
.wrap { max-width: 46rem; margin: 0 auto; }
.num { font-variant-numeric: tabular-nums; }

/* testata */
.testata {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--carta); border-bottom: 1px solid var(--filetto);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
}
.testata .wrap { display: flex; align-items: center; gap: 10px; min-height: 46px; }
.testata .tit { flex: 1; min-width: 0; }
.occhiello { display: block; font-family: var(--f-et); font-size: 12.5px; letter-spacing: 0.08em; color: var(--tenue); line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.testata h1 { margin: 0; font-family: var(--f-titolo); font-weight: 400; font-size: 22px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ico { width: 42px; height: 42px; border: 1px solid var(--filetto); background: var(--carta-2); border-radius: 50%; display: grid; place-items: center; flex: none; }
.ico svg { width: 20px; height: 20px; }
.salva { font-family: var(--f-et); font-size: 12px; color: var(--tenue); letter-spacing: 0.04em; }
.salva.err { color: var(--sangue); }
main { padding-top: 12px; padding-bottom: calc(var(--nav) + 150px + env(safe-area-inset-bottom, 0px)); }

/* schede in basso */
.schede {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--carta-2); border-top: 1px solid var(--filetto);
  padding: 0 max(4px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(4px, env(safe-area-inset-left, 0px));
}
.schede .wrap { display: grid; grid-template-columns: repeat(6, 1fr); }
.schede button { border: 0; background: none; height: var(--nav); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; font-family: var(--f-et); font-size: 12px; letter-spacing: 0.03em; color: var(--tenue); }
.schede button svg { width: 22px; height: 22px; }
.schede button[aria-current="page"] { color: var(--sangue); }
.schede button[aria-current="page"]::after { content: ""; width: 24px; height: 2px; background: var(--sangue); margin-top: 1px; }

/* elementi comuni */
h2.sez { font-family: var(--f-titolo); font-weight: 400; color: var(--sangue); font-size: 22px; letter-spacing: 0.04em; margin: 26px 0 10px; padding-bottom: 3px; border-bottom: 1px solid var(--filetto); text-wrap: balance; display: flex; align-items: baseline; gap: 8px; }
h2.sez:first-child { margin-top: 2px; }
h2.sez .dx { margin-left: auto; font-family: var(--f-et); font-size: 13px; color: var(--tenue); letter-spacing: 0.05em; }
h3.sotto { font-family: var(--f-epi); font-style: italic; font-weight: 400; font-size: 19px; margin: 16px 0 6px; }
.nota { font-size: 15px; color: var(--tenue); font-style: italic; margin: 4px 0; }
.et { font-family: var(--f-et); font-size: 13px; letter-spacing: 0.07em; color: var(--tenue); }
.btn { border: 1px solid var(--filetto); background: var(--carta-2); border-radius: 4px; padding: 7px 13px; min-height: 40px; font-family: var(--f-et); font-size: 15px; letter-spacing: 0.04em; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.forte { background: var(--sangue); border-color: var(--sangue); color: var(--carta); }
.btn.oro { border-color: var(--oro); color: var(--oro); }
.btn.piccolo { min-height: 32px; padding: 3px 10px; font-size: 14px; }
.btn.tondo { width: 44px; padding: 0; font-size: 22px; font-family: var(--f-ui); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.riga { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.riga.fine { justify-content: flex-end; }
.campo { width: 100%; border: 1px solid var(--filetto); background: var(--carta); border-radius: 4px; padding: 8px 10px; min-height: 42px; }
.campo.corto { width: 76px; text-align: center; }
textarea.campo { min-height: 96px; resize: vertical; line-height: 1.45; }
.etichettato { display: grid; gap: 3px; min-width: 0; }
.griglia2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.vuoto { text-align: center; padding: 22px 10px; color: var(--tenue); border: 1px dashed var(--filetto); border-radius: 4px; font-style: italic; }
.blocco { border: 1px solid var(--filetto); background: var(--carta-2); border-radius: 6px; padding: 12px; }
.blocco + .blocco { margin-top: 10px; }
.avviso { border-left: 3px solid var(--sangue); background: var(--carta-2); padding: 8px 12px; margin: 10px 0; font-size: 15.5px; }
.avviso.oro { border-color: var(--oro); }
.interr { display: inline-flex; align-items: center; gap: 7px; font-family: var(--f-et); font-size: 14.5px; letter-spacing: 0.04em; cursor: pointer; }
.interr input { width: 19px; height: 19px; accent-color: var(--sangue); margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--filetto); background: var(--carta-2); border-radius: 999px; padding: 3px 11px; font-size: 14.5px; font-family: var(--f-ui); }
.chip.on { background: var(--sangue); color: var(--carta); border-color: var(--sangue); }
.chip.fx { border-color: var(--vivo); color: var(--vivo); background: none; }
.segmenti { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--filetto); border-radius: 6px; overflow: hidden; }
.segmenti button { border: 0; border-left: 1px solid var(--filetto); background: var(--carta-2); padding: 8px 4px; font-family: var(--f-et); font-size: 14px; letter-spacing: 0.03em; color: var(--tenue); min-width: 0; }
.segmenti button:first-child { border-left: 0; }
.segmenti button[aria-pressed="true"] { background: var(--sangue); color: var(--carta); }
details.apri { border-top: 1px solid var(--filetto); }
details.apri:last-child { border-bottom: 1px solid var(--filetto); }
details.apri > summary { list-style: none; cursor: pointer; padding: 10px 2px; display: flex; gap: 10px; align-items: baseline; }
details.apri > summary::-webkit-details-marker { display: none; }
details.apri > summary::before { content: "›"; color: var(--sangue); font-family: var(--f-ui); transition: transform 0.15s; display: inline-block; }
details.apri[open] > summary::before { transform: rotate(90deg); }
details.apri > summary .nome { flex: 1; min-width: 0; }
details.apri > summary .dx { font-family: var(--f-et); font-size: 13px; color: var(--tenue); white-space: nowrap; }
details.apri > .dentro { padding: 0 2px 12px 18px; }
.pip { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--sangue); background: none; padding: 0; flex: none; }
.pip.pieno { background: var(--sangue); }
.pip.oro { border-color: var(--oro); }
.pip.oro.pieno { background: var(--oro); }
.pip.vivo { border-color: var(--vivo); }
.pip.vivo.pieno { background: var(--vivo); }
.pips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* testi del manuale */
.md { overflow-wrap: break-word; font-size: 16.5px; }
.md p { margin: 0.5em 0; }
.md h3, .md h4 { font-family: var(--f-et); font-weight: 700; color: var(--sangue); font-size: 15.5px; letter-spacing: 0.05em; margin: 16px 0 4px; }
.md ul, .md ol { padding-left: 1.2em; margin: 0.4em 0; }
.md li::marker { color: var(--sangue); }
.md blockquote { margin: 10px 0; padding: 2px 12px; border-left: 3px solid var(--oro); background: var(--carta-2); }
.md table { border-collapse: collapse; font-size: 14.5px; margin: 8px 0; }
.md th, .md td { border-bottom: 1px solid var(--filetto); padding: 4px 6px; text-align: left; vertical-align: top; }
.md th { font-family: var(--f-et); letter-spacing: 0.04em; color: var(--tenue); font-weight: 500; }
.scorri { overflow-x: auto; max-width: 100%; }

/* identità */
.ident { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.classe-riga { display: grid; grid-template-columns: minmax(0, 1.4fr) 64px minmax(0, 1.6fr) 40px; gap: 6px; align-items: end; }
@media (max-width: 460px) { .classe-riga { grid-template-columns: minmax(0, 1fr) 64px 40px; } .classe-riga .sott { grid-column: 1 / -1; order: 5; } }

/* vitali */
.pf { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.pf .grande { font-family: var(--f-titolo); font-size: 46px; line-height: 1; }
.pf .grande small { font-size: 24px; color: var(--tenue); }
.pf .temp { font-family: var(--f-et); color: var(--oro); font-size: 14px; letter-spacing: 0.05em; }
.barra { height: 8px; border-radius: 4px; background: var(--carta-3); overflow: hidden; margin-top: 6px; }
.barra i { display: block; height: 100%; background: var(--sangue); }
.pfmossa { display: flex; gap: 6px; align-items: center; }
.pfmossa input { width: 70px; text-align: center; font-size: 20px; }
.tessere { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-top: 12px; }
.tessera { border: 1px solid var(--filetto); background: var(--carta); border-radius: 6px; padding: 7px 6px; text-align: center; min-width: 0; }
button.tessera { width: 100%; }
.tessera .v { font-family: var(--f-titolo); font-size: 27px; line-height: 1.1; }
.tessera .l { font-family: var(--f-et); font-size: 12.5px; letter-spacing: 0.06em; color: var(--tenue); display: block; }
.tessera.on { border-color: var(--oro); color: var(--oro); }

/* caratteristiche */
.caratt { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 640px) { .caratt { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.car { border: 1px solid var(--filetto); background: var(--carta-2); border-radius: 6px; padding: 6px; text-align: center; display: grid; gap: 4px; min-width: 0; }
.car .n { font-family: var(--f-et); font-size: 13px; letter-spacing: 0.08em; color: var(--tenue); }
.car .m { font-family: var(--f-titolo); font-size: 30px; line-height: 1; border: 0; background: none; padding: 2px 0; }
.car input { width: 100%; text-align: center; border: 1px solid var(--filetto); background: var(--carta); border-radius: 4px; padding: 3px; font-size: 16px; }
.car .up { color: var(--vivo); font-family: var(--f-et); font-size: 12px; }
.car .ts { display: flex; align-items: center; justify-content: center; gap: 5px; border: 0; background: none; font-family: var(--f-et); font-size: 13.5px; padding: 3px 0; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--sangue); background: none; padding: 0; flex: none; display: inline-block; }
.dot.si { background: var(--sangue); }
.dot.due { background: var(--oro); border-color: var(--oro); box-shadow: 0 0 0 2px var(--carta), 0 0 0 3px var(--oro); }
.abil { list-style: none; margin: 0; padding: 0; columns: 2 15rem; column-gap: 18px; }
.abil li { break-inside: avoid; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--filetto); min-height: 40px; }
.abil li button.dot { width: 18px; height: 18px; }
.abil .nome { flex: 1; min-width: 0; }
.abil .nome small { font-family: var(--f-et); color: var(--tenue); font-size: 12px; letter-spacing: 0.06em; margin-left: 4px; }
.abil .val { border: 0; background: none; font-family: var(--f-titolo); font-size: 20px; min-width: 48px; text-align: right; padding: 4px 2px; }

/* carte di armi, talismani, oggetti */
.carta { border: 1px solid var(--filetto); background: var(--carta-2); border-radius: 6px; padding: 10px 12px; }
.carta + .carta { margin-top: 10px; }
.carta.annerita { border-color: var(--nero); box-shadow: inset 4px 0 0 var(--nero); }
.carta.maledetto { box-shadow: inset 4px 0 0 var(--sangue); }
.carta .capo { display: flex; gap: 8px; align-items: baseline; }
.carta .capo .nome { flex: 1; min-width: 0; font-family: var(--f-epi); font-size: 20px; line-height: 1.2; }
.carta > .rar, .carta .capo .rar { font-family: var(--f-et); font-size: 13px; color: var(--tenue); letter-spacing: 0.04em; }
.colpi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.colpo { border: 1px solid var(--filetto); background: var(--carta); border-radius: 6px; padding: 6px; text-align: center; }
.colpo .v { font-family: var(--f-titolo); font-size: 25px; line-height: 1.1; display: block; }
.colpo .l { font-family: var(--f-et); font-size: 12.5px; color: var(--tenue); letter-spacing: 0.05em; }
.prop { font-size: 15px; color: var(--tenue); }
.prop b { color: var(--inchiostro); font-weight: 600; }
.privlista { list-style: none; margin: 0 0 8px; padding: 0; border-top: 1px solid var(--filetto); }
.privlista li { display: flex; gap: 10px; align-items: baseline; padding: 7px 2px; border-bottom: 1px solid var(--filetto); }
.privlista li span:first-child { flex: 1; min-width: 0; }
.privlista li.sott span:first-child { font-style: italic; color: var(--sangue); }
.privlista .dx { font-family: var(--f-et); font-size: 13px; color: var(--tenue); }
.slotvuoto { border: 1px dashed var(--filetto); border-radius: 6px; padding: 14px; text-align: center; }
.badge { font-family: var(--f-et); font-size: 12px; letter-spacing: 0.06em; border-radius: 3px; padding: 1px 7px; background: var(--nero); color: var(--carta); white-space: nowrap; }
.badge.sangue { background: var(--sangue); }
.badge.oro { background: var(--oro); }
.badge.vivo { background: var(--vivo); }
.oro-grande { font-family: var(--f-titolo); font-size: 44px; line-height: 1; color: var(--oro); }
.slot-riga { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--filetto); }
.slot-riga .lv { font-family: var(--f-titolo); font-size: 20px; width: 44px; }
.cd-riga { display: flex; flex-wrap: wrap; gap: 8px; }

/* foglio che sale dal basso */
#foglio { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
#foglio .velo { position: absolute; inset: 0; background: var(--velo); }
#foglio .pannello {
  position: relative; background: var(--carta); border-top: 2px solid var(--oro); border-radius: 12px 12px 0 0; max-height: 88%; display: flex; flex-direction: column;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
  box-shadow: 0 -6px 24px var(--ombra);
}
#foglio .pannello > header { display: flex; align-items: center; gap: 10px; padding: 12px 0 8px; border-bottom: 1px solid var(--filetto); max-width: 46rem; width: 100%; margin: 0 auto; }
#foglio .pannello > header h2 { flex: 1; margin: 0; font-family: var(--f-titolo); font-weight: 400; font-size: 22px; color: var(--sangue); min-width: 0; }
#foglio .corpo { overflow-y: auto; padding: 10px 0 18px; max-width: 46rem; width: 100%; margin: 0 auto; }
.lista { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--filetto); }
.lista li { border-bottom: 1px solid var(--filetto); }
.lista button { width: 100%; text-align: left; background: none; border: 0; padding: 10px 2px; display: flex; gap: 10px; align-items: baseline; }
.lista .nome { flex: 1; min-width: 0; font-size: 17.5px; }
.lista .dx { font-family: var(--f-et); font-size: 13px; color: var(--tenue); white-space: nowrap; }
.lista .sotto { display: block; font-size: 14px; color: var(--tenue); }
.lista .gruppo { font-family: var(--f-et); font-size: 13px; letter-spacing: 0.08em; color: var(--sangue); padding: 12px 2px 4px; }

/* tiro di dado */
#tiro {
  position: fixed; z-index: 7; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(var(--nav) + 10px + env(safe-area-inset-bottom, 0px));
  max-width: 30rem; margin: 0 auto; background: var(--carta); border: 1px solid var(--oro); border-radius: 10px; box-shadow: 0 6px 22px var(--ombra); padding: 10px 12px;
}
#tiro .alto { display: flex; align-items: center; gap: 12px; }
#tiro .tot { font-family: var(--f-titolo); font-size: 40px; line-height: 1; min-width: 56px; text-align: center; }
#tiro .tot.venti { color: var(--oro); }
#tiro .tot.uno { color: var(--sangue); }
#tiro .cosa { flex: 1; min-width: 0; }
#tiro .cosa b { font-family: var(--f-et); letter-spacing: 0.05em; font-weight: 500; display: block; }
#tiro .cosa span { font-size: 14px; color: var(--tenue); font-family: var(--f-ui); }
#tiro .riga { margin-top: 8px; }
#tiro .msg { margin-top: 6px; font-size: 15px; color: var(--sangue); }
@media (prefers-reduced-motion: no-preference) { #tiro:not([hidden]) { animation: sale 0.18s ease-out; } @keyframes sale { from { transform: translateY(12px); opacity: 0; } } }
</style>

<header class="testata">
  <div class="wrap">
    <div class="tit">
      <span class="occhiello" id="t-sotto">Ultimo Raggio · scheda del personaggio</span>
      <h1 id="t-nome">Scheda</h1>
    </div>

<script>
/* Un lettore markdown piccolo, quanto basta per le pagine del vault, per la versione che funziona senza rete. */
(function () {
  const escH = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  function inline(t) {
    const tenuti = [];
    t = t.replace(/<a\b[^>]*>[\s\S]*?<\/a>|<img\b[^>]*>/g, m => { tenuti.push(m); return "\u0000" + (tenuti.length - 1) + "\u0000"; });
    t = escH(t);
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*\*([^*]+?)\*\*\*/g, "<strong><em>$1</em></strong>");
    t = t.replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
    t = t.replace(/(^|[^\w])_([^_\s][^_]*?)_(?![\w])/g, "$1<em>$2</em>");
    return t.replace(/\u0000(\d+)\u0000/g, (m, i) => tenuti[+i]);
  }
  const RE_LISTA = /^(\s*)([-*+]|\d+\.)\s+(.*)$/;
  const inizioBlocco = (l, n) => /^#{1,6}\s/.test(l) || /^>/.test(l) || RE_LISTA.test(l) || /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l) || (/^\|/.test(l) && n !== undefined && /^\|?\s*:?-{2,}/.test(n));
  function celle(r) { let y = r.trim(); if (y.startsWith("|")) y = y.slice(1); if (y.endsWith("|")) y = y.slice(0, -1); return y.split("|").map(c => c.trim()); }
  function lista(L, i, base) {
    const voci = []; let tag = null, sciolta = false;
    while (i < L.length) {
      if (L[i].trim() === "") {
        let j = i; while (j < L.length && L[j].trim() === "") j++;
        const m = j < L.length && L[j].match(RE_LISTA);
        if (m && m[1].length >= base && voci.length) { sciolta = true; i = j; continue; }
        break;
      }
      const m = L[i].match(RE_LISTA);
      if (!m) {
        if (voci.length && !inizioBlocco(L[i], L[i + 1])) { voci[voci.length - 1].righe.push(L[i].trim()); i++; continue; }
        break;
      }
      const ind = m[1].length;
      if (ind < base) break;
      if (ind > base) { const r = lista(L, i, ind); if (voci.length) voci[voci.length - 1].sotto += r.h; i = r.i; continue; }
      if (!tag) tag = /\d/.test(m[2]) ? "ol" : "ul";
      voci.push({ righe: [m[3]], sotto: "" }); i++;
    }
    if (!tag) return { h: "", i };
    const h = `<${tag}>` + voci.map(v => { const t = v.righe.map(inline).join("<br>\n"); return `<li>${sciolta ? `<p>${t}</p>` : t}${v.sotto}</li>`; }).join("\n") + `</${tag}>`;
    return { h, i };
  }
  function blocchi(src) {
    const L = src.replace(/\r\n/g, "\n").split("\n");
    let h = "", i = 0;
    while (i < L.length) {
      const l = L[i];
      if (l.trim() === "") { i++; continue; }
      let m;
      if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) { h += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>\n`; i++; continue; }
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { h += "<hr>\n"; i++; continue; }
      if (/^>/.test(l)) {
        const q = []; while (i < L.length && /^>/.test(L[i])) { q.push(L[i].replace(/^>\s?/, "")); i++; }
        h += `<blockquote>\n${blocchi(q.join("\n"))}</blockquote>\n`; continue;
      }
      if (/^\|/.test(l) && i + 1 < L.length && /^\|?\s*:?-{2,}/.test(L[i + 1])) {
        const intest = celle(l); const all = celle(L[i + 1]).map(a => /^:-+:$/.test(a) ? ' align="center"' : /-:$/.test(a) ? ' align="right"' : "");
        i += 2; let corpo = "";
        while (i < L.length && /^\|/.test(L[i])) { const c = celle(L[i]); corpo += "<tr>" + intest.map((_, k) => `<td${all[k] || ""}>${inline(c[k] || "")}</td>`).join("") + "</tr>\n"; i++; }
        h += `<table>\n<thead><tr>${intest.map((c, k) => `<th${all[k] || ""}>${inline(c)}</th>`).join("")}</tr></thead>\n<tbody>${corpo}</tbody></table>\n`; continue;
      }
      if (RE_LISTA.test(l)) { const r = lista(L, i, l.match(RE_LISTA)[1].length); h += r.h + "\n"; i = r.i; continue; }
      const par = [l.trim()]; i++;
      let setext = 0;
      while (i < L.length && L[i].trim() !== "") {
        if (/^\s*-{2,}\s*$/.test(L[i])) { setext = 2; i++; break; }
        if (/^\s*={2,}\s*$/.test(L[i])) { setext = 1; i++; break; }
        if (inizioBlocco(L[i], L[i + 1])) break;
        par.push(L[i].trim()); i++;
      }
      h += setext ? `<h${setext}>${par.map(inline).join("<br>\n")}</h${setext}>\n` : `<p>${par.map(inline).join("<br>\n")}</p>\n`;
    }
    return h;
  }
  window.marked = { use() {}, parse: blocchi };
})();

</script>
<script type="application/json" id="dati-scheda">{"generato":"2026-10-25 11:50","specie":[{"n":"Brasidi","taglia":"Media","vel":9,"md":"**Tipo di creatura:** Umanoide\n**Taglia:** Media\n**Velocità:** 9 m\n\nCome Braside hai i tratti seguenti.\n\n**Occhi di Brace.** Hai scurovisione entro 18 m. Al buio i tuoi occhi brillano di un rosso cupo, che si vede da lontano: puoi coprirli o chiuderli, ma non spegnerli.\n\n**Il Sangue che Scotta.** Hai resistenza ai danni da fuoco.\n\n**Memoria del Sole.** Conosci il trucchetto _produrre fiamma_. Quando raggiungi il 3° livello impari _mani brucianti_, e quando raggiungi il 5° livello impari _riscaldare il metallo_. Puoi lanciare ciascuno di questi due incantesimi una volta senza spendere slot, e recuperi questa possibilità al termine di un riposo lungo, oppure puoi lanciarli con gli slot che hai. La tua caratteristica da incantatore per questi incantesimi è Intelligenza, Saggezza o Carisma, e la scegli quando scegli questa specie.\n\n**Passo del Pellegrino.** Discendi da gente che ha attraversato il mare a piedi nudi sul ponte delle navi. Puoi portare a termine un riposo lungo dormendo 4 ore invece di 8, se passi le altre in un\u0027attività leggera. Inoltre, durante un viaggio, il terreno difficile non rallenta il ritmo di marcia del tuo gruppo, purché tu sia davanti a guidarlo.\n\n\u003e [!info] Niente aumenti di caratteristica\n\u003e Come tutte le specie delle regole del 2024, i Brasidi non danno aumenti ai punteggi di caratteristica, che vengono invece dal background. Se il vostro tavolo usa ancora le regole precedenti, aumentate la Costituzione, la Saggezza e l\u0027Intelligenza di 1 ciascuna.\n\n---"},{"n":"Cravani","taglia":"Media","vel":10.5,"md":"**Tipo di creatura:** Umanoide\n**Taglia:** Media\n**Velocità:** 10,5 m\n\nCome Cravano hai i tratti seguenti.\n\n**Occhi del Ferro.** Hai scurovisione entro 18 m.\n\n**Zoccoli Saldi.** Hai vantaggio ai tiri salvezza e alle prove per non essere spinto, trascinato o fatto cadere Prono. Il terreno roccioso, le pendenze e i ghiaioni non contano come terreno difficile per te.\n\n**La Luce del Ferro.** Il ferro del Ferrugo ti ha lasciato nelle vene un poco della sua forza. Quando colpisci una creatura con un\u0027arma, puoi far accendere di una luce verde e fredda le venature della tua pelle e il metallo dell\u0027arma: il colpo infligge 1d10 danni da forza extra. Puoi farlo un numero di volte pari al tuo bonus di competenza, e recuperi gli usi spesi al termine di un riposo lungo.\n\n**Il Richiamo.** Il ferro ti riconosce. Se lanci o lasci cadere un\u0027arma di metallo che hai impugnato in questo turno o nel precedente, puoi richiamarla in mano con un\u0027azione bonus, se si trova entro 18 m.\n\n**Il Volto Inciso.** Conosci il trucchetto _Sguardo della Madre Pallida_ (vedi [[Incantesimi della Luna · Trucchetti]]). La tua caratteristica da incantatore per questo trucchetto è Saggezza o Carisma, e la scegli quando scegli questa specie.\n\u003e [!info] Niente aumenti di caratteristica\n\u003e Come tutte le specie delle regole del 2024, i Cravani non danno aumenti ai punteggi di caratteristica, che vengono invece dal background. Se il vostro tavolo usa ancora le regole precedenti, aumentate il Carisma di 2 e la Destrezza di 1.\n\n---"},{"n":"Crepuli","taglia":"Piccola","vel":9,"md":"**Tipo di creatura:** Umanoide\n**Taglia:** Piccola\n**Velocità:** 9 m\n\nCome Crepulo hai i tratti seguenti.\n\n**Occhi del Fondo.** Hai scurovisione entro 18 m.\n\n**Sgusciare.** Sei scappato da qualcosa di più grande di te, e il corpo non l\u0027ha dimenticato. Puoi effettuare l\u0027azione di Disimpegno o di Nascondersi come azione bonus. Puoi farlo un numero di volte pari al tuo bonus di competenza, e recuperi gli usi spesi al termine di un riposo breve o lungo.\n\n**Orecchio alla Pietra.** Hai competenza in Percezione. Quando sei al chiuso, sottoterra o tra muri di pietra, hai vantaggio alle prove di Saggezza (Percezione) basate sull\u0027udito.\n\n**Doni delle Gallerie.** Conosci il trucchetto _prestidigitazione_. Quando raggiungi il 3° livello impari _ritirata rapida_, e quando raggiungi il 5° livello impari _invisibilità_. Puoi lanciare ciascuno di questi due incantesimi una volta senza spendere slot, e recuperi questa possibilità al termine di un riposo lungo, oppure puoi lanciarli con gli slot che hai. La tua caratteristica da incantatore per questi incantesimi è Intelligenza, Saggezza o Carisma, e la scegli quando scegli questa specie.\n\n\u003e [!info] Niente aumenti di caratteristica\n\u003e Come tutte le specie delle regole del 2024, i Crepuli non danno aumenti ai punteggi di caratteristica, che vengono invece dal background. Se il vostro tavolo usa ancora le regole precedenti, aumentate la Destrezza di 2 e la Saggezza di 1.\n\n---"},{"n":"Forsaken","taglia":"Media o Piccola (la scegli quando scegli questa specie, in base a com\u0027eri da vivo)","vel":9,"md":"**Tipo di creatura:** Umanoide (vedi _Mezzo Morto_)\n**Taglia:** Media o Piccola (la scegli quando scegli questa specie, in base a com\u0027eri da vivo)\n**Velocità:** 9 m\n\nCome Forsaken hai i tratti seguenti.\n\n**Scurovisione.** Hai scurovisione entro 18 m. Nell\u0027oscurità non distingui i colori, ma solo sfumature di verde.\n\n**Mezzo Morto.** Non hai bisogno di respirare, mangiare o bere, anche se puoi farlo, e hai resistenza ai danni necrotici. Per gli effetti che riguardano in modo specifico i non morti, come _Scacciare Non Morti_ o _protezione dal bene e dal male_, conti anche come non morto.\n\n**Senza Sonno.** Non dormi, e la magia non può farti addormentare. Puoi portare a termine un riposo lungo in 4 ore, se le passi in uno stato di quiete in cui resti cosciente, mentre la necromanzia della nebbia ti ricuce, piano.\n\n**Il Nome Tenuto.** Hai vantaggio ai tiri salvezza per evitare la condizione Affascinato o porvi fine. Hai già detto di no alla voce più forte del mondo, e le altre ti convincono meno.\n\n**Morte Apparente.** Puoi fingerti morto alla perfezione: hai vantaggio alle prove per sembrare un cadavere, e chi ti esamina deve superare una prova di Saggezza (Medicina) con CD 20 per capire che non lo sei. Inoltre, con un\u0027azione bonus puoi spegnerti del tutto per 1 minuto: i non morti senza intelligenza (Intelligenza 4 o meno), come gli Spenti e i morti della Foschia, non ti scelgono come bersaglio finché l\u0027effetto dura, e l\u0027effetto finisce se attacchi, lanci un incantesimo o infliggi danni. Puoi farlo un numero di volte pari al tuo bonus di competenza, e recuperi gli usi spesi al termine di un riposo lungo.\n\n**Fame dei Morti.** Puoi passare 1 minuto a mangiare la carne di un umanoide o di una bestia morti da meno di un\u0027ora, e recuperi PF pari a un tiro di un tuo Dado Vita + il tuo modificatore di Costituzione, senza spendere il dado. Dopo averlo fatto, non puoi rifarlo finché non termini un riposo lungo. Chi ti guarda mentre lo fai, se non è un Forsaken, deve superare un tiro salvezza su Saggezza con CD 10, altrimenti è Spaventato da te per 1 minuto.\n\n**Lascito della Morte.** Il modo in cui sei morto ti ha lasciato qualcosa: scegli uno dei lasciti della tabella seguente. Ne ottieni subito il beneficio del 1° livello, e quando raggiungi il 3° e il 5° livello impari gli incantesimi indicati. Puoi lanciare ciascuno di questi incantesimi una volta senza spendere slot, e recuperi questa possibilità al termine di un riposo lungo, oppure puoi lanciarli con gli slot che hai. La tua caratteristica da incantatore per questi incantesimi è Intelligenza, Saggezza o Carisma, e la scegli quando scegli il lascito.\n\n| Lascito | 1° livello | 3° livello | 5° livello |\n|---|---|---|---|\n| **Della Foschia** (sei morto nella nebbia verde) | Conosci il trucchetto _illusione minore_. Respirare la Foschia non ti fa danni, e senti la voce nella nebbia senza doverla seguire. | _nube di nebbia_ | _passo velato_ |\n| **Del Mare** (sei annegato) | Hai una velocità di nuoto pari alla tua velocità, e conosci il trucchetto _rintocco dei morti_. | _falsa vita_ | _raggio di indebolimento_ |\n| **Della Tomba** (ti sei rialzato sottoterra, e hai scavato) | Hai una velocità di scavare di 3 m nella terra smossa, e conosci il trucchetto _tocco gelido_. | _raggio di infermità_ | _blocca persone_ |\n\n**Occhi Verdi.** I tuoi occhi brillano di una luce verde pallida e fioca, che nel buio completo si vede a 18 m. Puoi coprirli, con un cappuccio, con una benda o chiudendoli, ma non puoi spegnerli.\n\n\u003e [!info] Niente aumenti di caratteristica\n\u003e Come tutte le specie delle regole del 2024, i Forsaken non danno aumenti ai punteggi di caratteristica, che vengono invece dal background. Se il vostro tavolo usa ancora le regole precedenti, aumentate la Costituzione di 2 e un altro punteggio di 1.\n\n---"},{"n":"Larvati","taglia":"Media","vel":9,"md":"**Tipo di creatura:** Umanoide\n**Taglia:** Media\n**Velocità:** 9 m\n\nCome Larvato hai i tratti seguenti.\n\n**Occhi di Ghiaccio.** Hai scurovisione entro 18 m.\n\n**Mezzo Fuori dal Mondo.** Con un\u0027azione bonus scivoli per metà fuori dal mondo, fino alla fine del tuo turno: diventi trasparente, puoi muoverti attraverso le altre creature come se fossero terreno difficile, e i tiri per colpire degli attacchi di opportunità contro di te hanno svantaggio. Quando raggiungi il 5° livello puoi attraversare anche gli oggetti spessi al massimo 30 cm, come porte, grate, imposte e pareti di legno, ma non la pietra né il metallo pieno. Se termini il turno dentro una creatura o un oggetto, vieni spinto nello spazio libero più vicino e subisci 1d10 danni da forza. Puoi farlo un numero di volte pari al tuo bonus di competenza, e recuperi gli usi spesi al termine di un riposo lungo.\n\n**Presenza Velata.** Hai competenza in Intimidire. Quando ti togli la maschera davanti a qualcuno, per la prima volta, puoi fare la prova con vantaggio.\n\n**L\u0027Eredità del Fondo.** Conosci il trucchetto _illusione minore_. Quando raggiungi il 3° livello impari _individuazione del magico_, e quando raggiungi il 5° livello impari _individuazione dei pensieri_. Puoi lanciare ciascuno di questi due incantesimi una volta senza spendere slot, e recuperi questa possibilità al termine di un riposo lungo, oppure puoi lanciarli con gli slot che hai. La tua caratteristica da incantatore per questi incantesimi è Intelligenza, Saggezza o Carisma, e la scegli quando scegli questa specie.\n\n**Il Segno.** Quando scegli questa specie, scegli anche il tuo segno: due piccole corna, unghie lunghe e nere, una coda sottile, scaglie sulla schiena o sulle braccia, un dito in più per mano, simboli sulla pelle che nessuno sa leggere. Il segno non ti dà benefici in combattimento, ma è difficile da nascondere senza una maschera o un cappuccio.\n\n\u003e [!info] Niente aumenti di caratteristica\n\u003e Come tutte le specie delle regole del 2024, i Larvati non danno aumenti ai punteggi di caratteristica, che vengono invece dal background. Se il vostro tavolo usa ancora le regole precedenti, aumentate l\u0027Intelligenza di 2 e un altro punteggio di 1.\n\n---"},{"n":"Nerisoli","taglia":"Media","vel":9,"md":"**Tipo di creatura:** Umanoide\n**Taglia:** Media\n**Velocità:** 9 m\n\nCome Nerisolo hai i tratti seguenti.\n\n**Scurovisione.** Hai scurovisione entro 36 m. I tuoi antenati sono nati e vissuti nelle cisterne, e per te il buio è casa.\n\n**Sangue d\u0027Eclisse.** Il tuo sangue è nero, e hai resistenza ai danni necrotici.\n\n**Le Corna.** Dalla fronte ti escono due corna nere, e quando scegli questa specie scegli anche come le porti:\n- **Corna intere.** Puoi usarle per i tuoi colpi senz\u0027armi, che infliggono 1d6 + il tuo modificatore di Forza danni perforanti invece dei danni normali.\n- **Corna limate.** Le hai limate a filo della pelle, come fa la tua famiglia da generazioni. Hai competenza in Inganno, e chi non ti guarda da vicino ti scambia per un umano.\n\n**Metà dell\u0027Eclisse.** Un\u0027eclissi è luce e buio insieme, e in ogni Nerisolo prevale una delle due metà: scegline una nella tabella seguente. Ottieni subito il trucchetto del 1° livello, e quando raggiungi il 3° e il 5° livello impari gli incantesimi indicati. Puoi lanciare ciascuno di questi due incantesimi una volta senza spendere slot, e recuperi questa possibilità al termine di un riposo lungo, oppure puoi lanciarli con gli slot che hai. La tua caratteristica da incantatore per questi incantesimi è Intelligenza, Saggezza o Carisma, e la scegli quando scegli la metà.\n\n| Metà | 1° livello | 3° livello | 5° livello |\n|---|---|---|---|\n| **La Corona** (la luce intorno all\u0027eclissi) | _fiamma sacra_ | _dardo tracciante_ | _arma spirituale_, un\u0027arma di luce dorata |\n| **Il Disco** (l\u0027ombra davanti al Sole) | _tocco gelido_ | _anatema_ | _oscurità_ |\n\n**L\u0027Eclisse.** Quando raggiungi il 3° livello, con un\u0027azione bonus puoi lasciar emergere la tua metà dell\u0027eclissi per 1 minuto, o finché non la congedi senza usare azioni. Finché dura, una volta per turno, quando colpisci una creatura con un attacco o le infliggi danni con un incantesimo, le infliggi danni in più pari al tuo bonus di competenza: radianti se sei della Corona, necrotici se sei del Disco. In più:\n- **La Corona.** Emetti luce intensa entro 3 m e luce fioca per altri 3 m, del colore dell\u0027oro vecchio. Tu e gli alleati nella luce intensa avete vantaggio ai tiri salvezza per non essere Spaventati.\n- **Il Disco.** La luce entro 3 m da te diventa fioca, e la luce fioca diventa oscurità. La prima creatura che colpisci in ogni tuo turno non può effettuare reazioni fino all\u0027inizio del suo turno successivo.\n\nPuoi usare questo tratto una volta, e recuperi la possibilità al termine di un riposo lungo.\n\n**Chi Non Vede il Sole Non Invecchia.** Finché il Sole tace invecchi molto lentamente: un Nerisolo diventa adulto a vent\u0027anni e può vivere quasi mille anni. Se sei nato prima della Notte, nelle cisterne, sei più vecchio della Notte stessa, e ti ricordi tutto.\n\n\u003e [!info] Niente aumenti di caratteristica\n\u003e Come tutte le specie delle regole del 2024, i Nerisoli non danno aumenti ai punteggi di caratteristica, che vengono invece dal background. Se il vostro tavolo usa ancora le regole precedenti, aumentate la Saggezza di 2 e un altro punteggio di 1.\n\n---"},{"n":"Worgen","taglia":"Media","vel":9,"md":"**Tipo di creatura:** Umanoide\n**Taglia:** Media\n**Velocità:** 9 m\n\nCome Worgen hai i tratti seguenti.\n\n**Scurovisione.** Hai scurovisione entro 18 m. Nell\u0027oscurità non distingui i colori, ma solo sfumature di grigio.\n\n**Segugio.** Quando effettui una prova di Saggezza (Sopravvivenza) per seguire tracce, sei considerato competente in Sopravvivenza e aggiungi alla prova il doppio del tuo bonus di competenza.\n\n**Fuga Oscura.** In forma Worgen, quando usi l\u0027azione Scattare, per quel turno la tua velocità aumenta di altri 6 m.\n\n**Fuga Oscura Allenata.** Dopo aver passato tre riposi lunghi ad allenarti a tenere la bestia sotto controllo, puoi usare Fuga Oscura anche in forma umana.\n\n**Occhi del Branco.** Con un\u0027azione bonus puoi far brillare i tuoi occhi del colore esatto del tuo manto, e succede anche da solo quando la rabbia, la paura o l\u0027istinto del predatore prendono il sopravvento, per esempio in combattimento, sotto stress o quando liberi la bestia. Hai competenza in Intimidire, e mentre i tuoi occhi brillano chi ti vede capisce subito che cosa sei. La luce dura 1 minuto, o finché non la spegni con un\u0027azione bonus, e può servire come segnale tra Worgen alleati o per spaventare chi non conosce la tua natura.\n\n**Frenesia.** In forma Worgen hai un **Morso**, un\u0027arma naturale con cui sei competente, che infligge 1d6 + il tuo modificatore di Forza danni perforanti. Quando colpisci una creatura con un attacco con un\u0027arma, puoi effettuare un attacco con il Morso contro la stessa creatura come azione bonus. Puoi farlo un numero di volte pari al tuo bonus di competenza, e recuperi gli usi spesi al termine di un riposo lungo.\n\n**Forme Gemelle.** Oltre alla forma Worgen hai una forma umana, e con un\u0027azione bonus passi da una forma all\u0027altra. In forma umana non puoi usare Frenesia, né Fuga Oscura finché non hai la Fuga Oscura Allenata.\nMentre sei in forma umana, il combattimento o uno stress forte possono costringerti a trasformarti contro la tua volontà. Per resistere devi superare un tiro salvezza su Saggezza con CD pari a 10 o ai danni appena subiti, se sono più alti. Se lo superi mantieni la forma umana e non devi ripetere il tiro per il minuto successivo, mentre se lo fallisci ti trasformi subito.\n\n\u003e [!info] Niente aumenti di caratteristica\n\u003e Come tutte le specie delle regole del 2024, i Worgen non danno aumenti ai punteggi di caratteristica, che vengono invece dal background. Se il vostro tavolo usa ancora le regole precedenti, aumentate un punteggio di 2 e un altro di 1, oppure tre punteggi diversi di 1."}],"classi":[{"n":"Floralista","dv":10,"ts":["FOR","SAG"],"tab":{"h":["Livello","Bonus di competenza","Privilegi di classe","Semine","Semi conosciuti","Fioritura","Incantesimi preparati","1°","2°","3°","4°","5°"],"r":[["1","+2","Incantesimi, Il Giardino, Maestria nelle Armi","2","2","1d6","2","2","—","—","—","—"],["2","+2","Stile di Combattimento, Mani nella Terra","2","2","1d6","3","2","—","—","—","—"],["3","+2","Sottoclasse del Floralista","2","3","1d6","4","3","—","—","—","—"],["4","+2","Aumento dei Punteggi di Caratteristica","2","3","1d6","5","3","—","—","—","—"],["5","+3","Attacco Extra","2","4","2d6","6","4","2","—","—","—"],["6","+3","Albero della Vita","3","4","2d6","6","4","2","—","—","—"],["7","+3","Privilegio di sottoclasse","3","5","2d6","7","4","3","—","—","—"],["8","+3","Aumento dei Punteggi di Caratteristica","3","5","2d6","7","4","3","—","—","—"],["9","+4","Innesto","3","6","2d6","9","4","3","2","—","—"],["10","+4","Voce delle Radici","3","6","2d6","9","4","3","2","—","—"],["11","+4","Privilegio di sottoclasse","3","7","3d6","10","4","3","3","—","—"],["12","+4","Aumento dei Punteggi di Caratteristica","3","7","3d6","10","4","3","3","—","—"],["13","+5","Cuore di Rovo","4","8","3d6","11","4","3","3","1","—"],["14","+5","Pollice Verde","4","8","3d6","11","4","3","3","1","—"],["15","+5","Privilegio di sottoclasse","4","9","3d6","12","4","3","3","2","—"],["16","+5","Aumento dei Punteggi di Caratteristica","4","9","3d6","12","4","3","3","2","—"],["17","+6","L\u0027Ultimo Petalo","5","10","4d6","14","4","3","3","3","1"],["18","+6","Radici Profonde","5","10","4d6","14","4","3","3","3","1"],["19","+6","Dono Epico","5","10","4d6","15","4","3","3","3","2"],["20","+6","Primavera nel Petto","5","10","4d6","15","4","3","3","3","2"]]},"priv":[{"lv":1,"n":"Incantesimi","md":"Hai imparato la magia delle cose che crescono, quella che i druidi insegnavano prima della Notte. Le regole per lanciare incantesimi sono quelle del manuale del giocatore; qui sotto c\u0027è come si applicano a te.\n\n**Slot incantesimo.** La tabella _Privilegi di classe del Floralista_ indica quanti slot incantesimo hai per lanciare incantesimi di 1° livello o superiore. Recuperi tutti gli slot spesi al termine di un riposo lungo.\n\n**Incantesimi preparati di 1° livello o superiore.** Prepari l\u0027elenco degli incantesimi che puoi lanciare scegliendoli dalla lista degli incantesimi del **Druido**. Il numero è indicato nella colonna _Incantesimi preparati_, e devono essere di un livello per cui hai slot. Al termine di un riposo lungo puoi sostituire un incantesimo preparato con un altro della lista.\n\n**Caratteristica da incantatore.** La Saggezza. CD del tiro salvezza degli incantesimi = 8 + il tuo bonus di competenza + il tuo modificatore di Saggezza. Bonus di attacco degli incantesimi = il tuo bonus di competenza + il tuo modificatore di Saggezza.\n\n**Focus da incantatore.** Puoi usare come focus un seme secco tenuto in mano, oppure un focus druidico."},{"lv":1,"n":"Il Giardino","md":"In un punto del tuo corpo la pelle si è aperta, e la terra ha attecchito: l\u0027interno dell\u0027avambraccio, l\u0027incavo della spalla, il palmo, la nuca. È il tuo **Giardino**, e ci cresce **un Seme alla volta**.\n\n**Semi conosciuti.** Conosci il numero di Semi indicato nella colonna _Semi conosciuti_, scelti dalla lista _I Semi_, più avanti. Quando sali di livello puoi sostituire un Seme che conosci con un altro.\n\n**Piantare.** Se il Giardino è vuoto, con un\u0027azione bonus puoi piantare un Seme che conosci spendendo una **Semina**. Hai il numero di Semine indicato nella colonna _Semine_. Recuperi una Semina spesa al termine di un riposo breve, e tutte quelle spese al termine di un riposo lungo.\n\n**Nutrire con la Carne.** Se non hai Semine, puoi piantare spendendo invece uno dei tuoi Dadi Vita, senza recuperare PF. Puoi farlo un numero di volte pari al tuo modificatore di Saggezza (minimo una volta), e recuperi tutti gli usi spesi al termine di un riposo lungo.\n\n**CD dei Semi.** La CD dei tiri salvezza contro i tuoi Semi è uguale a quella dei tuoi incantesimi.\n\n**Fioritura.** Molti Semi infliggono danni o fanno recuperare PF pari alla tua **Fioritura**, cioè al tiro dei dadi indicati nella colonna _Fioritura_. Quando un effetto dice di tirare la Fioritura due volte, tiri il doppio dei dadi.\n\n**Come cresce un Seme.** Un Seme appena piantato è un **seme**. Alla fine di ogni tuo turno cresce di uno stadio, e diventa **germoglio**, poi **bocciolo**, poi **fiore**. Alla fine del turno successivo, invece di crescere, **appassisce**, e il Giardino torna vuoto. Un Seme vive quindi per quattro dei tuoi turni.\n- Gli effetti _Quando diventa…_ si applicano alla fine del tuo turno, nel momento in cui il Seme raggiunge quello stadio.\n- Gli altri effetti valgono finché il Seme è nello stadio indicato.\n- Se un privilegio fa crescere il Seme in un altro momento, l\u0027effetto _Quando diventa…_ di quello stadio non si applica, a meno che il privilegio non dica altrimenti.\n- Un Seme appassisce anche quando scendi a 0 PF, quando termini un riposo breve o lungo, o quando lo strappi tu, cosa che non richiede azioni.\n\n**Le condizioni dei Semi.** Una condizione imposta da un Seme dura fino alla fine del tuo turno successivo, a meno che il Seme non dica altrimenti."},{"lv":1,"n":"Maestria nelle Armi","md":"Puoi usare le proprietà di maestria di due tipi di armi semplici o da guerra a tua scelta. Al termine di un riposo lungo puoi cambiare i tipi scelti."},{"lv":2,"n":"Stile di Combattimento","md":"Ottieni un talento Stile di Combattimento a tua scelta. Quando sali di livello da Floralista puoi sostituirlo con un altro."},{"lv":2,"n":"Mani nella Terra","md":"Hai competenza in Medicina, o in un\u0027altra abilità della lista del Floralista se ce l\u0027hai già. Il tuo bonus di competenza raddoppia per le prove di Intelligenza (Natura) e per quelle con il Kit da Erborista. Quando cerchi le piante dell\u0027Erbario hai vantaggio, e trovi una dose in più (vedi [[Erbario della Notte]])."},{"lv":3,"n":"Sottoclasse del Floralista","md":"Uno dei semi che hai piantato non è appassito: ha messo radici vere, ti è entrato nelle ossa, ed è rimasto. È il tuo **Fiore Madre**, e decide che genere di Floralista sei. Scegli una sottoclasse: **Custode del Lume**, **Seminatore delle Forche**, **Tessitore di Sonni** o **Siepe di Ferro**. Ottieni i suoi privilegi al 3°, al 7°, all\u002711° e al 15° livello."},{"lv":4,"n":"Aumento dei Punteggi di Caratteristica","md":"Ottieni il talento Aumento dei Punteggi di Caratteristica, o un altro talento di cui soddisfi i requisiti. Ottieni di nuovo questo privilegio all\u00278°, al 12° e al 16° livello."},{"lv":5,"n":"Attacco Extra","md":"Quando effettui l\u0027azione di Attacco nel tuo turno, puoi attaccare due volte invece di una."},{"lv":6,"n":"Albero della Vita","md":"Quando un tuo Seme appassisce, puoi scegliere una creatura ferita che vedi entro 18 m: recupera PF pari alla tua Fioritura + il tuo modificatore di Saggezza. I petali le cadono addosso, e si attaccano alle ferite."},{"lv":9,"n":"Innesto","md":"Se nel Giardino c\u0027è un Seme che è almeno germoglio, con un\u0027azione bonus puoi strapparlo e piantare al suo posto un altro Seme che conosci, senza spendere una Semina. Il nuovo Seme spunta allo stesso stadio di quello strappato, senza applicarne l\u0027effetto _Quando diventa…_, e il Seme strappato conta come appassito. Puoi usare _Innesto_ una sola volta per ogni Seme piantato con una Semina o con _Nutrire con la Carne_."},{"lv":10,"n":"Voce delle Radici","md":"Hai sempre preparati _intralciare_, _parlare con le piante_ e _crescita vegetale_, che non contano nel numero degli incantesimi preparati, e puoi lanciare _parlare con le piante_ e _crescita vegetale_ come rituali. Inoltre, con un\u0027azione, puoi muovere la vegetazione non magica entro 9 m da te: aprire un varco in un rovo, chiudere un sentiero, far cadere un ramo."},{"lv":13,"n":"Cuore di Rovo","md":"Hai resistenza ai danni necrotici e da veleno. Inoltre, quando subisci danni mentre hai la metà o meno dei tuoi PF massimi e nel Giardino c\u0027è un Seme, puoi usare la reazione per farlo crescere subito di uno stadio, applicandone l\u0027effetto _Quando diventa…_."},{"lv":14,"n":"Pollice Verde","md":"Quando il tuo Seme cresce alla fine del tuo turno, puoi farlo crescere di due stadi invece di uno, applicando l\u0027effetto _Quando diventa…_ soltanto dello stadio finale, oppure tenerlo fermo nello stadio in cui si trova. Puoi farlo una volta per ogni Seme."},{"lv":17,"n":"L\u0027Ultimo Petalo","md":"Quando un tuo Seme appassisce, puoi spendere una Semina per applicare uno dei suoi effetti _Quando diventa…_ a tua scelta, come se il Seme avesse appena raggiunto quello stadio."},{"lv":18,"n":"Radici Profonde","md":"I danni dei tuoi Semi ignorano la resistenza. Inoltre, quando tiri l\u0027iniziativa e non hai Semine, ne recuperi una."},{"lv":19,"n":"Dono Epico","md":"Ottieni un talento Dono Epico, o un altro talento a tua scelta di cui soddisfi i requisiti."},{"lv":20,"n":"Primavera nel Petto","md":"Il tuo corpo è diventato un giardino intero. Nel Giardino possono crescere **due Semi** alla volta, diversi tra loro, e ognuno cresce per conto suo. Li pianti uno alla volta, ognuno con la sua azione bonus.\n\n---"}],"sott":[{"n":"Custode del Lume","md":"_Il Fiore Madre è un girasole cieco, che cresce dallo sterno con il gambo stretto tra le costole. La corolla si gira piano, per tutta la notte, verso il punto del cielo dove sorgeva il Sole. Chi lo porta ha imparato a tirare fuori dai semi l\u0027ultima luce che è rimasta loro dentro, e la usa per tenere in piedi gli altri._\n\n**Livello 3: Incantesimi del Custode del Lume.** Hai sempre preparati gli incantesimi della tabella quando raggiungi il livello indicato, e non contano nel numero degli incantesimi preparati.\n\n| Livello da Floralista | Incantesimi |\n|:---:|---|\n| 3 | _cura ferite_, _parola guaritrice_ |\n| 5 | _ristorare inferiore_, _arma spirituale_ |\n| 9 | _luce diurna_, _protezione dall\u0027energia_ |\n| 13 | _guardiano della fede_, _interdizione alla morte_ |\n| 17 | _cura ferite di massa_, _dissolvi il male e il bene_ |\n\n\n**Livello 3: Linfa Dorata.** Una volta per turno, quando un tuo Seme fa recuperare PF o dà PF temporanei, scegli una delle creature che li ricevono: riceve in più un numero di PF pari al tuo modificatore di Saggezza. Inoltre, quando pianti un Seme, puoi far recuperare a una creatura che vedi entro 9 m PF pari alla tua Fioritura.\n\n**Livello 7: Il Lume del Giardino.** Finché nel Giardino c\u0027è un Seme emetti luce fioca in un raggio di 3 m, del colore del Sole di prima. Gli alleati in quella luce hanno vantaggio ai tiri salvezza contro la morte e resistenza ai danni necrotici.\n\n**Livello 11: Fioritura Benedetta.** _Albero della Vita_ fa recuperare la tua Fioritura tirata due volte + il tuo modificatore di Saggezza, e pone fine a una condizione a tua scelta tra Accecato, Assordato, Avvelenato e Spaventato.\n\n**Livello 15: Il Sole in Tasca.** Quando un tuo Seme appassisce, puoi farlo aprire come un sole. Ogni creatura a tua scelta entro 9 m deve superare un tiro salvezza su Costituzione contro la CD dei Semi: se lo fallisce subisce 8d8 danni radianti ed è Accecata fino alla fine del tuo turno successivo, se lo supera subisce metà dei danni. Ogni alleato entro 9 m recupera 4d8 PF. Una volta per riposo lungo."},{"n":"Seminatore delle Forche","md":"_Il Fiore Madre è una mandragola, che nasceva sotto le forche dove cadeva l\u0027ultimo seme degli impiccati. Ha messo la radice nel ventre del Floralista, e ha la forma di un piccolo uomo rannicchiato che si nutre di quello che muore intorno. Quando qualcuno prova a strapparla, urla._\n\n**Livello 3: Incantesimi del Seminatore delle Forche.**\n\n| Livello da Floralista | Incantesimi |\n|:---:|---|\n| 3 | _falsa vita_, _raggio di infermità_ |\n| 5 | _cecità/sordità_, _riposo inviolato_ |\n| 9 | _animare morti_, _parlare con i morti_ |\n| 13 | _avvizzimento_, _interdizione alla morte_ |\n| 17 | _nube mortale_, _contagio_ |\n\n**Livello 3: Concime.** Finché nel Giardino c\u0027è un Seme, una volta per turno, quando colpisci una creatura con un attacco con un\u0027arma, le infliggi 1d6 danni da veleno in più. All\u002711° livello il dado diventa 1d8.\n\n**Livello 7: Radici nei Morti.** Quando una creatura muore entro 9 m da te mentre nel Giardino c\u0027è un Seme, ottieni PF temporanei pari alla tua Fioritura. Una volta per round, puoi anche far crescere subito il Seme di uno stadio, senza applicarne l\u0027effetto _Quando diventa…_.\n\n**Livello 11: Fioritura Putrida.** Quando un tuo Seme infligge danni a una creatura, quella creatura non può recuperare PF fino all\u0027inizio del tuo turno successivo. I danni da veleno dei tuoi Semi e di _Concime_ ignorano la resistenza al veleno.\n\n**Livello 15: Il Banchetto delle Radici.** Quando riduci a 0 PF una creatura con un attacco con un\u0027arma e il Giardino è vuoto, puoi piantare subito un Seme che conosci, senza usare azioni e senza spendere Semine, e il Seme spunta già come bocciolo, senza applicarne l\u0027effetto _Quando diventa…_, perché mette radici nel cadavere prima che in te. Una volta per riposo breve o lungo."},{"n":"Tessitore di Sonni","md":"_Il Fiore Madre è un papavero d\u0027argento, che cresce dietro l\u0027occhio e si apre alla tempia quando la luna è alta. Il suo polline fa dormire, sognare e dimenticare. Chi lo porta non dorme più davvero: sogna a occhi aperti, e a volte sogna i sogni degli altri._\n\n**Livello 3: Incantesimi del Tessitore di Sonni.**\n\n| Livello da Floralista | Incantesimi |\n|:---:|---|\n| 3 | _sonno_, _sussurri dissonanti_ |\n| 5 | _blocca persone_, _calmare emozioni_ |\n| 9 | _trama ipnotica_, _lentezza_ |\n| 13 | _confusione_, _assassino fantasma_ |\n| 17 | _sogno_, _modificare memoria_ |\n\n**Livello 3: Polline d\u0027Argento.** Gli effetti dei tuoi Semi che raggiungono le creature entro 9 m le raggiungono entro 18 m, e quando un tuo Seme sceglie fino a due creature, ne sceglie fino a tre. Una creatura che fallisce un tiro salvezza contro un tuo Seme non può effettuare reazioni fino all\u0027inizio del suo turno successivo.\n\n**Livello 7: Il Fiore che si Chiude.** Quando una creatura che vedi supera un tiro salvezza contro un tuo Seme, puoi usare la reazione per costringerla a ripeterlo e a usare il nuovo risultato. Puoi farlo un numero di volte pari al tuo modificatore di Saggezza (minimo una), e recuperi gli usi spesi al termine di un riposo lungo.\n\n**Livello 11: Le Fasi.** Quando pianti un Seme, puoi farlo spuntare già come germoglio, applicandone l\u0027effetto _Quando diventa germoglio_. Puoi farlo un numero di volte pari al tuo modificatore di Saggezza (minimo una), e recuperi gli usi spesi al termine di un riposo lungo.\n\n**Livello 15: Luna Piena.** Quando il tuo Seme diventa fiore, puoi applicare anche il suo effetto _Quando diventa bocciolo_, nell\u0027ordine che preferisci. Una volta per riposo lungo."},{"n":"Siepe di Ferro","md":"_Il Fiore Madre è un cardo dei colli di ferro, che cresce lungo la spina dorsale con le foglie dure come lame e le spine nere di ruggine. Beve il ferro del sangue e lo rende alla pelle. Chi lo porta ha la schiena di una quercia, e sta davanti agli altri._\n\n**Livello 3: Incantesimi della Siepe di Ferro.**\n\n| Livello da Floralista | Incantesimi |\n|:---:|---|\n| 3 | _intralciare_, _scudo della fede_ |\n| 5 | _pelle coriacea_, _crescita di spine_ |\n| 9 | _crescita vegetale_, _muro di vento_ |\n| 13 | _pelle di pietra_, _movimento libero_ |\n| 17 | _muro di pietra_, _risveglio_ |\n\n\n**Livello 3: Corteccia.** Quando pianti un Seme ottieni PF temporanei pari alla tua Fioritura + il tuo livello da Floralista. Finché nel Giardino c\u0027è un Seme non puoi essere spostato contro la tua volontà né cadere Prono.\n\n**Livello 7: Rovi Protettori.** Quando una creatura entro 1,5 m da te subisce danni da un attacco, puoi usare la reazione per ridurli della tua Fioritura + il tuo modificatore di Saggezza. Se l\u0027attaccante è entro 1,5 m da te, deve superare un tiro salvezza su Forza contro la CD dei Semi, altrimenti è Trattenuto dalle radici fino alla fine del suo turno successivo.\n\n**Livello 11: Spino del Ferrugo.** Quando pianti lo _Spino della Muraglia_ hai resistenza ai danni contundenti, perforanti e taglienti. Inoltre, finché nel Giardino c\u0027è un Seme, una creatura che ti colpisce con un attacco in mischia subisce 1d8 danni perforanti.\n\n**Livello 15: Il Bosco che Cammina.** Con un\u0027azione bonus ti copri di rami e corteccia per 1 minuto: diventi Grande, la tua portata con le armi da mischia aumenta di 1,5 m, hai resistenza a tutti i danni tranne quelli da fuoco e psichici, e gli alleati entro 3 m da te hanno mezza copertura. Una volta per riposo lungo.\n\n---"}],"extra":[{"t":"I Semi","md":"Ogni Seme ha un nome, il luogo dove lo si raccoglieva prima della Notte e una tabella che dice che cosa fa in ogni stadio. Quando un Seme dice _fino a due creature_, puoi scegliere anche la creatura colpita nello stadio precedente.\n\n### Asfodelo del Cairn\n_Bianco e solenne, cresceva sui tumuli dell\u0027Altopiano. Chi lo vede aprirsi pensa alla propria morte, anche senza volerlo._\n\n| Stadio | Effetto |\n|---|---|\n| **Germoglio** | Quando diventa germoglio, una creatura che vedi entro 18 m deve superare un tiro salvezza su Saggezza, altrimenti è Spaventata. |\n| **Bocciolo** | Quando diventa bocciolo, fino a due creature che vedi entro 9 m devono superare un tiro salvezza su Saggezza, altrimenti sono Spaventate. |\n| **Fiore** | Quando diventa fiore, ogni creatura Spaventata che vedi entro 18 m subisce danni necrotici pari alla tua Fioritura tirata due volte. |\n\n### Belladonna delle Fosse\n_Cresce dove i morti non vengono bruciati, e le sue bacche viola sanno di miele. Un tempo era un veleno, adesso è una fede._\n\n| Stadio | Effetto |\n|---|---|\n| **Dal seme al bocciolo** | I danni delle tue armi diventano danni da veleno, e ignorano la resistenza al veleno. Una creatura immune al veleno ne subisce la metà. |\n| **Fiore** | Come sopra. In più, quando diventa fiore, la prossima creatura che colpisci con un\u0027arma prima della fine del tuo turno successivo subisce danni da veleno pari alla tua Fioritura e deve superare un tiro salvezza su Costituzione, altrimenti è Avvelenata. |\n\n### Biancospino delle Levatrici\n_Le levatrici di primavera lo appendevano sopra le culle, contro le febbri e contro le cose che vengono a prendere i bambini._\n\n| Stadio | Effetto |\n|---|---|\n| **Seme e germoglio** | Hai resistenza ai danni necrotici e da veleno. |\n| **Bocciolo e fiore** | Tu e ogni alleato entro 3 m da te avete resistenza ai danni necrotici e da veleno. |\n\n### Crisantemo di Asheval\n_Il fiore della fiera di Asheval, rosso e arancio come una brace. Dopo il rogo, i pochi semi rimasti sanno soltanto bruciare._\n\n| Stadio | Effetto |\n|---|---|\n| **Dal germoglio al fiore** | Ogni volta che cresce, scegli **fuoco** o **acido**. Fino alla scelta successiva, o finché il Seme non appassisce, i danni che tu e un alleato a tua scelta entro 9 m infliggete con armi e trucchetti diventano del tipo scelto, e ignorano la resistenza a quel tipo. |\n\n### Dalia delle Dune\n_Una pianta coriacea delle dune delle Terre Basse, che non teme né il vento né la sabbia rovente._\n\n| Stadio | Effetto |\n|---|---|\n| **Seme e germoglio** | Hai resistenza ai danni da fuoco e da tuono. |\n| **Bocciolo e fiore** | Tu e ogni alleato entro 3 m da te avete resistenza ai danni da fuoco e da tuono. |\n\n### Garofano di Harnholt\n_Gli scudieri di Harnholt lo portavano all\u0027occhiello nei tornei, e il suo odore pungente fa infuriare chi lo sente._\n\n| Stadio | Effetto |\n|---|---|\n| **Dal germoglio al fiore** | Alla fine del tuo turno, dopo che è cresciuto, puoi strapparlo. |\n| **Quando appassisce** | Se era almeno germoglio, una creatura che vedi entro 18 m deve superare un tiro salvezza su Saggezza, altrimenti fino alla fine del tuo turno successivo ha svantaggio ai tiri per colpire contro le creature diverse da te. |\n\n### Giglio della Levatrice\n_Il fiore di Lirvanne, la Levatrice Verde, con le corolle bianche che filtrano il veleno dall\u0027aria e dal sangue._\n\n| Stadio | Effetto |\n|---|---|\n| **Germoglio** | Quando diventa germoglio, tu e ogni alleato che vedi entro 9 m guarite dalla condizione Avvelenato. |\n| **Bocciolo** | Quando diventa bocciolo, tu oppure un alleato che vedi entro 9 m recuperate PF pari alla tua Fioritura + il tuo modificatore di Saggezza. |\n| **Fiore** | Quando diventa fiore, tu e ogni alleato che vedi entro 9 m recuperate PF pari alla tua Fioritura. |\n\n### Ginkgo del Chiostro\n_Un albero più vecchio dei templi, con le foglie d\u0027oro a ventaglio, che i monaci piantavano nei chiostri per insegnare la pazienza._\n\n| Stadio | Effetto |\n|---|---|\n| **Germoglio** | Quando diventa germoglio, tu e ogni alleato che vedi entro 9 m guarite dalle condizioni Affascinato e Spaventato. |\n| **Bocciolo e fiore** | Tu e ogni alleato entro 3 m da te avete vantaggio ai tiri salvezza su Intelligenza, Saggezza e Carisma e ai tiri salvezza per mantenere la concentrazione. |\n\n### Grano Pellegrino\n_Una spiga dorata che i pellegrini si portavano in tasca, con chicchi che bastano ciascuno per un pasto. Nella Notte è l\u0027unico pane che non sa di cenere._\n\n| Stadio | Effetto |\n|---|---|\n| **Germoglio e bocciolo** | Ogni volta che cresce, tu oppure un alleato che vedi entro 9 m ottenete PF temporanei pari alla tua Fioritura + il tuo modificatore di Saggezza. |\n| **Fiore** | Quando diventa fiore, tu e ogni alleato che vedi entro 9 m ottenete PF temporanei pari alla tua Fioritura. |\n\n### Iris che Sussurra\n_Le sue foglie a spada frusciano anche senza vento, e chi si china ad ascoltarle sente i segreti di chi gli sta davanti._\n\n| Stadio | Effetto |\n|---|---|\n| **Germoglio** | Quando diventa germoglio, scegli una creatura che vedi entro 18 m: il Master ti dice la sua CA, i suoi PF attuali e massimi e i suoi punteggi di caratteristica. |\n| **Bocciolo e fiore** | Ogni volta che cresce, scegli una creatura come sopra: il Master ti dice anche le sue resistenze, immunità e vulnerabilità, e uno dei suoi tratti o delle sue azioni, a tua scelta. |\n\n### Loto del Golfo\n_Galleggiava calmo nelle lagune del Golfo, prima che Marathen salisse in cielo, e insegna a non perdere l\u0027equilibrio._\n\n| Stadio | Effetto |\n|---|---|\n| **Seme e germoglio** | La tua velocità non può essere ridotta, e hai vantaggio ai tiri salvezza per evitare le condizioni Accecato e Trattenuto o porvi fine. |\n| **Bocciolo** | Come sopra; in più hai vantaggio ai tiri salvezza su Destrezza e Intelligenza, e la tua velocità aumenta di 3 m. |\n| **Fiore** | Come il bocciolo; in più ogni alleato entro 3 m da te ha vantaggio ai tiri salvezza su Destrezza e Intelligenza. |\n\n### Magnolia di Selenar\n_L\u0027unico seme che fiorisce volentieri al buio. Si apre nelle ore più fredde, con una corolla bianca come la luna._\n\n| Stadio | Effetto |\n|---|---|\n| **Dal germoglio al fiore** | Ogni volta che cresce, scegli **freddo** o **radiante**. Fino alla scelta successiva, o finché il Seme non appassisce, i danni che tu e un alleato a tua scelta entro 9 m infliggete con armi e trucchetti diventano del tipo scelto, e ignorano la resistenza a quel tipo. |\n\n### Narciso del Placato\n_Sopravvive sui ghiacciai del nord, e Vaelharn, dicono, ne mangia i bulbi._\n\n| Stadio | Effetto |\n|---|---|\n| **Seme e germoglio** | Hai resistenza ai danni da freddo e da acido. |\n| **Bocciolo e fiore** | Tu e ogni alleato entro 3 m da te avete resistenza ai danni da freddo e da acido. |\n\n### Orchidea delle Vedove\n_Ogni parte della pianta è velenosa, e il suo profumo fa venire la nausea. Le vedove dello Stagno la tenevano sulla finestra._\n\n| Stadio | Effetto |\n|---|---|\n| **Germoglio** | Quando diventa germoglio, una creatura che vedi entro 18 m deve superare un tiro salvezza su Costituzione, altrimenti è Avvelenata. |\n| **Bocciolo** | Quando diventa bocciolo, fino a due creature che vedi entro 9 m devono superare un tiro salvezza su Costituzione, altrimenti sono Avvelenate. |\n| **Fiore** | Quando diventa fiore, ogni creatura Avvelenata che vedi entro 18 m subisce danni da veleno pari alla tua Fioritura tirata due volte. |\n\n### Peonia delle Stelle Spente\n_Fioriva nelle notti di stelle cadenti, e la sua corolla manda una luce fredda che acceca._\n\n| Stadio | Effetto |\n|---|---|\n| **Germoglio** | Quando diventa germoglio, una creatura che vedi entro 18 m deve superare un tiro salvezza su Costituzione, altrimenti è Accecata. |\n| **Bocciolo** | Quando diventa bocciolo, fino a due creature che vedi entro 9 m devono superare un tiro salvezza su Costituzione, altrimenti sono Accecate. |\n| **Fiore** | Quando diventa fiore, ogni creatura Accecata che vedi entro 18 m subisce danni radianti pari alla tua Fioritura tirata due volte. |\n\n### Protea del Monarca\n_Il fiore della prima dinastia di Carcosa, rosso e oro e duro come un\u0027armatura, che i re portavano all\u0027incoronazione._\n\n| Stadio | Effetto |\n|---|---|\n| **Seme e germoglio** | Non puoi essere Avvelenato né Spaventato. |\n| **Bocciolo** | Come sopra; in più hai vantaggio ai tiri salvezza su Costituzione e Saggezza. |\n| **Fiore** | Come il bocciolo; in più ogni alleato entro 3 m da te ha vantaggio ai tiri salvezza su Costituzione e Saggezza. |\n\n### Rosa Dentata\n_Le sue spine si intrecciano in un groviglio bellissimo, che non lascia passare nessuno._\n\n| Stadio | Effetto |\n|---|---|\n| **Germoglio** | Quando diventa germoglio, una creatura che vedi entro 18 m deve superare un tiro salvezza su Forza, altrimenti è Trattenuta dai rovi. |\n| **Bocciolo** | Quando diventa bocciolo, fino a due creature che vedi entro 9 m devono superare un tiro salvezza su Forza, altrimenti sono Trattenute dai rovi. |\n| **Fiore** | Quando diventa fiore, ogni creatura Trattenuta che vedi entro 18 m subisce danni perforanti pari alla tua Fioritura tirata due volte. |\n\nUna creatura Trattenuta dai rovi può usare un\u0027azione per effettuare una prova di Forza (Atletica) contro la CD dei Semi, e se la supera si libera.\n\n### Soffione della Tempesta\n_Sparge i suoi semi con i temporali del Golfo, e dove cade l\u0027aria sa di fulmine._\n\n| Stadio | Effetto |\n|---|---|\n| **Dal germoglio al fiore** | Ogni volta che cresce, scegli **fulmine** o **tuono**. Fino alla scelta successiva, o finché il Seme non appassisce, i danni che tu e un alleato a tua scelta entro 9 m infliggete con armi e trucchetti diventano del tipo scelto, e ignorano la resistenza a quel tipo. |\n\n### Spino della Muraglia\n_I soldati della Grande Muraglia lo piantavano sotto le feritoie. I suoi rami neri sono duri come il ferro, e le spine trasudano veleno._\n\n| Stadio | Effetto |\n|---|---|\n| **Seme e germoglio** | Quando lo pianti, scegli danni contundenti, perforanti o taglienti: hai resistenza a quel tipo di danni. |\n| **Bocciolo** | Come sopra; in più, quando una creatura entro 1,5 m da te ti colpisce con un attacco in mischia, subisce danni perforanti pari alla tua Fioritura. |\n| **Fiore** | Come il bocciolo; in più la creatura subisce anche danni da veleno pari al tuo modificatore di Saggezza. |\n\n### Strelitzia del Raggio\n_Ha i petali d\u0027argento, e cresce soltanto dove arriva l\u0027Ultimo Raggio, con foglie che bevono la luce e la trattengono._\n\n| Stadio | Effetto |\n|---|---|\n| **Seme e germoglio** | Hai resistenza ai danni da fulmine e radianti. |\n| **Bocciolo e fiore** | Tu e ogni alleato entro 3 m da te avete resistenza ai danni da fulmine e radianti. |\n\n---"}],"crea":"| | |\n|---|---|\n| **Caratteristica primaria** | Saggezza |\n| **Dado Vita** | d10 per livello da Floralista |\n| **Competenze nei tiri salvezza** | Forza e Saggezza |\n| **Competenze nelle abilità** | Natura, più due a scelta tra Addestrare Animali, Atletica, Furtività, Intuizione, Medicina, Percezione, Religione e Sopravvivenza |\n| **Competenze nelle armi** | armi semplici e armi da guerra |\n| **Competenze negli strumenti** | Kit da Erborista |\n| **Addestramento nelle armature** | armature leggere e medie, scudi |\n| **Equipaggiamento iniziale** | Scegli A o B: **(A)** armatura di cuoio borchiato, falcetto, scimitarra, arco corto, 20 frecce, Kit da Erborista, dotazione da esploratore, una giara sigillata di terra del Granaio, 7 mo; oppure **(B)** 150 mo |"},{"n":"Giurato della Luna","dv":10,"ts":["FOR","SAG"],"tab":{"h":["Livello","Bonus Comp.","Privilegi di Classe","Incantesimi preparati","1°","2°","3°","4°","5°"],"r":[["1°","+2","Incantesimi, Protettore Devoto, Volontà della Luna, Maestria nelle Armi","2","2","—","—","—","—"],["2°","+2","Stile di Combattimento, Presagio di Marea","3","2","—","—","—","—"],["3°","+2","Giuramento di Luna","4","3","—","—","—","—"],["4°","+2","Aumento dei Punteggi di Caratteristica","5","3","—","—","—","—"],["5°","+3","Attacco Extra","6","4","2","—","—","—"],["6°","+3","Veglia Devota","6","4","2","—","—","—"],["7°","+3","Privilegio del Giuramento","7","4","3","—","—","—"],["8°","+3","Aumento dei Punteggi di Caratteristica, Presagio Preciso","7","4","3","—","—","—"],["9°","+4","Sguardo d\u0027Argento","9","4","3","2","—","—"],["10°","+4","Inquisitore Severo","9","4","3","2","—","—"],["11°","+4","Tocco di Selenite, Privilegio del Giuramento","10","4","3","3","—","—"],["12°","+4","Aumento dei Punteggi di Caratteristica","10","4","3","3","—","—"],["13°","+5","Fede Rinnovata","11","4","3","3","1","—"],["14°","+5","Presagio Sicuro","11","4","3","3","1","—"],["15°","+5","Privilegio del Giuramento","12","4","3","3","2","—"],["16°","+5","Aumento dei Punteggi di Caratteristica","12","4","3","3","2","—"],["17°","+6","—","14","4","3","3","3","1"],["18°","+6","Devozione Incrollabile","14","4","3","3","3","1"],["19°","+6","Dono Epico","15","4","3","3","3","2"],["20°","+6","Il Volto di Selenar","15","4","3","3","3","2"]]},"priv":[{"lv":1,"n":"Incantesimi","md":"La luna ti presta la sua luce, e tu impari a darle forma.\n\n- **Slot incantesimo.** La tabella indica quanti slot hai per ogni livello di incantesimo. Recuperi tutti gli slot spesi al termine di un riposo lungo.\n- **Incantesimi preparati.** Prepari il numero di incantesimi indicato nella tabella, scegliendoli dalla **lista del Giurato**, e ognuno deve essere di un livello per cui hai slot. Al termine di un riposo lungo puoi cambiarne quanti vuoi.\n- **La lista del Giurato** è la lista del Paladino, più gli incantesimi della Luna fino al 5° livello che si trovano nella lista del Chierico (vedi [[Gli Incantesimi della Notte]]).\n- **Caratteristica da incantatore.** Saggezza. La CD dei tuoi incantesimi è 8 + il tuo bonus di competenza + il tuo modificatore di Saggezza, e il tuo modificatore di attacco con gli incantesimi è il tuo bonus di competenza + il tuo modificatore di Saggezza.\n- **Focus.** Puoi usare il tuo simbolo sacro come focus per gli incantesimi del Giurato."},{"lv":1,"n":"Protettore Devoto","md":"Conosci i trucchetti _resistenza_ e _taumaturgia_, che per te sono incantesimi da Giurato. Hai sempre preparato _scudo della fede_, che non conta nel numero degli incantesimi preparati, e puoi lanciarlo senza spendere uno slot un numero di volte pari al tuo bonus di competenza. Recuperi gli usi spesi al termine di un riposo lungo.\n\nMolti privilegi di questa classe si riferiscono allo _scudo della fede_ **lanciato con Protettore Devoto**: quelli lanciati con uno slot non contano."},{"lv":1,"n":"Volontà della Luna","md":"Quando la luna è nella fase della tua **luna di nascita**, lo _scudo della fede_ che lanci con Protettore Devoto non richiede concentrazione. Se non sai sotto quale luna sei nato, le Guardiane delle Maree lo leggono nei nodi della tua mano (vedi _La luna di nascita_ in [[Gli Incantesimi della Notte]])."},{"lv":1,"n":"Maestria nelle Armi","md":"Puoi usare le proprietà di maestria di due tipi di armi semplici o da guerra a tua scelta, in cui sei competente. Al termine di un riposo lungo puoi cambiare i tipi scelti."},{"lv":2,"n":"Stile di Combattimento","md":"Ottieni un talento Stile di Combattimento a tua scelta."},{"lv":2,"n":"Presagio di Marea","md":"Al termine di ogni riposo lungo leggi la marea, i nodi o il cielo, e tiri 1d8 sulla tabella delle fasi (vedi [[Le Sottoclassi della Notte]]). Ottieni il **Presagio** della fase uscita, che resta valido fino al tuo riposo lungo successivo. Ogni Presagio si può usare una volta.\n\nPuoi anche celebrare il rito di nuovo, in 10 minuti, spendendo uno slot incantesimo: tiri di nuovo il d8, e il nuovo Presagio sostituisce il vecchio, anche se lo avevi già usato.\n\n| d8 | Fase | Presagio |\n|:---:|---|---|\n| 1 | Luna nuova | **Il Buio Prestato.** Con un\u0027azione bonus diventi Invisibile fino alla fine del tuo turno successivo, o finché non attacchi, non infliggi danni o non lanci un incantesimo. |\n| 2 | Luna crescente | **La Mano Ferma.** Dopo aver visto il risultato di un tuo tiro per colpire, ma prima di sapere se colpisce, aggiungi 1d10 al tiro. |\n| 3 | Primo quarto | **Il Richiamo.** Quando una creatura che vedi entro 9 m fallisce un tiro salvezza, puoi usare la reazione per fargliela ripetere; deve usare il nuovo risultato. |\n| 4 | Gibbosa crescente | **La Lama Piena.** Quando colpisci una creatura con un\u0027arma, le infliggi 3d8 danni radianti extra. |\n| 5 | Luna piena | **La Notte Chiara.** Con un\u0027azione bonus, tu e fino a cinque creature a tua scelta entro 9 m ottenete PF temporanei pari al tuo livello da Giurato + il tuo modificatore di Saggezza. |\n| 6 | Gibbosa calante | **Il Passo Indietro.** Dopo aver visto il risultato di un tuo tiro salvezza, puoi ritirarlo e usare il nuovo risultato. |\n| 7 | Ultimo quarto | **La Risacca.** Quando tu o una creatura entro 1,5 m da te subite danni da un attacco, puoi usare la reazione per ridurli di 1d10 + il tuo livello da Giurato. |\n| 8 | Luna calante | **La Domanda.** Puoi lanciare _presagio_ senza spendere uno slot e senza componenti materiali, oppure chiedere al Master se una cosa che stai per fare ti porterà più bene o più male, e avere una risposta onesta di una parola. |"},{"lv":3,"n":"Giuramento di Luna","md":"Giuri alla fase in cui sei nato, e la fase ti dà una forma. Scegli un giuramento tra **Luna Nuova**, **Luna Crescente**, **Luna Piena** e **Luna Calante**, di solito quello della tua luna di nascita. Ottieni i privilegi del tuo giuramento al 3°, al 7°, all\u002711° e al 15° livello, e gli incantesimi del giuramento, che sono sempre preparati e non contano nel numero degli incantesimi preparati."},{"lv":4,"n":"Aumento dei Punteggi di Caratteristica","md":"Ottieni il talento Aumento dei Punteggi di Caratteristica, o un altro talento di cui soddisfi i requisiti. Ottieni di nuovo questo privilegio all\u00278°, al 12° e al 16° livello."},{"lv":5,"n":"Attacco Extra","md":"Quando effettui l\u0027azione di Attacco nel tuo turno, puoi attaccare due volte invece di una."},{"lv":6,"n":"Veglia Devota","md":"Quando tiri l\u0027iniziativa, puoi usare la reazione per lanciare _scudo della fede_ con Protettore Devoto, su di te o su una creatura entro 9 m, purché tu non sia Incapacitato. Se non ti restano usi di Protettore Devoto, puoi spendere uno slot di 1° livello o superiore per farlo comunque."},{"lv":8,"n":"Presagio Preciso","md":"Quando tiri il d8 del Presagio di Marea, tiri due dadi e scegli quale usare."},{"lv":9,"n":"Sguardo d\u0027Argento","md":"Con un\u0027azione bonus ti si accendono gli occhi di luna: per 1 minuto vedi le creature e gli oggetti Invisibili entro 9 m, e vedi nell\u0027Etereo fino alla stessa distanza. Puoi farlo un numero di volte pari al tuo modificatore di Saggezza (minimo 1), e recuperi gli usi spesi al termine di un riposo lungo."},{"lv":10,"n":"Inquisitore Severo","md":"Hai vantaggio alle prove di Saggezza (Intuizione) e di Intelligenza (Indagare), e ai tiri salvezza contro gli incantesimi di illusione e contro la condizione Affascinato. Inoltre, quando vedi una creatura entro 9 m che ha preso il volto o la forma di un altro, per magia, per un privilegio o per natura, senti il freddo della marea alle caviglie: sai che c\u0027è, anche se non sai chi è."},{"lv":11,"n":"Tocco di Selenite","md":"La prima creatura che colpisci con un\u0027arma in ognuno dei tuoi turni subisce 1d8 danni radianti extra, e se è Invisibile smette di esserlo. Inoltre deve superare un tiro salvezza su Carisma contro la CD dei tuoi incantesimi, altrimenti resta avvolta in un alone d\u0027argento fino alla fine del tuo turno successivo: finché c\u0027è l\u0027alone non può diventare Invisibile o incorporea, teletrasportarsi, lasciare il piano in cui si trova né cambiare forma."},{"lv":13,"n":"Fede Rinnovata","md":"Al termine di un riposo breve recuperi un uso speso di Protettore Devoto.
